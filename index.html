  <style>
:root {
  color-scheme: light;
  --bg: #f4f7fb;
  --surface: #ffffff;
  --text: #102a43;
  --text-2: #486581;
  --muted: #627d98;
  --line: #dfe7ef;
  --blue: #1466b8;
  --blue-2: #2878c8;
  --blue-soft: #edf6ff;
  --green: #1f8a5b;
  --green-soft: #eaf8f1;
  --red: #a32f2f;
  --red-soft: #fff0f0;
  --orange: #b85c00;
  --orange-soft: #fff6eb;
  --shadow: 0 10px 30px rgba(16,42,67,.07);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); min-height: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; left: 12px; top: -80px; z-index: 9999; padding: 10px 14px; background: #fff; border: 2px solid var(--blue); border-radius: 8px; }
.skip-link:focus { top: 12px; }
.app-header { position: sticky; top: 0; z-index: 30; background: rgba(244,247,251,.96); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(223,231,239,.85); }
.header-inner { height: 58px; width: min(100%, 720px); margin: 0 auto; padding: 0 12px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.header-inner strong { text-align: center; font-size: 16px; }
.back-button { width: 42px; height: 42px; border: 0; background: transparent; border-radius: 12px; color: var(--text); font-size: 34px; line-height: 1; cursor: pointer; }
.back-button:hover { background: #e9eff5; }
.header-spacer { width: 42px; }
.screen { width: min(100%, 720px); margin: 0 auto; padding: 22px 20px calc(48px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
.home-screen { padding-top: calc(28px + env(safe-area-inset-top)); }
.centered { min-height: calc(100vh - 58px); justify-content: center; }
.hero { display: flex; flex-direction: column; gap: 8px; margin: 0 0 2px; }
.hero h1, .page-heading h1 { margin: 0; color: var(--text); font-size: clamp(27px, 7vw, 34px); line-height: 1.25; letter-spacing: -.02em; }
.hero p, .page-heading p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.7; }
.eyebrow { margin: 0 !important; color: var(--blue-2) !important; font-size: 12px !important; font-weight: 800; letter-spacing: .14em; }
.page-heading { display: flex; flex-direction: column; gap: 7px; }
.page-heading.center { align-items: center; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 19px; box-shadow: 0 1px 0 rgba(16,42,67,.02); }
.card h2 { margin: 0 0 10px; font-size: 17px; }
.card p { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.7; }
.card p + p { margin-top: 10px; }
.section-title { margin: 0 0 16px; font-size: 18px; }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); }
.stats-grid > div { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 2px 4px; }
.stats-grid strong { color: var(--blue); font-size: clamp(21px,5vw,26px); font-weight: 800; }
.stats-grid span { color: var(--muted); font-size: 11px; line-height: 1.35; text-align: center; }
.good { color: var(--green) !important; }
.bad { color: var(--red) !important; }
.due-row { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.due-row span { color: #334e68; font-weight: 700; }
.due-row strong { color: var(--orange); font-size: 20px; }
.btn { appearance: none; width: 100%; min-height: 54px; border: 0; border-radius: 14px; padding: 12px 18px; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; transition: transform .05s ease, opacity .12s ease, background .12s ease; }
.btn:active:not(:disabled) { transform: translateY(1px); opacity: .82; }
.btn:disabled { cursor: not-allowed; opacity: .45; }
.btn small { font-size: 12px; font-weight: 500; opacity: .82; }
.btn-primary { color: #fff; background: var(--blue); }
.btn-primary small { color: #d9ecff; }
.btn-due { min-height: 70px; color: #fff; background: var(--orange); }
.btn-due small { color: #ffe3c2; }
.btn-secondary { color: var(--blue); background: #fff; border: 1px solid #a8c8e8; }
.btn-danger-outline { color: var(--red); background: #fff; border: 1px solid #dca6a6; }
.secondary-list { display: flex; flex-direction: column; gap: 10px; }
.secondary-row { appearance: none; width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 0 17px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #243b53; font-size: 15px; font-weight: 650; cursor: pointer; }
.secondary-row:active { opacity: .72; }
.row-meta { color: var(--muted); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.chevron { color: #829ab1; font-size: 27px; font-weight: 400; line-height: 1; }
.local-note, .helper { color: #7890a4 !important; font-size: 12px !important; line-height: 1.6 !important; text-align: center; }
.loading-block { min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d7e4ef; border-top-color: var(--blue); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px; text-align: center; }
.status-card h1, .status-card h2 { margin: 0 0 8px; font-size: 19px; }
.status-card p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
.status-card.error { border-color: #efc1c1; background: var(--red-soft); }
.status-card.error h1, .status-card.error h2 { color: var(--red); }
.count-card { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.muted-label { color: var(--muted); font-size: 12px; font-weight: 700; }
.big-number { color: var(--blue); font-size: 34px; }
.count-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.count-option { min-height: 90px; border: 1px solid #b8cce0; background: #fff; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
.count-option strong { color: var(--text); font-size: 24px; }
.count-option span { color: var(--muted); font-size: 12px; }
.count-option:active:not(:disabled) { background: var(--blue-soft); }
.progress-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress-header strong { font-size: 16px; }
.progress-header span { color: var(--blue); font-size: 12px; font-weight: 800; }
.progress-track { height: 7px; background: #d9e2ec; border-radius: 999px; overflow: hidden; }
.progress-track > div { height: 100%; background: #2b7bcb; border-radius: 999px; transition: width .2s ease; }
.question-card { padding: 21px; }
.question-text { color: var(--text) !important; font-size: clamp(18px, 4.8vw, 20px) !important; font-weight: 700; line-height: 1.65 !important; }
.choices { display: flex; flex-direction: column; gap: 11px; }
.choice { width: 100%; min-height: 64px; padding: 11px 14px; border: 2px solid #d9e2ec; border-radius: 14px; background: #fff; display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 12px; text-align: left; color: #243b53; cursor: pointer; }
.choice:disabled { opacity: 1; cursor: default; }
.choice:hover:not(:disabled) { background: #f8fbfe; }
.choice.selected { border-color: #2779c7; background: var(--blue-soft); }
.choice.correct { border-color: var(--green); background: var(--green-soft); }
.choice.incorrect { border-color: #c13b3b; background: var(--red-soft); }
.choice-label { width: 34px; height: 34px; border-radius: 50%; background: #e9eff5; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-2); }
.choice.selected .choice-label { background: #2779c7; color: #fff; }
.choice.correct .choice-label { background: var(--green); color: #fff; }
.choice.incorrect .choice-label { background: #c13b3b; color: #fff; }
.feedback { border-radius: 16px; border: 1px solid; padding: 19px; }
.feedback.correct { background: var(--green-soft); border-color: #a8dfc5; }
.feedback.incorrect { background: var(--red-soft); border-color: #f0b8b8; }
.feedback h2 { margin: 0 0 9px; font-size: 20px; }
.feedback.correct h2 { color: #176c47; }
.feedback.incorrect h2 { color: var(--red); }
.feedback p { color: #243b53; font-size: 14px; line-height: 1.7; }
.feedback .correct-answer { font-size: 16px; font-weight: 700; }
.feedback hr, .score-card hr { border: 0; border-top: 1px solid #c9d6e2; margin: 14px 0; }
.save-error { border: 1px solid #f0b8b8; background: var(--red-soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.save-error strong { color: var(--red); font-size: 13px; }
.save-error span { color: var(--text-2); font-size: 12px; }
.save-error .btn { margin-top: 4px; min-height: 46px; }
.accuracy { display: block; text-align: center; color: var(--blue); font-size: 56px; line-height: 1.15; margin: 3px 0; }
.score-card > .muted-label { display: block; text-align: center; }
.history-list, .schedule-list { display: flex; flex-direction: column; gap: 12px; }
.history-card h2, .schedule-card h2 { margin: 0 0 13px; font-size: 18px; }
.schedule-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.schedule-row h2 { margin: 5px 0 0; }
.schedule-count { color: var(--blue); font-size: 24px; }
.schedule-card.due { border-color: #e9bd91; background: var(--orange-soft); }
.schedule-card.due .schedule-count { color: var(--orange); }
.settings-card { display: flex; flex-direction: column; gap: 11px; }
.settings-card h2 { margin-bottom: 0; }
.info-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding-top: 4px; }
.info-row span { color: var(--muted); font-size: 14px; }
.info-row strong { color: #243b53; font-size: 14px; text-align: right; }
.stack-actions { display: flex; flex-direction: column; gap: 9px; }
.notice-card { background: #fff8e6; border-color: #e8c46c; }
.toast { position: fixed; z-index: 1000; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 18px); width: min(calc(100% - 32px), 520px); padding: 13px 16px; border-radius: 12px; background: #243b53; color: #fff; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; text-align: center; font-size: 13px; }
.toast.visible { opacity: 1; transform: translate(-50%,0); }
.toast.error { background: #8e2f2f; }
@media (min-width: 720px) {
  .screen { padding-left: 24px; padding-right: 24px; }
  .home-screen { padding-top: 36px; }
  .card { padding: 22px; }
}
@media (max-width: 370px) {
  .screen { padding-left: 14px; padding-right: 14px; }
  .stats-grid span { font-size: 10px; }
  .choice { padding-left: 10px; padding-right: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

window.ITP_QUESTIONS=[{"id":"strategy-pdca-001","questionText":"PDCAサイクルで、実行した結果を評価する段階はどれですか。","choices":["Plan","Do","Check","Act"],"correctChoiceIndex":2,"explanation":"Check（評価）で、実行結果が計画どおりかを確認します。PDCAはPlan（計画）、Do（実行）、Check（評価）、Act（改善）の順です。","category":"ストラテジ系","subcategory":"企業活動","topic":"PDCAサイクル","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"strategy-roi-002","questionText":"投資額に対して、どれだけ利益を得たかを示す指標はどれですか。","choices":["ROI","SLA","WBS","DNS"],"correctChoiceIndex":0,"explanation":"ROI（Return on Investment：投資利益率）は、投資額に対する利益の割合を示す指標です。","category":"ストラテジ系","subcategory":"企業活動","topic":"財務指標","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"strategy-swot-003","questionText":"SWOT分析で、市場の拡大など自社に有利な外部環境を表すものはどれですか。","choices":["Strength","Weakness","Opportunity","Threat"],"correctChoiceIndex":2,"explanation":"Opportunity（機会）は有利な外部環境です。SWOTはStrength（強み）、Weakness（弱み）、Opportunity（機会）、Threat（脅威）を整理する分析です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"SWOT分析","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"management-wbs-004","questionText":"プロジェクトの作業を、管理しやすい単位に細分化したものはどれですか。","choices":["SLA","WBS","KPI","BCP"],"correctChoiceIndex":1,"explanation":"WBS（Work Breakdown Structure：作業分解構成図）は、プロジェクトの作業を階層的に細分化したものです。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"WBS","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"management-sla-005","questionText":"サービス提供者と利用者の間で、サービス品質の目標を合意した文書はどれですか。","choices":["RFP","SLA","NDA","ERP"],"correctChoiceIndex":1,"explanation":"SLA（Service Level Agreement：サービスレベル合意書）は、稼働率や応答時間などのサービス品質を合意する文書です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"SLA","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"technology-auth-006","questionText":"パスワード入力後にICカードの提示も求める認証について、適切な説明はどれですか。","choices":["同じ知識要素を二回確認している","知識要素と所持要素を組み合わせている","生体要素だけを二種類組み合わせている","認証要素を使わず端末名だけ確認している"],"correctChoiceIndex":1,"explanation":"パスワードは知識要素、ICカードは所持要素です。異なる種類の認証要素を組み合わせるため、二要素認証に該当します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"認証","difficulty":2,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"technology-db-007","questionText":"関係データベースの表で、各行を一意に識別するために設定するものはどれですか。","choices":["外部キー","主キー","インデックス","ビュー"],"correctChoiceIndex":1,"explanation":"主キーは、表の各行を重複なく一意に識別するための列または列の組合せです。","category":"テクノロジ系","subcategory":"データベース","topic":"主キー","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"technology-memory-008","questionText":"電源を切ると記憶内容が失われる、揮発性の記憶装置はどれですか。","choices":["SSD","HDD","RAM","DVD"],"correctChoiceIndex":2,"explanation":"RAM（Random Access Memory：ランダムアクセスメモリ）は揮発性で、電源を切ると内容が失われます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"メモリ","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"technology-http-009","questionText":"Webサーバから「指定したページが見つからない」と返されたときのHTTPステータスコードはどれですか。","choices":["200","301","404","500"],"correctChoiceIndex":2,"explanation":"404はNot Found（見つからない）を表します。HTTPはHypertext Transfer Protocolの略です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTP","difficulty":1,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"technology-backup-010","questionText":"バックアップの「3-2-1ルール」の説明として適切なものはどれですか。","choices":["3日に1回、2台の端末へ保存する","データを3個持ち、2種類の媒体を使い、1個を別の場所に置く","3人で確認し、2回暗号化し、1年間保存する","3世代を、2年ごとに、1台の装置へ保存する"],"correctChoiceIndex":1,"explanation":"3-2-1ルールは、データを3個持ち、2種類の記録媒体を使い、そのうち1個を別の場所に保管する考え方です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"バックアップ","difficulty":2,"source":"独自作成","applicableYear":2026,"createdAt":"2026-08-03T00:00:00+09:00","updatedAt":"2026-08-03T00:00:00+09:00"},{"id":"strategy-mission-011","questionText":"企業が経営で重視する価値観や行動の基本方針を示すものはどれですか。","choices":["経営理念","作業手順書","監査調書","障害報告書"],"correctChoiceIndex":0,"explanation":"経営理念は、企業が重視する価値観や経営上の基本方針を示します。社会で果たす役割を簡潔に示すミッションとは、設問で着目する点が異なります。","category":"ストラテジ系","subcategory":"企業活動","topic":"経営理念","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-kgi-012","questionText":"組織の最終目標の達成度を測る指標はどれですか。","choices":["KPI","RTO","SLA","KGI"],"correctChoiceIndex":3,"explanation":"KGI（Key Goal Indicator：重要目標達成指標）は、最終目標の達成度を測ります。KPIは目標へ至る途中の重要な活動を測る指標です。","category":"ストラテジ系","subcategory":"企業活動","topic":"KGI","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-kpi-013","questionText":"売上目標の達成に向けて、商談件数を毎月測定する場合の商談件数に当たるものはどれですか。","choices":["KPI","CSR","KGI","BCP"],"correctChoiceIndex":0,"explanation":"KPI（Key Performance Indicator：重要業績評価指標）は、最終目標へ向かう過程を測る指標です。商談件数は売上という結果に先行する活動指標として利用できます。","category":"ストラテジ系","subcategory":"企業活動","topic":"KPI","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-organization-014","questionText":"職能別組織の特徴として最も適切なものはどれですか。","choices":["製品ごとに独立採算で運営する","案件ごとに外部企業だけで構成する","地域ごとに全機能を重複配置する","営業や製造など専門機能ごとに部門を編成する"],"correctChoiceIndex":3,"explanation":"職能別組織は、営業・製造・経理など同じ専門機能をまとめて編成します。専門性を高めやすい一方、部門間の調整が課題になることがあります。","category":"ストラテジ系","subcategory":"企業活動","topic":"経営組織","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-ppm-015","questionText":"PPMで、市場成長率も市場占有率も高い事業を何と呼びますか。","choices":["花形","金のなる木","問題児","負け犬"],"correctChoiceIndex":0,"explanation":"PPM（Product Portfolio Management）では、成長率と占有率がともに高い事業を「花形」と呼びます。成長投資が必要ですが、将来の収益源として期待されます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PPM","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-csr-016","questionText":"企業が利益だけでなく、環境や地域社会などへの責任も果たす考え方はどれですか。","choices":["BPR","SCM","RFP","CSR"],"correctChoiceIndex":3,"explanation":"CSR（Corporate Social Responsibility：企業の社会的責任）は、企業が社会や環境へ配慮して責任ある行動を取る考え方です。法令順守だけに限定されません。","category":"ストラテジ系","subcategory":"企業活動","topic":"CSR","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-compliance-017","questionText":"企業のコンプライアンス活動として最も適切なものはどれですか。","choices":["利益が出る場合だけ規則を守る","競合企業の秘密を無断で利用する","法令や社内規程を守る仕組みを整える","事故情報を社外にも社内にも隠す"],"correctChoiceIndex":2,"explanation":"コンプライアンスは、法令や社会規範、社内規程を守ることです。教育や相談窓口、違反時の報告手順などを整えることが重要です。","category":"ストラテジ系","subcategory":"法務","topic":"コンプライアンス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-governance-018","questionText":"コーポレートガバナンスの目的として最も適切なものはどれですか。","choices":["全社員の業務を外部委託する","情報システムを停止する","競合他社と価格を相談する","経営を監督し、健全で透明な企業運営を促す"],"correctChoiceIndex":3,"explanation":"コーポレートガバナンスは、経営者を適切に監督し、健全で透明な企業運営を実現する仕組みです。株主などの利害関係者を保護する役割もあります。","category":"ストラテジ系","subcategory":"企業活動","topic":"コーポレートガバナンス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-bep-019","questionText":"売上高と総費用が等しくなり、利益が0となる売上高を何と呼びますか。","choices":["損益分岐点売上高","限界利益","固定費","営業外収益"],"correctChoiceIndex":0,"explanation":"損益分岐点売上高は、売上高と固定費・変動費の合計が等しくなる点です。これを超える売上が利益の発生につながります。","category":"ストラテジ系","subcategory":"企業活動","topic":"損益分岐点","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-variable-cost-020","questionText":"製品の生産量におおむね比例して増減する費用はどれですか。","choices":["工場の固定資産税","定額の保守料","本社建物の賃料","材料費"],"correctChoiceIndex":3,"explanation":"材料費は生産量が増えるほど必要量も増えるため、代表的な変動費です。賃料など、生産量にかかわらず一定期間発生する費用は固定費です。","category":"ストラテジ系","subcategory":"企業活動","topic":"固定費と変動費","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-balance-sheet-021","questionText":"ある時点の企業の資産、負債、純資産を示す財務諸表はどれですか。","choices":["損益計算書","キャッシュフロー計算書","貸借対照表","製造原価報告書"],"correctChoiceIndex":2,"explanation":"貸借対照表は、決算日など一定時点の財政状態を示します。資産は負債と純資産の合計に一致します。","category":"ストラテジ系","subcategory":"企業活動","topic":"財務諸表","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-profit-loss-022","questionText":"一定期間の収益と費用から利益を示す財務諸表はどれですか。","choices":["貸借対照表","株主資本等変動計算書","キャッシュフロー計算書","損益計算書"],"correctChoiceIndex":3,"explanation":"損益計算書は、一定期間に発生した収益と費用、その差額である利益を示します。貸借対照表は一定時点の財政状態を示します。","category":"ストラテジ系","subcategory":"企業活動","topic":"財務諸表","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-copyright-023","questionText":"著作権について正しい説明はどれですか。","choices":["著作物を創作した時点で原則として発生する","必ず特許庁への登録後に発生する","アイデアそのものを永久に保護する","法人が作った著作物には発生しない"],"correctChoiceIndex":0,"explanation":"著作権は、著作物を創作した時点で原則として自動的に発生します。保護対象は創作的な表現であり、単なるアイデアそのものではありません。","category":"ストラテジ系","subcategory":"法務","topic":"著作権","difficulty":2,"source":"文化庁「著作権制度に関する情報」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-patent-024","questionText":"自然法則を利用した技術的思想の創作を保護する権利はどれですか。","choices":["商標権","特許権","著作権","意匠権"],"correctChoiceIndex":1,"explanation":"特許権は、一定の要件を満たす発明を保護する産業財産権です。権利を得るには特許庁へ出願し、審査を受ける必要があります。","category":"ストラテジ系","subcategory":"法務","topic":"特許権","difficulty":2,"source":"特許庁「知的財産権について」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-trademark-025","questionText":"商品やサービスを他社のものと区別する名称やマークを保護する権利はどれですか。","choices":["特許権","実用新案権","商標権","著作隣接権"],"correctChoiceIndex":2,"explanation":"商標権は、商品やサービスの出所を示す名称、図形、マークなどを保護します。利用者が提供元を識別できる信用を守る役割があります。","category":"ストラテジ系","subcategory":"法務","topic":"商標権","difficulty":2,"source":"特許庁「商標制度の概要」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-personal-info-026","questionText":"個人情報保護法上の個人情報に該当するものはどれですか。","choices":["完全に匿名化され復元できない統計値","会社全体の売上高","公開済みの気象観測値","氏名と所属が記載され個人を識別できる名簿"],"correctChoiceIndex":3,"explanation":"氏名などにより生存する個人を識別できる情報は個人情報に該当します。公開情報であっても、個人を識別できれば個人情報になり得ます。","category":"ストラテジ系","subcategory":"法務","topic":"個人情報保護","difficulty":3,"source":"個人情報保護委員会「個人情報保護法」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-open-source-027","questionText":"オープンソースソフトウェアを利用するときに必要な対応はどれですか。","choices":["利用するライセンス条件を確認して守る","必ず無条件で再配布できると考える","著作権表示をすべて削除する","商用利用は法律で一律禁止と考える"],"correctChoiceIndex":0,"explanation":"オープンソースでも著作権は存在し、利用・改変・再配布の条件はライセンスごとに異なります。商用利用の可否や表示義務などを確認する必要があります。","category":"ストラテジ系","subcategory":"法務","topic":"ソフトウェアライセンス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-unfair-competition-028","questionText":"不正競争防止の観点から問題となる行為はどれですか。","choices":["自社で独自に技術を開発する","不正に取得した営業秘密を利用する","公開情報から市場を分析する","許諾を得て商標を使用する"],"correctChoiceIndex":1,"explanation":"不正な手段で取得した営業秘密の使用や開示は、不正競争防止法の対象になり得ます。営業秘密には秘密管理性、有用性、非公知性が求められます。","category":"ストラテジ系","subcategory":"法務","topic":"不正競争防止","difficulty":3,"source":"経済産業省「営業秘密管理指針」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-differentiation-029","questionText":"競合他社にない価値を提供し、価格以外の魅力で選ばれることを目指す戦略はどれですか。","choices":["撤退戦略","追随戦略","差別化戦略","無関連多角化"],"correctChoiceIndex":2,"explanation":"差別化戦略は、品質、機能、ブランド、サービスなど独自の価値で競争優位を築きます。単に価格を下げる戦略とは異なります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"差別化戦略","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-cost-leadership-030","questionText":"効率化や規模の経済によって低コスト体質を築き、価格競争力を高める戦略はどれですか。","choices":["集中戦略","差別化戦略","成長戦略","コストリーダーシップ戦略"],"correctChoiceIndex":3,"explanation":"コストリーダーシップ戦略は、競合より低いコストで製品やサービスを提供できる体制を目指します。品質を無視することを意味するわけではありません。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"コストリーダーシップ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-crm-031","questionText":"顧客の購買履歴や問合せ履歴を活用し、長期的な関係強化を図る取組はどれですか。","choices":["CRM","SCM","ERP","CAD"],"correctChoiceIndex":0,"explanation":"CRM（Customer Relationship Management：顧客関係管理）は、顧客情報を一元的に活用して関係を強化する考え方です。顧客満足や継続利用の向上を目指します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"CRM","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-scm-032","questionText":"原材料の調達から生産、物流、販売までを連携して全体最適化する考え方はどれですか。","choices":["CRM","SCM","BPR","SFA"],"correctChoiceIndex":1,"explanation":"SCM（Supply Chain Management：供給連鎖管理）は、供給網全体の情報や物の流れを最適化します。在庫削減や納期短縮などを目指します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"SCM","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-erp-033","questionText":"会計、人事、生産、販売など企業の基幹業務を統合的に管理する仕組みはどれですか。","choices":["RPA","CRM","ERP","BIOS"],"correctChoiceIndex":2,"explanation":"ERP（Enterprise Resource Planning：企業資源計画）は、部門ごとの基幹情報を統合して経営資源を管理します。情報の重複を減らし、全社的な意思決定を支援します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ERP","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-ec-034","questionText":"企業が一般消費者へインターネット上で商品を販売する取引形態はどれですか。","choices":["BtoB","CtoC","GtoB","BtoC"],"correctChoiceIndex":3,"explanation":"BtoC（Business to Consumer）は、企業から一般消費者への取引です。オンラインショップは代表的なBtoCの電子商取引です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"EC","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-fintech-035","questionText":"スマートフォンによる送金やAIを使った資産運用など、金融とITを組み合わせたサービスを何と呼びますか。","choices":["FinTech","GovTech","EdTech","AdTech"],"correctChoiceIndex":0,"explanation":"FinTechはFinance（金融）とTechnology（技術）を組み合わせた言葉です。決済、融資、送金、資産運用などでITを活用します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"FinTech","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-dx-036","questionText":"DXの説明として最も適切なものはどれですか。","choices":["紙を単にPDF化することだけを指す","デジタル技術で業務や組織、提供価値を変革する","すべての既存システムを直ちに廃止する","IT部門だけで端末台数を増やす"],"correctChoiceIndex":1,"explanation":"DX（Digital Transformation）は、デジタル技術とデータを使って業務やビジネスモデル、組織文化まで変革する取組です。単なる電子化だけではありません。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"DX","difficulty":3,"source":"経済産業省「デジタルガバナンス・コード」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-rpa-037","questionText":"定型的なパソコン操作をソフトウェアロボットで自動化する仕組みはどれですか。","choices":["ERP","CAD","RPA","M2M"],"correctChoiceIndex":2,"explanation":"RPA（Robotic Process Automation）は、入力や転記など定型的な画面操作を自動化します。判断が複雑な業務には別の設計や人の確認が必要です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"RPA","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-ai-use-038","questionText":"業務で生成AIを利用する際の対応として最も適切なものはどれですか。","choices":["出力を常に正しい事実として採用する","機密情報を無条件で入力する","利用規程を設けず個人判断だけに任せる","出力を検証し、入力情報と権利侵害のリスクを管理する"],"correctChoiceIndex":3,"explanation":"生成AIの出力には誤りや権利上の問題が含まれる可能性があります。人による検証、機密情報の管理、利用ルールの整備が必要です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"AI利用","difficulty":3,"source":"総務省・経済産業省「AI事業者ガイドライン」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-bpr-039","questionText":"既存業務を根本から見直し、業務プロセスを抜本的に再設計する取組はどれですか。","choices":["BPR","BCP","BSC","BOM"],"correctChoiceIndex":0,"explanation":"BPR（Business Process Re-engineering）は、業務プロセスを根本から再設計して大幅な改善を目指します。既存手順の小さな修正だけに限定されません。","category":"ストラテジ系","subcategory":"システム戦略","topic":"BPR","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-requirements-040","questionText":"システム化の要件定義で最初に明確にすべきものはどれですか。","choices":["特定製品の画面色","解決したい業務課題と必要な機能・条件","開発者個人の好み","運用後に廃棄する端末の型番だけ"],"correctChoiceIndex":1,"explanation":"要件定義では、業務上の目的や課題、システムに求める機能・性能・制約を明確にします。特定の実装方法を先に決めると目的を見失うことがあります。","category":"ストラテジ系","subcategory":"システム企画","topic":"要件定義","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-rfp-041","questionText":"発注者が候補となる供給者へ、提案内容や見積りの提示を求める文書はどれですか。","choices":["SLA","NDA","RFP","WBS"],"correctChoiceIndex":2,"explanation":"RFP（Request for Proposal：提案依頼書）は、発注者が要件を示して供給者へ提案を求める文書です。複数提案を共通の条件で比較するのに役立ちます。","category":"ストラテジ系","subcategory":"システム企画","topic":"RFP","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-procurement-042","questionText":"情報システム調達で、複数ベンダの提案を公平に比較する方法として適切なものはどれですか。","choices":["担当者の印象だけで決める","最初の提案だけを無条件で採用する","評価基準を契約後に変更する","価格・機能・体制などの評価基準を事前に定める"],"correctChoiceIndex":3,"explanation":"提案評価では、価格、機能、品質、実績、保守体制などの基準と配点を事前に定めます。共通基準で比較することで調達の透明性を高められます。","category":"ストラテジ系","subcategory":"システム企画","topic":"調達","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-waterfall-043","questionText":"要件定義、設計、実装、テストを原則として順番に進める開発モデルはどれですか。","choices":["ウォーターフォールモデル","スパイラルモデル","プロトタイピングモデル","DevOps"],"correctChoiceIndex":0,"explanation":"ウォーターフォールモデルは、工程を上流から下流へ順番に進めます。要件が安定した案件で計画を立てやすい一方、後工程での変更コストが高くなりやすい特徴があります。","category":"マネジメント系","subcategory":"システム開発技術","topic":"ウォーターフォール","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-agile-044","questionText":"短い期間で動くソフトウェアを繰り返し作り、利用者の反応を取り入れる開発方法はどれですか。","choices":["一括移行","アジャイル開発","並行運用","外部設計"],"correctChoiceIndex":1,"explanation":"アジャイル開発は、短い反復で開発と確認を繰り返し、変化へ適応します。計画や文書が不要という意味ではありません。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"アジャイル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-scrum-045","questionText":"スクラムで、開発する機能や改善項目を優先順位付きで並べた一覧はどれですか。","choices":["リスク登録簿","ガントチャート","プロダクトバックログ","監査調書"],"correctChoiceIndex":2,"explanation":"プロダクトバックログは、製品に必要な機能や改善を優先順位付きで管理する一覧です。プロダクトオーナーが価値を考慮して内容を整えます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"スクラム","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-unit-test-046","questionText":"プログラムを構成する関数やモジュールなどの小さな単位を対象に行うテストはどれですか。","choices":["受入テスト","システムテスト","運用テスト","単体テスト"],"correctChoiceIndex":3,"explanation":"単体テストは、関数やモジュールなど個々のプログラム単位が設計どおり動くか確認します。その後、結合テストなどで単位間の連携を確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"単体テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-integration-test-047","questionText":"複数のプログラムやサブシステムを接続し、インタフェースを確認するテストはどれですか。","choices":["結合テスト","単体テスト","回帰分析","ベンチマーキング"],"correctChoiceIndex":0,"explanation":"結合テストは、複数のモジュールを接続したときのデータ受渡しや呼出し関係を確認します。個々のモジュール内部だけを確認する単体テストとは対象が異なります。","category":"マネジメント系","subcategory":"システム開発技術","topic":"結合テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-acceptance-test-048","questionText":"発注者や利用部門が、システムが業務要件を満たすか確認するテストはどれですか。","choices":["単体テスト","受入テスト","静的解析","故障診断"],"correctChoiceIndex":1,"explanation":"受入テストは、発注者や利用者側が要求した業務を実行できるか確認します。開発者だけの観点ではなく、受入条件に基づいて判定します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"受入テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-regression-test-049","questionText":"プログラム修正によって、以前正常だった機能へ悪影響がないか確認するテストはどれですか。","choices":["負荷テスト","運用テスト","回帰テスト","侵入テスト"],"correctChoiceIndex":2,"explanation":"回帰テストは、変更後に既存機能が壊れていないことを再確認します。修正箇所だけでなく、影響を受ける周辺機能も対象にします。","category":"マネジメント系","subcategory":"システム開発技術","topic":"回帰テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-maintenance-050","questionText":"稼働中のシステムで、法改正に合わせて処理を変更する活動はどれですか。","choices":["企画","要件定義","導入教育","保守"],"correctChoiceIndex":3,"explanation":"保守は、稼働後のシステムに対する障害修正、環境変化への適応、機能改善などを行います。法改正対応は適応保守の例です。","category":"マネジメント系","subcategory":"システム開発技術","topic":"保守","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-qcd-051","questionText":"プロジェクト管理で用いるQCDのQが表すものはどれですか。","choices":["Quality","Quantity","Question","Queue"],"correctChoiceIndex":0,"explanation":"QCDはQuality（品質）、Cost（コスト）、Delivery（納期）の略です。三つの制約は互いに影響するため、バランスを管理します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"QCD","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-scope-052","questionText":"プロジェクトで実施する作業と成果物の範囲を表すものはどれですか。","choices":["サービスレベル","スコープ","可用性","機密性"],"correctChoiceIndex":1,"explanation":"スコープは、プロジェクトで何を実施し、何を成果物として作るかの範囲です。無管理な追加は納期やコストへ影響します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"スコープ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-gantt-053","questionText":"作業の開始・終了時期や進捗を横棒で時系列に表す図はどれですか。","choices":["特性要因図","パレート図","ガントチャート","散布図"],"correctChoiceIndex":2,"explanation":"ガントチャートは、各作業の期間と進捗を横棒で表します。全体のスケジュールや作業の重なりを視覚的に確認できます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ガントチャート","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-risk-054","questionText":"プロジェクトリスクへの対応として、保険へ加入して損失負担を第三者へ移す方法はどれですか。","choices":["回避","低減","受容","転嫁"],"correctChoiceIndex":3,"explanation":"リスク転嫁は、保険や契約などによって影響の負担を第三者へ移します。リスクそのものが消滅するとは限りません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク対応","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-critical-path-055","questionText":"プロジェクト全体の最短完了期間を決める、余裕時間がない作業経路はどれですか。","choices":["クリティカルパス","代替パス","承認経路","監査証跡"],"correctChoiceIndex":0,"explanation":"クリティカルパス上の作業が遅れると、原則としてプロジェクト全体の完了も遅れます。優先して進捗を監視する必要があります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"クリティカルパス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-incident-056","questionText":"ITサービスの停止をできるだけ早く復旧し、利用者への影響を小さくする活動はどれですか。","choices":["問題管理","インシデント管理","構成管理","監査計画"],"correctChoiceIndex":1,"explanation":"インシデント管理は、サービスの中断や品質低下から迅速に通常状態へ戻すことを重視します。根本原因の除去は問題管理の主目的です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-problem-057","questionText":"繰り返し発生する障害の根本原因を調査し、再発防止を図る活動はどれですか。","choices":["容量管理","サービス要求管理","問題管理","可用性測定"],"correctChoiceIndex":2,"explanation":"問題管理は、インシデントの根本原因を分析して恒久対策や再発防止を行います。目先の復旧を優先するインシデント管理と連携します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"問題管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-change-058","questionText":"本番システムへの変更を安全に行うための対応として最も適切なものはどれですか。","choices":["承認なしで即時反映する","変更履歴を残さない","失敗時の戻し手順を用意しない","影響を評価し、承認・実施・確認の手順を管理する"],"correctChoiceIndex":3,"explanation":"変更管理では、変更の必要性、影響、リスクを評価し、承認された計画に従って実施します。切戻しと実施後の確認も重要です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"変更管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-availability-059","questionText":"サービス提供時間100時間のうち、利用可能だった時間が99時間のときの可用性はどれですか。","choices":["99%","100%","1%","0.99%"],"correctChoiceIndex":0,"explanation":"可用性は、利用可能時間をサービス提供時間で割って求めます。99÷100×100なので99%です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"可用性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"management-service-desk-060","questionText":"利用者からの問合せや障害連絡を一元的に受け付ける窓口はどれですか。","choices":["監査部門","サービスデスク","取締役会","開発委員会"],"correctChoiceIndex":1,"explanation":"サービスデスクは、ITサービス利用者との単一窓口として問合せや障害申告を受け付けます。対応状況の連絡や適切な担当への引継ぎも行います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービスデスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-firewall-061","questionText":"ネットワークの境界で、あらかじめ定めた規則に従って通信を許可または遮断する仕組みはどれですか。","choices":["DNS","DHCP","ファイアウォール","デフラグ"],"correctChoiceIndex":2,"explanation":"ファイアウォールは、送信元や宛先、ポート番号などの規則に基づいて通信を制御します。許可されていない通信を遮断する境界防御の一つです。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ファイアウォール","difficulty":2,"source":"NIST SP 800-41 Rev.1","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-ips-062","questionText":"不正な通信を検知するだけでなく、自動的に遮断する機能を持つ仕組みはどれですか。","choices":["UPS","DNS","IDS","IPS"],"correctChoiceIndex":3,"explanation":"IPS（Intrusion Prevention System：侵入防止システム）は、不正通信を検知して遮断します。IDSはIntrusion Detection Systemの略で、主に検知と通知を行います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"IDSとIPS","difficulty":3,"source":"NIST SP 800-94","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-binary-063","questionText":"2進数の1010を10進数で表した値はどれですか。","choices":["10","8","12","1010"],"correctChoiceIndex":0,"explanation":"1010₂は、1×8＋0×4＋1×2＋0×1で10です。各桁の重みは右から1、2、4、8と2倍になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"2進数","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-hex-064","questionText":"16進数のFを10進数で表した値はどれですか。","choices":["14","15","16","17"],"correctChoiceIndex":1,"explanation":"16進数では0～9に続いてA～Fを使い、Fは10進数の15を表します。1桁で0から15までを表現できます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"16進数","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-and-065","questionText":"論理演算で、二つの入力がともに真のときだけ結果が真になる演算はどれですか。","choices":["OR","NOT","AND","XOR"],"correctChoiceIndex":2,"explanation":"AND（論理積）は、全ての入力が真のときだけ真になります。ORは少なくとも一つが真なら真になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"AND","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-xor-066","questionText":"二つの入力が異なるときだけ結果が真になる論理演算はどれですか。","choices":["NAND","OR","NOT","XOR"],"correctChoiceIndex":3,"explanation":"XOR（排他的論理和）は、二つの入力が互いに異なるとき真になります。両方が真、または両方が偽のときは偽です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"XOR","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-bit-byte-067","questionText":"1バイトは通常何ビットですか。","choices":["8ビット","2ビット","10ビット","16ビット"],"correctChoiceIndex":0,"explanation":"1バイトは通常8ビットです。1ビットは0または1のいずれかを表す情報の最小単位です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"情報量","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-stack-068","questionText":"最後に格納したデータを最初に取り出すLIFO方式のデータ構造はどれですか。","choices":["キュー","スタック","木","ハッシュ表"],"correctChoiceIndex":1,"explanation":"スタックはLIFO（Last In, First Out：後入れ先出し）方式です。関数呼出しの管理や元に戻す処理などで利用されます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"スタック","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-queue-069","questionText":"最初に格納したデータを最初に取り出すFIFO方式のデータ構造はどれですか。","choices":["スタック","配列","キュー","二分木"],"correctChoiceIndex":2,"explanation":"キューはFIFO（First In, First Out：先入れ先出し）方式です。到着順に処理する待ち行列などに向きます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"キュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-binary-search-070","questionText":"整列済みデータの中央要素と比較し、探索範囲を半分ずつ狭める探索方法はどれですか。","choices":["線形探索","幅優先探索","深さ優先探索","二分探索"],"correctChoiceIndex":3,"explanation":"二分探索は、整列済みデータの中央と比較して探索範囲を半分にします。データが未整列のままでは基本的に利用できません。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"二分探索","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-cpu-071","questionText":"命令を解釈して演算や装置の制御を行うコンピュータの主要装置はどれですか。","choices":["CPU","SSD","ディスプレイ","キーボード"],"correctChoiceIndex":0,"explanation":"CPU（Central Processing Unit：中央処理装置）は、命令を実行し、演算や各装置の制御を担います。コンピュータの処理性能に関わる主要部品です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"CPU","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-cache-072","questionText":"CPUと主記憶の速度差を埋めるために使う高速な記憶装置はどれですか。","choices":["磁気テープ","キャッシュメモリ","光学ディスク","外付けHDD"],"correctChoiceIndex":1,"explanation":"キャッシュメモリは、CPUがよく使う命令やデータを一時的に保持する高速な記憶装置です。主記憶へのアクセス回数を減らして処理を高速化します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"キャッシュメモリ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-ssd-073","questionText":"SSDの一般的な特徴として適切なものはどれですか。","choices":["磁気ヘッドで読み書きする","必ずHDDより容量単価が低い","半導体メモリを使い、機械的な可動部がない","電源を切ると必ず全データが消える"],"correctChoiceIndex":2,"explanation":"SSD（Solid State Drive）は半導体メモリを使い、HDDのような回転部品を持ちません。一般に高速で衝撃に強い一方、製品ごとに寿命や価格が異なります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"SSD","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-os-074","questionText":"OSの役割として最も適切なものはどれですか。","choices":["Webページの構造だけを記述する","データベースの表定義だけを管理する","ドメイン名をIPアドレスへ変換する","CPUやメモリなどの資源を管理し、アプリの実行基盤を提供する"],"correctChoiceIndex":3,"explanation":"OS（Operating System）は、CPU、メモリ、ファイル、入出力装置などを管理します。アプリケーションが共通して利用できる基本機能も提供します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"OS","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-virtualization-075","questionText":"1台の物理サーバ上で、複数の独立した仮想サーバを動かす技術はどれですか。","choices":["仮想化","暗号化","正規化","多重化印刷"],"correctChoiceIndex":0,"explanation":"サーバ仮想化は、物理資源を論理的に分割し複数の仮想マシンを動作させます。資源利用率の向上や環境の分離に役立ちます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"仮想化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-cloud-076","questionText":"インターネット経由で必要に応じて計算資源やサービスを利用する形態はどれですか。","choices":["オンプレミス専用運用","クラウドコンピューティング","スタンドアロン処理","オフライン印刷"],"correctChoiceIndex":1,"explanation":"クラウドコンピューティングは、ネットワーク経由でサーバ、ストレージ、アプリなどを必要に応じて利用します。利用量に応じた拡張や課金が行われる場合があります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"クラウド","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-performance-077","questionText":"1秒間に処理できる取引件数など、単位時間当たりの処理能力を表すものはどれですか。","choices":["レスポンスタイム","可用性","スループット","故障率"],"correctChoiceIndex":2,"explanation":"スループットは、単位時間当たりに処理できる仕事量を表します。レスポンスタイムは、要求してから応答が返るまでの時間です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"性能評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-dbms-078","questionText":"データベースの定義、格納、検索、更新、権限管理などを行うソフトウェアはどれですか。","choices":["HTML","DNS","CPU","DBMS"],"correctChoiceIndex":3,"explanation":"DBMS（Database Management System：データベース管理システム）は、データを一貫して管理する機能を提供します。複数利用者からのアクセス制御や障害回復も担います。","category":"テクノロジ系","subcategory":"データベース","topic":"DBMS","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-foreign-key-079","questionText":"別の表の主キーを参照し、表同士の関係を表す列はどれですか。","choices":["外部キー","候補キー","連番","索引"],"correctChoiceIndex":0,"explanation":"外部キーは、別表の主キーなどを参照して表同士を関連付けます。参照整合性によって存在しない値への参照を防げます。","category":"テクノロジ系","subcategory":"データベース","topic":"外部キー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-normalization-080","questionText":"関係データベースの正規化を行う主な目的はどれですか。","choices":["必ず全表を一つにまとめる","データの重複や更新時の矛盾を減らす","全ての検索を禁止する","画像だけを保存可能にする"],"correctChoiceIndex":1,"explanation":"正規化は、データの重複を整理し、追加・更新・削除時の不整合を防ぎやすくします。ただし性能要件に応じて設計上の判断も必要です。","category":"テクノロジ系","subcategory":"データベース","topic":"正規化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-sql-select-081","questionText":"SQLで表からデータを検索する命令はどれですか。","choices":["INSERT","UPDATE","SELECT","DELETE"],"correctChoiceIndex":2,"explanation":"SELECT文は、表から条件に合う行や列を検索します。INSERTは追加、UPDATEは更新、DELETEは削除に使います。","category":"テクノロジ系","subcategory":"データベース","topic":"SELECT","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-sql-update-082","questionText":"SQLで既存行の列値を変更する命令はどれですか。","choices":["SELECT","INSERT","CREATE","UPDATE"],"correctChoiceIndex":3,"explanation":"UPDATE文は既存行の値を変更します。WHERE句を付けないと対象表の全行を更新する場合があるため注意が必要です。","category":"テクノロジ系","subcategory":"データベース","topic":"UPDATE","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-transaction-083","questionText":"複数のデータベース処理を、全て成功するか全て取り消す一つの単位として扱うものはどれですか。","choices":["トランザクション","インデックス","ビュー","スキーマ"],"correctChoiceIndex":0,"explanation":"トランザクションは、関連する処理を一まとまりとして扱います。途中で失敗した場合にロールバックすれば、一部だけ反映される不整合を防げます。","category":"テクノロジ系","subcategory":"データベース","topic":"トランザクション","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-lock-084","questionText":"複数利用者が同じデータを同時更新して矛盾することを防ぐ制御はどれですか。","choices":["圧縮制御","排他制御","経路制御","電源制御"],"correctChoiceIndex":1,"explanation":"排他制御は、同じデータへの競合するアクセスをロックなどで調整します。更新の消失や不整合を防ぎ、データの一貫性を保ちます。","category":"テクノロジ系","subcategory":"データベース","topic":"排他制御","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-lan-wan-085","questionText":"離れた都市の拠点同士を通信事業者の回線で接続するネットワークは一般にどれですか。","choices":["PAN","LAN","WAN","SAN"],"correctChoiceIndex":2,"explanation":"WAN（Wide Area Network）は、地理的に離れた拠点を結ぶ広域ネットワークです。LANは建物内など比較的狭い範囲で使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"WAN","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-tcp-ip-086","questionText":"インターネットで標準的に利用されるプロトコル群はどれですか。","choices":["HTML","USB","SQL","TCP/IP"],"correctChoiceIndex":3,"explanation":"TCP/IPは、インターネット通信の基盤となるプロトコル群です。IPが宛先までの配送を担い、TCPは信頼性のある通信を提供します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"TCP/IP","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-dns-087","questionText":"ドメイン名に対応するIPアドレスを調べる仕組みはどれですか。","choices":["DNS","DHCP","FTP","SMTP"],"correctChoiceIndex":0,"explanation":"DNS（Domain Name System）は、ドメイン名とIPアドレスを対応付けます。利用者は数値のIPアドレスを直接覚えなくてもサービスへ接続できます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DNS","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-dhcp-088","questionText":"端末へIPアドレスなどのネットワーク設定を自動的に割り当てるプロトコルはどれですか。","choices":["HTTP","DHCP","DNS","SNMP"],"correctChoiceIndex":1,"explanation":"DHCP（Dynamic Host Configuration Protocol）は、IPアドレス、デフォルトゲートウェイ、DNSサーバなどを端末へ自動配布します。手作業による設定ミスを減らせます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DHCP","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-https-089","questionText":"HTTPSがHTTPに追加する主な機能はどれですか。","choices":["画面の解像度調整","IPアドレスの自動配布","TLSによる通信の暗号化・完全性保護とサーバ認証","ファイルの自動削除"],"correctChoiceIndex":2,"explanation":"HTTP（Hypertext Transfer Protocol）はWeb通信の基本的なプロトコルです。HTTPS（Hypertext Transfer Protocol Secure）はHTTPをTLS（Transport Layer Security）で保護し、サーバ認証と、通信内容の機密性・完全性を提供します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTPS","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-router-090","questionText":"異なるネットワーク間で、IPアドレスを基にパケットの転送先を決める装置はどれですか。","choices":["キーボード","プリンタ","ディスプレイ","ルータ"],"correctChoiceIndex":3,"explanation":"ルータは、宛先IPアドレスと経路情報を基にパケットを別のネットワークへ転送します。家庭内LANとインターネットの接続にも使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"ルータ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-switch-091","questionText":"LAN内でMACアドレスを学習し、必要なポートへフレームを転送する装置はどれですか。","choices":["レイヤ2スイッチ","モデム","リピータ","UPS"],"correctChoiceIndex":0,"explanation":"レイヤ2スイッチは、MACアドレス表を使ってイーサネットフレームを適切なポートへ転送します。不要なポートへの通信を減らせます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"スイッチ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-wifi-092","questionText":"公衆Wi-Fiを利用するときの対策として適切なものはどれですか。","choices":["接続先名が似ていれば必ず信用する","HTTPSやVPNを利用し、機密情報の送信を慎重に行う","端末の更新を停止する","共有設定を常に有効にする"],"correctChoiceIndex":1,"explanation":"公衆Wi-Fiでは偽アクセスポイントや盗聴のリスクがあります。HTTPS、VPN、正しい接続先の確認などで通信を保護します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"Wi-Fi","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-malware-093","questionText":"利用者のファイルを暗号化し、復号と引換えに金銭を要求するマルウェアはどれですか。","choices":["スパイウェア","ワーム","ランサムウェア","アドウェア"],"correctChoiceIndex":2,"explanation":"ランサムウェアは、端末やデータを利用不能にして身代金を要求するマルウェアです。更新、バックアップ、添付ファイル対策など多層防御が重要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ランサムウェア","difficulty":1,"source":"JPCERT/CC「ランサムウェア対策」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-phishing-094","questionText":"実在する組織を装ったメールから偽サイトへ誘導し、認証情報を盗む手口はどれですか。","choices":["SQLインジェクション","DoS攻撃","辞書攻撃","フィッシング"],"correctChoiceIndex":3,"explanation":"フィッシングは、偽メールや偽サイトでID、パスワード、決済情報などを詐取します。リンク先を確認し、公式アプリやブックマークからアクセスする対策が有効です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"フィッシング","difficulty":1,"source":"フィッシング対策協議会「フィッシング対策ガイドライン」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-social-engineering-095","questionText":"人の心理的な隙を利用して機密情報を入手する攻撃はどれですか。","choices":["ソーシャルエンジニアリング","デフラグ","ロードバランシング","正規化"],"correctChoiceIndex":0,"explanation":"ソーシャルエンジニアリングは、なりすまし電話、のぞき見、廃棄物の探索など人を狙う手口です。本人確認手順や教育、情報の適切な廃棄が対策になります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ソーシャルエンジニアリング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-mfa-096","questionText":"多要素認証の組合せとして適切なものはどれですか。","choices":["パスワードと暗証番号","パスワードとスマートフォンの認証アプリ","指紋と顔","秘密の質問とPIN"],"correctChoiceIndex":1,"explanation":"パスワードは知識要素、認証アプリを持つスマートフォンは所持要素で、異なる種類を組み合わせています。同じ種類を二つ使うだけでは多要素認証になりません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"多要素認証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-symmetric-key-097","questionText":"暗号化と復号に同じ秘密鍵を使う暗号方式はどれですか。","choices":["公開鍵暗号方式","ハッシュ方式","共通鍵暗号方式","デジタル署名方式"],"correctChoiceIndex":2,"explanation":"共通鍵暗号方式は、送信者と受信者が同じ秘密鍵を共有します。処理が比較的高速ですが、安全な鍵配送が課題です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"共通鍵暗号","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-public-key-098","questionText":"公開鍵暗号方式の特徴として適切なものはどれですか。","choices":["暗号化と復号に必ず同じ鍵を使う","公開鍵は誰にも知らせてはいけない","秘密鍵は全利用者で共有する","公開鍵と秘密鍵の対を利用する"],"correctChoiceIndex":3,"explanation":"公開鍵暗号方式では、公開してよい鍵と本人が秘密に保つ鍵の対を使います。暗号化やデジタル署名など、目的に応じて鍵の使い方が異なります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"公開鍵暗号","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-hash-099","questionText":"ハッシュ関数の利用目的として適切なものはどれですか。","choices":["データから固定長の値を生成し、改ざん検知などに使う","必ず元のデータへ復号する","IPアドレスを自動配布する","通信回線を物理的に増設する"],"correctChoiceIndex":0,"explanation":"ハッシュ関数は、入力データから固定長のハッシュ値を生成します。元データの復元を目的とせず、完全性確認やパスワード保護などに利用されます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ハッシュ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"technology-digital-signature-100","questionText":"デジタル署名で主に確認できるものはどれですか。","choices":["通信速度と保存容量","署名者とデータが改ざんされていないこと","端末の物理的な所在","閲覧者全員の年齢"],"correctChoiceIndex":1,"explanation":"デジタル署名は、署名者の秘密鍵で作成し、対応する公開鍵で検証します。署名者の確認と、署名後にデータが改ざんされていないことの確認に使います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"デジタル署名","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-22T00:00:00+09:00","updatedAt":"2026-08-22T00:00:00+09:00"},{"id":"strategy-stakeholder-101","questionText":"企業活動の影響を受ける株主、従業員、顧客、地域社会などをまとめて何と呼びますか。","choices":["ステークホルダ","アウトソーサ","ディストリビュータ","アナリスト"],"correctChoiceIndex":0,"explanation":"ステークホルダ（利害関係者）は、企業の意思決定や活動から影響を受ける人・組織です。株主だけでなく、従業員、顧客、取引先、地域社会なども含みます。","category":"ストラテジ系","subcategory":"企業活動","topic":"ステークホルダ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-csf-102","questionText":"目標達成のために、特に重点的に管理すべき成功要因を表すものはどれですか。","choices":["KGI","CSF","ROI","SLA"],"correctChoiceIndex":1,"explanation":"CSF（Critical Success Factor：重要成功要因）は、目標達成に不可欠な要因です。KGIは最終目標の達成度、KPIは途中の業績を測る指標です。","category":"ストラテジ系","subcategory":"企業活動","topic":"CSF","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-roe-103","questionText":"当期純利益を自己資本で割って、株主が拠出した資本の収益性を測る指標はどれですか。","choices":["売上高利益率","総資産回転率","ROE","流動比率"],"correctChoiceIndex":2,"explanation":"ROE（Return on Equity：自己資本利益率）は、当期純利益を自己資本で割って求めます。株主資本をどれだけ効率よく利益につなげたかを示します。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROE","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-roa-104","questionText":"企業が保有する総資産を使って、どの程度の利益を上げたかを測る指標はどれですか。","choices":["自己資本比率","売上債権回転期間","損益分岐点比率","ROA"],"correctChoiceIndex":3,"explanation":"ROA（Return on Assets：総資産利益率）は、利益を総資産で割って資産全体の収益性を測ります。ROEは自己資本に対する収益性を測る点が異なります。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROA","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-contribution-margin-105","questionText":"販売価格が1個5,000円、1個当たりの変動費が3,000円の製品について、1個当たりの固定費回収と利益に充てられる金額はいくらですか。","choices":["2,000円","3,000円","5,000円","8,000円"],"correctChoiceIndex":0,"explanation":"限界利益は販売価格から変動費を引いて求めるため、5,000－3,000＝2,000円です。この金額が固定費の回収に充てられ、固定費を超えた分が利益になります。","category":"ストラテジ系","subcategory":"企業活動","topic":"限界利益","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-break-even-calc-106","questionText":"固定費が60万円、1個当たりの販売価格が5,000円、変動費が3,000円のとき、利益が0となる販売数量は何個ですか。","choices":["120個","300個","500個","750個"],"correctChoiceIndex":1,"explanation":"1個当たりの限界利益は2,000円なので、損益分岐点販売数量は600,000÷2,000＝300個です。300個を超えて販売すると利益が生じます。","category":"ストラテジ系","subcategory":"企業活動","topic":"損益分岐点","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-segmentation-107","questionText":"年齢、居住地域、購買行動などの共通点で市場を複数の顧客群に分ける活動はどれですか。","choices":["ポジショニング","ブランディング","セグメンテーション","マーチャンダイジング"],"correctChoiceIndex":2,"explanation":"セグメンテーションは、市場を似たニーズや属性を持つ顧客群に分けることです。その後に狙う市場を選ぶターゲティング、価値を位置付けるポジショニングを行います。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"市場細分化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-targeting-108","questionText":"市場を複数の顧客群に分けた後、自社が重点的に働きかける顧客群を選ぶ活動はどれですか。","choices":["モニタリング","ベンチマーキング","ポジショニング","ターゲティング"],"correctChoiceIndex":3,"explanation":"ターゲティングは、細分化した市場から自社が狙う顧客群を選ぶことです。選んだ顧客に自社の価値をどう認識してもらうかを決めるのがポジショニングです。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ターゲティング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-marketing-mix-109","questionText":"製品、価格、流通、販売促進を組み合わせて市場へ働きかける考え方はどれですか。","choices":["マーケティングミックス","バリューチェーン","プロダクトポートフォリオ","コアコンピタンス"],"correctChoiceIndex":0,"explanation":"マーケティングミックスは、Product（製品）、Price（価格）、Place（流通）、Promotion（販売促進）の4Pを組み合わせる考え方です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"マーケティングミックス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-clv-110","questionText":"顧客との取引開始から終了までに、その顧客が企業にもたらす利益の総額を評価する指標はどれですか。","choices":["市場占有率","LTV","棚卸資産回転率","労働生産性"],"correctChoiceIndex":1,"explanation":"LTV（Life Time Value：顧客生涯価値）は、一人の顧客との関係全体から得られる利益を評価します。継続率の改善や顧客維持施策の判断に使われます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客生涯価値","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-value-chain-111","questionText":"購買物流、製造、販売、サービスなどの活動を連鎖として捉え、競争優位の源泉を分析する手法はどれですか。","choices":["SWOT分析","PEST分析","バリューチェーン分析","回帰分析"],"correctChoiceIndex":2,"explanation":"バリューチェーン分析は、企業活動を価値を生む一連の主活動と支援活動に分け、強みやコスト発生箇所を分析します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"バリューチェーン","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-core-competence-112","questionText":"競合他社が容易に模倣できず、複数の製品や事業で価値を生む中核的な能力はどれですか。","choices":["標準作業時間","変動費","市場成長率","コアコンピタンス"],"correctChoiceIndex":3,"explanation":"コアコンピタンスは、企業固有の技術やノウハウなど、競争力の中心となる能力です。単一製品だけでなく複数の市場へ展開できることも特徴です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"コアコンピタンス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-benchmarking-113","questionText":"優れた企業の業務方法や指標を比較対象として、自社の改善に活用する手法はどれですか。","choices":["ベンチマーキング","デシジョンツリー","デルファイ法","モンテカルロ法"],"correctChoiceIndex":0,"explanation":"ベンチマーキングは、社内外の優れた事例と自社を比較し、性能差や業務の改善点を見つける手法です。単なる模倣ではなく、差の原因を分析します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ベンチマーキング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-alliance-114","questionText":"複数の企業が独立性を保ちながら、技術開発や販売など特定の目的で協力する関係はどれですか。","choices":["垂直統合","アライアンス","清算","会社分割"],"correctChoiceIndex":1,"explanation":"アライアンス（戦略的提携）は、企業同士が互いの経営上の独立性を保ちながら、特定分野で協力する関係です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"アライアンス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-ma-115","questionText":"企業の合併や買収をまとめて表す用語はどれですか。","choices":["OEM","BPO","M&A","EDI"],"correctChoiceIndex":2,"explanation":"M&A（Mergers and Acquisitions：合併と買収）は、企業の合併や株式・事業の取得を通じて事業を統合・拡大する手段です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"M&A","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-franchise-116","questionText":"本部が加盟店に商標や経営ノウハウの使用を認め、加盟店が対価を支払う事業形態はどれですか。","choices":["ジョイントベンチャー","持株会社","アウトプレースメント","フランチャイズチェーン"],"correctChoiceIndex":3,"explanation":"フランチャイズチェーンでは、本部がブランドや運営ノウハウを提供し、加盟店が加盟金やロイヤルティを支払って事業を行います。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"フランチャイズ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-standardization-117","questionText":"製品の寸法や通信方式などについて共通の取り決めを設ける主な目的はどれですか。","choices":["互換性を確保し、利用や取引を円滑にする","すべての企業の価格を同一にする","技術革新を禁止する","特定企業だけに市場を限定する"],"correctChoiceIndex":0,"explanation":"標準化は、仕様や手順を共通化して互換性、品質、安全性などを確保します。異なる製品や組織間の連携を容易にする効果があります。","category":"ストラテジ系","subcategory":"法務","topic":"標準化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-de-facto-standard-118","questionText":"公的な標準化機関の制定ではなく、市場で広く普及した結果として事実上の標準になった規格はどれですか。","choices":["強制規格","デファクトスタンダード","社内規程","監査基準"],"correctChoiceIndex":1,"explanation":"デファクトスタンダード（de facto standard）は、市場競争や普及によって事実上の標準となった規格です。標準化機関が制定するデジュールスタンダードと区別されます。","category":"ストラテジ系","subcategory":"法務","topic":"デファクトスタンダード","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-iot-119","questionText":"センサを備えた機器をネットワークへ接続し、収集したデータを遠隔監視などに活用する考え方はどれですか。","choices":["BPO","RFP","IoT","CAD"],"correctChoiceIndex":2,"explanation":"IoT（Internet of Things：モノのインターネット）は、機器や設備をネットワークへ接続し、データ収集や制御へ活用する考え方です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"IoT","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-data-driven-120","questionText":"担当者の経験だけに頼らず、販売実績や顧客行動の分析結果を根拠に施策を決める経営はどれですか。","choices":["ファミリービジネス","ボランティア経営","トップダウン経営","データドリブン経営"],"correctChoiceIndex":3,"explanation":"データドリブン経営は、収集したデータを分析し、その結果を意思決定へ活用します。経験や直感も使いますが、客観的な根拠で判断を補強します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"データ活用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-open-data-121","questionText":"行政機関などが、二次利用しやすい条件と機械判読可能な形式で公開するデータはどれですか。","choices":["オープンデータ","バックアップデータ","マスタデータ","ログデータ"],"correctChoiceIndex":0,"explanation":"オープンデータは、誰でも利用・再配布しやすい条件で公開されたデータです。地域課題の分析や新しいサービスの開発などに活用されます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"オープンデータ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-ai-bias-122","questionText":"過去の採用実績を学習したモデルが、特定の属性を持つ応募者を一貫して不利に評価した。最初に確認すべき点はどれですか。","choices":["画面の配色","学習データと評価指標の偏り","サーバの設置階","キーボードの配列"],"correctChoiceIndex":1,"explanation":"AI（Artificial Intelligence：人工知能）の判断に偏りがある場合、学習データの代表性やラベル、評価指標を確認します。公平性を継続的に評価し、人による監督も行う必要があります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"AIガバナンス","difficulty":3,"source":"総務省・経済産業省「AI事業者ガイドライン」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-generative-ai-123","questionText":"生成AIの出力を業務文書へ利用するときの対応として最も適切なものはどれですか。","choices":["出力は常に正しいので確認しない","機密情報を無条件に入力する","根拠や事実関係を人が確認する","利用履歴を必ず公開する"],"correctChoiceIndex":2,"explanation":"生成AI（Artificial Intelligence：人工知能）は事実と異なる内容をもっともらしく生成することがあります。出力の根拠・正確性を人が確認し、機密情報や個人情報の入力ルールも守ります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"生成AI","difficulty":2,"source":"総務省・経済産業省「AI事業者ガイドライン」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-as-is-to-be-124","questionText":"受注業務の改善で、現在の流れと目標とする流れを比較したところ、二重入力が差として見つかった。この分析の進め方として適切なものはどれですか。","choices":["将来像を考えず現状だけを保存する","現状を確認せず製品を購入する","差を無視して旧手順を維持する","現状とあるべき姿の差から改善課題を特定する"],"correctChoiceIndex":3,"explanation":"As-Is（現状）とTo-Be（あるべき姿）を可視化し、そのギャップから課題と改善策を検討します。製品導入を先に決めず、業務目的と課題を明確にします。","category":"ストラテジ系","subcategory":"システム戦略","topic":"As-IsとTo-Be","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-bpmn-125","questionText":"業務の開始、処理、分岐、終了などを共通の記号で表し、関係者間で業務手順を共有するための表記法はどれですか。","choices":["BPMN","UMLクラス図","ER図","PERT"],"correctChoiceIndex":0,"explanation":"BPMN（Business Process Model and Notation）は、業務プロセスの流れを共通記号で表す表記法です。業務担当者と開発者の認識共有に役立ちます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務プロセスモデリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-feasibility-study-126","questionText":"新システム企画の初期段階で、技術面、費用面、運用面から実現可能性を評価する活動はどれですか。","choices":["コードレビュー","フィージビリティスタディ","回帰テスト","データ移行"],"correctChoiceIndex":1,"explanation":"フィージビリティスタディ（実現可能性調査）は、企画を進める前に技術、費用、期間、運用などの観点で実現可能性を評価します。","category":"ストラテジ系","subcategory":"システム企画","topic":"実現可能性調査","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-tco-127","questionText":"情報システムの導入費だけでなく、運用、保守、教育、廃棄まで含めた総費用を評価する指標はどれですか。","choices":["ROI","NPV","TCO","KPI"],"correctChoiceIndex":2,"explanation":"TCO（Total Cost of Ownership：総所有コスト）は、購入費用に加えて運用・保守・教育・更新など利用期間全体の費用を捉えます。","category":"ストラテジ系","subcategory":"システム企画","topic":"TCO","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-outsourcing-128","questionText":"給与計算業務を外部委託する計画で、委託先に個人情報を扱わせる。委託元の対応として最も適切なものはどれですか。","choices":["委託後は管理責任が一切なくなる","契約せず口頭だけで依頼する","再委託の有無を確認しない","安全管理状況を選定時と委託中に確認する"],"correctChoiceIndex":3,"explanation":"個人情報を扱う業務の委託では、適切な委託先を選び、契約で取扱条件を定め、委託後も安全管理状況を監督します。委託により責任がなくなるわけではありません。","category":"ストラテジ系","subcategory":"システム企画","topic":"アウトソーシング管理","difficulty":3,"source":"個人情報保護委員会「個人情報保護法ガイドライン」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-procurement-evaluation-129","questionText":"複数ベンダの提案を比較するとき、価格だけでなく機能、体制、実績、保守性も公平に評価する方法として適切なものはどれですか。","choices":["事前に評価項目と配点を定めて採点する","最初に届いた提案を無条件で採用する","会社名だけで選ぶ","評価結果を記録しない"],"correctChoiceIndex":0,"explanation":"提案評価では、要求事項に基づく評価項目、重み、採点基準を事前に定めます。評価過程を記録することで、公平性と説明可能性を高められます。","category":"ストラテジ系","subcategory":"システム企画","topic":"提案評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-nda-130","questionText":"取引先へ未公開の製品情報を開示する前に、秘密情報の利用目的や管理方法を合意する契約はどれですか。","choices":["SLA","NDA","RFP","GPL"],"correctChoiceIndex":1,"explanation":"NDA（Non-Disclosure Agreement：秘密保持契約）は、開示した秘密情報の目的外利用や無断開示を防ぐため、取扱条件を定めます。","category":"ストラテジ系","subcategory":"法務","topic":"秘密保持契約","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-purpose-limitation-131","questionText":"顧客情報を取得する際の利用目的に関する対応として適切なものはどれですか。","choices":["目的を決めず将来の用途へ自由に使う","本人に知らせず第三者へ常に提供する","利用目的をできる限り特定し、通知または公表する","取得後すぐに目的を変更して知らせない"],"correctChoiceIndex":2,"explanation":"個人情報を取り扱う際は、利用目的をできる限り具体的に特定し、原則として本人へ通知または公表します。目的を超える利用には別の根拠や同意が必要です。","category":"ストラテジ系","subcategory":"法務","topic":"個人情報の利用目的","difficulty":2,"source":"個人情報保護委員会「個人情報保護法」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-contract-132","questionText":"ソフトウェア開発を請負契約で発注したが、発注側の担当者が受注側の作業者へ毎日の作業手順を直接指示している。まず確認すべきリスクはどれですか。","choices":["著作物の保護期間だけ","通信速度の低下だけ","商品の在庫不足だけ","契約形態と実際の指揮命令関係の不一致"],"correctChoiceIndex":3,"explanation":"請負では受注側が自ら作業を管理します。発注側が受注側の作業者へ直接指揮命令している場合、契約名と実態が異なる偽装請負などのリスクを確認します。","category":"ストラテジ系","subcategory":"法務","topic":"請負と派遣","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-trade-secret-133","questionText":"顧客リストを営業秘密として法的に保護するために重要な管理はどれですか。","choices":["秘密であることを示し、アクセスできる人を限定する","誰でも閲覧できる場所へ置く","公開サイトへ掲載する","退職者へ自由な持出しを認める"],"correctChoiceIndex":0,"explanation":"営業秘密として保護されるには、秘密管理性、有用性、非公知性が重要です。秘密表示やアクセス制御などにより、秘密として管理していることを明確にします。","category":"ストラテジ系","subcategory":"法務","topic":"営業秘密","difficulty":2,"source":"経済産業省「営業秘密管理指針」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-universal-design-134","questionText":"年齢や障害の有無などにかかわらず、できるだけ多くの人が利用しやすい製品や環境を目指す考え方はどれですか。","choices":["ローカライゼーション","ユニバーサルデザイン","リバースエンジニアリング","マスカスタマイゼーション"],"correctChoiceIndex":1,"explanation":"ユニバーサルデザインは、特定の人だけを対象とせず、最初から多様な利用者が使いやすいように設計する考え方です。","category":"ストラテジ系","subcategory":"企業活動","topic":"ユニバーサルデザイン","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-green-it-135","questionText":"情報システムの環境負荷を減らす取組として適切なものはどれですか。","choices":["不要なサーバを常時稼働させる","機器更新のたびに全機器を廃棄する","仮想化でサーバを集約し消費電力を抑える","印刷枚数を増やして確認する"],"correctChoiceIndex":2,"explanation":"サーバ仮想化による集約は、物理サーバ台数や電力・冷却負荷の削減につながります。機器の長期利用や適切な回収・再資源化も環境負荷低減に役立ちます。","category":"ストラテジ系","subcategory":"企業活動","topic":"グリーンIT","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-project-charter-136","questionText":"プロジェクトの目的、責任者、主要な関係者などを明らかにし、正式な開始を承認する文書はどれですか。","choices":["サービスカタログ","監査調書","障害記録","プロジェクト憲章"],"correctChoiceIndex":3,"explanation":"プロジェクト憲章は、プロジェクトの目的や責任者、概略範囲などを示し、組織としてプロジェクトを正式に認可する文書です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト憲章","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-triple-constraint-137","questionText":"プロジェクトで相互に影響し合う代表的な制約の組合せはどれですか。","choices":["スコープ・時間・コスト","売上・在庫・広告","暗号・認証・圧縮","入力・処理・出力"],"correctChoiceIndex":0,"explanation":"プロジェクトでは、スコープ、時間、コストなどの制約が相互に影響します。範囲を追加すれば、期間や費用、品質への影響を評価する必要があります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト制約","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-arrow-diagram-138","questionText":"作業の前後関係を矢印などで表し、全体期間や余裕時間を分析する図はどれですか。","choices":["特性要因図","アローダイアグラム","散布図","管理図"],"correctChoiceIndex":1,"explanation":"アローダイアグラムは、作業の順序関係と所要時間をネットワークで表します。クリティカルパスや作業の余裕時間を把握できます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"アローダイアグラム","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-critical-path-calc-139","questionText":"開始から終了まで二つの経路があり、経路Aは3日と4日の作業、経路Bは2日と6日の作業で構成される。全作業を最短で終える期間は何日ですか。","choices":["6日","7日","8日","15日"],"correctChoiceIndex":2,"explanation":"経路Aは3＋4＝7日、経路Bは2＋6＝8日です。並行する経路のうち最長の経路Bがクリティカルパスとなるため、最短期間は8日です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"クリティカルパス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-earned-value-140","questionText":"計画価値が100万円、出来高が80万円、実コストが90万円の時点での状況として適切なものはどれですか。","choices":["予定より進み、予算内である","予定より進み、予算超過である","予定より遅れ、予算内である","予定より遅れ、予算超過である"],"correctChoiceIndex":3,"explanation":"EVM（Earned Value Management：出来高管理）では、出来高80万円が計画価値100万円より小さいため進捗遅れです。実コスト90万円も出来高を上回るため予算超過です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVM","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-risk-matrix-141","questionText":"プロジェクトのリスクを優先順位付けするとき、一般に組み合わせて評価する二つの要素はどれですか。","choices":["発生確率と影響度","担当者の年齢と勤続年数","画面数と文字数","会議室数と座席数"],"correctChoiceIndex":0,"explanation":"リスクは、発生する可能性と発生した場合の影響の大きさを組み合わせて評価します。両方が高いリスクから優先的に対応します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-risk-transfer-142","questionText":"損害発生時の金銭的負担を保険契約によって保険会社へ移す対応はどれですか。","choices":["リスク回避","リスク移転","リスク低減","リスク受容"],"correctChoiceIndex":1,"explanation":"保険契約は、リスクによる金銭的影響を第三者へ移すリスク移転の例です。発生確率そのものを下げる対策はリスク低減です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-quality-assurance-143","questionText":"開発工程が定めた標準や手順に従っているかを確認し、欠陥を予防する活動はどれですか。","choices":["構成管理","進捗報告","品質保証","障害復旧"],"correctChoiceIndex":2,"explanation":"品質保証は、適切なプロセスや標準を整備・監査して品質を作り込む活動です。成果物を検査して欠陥を見つける品質管理とは焦点が異なります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"品質保証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-change-request-144","questionText":"開発中に利用部門から機能追加の依頼があった。プロジェクト管理上、最初に行う対応として適切なものはどれですか。","choices":["記録せず直ちに実装する","依頼を無条件で拒否する","担当者の判断だけで納期を延ばす","変更内容を記録し、影響を評価して承認を得る"],"correctChoiceIndex":3,"explanation":"変更要求は正式に記録し、スコープ、費用、期間、品質、リスクへの影響を評価します。承認された変更だけを計画へ反映します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"変更管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-lessons-learned-145","questionText":"完了したプロジェクトの成功要因や失敗原因を記録し、今後のプロジェクトで再利用する情報はどれですか。","choices":["教訓","サービス要求","監査証拠","構成品目"],"correctChoiceIndex":0,"explanation":"教訓は、プロジェクトで得た成功・失敗の知識を整理したものです。終了時だけでなく、進行中にも記録して組織の知識として共有します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"教訓","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-service-catalog-146","questionText":"利用者が申請できるITサービスの内容、対象者、提供条件などを一覧にしたものはどれですか。","choices":["リスク登録簿","サービスカタログ","監査計画書","テスト仕様書"],"correctChoiceIndex":1,"explanation":"サービスカタログは、提供中のITサービスについて内容、対象、申請方法、サービスレベルなどを利用者に分かる形で整理します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービスカタログ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-incident-priority-147","questionText":"サービス障害への対応優先度を決める際の基準として最も適切なものはどれですか。","choices":["報告者の役職だけ","担当者の好み","事業への影響度と緊急度","障害票の文字数"],"correctChoiceIndex":2,"explanation":"インシデントの優先度は、影響を受ける利用者や業務の範囲と、復旧を急ぐ必要性を組み合わせて決めます。報告者の役職だけでは決め
