ません。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント優先度","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-root-cause-148","questionText":"同じ障害が繰り返し発生している。恒久的な再発防止のために重点的に行う活動はどれですか。","choices":["利用者からの連絡を止める","毎回同じ暫定回避だけを行う","記録を削除して件数を減らす","根本原因を分析して対策する"],"correctChoiceIndex":3,"explanation":"問題管理では、繰り返すインシデントの根本原因を調査し、恒久対策や既知の誤りを管理します。早期復旧を重視するインシデント管理と役割が異なります。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"根本原因分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-cab-149","questionText":"本番環境への重要な変更について、リスク、日程、影響を関係者が審議する会議体はどれですか。","choices":["CAB","CSIRT","PMO","NOC"],"correctChoiceIndex":0,"explanation":"CAB（Change Advisory Board：変更諮問委員会）は、変更の影響やリスクを評価し、実施可否や日程について助言します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"変更諮問委員会","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-capacity-150","questionText":"利用者増加に備えてCPU使用率や応答時間を継続監視し、必要な資源を計画する活動はどれですか。","choices":["インシデント管理","キャパシティ管理","リリース管理","サービス要求管理"],"correctChoiceIndex":1,"explanation":"キャパシティ管理は、現在と将来の業務需要に対し、適切な性能と容量を費用対効果よく確保する活動です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"キャパシティ管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-service-continuity-151","questionText":"大規模災害で主要データセンタが停止した場合に備える取組として最も適切なものはどれですか。","choices":["復旧目標を定めず、その場で判断する","バックアップを同じ装置だけに保存する","重要サービスの復旧目標と代替手順を定めて訓練する","障害情報を記録しない"],"correctChoiceIndex":2,"explanation":"ITサービス継続管理では、事業影響を踏まえて復旧目標、代替拠点、連絡・復旧手順を定め、定期的に訓練・見直しを行います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ITサービス継続","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-audit-evidence-152","questionText":"システム監査人が監査意見を裏付けるために収集・評価する記録や資料を何と呼びますか。","choices":["要件定義書","サービスカタログ","プロジェクト憲章","監査証拠"],"correctChoiceIndex":3,"explanation":"監査証拠は、監査結果や意見を裏付ける情報です。記録、文書、観察結果、ヒアリング内容などから、十分性と適切性を考慮して収集します。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証拠","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-auditor-independence-153","questionText":"監査対象システムを自ら開発した担当者が、そのシステムを単独で監査することを避ける主な理由はどれですか。","choices":["監査の客観性と独立性を保つため","ネットワーク速度を上げるため","開発費を増やすため","データ形式を統一するため"],"correctChoiceIndex":0,"explanation":"監査人は、監査対象から独立した立場で客観的に評価する必要があります。自らの仕事を監査すると判断の公正性が損なわれるおそれがあります。","category":"マネジメント系","subcategory":"システム監査","topic":"監査人の独立性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-follow-up-154","questionText":"監査で指摘した改善事項について、後日、対応状況や改善効果を確認する活動はどれですか。","choices":["予備調査","フォローアップ","結合テスト","構成管理"],"correctChoiceIndex":1,"explanation":"フォローアップは、監査報告後に改善提案への対応状況を確認する活動です。指摘を出すだけでなく、改善が有効に進んだかを確かめます。","category":"マネジメント系","subcategory":"システム監査","topic":"フォローアップ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-segregation-duties-155","questionText":"従業員が架空の取引先を登録し、自ら支払承認まで行える状態にある。不正防止のために最も有効な統制はどれですか。","choices":["同じ担当者へ全権限を集中する","承認記録を残さない","取引先登録と支払承認を別の担当者に分ける","パスワードを部署全員で共有する"],"correctChoiceIndex":2,"explanation":"職務分掌により、取引先登録と支払承認など相互にけん制すべき業務を分離します。一人で不正を開始・承認できない仕組みにする内部統制です。","category":"マネジメント系","subcategory":"システム監査","topic":"職務分掌","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-clock-156","questionText":"CPUの動作タイミングを示し、一般にHzで表すものはどれですか。","choices":["命令長","バス幅","キャッシュ容量","クロック周波数"],"correctChoiceIndex":3,"explanation":"クロック周波数は、CPU（Central Processing Unit：中央処理装置）の動作タイミングを1秒当たりの回数で表します。性能は構造やコア数などにも左右されます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"クロック周波数","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-multicore-157","questionText":"一つのCPUパッケージに複数の処理コアを搭載する主な利点はどれですか。","choices":["並行して実行できる処理を増やせる","補助記憶装置が不要になる","すべてのプログラムが必ず同じ速度になる","ネットワーク障害を防止できる"],"correctChoiceIndex":0,"explanation":"マルチコアCPUは複数の処理コアを持ち、並列化可能な処理を同時に進められます。ただし、ソフトウェア側が並列処理へ対応している必要があります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"マルチコア","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-virtual-memory-158","questionText":"主記憶の容量を超えるプログラムを動かすため、補助記憶装置の一部を主記憶のように利用する仕組みはどれですか。","choices":["パイプライン処理","仮想記憶","ミラーリング","ホットスタンバイ"],"correctChoiceIndex":1,"explanation":"仮想記憶は、必要な部分を主記憶へ読み込み、残りを補助記憶装置に置くことで、物理メモリより大きなアドレス空間を扱えるようにします。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"仮想記憶","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-page-fault-159","questionText":"仮想記憶を使うシステムで、必要なページが主記憶に存在しないときに発生する処理はどれですか。","choices":["ページを破棄して処理を終了する","CPUのクロックを停止する","補助記憶装置から対象ページを読み込む","ネットワークからOSを再インストールする"],"correctChoiceIndex":2,"explanation":"ページフォールトが発生すると、OSは必要なページを補助記憶装置から主記憶へ読み込みます。頻発すると入出力が増え、性能が大きく低下します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ページフォールト","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-cache-rate-160","questionText":"キャッシュのアクセス時間が2ns、主記憶が50ns、ヒット率が90%のとき、アクセス時間の概算として最も近いものはどれですか。","choices":["2.0ns","4.8ns","50.0ns","7.0ns"],"correctChoiceIndex":3,"explanation":"ヒット時は2ns、ミス時はキャッシュ確認後に主記憶へアクセスするので、2×0.9＋（2＋50）×0.1＝7.0nsです。ヒット率が高いほど平均時間は短くなります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"キャッシュヒット率","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-raid1-161","questionText":"二台のディスクへ同じデータを書き込み、一台の故障時も処理を継続しやすくする構成はどれですか。","choices":["RAID 1","RAID 0","ストライピングのみ","ディスク圧縮"],"correctChoiceIndex":0,"explanation":"RAID（Redundant Array of Independent Disks）1は、同じデータを複数ディスクへ保存するミラーリングです。利用可能容量は減りますが、一台の故障に耐えられます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID 1","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-raid5-162","questionText":"複数ディスクにデータとパリティを分散し、一台の故障からデータを復元できる構成はどれですか。","choices":["RAID 0","RAID 5","単一ディスク","メモリインタリーブ"],"correctChoiceIndex":1,"explanation":"RAID（Redundant Array of Independent Disks）5は、データとパリティを複数ディスクへ分散します。最低三台が必要で、一台が故障しても復元できます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID 5","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-wear-leveling-163","questionText":"フラッシュメモリの同じ領域へ書込みが集中するのを避け、寿命を延ばす制御はどれですか。","choices":["スワッピング","デフラグメンテーション","ウェアレベリング","オーバークロック"],"correctChoiceIndex":2,"explanation":"ウェアレベリングは、書込み位置を分散してフラッシュメモリの消去・書換え回数を平準化します。SSDなどの寿命を延ばすために使われます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ウェアレベリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-input-device-164","questionText":"紙に印刷された文字を画像として読み取り、文字コードへ変換する装置・技術はどれですか。","choices":["プロッタ","スピーカ","ディスプレイ","OCR"],"correctChoiceIndex":3,"explanation":"OCR（Optical Character Recognition：光学文字認識）は、画像として読み取った文字を認識し、編集可能な文字データへ変換します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"OCR","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-file-permission-165","questionText":"共有ファイルを閲覧だけ許可し、内容の変更を禁止したい。付与する権限として適切なものはどれですか。","choices":["読取り権限だけ","書込み権限だけ","削除権限だけ","管理者権限"],"correctChoiceIndex":0,"explanation":"読取り権限だけを付与すれば、内容を閲覧できますが変更はできません。必要最小限の権限を与えることで誤操作や不正変更を防ぎます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ファイルアクセス権","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-thread-166","questionText":"一つのプロセス内でメモリなどの資源を共有しながら並行動作する実行単位はどれですか。","choices":["セクタ","スレッド","パーティション","クラスタ"],"correctChoiceIndex":1,"explanation":"スレッドはプロセス内の実行単位です。同じプロセスのスレッドはメモリ空間などを共有でき、軽量に並行処理できます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"スレッド","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-deadlock-167","questionText":"処理Aが資源Xを保持してYを待ち、処理BがYを保持してXを待って、双方が進めなくなった状態はどれですか。","choices":["スラッシング","フェールオーバ","デッドロック","スプーリング"],"correctChoiceIndex":2,"explanation":"デッドロックは、複数の処理が互いの保持資源を待ち続ける状態です。資源取得順序の統一やタイムアウトなどで予防・解消します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"デッドロック","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-os-resource-168","questionText":"アプリケーションへCPU、メモリ、入出力装置などの資源を割り当てる基本ソフトウェアはどれですか。","choices":["表計算ソフト","Webブラウザ","データベースの表","OS"],"correctChoiceIndex":3,"explanation":"OS（Operating System：オペレーティングシステム）は、ハードウェア資源を管理し、アプリケーションへ共通の実行環境を提供します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"OSの役割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-incremental-backup-169","questionText":"初回のフルバックアップ後、直前のバックアップ以降に変更されたデータだけを保存する方式はどれですか。","choices":["増分バックアップ","差分バックアップ","ミラーリング","アーカイブ削除"],"correctChoiceIndex":0,"explanation":"増分バックアップは、直前のフルまたは増分バックアップ以降の変更分だけを保存します。容量は抑えられますが、復元には複数世代が必要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"増分バックアップ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-rpo-170","questionText":"障害復旧計画で、どの時点までのデータを復元する必要があるかを示す目標はどれですか。","choices":["RTO","RPO","SLA","MTBF"],"correctChoiceIndex":1,"explanation":"RPO（Recovery Point Objective：目標復旧時点）は、許容できるデータ損失の時間幅を示します。RTOはサービス復旧までの目標時間です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"RPO","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-rto-171","questionText":"障害発生からサービスを再開するまでの目標時間を示すものはどれですか。","choices":["RPO","MTTR","RTO","MTBF"],"correctChoiceIndex":2,"explanation":"RTO（Recovery Time Objective：目標復旧時間）は、停止後どのくらいの時間でサービスを復旧するかの目標です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"RTO","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-db-index-172","questionText":"検索に使う列へ索引を追加する際の説明として適切なものはどれですか。","choices":["表の全データが自動的に暗号化される","主キーが不要になる","どの処理も必ず高速になる","検索が速くなる場合があるが更新コストは増える"],"correctChoiceIndex":3,"explanation":"インデックスは検索を高速化できますが、追加の記憶領域が必要で、INSERTやUPDATE時には索引の更新コストが発生します。","category":"テクノロジ系","subcategory":"データベース","topic":"インデックス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-sql-group-by-173","questionText":"売上表から店舗ごとの売上合計を求めるとき、店舗単位で行をまとめるために使うSQL句はどれですか。","choices":["GROUP BY","ORDER BY","DELETE","GRANT"],"correctChoiceIndex":0,"explanation":"GROUP BY句は、指定した列の値ごとに行をグループ化します。SUMなどの集計関数と組み合わせて店舗別合計などを求めます。","category":"テクノロジ系","subcategory":"データベース","topic":"GROUP BY","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-sql-join-174","questionText":"顧客表と注文表を顧客IDで関連付け、両方の列を一つの検索結果にする操作はどれですか。","choices":["射影","結合","削除","排他"],"correctChoiceIndex":1,"explanation":"結合（JOIN）は、共通するキーなどを条件に複数の表を関連付けて検索します。射影は必要な列を選ぶ操作です。","category":"テクノロジ系","subcategory":"データベース","topic":"表の結合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-acid-175","questionText":"トランザクションが全て実行されるか全く実行されないかのどちらかになる性質はどれですか。","choices":["一貫性","独立性","原子性","耐久性"],"correctChoiceIndex":2,"explanation":"原子性（Atomicity）は、処理を全て成功か全て取消しにする性質です。ACIDはAtomicity、Consistency、Isolation、Durabilityの頭文字です。","category":"テクノロジ系","subcategory":"データベース","topic":"ACID特性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-lost-update-176","questionText":"二人が同じ在庫数を読み取り、それぞれ変更して保存した結果、先に保存した更新が消えた。この現象はどれですか。","choices":["デッドロック","ロールバック","チェックポイント","更新消失"],"correctChoiceIndex":3,"explanation":"更新消失は、同じデータへの並行更新で一方の結果が上書きされる現象です。ロックや適切な分離レベル、楽観的排他制御などで防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"更新消失","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-point-in-time-recovery-177","questionText":"午前2時のフルバックアップ後も更新ログを保存していた。午前10時の誤更新直前まで戻すために有効な方法はどれですか。","choices":["バックアップを戻し、更新ログを誤更新直前まで適用する","現在のデータをそのまま上書き保存する","更新ログだけを削除する","表の列名を変更する"],"correctChoiceIndex":0,"explanation":"フルバックアップを復元し、その後の更新ログを指定時点まで順に適用することで、障害や誤操作の直前へ復旧できます。","category":"テクノロジ系","subcategory":"データベース","topic":"ポイントインタイムリカバリ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-private-ip-178","questionText":"組織内のLANで利用し、インターネットへ直接経路制御されないIPv4アドレスはどれですか。","choices":["グローバルIPアドレス","プライベートIPアドレス","MACアドレス","ブロードキャストドメイン"],"correctChoiceIndex":1,"explanation":"プライベートIP（Internet Protocol）アドレスは組織内などで使います。インターネット接続時は、一般にNATなどでグローバルIPアドレスへ変換します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"プライベートIPアドレス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-subnet-mask-179","questionText":"IPv4アドレスのうち、ネットワーク部とホスト部の境界を示すために使うものはどれですか。","choices":["ポート番号","MACアドレス","サブネットマスク","SSID"],"correctChoiceIndex":2,"explanation":"サブネットマスクは、IPアドレスのどこまでがネットワーク部かを示します。同じネットワークかどうかの判定や分割に使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"サブネットマスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-udp-180","questionText":"再送制御や到着順序の保証を省き、低い遅延を重視する通信に適したプロトコルはどれですか。","choices":["TCP","HTTP","SMTP","UDP"],"correctChoiceIndex":3,"explanation":"UDP（User Datagram Protocol）は、接続確立や再送制御を省いた軽量な通信です。リアルタイム配信など、多少の欠損より遅延の小ささを重視する用途に向きます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"UDP","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-port-number-181","questionText":"一台の端末で動く複数の通信アプリケーションを識別するため、TCPやUDPで使う番号はどれですか。","choices":["ポート番号","製造番号","郵便番号","行番号"],"correctChoiceIndex":0,"explanation":"ポート番号は端末内のサービスを識別します。IP（Internet Protocol）アドレスが通信先の端末を、ポート番号が端末内のサービスを示します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"ポート番号","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-url-182","questionText":"Web上の資源の場所を、通信方式、ホスト名、パスなどの組合せで表すものはどれですか。","choices":["HTML","URL","CPU","UPS"],"correctChoiceIndex":1,"explanation":"URL（Uniform Resource Locator）は、Web上の資源の場所を示します。例えばhttpsは方式、ホスト名は接続先、パスは資源の位置を表します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"URL","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-nat-183","questionText":"社内の複数端末がインターネットへ接続する際、内部と外部のIPアドレスを変換する機能はどれですか。","choices":["DNS","DHCP","NAT","NTP"],"correctChoiceIndex":2,"explanation":"NAT（Network Address Translation）は、プライベートIPアドレスとグローバルIPアドレスを変換します。ポートも利用するNAPTでは一つの外部アドレスを複数端末で共有できます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NAT","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-vpn-184","questionText":"公衆ネットワーク上に暗号化された仮想的な専用経路を作り、拠点間や端末から安全に接続する技術はどれですか。","choices":["VLAN","CDN","SAN","VPN"],"correctChoiceIndex":3,"explanation":"VPN（Virtual Private Network：仮想私設網）は、暗号化や認証を使って公衆ネットワーク上に安全な通信経路を構築します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"VPN","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-bluetooth-185","questionText":"イヤホンやキーボードなどを近距離で無線接続する用途に広く使われる規格はどれですか。","choices":["Bluetooth","SMTP","SATA","RAID"],"correctChoiceIndex":0,"explanation":"Bluetoothは、近距離の機器間通信に使われる無線規格です。イヤホン、入力装置、センサなどの接続に利用されます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"Bluetooth","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-wpa3-186","questionText":"無線LANを安全に利用するための対応として適切なものはどれですか。","choices":["暗号化を無効にする","WPA3など適切な方式を使い、推測されにくい認証情報を設定する","初期パスワードを全拠点で共用する","SSIDだけを秘密にすれば他の対策は不要とする"],"correctChoiceIndex":1,"explanation":"WPA3など適切な方式を使い、推測されにくい認証情報を設定することが重要です。WPA3（Wi-Fi Protected Access 3）を利用するときも初期設定を変更し、機器やファームウェアを最新の状態に保ちます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"無線LANセキュリティ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-zero-trust-187","questionText":"社内ネットワークからの接続も無条件に信用せず、アクセスごとに利用者や端末の状態を確認する考え方はどれですか。","choices":["境界内無条件信頼","オープンリレー","ゼロトラスト","ベストエフォート"],"correctChoiceIndex":2,"explanation":"ゼロトラストは、接続元の場所だけで信頼せず、利用者、端末、要求内容などを継続的に確認し、必要最小限のアクセスを許可する考え方です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ゼロトラスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-least-privilege-188","questionText":"利用者へ業務に必要な範囲だけのアクセス権を付与する原則はどれですか。","choices":["可用性優先の原則","権限共有の原則","無制限アクセスの原則","最小権限の原則"],"correctChoiceIndex":3,"explanation":"最小権限の原則は、業務遂行に必要な最小限の権限だけを付与する考え方です。誤操作や侵害時の影響範囲を小さくできます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"最小権限","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-patch-189","questionText":"ソフトウェアに既知の脆弱性が見つかったとき、提供元が公開する修正プログラムはどれですか。","choices":["セキュリティパッチ","データ辞書","電子透かし","スナップショット"],"correctChoiceIndex":0,"explanation":"セキュリティパッチは、発見された脆弱性や不具合を修正します。影響を確認し、検証とバックアップを行ったうえで速やかに適用します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"脆弱性対応","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-sql-injection-190","questionText":"入力欄へ不正な命令文を与え、データベースを意図しない形で操作する攻撃への対策として有効なものはどれですか。","choices":["HTML出力時のエスケープだけを行う","プレースホルダーを使ったパラメータ化クエリを利用する","要求ごとのCSRFトークンだけを検証する","保存パスワードへソルトだけを加える"],"correctChoiceIndex":1,"explanation":"SQL（Structured Query Language）インジェクション対策では、入力値を命令文へ文字列結合せず、プレースホルダーとバインド変数を使います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"SQLインジェクション","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-xss-191","questionText":"掲示板への投稿内容に不正なスクリプトを埋め込み、閲覧者のブラウザで実行させる攻撃への対策はどれですか。","choices":["SQLをプレースホルダーで実行する","要求ごとのCSRFトークンだけを検証する","出力時にHTMLとして解釈される文字を適切にエスケープする","保存パスワードへソルトを加える"],"correctChoiceIndex":2,"explanation":"クロスサイトスクリプティング（XSS）対策では、出力する文脈に応じて特殊文字をエスケープし、スクリプトとして解釈されないようにします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"クロスサイトスクリプティング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-csrf-192","questionText":"ログイン中の利用者をだまして意図しない送金リクエストを送らせる攻撃への対策として最も適切なものはどれですか。","choices":["パスワードをURLへ埋め込む","全画面を画像にする","利用者IDを固定する","推測困難なトークンで正規の画面からの要求か検証する"],"correctChoiceIndex":3,"explanation":"CSRF（Cross-Site Request Forgery：クロスサイトリクエストフォージェリ）対策では、要求ごとのトークンなどで正規画面からの操作かを検証します。重要操作の再認証も有効です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CSRF","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-ddos-193","questionText":"多数の端末から同時に大量の通信を送り、サービスを利用しにくくする攻撃はどれですか。","choices":["DDoS攻撃","辞書式圧縮","データ正規化","デフラグ"],"correctChoiceIndex":0,"explanation":"DDoS（Distributed Denial of Service：分散型サービス妨害）攻撃は、多数の端末から通信や処理を集中させてサービスを妨害します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"DDoS","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-password-salt-194","questionText":"同じパスワードを使う二人の保存値が同一になることや、事前計算表による解析を難しくする方法はどれですか。","choices":["平文のまま保存する","利用者ごとに異なるソルトを加えてハッシュ化する","全利用者で共通鍵を公開する","パスワードをログへ出力する"],"correctChoiceIndex":1,"explanation":"ソルトは利用者ごとに生成するランダム値で、パスワードと組み合わせてハッシュ化します。同じパスワードでも異なる保存値となり、事前計算攻撃を難しくします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"パスワード保護","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-pki-195","questionText":"Webサイトの公開鍵が正しい運営者のものだと第三者機関が証明する仕組みで中心となるものはどれですか。","choices":["共通鍵の全員共有","MACアドレス表","デジタル証明書","ファイル圧縮"],"correctChoiceIndex":2,"explanation":"デジタル証明書は、認証局が公開鍵と所有者の対応を証明します。PKI（Public Key Infrastructure：公開鍵基盤）は証明書の発行・検証・失効を支える仕組みです。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"PKI","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-queue-scenario-196","questionText":"印刷要求を到着順に処理するため、先に入れたデータを先に取り出す構造はどれですか。","choices":["スタック","ツリー","ハッシュ表","キュー"],"correctChoiceIndex":3,"explanation":"キューはFIFO（First In, First Out：先入れ先出し）のデータ構造です。印刷待ちや受付順の処理などに適しています。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"キュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-binary-197","questionText":"2進数の101と11を加算した結果はどれですか。","choices":["1000","110","111","1011"],"correctChoiceIndex":0,"explanation":"2進数101は10進数の5、2進数11は10進数の3なので、合計は8です。8を2進数で表すと1000です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"2進数加算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-search-comparison-198","questionText":"昇順に整列済みの100万件から値を探す処理を高速化したい。先頭から順番に調べる方法より適したものはどれですか。","choices":["毎回全件を並べ直してから探す","中央の値と比較して探索範囲を半分ずつ絞る","全件を複製してから探す","値を削除しながら探す"],"correctChoiceIndex":1,"explanation":"二分探索は、整列済みデータの中央と比較し、探索範囲を半分ずつ狭めます。件数が多いほど逐次探索より比較回数を大幅に減らせます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"二分探索","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-supervised-learning-199","questionText":"正解ラベル付きの過去データを使って、未知データの分類や数値予測を学習する方法はどれですか。","choices":["強化学習","教師なし学習","教師あり学習","ランダム探索"],"correctChoiceIndex":2,"explanation":"教師あり学習は、入力と正解ラベルの組を使って規則を学びます。分類や回帰に利用され、教師なし学習は正解ラベルなしで構造を見つけます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"教師あり学習","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-precision-200","questionText":"迷惑メールと判定した100件のうち、実際に迷惑メールだったものが80件だった。この判定の適合率はいくらですか。","choices":["20%","50%","100%","80%"],"correctChoiceIndex":3,"explanation":"適合率（Precision）は、陽性と判定した件数のうち実際に陽性だった割合です。80÷100＝80%となります。見逃しの少なさを測る再現率とは異なります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"AI評価指標","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-mission-201","questionText":"企業が社会で果たす役割や存在意義を簡潔に示すものはどれですか。","choices":["ミッション","予算実績表","組織図","作業手順書"],"correctChoiceIndex":0,"explanation":"ミッションは、企業の存在意義や社会で果たす役割を示します。将来に実現したい姿を示すビジョンとは役割が異なります。","category":"ストラテジ系","subcategory":"企業活動","topic":"ミッション","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-niche-202","questionText":"大企業が参入しにくい小規模な市場へ経営資源を集中し、独自の地位を築く戦略はどれですか。","choices":["無差別型戦略","ニッチ戦略","撤退戦略","垂直統合"],"correctChoiceIndex":1,"explanation":"ニッチ戦略は、特定の小規模市場に対象を絞り、専門性や独自性で競争優位を築く戦略です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ニッチ戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-cross-selling-203","questionText":"銀行口座の利用者へクレジットカードも提案するように、関連する別の商品を勧める販売方法はどれですか。","choices":["ダウンサイジング","アウトソーシング","クロスセル","クラウドファンディング"],"correctChoiceIndex":2,"explanation":"クロスセルは、購入済み・検討中の商品に関連する別の商品を提案する方法です。より上位の商品を勧めるアップセルとは異なります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"クロスセル","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-market-penetration-204","questionText":"既存の商品を既存の市場でさらに多く販売するため、利用頻度向上キャンペーンを行う戦略はどれですか。","choices":["市場開拓戦略","新製品開発戦略","多角化戦略","市場浸透戦略"],"correctChoiceIndex":3,"explanation":"市場浸透戦略は、既存市場で既存製品の販売を増やします。新市場へ既存製品を展開する市場開拓戦略とは異なります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"成長戦略","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-churn-rate-205","questionText":"定額サービスで月初の契約者が1,000人、月内の解約者が20人だった。顧客維持上、直接監視すべき指標はどれですか。","choices":["解約率","在庫回転率","自己資本比率","設備稼働率"],"correctChoiceIndex":0,"explanation":"解約率（チャーンレート）は、一定期間に顧客がサービスを解約した割合です。この例では20÷1,000＝2%です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"解約率","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-abc-analysis-206","questionText":"商品を年間売上高の大きい順に並べ、重要度に応じてA・B・Cの三つに分けて管理する手法はどれですか。","choices":["回帰分析","ABC分析","デルファイ法","親和図法"],"correctChoiceIndex":1,"explanation":"ABC分析は、売上高や在庫金額などの重要度で対象を分類し、重要なA群へ管理資源を重点配分する手法です。","category":"ストラテジ系","subcategory":"企業活動","topic":"ABC分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-basket-analysis-207","questionText":"POSデータから「商品Aを買う顧客は商品Bも買いやすい」という関係を見つけ、売場配置へ使う分析はどれですか。","choices":["感度分析","時系列分解","バスケット分析","構造化分析"],"correctChoiceIndex":2,"explanation":"バスケット分析は、同時に購入されやすい商品の組合せを購買データから見つけます。POSはPoint of Sale（販売時点情報管理）の略です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"バスケット分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-rfid-inventory-208","questionText":"倉庫で箱を一つずつ開けず、複数商品の識別情報を無線でまとめて読み取りたい。適した技術はどれですか。","choices":["バーコード","画像認識","磁気ストライプ","RFID"],"correctChoiceIndex":3,"explanation":"RFID（Radio Frequency Identification：無線周波数識別）は、タグの情報を電波で読み取ります。複数タグの一括読取りにも利用できます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"RFID活用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-bullwhip-209","questionText":"小売店の需要が少し増えただけなのに、卸売業者や製造業者へ伝わる発注量の変動が次第に大きくなった。この現象への対策として適切なものはどれですか。","choices":["販売・在庫情報を供給網の参加者で共有する","各社が他社の在庫情報を隠す","発注を年1回だけに制限する","需要予測を行わず最大量を常時生産する"],"correctChoiceIndex":0,"explanation":"需要変動が上流ほど増幅する現象はブルウィップ効果です。SCM（Supply Chain Management）で販売・在庫情報を共有し、過剰発注を抑えます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ブルウィップ効果","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-erp-master-210","questionText":"販売部と経理部が顧客名を別々に管理し、請求書の宛名不一致が頻発している。ERP導入で優先すべき対応はどれですか。","choices":["部門ごとの表記差を増やす","顧客マスタと更新ルールを全社で統合する","請求書だけを画像化する","顧客コードを毎月変更する"],"correctChoiceIndex":1,"explanation":"ERP（Enterprise Resource Planning：企業資源計画）では、業務と共通マスタを統合します。単に製品を導入するだけでなく、データ定義と更新責任をそろえることが重要です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ERPマスタ統合","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-crm-retention-211","questionText":"顧客の購入履歴や問合せ履歴を一元管理し、継続利用を促す活動を支援する仕組みはどれですか。","choices":["資材所要量計画システム","製図支援システム","CRM","名前解決システム"],"correctChoiceIndex":2,"explanation":"CRM（Customer Relationship Management：顧客関係管理）は、顧客情報を活用して関係を維持・強化する考え方や仕組みです。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客維持","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-bpr-redesign-212","questionText":"既存手順の部分修正ではなく、顧客価値を基準に部門をまたぐ業務を根本から再設計する取組はどれですか。","choices":["よくある質問集","私物端末利用","秘密保持契約","BPR"],"correctChoiceIndex":3,"explanation":"BPR（Business Process Re-engineering：業務プロセス再設計）は、業務の目的からプロセスを抜本的に見直します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務再設計","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-kgi-213","questionText":"事業の最終目標が達成できたかを測る指標はどれですか。","choices":["KGI","KPI","SLA","WBS"],"correctChoiceIndex":0,"explanation":"KGI（Key Goal Indicator：重要目標達成指標）は最終目標の達成度を測ります。KPI（Key Performance Indicator）は途中の活動、SLA（Service Level Agreement）はサービス品質、WBS（Work Breakdown Structure）は作業分解を扱います。","category":"ストラテジ系","subcategory":"企業活動","topic":"目標管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-leading-kpi-214","questionText":"売上を増やす目標に対し、結果が出る前に営業活動の進み具合を把握できる先行指標として適切なものはどれですか。","choices":["前年の確定売上高","商談件数","決算後の純利益","年度末の市場占有率"],"correctChoiceIndex":1,"explanation":"商談件数は将来の売上につながる活動を早期に把握できる先行KPIです。KPIはKey Performance Indicator（重要業績評価指標）の略です。","category":"ストラテジ系","subcategory":"企業活動","topic":"先行指標","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-ppm-cash-cow-215","questionText":"市場成長率は低いが市場占有率が高い事業について、PPM上の一般的な資金方針はどれですか。","choices":["市場から直ちに必ず撤退する","利益を無視して設備を無制限に増やす","大規模な追加投資を抑え、得た資金を他事業へ配分する","占有率を下げるため販売を停止する"],"correctChoiceIndex":2,"explanation":"PPM（Product Portfolio Management）で「金のなる木」に当たる事業は、安定した資金源として他の成長事業を支える役割が期待されます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PPM資金配分","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-swot-combination-216","questionText":"高い技術力という自社の強みを使い、市場拡大という外部の機会を取り込む方針は、SWOT分析のどの組合せですか。","choices":["弱みと脅威","弱みと機会","強みと脅威","強みと機会"],"correctChoiceIndex":3,"explanation":"強みと機会を組み合わせる方針は、自社の優位性を成長機会へ積極的に生かします。SWOTはStrength、Weakness、Opportunity、Threatの分析です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"クロスSWOT","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-pest-regulation-217","questionText":"新しい環境規制が自社事業へ与える影響を外部環境として整理するとき、該当する分析観点はどれですか。","choices":["政治的要因","技術的要因","社会的要因","経済的要因"],"correctChoiceIndex":0,"explanation":"法令や規制の変更はPEST分析のPolitical（政治的要因）に分類します。PESTは政治・経済・社会・技術の外部環境を整理します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PEST分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-cost-behavior-218","questionText":"生産量が増えると総額が増え、生産を止めると原則として発生しなくなる費用の例はどれですか。","choices":["本社建物の月額賃料","製品1個ごとの材料費","定額の保険料","固定給の役員報酬"],"correctChoiceIndex":1,"explanation":"材料費は生産量に応じて増減する変動費です。賃料など、操業量にかかわらず一定期間発生する費用は固定費です。","category":"ストラテジ系","subcategory":"企業活動","topic":"費用構造","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-operating-profit-calc-219","questionText":"売上高1,000万円、売上原価600万円、販売費及び一般管理費250万円のとき、営業利益はいくらですか。","choices":["400万円","650万円","150万円","850万円"],"correctChoiceIndex":2,"explanation":"営業利益は、売上高－売上原価－販売費及び一般管理費なので、1,000－600－250＝150万円です。","category":"ストラテジ系","subcategory":"企業活動","topic":"営業利益","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-break-even-sales-220","questionText":"固定費が240万円、変動費率が60%のとき、利益が0となる売上高はいくらですか。","choices":["144万円","240万円","400万円","600万円"],"correctChoiceIndex":3,"explanation":"限界利益率は1－0.60＝0.40です。損益分岐点売上高は240÷0.40＝600万円となります。","category":"ストラテジ系","subcategory":"企業活動","topic":"損益分岐点売上高","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-accounts-receivable-221","questionText":"商品を販売し、代金は翌月受け取る契約とした。販売時点で代金を受け取る権利を表す資産はどれですか。","choices":["売掛金","買掛金","借入金","資本金"],"correctChoiceIndex":0,"explanation":"売掛金は、商品やサービスを掛けで販売したときに将来代金を受け取る権利です。買掛金は仕入代金を将来支払う義務です。","category":"ストラテジ系","subcategory":"企業活動","topic":"売掛金","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-cash-flow-222","questionText":"企業の一定期間における現金及び現金同等物の増減を、活動別に示す財務諸表はどれですか。","choices":["貸借対照表","キャッシュフロー計算書","損益計算書","棚卸表"],"correctChoiceIndex":1,"explanation":"キャッシュフロー計算書は、現金の流れを営業・投資・財務活動などに分けて示します。利益と現金増減は必ずしも一致しません。","category":"ストラテジ系","subcategory":"企業活動","topic":"キャッシュフロー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-depreciation-223","questionText":"長期間使用する設備の取得費用を、使用期間にわたって費用配分する会計処理はどれですか。","choices":["棚卸減耗","引当金戻入","減価償却","債務免除"],"correctChoiceIndex":2,"explanation":"減価償却は、設備などの取得原価を耐用期間に配分して費用計上します。購入時に全額を一度に費用化する処理とは異なります。","category":"ストラテジ系","subcategory":"企業活動","topic":"減価償却","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-roa-comparison-224","questionText":"同じ利益を上げた企業AとBを比較したところ、AはBより総資産が少なかった。他の条件が同じならどちらのROAが高いですか。","choices":["総資産の大きい側","必ず同じ","売上高がないと一切判断できない","総資産の小さい側"],"correctChoiceIndex":3,"explanation":"ROA（Return on Assets：総資産利益率）は利益÷総資産で求めます。同じ利益なら、総資産が小さい企業Aの方が高くなります。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROA比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-trademark-renewal-225","questionText":"登録後も更新手続を繰り返すことで、権利を継続できる知的財産権はどれですか。","choices":["商標権","特許権","実用新案権","意匠権"],"correctChoiceIndex":0,"explanation":"商標権は更新登録により存続期間を繰り返し延長できます。商品名やロゴなど、商品・サービスを識別する標識を保護します。","category":"ストラテジ系","subcategory":"法務","topic":"商標権の更新","difficulty":2,"source":"特許庁「商標制度の概要」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-patent-disclosure-226","questionText":"新しい発明について特許出願を検討している。出願前の対応として最も適切なものはどれですか。","choices":["先に詳細を広く公開してから検討する","公開や販売の前に出願方針を確認する","発明者名を削除すれば出願不要とする","他社へ無条件で図面を配布する"],"correctChoiceIndex":1,"explanation":"出願前の公開は新規性の判断に影響する可能性があります。発明を公表・販売する前に、秘密管理と出願方針を確認します。","category":"ストラテジ系","subcategory":"法務","topic":"特許出願","difficulty":2,"source":"特許庁「特許制度の概要」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-work-made-for-hire-227","questionText":"会社の企画に基づき、従業員が職務としてプログラムを作成した場合、一定の要件の下で会社が著作者となる制度はどれですか。","choices":["裁定実施権","先使用権","職務著作","団体商標"],"correctChoiceIndex":2,"explanation":"職務著作（法人著作）は、法人等の発意に基づき、その業務に従事する者が職務上作成した著作物について、契約や就業規則等に別段の定めがなければ法人等を著作者とする制度です。プログラムの著作物では、法人等の著作名義で公表する要件は不要です。","category":"ストラテジ系","subcategory":"法務","topic":"職務著作","difficulty":2,"source":"文化庁「著作権制度に関する情報」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-trade-secret-228","questionText":"製造ノウハウを営業秘密として保護するための管理として最も適切なものはどれですか。","choices":["誰でも閲覧できる共有場所へ置く","秘密であることを従業員へ知らせない","退職者の権限を残したままにする","秘密情報だと分かる表示とアクセス制限を行う"],"correctChoiceIndex":3,"explanation":"営業秘密には秘密管理性、有用性、非公知性が必要です。秘密表示やアクセス制御などで、秘密として管理する意思を明確にします。","category":"ストラテジ系","subcategory":"法務","topic":"営業秘密管理","difficulty":2,"source":"経済産業省「営業秘密管理指針」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-personal-data-purpose-229","questionText":"通販会社が商品の配送目的で取得した住所を、自社の別商品の広告発送にも利用しようとしている。最初に確認すべきことはどれですか。","choices":["特定・通知した利用目的の範囲内か","入力画面の文字サイズ","配送箱の色","サーバラックの高さ"],"correctChoiceIndex":0,"explanation":"個人情報は、特定した利用目的の達成に必要な範囲で扱うのが原則です。まず、特定・通知した利用目的の範囲内かを確認し、その範囲を超えて利用する場合は法令上必要な対応を確認します。","category":"ストラテジ系","subcategory":"法務","topic":"個人情報の利用目的","difficulty":3,"source":"個人情報保護委員会「個人情報保護法ガイドライン」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-internal-control-230","questionText":"発注担当者が取引先登録、発注、検収、支払承認まで一人で行っている。不正防止の観点で最も適切な改善はどれですか。","choices":["全権限を同じ担当者へ追加する","権限を分け、相互確認する","承認記録を残さない","取引先確認を廃止する"],"correctChoiceIndex":1,"explanation":"職務分掌により、取引の開始・承認・記録・資産管理などを分けます。相互牽制が働き、不正や誤りの発見可能性が高まります。","category":"ストラテジ系","subcategory":"企業活動","topic":"職務分掌","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-compliance-reporting-231","questionText":"法令違反の疑いを従業員が安心して相談・通報できるよう企業が整備する窓口はどれですか。","choices":["広告受付窓口","製品注文窓口","内部通報窓口","株式売買窓口"],"correctChoiceIndex":2,"explanation":"内部通報窓口は、法令違反や不正の早期発見・是正に役立ちます。通報者の保護や適切な調査手順も重要です。","category":"ストラテジ系","subcategory":"法務","topic":"内部通報制度","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-rfp-contents-232","questionText":"発注候補企業へ、システム化の目的や要件、提案条件を示して提案を依頼する文書はどれですか。","choices":["RFI","RFC","SOW","RFP"],"correctChoiceIndex":3,"explanation":"RFP（Request for Proposal：提案依頼書）は具体的な提案を求めます。RFIはRequest for Information、RFCはRequest for Change、SOWはStatement of Workの略です。","category":"ストラテジ系","subcategory":"システム企画","topic":"提案依頼","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-poc-233","questionText":"新技術を本格導入する前に、小規模な試行で実現性や効果を確かめる取組はどれですか。","choices":["概念実証","事業継続計画","サービスレベル合意","出来高管理"],"correctChoiceIndex":0,"explanation":"概念実証（PoC：Proof of Concept）は、限定した範囲で技術やアイデアが成立するかを確かめ、導入判断の材料にします。","category":"ストラテジ系","subcategory":"システム企画","topic":"概念実証","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-dx-business-model-234","questionText":"紙の申請書をそのまま電子化するだけでなく、申請不要のサービスへ業務と顧客体験を変える取組の説明として適切なものはどれですか。","choices":["紙をPDFへ変換する作業だけ","デジタル技術を使った業務・価値提供の変革","既存手順を一切変えない機器更新","部署名だけを変更する組織改編"],"correctChoiceIndex":1,"explanation":"DX（Digital Transformation）は、デジタル技術とデータで業務や組織、製品・サービス、価値提供を変革します。単なる電子化より広い取組です。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"DXによる変革","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-goal-indicator-235","questionText":"「年度末の会員数10万人」を最終目標とするとき、途中の改善状況を月次で把握する指標として適切なものはどれですか。","choices":["年度末に確定する会員総数だけ","事務所の座席数","月間の新規登録者数","サーバの製造番号"],"correctChoiceIndex":2,"explanation":"月間新規登録者数はKPI（Key Performance Indicator：重要業績評価指標）です。最終的な会員数はKGI（Key Goal Indicator：重要目標達成指標）として扱えます。","category":"ストラテジ系","subcategory":"企業活動","topic":"KPIとKGI","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-work-package-236","questionText":"WBSで、担当者・期間・費用などを見積もって管理できる程度まで分解した作業単位はどれですか。","choices":["マイルストーン","プロジェクト憲章","サービスカタログ","ワークパッケージ"],"correctChoiceIndex":3,"explanation":"ワークパッケージは、WBS（Work Breakdown Structure）の下位で管理可能な作業単位です。担当や成果物、工数を明確にします。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ワークパッケージ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-gantt-dependency-237","questionText":"横軸を時間として作業期間や進捗を一覧表示できるが、複雑な作業依存関係の把握には工夫が必要な図はどれですか。","choices":["ガントチャート","散布図","管理図","レーダチャート"],"correctChoiceIndex":0,"explanation":"ガントチャートは作業を縦軸、時間を横軸にして期間や進捗を示します。依存関係やクリティカルパスの分析にはアローダイアグラムなども使います。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"工程表の特性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-scope-creep-238","questionText":"正式な承認を経ない小さな要求追加が積み重なり、プロジェクトの作業範囲が拡大し続ける状態はどれですか。","choices":["フェールセーフ","スコープクリープ","ベンチマーキング","ロードバランシング"],"correctChoiceIndex":1,"explanation":"スコープクリープは、管理されない要求変更で作業範囲が徐々に拡大する状態です。変更要求を評価し、承認後に計画へ反映します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"スコープクリープ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-critical-path-calc-239","questionText":"開始から終了までに経路Aが4日＋5日、経路Bが3日＋8日、経路Cが6日＋2日の作業で構成される。最短完了日数はいくらですか。","choices":["8日","9日","11日","28日"],"correctChoiceIndex":2,"explanation":"並行する経路のうち最長の経路がクリティカルパスです。Aは9日、Bは11日、Cは8日なので、最短完了日数は11日です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"クリティカルパス計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-evm-schedule-240","questionText":"ある時点のPVが100万円、EVが80万円だった。EVMによる進捗の評価として適切なものはどれですか。","choices":["計画より20万円分進んでいる","予算を20万円超過していると断定できる","進捗は計画どおりである","計画より20万円分遅れている"],"correctChoiceIndex":3,"explanation":"SV（Schedule Variance）はEV－PV＝80－100＝－20万円です。EVはEarned Value、PVはPlanned Value、EVMはEarned Value Managementの略です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVM進捗差異","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-risk-register-241","questionText":"プロジェクトで特定したリスク、発生確率、影響、対応策、担当者を一覧管理する文書はどれですか。","choices":["リスク登録簿","出勤簿","仕訳帳","サービスカタログ"],"correctChoiceIndex":0,"explanation":"リスク登録簿は、特定したリスクと評価、対応、所有者などを記録し、継続的な監視に使います。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク登録簿","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-quality-control-242","questionText":"完成した成果物を測定・検査し、定めた品質基準を満たすか確認する活動はどれですか。","choices":["資金調達","品質管理","市場開拓","人事評価"],"correctChoiceIndex":1,"explanation":"品質管理は、成果物を検査・測定して基準への適合を確認します。品質保証は、適切なプロセスが採用・実施されているかに重点を置きます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"品質管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-incident-restoration-243","questionText":"サービス停止が発生したとき、原因の恒久対策より先に通常サービスの早期復旧を目指す活動はどれですか。","choices":["需要管理","予算管理","インシデント管理","調達管理"],"correctChoiceIndex":2,"explanation":"インシデント管理は、サービスをできるだけ早く正常状態へ戻すことを重視します。根本原因の特定と再発防止は問題管理が担います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス復旧","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-evm-cost-244","questionText":"EVが120万円、ACが150万円のとき、EVMによるコスト差異の評価として適切なものはどれですか。","choices":["30万円のコスト節約","270万円のコスト超過","コストは計画どおり","30万円のコスト超過"],"correctChoiceIndex":3,"explanation":"CV（Cost Variance）はEV－AC＝120－150＝－30万円です。EVはEarned Value、ACはActual Cost（実コスト）で、負のためコスト超過です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVMコスト差異","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-change-control-245","questionText":"承認済みの要件に変更要求が出たとき、プロジェクトで最初に行う対応として適切なものはどれですか。","choices":["影響を評価して正式な承認手続へ回す","担当者の判断だけで即時実装する","要求者へ知らせず削除する","既存計画を記録せず上書きする"],"correctChoiceIndex":0,"explanation":"変更要求は、スコープ・期間・費用・品質・リスクへの影響を評価し、定めた権限者が承認または却下します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"統合変更管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-risk-priority-246","questionText":"発生確率と影響度が高いリスクに対し、追加の確認工程を設けて発生可能性を下げる対応を行う。このリスク対応として最も適切なものはどれですか。","choices":["リスク受容（保有）","リスク軽減","リスク移転","リスク回避"],"correctChoiceIndex":1,"explanation":"リスク軽減は、対策によってリスクの発生確率や影響を小さくする対応です。リスク回避は原因となる活動自体をやめるなどして避け、リスク移転は保険や契約などで影響の一部を他者へ移し、リスク受容はリスクを認識した上で受け入れます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク対応戦略","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-defect-density-247","questionText":"規模の異なる二つのプログラムの品質を、不具合件数だけでなく規模を考慮して比較する指標はどれですか。","choices":["売上高利益率","在庫回転率","欠陥密度","クリック率"],"correctChoiceIndex":2,"explanation":"欠陥密度は、コード行数や機能規模当たりの欠陥件数です。規模の異なる成果物を比較しやすくします。","category":"マネジメント系","subcategory":"システム開発技術","topic":"欠陥密度","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-retrospective-248","questionText":"短い開発期間の終了時に、チームが良かった点と改善点を振り返り、次の進め方を決める活動はどれですか。","choices":["デイリースクラム","プロダクトレビュー","要求凍結","レトロスペクティブ"],"correctChoiceIndex":3,"explanation":"レトロスペクティブ（振り返り）は、チームの仕事の進め方を検査し、次の期間で試す改善策を決めます。成果物の確認とは目的が異なります。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"レトロスペクティブ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-availability-calc-249","questionText":"1か月720時間のうち、障害による停止が合計7.2時間だった。サービスの稼働率はいくらですか。","choices":["99%","1%","90%","99.9%"],"correctChoiceIndex":0,"explanation":"稼働時間は720－7.2＝712.8時間なので、稼働率は712.8÷720×100＝99%です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"稼働率計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-configuration-baseline-250","questionText":"本番障害後に、どのプログラム版と設定値が稼働していたか分からなかった。再発防止として最も適切なものはどれですか。","choices":["設定変更を口頭だけで共有する","構成項目の版と変更履歴を一元管理する","全ての版を同じ名前で保存する","障害記録を削除する"],"correctChoiceIndex":1,"explanation":"構成管理では、ハードウェア、ソフトウェア、文書、設定などの構成項目と版、関係、変更履歴を識別・管理します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"構成ベースライン","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-service-request-251","questionText":"パスワード再設定や標準ソフトウェアの利用申請など、定型的な利用者依頼を受け付けて処理する活動はどれですか。","choices":["問題管理","可用性管理","サービス要求管理","財務管理"],"correctChoiceIndex":2,"explanation":"サービス要求管理は、定型的な情報提供、アクセス申請、標準サービスの依頼などを受け付け、定めた手順で処理します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス要求管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-sla-target-252","questionText":"サービス提供者と利用者が、稼働率や応答時間などの目標を合意する文書はどれですか。","choices":["提案依頼書","作業分解構成図","モデリング言語","サービスレベル合意書"],"correctChoiceIndex":3,"explanation":"サービスレベル合意書（SLA：Service Level Agreement）は、測定可能なサービス品質目標や責任分担などを合意します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービスレベル目標","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-audit-trail-253","questionText":"システム上で誰が、いつ、どのデータを変更したかを後から追跡するために残す記録はどれですか。","choices":["監査証跡","画面設計書","販売予測","組織図"],"correctChoiceIndex":0,"explanation":"監査証跡は、処理や操作を後から追跡・検証できる記録です。利用者ID、日時、操作内容、変更前後の値などを記録します。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証跡","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-auditor-independence-254","questionText":"自分が設計・運用したアクセス管理を、自分自身で監査するよう依頼された。監査の信頼性を保つ対応はどれですか。","choices":["設計者が無条件で適合と判定する","対象業務から独立した監査人へ変更する","監査範囲を記録せず縮小する","証拠を収集せず口頭で終了する"],"correctChoiceIndex":1,"explanation":"監査人は、監査対象から外観上・精神上独立している必要があります。自ら担当した業務の自己監査は客観性を損ないます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査人の独立性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"management-service-continuity-255","questionText":"大規模災害で主要拠点が使えない場合にも、合意した時間内に重要ITサービスを再開するため、事前に行うべきことはどれですか。","choices":["障害発生後に初めて担当者を決める","バックアップを同じ故障点だけに置く","復旧手順と代替資源を準備して定期的に訓練する","復旧目標を利用者へ知らせない"],"correctChoiceIndex":2,"explanation":"ITサービス継続管理では、事業影響を踏まえた復旧目標を定め、代替拠点・バックアップ・連絡・復旧手順を準備し、訓練で実効性を確認します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ITサービス継続","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-instruction-cycle-256","questionText":"CPUが命令を主記憶から取り出し、内容を解釈して実行する一連の流れとして適切なものはどれですか。","choices":["圧縮、暗号化、送信","入力、印刷、廃棄","認証、課金、監査","取出し、解読、実行"],"correctChoiceIndex":3,"explanation":"CPU（Central Processing Unit：中央処理装置）は、命令の取出し（フェッチ）、解読（デコード）、実行を繰り返します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"命令サイクル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-clock-frequency-257","questionText":"プロセッサのクロック周波数を表す単位はどれですか。","choices":["Hz","B","dpi","lm"],"correctChoiceIndex":0,"explanation":"Hz（hertz：ヘルツ）は1秒当たりの周期数を表します。GHzなら10億周期毎秒です。実際の性能はクロック周波数だけでは決まりません。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"クロック周波数","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-register-258","questionText":"CPU内部にあり、演算対象や命令、アドレスなどを一時的に保持する高速な記憶領域はどれですか。","choices":["磁気テープ","レジスタ","光学ディスク","外付けSSD"],"correctChoiceIndex":1,"explanation":"レジスタはCPU（Central Processing Unit：中央処理装置）の内部にあり、演算対象や処理中の値を高速に保持します。SSDはSolid State Driveの略です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"レジスタ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-cpi-calc-259","questionText":"1GHzのCPUで、1命令の実行に平均2クロック必要な場合、理論上1秒間に実行できる命令数はどれですか。","choices":["2億命令","10億命令","5億命令","20億命令"],"correctChoiceIndex":2,"explanation":"1GHz（gigahertz）は10億クロック毎秒です。1命令当たり2クロックなので、10億÷2＝5億命令毎秒です。CPUはCentral Processing Unitの略です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"CPU性能計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-cache-time-calc-260","questionText":"キャッシュのアクセス時間が2ns、主記憶が42ns、ヒット率が90%である。主記憶アクセス時にも最初の2nsを要するとき、平均アクセス時間はいくらですか。","choices":["4.0ns","42.0ns","44.0ns","6.2ns"],"correctChoiceIndex":3,"explanation":"平均は2×0.9＋(2＋42)×0.1＝1.8＋4.4＝6.2nsです。nsはnanosecond（ナノ秒）です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"平均アクセス時間","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-virtual-memory-261","questionText":"仮想記憶を利用しているとき、CPUが必要としたページが主記憶上に存在しない場合に発生するものはどれですか。","choices":["ページフォールト","デッドロック","オーバーフロー","チェックサム"],"correctChoiceIndex":0,"explanation":"仮想記憶では、必要なページを主記憶へ読み込んで利用します。CPU（Central Processing Unit：中央処理装置）が必要としたページが主記憶にないとページフォールトが発生し、OS（Operating System：基本ソフトウェア）が補助記憶からそのページを読み込みます。補助記憶へのアクセスは主記憶より遅いため、ページフォールトが頻発すると性能低下につながります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ページフォールト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-ssd-trim-262","questionText":"OSがSSDへ不要になったデータ領域を通知し、将来の書込み効率維持を助ける機能はどれですか。","choices":["RAID","TRIM","SPOOL","POST"],"correctChoiceIndex":1,"explanation":"TRIMは、OS（Operating System）が削除済み領域をSSD（Solid State Drive）へ知らせ、内部の消去・書込み管理を助けます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"TRIM","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-lossless-compression-263","questionText":"展開後に元のデータを完全に復元できる圧縮方式はどれですか。","choices":["非可逆圧縮","量子化","可逆圧縮","標本化"],"correctChoiceIndex":2,"explanation":"可逆圧縮は展開時に元データを完全復元できます。文書やプログラムなど、情報を失えないデータに適しています。","category":"テクノロジ系","subcategory":"基礎理論","topic":"可逆圧縮","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-raid10-264","questionText":"ディスクをミラー化した組に分け、その複数組へデータを分散して速度と耐障害性を両立する方式はどれですか。","choices":["RAID 0","RAID 1","RAID 5","RAID 10"],"correctChoiceIndex":3,"explanation":"RAID 10はミラーリングとストライピングを組み合わせます。RAIDはRedundant Array of Independent Disksの略です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID 10","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-round-robin-265","questionText":"複数の実行可能なプロセスへ一定時間ずつ順番にCPUを割り当てる方式はどれですか。","choices":["ラウンドロビン","先着順販売","排他的論理和","二分探索"],"correctChoiceIndex":0,"explanation":"ラウンドロビン方式は、各プロセスへタイムクォンタムと呼ぶ一定時間を順番に割り当てます。対話型処理などで公平性を確保しやすい方式です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"プロセススケジューリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-semaphore-266","questionText":"複数プロセスが共有資源を同時利用しないよう、利用可能数をカウンタで管理する仕組みはどれですか。","choices":["コンパイラ","セマフォ","デコーダ","スキャナ"],"correctChoiceIndex":1,"explanation":"セマフォは、共有資源を利用できる数を管理し、プロセス間の同期や排他制御に使います。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"セマフォ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-unicode-267","questionText":"世界各国の文字へ共通の符号位置を割り当て、異なる環境での文字交換を容易にする文字コード体系はどれですか。","choices":["画像圧縮方式","ディスク冗長化方式","Unicode","通信制御方式"],"correctChoiceIndex":2,"explanation":"Unicodeは、多くの言語の文字を統一的に扱う文字コード体系です。UTF-8などはUnicodeの符号化方式です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"Unicode","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-foreign-key-integrity-268","questionText":"注文表の顧客IDに、顧客表に存在しない値が登録されることを防ぐために設定するものはどれですか。","choices":["表示形式","圧縮率","文字サイズ","外部キー制約"],"correctChoiceIndex":3,"explanation":"外部キー制約は、参照先の主キーなどに存在する値だけを登録できるようにし、表同士の参照整合性を保ちます。","category":"テクノロジ系","subcategory":"データベース","topic":"参照整合性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-second-normal-form-269","questionText":"受注明細表の主キーが注文IDと商品IDの組で、注文日が注文IDだけに依存している。この表を第2正規形にする対応はどれですか。","choices":["注文IDと注文日を注文表へ分離する","注文日を全行から削除して保存しない","商品IDを固定値にする","全列を一つの文字列へ結合する"],"correctChoiceIndex":0,"explanation":"複合主キーの一部だけに依存する列を別表へ分離し、部分関数従属をなくすと第2正規形になります。","category":"テクノロジ系","subcategory":"データベース","topic":"第2正規形","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-dirty-read-270","questionText":"トランザクションAが更新後まだ確定していない値をBが読み、その後Aが取消した。Bが読んだ現象はどれですか。","choices":["ロストパケット","ダーティリード","キャッシュヒット","デッドコード"],"correctChoiceIndex":1,"explanation":"ダーティリードは、他のトランザクションがまだコミットしていない値を読み取る現象です。適切な分離レベルで防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"ダーティリード","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-sql-having-271","questionText":"SQLでグループ化・集計した結果に対して条件を指定する句はどれですか。","choices":["VALUES","GRANT","HAVING","COMMIT"],"correctChoiceIndex":2,"explanation":"HAVING句はGROUP BYでまとめた集計結果を絞り込みます。SQLはStructured Query Languageの略です。","category":"テクノロジ系","subcategory":"データベース","topic":"HAVING句","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-differential-backup-272","questionText":"直近のフルバックアップ以降に変更された全データを毎回保存する方式はどれですか。","choices":["増分バックアップ","完全消去","ミラーリング","差分バックアップ"],"correctChoiceIndex":3,"explanation":"差分バックアップは、直近のフルバックアップからの変更を保存します。増分バックアップは直前のバックアップ以降の変更だけを保存します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"差分バックアップ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-ipv6-bits-273","questionText":"IPv6アドレスの長さは何ビットですか。","choices":["128ビット","32ビット","48ビット","64ビット"],"correctChoiceIndex":0,"explanation":"IPv6（Internet Protocol version 6）のアドレス長は128ビットです。IPv4（Internet Protocol version 4）は32ビットです。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv6アドレス長","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-database-deadlock-274","questionText":"二つのトランザクションが互いに相手の保持するロック解除を待ち、処理が進まなくなった状態はどれですか。","choices":["ロールフォワード","デッドロック","フェイルオーバ","スワッピング"],"correctChoiceIndex":1,"explanation":"デッドロックは、複数処理が互いに必要な資源を保持したまま待ち合う状態です。ロック順序の統一やタイムアウトなどで対処します。","category":"テクノロジ系","subcategory":"データベース","topic":"DBデッドロック","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-cidr-hosts-275","questionText":"IPv4の/29ネットワークで、ネットワークアドレスとブロードキャストアドレスを除き、一般に端末へ割り当てられるアドレス数はいくつですか。","choices":["4個","8個","6個","30個"],"correctChoiceIndex":2,"explanation":"IPv4（Internet Protocol version 4）の/29ではホスト部が3ビットなので全体は8個です。ネットワーク用とブロードキャスト用を除き、一般に6個を割り当てられます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"CIDR計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-tcp-handshake-276","questionText":"TCPで通信開始前に接続を確立するために行う手順はどれですか。","choices":["公開鍵の失効","巡回冗長検査","名前解決だけ","3ウェイハンドシェイク"],"correctChoiceIndex":3,"explanation":"TCP（Transmission Control Protocol）は、SYN、SYN-ACK、ACKの交換による3ウェイハンドシェイクで接続を確立します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"TCP接続確立","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-dhcp-lease-277","questionText":"端末へ割り当てたIPアドレスを一定期間だけ利用可能とし、期限後に再利用できるようにするDHCPの仕組みはどれですか。","choices":["リース","ハッシュ","トンネリング","ミラーリング"],"correctChoiceIndex":0,"explanation":"DHCP（Dynamic Host Configuration Protocol）は、IPアドレスなどの設定をリース期間付きで自動割当てします。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DHCPリース","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-dns-ttl-278","questionText":"DNS応答をキャッシュに保持してよい時間を示し、変更反映までの時間にも影響する値はどれですか。","choices":["MTBF","TTL","CPI","RPO"],"correctChoiceIndex":1,"explanation":"TTL（Time To Live）は、DNS（Domain Name System）の情報をキャッシュできる時間です。長いほど問合せは減りますが変更反映は遅くなります。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DNSキャッシュ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-transfer-time-279","questionText":"圧縮後80MBのファイルを、実効速度40Mbit/sの回線で送る。通信上の追加時間を無視した転送時間は何秒ですか。","choices":["2秒","8秒","16秒","20秒"],"correctChoiceIndex":2,"explanation":"80MBは640Mbitです。640÷40＝16秒となります。1byte＝8bitとして計算します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"転送時間計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-series-availability-280","questionText":"稼働率99%の装置を二台直列に接続し、両方の稼働が必要である。独立故障とすると全体の稼働率はどれですか。","choices":["99%","99.5%","99.99%","98.01%"],"correctChoiceIndex":3,"explanation":"直列システムは両方が稼働する必要があるため、0.99×0.99＝0.9801、つまり98.01%です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"直列システム稼働率","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-https-purpose-281","questionText":"Webブラウザとサーバ間の通信を暗号化し、サーバ認証にも証明書を使う仕組みはどれですか。","choices":["HTTPS","ファイル転送方式","アドレス自動設定方式","ネットワーク監視方式"],"correctChoiceIndex":0,"explanation":"HTTPS（Hypertext Transfer Protocol Secure）は、TLS（Transport Layer Security）を使ってHTTP通信を暗号化し、証明書で接続先を確認します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTPSの役割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-lookalike-domain-282","questionText":"正規サイトに似たつづりのドメイン名へ誘導し、認証情報を入力させる手口への確認として有効なものはどれですか。","choices":["画面の色だけで正規サイトと判断する","リンク先のドメイン名を注意深く確認する","警告を全て無視する","同じパスワードを複数サイトで使う"],"correctChoiceIndex":1,"explanation":"見た目だけでなく、URLのドメイン名や証明書警告を確認します。ブックマークや公式アプリからアクセスすることも有効です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"類似ドメイン","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-public-wifi-283","questionText":"暗号化されていない公衆無線LANで機密情報を扱うときの対応として適切なものはどれですか。","choices":["端末の共有設定を有効にする","証明書警告を無視する","信頼できるVPNなど安全な経路を利用する","機密ファイルを公開フォルダへ置く"],"correctChoiceIndex":2,"explanation":"公衆無線LANでは盗聴や偽アクセスポイントの危険があります。VPN（Virtual Private Network）など信頼できる暗号化経路を利用します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"公衆無線LAN","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-paas-responsibility-284","questionText":"PaaSを利用してアプリを開発するとき、一般に利用者側が主に管理するものはどれですか。","choices":["データセンタ建物","物理サーバの交換","基盤の電源設備","作成したアプリケーションとデータ"],"correctChoiceIndex":3,"explanation":"PaaS（Platform as a Service）では、提供者がOS（Operating System）や実行基盤を管理し、利用者は主にアプリケーションとデータを管理します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"PaaS責任分担","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-autoscaling-285","questionText":"アクセス数の増減に応じて、クラウド上のサーバ台数を自動的に増減させる機能はどれですか。","choices":["オートスケーリング","デフラグメンテーション","チェックサム","データマスキング"],"correctChoiceIndex":0,"explanation":"オートスケーリングは、負荷指標などに応じて計算資源を自動増減し、性能確保とコスト最適化を支援します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"オートスケーリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-container-286","questionText":"ホストOSのカーネルを共有しながら、アプリケーションと依存ライブラリを隔離して実行する技術はどれですか。","choices":["磁気テープ","コンテナ","アナログ回線","データウェアハウス"],"correctChoiceIndex":1,"explanation":"コンテナはホストOSのカーネルを共有するため、各環境がゲストOSを持つ仮想マシンより軽量に起動できます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"コンテナ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-snapshot-risk-287","questionText":"仮想マシンのスナップショットについて、運用上の説明として適切なものはどれですか。","choices":["取得すれば物理障害でも必ず復旧できる","保存先障害の影響を絶対に受けない","長期保管する独立バックアップの代用とは限らない","容量や性能への影響は一切ない"],"correctChoiceIndex":2,"explanation":"スナップショットは特定時点へ戻すのに便利ですが、元ストレージへの依存や性能・容量への影響があります。別媒体のバックアップも必要です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"スナップショット運用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-symmetric-key-288","questionText":"共通鍵暗号を離れた相手と使い始める際の主な課題はどれですか。","choices":["暗号化と復号で必ず別の鍵を使う","公開情報だけで復号できる","ハッシュ値から元データを必ず復元する","同じ秘密鍵を安全に共有する必要がある"],"correctChoiceIndex":3,"explanation":"共通鍵暗号では暗号化と復号に同じ秘密鍵を使うため、その鍵を盗まれずに相手へ共有する方法が課題です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"共通鍵配送","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-public-key-scenario-289","questionText":"受信者だけが読めるよう送信者が公開鍵暗号で文書を暗号化する。暗号化と復号に使う鍵の組合せはどれですか。","choices":["受信者の公開鍵で暗号化し、受信者の秘密鍵で復号する","送信者の秘密鍵で暗号化し、誰の公開鍵でも復号する","受信者の秘密鍵を全員へ配って暗号化する","同じ公開鍵だけで暗号化と復号を行う"],"correctChoiceIndex":0,"explanation":"機密性を確保する場合、誰でも入手できる受信者の公開鍵で暗号化し、受信者だけが持つ秘密鍵で復号します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"公開鍵による機密性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-hash-integrity-290","questionText":"配布前後のファイルについて同じハッシュ関数の値を比較したところ一致しなかった。最も適切な判断はどれですか。","choices":["ファイル内容が必ず秘密に保たれた","ファイル内容が変化した可能性がある","送信者の本人確認が必ず完了した","元ファイルをハッシュ値から復元できる"],"correctChoiceIndex":1,"explanation":"ハッシュ値の不一致は内容が変化した可能性を示します。ハッシュ単独では送信者認証や機密性は保証しません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ハッシュによる完全性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-signature-purpose-291","questionText":"文書の作成者確認と、署名後に内容が変更されていないことの確認に使う技術はどれですか。","choices":["データ圧縮","負荷分散","デジタル署名","画面ロック"],"correctChoiceIndex":2,"explanation":"デジタル署名は、署名者の秘密鍵と検証側の公開鍵を使い、署名者の確認と改ざん検知を支援します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"署名検証","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-mfa-factors-292","questionText":"知識情報と所持情報を組み合わせた多要素認証の例はどれですか。","choices":["パスワードと暗証番号","指紋と顔認証","セキュリティキーとICカード","パスワードとセキュリティキー"],"correctChoiceIndex":3,"explanation":"パスワードは知識情報、セキュリティキーは所持情報です。MFA（Multi-Factor Authentication：多要素認証）は異なる種類の要素を組み合わせます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"認証要素","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-biometric-frr-293","questionText":"生体認証で、本人であるにもかかわらず誤って拒否される割合はどれですか。","choices":["本人拒否率","他人受入率","稼働率","圧縮率"],"correctChoiceIndex":0,"explanation":"本人拒否率（FRR：False Rejection Rate）は本人を拒否する割合です。他人受入率（FAR）は他人を本人として受け入れる割合です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"本人拒否率","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-ransomware-response-294","questionText":"端末で身代金要求画面が表示され、ランサムウェア感染が疑われる。被害拡大を抑える初動として適切なものはどれですか。","choices":["共有フォルダを開いて動作確認する","組織の手順に従ってネットワークから隔離し報告する","証拠を残さず全ログを削除する","感染端末から全社員へファイルを送る"],"correctChoiceIndex":1,"explanation":"ランサムウェア感染時は、組織の手順に従い端末をネットワークから隔離して報告し、証拠保全と影響範囲の確認を行います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ランサムウェア初動","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-phishing-check-295","questionText":"取引先を名乗るメールが「今すぐ新しい口座へ振り込め」と要求している。最も適切な確認方法はどれですか。","choices":["メール記載の番号だけへ電話する","添付ファイルを先に実行する","既知の連絡先へ別経路で確認する","送信者名の表示だけを信頼する"],"correctChoiceIndex":2,"explanation":"不審な支払変更は、メール内の連絡先ではなく、登録済み電話番号など独立した経路で本人・取引先へ確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ビジネスメール詐欺対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-ips-blocking-296","questionText":"ネットワークを通過する通信を監視し、攻撃と判断した通信を自動的に遮断する装置はどれですか。","choices":["侵入検知システム","ログ統合分析システム","プロキシサーバ","侵入防止システム"],"correctChoiceIndex":3,"explanation":"侵入防止システム（IPS：Intrusion Prevention System）は攻撃を検知して遮断します。侵入検知システム（IDS）は主に検知と通知を行います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"IPSの遮断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-waf-297","questionText":"WebアプリケーションへのSQLインジェクションやクロスサイトスクリプティングなどを、HTTP通信の内容から検知・遮断する仕組みはどれですか。","choices":["WAF","無停電電源装置","アドレス変換装置","アドレス自動設定サーバ"],"correctChoiceIndex":0,"explanation":"WAF（Web Application Firewall）は、Webアプリケーション層の通信を検査し、代表的なWeb攻撃を防御します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"WAF","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-remote-vpn-298","questionText":"在宅勤務端末から社内システムへ接続するとき、インターネット上に暗号化した通信経路を作る技術はどれですか。","choices":["文字認識装置","VPN","ディスク冗長化装置","ファームウェア設定"],"correctChoiceIndex":1,"explanation":"VPN（Virtual Private Network：仮想私設網）は、認証と暗号化を用いて公衆網上に安全な通信経路を構築します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"リモートアクセスVPN","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-linear-search-calc-299","questionText":"未整列の100件を先頭から逐次探索する。探す値が最後にある場合、値の比較回数は最大何回ですか。","choices":["1回","7回","100回","50回"],"correctChoiceIndex":2,"explanation":"逐次探索は先頭から一件ずつ比較するため、最後の要素にある場合は100回比較します。データが整列済みなら二分探索も検討できます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"逐次探索計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"technology-boolean-calc-300","questionText":"論理値Aが真、Bが偽のとき、式「A AND (NOT B)」の結果はどれですか。","choices":["偽","未定義","常に0と1の両方","真"],"correctChoiceIndex":3,"explanation":"NOT Bは真です。したがって、真AND真となり結果は真です。ANDは両方が真のときだけ真になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"論理演算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-24T00:00:00+09:00","updatedAt":"2026-08-24T00:00:00+09:00"},{"id":"strategy-contribution-margin-ratio-301","questionText":"売上高が1,000万円、変動費が600万円のとき、限界利益率は何%ですか。","choices":["40%","20%","60%","160%"],"correctChoiceIndex":0,"explanation":"限界利益は1,000－600＝400万円なので、限界利益率は400÷1,000×100＝40%です。","category":"ストラテジ系","subcategory":"企業活動","topic":"限界利益率計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-fixed-cost-decision-302","questionText":"月間生産量が増減しても、契約期間中の支払額が原則として変わらない費用はどれですか。","choices":["製品1個ごとの材料費","工場建物の月額賃料","出荷1件ごとの運賃","販売額に比例する手数料"],"correctChoiceIndex":1,"explanation":"賃料は生産量に左右されにくい固定費です。材料費や従量運賃、歩合手数料は変動費です。","category":"ストラテジ系","subcategory":"企業活動","topic":"固定費判定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-inventory-turnover-calc-303","questionText":"年間売上原価が2,400万円、平均棚卸資産が400万円だった。棚卸資産回転率は何回ですか。","choices":["4回","8回","6回","12回"],"correctChoiceIndex":2,"explanation":"棚卸資産回転率は売上原価÷平均棚卸資産で求めるため、2,400÷400＝6回です。","category":"ストラテジ系","subcategory":"企業活動","topic":"棚卸資産回転率","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-current-ratio-calc-304","questionText":"流動資産が900万円、流動負債が600万円の企業について、流動比率は何%ですか。","choices":["67%","100%","300%","150%"],"correctChoiceIndex":3,"explanation":"流動比率は流動資産÷流動負債×100なので、900÷600×100＝150%です。短期的な支払能力の目安になります。","category":"ストラテジ系","subcategory":"企業活動","topic":"流動比率計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-operating-margin-calc-305","questionText":"売上高が5,000万円、営業利益が400万円のとき、売上高営業利益率は何%ですか。","choices":["8%","4%","12.5%","80%"],"correctChoiceIndex":0,"explanation":"売上高営業利益率は営業利益÷売上高×100なので、400÷5,000×100＝8%です。","category":"ストラテジ系","subcategory":"企業活動","topic":"売上高営業利益率","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-cash-flow-investing-306","questionText":"企業が新しい製造設備を現金で購入した。この支出をキャッシュフロー計算書で分類する区分はどれですか。","choices":["営業活動によるキャッシュフロー","投資活動によるキャッシュフロー","財務活動によるキャッシュフロー","非資金取引だけの区分"],"correctChoiceIndex":1,"explanation":"設備など長期資産の取得は投資活動に分類します。借入れや増資は財務活動、商品販売など本業は営業活動です。","category":"ストラテジ系","subcategory":"企業活動","topic":"投資キャッシュフロー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-depreciation-purpose-307","questionText":"企業が長期間使用する設備を購入したとき、取得原価の全額を購入年度だけの費用とせず、使用する複数の期間に分けて費用計上する考え方として最も適切なものはどれですか。","choices":["設備を購入した年度の利益を必ず0円にする","設備の市場価格を毎年必ず同じ金額だけ下げる","設備が複数期間にわたって使用されるため、その取得原価を使用期間に対応させて費用配分する","購入代金の支払時期を耐用年数まで延期する"],"correctChoiceIndex":2,"explanation":"設備などの固定資産は複数期間にわたって使用されるため、取得原価を購入年度だけで全額費用化せず、使用期間にわたって配分します。これが減価償却の基本的な考え方であり、実際の費用配分方法には定額法などがあります。","category":"ストラテジ系","subcategory":"企業活動","topic":"減価償却の目的","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-sunk-cost-308","questionText":"新製品開発の継続可否を判断する際、既に支払い済みで中止しても回収できない調査費をどう扱うべきですか。","choices":["必ず回収するまで開発を続ける","将来収益へそのまま加算する","競合企業へ同額を請求する","将来の意思決定から切り離して考える"],"correctChoiceIndex":3,"explanation":"回収不能な既支出はサンクコストです。今後の費用と便益を比較する判断では、埋没した費用に引きずられないことが重要です。","category":"ストラテジ系","subcategory":"企業活動","topic":"サンクコスト判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-opportunity-cost-309","questionText":"自社倉庫を新事業で使うため、第三者へ貸せば得られた年間200万円の賃料を失う。この200万円を何と捉えますか。","choices":["機会費用","減価償却費","限界利益","支払利息"],"correctChoiceIndex":0,"explanation":"選ばなかった最良の代替案から得られたはずの利益を機会費用といいます。現金支出がなくても意思決定で考慮します。","category":"ストラテジ系","subcategory":"企業活動","topic":"機会費用","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-make-or-buy-310","questionText":"部品を内製するか外部購入するかを比較する際、最も適切な判断材料はどれですか。","choices":["既に廃棄した設備の取得額だけ","関連する将来コストと品質・供給リスク","担当者の好みだけ","競合会社の社名だけ"],"correctChoiceIndex":1,"explanation":"内外製分析では、今後変化するコストに加え、品質、納期、技術流出、供給継続性などを総合評価します。","category":"ストラテジ系","subcategory":"企業活動","topic":"内外製分析","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-moving-average-311","questionText":"需要の短期的な変動をならすため、直近3か月の販売量の平均を次月予測に使う方法はどれですか。","choices":["損益分岐点分析","ABC分析","移動平均法","線形計画法"],"correctChoiceIndex":2,"explanation":"移動平均法は、直近の一定期間の実績平均を順次ずらして予測へ使います。急な傾向変化には遅れて反応する点に注意します。","category":"ストラテジ系","subcategory":"企業活動","topic":"移動平均需要予測","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-seasonal-demand-312","questionText":"毎年夏に販売量が増える商品の需要予測で、過去データから特に考慮すべき成分はどれですか。","choices":["偶発債務","固定資産","為替予約","季節変動"],"correctChoiceIndex":3,"explanation":"一定の季節や曜日などに繰り返す変動は季節変動です。傾向や不規則変動と分けて捉えると予測精度を高められます。","category":"ストラテジ系","subcategory":"企業活動","topic":"需要の季節変動","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-safety-stock-313","questionText":"需要や納入期間のばらつきによる欠品を減らすため、通常必要量に上乗せして保有する在庫はどれですか。","choices":[
