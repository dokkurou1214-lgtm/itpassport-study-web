不審通信、端末内のプロセス挙動、複数機器のログを横断した関連性を、それぞれ観測・分析する代表的な仕組みの組合せはどれですか。","choices":["侵入検知・防止、端末検知・対応、ログ集約・相関分析","Webアプリ防御、端末資産管理、バックアップ管理","通信許可制御、携帯端末管理、構成情報管理","通信暗号化、情報持出し制御、脆弱性診断"],"correctChoiceIndex":0,"explanation":"IDS/IPSはネットワーク上の不審通信、EDRは端末上の挙動、SIEMは複数ログの集約・相関を主に扱います。IDSはIntrusion Detection System、IPSはIntrusion Prevention System、EDRはEndpoint Detection and Response、SIEMはSecurity Information and Event Managementの略です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"IDS・IPS・EDR・SIEMの観測範囲と用途対応","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-edr-endpoint-isolation-evidence-1390","questionText":"EDRが端末で不審なプロセスと外部通信を検知した。被害拡大を抑えつつ、その後の調査に必要な情報を残す初動として最も適切なものはどれですか。","choices":["警告を閉じて通常利用を続け、同じ警告が増えた場合だけ管理者へ連絡する","端末をネットワークから隔離し、EDR記録や時刻情報を保全して担当部署へ連絡する","調査前に端末の全記録を削除し、不審なプロセスが再び動くか確認する","端末を共有ネットワークへ接続したまま、別端末へ全ファイルをコピーする"],"correctChoiceIndex":1,"explanation":"端末を隔離して外部通信や横展開を抑え、検知記録などの証拠を保全します。EDR（Endpoint Detection and Response）は端末の挙動記録と調査を支援します。初動で記録を消すと、原因や影響範囲の確認が難しくなります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"EDR警告後の端末隔離・記録保全・連絡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-siem-multisource-correlation-1391","questionText":"同じ利用者について、23時58分に海外からVPN認証成功、23時59分に管理者権限取得、0時01分に端末で不審プロセス検知が記録された。各機器の時刻は同期済みである。SIEMでの確認として最も適切なものはどれですか。","choices":["日付が変わっているため別事象とし、利用者と端末の一致は確認しない","VPNログだけで正常利用と判断し、権限取得と端末検知は別担当へ分割する","利用者、端末、時刻の近接性をキーに三記録を関連付け、一連の事象として調べる","不審プロセスの記録だけを削除し、同じ利用者の次回ログインを待って判断する"],"correctChoiceIndex":2,"explanation":"時刻が同期され、利用者と端末が対応するため、日付をまたいでも一連の事象として相関できます。VPN（Virtual Private Network：仮想私設網）の認証を含め、SIEM（Security Information and Event Management）は複数機器のログを集約し、共通する主体や時刻から関連性を分析します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"VPN・認証・端末ログの利用者・時刻によるSIEM相関","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-service-account-least-privilege-1392","questionText":"在庫連携サービスの専用アカウントが、在庫読取りだけでなく顧客情報の更新権限も持っている。最小権限の考え方に基づく対応として最も適切なものはどれですか。","choices":["サービス停止を避けるため、現在の権限を確認せず恒久的に維持する","将来利用する可能性に備え、同じアカウントへ全業務データの管理権限を追加する","人が利用する管理者アカウントと共用し、サービス専用の権限管理を廃止する","実際の処理と依存先を確認し、在庫連携に必要な権限へ絞って動作を検証する"],"correctChoiceIndex":3,"explanation":"サービスアカウントも、実行する処理に必要な範囲だけを許可します。処理内容と依存関係を確認し、不要な顧客情報更新権限を外した上で、連携が正常に動くか検証します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"サービスアカウントの依存処理確認と最小権限化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-mfa-lost-device-recovery-1393","questionText":"MFAに使うスマートフォンを紛失した利用者から再登録依頼があった。安全な復旧手順として最も適切なものはどれですか。","choices":["定めた方法で本人確認し、旧認証要素を失効させてから新端末を登録する","利用者IDが分かれば本人とみなし、旧端末を有効なまま新端末を追加する","同僚の端末へ一時的に認証情報を登録し、本人確認は後日まとめて行う","旧端末の紛失報告だけを記録し、認証要素の失効なしでパスワードを通知する"],"correctChoiceIndex":0,"explanation":"MFA（Multi-Factor Authentication：多要素認証）の復旧では、本人確認を行い、紛失した端末の認証要素を失効させてから安全に再登録します。旧要素を残すと、紛失端末から不正利用される可能性があります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"MFA端末紛失時の本人確認・旧要素失効・再登録","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-offboarding-session-token-revocation-1394","questionText":"退職者のアカウントを無効化したが、退職前に発行済みの長期セッションとAPIトークンが残っている。対応として最も適切なものはどれですか。","choices":["アカウント無効化済みなので、既存セッションとトークンの有効期限まで待つ","既存セッションとトークンを失効させ、関連する鍵と連携先も確認する","退職者の表示名だけを変更し、認証状態とアクセス権はそのまま残す","端末を返却済みなら、クラウド上のセッションとトークンは確認対象外とする"],"correctChoiceIndex":1,"explanation":"アカウントを無効化しても、発行済みセッションやAPIトークンが別に有効な場合があります。既存の認証状態を失効させ、連携用の鍵や外部サービスのアクセスも確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"退職時の既存セッション・APIトークン・連携鍵失効","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-segmentation-containment-essential-service-1395","questionText":"研究部門の一部端末で感染が疑われるが、同部門の測定装置から中央記録サーバへの送信は停止すると試験データを失う。封じ込めとして最も適切なものはどれですか。","choices":["研究部門の通信を変更せず、測定を優先して感染端末の外部通信も継続する","中央記録サーバを含む全社ネットワークを停止し、必要通信の特定は復旧後に行う","感染疑い端末を隔離し、確認済み測定装置から記録サーバへの必要通信だけを許可する","研究部門の端末を一般事務LANへ移し、既存の制御なしで測定を続ける"],"correctChoiceIndex":2,"explanation":"感染疑い端末を隔離して拡大を抑えつつ、業務継続に必要な通信だけを明確に許可します。全通信を無条件に維持することも、必要性を確認せず全社停止することも避け、対象と経路を限定します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"感染区画の封じ込めと重要サービス通信の限定維持","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-patch-unavailable-compensating-control-1396","questionText":"公開サーバで脆弱性が公表されたが、ベンダの修正版はまだ提供されていない。業務上サーバを直ちに停止できない場合の一時対応として最も適切なものはどれですか。","choices":["修正版がないため対応記録を閉じ、次の定期点検まで現在の公開範囲を維持する","脆弱性の詳細を全利用者へ公開し、各利用者の判断だけで接続を続けてもらう","監視を停止して警告件数を減らし、サーバ負荷が下がるかだけを確認する","不要機能を止め、接続元を制限して監視を強化し、修正版提供後の適用を追跡する"],"correctChoiceIndex":3,"explanation":"パッチが未提供でも、不要機能停止、アクセス制限、分離、監視強化などで一時的にリスクを下げられます。代替策の範囲と残るリスクを記録し、修正版の提供状況を追跡して恒久対応へ移します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"パッチ未提供時のアクセス制限・分離・監視強化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-security-log-trust-prerequisites-1397","questionText":"複数システムのログを事故調査に利用できる状態にするため、特に必要な組合せはどれですか。","choices":["時刻同期、改変検知、閲覧・削除権限の制御","高い圧縮率、短い保存期間、管理者間での削除権限共有","端末ごとの時刻設定、上書き保存、全利用者への閲覧権限付与","ファイル名の統一、表示順の固定、ログ本文の自由な編集"],"correctChoiceIndex":0,"explanation":"事故の順序を追うには時刻がそろい、証拠として使うには改変を検知でき、変更・削除できる者を制限する必要があります。ログの見た目ではなく、時刻、完全性、アクセス制御が信頼性を支えます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"調査用ログの時刻同期・完全性・アクセス制御","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-effective-payload-transfer-calc-1398","questionText":"800MBの業務データを公称100Mbpsの回線で送る。制御情報や混雑の影響により、実データへ使える速度は公称値の80%とする。1MB＝8Mbとし、他の遅延を考慮しない場合、転送時間は何秒ですか。","choices":["64秒","80秒","100秒","125秒"],"correctChoiceIndex":1,"explanation":"実データ速度は100Mbps×0.8＝80Mbpsです。データ量は800MB×8＝6,400Mbなので、6,400Mb÷80Mbps＝80秒です。公称速度をそのまま使わず、通信効率を反映します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"通信効率を考慮した実データ転送時間計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-packet-loss-retransmission-calc-1399","questionText":"1,200MBのデータを送る。パケット損失による再送量を、元データ量の15%として一度だけ加算するものとし、再送データの再損失や制御情報は考慮しない。送信する合計データ量はどれですか。","choices":["1,200MB","1,275MB","1,380MB","1,410MB"],"correctChoiceIndex":2,"explanation":"再送量は1,200MB×15%＝180MBです。問題文の単純化条件に従い、合計は1,200MB＋180MB＝1,380MBです。再送分の再損失は計算に含めません。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"パケット損失による再送分を加えた転送量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-layered-network-fault-isolation-1400","questionText":"通信障害を効率よく切り分ける基本的な進め方として最も適切なものはどれですか。","choices":["最初にサーバを交換し、端末とLANの状態は交換後に確認する","利用者の申告だけで原因を決め、各段階の観測結果は記録しない","DNS設定だけを変更し、IP通信やゲートウェイの疎通は確認しない","端末設定、LAN、ゲートウェイ、名前解決、サーバの順に観測して範囲を絞る"],"correctChoiceIndex":3,"explanation":"身近な範囲から段階的に確認すると、どこまで正常かを基に障害箇所を絞れます。端末、LAN、ゲートウェイ、DNS（Domain Name System）、サーバを順に確認し、各段階の結果を記録します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"端末からサーバまでの段階的な通信障害切り分け","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-master-source-authority-1401","questionText":"営業、会計、顧客サポートの各システムが同じ顧客の会社名を別々に保持し、更新内容が食い違っている。統合後の運用方針として最も適切なものはどれですか。","choices":["項目ごとに正本となるシステムと更新責任者を定め、他システムへ同期する","全システムを正本とし、食い違いは利用者が画面ごとに読み替える","最も新しく導入したシステムを、項目の用途を確認せず一律に正本とする","各システムの会社名を毎月削除し、必要になった時点で入力し直す"],"correctChoiceIndex":0,"explanation":"マスタを統合する際は、顧客名や請求先などの項目ごとに信頼できる正本と更新責任を明確にします。正本から他システムへ同期する規則を定めると、同じ情報が別々に更新されることによる不整合を抑えられます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"複数マスタの正本・更新責任","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-reference-code-effective-date-1402","questionText":"商品分類コードを4月1日に改定するが、3月以前の受注履歴は旧コードで検索できる必要がある。管理方法として最も適切なものはどれですか。","choices":["4月1日に旧コードを全履歴から削除し、新コードだけを残す","旧新コードの対応関係と適用開始・終了日を保持し、取引日に応じて扱う","旧コードと新コードを同じ値に書き換え、改定の記録を残さない","利用部門ごとに任意の切替日を決め、対応関係は口頭で共有する"],"correctChoiceIndex":1,"explanation":"コードを改定するときは、旧新コードの対応関係と有効期間を管理します。取引日時点で有効なコードを判定できれば、移行期間の処理と過去履歴の再現を両立できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"コード改定の適用開始日管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-merger-customer-id-continuity-1403","questionText":"企業統合に伴い、旧会社Xと旧会社Yの顧客データを統合する。両社で同じ番号が別の顧客に使われ、同一顧客に異なる番号が付いている場合もある。購入履歴を失わずに統合する方法として最も適切なものはどれですか。","choices":["番号が同じレコードを全て同一顧客とみなし、確認せず一つにまとめる","更新日が古い顧客を全て削除し、新しい側の番号だけを採用する","新しい統合IDを付与し、照合結果と旧会社・旧IDとの対応を履歴として保持する","旧会社YのIDへ一律に接頭辞を付け、同一顧客の重複は残したままにする"],"correctChoiceIndex":2,"explanation":"番号の一致だけでは同一人物とは限らず、番号の違いだけでも別人とは限りません。氏名や連絡先などで照合し、統合IDと旧IDの対応を残すことで、誤統合を避けながら過去の購入履歴を追跡できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"統合時の顧客ID対応付け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-data-import-quarantine-troubleshooting-1404","questionText":"取引先から毎日届く1万件のデータのうち、数件だけ日付形式が不正である。不正行を調査しながら正常行の処理を継続する方法として最も適切なものはどれですか。","choices":["不正行を正常値へ自動変換し、変換内容と元データは記録しない","不正行を含むファイルを全て正常として登録し、後続処理で修正する","正常行も含めて毎日全件を破棄し、取引先からの再送だけを待つ","不正行を理由付きで隔離し、正常行を処理して隔離分を訂正後に再投入する"],"correctChoiceIndex":3,"explanation":"不正行を隔離することで、正常なデータの処理を止めずに原因を調査できます。隔離理由、元データ、訂正内容を記録し、検証後に再投入すれば、勝手な補正による誤登録も防げます。","category":"ストラテジ系","subcategory":"システム企画","topic":"不正データの隔離処理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-delta-migration-sync-selection-1405","questionText":"新システムへ全量データを複写するには10時間かかるが、業務停止は2時間しか許容されない。複写中も旧システムでは1時間に約200件更新される。移行方法として最も適切なものはどれですか。","choices":["事前に全量を複写し、その後の更新差分を記録して停止時間内に反映する","業務を止めずに全量複写だけを行い、複写開始後の更新は移行対象外とする","停止時間を確認せず切替日に全量複写を開始し、終わるまで業務を止める","全量複写を省略し、切替後に利用者が必要なデータだけ手入力する"],"correctChoiceIndex":0,"explanation":"全量複写を事前に済ませ、複写開始後の更新を差分として管理すると、切替時の停止時間を短縮できます。差分の取得漏れや重複適用がないことをリハーサルで確認する必要があります。","category":"ストラテジ系","subcategory":"システム企画","topic":"全量移行後の差分同期","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-batch-realtime-stock-sync-comparison-1406","questionText":"店舗とECサイトで同じ在庫を販売する。方式Xは1日1回のバッチ同期で安価、方式Yは販売の都度ほぼリアルタイムに同期するが費用が高い。人気商品の過剰販売を特に避けたい場合の判断として最も適切なものはどれですか。","choices":["方式Xを選び、在庫の鮮度と過剰販売リスクは評価しない","方式Yを中心に、必要な鮮度と過剰販売損失が追加費用に見合うか評価する","どちらも同じ結果になるため、同期頻度を選定条件から外す","両方式を使わず、店舗とECサイトに同じ在庫数を固定表示する"],"correctChoiceIndex":1,"explanation":"同期頻度が低いほど表示在庫と実在庫の差が生じやすく、複数経路での過剰販売につながります。必要な鮮度、販売機会、過剰販売の損失、導入・運用費を比較して方式を選びます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"バッチ・リアルタイム同期の選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-data-migration-reconciliation-threshold-1407","questionText":"売掛データを移行したところ、件数は旧システムと一致したが、合計金額が12万円異なり、顧客IDが移行先マスタに存在しないレコードも3件あった。切替判定として最も適切なものはどれですか。","choices":["件数が一致したため合格とし、金額差と顧客ID差は切替後に調べる","差異が小さいため、事前に定めた基準に関係なく担当者判断で合格にする","件数、金額、キー対応を合格基準と照合し、原因と影響を解消してから判定する","移行先の合計金額を旧システムに合わせて直接書き換え、差異記録を削除する"],"correctChoiceIndex":2,"explanation":"件数が一致しても、金額や参照キーが不一致なら業務上の整合性は保証されません。事前に決めた照合項目と許容基準に基づき、差異の原因、対象データ、業務影響を確認して切替可否を判断します。","category":"ストラテジ系","subcategory":"システム企画","topic":"移行照合の合格基準","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-data-correction-approval-record-1408","questionText":"売上データを手作業で訂正するとき、後から訂正の妥当性を確認するために残す記録の組合せとして最も適切なものはどれですか。","choices":["訂正後の値と作業端末名だけ","訂正担当者の氏名と画面の色だけ","訂正前の値と処理時間だけ","訂正前後の値、訂正理由、申請者、承認者"],"correctChoiceIndex":3,"explanation":"訂正の正当性を確認するには、何をどのように変えたかに加え、理由と承認経路が必要です。訂正前後の値、理由、申請者、承認者を記録すると、誤操作や無断変更を追跡できます。","category":"ストラテジ系","subcategory":"企業活動","topic":"データ訂正の承認記録","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-migration-record-count-gap-calc-1409","questionText":"旧システムには12,500件ある。移行対象外として承認済みのテストデータ80件と取消済みデータ30件を除くと、移行すべき件数になる。移行先に12,365件登録された場合、不足は何件ですか。","choices":["25件","55件","105件","135件"],"correctChoiceIndex":0,"explanation":"移行すべき件数は12,500－80－30＝12,390件です。移行先は12,365件なので、不足は12,390－12,365＝25件です。承認済みの除外件数を差異として重ねて数えない点が重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"除外対象を考慮した移行件数差","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-historical-code-mapping-1410","questionText":"部門コードを組織改編で変更するが、過去年度の帳票は当時の組織区分で再出力する必要がある。対応として最も適切なものはどれですか。","choices":["全履歴の旧部門コードを現在のコードへ上書きし、変更日を残さない","旧新コードの対応と有効期間を保持し、帳票基準日に応じて参照する","過去帳票を画像だけで保存し、元データからの再集計をできなくする","部門コードを廃止し、全取引を一つの部門として集計する"],"correctChoiceIndex":1,"explanation":"過去時点の状態を再現するには、旧新コードの対応関係と有効期間を保持します。履歴を現在値で上書きすると、当時の組織単位による集計や監査ができなくなります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"過去コードの対応表管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-duplicate-id-source-troubleshooting-1411","questionText":"三つの販売システムを統合したところ、同じ顧客IDに異なる顧客が割り当てられていた。最初の原因切分けとして最も適切なものはどれですか。","choices":["重複した全レコードを更新日時の古い順に削除する","顧客IDを全件乱数へ変換し、元システムとの関係を失わせる","発生元システム、ID採番範囲、接頭辞、統合変換規則を確認する","同じIDなら同一顧客とみなし、氏名や連絡先は比較しない"],"correctChoiceIndex":2,"explanation":"各システムが独立に同じ番号範囲を使っていたり、接頭辞を除く変換が行われたりすると衝突します。発生元と採番規則、名前空間、統合時の変換を確認して原因を特定します。","category":"ストラテジ系","subcategory":"システム企画","topic":"統合時の重複ID原因切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-transaction-boundary-business-risk-1412","questionText":"注文確定時に、受注登録、在庫引当、決済確定を連続して行う。決済だけ成功して在庫引当が失敗すると顧客へ請求だけが残る。要件として最も適切なものはどれですか。","choices":["各処理を無関係な業務とみなし、途中失敗時の扱いは定めない","決済成功を最優先し、在庫引当の失敗記録は毎日削除する","在庫引当を省略し、受注登録と決済だけを常に成功扱いにする","一連の整合性を保つ境界を定め、失敗時は取消し又は補償処理を行う"],"correctChoiceIndex":3,"explanation":"複数システムにまたがる処理では、どこまでを一つの業務結果として扱うかを定めます。全体を同一トランザクションにできない場合も、取消しや返金などの補償処理で、請求だけが残る状態を解消する必要があります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務処理のトランザクション境界","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-required-field-business-rule-1413","questionText":"配送先電話番号は通常注文では任意だが、当日配送では配達員の連絡に必要である。入力規則として最も適切なものはどれですか。","choices":["当日配送を選んだ場合だけ電話番号を必須にし、形式も検証する","全注文で電話番号を禁止し、当日配送時は配達員が推測する","配送方法に関係なく全項目を常に任意とし、未入力を許可する","電話番号欄へ任意の一文字があれば有効とし、形式は確認しない"],"correctChoiceIndex":0,"explanation":"必須項目は、項目名だけで一律に決めるのではなく業務条件に合わせます。当日配送では連絡先が必要なので条件付きで必須とし、利用できる形式かも検証します。","category":"ストラテジ系","subcategory":"企業活動","topic":"必須値と業務ルール","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-data-archive-online-tier-comparison-1414","questionText":"取引データは直近2年分を日常的に検索し、3～7年前は年数回の監査で参照する。法定保管期間を満たしながら費用を抑える方針として最も適切なものはどれですか。","choices":["全期間を高性能なオンライン領域だけに置き、参照頻度と費用は評価しない","直近分はオンライン、古い分は検索可能なアーカイブに置き、復元手順を確認する","2年を超えたデータを全て削除し、監査時は取引先から再取得する","直近分を低速な媒体へ移し、古いデータだけを高速領域に保持する"],"correctChoiceIndex":1,"explanation":"参照頻度の高いデータはオンライン、頻度の低い保管データはアーカイブへ分けると、利用性と費用を調整できます。保管期間、検索・復元時間、完全性を満たすことも必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"オンライン・アーカイブ配置","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-migration-test-data-minimization-1415","questionText":"本番移行の試験で、長い氏名、住所欠落、最大購入件数などの境界ケースを再現したい。一方、本番の個人情報は必要以上に使わない方針である。最も適切な方法はどれですか。","choices":["本番データを全件そのまま複製し、試験参加者全員へ閲覧権限を与える","個人情報を全て同じ固定値へ変え、境界値やデータ分布も失わせる","必要な特性を残した合成・マスキング済みデータを作り、利用範囲を制限する","境界ケースを試験せず、平均的な一件だけで移行成功と判断する"],"correctChoiceIndex":2,"explanation":"試験目的に必要な境界値や関係性は残しつつ、実在人物を識別できる情報を減らします。合成やマスキングを使い、件数とアクセス権も必要最小限にすると、試験の有効性と情報保護を両立できます。","category":"ストラテジ系","subcategory":"システム企画","topic":"移行試験データの最小化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-cutover-data-freeze-decision-1416","questionText":"基幹システムを切り替える。停止可能時間は3時間、通常は1時間に500件更新され、差分同期は1,000件を30分で処理できる。切戻しには切替前時点の整合したデータが必要である。計画として最も適切なものはどれですか。","choices":["更新を継続したまま差分記録を止め、切替後の不足は利用者に再入力させる","停止可能時間を使い切るまで全量移行を続け、切戻し用データは作成しない","切替前に旧環境を削除し、失敗時も新環境の修正だけで対応する","短時間の更新凍結、最終差分反映、照合、切戻し用スナップショットを組み合わせる"],"correctChoiceIndex":3,"explanation":"更新量は同期能力の範囲でも、切替点を確定しなければ新旧の状態がずれます。短時間の凍結中に最終差分を反映して照合し、失敗時に戻せる整合した状態を保持する計画が適切です。","category":"ストラテジ系","subcategory":"システム企画","topic":"切替時の更新凍結判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-schema-change-compatibility-plan-1417","questionText":"アプリを複数台で段階更新するため、一時的に旧版と新版が同じDBを使う。新版で列を追加する場合の進め方として最も適切なものはどれですか。","choices":["旧版でも動作する追加型変更を先に適用し、移行後に不要列の削除を別段階で行う","旧版が使う列を最初に削除し、新版の配布完了まで旧版のエラーを許容する","DB変更と全アプリ更新を無検証で同時実行し、失敗時の戻し方は後で決める","各アプリが異なる意味で同じ列を使うようにし、互換期間を設けない"],"correctChoiceIndex":0,"explanation":"旧版と新版が共存する期間は、双方が利用できるDB構造を保つ必要があります。互換性のある追加、データ移行、アプリ切替、不要構造の削除を段階化すると、安全に展開できます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"DB変更の互換性計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-migration-control-total-definition-1418","questionText":"データ移行前後の整合性確認で用いるコントロールトータルの説明として最も適切なものはどれですか。","choices":["移行作業者の人数だけを数えた値","件数や金額合計など、移行前後を照合するための集計値","移行先サーバのCPU使用率だけを記録した値","画面に表示される文字数の最大値"],"correctChoiceIndex":1,"explanation":"コントロールトータルは、件数、金額、数量などを移行前後で比較するための集計値です。件数だけでは値の欠落や重複を見逃すことがあるため、業務上重要な合計値も使います。","category":"マネジメント系","subcategory":"システム開発技術","topic":"移行時のコントロールトータル","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-data-migration-rehearsal-variance-1419","questionText":"移行リハーサルを3回行った。処理時間は4時間、3時間、2.5時間と改善したが、例外件数は2件、8件、15件と増え、3回目には同じ顧客群で金額差も発生した。本番移行の判断として最も適切なものはどれですか。","choices":["処理時間が短縮したため、例外と金額差を確認せず本番へ進む","3回目が最短なので、過去2回の結果と増加傾向を記録から除く","例外増加と金額差の原因・再現性を解消し、合格基準を満たすまで再確認する","例外15件を移行対象外へ変更し、顧客への影響は本番後に調べる"],"correctChoiceIndex":2,"explanation":"移行の可否は時間だけでなく、例外件数、差異の種類、再現性、業務影響を総合して判断します。時間が改善しても品質が悪化しているため、原因を解消し、再リハーサルで基準を満たすことを確認します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"移行リハーサルの差異評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-orphan-record-test-troubleshooting-1420","questionText":"移行試験後、注文明細に存在する顧客IDの一部が、移行先の顧客表に存在しないことが分かった。原因切分けとして最も適切なものはどれですか。","choices":["顧客表を確認せず、注文明細の顧客IDを全て同じ値へ変更する","孤立した明細を全て削除し、削除件数と業務影響は記録しない","外部キー制約を恒久的に外し、孤立レコードを正常データとして扱う","顧客と明細の読込順、ID変換規則、抽出・除外条件を突き合わせる"],"correctChoiceIndex":3,"explanation":"親となる顧客がない原因には、読込順の誤り、ID変換の不一致、顧客だけが除外されたことなどがあります。関連する処理条件を突き合わせ、どの段階で対応関係が失われたかを調べます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"孤立レコードの原因切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-concurrent-update-test-design-1421","questionText":"在庫数が10個の商品について、二人の担当者が同時に画面を開き、それぞれ3個と4個を出庫する。更新競合への対策を確認する試験として最も適切なものはどれですか。","choices":["同じ初期値を読んだ二つの更新を重ね、片方の更新消失や競合検知を確認する","担当者を一人だけにして順番に更新し、同時操作は試験しない","在庫数を毎回十分大きくし、更新後の値と操作記録は確認しない","二人に異なる商品を更新させ、同じデータへの競合を避ける"],"correctChoiceIndex":0,"explanation":"同時更新の試験では、複数利用者が同じ値を読んで更新する状況を再現します。最終在庫が正しいか、版番号や排他制御で競合を検出できるかを確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"同時更新テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-database-change-rollback-comparison-1422","questionText":"DB変更案を比較する。案Xは既存列を残して新列を追加し段階移行する。案Yは既存列を直ちに削除し、全データを新形式へ上書きする。切戻しやすさの評価として最も適切なものはどれですか。","choices":["案Yは既存列を削除するため、常に案Xより切戻しやすい","案Xは旧構造を一定期間残せるため、一般に段階確認と切戻しを行いやすい","両案はデータ変更内容に関係なく、切戻しの難しさが必ず同じである","案Xは新列を追加するため、バックアップなしでも切戻し不能になる"],"correctChoiceIndex":1,"explanation":"追加型の変更は旧アプリとの互換性を保ちやすく、段階移行と切戻しの余地を残せます。削除や上書きは元データを失う可能性があるため、復元手段と移行手順をより慎重に設計します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"DB変更の戻しやすさ比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-transaction-failure-point-test-1423","questionText":"受注登録、在庫引当、請求登録を一連の処理として実装した。途中障害時に部分保存が残らないことを確認する試験として最も適切なものはどれですか。","choices":["全処理が成功する一つの経路だけを実行し、DBの状態は確認しない","最後の画面表示だけを確認し、各テーブルの更新結果は比較しない","各更新の直前・直後で障害を発生させ、履歴と関連テーブルの整合性を確認する","障害を発生させず、処理時間が短いことだけで原子性を確認する"],"correctChoiceIndex":2,"explanation":"処理途中の複数地点で障害を起こすと、更新順序による部分保存を検出できます。画面だけでなく、受注、在庫、請求、履歴が全て元へ戻るか、定めた補償状態になるかを確認します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"トランザクション途中障害試験","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-test-data-privacy-balance-1424","questionText":"顧客検索機能の試験で、同姓同名、長い住所、未入力項目を再現しつつ、実在顧客の情報を保護する方法として最も適切なものはどれですか。","choices":["本番データを全件コピーし、試験者の権限を制限しない","全項目を同じ値に置換し、同姓同名や長さの違いもなくす","実在顧客名だけを残し、住所と連絡先を社外へ共有する","必要な特徴を持つ合成データを用い、利用目的とアクセス範囲を限定する"],"correctChoiceIndex":3,"explanation":"合成データなら、試験に必要な分布や境界条件を設計しながら実在人物との結び付きを避けられます。試験データであっても、利用目的、件数、閲覧者、保管期間を必要最小限にします。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"テスト網羅性とデータ保護","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-etl-reject-trend-problem-1425","questionText":"毎朝のETLで、取引先コードの桁数不一致によるリジェクトが一時修正後も繰り返し発生している。問題管理として最も適切な対応はどれですか。","choices":["発生元の仕様変更と変換規則を調べ、恒久修正と再発監視を管理する","毎朝同じ手作業で値を直し、発生件数と原因は記録しない","リジェクト判定を外し、不正形式のデータもそのまま登録する","ETLの実行時刻だけを変更し、コード形式の不一致は調査しない"],"correctChoiceIndex":0,"explanation":"繰返すリジェクトは、一時的な値の修正だけでなく、送信元仕様や変換規則の根本原因を調べます。恒久修正、担当、期限、再発件数を管理して問題の解消を確認します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ETLリジェクトの問題管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-recovery-reconciliation-runbook-1426","questionText":"障害前のバックアップから受注DBを復元した。決済サービスには復元時点より後に成功した決済が残っている。業務再開前の手順として最も適切なものはどれですか。","choices":["DBの起動だけを確認し、決済サービスとの対応は利用者からの申告を待つ","受注IDと決済IDを突合し、不足・重複・取消し要否を確認してから再開する","決済サービスの全記録を削除し、復元した受注DBだけを正しい状態とみなす","復元後に全顧客へ同じ金額を請求し、差額は翌月調整する"],"correctChoiceIndex":1,"explanation":"外部サービスはDBバックアップと同じ時点へ戻るとは限りません。受注と決済を一意なIDで突合し、DBにない成功決済、重複登録、返金や再処理の要否を確認して整合性を回復します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"復旧後の整合性確認手順","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-data-correction-audit-evidence-1427","questionText":"売上データの手動訂正が適切に統制されているか監査する。訂正結果が正しいことと、無断変更でないことの両方を確認できる証拠の組合せとして最も適切なものはどれですか。","choices":["訂正後の画面だけと、担当者の口頭説明だけ","訂正件数の月次合計だけと、サーバのCPU使用率だけ","訂正申請・承認、訂正前後の値、操作ログ、元資料の対応","作業者一覧だけと、訂正対象外データのバックアップだけ"],"correctChoiceIndex":2,"explanation":"訂正の妥当性には、正当な根拠、承認、実際の変更内容、実施者を結び付けて確認できる証拠が必要です。複数の証拠を突合すると、内容の正しさと手続の適切さを検証できます。","category":"マネジメント系","subcategory":"システム監査","topic":"データ訂正の監査証拠","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-unsorted-search-strategy-1428","questionText":"未整列の10万件の商品データを一度だけ検索する処理と、同じデータを毎日数千回検索する処理がある。探索方式の判断として最も適切なものはどれですか。","choices":["どちらも検索前に必ず全件を整列し、整列時間は評価しない","どちらも先頭一件だけを比較し、見つからなければ不存在とする","一度だけの検索では全件を削除し、反復検索では毎回手作業で並べる","一度だけなら線形探索も検討し、反復検索なら整列・索引作成の費用と効果を比較する"],"correctChoiceIndex":3,"explanation":"未整列データを一度だけ探す場合、事前整列の費用が検索の利点を上回ることがあります。繰返し検索する場合は、整列や索引作成の初期費用をかけても、その後の探索を短縮できる可能性があります。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"未整列データの探索方式判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-conditional-branch-trace-1429","questionText":"次の処理を実行した後のxの値はどれですか。x←8、y←3とする。もし「x＞5 かつ y≧5ではない」ならx←x＋y、そうでなければx←x－yとする。","choices":["11","5","8","24"],"correctChoiceIndex":0,"explanation":"x＞5は真、y≧5は偽なので「y≧5ではない」は真です。両方が真のためx←8＋3が実行され、最終値は11です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"条件分岐の追跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-loop-conditional-accumulator-1430","questionText":"次の処理を実行した後のtotalの値はどれですか。total←0とし、iを1から6まで1ずつ増やす。iが偶数ならtotal←total＋i、奇数ならtotal←total－1とする。","choices":["6","9","12","21"],"correctChoiceIndex":1,"explanation":"totalはi＝1から順に－1、1、0、4、3、9と変化します。偶数の2＋4＋6＝12を加え、奇数3回について1ずつ引くため、最終値は9です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"条件付き繰返しと累積値","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-array-sequential-update-trace-1431","questionText":"添字が1から始まる配列A＝[2, 3, 4, 5]がある。iを2から4まで1ずつ増やし、A[i]←A[i]＋A[i－1]とする。更新後のA[4]はどれですか。","choices":["9","12","14","20"],"correctChoiceIndex":2,"explanation":"更新済みの直前要素を使います。A[2]＝3＋2＝5、A[3]＝4＋5＝9、A[4]＝5＋9＝14となります。元の直前要素を使い続けない点が重要です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"配列の順次更新","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-search-flag-termination-troubleshooting-1432","questionText":"添字が1から始まる配列を先頭から探索する。変数iを1とし、要素が対象値と一致した場合も、その直後にiを1増やしてからループを終了している。そのため一致位置より1大きい値を返す。修正として最も適切なものはどれですか。","choices":["一致した場合は探索済み要素を全て削除する","一致した場合もiを2増やし、返す値をさらに大きくする","一致の有無にかかわらず、常に配列末尾まで探索して末尾を返す","一致した場合はiを増やさず終了し、一致しない場合だけiを増やす"],"correctChoiceIndex":3,"explanation":"一致した時点のiが求める位置です。一致後にもiを増やすと位置が一つずれるため、増分処理は一致しなかった場合だけ行い、一致時はその位置を保持して終了します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"探索フラグ・終了条件不良","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-array-filter-count-trace-1433","questionText":"添字が1から始まる配列A＝[2, 5, 4, 7]がある。iを2から4まで1ずつ増やし、A[i]＞A[i－1]ならA[i]を1減らす。処理後、値が4以上の要素は幾つですか。","choices":["3個","2個","4個","1個"],"correctChoiceIndex":0,"explanation":"i＝2でA[2]は5から4になります。i＝3では4＞4が偽なので4のまま、i＝4では7＞4が真なので6になります。最終配列は[2, 4, 4, 6]で、4以上は3個です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"配列更新と件数集計","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-stack-undo-redo-state-1434","questionText":"二つのスタックで編集操作のUndoとRedoを管理する。操作P、操作Qを実行し、QをUndoした後に新しい操作Rを実行した。Redo用スタックの扱いとして最も適切なものはどれですか。","choices":["QとRをRedo用スタックへ積み、Undo用スタックを空にする","Redo用スタックを空にし、RをUndo用スタックへ積む","Qを自動的に再実行し、その後Rを破棄する","両方のスタックを空にし、Pの履歴も削除する"],"correctChoiceIndex":1,"explanation":"Undo後に新しい操作を行うと、以前のRedo経路とは異なる編集履歴になります。そのためQを保持していたRedo用スタックを空にし、新しい操作RをUndo用スタックへ積みます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"二つのスタックによるUndo・Redo","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-queue-stack-use-case-comparison-1435","questionText":"システムAは受け付けた印刷要求を到着順に処理する。システムBは利用者が行った操作を新しいものから順に取り消す。適切なデータ構造の組合せはどれですか。","choices":["AもBもスタック","AもBもキュー","Aはキュー、Bはスタック","Aは配列、Bは木構造"],"correctChoiceIndex":2,"explanation":"印刷要求は先に到着したものから処理するためキューが適します。操作の取消しは直前の操作から戻すためスタックが適します。名称ではなく、必要な取出し順序から選びます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"キューとスタックの用途選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-tree-parent-child-path-1436","questionText":"木構造で、根Rの子がA、Aの子がB、Bの子がCである。根からCまでの経路として正しいものはどれですか。","choices":["C→A→R","R→B→C","A→R→B→C","R→A→B→C"],"correctChoiceIndex":3,"explanation":"木構造では、親から子への関係を順にたどります。Cの親はB、Bの親はA、Aの親はRなので、根からの経路はR→A→B→Cです。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"木の親子関係と経路","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-graph-reachability-application-1437","questionText":"作業の依存関係を有向グラフで表す。辺はA→B、B→C、A→D、D→Eであり、矢印の先は前作業の完了を必要とする。Aが完了できないとき、直接又は間接に開始できない作業の組合せはどれですか。","choices":["B、C、D、E","BとDだけ","CとEだけ","Aだけ"],"correctChoiceIndex":0,"explanation":"Aから直接到達するBとDが開始できず、その先のCとEも開始できません。有向グラフの矢印を順にたどると、直接・間接の影響範囲を確認できます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"有向グラフの到達関係","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-boolean-access-condition-trace-1438","questionText":"アクセス許可条件を「((社員かつ管理端末) または (取引先かつ承認済み)) かつ 利用停止中ではない」とする。Aは取引先・承認済み・停止中でない。Bは社員・管理端末・利用停止中である。許可されるのはどれですか。","choices":["AとBの両方","Aだけ","Bだけ","どちらも許可されない"],"correctChoiceIndex":1,"explanation":"Aは「取引先かつ承認済み」が真で、停止中でもないため許可されます。Bは「社員かつ管理端末」は真ですが、利用停止中なので最後の条件を満たさず拒否されます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"アクセス条件の論理追跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-stable-multikey-sort-1439","questionText":"社員一覧を、主キーは部門コードの昇順、同じ部門内では氏名の昇順にしたい。安定な整列処理を2回使う方法として適切なものはどれですか。","choices":["最初に部門コード、次に氏名で整列する","氏名だけで2回整列する","最初に氏名、次に部門コードで安定整列する","部門コードだけで2回整列する"],"correctChoiceIndex":2,"explanation":"先に優先度の低い氏名で整列し、次に優先度の高い部門コードで安定整列します。安定整列では同じ部門コードの要素間で先の氏名順が保たれるため、目的の順序になります。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"安定整列と複数キー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-composite-key-reservation-1440","questionText":"会議室予約表には予約日、会議室ID、開始時刻、予約者IDを記録する。同じ会議室の同じ日時に二重予約を登録させないため、一意性を持たせる列の組合せとして最も適切なものはどれですか。","choices":["日付と予約者の2列","会議室と予約者の2列","開始時刻と予約者の2列","日付・会議室・開始時刻の3列"],"correctChoiceIndex":3,"explanation":"二重予約を防ぐには、同じ日、同じ会議室、同じ開始時刻の組合せを一意にします。予約者IDを含めるだけでは、別の予約者が同じ枠を登録できてしまいます。","category":"テクノロジ系","subcategory":"データベース","topic":"予約データの複合キー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-null-required-unknown-1441","questionText":"顧客表の退会日にNULLが入っている。NULLの扱いとして最も適切なものはどれですか。","choices":["値が存在しない又は未確定であることを表し、0や空文字とは区別する","数値の0と必ず同じ意味として計算する","長さ0の文字列と必ず同じ意味として比較する","空白文字一個と必ず同じ値として保存する"],"correctChoiceIndex":0,"explanation":"NULLは値が存在しない、又は分からない状態を表し、0、空文字、空白文字とは別です。退会日を必須にするか、未退会を別の状態で表すかは業務ルールに合わせて設計します。","category":"テクノロジ系","subcategory":"データベース","topic":"NULL・未設定・必須値","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-relational-projection-result-1442","questionText":"関係データベースの表から、行はそのままにして「商品ID」と「商品名」の列だけを取り出す操作はどれですか。","choices":["選択","射影","結合","排他"],"correctChoiceIndex":1,"explanation":"射影は表から必要な列を取り出す操作です。選択は条件に合う行を取り出し、結合は複数の表を関連付けます。特定のSQL構文ではなく、関係演算の概念を表します。","category":"テクノロジ系","subcategory":"データベース","topic":"関係演算の射影","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-index-selectivity-workload-1443","questionText":"1,000万件の受注表に索引を追加する。列Xは値が「未処理・処理済み」の2種類だけ、列Yは顧客IDで100万種類あり、顧客ID検索が多い。一方、受注は頻繁に追加される。判断として最も適切なものはどれですか。","choices":["値の種類数に関係なく列Xだけへ索引を作れば、全検索が必ず最速になる","索引は更新費用がないため、全列へ無条件に作成する","列Yの検索効果と追加時の索引更新負荷を測定し、必要な索引を選ぶ","行数が多い表では索引を一切利用できないため、全て削除する"],"correctChoiceIndex":2,"explanation":"候補を絞り込みやすい列は索引の効果が期待できますが、索引には追加・更新時の保守費用があります。値の種類数、検索条件、更新頻度を基に、実際の処理時間を測って判断します。","category":"テクノロジ系","subcategory":"データベース","topic":"選択性とインデックス判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-commit-boundary-retry-comparison-1444","questionText":"1,000件の振込指示を処理する。方式Xは1件ごとにcommitし、方式Yは1,000件全てを一括commitする。500件目で障害が起きた場合の比較として最も適切なものはどれですか。","choices":["方式Xでは常に1,000件全てが取消しになり、再実行範囲は方式Yと同じである","方式Yでは500件目まで必ず確定し、残りだけを自動的に再実行できる","commit単位は障害時の確定範囲と無関係なので、業務要件を確認する必要はない","方式Xは確定済み範囲を識別して残件を扱え、方式Yは原則として一括再実行になる"],"correctChoiceIndex":3,"explanation":"1件ごとにcommitすると、障害前に確定した処理を識別し、未処理分だけを再実行しやすくなります。一括commitでは途中障害時に全体が未確定となるため、原則として一括でやり直します。重複振込を防ぐ識別も必要です。","category":"テクノロジ系","subcategory":"データベース","topic":"コミット単位と再実行範囲","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-version-check-lost-update-prevention-1445","questionText":"利用者AとBが同じ顧客レコードの版番号7を読み、Aが先に更新して版番号8にした。その後Bが版番号7を基に更新しようとした。更新消失を防ぐ処理として最も適切なものはどれですか。","choices":["DBの現在版が7か確認し、8なら競合として再読込みを求める","Bの更新を常に上書きし、Aの変更内容は記録から削除する","版番号を確認せず、最後に保存した利用者の値だけを残す","AとBの変更を列の意味に関係なく文字列として連結する"],"correctChoiceIndex":0,"explanation":"Bが読んだ版番号7と現在の版番号8が異なるため、その間に別の更新があったと判断できます。無条件に上書きせず、再読込みや変更内容の確認を求めることで更新消失を防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"版番号による更新競合検出","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-deadlock-lock-order-choice-1446","questionText":"処理Aは表Xを更新してから表Yを待ち、処理Bは表Yを更新してから表Xを待って停止している。再発を抑える基本的な対策として最も適切なものはどれですか。","choices":["全処理で資源の取得順序を毎回ランダムに変える","表X、表Yのように資源を取得する順序を統一し、保持時間も短くする","待ち状態を検知しても両処理を永久に待たせる","排他制御を全て外し、同じデータを無制限に同時更新させる"],"correctChoiceIndex":1,"explanation":"互いに相手の資源解放を待つ循環待ちがデッドロックです。資源を取得する順序を統一し、トランザクションを必要以上に長くしないことで発生しにくくできます。","category":"テクノロジ系","subcategory":"データベース","topic":"デッドロックと資源取得順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-recovery-undo-redo-target-trace-1447","questionText":"チェックポイント後、取引Aは更新してcommit済み、取引Bは更新したが未commitの状態でDB障害が発生した。ログとバックアップを用いる回復で、AとBの扱いとして最も適切なものはどれですか。","choices":["AもBもUndoし、commitの有無は考慮しない","AもBもRedoし、未commitのBも確定済みとして残す","Aの更新をRedoし、Bの更新をUndoする","Aだけを確認し、Bの未commit更新はそのまま残す"],"correctChoiceIndex":2,"explanation":"commit済みのAは確定した結果なので、バックアップに反映されていなければログからRedoします。未commitのBは確定していないためUndoし、途中更新を残しません。","category":"テクノロジ系","subcategory":"データベース","topic":"障害時のUndo・Redo対象判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-referential-delete-impact-1448","questionText":"顧客表の顧客Cを削除しようとしたところ、受注表に顧客Cを参照する未完了注文がある。整合性と業務要件を保つ対応として最も適切なものはどれですか。","choices":["顧客だけを削除し、未完了注文の参照先がなくても正常とする","受注表の顧客IDを無関係な顧客へ自動変更する","参照制約を外して顧客を削除し、未完了注文は確認しない","削除を止め、注文の完了・移管又は論理削除などの業務規則に従う"],"correctChoiceIndex":3,"explanation":"子となる未完了注文が親顧客を参照しているため、親だけを削除すると参照関係が壊れます。注文の扱いを確認し、削除禁止、論理削除、適切な移管など、業務規則に沿って処理します。","category":"テクノロジ系","subcategory":"データベース","topic":"親データ削除時の参照整合性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-table-join-row-count-calc-1449","questionText":"顧客表にはA、B、Cの3顧客がある。注文表にはAの注文が2件、Bの注文が1件、Cの注文は0件ある。注文がある顧客だけを顧客IDで対応付け、注文1件につき1行を出すと、結果は何行ですか。","choices":["3行","2行","4行","6行"],"correctChoiceIndex":0,"explanation":"Aの注文2件から2行、Bの注文1件から1行ができます。注文のないCは結果に含めない条件なので、合計は3行です。一対多では顧客数ではなく対応する注文数だけ行が生じます。","category":"テクノロジ系","subcategory":"データベース","topic":"一対多関係の結果件数","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-migration-integrity-check-sequence-1450","questionText":"顧客表と受注表を新DBへ移行した後、業務開始前に行う整合性確認として最も適切なものはどれですか。","choices":["画面の色だけを確認し、データ値と関係は確認しない","主な一意性・必須値・参照関係を検査し、件数と金額合計も移行元と照合する","移行先の制約を全て外し、登録できれば整合していると判断する","受注表だけを確認し、参照先となる顧客表は確認対象外とする"],"correctChoiceIndex":1,"explanation":"移行後は、一意性、必須値、顧客と受注の参照関係など構造上の整合性を確認します。さらに件数や金額合計を移行元と照合すると、欠落、重複、値の変化も検出できます。","category":"テクノロジ系","subcategory":"データベース","topic":"移行後の整合性確認順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-ooda-rapid-decision-1451","questionText":"市場の状況が短期間で変化し、詳細な年間計画を待っていると対応が遅れる。現場が状況を観察し、意味付けし、方針を決め、すぐ行動する進め方として最も適切なものはどれですか。","choices":["OODAループ","PDCAサイクル","バランススコアカード","ベンチマーキング"],"correctChoiceIndex":0,"explanation":"OODAはObserve（観察）、Orient（状況判断）、Decide（意思決定）、Act（行動）を素早く回す考え方です。変化が速い状況で、観察結果を踏まえて判断と行動を更新する場合に適しています。PDCA（Plan、Do、Check、Act）は計画に基づく継続的改善を進める代表的な枠組みです。","category":"ストラテジ系","subcategory":"企業活動","topic":"OODAループによる迅速な意思決定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-human-capital-retention-1452","questionText":"専門人材の退職が続き、採用しても技能が組織に蓄積されない。人的資本経営の観点から最も適切な対応はどれですか。","choices":["採用人数だけを増やし、配属後の成長や定着は評価しない","能力開発、適切な配置、働きがいを整え、定着状況を経営指標と結び付ける","退職理由を調べず、全従業員の担当業務を毎月入れ替える","人材情報を財務情報と切り離し、経営判断には用いない"],"correctChoiceIndex":1,"explanation":"人的資本経営では、人を単なる費用ではなく価値創造の源泉と捉え、育成、配置、活用、定着を経営戦略と結び付けます。リテンションは人材の定着を図る取組であり、採用数だけでなく成長機会や働きがいも重要です。","category":"ストラテジ系","subcategory":"企業活動","topic":"人的資本経営におけるリテンション","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-chart-junk-detection-1453","questionText":"月別売上を示すグラフに、立体的な影、背景画像、不要な模様が多く、数値の比較がしにくい。改善策として最も適切なものはどれですか。","choices":["目盛を非表示にし、装飾だけで大小を判断させる","背景画像を増やし、データより装飾を目立たせる","データ理解に不要な装飾を減らし、比較に必要な目盛や凡例を明確にする","全ての系列を同じ色と同じ線種にし、凡例を削除する"],"correctChoiceIndex":2,"explanation":"データの理解に役立たない過剰な装飾はチャートジャンクと呼ばれ、値の比較を妨げます。必要な目盛、凡例、強調は残しながら不要な立体表現や背景を減らすと、情報が伝わりやすくなります。軸の切り方による誤解とは別の問題です。","category":"ストラテジ系","subcategory":"企業活動","topic":"チャートジャンクの検出と改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-matrix-organization-dual-reporting-1454","questionText":"社員が製品別プロジェクトと職能部門の両方に所属している。プロジェクト責任者と部門長から異なる優先順位を指示され、作業が停滞した。マトリックス組織の特徴を踏まえた対応として最も適切なものはどれですか。","choices":["職能部門を廃止し、全社員を常に一つの固定業務だけに配置する","指示の不一致を社員個人に判断させ、管理者間では調整しない","二人の管理者からの指示を全て同時に最優先として扱う","権限と優先順位の決定手順を明確にし、管理者間で資源配分を調整する"],"correctChoiceIndex":3,"explanation":"マトリックス組織は、職能と製品・プロジェクトなど複数の軸を組み合わせ、横断的に資源を活用できます。一方で二重の指揮系統から指示が競合しやすいため、権限、優先順位、調整手順を明確にする必要があります。","category":"ストラテジ系","subcategory":"企業活動","topic":"マトリックス組織の二重指揮系統","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-fieldwork-process-observation-1455","questionText":"店舗のレジ待ちが発生する原因を調べたい。従業員の申告だけでなく、客と従業員の実際の動きや作業の中断を現場で把握する方法として最も適切なものはどれですか。","choices":["調査者が現場を観察し、行動や作業環境を記録する","利用者全員へ同じ選択式アンケートだけを配布する","担当者一人へのインタビューだけで全店舗の動きを推定する","売上ログだけを集計し、現場での行動は確認しない"],"correctChoiceIndex":0,"explanation":"フィールドワークは、実際の現場に入り、行動、環境、やり取りを観察して課題を把握する方法です。アンケートやインタビューでは得にくい無意識の動作や作業の流れも確認できます。ログ分析などと組み合わせると理解を深められます。","category":"ストラテジ系","subcategory":"企業活動","topic":"フィールドワークによる現場把握","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-patent-technology-forecast-1456","questionText":"自社が研究投資する技術領域を選ぶため、競合各社の技術開発の方向と参入の増減を早期に把握したい。分析方法として最も適切なものはどれですか。","choices":["自社の今期売上だけを製品別に並べる","公開された特許の出願人、分類、出願時期を分析し、技術領域の動向を捉える","競合製品の販売価格だけを一時点で比較する","自社の既存設備の減価償却期間だけを調べる"],"correctChoiceIndex":1,"explanation":"特許情報には技術内容、出願人、出願時期、技術分類などが含まれ、研究開発の方向や競合の活動を読む手掛かりになります。ただし、特許件数だけで将来性を断定せず、市場、事業戦略、技術の質なども併せて評価します。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"特許情報を用いた技術予測","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-valley-of-death-commercialization-1457","questionText":"大学との共同研究で試作品は完成したが、量産設備への投資、品質保証、販売先の開拓に必要な資金と体制が不足し、事業化が進まない。この状況を表すものとして最も適切なものはどれですか。","choices":["経験曲線","規模の経済","死の谷","ロングテール"],"correctChoiceIndex":2,"explanation":"研究成果や試作品があっても、量産、品質保証、資金調達、市場開拓などの壁を越えられず事業化に至らない状況を「死の谷」といいます。研究段階だけでなく、事業化に必要な資源や顧客価値の検証をつなぐ支援が重要です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"死の谷と事業化支援","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-product-process-innovation-1458","questionText":"製品イノベーションと工程イノベーションの組合せとして最も適切なものはどれですか。","choices":["製品：生産設備の配置変更、工程：新機能を持つ製品の発売","製品：作業手順の短縮、工程：新しい顧客価値を持つサービスの発売","製品：部品在庫の削減、工程：既存製品の広告表現の変更","製品：新しい価値を持つ製品の開発、工程：生産・提供方法の刷新"],"correctChoiceIndex":3,"explanation":"製品イノベーションは顧客に提供する製品・サービスの価値を新しくすることです。工程イノベーションは、生産や提供の方法を刷新して品質、速度、費用などを改善します。両者は対象が異なりますが、同時に進める場合もあります。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"製品・工程イノベーションの違い","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-cad-design-change-1459","questionText":"機械部品の寸法を変更したとき、図面データを更新し、関連する設計図の修正や版管理を効率化したい。中心的に用いる仕組みとして最も適切なものはどれですか。","choices":["CAD","CAM","CAE","POS"],"correctChoiceIndex":0,"explanation":"CAD（Computer-Aided Design）は、コンピュータを使って設計や製図を支援する仕組みです。図面の修正や再利用、版管理に役立ちます。CAEは解析、CAMは製造工程を支援するため、目的が異なります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"CADによる設計変更管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-jit-kanban-pull-production-1460","questionText":"組立工程で部品を使った分だけ、後工程から前工程へ補充指示を出し、必要な部品を必要な時に必要量だけ供給したい。最も適切な考え方はどれですか。","choices":["需要と無関係に前工程が最大量を作り続ける","かんばんを用いて後工程の使用量を基に前工程へ補充を指示する","全工程で一年分の部品を先に作り、在庫量を固定する","在庫状況を確認せず、各工程が独自に生産量を決める"],"correctChoiceIndex":1,"explanation":"JIT（Just In Time）は、必要なものを必要な時に必要な量だけ供給する考え方です。かんばん方式では後工程が使用した分を前工程へ知らせることで、後工程引取りの流れを作り、過剰在庫を抑えます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"JIT・かんばんによる後工程引取り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-mrp-material-requirements-calc-1461","questionText":"製品Pを1個生産するには部品Xが3個必要である。製品Pを120個生産し、部品Xの現在庫は70個、入荷予定は50個、安全在庫として20個を残す。このほかの需要はないとき、部品Xの正味所要量は何個ですか。","choices":["220個","240個","260個","310個"],"correctChoiceIndex":2,"explanation":"総所要量は3個×120個＝360個です。安全在庫20個を残すため、正味所要量は360＋20－現在庫70－入荷予定50＝260個です。MRP（Material Requirements Planning：資材所要量計画）では、部品表、在庫、入荷予定などから必要な発注・生産量を求めます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"MRPの正味所要量計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-embedded-firmware-role-1462","questionText":"家庭用エアコンで、温度センサーの値を読み取り、圧縮機やファンの動作を制御する機器内のソフトウェアとして最も適切なものはどれですか。","choices":["表計算ソフトウェア","データベース管理システム","Webブラウザ","ファームウェア"],"correctChoiceIndex":3,"explanation":"ファームウェアは、機器に組み込まれ、その機器固有の制御を行うソフトウェアです。記憶媒体の名称ではなく、センサー入力や装置の動作を制御する役割を指します。更新によって機能改善や不具合修正が行われることもあります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"組込み機器におけるファームウェア","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-ekyc-remote-identification-1463","questionText":"金融サービスの口座開設を、店舗への来訪や書類の郵送なしで完結させたい。オンラインで申込者の身元を確認する仕組みとして最も適切なものはどれですか。","choices":["eKYC","シングルサインオン","CAPTCHA","デジタルサイネージ"],"correctChoiceIndex":0,"explanation":"eKYC（electronic Know Your Customer）は、口座開設などで必要となる本人確認をオンラインで非対面に行う仕組みです。サービスへのログイン認証とは目的が異なり、取引開始時などに申込者の身元を確かめます。利用する確認方式は、対象業務に適用される法令や最新の公的な案内に従う必要があります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"eKYCによる非対面本人確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-escrow-transaction-protection-1464","questionText":"個人間のオンライン取引で、買手は商品が届かないことを、売手は商品を送っても代金が支払われないことを心配している。取引の安全性を高める仕組みとして最も適切なものはどれですか。","choices":["買手が商品到着前に売手へ直接全額送金する","第三者が代金を一時預かり、条件成立後に売手へ渡す","売手が買手の暗証番号を預かり、支払を代行する","当事者間の記録を残さず、口頭だけで受渡しを決める"],"correctChoiceIndex":1,"explanation":"エスクローは、信頼できる第三者が代金などを一時的に預かり、商品の受渡しなど所定の条件が満たされた後に相手へ渡す仕組みです。代金の未払いと商品の未着という双方のリスクを抑えられます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"エスクローによる取引保全","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-hems-energy-optimization-1465","questionText":"家庭で太陽光発電、蓄電池、空調、給湯器の電力使用量を見える化し、時間帯に応じて機器を制御したい。用いる仕組みとして最も適切なものはどれですか。","choices":["BEMS","POS","HEMS","SCM"],"correctChoiceIndex":2,"explanation":"HEMS（Home Energy Management System）は、家庭内のエネルギー使用量を計測・表示し、機器の制御や最適化を支援します。BEMS（Building Energy Management System）は主にビルを対象とするため、対象範囲が異なります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"HEMSによる家庭内エネルギー管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-green-procurement-evaluation-1466","questionText":"事務用品の調達先を評価する。価格と品質は同程度だが、製品の製造・使用・廃棄に伴う環境負荷には差がある。グリーン調達の考え方に沿う判断として最も適切なものはどれですか。","choices":["環境情報を比較せず、取引実績の長さだけで決める","環境情報だけで順位を決め、価格と品質は選定後に確認する","価格だけを唯一の基準とし、環境負荷は調達後に検討する","必要性、価格、品質に加え、ライフサイクルの環境負荷や供給者の取組も評価する"],"correctChoiceIndex":3,"explanation":"グリーン調達では、購入の必要性を考え、価格や品質などに加えて、できるだけ環境負荷の少ない製品・サービスや事業者を評価します。環境条件だけで品質や予算を無視するのではなく、複数の条件を踏まえて選定することが重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"調達先評価におけるグリーン調達","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-function-point-calc-1467","questionText":"あるシステムの未調整ファンクションポイントは、外部入力4個（重み3）、外部出力3個（重み4）、外部照会2個（重み3）だけで構成される。補正係数が1.1のとき、補正後の値は幾つですか。","choices":["33","30","36","27"],"correctChoiceIndex":0,"explanation":"未調整値は4×3＋3×4＋2×3＝30です。補正後は30×1.1＝33になります。ファンクションポイント法は、利用者から見た入出力やファイルなどの機能量を基に、ソフトウェア規模を見積もる方法です。","category":"マネジメント系","subcategory":"システム開発技術","topic":"ファンクションポイント法の補正計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-joint-review-requirements-1468","questionText":"業務システムの要件定義書を承認する前に、発注部門、実際の利用者、開発担当が集まり、業務手順、用語、受入条件の認識を合わせる。主な目的として最も適切なものはどれですか。","choices":["開発担当だけでプログラムの記述規則を統一する","関係者が要件の漏れや曖昧さ、認識差を早期に確認する","完成後の障害件数だけを測定し、要件は確認しない","発注部門をレビューから外し、技術要件だけを確定する"],"correctChoiceIndex":1,"explanation":"共同レビューでは、発注側、利用者、開発側などが要件を一緒に確認し、漏れ、矛盾、曖昧さ、用語の認識差を早期に見つけます。コードレビューではなく、作るべき業務機能や受入条件を合意するための活動です。","category":"マネジメント系","subcategory":"システム開発技術","topic":"要件定義における共同レビュー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-test-target-result-evaluation-1469","questionText":"結合テストの計画では100件を実施し重大欠陥を0件にすることを目標とした。期限時点で90件を実施し、重大欠陥が2件未解決である。評価として最も適切なものはどれですか。","choices":["実施済みが1件以上あるので、全目標を達成したと判断する","欠陥総数だけを見て、未実施10件は評価対象外とする","実施件数と未解決重大欠陥の両方が目標未達であり、影響と対応を判断する","計画値を実績値へ書き換え、差異がなかったことにする"],"correctChoiceIndex":2,"explanation":"テストの終了判断では、計画した実施件数や網羅範囲と、欠陥の重要度・未解決状況を実績と比較します。この例では実施件数が10件不足し、重大欠陥も残っているため、リスクと追加対応を評価する必要があります。","category":"マネジメント系","subcategory":"システム開発技術","topic":"テスト目標と実績の評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-relative-estimation-selection-1470","questionText":"新しい利用者ストーリーの作業量を見積もる。過去案件の工数を直接流用するのではなく、同じチームが他のストーリーとの大きさの比を合意したい。最も適切な方法はどれですか。","choices":["ソースコード行数だけを完成前に確定する","機能数を重み付けして絶対規模を求める","過去案件全体の実績工数をそのまま当てはめる","基準となる作業と比較し、相対的な大きさをポイントで表す"],"correctChoiceIndex":3,"explanation":"相対見積では、基準となる作業と比べて大きさや複雑さをポイントなどで表します。類推見積は類似する過去案件の実績を基に工数や費用を推定する方法であり、比較対象と使い方が異なります。","category":"マネジメント系","subcategory":"システム開発技術","topic":"相対見積と類推見積の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-slcp-common-frame-role-1471","questionText":"発注者と受注者が、ソフトウェアの企画、開発、運用、保守で行う作業と役割を共通の言葉で整理するために参照するものとして最も適切なものはどれですか。","choices":["SLCPや共通フレーム","ITILのサービスデスク手順","CMMIの成熟度レベルだけ","財務会計の勘定科目表"],"correctChoiceIndex":0,"explanation":"SLCP（Software Life Cycle Process）は、ソフトウェアの取得、供給、開発、運用、保守などのライフサイクル作業を整理した考え方です。共通フレームは関係者が作業内容や役割を共通に理解する助けとなります。ITILやCMMIとは対象と目的が異なります。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"SLCP・共通フレームの役割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-development-model-selection-1472","questionText":"三つの案件に開発モデルを割り当てる。案件Xは高い技術リスクを段階ごとに評価したい。案件Yは画面要件を試作品で利用者と確認したい。案件Zは小規模で、部品を再利用して短期間に開発したい。組合せとして最も適切なものはどれですか。","choices":["X：RAD、Y：スパイラル、Z：プロトタイピング","X：スパイラル、Y：プロトタイピング、Z：RAD","X：プロトタイピング、Y：RAD、Z：スパイラル","X：ウォータフォール、Y：スパイラル、Z：プロトタイピング"],"correctChoiceIndex":1,"explanation":"スパイラルモデルは反復ごとにリスクを評価しながら進めるのに適します。プロトタイピングは試作品で要件を具体化し、RAD（Rapid Application Development）はツールや部品再利用などで短期開発を目指します。案件の不確実性、リスク、納期に合わせて選びます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"スパイラル・プロトタイピング・RADの選択","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-tdd-test-first-cycle-1473","questionText":"小さな機能を追加するとき、先に期待動作を表すテストを書いて失敗を確認し、そのテストが通る最小限の実装を行った後、設計を改善する。該当する進め方はどれですか。","choices":["完成後に全テストを一度だけ行う","テストを作らず、実装量だけで品質を判断する","TDDのサイクルを用いる","運用中の監視だけで設計を決める"],"correctChoiceIndex":2,"explanation":"TDD（Test-Driven Development：テスト駆動開発）は、失敗するテストを書き、通る実装を行い、コードを改善する短いサイクルを繰り返します。単に単体テストを実施することや、CI（Continuous Integration：継続的インテグレーション）で自動実行することとは区別されます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"TDDのテスト先行サイクル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-spoc-request-routing-1474","questionText":"利用者からの障害連絡や操作質問が複数部署へ直接届き、担当部署への引継ぎ状況を追跡できない。改善策として最も適切なものはどれですか。","choices":["利用者自身に毎回担当部署を調査させる","全ての問合せを記録せず、最初に受けた担当者の記憶で管理する","問合せ窓口を部署ごとに増やし、引継ぎ規則をなくす","SPOCを設けて受付を一本化し、分類、引継ぎ、進捗を追跡する"],"correctChoiceIndex":3,"explanation":"SPOC（Single Point of Contact）は、利用者に対する一元的な連絡窓口です。サービスデスクなどが受付内容を記録し、適切な担当へ引き継ぎ、解決まで追跡することで、利用者の迷いと対応漏れを減らします。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"SPOCによる問合せ受付・引継ぎ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-power-protection-selection-1475","questionText":"データセンターで、瞬間的な電圧低下には機器を止めずに対応し、長時間停電では業務を継続し、落雷による過電圧からも機器を守りたい。設備の組合せとして最も適切なものはどれですか。","choices":["UPS、自家発電設備、サージ保護装置を目的に応じて組み合わせる","自家発電設備だけで瞬断と過電圧の全てを防ぐ","サージ保護装置だけで長時間の電力供給を続ける","UPSを外し、停電時はデータを保存せず電源を切る"],"correctChoiceIndex":0,"explanation":"UPS（Uninterruptible Power Supply：無停電電源装置）は瞬断や短時間停電を補い、自家発電設備は長時間の電力供給に用います。サージ保護装置は落雷などによる過電圧から機器を守ります。脅威ごとに役割が異なるため、必要に応じて組み合わせます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"UPS・自家発電・サージ防護の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-audit-workpaper-traceability-1476","questionText":"システム監査の責任者が、監査報告書の指摘について、どの手続を実施し、どの証拠から、どの判断を経て結論に至ったかを確認したい。監査調書の管理として最も適切なものはどれですか。","choices":["最終結論だけを残し、実施手続と証拠を削除する","監査手続、入手証拠、評価、結論の対応関係が追跡できるよう記録する","被監査部門の口頭説明だけを残し、監査人の評価を記録しない","報告書の提出後は、承認や変更の履歴を残さず上書きする"],"correctChoiceIndex":1,"explanation":"監査調書には、計画した手続、実施結果、得られた監査証拠、監査人の評価、結論などを記録します。相互の対応関係を追跡できれば、結論の根拠や監査品質を後から検証できます。証拠の量と質を問う監査証拠の十分性・適切性とは別の論点です。","category":"マネジメント系","subcategory":"システム監査","topic":"監査調書と証拠・結論の追跡可能性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-communication-paths-calc-1477","questionText":"8人のプロジェクトメンバーが、全員互いに1対1で直接連絡できる。2人の組を一つの経路として重複なく数えると、コミュニケーション経路は幾つですか。","choices":["56経路","16経路","28経路","21経路"],"correctChoiceIndex":2,"explanation":"人数をnとすると、2人の組合せはn(n－1)÷2です。8人では8×7÷2＝28経路になります。AからBとBからAを別経路として二重に数えないことがポイントです。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクトのコミュニケーション経路数","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-venn-set-inclusion-exclusion-1478","questionText":"ある研修で、表計算を学んだ人が32人、データベースを学んだ人が25人、両方を学んだ人が12人いた。少なくとも一方を学んだ人は何人ですか。","choices":["69人","57人","20人","45人"],"correctChoiceIndex":3,"explanation":"両方を学んだ12人は、32人と25人の双方に含まれているため一度引きます。少なくとも一方を学んだ人数は32＋25－12＝45人です。これは集合の和集合を包除の考え方で求める計算です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"ベン図による集合の包除計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-permutation-combination-selection-1479","questionText":"6人の候補者から2人を選ぶ。選んだ2人の役割を区別しない場合と、委員長・副委員長として役割を区別する場合の数え方として最も適切なものはどれですか。","choices":["役割を区別しないときは組合せ、区別するときは順列を使う","役割を区別しない場合も、選出の順番を別の結果として数える","役割を区別する場合も、同じ2人なら一つの結果として数える","どちらも候補者数から選出人数を引いて数える"],"correctChoiceIndex":0,"explanation":"組合せは選ばれた要素の順序や役割を区別しない場合に使います。委員長と副委員長のように、同じ2人でも役割の割当てが異なれば別の結果になる場合は順列で数えます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"順列と組合せの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-function-argument-return-trace-1480","questionText":"次の疑似言語を実行したとき、最後に出力される値は幾つですか。関数adjustの仮引数xと局所変数yは、呼出し元の変数aとは別に扱うものとします。\n\n関数 adjust(x)\n  y ← x × 2\n  y ＋ 1 を返す\n関数終わり\n\na ← 3\nb ← adjust(a)\na ← a ＋ 1\nb ＋ a を出力する","choices":["10","11","12","14"],"correctChoiceIndex":1,"explanation":"実引数aの値3が仮引数xへ渡り、局所変数yは3×2＝6、戻り値は7なのでbは7になります。呼出し元のaは関数内で変化せず、その後4になるため、出力は7＋4＝11です。実引数、仮引数、局所変数、戻り値を分けて追跡します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"関数・引数・戻り値の呼出し追跡","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-markup-tag-structure-troubleshooting-1481","questionText":"マークアップ言語で記述した文書の一部が意図した階層で表示されない。該当箇所では、内側の要素を閉じる前に外側の要素を閉じていた。最初に行う確認として最も適切なものはどれですか。","choices":["全ての開始タグを削除し、文字列だけにする","タグ名を全て同じ名前へ変更する","開始・終了タグの対応と、要素が正しく入れ子になっているかを確認する","文書内容に関係なく、画像ファイルの解像度だけを変更する"],"correctChoiceIndex":2,"explanation":"HTML（HyperText Markup Language）やXML（Extensible Markup Language）では、開始タグと終了タグの対応や、要素の入れ子構造が文書構造を表します。内側の要素を先に閉じるなど、階層が正しくなるよう確認します。見た目だけでなく、構造として整合していることが重要です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"HTML/XMLのタグ構造不良の切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-library-reuse-selection-1482","questionText":"新システムで帳票のPDF出力が必要になった。実績のある外部ライブラリを再利用するか、自社で新規開発するかを判断する観点として最も適切なものはどれですか。","choices":["機能を確認せず、ファイル名が短い方を選ぶ","利用者数だけで決め、更新停止や保守体制は評価しない","ライセンスだけを確認し、必要機能や安全性は確認しない","必要機能、互換性、安全性、保守・更新状況、利用条件を総合評価する"],"correctChoiceIndex":3,"explanation":"既存ライブラリを再利用すると開発期間を短縮できる一方、機能の適合、互換性、脆弱性対応、更新継続性、利用条件を確認する必要があります。ライセンスだけ、又は機能だけで判断せず、導入後の保守まで含めて評価します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"外部ライブラリ再利用の判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-interrupt-dma-comparison-1483","questionText":"割込みとDMAの説明の組合せとして最も適切なものはどれですか。","choices":["割込みはCPUへ事象を通知し、DMAはCPUの逐次転送を減らして装置と主記憶のデータ転送を行う","割込みが装置と主記憶を直接つなぎ、DMAがキー入力だけをCPUへ通知する","割込みではCPUが定期的に装置を確認し、DMAでは全データがCPUのレジスタを経由する","割込みは処理完了までCPUを待機させ、DMAは主記憶を使わず装置間だけで転送する"],"correctChoiceIndex":0,"explanation":"割込みは、入出力完了などの事象をCPU（Central Processing Unit：中央処理装置）へ通知し、現在の処理を一時中断して対応させる仕組みです。DMA（Direct Memory Access）は、CPUが一語ずつ転送する負担を減らし、入出力装置と主記憶の間でまとまったデータを転送します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"割込みとDMAの役割比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-fail-safe-foolproof-selection-1484","questionText":"二つの設計を行う。設計Xは温度センサーが故障したとき加熱装置を停止する。設計Yは誤った向きでは部品を差し込めない形状にする。対応する考え方の組合せとして最も適切なものはどれですか。","choices":["Xは故障しても処理を継続する設計、Yは予備機へ切り替える設計に当たる","X：フェールセーフ、Y：フールプルーフ","Xは誤操作を防ぐ設計、Yは故障時に機能を継続する設計に当たる","Xはデータを複製する設計、Yは故障を事前に予知する設計に当たる"],"correctChoiceIndex":1,"explanation":"フェールセーフは故障時に装置を安全側へ移す考え方で、センサー故障時の加熱停止が該当します。フールプルーフは人が誤操作しにくい設計で、誤った向きでは差し込めない形状が該当します。故障しても機能を継続するフォールトトレラントとは異なります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"フェールセーフ・フールプルーフの選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-spreadsheet-cell-reference-1485","questionText":"表計算でセルD2に「=$B2*C$1」という式を入力し、右へ1列、下へ1行コピーしてセルE3へ貼り付けた。E3の式として最も適切なものはどれですか。","choices":["=B3*D2","=$C3*D$2","=$B3*D$1","=B$3*$D1"],"correctChoiceIndex":2,"explanation":"$B2は列Bが絶対参照で行が相対参照なので、下へコピーすると$B3になります。C$1は列が相対参照で行1が絶対参照なので、右へコピーするとD$1になります。したがって式は=$B3*D$1です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"表計算の相対・絶対・複合参照","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-presentation-tool-selection-1486","questionText":"会議で説明するため、内容を複数のページに分け、見出し、図表、箇条書き、発表者用ノートを組み合わせた資料を作りたい。最も適切なソフトウェアはどれですか。","choices":["長文の文書作成を中心とするワープロソフトウェア","数値の集計や表作成を中心とする表計算ソフトウェア","印刷物の精密な紙面配置を中心とするDTPソフトウェア","スライドによる発表資料を作るプレゼンテーションソフトウェア"],"correctChoiceIndex":3,"explanation":"プレゼンテーションソフトウェアは、スライド単位で文章や図表を配置し、発表用資料を作成・表示するためのソフトウェアです。DTP（Desktop Publishing）は印刷物の紙面作成を中心とするため、目的が異なります。製品名ではなく、スライド構成や発表支援という用途で判断します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"プレゼンテーションソフトの基本用途","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-3d-printer-role-1487","questionText":"設計した部品の三次元データを使い、樹脂などを層状に積み重ねて試作品を作る装置として最も適切なものはどれですか。","choices":["3Dプリンター","立体物の形状を読み取る3Dスキャナー","用紙へ平面画像を印刷するレーザープリンター","大判の線画を用紙へ出力するプロッター"],"correctChoiceIndex":0,"explanation":"3Dプリンターは、三次元データを基に材料を積層するなどして立体物を造形します。紙などへ二次元画像を出力する通常のプリンターとは、出力対象と用途が異なります。試作品や少量部品の製作などに利用されます。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"3Dプリンターによる立体造形","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-wearable-device-selection-1488","questionText":"作業員の安全管理のため、勤務中の心拍数や転倒を継続的に計測し、異常時に通知したい。利用する端末として最も適切なものはどれですか。","choices":["机に固定したデスクトップPC","身体に装着できるセンサー付き端末","会議室に設置したプロジェクター","印刷専用のレーザープリンター"],"correctChoiceIndex":1,"explanation":"ウェアラブル端末は、腕時計型や衣服型など身体に装着して利用する情報機器です。センサーにより身体状態や動きを継続計測できるため、安全管理や健康管理などに利用できます。収集する情報の目的と取扱いにも配慮が必要です。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"ウェアラブル端末の利用場面","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-head-mounted-display-selection-1489","questionText":"保守作業者が両手を使ったまま、視野内に手順や三次元映像を表示したい。通常の据置きディスプレイと比べて適した装置はどれですか。","choices":["フラットベッドスキャナー","大型プロジェクター","HMD","ペンタブレット"],"correctChoiceIndex":2,"explanation":"HMD（Head Mounted Display）は頭部に装着し、利用者の視野近くへ映像を表示する装置です。両手を使う作業支援や仮想・拡張現実の表示に利用できます。机上や壁面へ表示する装置とは表示位置と利用形態が異なります。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"ヘッドマウントディスプレイの表示特性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-latch-information-organization-1490","questionText":"全国の店舗情報を、利用者が現在地から近い順に探せるよう整理したい。LATCHのうち最も適した整理軸はどれですか。","choices":["Alphabet","Time","Category","Location"],"correctChoiceIndex":3,"explanation":"LATCHはLocation（場所）、Alphabet（アルファベット・五十音）、Time（時間）、Category（分類）、Hierarchy（階層）という情報整理の代表的な軸です。現在地から近い店舗を探す目的には、場所による整理が適しています。利用目的に応じて軸を選ぶことが重要です。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"LATCHによる情報整理軸の選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-signifier-interface-cue-1491","questionText":"スマートフォン画面で、文字だけでは押せるか分かりにくい操作部分がある。利用者へ操作可能であることを示す改善として最も適切なものはどれですか。","choices":["ボタンらしい形、ラベル、色の変化など、操作を示す手掛かりを与える","操作部分を背景と完全に同じ見た目にし、説明も削除する","押しても反応を返さず、処理完了まで状態を示さない","全ての操作を画面外の説明書だけに記載する"],"correctChoiceIndex":0,"explanation":"シグニファイアは、対象をどのように操作できるかを利用者へ示す知覚可能な手掛かりです。ボタンの形、分かりやすいラベル、状態変化などにより、押せる場所や操作結果を伝えます。GUI（Graphical User Interface）部品の名称そのものではなく、操作を示唆する役割が重要です。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"シグニファイアによる操作可能性の示唆","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-vui-recognition-recovery-1492","questionText":"音声で予約を受け付けるシステムが、日時を正しく認識できなかった。利用者が誤予約を避けながら操作を続けられる設計として最も適切なものはどれですか。","choices":["推測した日時で確認せず予約を確定する","認識した内容を読み上げ、訂正、言い換え、取消し、再入力の手段を示す","認識失敗を表示せず、毎回最初の候補を自動選択する","音声入力を終了し、理由を示さず全操作を破棄する"],"correctChoiceIndex":1,"explanation":"VUI（Voice User Interface）では、音声認識が失敗したり複数の解釈が生じたりする前提で回復手順を設計します。認識内容の確認、言い換えの案内、訂正、取消し、再入力を用意すると、誤操作を減らしながら利用を継続できます。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"VUIの音声認識失敗時の回復設計","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-responsive-web-layout-1493","questionText":"同じWebページをPC、タブレット、スマートフォンで利用する。画面幅に応じて列数、画像サイズ、メニュー配置を変え、読みやすくしたい。適切な設計はどれですか。","choices":["PC用の固定幅画面を全端末で縮小表示するだけにする","端末ごとに内容が異なる無関係なページを手作業で配布する","画面サイズなどに応じてレイアウトを適応させる","スマートフォンでは文章を全て画像へ変換する"],"correctChoiceIndex":2,"explanation":"レスポンシブWebデザインは、画面サイズなどの条件に応じてレイアウトや表示要素を調整する設計です。単にPC画面全体を縮小するのではなく、列数やナビゲーションを組み替えて読みやすさと操作性を保ちます。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"レスポンシブWebデザイン","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-hsb-color-adjustment-1494","questionText":"画像編集で、ある色を青系から緑系へ変えたいが、鮮やかさと明るさはできるだけ保ちたい。主に調整する要素はどれですか。","choices":["彩度","明度","解像度","色相"],"correctChoiceIndex":3,"explanation":"色相は赤、青、緑など色合いの違いを表します。彩度は鮮やかさ、明度は明るさを表すため、青系から緑系へ色合いを変える場合は主に色相を調整します。RGBやCMYKは色を表現する別の方式です。","category":"テクノロジ系","subcategory":"情報メディア","topic":"色相・明度・彩度による色調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-vr-ar-mr-use-comparison-1495","questionText":"仮想空間への没入、現実への情報重畳、現実と仮想の融合という三つの利用形態を、VR、AR、MRへ正しく対応付けたものはどれですか。","choices":["VRは仮想空間への没入、ARは現実への情報重畳、MRは現実と仮想を融合して相互作用させる","現実の映像へ案内を重ねる方式だけをVRと呼び、ARとMRは同じものとする","仮想空間へ没入する方式だけをARと呼び、現実との融合はVRとする","VR、AR、MRはいずれも現実空間を使わず、完全な仮想空間だけを表示する"],"correctChoiceIndex":0,"explanation":"VR（Virtual Reality）は主に仮想空間へ没入する体験、AR（Augmented Reality）は現実の映像や空間へ情報を重ねる体験です。MR（Mixed Reality）は現実と仮想の物体を融合し、位置関係を保ちながら相互作用させる考え方です。","category":"テクノロジ系","subcategory":"情報メディア","topic":"VR・AR・MRの利用形態比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-dpi-ppi-quality-troubleshooting-1496","questionText":"同じ画素数の画像を大きな用紙に印刷すると粗く見える一方、高密度の画面では小さく表示される。印刷と画面の密度を区別して説明する組合せとして最も適切なものはどれですか。","choices":["dpiは画面の色数、ppiは印刷速度を表す","dpiは印刷時の単位長さ当たりの点、ppiは画面などの単位長さ当たりの画素の密度を表す","dpiは音声の標本化周波数、ppiは動画のフレーム数を表す","dpiとppiはどちらも画像ファイルの圧縮率だけを表す"],"correctChoiceIndex":1,"explanation":"dpi（dots per inch）は印刷などで1インチ当たりに配置する点の密度、ppi（pixels per inch）は画面などで1インチ当たりに並ぶ画素の密度を表します。画像の総画素数が同じなら、出力サイズを大きくするほど密度が下がり、粗く見えることがあります。","category":"テクノロジ系","subcategory":"情報メディア","topic":"dpi・ppiと画像品質の切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-nosql-model-selection-1497","questionText":"三つの要件にNoSQLのデータモデルを割り当てる。要件Xはキーから単純な値を高速取得したい。要件Yは項目構成が異なる商品情報を文書単位で保持したい。要件Zは人間関係のつながりをたどりたい。組合せとして最も適切なものはどれですか。","choices":["X：グラフ型、Y：KVS、Z：ドキュメント型","X：ドキュメント型、Y：グラフ型、Z：KVS","X：KVS、Y：ドキュメント型、Z：グラフ型","X：関係データベース、Y：KVS、Z：表計算"],"correctChoiceIndex":2,"explanation":"KVS（Key-Value Store）はキーによる単純な値の取得、ドキュメント型は柔軟な項目を持つ文書単位の保存、グラフ型はノードと関係をたどる処理に適します。NoSQLは一つの方式ではなく、データ構造と利用目的に応じて選びます。","category":"テクノロジ系","subcategory":"データベース","topic":"KVS・ドキュメント・グラフ型NoSQLの選択","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-lpwa-iot-selection-1498","questionText":"山間部に多数の水位センサーを設置し、少量の測定値を数十分ごとに送信する。電池交換を減らし、比較的広い範囲を少ない基地局でカバーしたい。適した無線通信の特徴はどれですか。","choices":["Wi-Fiを使い、高速な動画の連続送信を優先する","BLEを使い、端末のすぐ近くとの通信だけに限定する","5Gを使い、大容量・低遅延の通信を最優先する","LPWAの低消費電力・広域・少量データ向けの特性を利用する"],"correctChoiceIndex":3,"explanation":"LPWA（Low Power Wide Area）は、低消費電力で比較的広い範囲へ少量のデータを送るIoT用途に適します。高速・大容量通信を目的とするWi-Fiや、主に近距離で使うBLE（Bluetooth Low Energy）とは得意な用途が異なります。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"LPWAの低消費電力・広域通信","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-sdn-centralized-control-1499","questionText":"多数のネットワーク機器を、機器ごとに個別設定するのではなく、全体方針に基づいてプログラムから一元的に制御したい。この考え方として最も適切なものはどれですか。","choices":["端末ごとに独立した文書ファイルで経路を記録する","通信内容を全て同じVLANへ固定し、制御方針を持たない","SDNで制御機能と転送機能を分離し、ネットワーク全体をソフトウェアから制御する","VPNを使えば、全ネットワーク機器の転送規則が自動的に同一になる"],"correctChoiceIndex":2,"explanation":"SDN（Software-Defined Networking）は、ネットワークの制御機能をデータ転送機能から分離し、ソフトウェアから集中・一元的に制御しやすくする考え方です。VLAN（Virtual Local Area Network）は論理的なネットワーク分割、VPN（Virtual Private Network）は仮想的な専用通信路に関する技術で、目的が異なります。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"SDNの制御・転送機能分離","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-tpm-secure-boot-troubleshooting-1500","questionText":"PCの起動時に改ざんされた起動プログラムが実行されるリスクを減らし、機器固有の鍵を安全に扱いたい。対策の組合せとして最も適切なものはどれですか。","choices":["TPMだけで全ての起動コードを検証し、セキュアブートだけで鍵を保管する","ディスク暗号化だけを使い、起動コードの署名は検証しない","ファームウェアのパスワードだけを設定し、未確認の起動コードも実行する","セキュアブートで起動時の署名を検証し、TPMで鍵や測定値を保護する"],"correctChoiceIndex":3,"explanation":"セキュアブートは、起動時にソフトウェアの署名を検証し、信頼されていない起動コードの実行を抑えます。TPM（Trusted Platform Module）は暗号鍵や起動状態の測定値などを保護するためのセキュリティ機能です。両者を組み合わせることで、起動環境の信頼性を高められます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"TPM・セキュアブートによる起動信頼性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"}];


(function (global) {
  'use strict';

  const REVIEW_INTERVAL_DAYS = Object.freeze([0, 1, 3, 7, 14, 30]);
  const PRACTICE_COUNT_OPTIONS = Object.freeze([5, 10, 20, 50]);

  function assertDate(value) {
    const date = value instanceof Date ? new Date(value.getTime()) : new Date(value);
    if (Number.isNaN(date.getTime())) throw new Error(`日時が不正です: ${String(value)}`);
    return date;
  }

  function toLocalDateKey(value) {
    const date = assertDate(value);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function addLocalCalendarDays(value, days) {
    if (!Number.isInteger(days)) throw new Error(`日数が整数ではありません: ${days}`);
    const source = assertDate(value);
    const result = new Date(source.getFullYear(), source.getMonth(), source.getDate() + days, 12, 0, 0, 0);
    return toLocalDateKey(result);
  }

  function calculateQuestionReviewStateAfterAnswer(questionId, isCorrect, existingState, answeredAt) {
    const answeredDate = assertDate(answeredAt);
    const updatedAt = answeredDate.toISOString();

    if (!existingState) {
      if (isCorrect) return null;
      return {
        questionId,
        reviewStage: 0,
        nextReviewAt: toLocalDateKey(answeredDate),
        completed: false,
        createdAt: updatedAt,
        updatedAt,
      };
    }

    if (!isCorrect) {
      return {
        ...existingState,
        reviewStage: 0,
        nextReviewAt: toLocalDateKey(answeredDate),
        completed: false,
        updatedAt,
      };
    }

    if (existingState.completed) return { ...existingState };

    const nextStage = existingState.reviewStage >= 5 ? null : existingState.reviewStage + 1;
    if (nextStage === null) {
      return {
        ...existingState,
        nextReviewAt: null,
        completed: true,
        updatedAt,
      };
    }

    return {
      ...existingState,
      reviewStage: nextStage,
      nextReviewAt: addLocalCalendarDays(answeredDate, REVIEW_INTERVAL_DAYS[nextStage]),
      completed: false,
      updatedAt,
    };
  }

  function isQuestionReviewDue(state, currentDate = new Date()) {
    return !state.completed && state.nextReviewAt !== null && state.nextReviewAt <= toLocalDateKey(currentDate);
  }

  function compareNewestFirst(a, b) {
    const ta = Date.parse(a.answeredAt);
    const tb = Date.parse(b.answeredAt);
    if (Number.isFinite(ta) && Number.isFinite(tb) && ta !== tb) return tb - ta;
    return (b.id || 0) - (a.id || 0);
  }

  function getLatestAnswerHistoryByQuestion(history) {
    const latest = new Map();
    [...history].sort(compareNewestFirst).forEach((entry) => {
      if (!latest.has(entry.questionId)) latest.set(entry.questionId, entry);
    });
    return [...latest.values()];
  }

  function getLatestIncorrectQuestionIds(history) {
    return getLatestAnswerHistoryByQuestion(history)
      .filter((entry) => !entry.isCorrect)
      .map((entry) => entry.questionId);
  }

  function getUnansweredQuestions(history, questions) {
    const answered = new Set(history.map((entry) => entry.questionId));
    return questions.filter((q) => !answered.has(q.id));
  }

  function getIncorrectReviewQuestions(history, questions) {
    const ids = new Set(getLatestIncorrectQuestionIds(history));
    return questions.filter((q) => ids.has(q.id));
  }

  function getDueReviewQuestions(states, questions, currentDate = new Date()) {
    const ids = new Set(states.filter((s) => isQuestionReviewDue(s, currentDate)).map((s) => s.questionId));
    return questions.filter((q) => ids.has(q.id));
  }

  function summarizeHistoryByDate(history) {
    const counts = new Map();
    history.forEach((entry) => {
      const date = toLocalDateKey(entry.answeredAt);
      const current = counts.get(date) || { answerCount: 0, correctCount: 0 };
      counts.set(date, {
        answerCount: current.answerCount + 1,
        correctCount: current.correctCount + (entry.isCorrect ? 1 : 0),
      });
    });
    return [...counts.entries()]
      .map(([date, c]) => ({
        date,
        answerCount: c.answerCount,
        correctCount: c.correctCount,
        accuracyRate: c.answerCount === 0 ? 0 : Math.round((c.correctCount / c.answerCount) * 100),
      }))
      .sort((a, b) => b.date.localeCompare(a.date));
  }

  function getTodayStudySummary(history, currentDate = new Date()) {
    const today = toLocalDateKey(currentDate);
    return summarizeHistoryByDate(history).find((item) => item.date === today) || {
      date: today,
      answerCount: 0,
      correctCount: 0,
      accuracyRate: 0,
    };
  }

  function summarizeReviewSchedule(states, currentDate = new Date()) {
    const today = toLocalDateKey(currentDate);
    const counts = new Map();
    states.forEach((state) => {
      if (state.completed || state.nextReviewAt === null) return;
      const date = state.nextReviewAt <= today ? today : state.nextReviewAt;
      counts.set(date, (counts.get(date) || 0) + 1);
    });
    return [...counts.entries()]
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, count]) => ({ date, count, isDue: date === today }));
  }

  function formatDate(dateKey) {
    return dateKey.replace(/-/g, '/');
  }

  function getStudyMode(mode) {
    if (mode === 'incorrect') return '不正解復習';
    if (mode === 'scheduled') return '今日の復習';
    return '通常演習';
  }

  function sanitizePracticeCount(value) {
    const n = Number(value);
    return PRACTICE_COUNT_OPTIONS.includes(n) ? n : 5;
  }

  global.ITPLogic = Object.freeze({
    REVIEW_INTERVAL_DAYS,
    PRACTICE_COUNT_OPTIONS,
    toLocalDateKey,
    addLocalCalendarDays,
    calculateQuestionReviewStateAfterAnswer,
    isQuestionReviewDue,
    getLatestAnswerHistoryByQuestion,
    getLatestIncorrectQuestionIds,
    getUnansweredQuestions,
    getIncorrectReviewQuestions,
    getDueReviewQuestions,
    summarizeHistoryByDate,
    getTodayStudySummary,
    summarizeReviewSchedule,
    formatDate,
    getStudyMode,
    sanitizePracticeCount,
  });
})(window);


(function (global) {
  'use strict';

  const DEFAULT_DB_NAME = 'itpassport-study-web-v1';
  const DB_VERSION = 1;
  const HISTORY_STORE = 'answerHistory';
  const REVIEW_STORE = 'reviewState';
  const SETTINGS_STORE = 'settings';
  const dbPromises = new Map();

  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB request failed.'));
    });
  }

  function transactionDone(transaction) {
    return new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted.'));
      transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed.'));
    });
  }

  function openDatabase(dbName = DEFAULT_DB_NAME) {
    if (dbPromises.has(dbName)) return dbPromises.get(dbName);
    const promise = new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(HISTORY_STORE)) {
          const history = db.createObjectStore(HISTORY_STORE, { keyPath: 'id', autoIncrement: true });
          history.createIndex('questionId', 'questionId', { unique: false });
          history.createIndex('answeredAt', 'answeredAt', { unique: false });
          history.createIndex('eventId', 'eventId', { unique: true });
        }
        if (!db.objectStoreNames.contains(REVIEW_STORE)) {
          const review = db.createObjectStore(REVIEW_STORE, { keyPath: 'questionId' });
          review.createIndex('nextReviewAt', 'nextReviewAt', { unique: false });
        }
        if (!db.objectStoreNames.contains(SETTINGS_STORE)) {
          db.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => {
          db.close();
          dbPromises.delete(dbName);
        };
        resolve(db);
      };
      request.onerror = () => {
        dbPromises.delete(dbName);
        reject(request.error || new Error('学習データベースを開けませんでした。'));
      };
      request.onblocked = () => {
        console.warn('IndexedDB upgrade is blocked by another tab.');
      };
    });
    dbPromises.set(dbName, promise);
    return promise;
  }

  async function initializeDatabase(dbName = DEFAULT_DB_NAME) {
    await openDatabase(dbName);
  }

  async function getAllAnswerHistory(dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction(HISTORY_STORE, 'readonly');
    const done = transactionDone(tx);
    const rows = await requestToPromise(tx.objectStore(HISTORY_STORE).getAll());
    await done;
    return rows.sort((a, b) => {
      const ta = Date.parse(a.answeredAt);
      const tb = Date.parse(b.answeredAt);
      if (Number.isFinite(ta) && Number.isFinite(tb) && ta !== tb) return tb - ta;
      return (b.id || 0) - (a.id || 0);
    });
