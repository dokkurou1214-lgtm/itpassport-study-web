ム監査","topic":"権限設定結果の監査再実施","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-change-deployment-reconciliation-1272","questionText":"本番変更の監査で、承認済み変更は80件だが、配布ツールには82件の反映記録がある。監査人の対応として最も適切なものはどれですか。","choices":["承認済み80件だけを確認し、追加2件は配布ツールの仕様として扱う","承認番号、配布対象、実施者、時刻を突合し、追加2件の承認・緊急変更記録を確認する","配布件数が承認件数より多いので、82件全てを不正変更と結論付ける","件数差を監査報告へ記載し、個別記録の確認は運用部門へ任せる"],"correctChoiceIndex":1,"explanation":"変更監査では、承認記録と実際の本番反映を変更単位で突合します。件数差だけで結論を出さず、追加分が緊急変更など正規の手続を経たか、実施者と時刻を含めて確認します。","category":"マネジメント系","subcategory":"システム監査","topic":"変更承認と本番反映記録の突合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-problem-workaround-effectiveness-1273","questionText":"毎朝発生する処理停止に対し、再起動手順を案内すると10分で復旧できるようになったが、停止件数は減っていない。対応として最も適切なものはどれですか。","choices":["復旧時間が短くなったので問題を完了し、停止件数はインシデント管理だけで扱う","再起動手順を恒久対策とし、原因調査は復旧時間が再び長くなるまで保留する","回避策の復旧効果を維持しつつ、問題管理で根本原因と恒久対策を継続して調べる","停止件数を減らすため、同じ停止を一件のインシデントとしてまとめて記録する"],"correctChoiceIndex":2,"explanation":"回避策は利用者影響や復旧時間を減らせますが、根本原因を除去したとは限りません。インシデント対応として回避策を活用しつつ、問題管理で再発原因と恒久対策を進めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"回避策の有効性と恒久対策の切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-major-incident-review-priority-1274","questionText":"重大障害の復旧後レビューで、監視検知の遅れ、連絡先の古さ、復旧手順の誤り、同じ構成の別サービスへの波及可能性が判明した。改善の進め方として最も適切なものはどれですか。","choices":["最初に見つかった監視設定だけを修正し、他の問題は次回障害後に扱う","連絡先だけを最新化し、波及可能性は実際に障害が起きたサービスで評価する","全項目を同じ期限で同時対応し、事業影響や依存関係による順序は付けない","再発時の影響、発生可能性、他サービスへの波及、対策の依存関係で優先順位を決める"],"correctChoiceIndex":3,"explanation":"復旧後レビューでは、検知、連絡、手順、構成など複数の改善事項を整理します。事業影響や再発可能性、波及範囲、対策間の依存関係を評価し、効果の高い順に担当と期限を決めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"重大障害レビューの改善優先順位","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-service-improvement-benefit-priority-1275","questionText":"改善登録簿に、監視自動化、FAQ更新、サーバ増強の三案がある。優先順位を更新する方法として最も適切なものはどれですか。","choices":["期待効果、未対応リスク、費用、依存関係、実施可能性を評価し、根拠とともに順位を更新する","登録日が古い順を固定し、新しい障害傾向が見つかっても順位は変えない","費用が最も低い案を優先し、効果と他施策への依存は実施後に測定する","各担当者が自分の案を個別に進め、サービス全体の優先順位は設けない"],"correctChoiceIndex":0,"explanation":"改善登録簿は、案を保存するだけでなく、効果、リスク、費用、依存関係、実施可能性を基に優先順位を管理するために使います。状況や実績が変われば、根拠を記録して順位も見直します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"改善登録簿の効果・リスク・依存関係評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-sample-rate-calc-1276","questionText":"監査対象の取引800件から120件を標本として確認した。抽出比率を「標本数÷母集団数×100」で求めるとき、抽出比率と未確認件数の組合せはどれですか。","choices":["抽出比率12%、未確認680件","抽出比率15%、未確認680件","抽出比率15%、未確認720件","抽出比率17.6%、未確認680件"],"correctChoiceIndex":1,"explanation":"抽出比率は120÷800×100＝15%です。未確認件数は800－120＝680件です。抽出比率は証拠の十分性を考える一要素であり、比率だけで標本の適切性を決めるものではありません。","category":"マネジメント系","subcategory":"システム監査","topic":"監査標本比率と未確認件数の計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-internal-control-compensating-1277","questionText":"小規模組織で、支払データの作成者とシステム登録者を別人にできない。リスクを補う統制として最も適切なものはどれですか。","choices":["作成者本人が月末に自分の登録内容をまとめて承認する","少額支払だけ承認記録を省き、一定額以上だけ翌年度に確認する","登録後、独立した管理者が証憑と支払一覧を照合し、例外を記録・追跡する","職務分掌が難しいため、操作ログと支払証憑の保存を中止する"],"correctChoiceIndex":2,"explanation":"職務分掌を十分に行えない場合は、独立した管理者による照合や事後レビューなどの代替的統制を設けます。作成者自身の承認ではけん制にならないため、例外を発見・追跡できる仕組みが必要です。","category":"マネジメント系","subcategory":"システム監査","topic":"職務分掌困難時の代替的統制","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-aiops-event-correlation-prioritization-1278","questionText":"同じ時間帯に、応答遅延、DB接続待ち、CPU上昇、利用者からの問合せが数百件のイベントとして記録された。AIOpsの活用として最も適切なものはどれですか。","choices":["全イベントを障害として自動終了し、人による確認を不要にする","CPU上昇だけを原因と断定し、他の監視情報は重複として削除する","過去に多かったイベントだけを残し、新しい組合せは分析対象外とする","時刻や対象サービスの関係からイベントをまとめ、影響度の推定と調査優先順位を担当者へ提示する"],"correctChoiceIndex":3,"explanation":"AIOps（Artificial Intelligence for IT Operations：AIを活用したIT運用）は、CPU（Central Processing Unit：中央処理装置）やDB（Database：データベース）などの大量の運用データについて、相関や異常傾向の検出を支援します。提示された候補を運用担当者が確認して判断するものであり、原因や復旧を常に完全自動で確定するものではありません。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"AIOpsによる複数監視イベントの相関支援","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-monitoring-baseline-drift-1279","questionText":"月初からCPU警報が増えたが、利用者影響はなく、取引量も毎月約10%ずつ増えている。監視基準を見直す前の対応として最も適切なものはどれですか。","choices":["過去の基準、取引量、CPU・応答時間の推移、サービス影響を比較し、正常な成長か異常かを切り分ける","警報が増えたためしきい値を直ちに100%へ変更し、応答時間は確認しない","利用者影響がないので全CPU警報を停止し、容量不足は障害発生時に確認する","取引量の増加を原因と確定し、構成変更や異常処理の有無は調べない"],"correctChoiceIndex":0,"explanation":"監視のベースラインは、利用量や構成の変化で徐々に変わることがあります。CPU（Central Processing Unit：中央処理装置）の警報を止める前に、取引量、資源使用率、応答時間、変更履歴、サービス影響を比較し、正常な変化と異常を分けます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"監視ベースライン変化の切り分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-post-recovery-transaction-integrity-1280","questionText":"注文サービスを障害前の状態へ復旧した。利用再開前に行う確認として最も適切なものはどれですか。","choices":["トップ画面が表示されれば復旧完了とし、処理途中の注文は利用者へ確認させる","主要操作に加え、処理途中の注文、二重登録、決済との整合性を確認する","サーバが起動したことだけを監視画面で確認し、業務データは翌日照合する","新規注文だけを試し、障害直前に受け付けた注文は確認対象外とする"],"correctChoiceIndex":1,"explanation":"復旧後はシステムが応答するだけでなく、障害前後の業務データが整合しているか確認します。処理途中の取引、二重処理、外部決済との対応を確認してから利用を再開します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"復旧後の業務処理・データ整合性確認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-recurring-failure-timeline-correlation-1281","questionText":"APIタイムアウトが毎週増えている。記録を見ると、夜間バッチ開始、接続数上昇、設定変更の時刻が一部重なる。調査として最も適切なものはどれですか。","choices":["タイムアウト件数だけを週ごとに合計し、他の記録との時刻対応は取らない","最後に行った設定変更を原因と断定し、負荷と接続数の確認は省く","障害、バッチ、負荷、接続数、変更の時系列を対応付け、再現確認で原因候補を絞る","最も件数の多い曜日を避けてバッチを移し、原因の検証は移動後の件数だけで行う"],"correctChoiceIndex":2,"explanation":"複数の記録を時系列で対応付けると、障害条件の共通点を探せます。ただし時刻が重なっただけで因果関係を断定せず、再現や追加測定で原因候補を検証します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"反復障害と変更・負荷の時系列分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-change-resource-contention-risk-1282","questionText":"同じ夜間に、販売DBの索引再構築と分析基盤の大量データ取込みを実施したところ、両方が遅延した。個別の変更審査では問題がなかった。再発防止として最も適切なものはどれですか。","choices":["二つの変更の開始時刻だけをずらし、CPU、メモリ、ディスク、DB接続の共有状況は確認しない","個別審査が済んでいるため、同時実施による影響は障害管理だけで扱う","処理時間の短い変更を常に先に実施し、共有資源のピークは本番で測定する","変更間の依存関係と共有資源のピークを評価し、同時実施可否、順序、監視・切戻し条件を定める"],"correctChoiceIndex":3,"explanation":"個々の変更に問題がなくても、同時実施すると共有するCPU（Central Processing Unit：中央処理装置）、メモリ、ディスク、DB（Database：データベース）接続を奪い合うことがあります。変更予定だけでなく、資源需要と依存関係をまとめて評価し、順序や切戻し条件を決めます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"複数変更による共有資源競合の切り分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-emergency-change-post-validation-1283","questionText":"重大障害を止めるため、迅速な承認経路で設定を緊急変更した。サービス復旧後の対応として最も適切なものはどれですか。","choices":["実施内容、承認、試験結果を補完し、目的達成、影響、構成記録、恒久対応を事後確認する","復旧したため通常の変更記録は作成せず、担当者の作業メモだけを残す","同じ障害に備えて緊急変更を標準変更へ直ちに登録し、リスク評価を省く","設定を元へ戻すまで構成記録を更新せず、復旧中の実状態は履歴に残さない"],"correctChoiceIndex":0,"explanation":"緊急変更は承認や実施を迅速化しますが、記録や事後確認を不要にするものではありません。復旧後に変更内容、影響、試験、構成情報を補完し、恒久対応や手順改善へつなげます。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"緊急変更後の記録補完と事後検証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-release-canary-bluegreen-comparison-1284","questionText":"新機能を少数利用者へ段階的に公開して指標を確認する方法と、新旧二つの本番環境を用意して接続先を切り替える方法の比較として最も適切なものはどれですか。","choices":["前者は全利用者を一度に切り替え、後者は利用者を少しずつ増やす方法である","前者は影響を限定して指標を観察しやすく、後者は接続先を戻すことで切戻ししやすい","前者は新旧環境を必ず二重運用し、後者は一つの環境内で利用者割合を変える","どちらもデータ構造の互換性や切戻し時のデータ整合性を確認する必要はない"],"correctChoiceIndex":1,"explanation":"少数利用者から広げるカナリアリリースは、影響を限定して指標を観察できます。新旧環境を切り替えるブルーグリーン方式は戻しやすい一方、二重環境やデータ互換性への配慮が必要です。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"段階リリースと環境切替方式の比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-availability-critical-window-calc-1285","questionText":"月間サービス時間は1,000時間、停止は1時間で、月間SLAは99.9%以上である。そのうち重要時間帯は200時間、停止は0.8時間で、重要時間帯SLAは99.8%以上である。可用性を「（サービス時間－停止時間）÷サービス時間×100」で求めると、判定はどれですか。","choices":["月間99.0%、重要時間帯99.2%で、両方とも未達","月間99.9%、重要時間帯99.8%で、両方とも達成","月間99.9%で達成、重要時間帯99.6%で未達","月間99.8%で未達、重要時間帯99.9%で達成"],"correctChoiceIndex":2,"explanation":"SLA（Service Level Agreement：サービスレベル合意書）に対し、月間可用性は（1,000－1）÷1,000×100＝99.9%で達成です。重要時間帯は（200－0.8）÷200×100＝99.6%で、99.8%の目標には届きません。全体平均だけでは重要時間帯の未達を見落とします。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"重要時間帯別の可用性判定計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-event-incident-distinction-1286","questionText":"監視システムが「ディスク使用率70%」を通知したが、性能低下や利用者影響はなく、基準内である。この記録の扱いとして最も適切なものはどれですか。","choices":["利用者からのサービス要求として、容量追加の申請完了まで管理する","根本原因が判明した問題として、既知の誤りへ直ちに登録する","サービス停止を伴う重大インシデントとして、緊急変更を開始する","状態変化を示すイベントとして記録し、条件や影響に応じて対応要否を判断する"],"correctChoiceIndex":3,"explanation":"イベントは、監視対象で観測された状態変化や通知です。全てのイベントがインシデントではなく、サービス中断や品質低下がある場合などにインシデントとして対応します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"監視イベントとサービス障害の区別","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-capacity-seasonal-trend-forecast-1287","questionText":"過去2年、年末の取引量は通常月の2倍になり、今年は通常月も前年比20%増えている。年末向け容量計画として最も適切なものはどれですか。","choices":["成長傾向と年末の季節変動を重ねて需要幅を予測し、増強の準備時期と監視指標を決める","直近1週間の平均だけを使い、前年末のピークは一時的として除外する","前年末と同じ容量を用意し、通常月の20%増加は年末予測へ反映しない","最大需要の時刻だけを確認し、増強に必要な調達期間は障害後に見積もる"],"correctChoiceIndex":0,"explanation":"容量予測では、継続的な成長と季節的なピークを区別し、両方を将来需要へ反映します。予測幅と調達期間を考慮して、必要な時期より前に増強や監視を準備します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"季節変動を含む容量需要予測","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-capacity-headroom-trigger-1288","questionText":"サーバ増強には6週間かかる。利用率が70%を超えると、その後4週間で90%へ達する傾向がある。増強判断の設計として最も適切なものはどれですか。","choices":["利用率が100%になってから申請し、申請中は応答時間目標を停止する","需要予測と6週間の調達期間を踏まえ、必要な余力を残す水準で増強判断を開始する","固定した月末だけに判断し、利用率が急増しても次の月末まで待つ","利用率だけを下げるため、監視データの集計間隔を長くしてピークを平均化する"],"correctChoiceIndex":1,"explanation":"容量余力は、需要変動や増強に必要な時間を吸収するために確保します。上限到達後では間に合わないため、傾向とリードタイムから、十分に早い増強トリガーを設定します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"容量余力と増強トリガーの設定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-configuration-dependency-failure-isolation-1289","questionText":"認証サービスは正常だが、販売アプリと在庫アプリだけログインに失敗し、経理アプリは利用できる。構成情報では販売・在庫が同じ中継サーバを使い、経理は別経路である。最初に重点確認する対象はどれですか。","choices":["認証サービス全体を停止し、三アプリの設定を同時に初期化する","正常な経理アプリを原因候補とし、中継サーバの経路は確認しない","販売・在庫に共通する中継サーバの状態、設定変更、接続ログを確認する","利用者端末を全て交換し、アプリ間の共通構成は交換後に比較する"],"correctChoiceIndex":2,"explanation":"障害が起きた対象に共通し、正常な対象には含まれない構成要素は重要な原因候補です。構成依存関係から中継サーバへ範囲を絞り、状態、変更、ログを確認します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"構成依存関係を用いた障害切り分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-log-correlation-id-1290","questionText":"一つの注文処理がWeb、決済、在庫の三サービスを通る。各サービスのログから同じ注文処理を追跡しやすくする情報はどれですか。","choices":["各サーバで個別に付けた行番号","ログを保存したファイルの容量","サービスごとに異なる画面名","サービス間で引き継ぐ同一の相関ID"],"correctChoiceIndex":3,"explanation":"相関IDを要求とともに各サービスへ引き継ぐと、分散したログから同じ処理を対応付けられます。時刻同期も順序確認に重要ですが、相関IDは個別の要求を直接追跡する別の手段です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"分散処理ログの相関ID","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-backup-restore-dependency-order-1291","questionText":"災害復旧で、顧客DB、認証基盤、受注アプリ、分析基盤を復元する。受注アプリは認証基盤と顧客DBに依存し、分析基盤は翌日でもよい。復元順序の判断として最も適切なものはどれですか。","choices":["業務優先度と依存関係に基づき、認証基盤・顧客DBを準備してから受注アプリを復元する","データ量が最も小さい分析基盤から復元し、受注アプリの依存先は後で準備する","四つを同時に復元し、接続先が未準備の場合は各アプリで個別に再試行する","受注アプリの画面を先に公開し、認証基盤と顧客DBは利用者報告後に復元する"],"correctChoiceIndex":0,"explanation":"復元順序は、業務の重要度だけでなく、サービスを成立させる構成要素の依存関係で決めます。認証とデータが利用可能になってから受注アプリを復元し、優先度の低い分析基盤は後にできます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"業務依存関係に基づく復元順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-ups-graceful-shutdown-sequence-1292","questionText":"停電時、UPSはサーバへ15分間給電でき、非常用発電機の起動確認には10分かかる。運用手順として最も適切なものはどれですか。","choices":["15分間は給電できるため、発電機の状態確認と安全停止の判断は給電終了後に行う","発電機への切替えを直ちに確認し、切替え失敗時は残り時間内に安全停止を開始する","UPSを長時間電源として使い、残り時間にかかわらず業務処理を継続する","停電中は監視を止め、商用電源が戻った後にサーバ停止の有無を確認する"],"correctChoiceIndex":1,"explanation":"UPS（Uninterruptible Power Supply：無停電電源装置）は、短時間の給電や安全停止の時間を確保します。発電機への切替えを早く確認し、失敗した場合はバッテリ残時間内に安全停止できるよう判断します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"UPS稼働時間内の安全停止・電源切替","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-generator-readiness-load-test-1293","questionText":"非常用発電機は毎月無負荷で起動確認していたが、停電時に実際の設備負荷を支えられず停止した。改善として最も適切なものはどれですか。","choices":["起動確認の回数だけを増やし、実負荷と燃料継続時間は別の点検へ回す","発電機の表示灯を監視し、電源切替装置と接続設備の動作は停電時に確認する","安全な計画の下で負荷・切替試験を行い、燃料、容量、手順、点検結果を確認する","商用電源の品質を改善し、非常用発電機は起動確認だけの運用を続ける"],"correctChoiceIndex":2,"explanation":"無負荷での起動成功だけでは、実際の設備負荷や切替えを支えられるか確認できません。安全に配慮した負荷試験、燃料、容量、切替手順を定期的に確認し、結果を記録します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"非常用発電設備の負荷試験と燃料確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-redundant-power-common-path-1294","questionText":"サーバには電源装置が二台ある。構成Xは二台とも同じPDUへ接続し、構成Yは別々の電源系統のPDUへ接続する。可用性の観点から適切な説明はどれですか。","choices":["Xは電源装置が二台なので、PDU故障時も必ず給電を継続できる","Yは経路が異なるため、電源装置を一台に減らしても同じ冗長性になる","XとYは電源装置の台数が同じなので、共通障害点にも差はない","Yは共通する給電経路を減らせるが、切替えや各経路の点検も必要である"],"correctChoiceIndex":3,"explanation":"二台の電源装置が同じPDU（Power Distribution Unit：電源分配装置）へ接続されていると、PDUが共通障害点になります。独立経路へ分けるとリスクを減らせますが、切替えや両経路の点検も必要です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"冗長電源の共通経路リスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-datacenter-hotspot-airflow-1295","questionText":"サーバ室の平均温度は基準内だが、特定ラック上段の吸気温度だけが上昇し、同じラックで性能低下が発生している。対応として最も適切なものはどれですか。","choices":["ラック前後の温度、機器配置、給排気の向き、ケーブルによる気流阻害を確認して局所的な熱だまりを改善する","室温平均が基準内なので、性能低下は全サーバのソフトウェア更新で対応する","該当ラックの温度警報だけを高く設定し、空気流と機器配置は変更しない","空調能力を最大へ固定し、他ラックの低温化や消費電力への影響は評価しない"],"correctChoiceIndex":0,"explanation":"平均室温が正常でも、ラック内の配置や給排気の混合によって局所的な高温が生じます。吸気温度、空気流、機器・ケーブル配置を確認し、サービスを止めない手順で改善します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ラック局所高温と空気流の改善","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-humidity-static-condensation-control-1296","questionText":"サーバ室の湿度管理について、IT設備を保護する考え方として最も適切なものはどれですか。","choices":["湿度は低いほど安全なので、静電気の発生可能性は考慮しない","低すぎる場合の静電気と高すぎる場合の結露を考慮し、適切な範囲を監視する","温度だけを監視すれば湿度による影響も検出できるため、湿度計測は行わない","結露を防ぐため湿度を一定に固定し、季節や空調状態による変化は記録しない"],"correctChoiceIndex":1,"explanation":"湿度が低すぎると静電気、高すぎると結露による設備障害のリスクが高まります。特定の規格値暗記ではなく、設備条件に合う範囲を定め、温度とともに継続監視します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"湿度異常と静電気・結露リスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-water-leak-zone-response-1297","questionText":"サーバ室の床下で漏水センサが作動し、近くに電源設備がある。重要サービスは別拠点へ切替え可能である。初動として最も適切なものはどれですか。","choices":["サービスを継続するため、漏水箇所へ作業員が入り通電中の設備を移動する","センサ誤作動の可能性を優先し、水量が増えるまで切替えと設備確認を待つ","安全手順に従って影響区域を隔離し、サービスを切り替え、電源・設備担当と漏水箇所を確認する","サーバだけを別ラックへ移し、床下電源と漏水の関係は復旧後に確認する"],"correctChoiceIndex":2,"explanation":"漏水と電源設備が近い場合は、人員と設備の安全確保を優先します。影響区域を安全に隔離し、可能なサービス切替えを行った上で、設備担当と原因・影響を確認します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"漏水検知時の設備隔離とサービス継続","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-physical-access-tailgating-control-1298","questionText":"入退室カードを持つ従業員の直後に、認証していない人が一緒に入室する「共連れ」を抑える対策として最も適切なものはどれですか。","choices":["入室カードの有効期限だけを長くし、一度の認証で複数人の通過を認める","入口の監視記録だけを月末に確認し、その場での不正通過は検知しない","カード認証後は扉を開放したままにし、退出記録だけを人数管理に使う","一人ずつ認証・通過させる設備や監視を用い、入退室記録と例外を確認する"],"correctChoiceIndex":3,"explanation":"共連れは、認証済みの人に続いて未認証者が入る物理的なアクセスリスクです。一人ずつ通過させる仕組み、監視、入退室記録、例外対応を組み合わせて抑止・検知します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"共連れを抑止・検知する入退室統制","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-facility-maintenance-redundancy-check-1299","questionText":"二系統の電源を持つ設備で、一方を定期点検のため停止する。点検開始前の確認として最も適切なものはどれですか。","choices":["点検対象を停止してから、残る系統の容量と切替状態を初めて確認する","二系統あるため事前確認は省き、残る系統で警報が出た場合だけ点検を中止する","残る系統の容量・警報・切替状態を確認し、単一系統中の障害時手順と中止条件を定める","点検中は冗長性が下がるため、監視警報を止めて不要なエスカレーションを防ぐ"],"correctChoiceIndex":2,"explanation":"一方の系統を点検すると、通常は冗長構成でも一時的に単一障害点が生じます。残る経路の容量と健全性、監視、障害時手順、中止条件を確認してから点検します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"設備点検前の冗長経路・切替確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-facility-alarm-service-topology-1300","questionText":"設備監視では、空調警報、ラック温度警報、電源警報が別々に届き、どのサービスへ影響するか分からない。改善として最も適切なものはどれですか。","choices":["警報の件数だけを設備別に集計し、サーバやサービスとの関係は障害後に調べる","全警報を同じ優先度にし、受信順に対応して業務影響による順序変更は行わない","サービス担当者へ全設備警報を直接送り、関連の判断を各担当者の経験に任せる","設備、ラック、サーバ、サービスの関係を管理し、警報を影響するサービスと対応付けて優先する"],"correctChoiceIndex":3,"explanation":"設備警報をサービス構成と対応付けると、どの業務へ影響し得るかを判断できます。警報数や受信順だけでなく、設備からサービスまでの関係と重要度を使って対応を優先します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"設備警報とサービス影響の対応付け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-device-refresh-risk-priority-1301","questionText":"端末更新の予算で一つの部門だけを先行更新する。受注部門の端末は故障が増え、保守終了まで3か月で、停止すると出荷が止まる。設計部門の端末は高性能化の要望があるが保守は2年残り、総務部門には代替端末がある。優先順位として最も適切なものはどれですか。","choices":["受注部門を優先し、故障傾向、保守期限、業務停止影響を基に残る部門の更新時期も計画する","設計部門を優先し、希望性能が高いことだけを更新理由として他部門のリスク評価を後回しにする","総務部門を優先し、代替端末がある間に全台を同じ機種へ更新して受注部門は次年度に回す","三部門を同数ずつ更新し、業務停止影響や保守期限による優先順位は設けない"],"correctChoiceIndex":0,"explanation":"機器更新は、要望の強さだけでなく、故障傾向、保守期限、停止時の業務影響を合わせて優先します。受注停止へ直結し、保守終了が近い端末を先行対象とし、残る端末もリスクに基づいて更新計画へ含めます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務停止・保守期限を用いた端末更新優先順位","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-device-purchase-lease-horizon-1302","questionText":"三年間の期間限定業務で、繁忙期ごとに必要な端末台数が変わり、途中で機種変更する可能性もある。端末を購入するかリースするかの判断として最も適切なものはどれですか。","choices":["購入価格だけを比較し、保守、返却、台数変更に伴う費用は契約後に確認する","利用期間、台数変更の柔軟性、保守、返却条件、期間全体の費用を比較する","所有権が残る購入を必ず選び、期間終了後の処分費用は評価対象外とする","初期支払額が小さい契約を選び、途中解約や機種変更の条件は考慮しない"],"correctChoiceIndex":1,"explanation":"購入とリースは、初期費用だけでなく、利用期間、台数変動、保守、返却・解約条件を含む期間全体の費用で比較します。期間限定で需要変動があるため、柔軟性と総費用の両方が重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"利用期間・更新頻度による購入とリースの比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-workload-endpoint-tier-selection-1303","questionText":"事務担当者はメールと表計算を中心に利用し、映像制作担当者は高解像度動画の編集とプレビューを行う。端末の標準化方針として最も適切なものはどれですか。","choices":["全員へ最も安価な事務用端末を配り、映像処理の待ち時間は運用で吸収する","全員へ最高性能端末を配り、利用しない性能を含む費用は比較しない","共通管理できる標準端末を基本とし、映像制作には処理要件を満たす高性能構成を用意する","部門ごとに自由購入とし、保守性やソフトウェア互換性は利用開始後に確認する"],"correctChoiceIndex":2,"explanation":"標準化は管理や保守を容易にしますが、業務に必要な性能を不足させてはいけません。一般事務は標準構成、映像制作はCPU、主記憶、GPU、ストレージなどの要件を確認した構成に分けます。GPUはGraphics Processing Unitの略です。","category":"ストラテジ系","subcategory":"システム企画","topic":"業務負荷別の標準端末・高性能端末選定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-hardware-lifecycle-staggered-renewal-1304","questionText":"同じ年に導入した600台の端末について、四年目以降に故障率が上がる傾向がある。全台同時更新の予算はない。更新計画として最も適切なものはどれですか。","choices":["故障した端末だけを都度購入し、年式や保守期限を更新計画には使わない","利用頻度に関係なく資産番号順に更新し、重要業務の端末も同じ順番にする","全台が使用不能になるまで更新を延期し、故障増加分は予備機だけで対応する","年式、故障履歴、保守期限、業務重要度を基に対象を分け、複数年度で段階的に更新する"],"correctChoiceIndex":3,"explanation":"一括更新が難しい場合は、故障傾向、保守期限、業務重要度を使って段階的な更新計画を作ります。事後交換だけに頼らず、将来の故障増加と予算を見通して平準化します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"故障傾向と保守期限による段階的機器更新","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-support-end-migration-leadtime-1305","questionText":"業務端末のOSと保守契約が9か月後に終了する。後継端末の選定に1か月、業務アプリの互換性検証に3か月、調達と展開に3か月かかり、繁忙期の2か月は切替えできない。対応として最も適切なものはどれですか。","choices":["直ちに移行計画を開始し、検証、調達、繁忙期、予備期間を踏まえた期限と中止条件を設定する","保守終了直前まで現行端末を使い、終了月に後継機種を選んで全台を一括切替えする","後継端末だけ先に購入し、業務アプリの互換性は展開後に利用部門が確認する","繁忙期を避けるため保守終了後に検証を始め、その間の障害対応は個別判断とする"],"correctChoiceIndex":0,"explanation":"必要期間の合計だけでも保守終了に近く、繁忙期と不具合対応の余裕も必要です。サポート終了日から逆算し、選定、検証、調達、展開、切戻しを早期に計画します。","category":"ストラテジ系","subcategory":"システム企画","topic":"サポート終了と移行リードタイムの管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-endpoint-energy-cost-calc-1306","questionText":"消費電力80Wの端末100台を、同じ業務性能を持つ50Wの端末へ更新する。1台当たり1日8時間、年間250日使用し、電力単価を1kWh当たり30円とする。更新による年間電力費の削減額はどれですか。","choices":["36万円","18万円","6万円","1万8千円"],"correctChoiceIndex":1,"explanation":"差は1台当たり30W＝0.03kWです。0.03kW×100台×8時間×250日＝6,000kWh、6,000kWh×30円＝18万円削減できます。更新費用や廃棄費用は別に比較します。","category":"ストラテジ系","subcategory":"企業活動","topic":"端末台数・消費電力・稼働時間による年間電力費差","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-energy-efficient-device-investment-1307","questionText":"端末更新案を比較する。案Aは安価だが処理待ち時間と消費電力が大きい。案Bは最も省電力だが業務アプリの推奨性能を満たさない。案Cは推奨性能を満たし、電力費と保守費を含む5年間総費用も予算内である。案Dは最高性能だが利用予定のない機能が多い。選択として最も適切なものはどれですか。","choices":["初期価格が最も低い案Aを選び、待ち時間と電力費は導入後に評価する","消費電力が最小の案Bを選び、性能不足は利用者の操作時間で補う","業務性能を満たし、運用費と環境負荷も適切な案Cを選ぶ","将来利用する可能性だけを理由に案Dを選び、未使用性能の費用は考慮しない"],"correctChoiceIndex":2,"explanation":"省電力性だけでなく、業務要件を満たす性能とライフサイクル全体の費用を比較します。案Cは必要性能を満たし、電力費・保守費を含む総費用も条件内であるため、過不足の少ない選択です。","category":"ストラテジ系","subcategory":"企業活動","topic":"省電力機器の性能・費用・環境効果比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-spare-device-demand-leadtime-1308","questionText":"営業用タブレット200台では年間10台程度が故障し、交換品の調達に2週間かかる。営業停止を避けつつ過剰在庫も抑えたい。予備機の管理として最も適切なものはどれですか。","choices":["故障時に毎回発注し、調達期間中は利用者が端末なしで業務を続ける","全200台と同数の予備機を保管し、保管費や機種陳腐化は評価しない","前年の故障台数と同じ10台を固定し、故障の集中や調達期間の変化は見直さない","故障需要のばらつき、調達期間、許容停止時間から在庫水準を定め、利用実績に応じて見直す"],"correctChoiceIndex":3,"explanation":"予備機は、平均故障数だけでなく、同時発生のばらつき、調達リードタイム、業務が許容できる停止時間から決めます。交換実績と調達条件を定期的に見直すことで、欠品と過剰在庫を抑えます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"故障率と交換リードタイムによる予備端末判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-standard-device-exception-control-1309","questionText":"全社で標準端末を定めているが、分析部門だけは大容量メモリが必要である。例外端末の扱いとして最も適切なものはどれですか。","choices":["業務要件と必要期間を確認して例外を承認し、対象、構成、保守方法、見直し時期を記録する","標準化を優先して例外を認めず、処理時間の増加は分析部門だけで対応する","部門が自由に機種を購入し、互換性や保守方法は故障時に決める","一度例外を認めた構成は恒久的に使用し、業務要件が変わっても再評価しない"],"correctChoiceIndex":0,"explanation":"標準化には管理・調達上の利点がありますが、明確な業務要件がある場合は統制された例外が必要です。対象と理由、構成、保守、期限を記録し、標準へ戻せるか定期的に見直します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"標準端末と業務例外の承認・見直し","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-printer-tco-calc-1310","questionText":"プリンタの購入費は24万円、印刷費は1ページ3円、保守費は年6万円である。月5,000ページを3年間印刷するとき、電力費と税を除く3年間のTCOはどれですか。","choices":["78万円","96万円","102万円","120万円"],"correctChoiceIndex":1,"explanation":"印刷費は3円×5,000ページ×36か月＝54万円、保守費は6万円×3年＝18万円です。購入費24万円を加えたTCOは96万円です。TCOはTotal Cost of Ownership（総保有コスト）の略です。","category":"ストラテジ系","subcategory":"システム企画","topic":"本体・消耗品・保守を含むプリンタTCO計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-accessible-display-work-requirement-1311","questionText":"小さい文字を見分けにくい利用者が、大きな表を長時間確認する業務で使う表示環境を選ぶ。要件として最も適切なものはどれですか。","choices":["画面を小さくして表示項目を減らし、文字サイズはアプリの初期値に固定する","最高解像度だけを条件とし、文字拡大時の表示や反射は評価しない","十分な画面領域、文字拡大、高いコントラスト、反射の少なさ、位置調整を確認する","色数が多いことだけを条件にし、利用者による試用は導入後に行う"],"correctChoiceIndex":2,"explanation":"表示装置は解像度だけでなく、利用者が必要な文字サイズ、コントラスト、反射、画面領域、姿勢調整を含めて選びます。実際の業務画面で試用し、読みやすさと操作性を確認することが重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"利用者特性と作業内容による表示装置選定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-field-device-environment-selection-1312","questionText":"屋外の物流現場で、雨天、粉じん、直射日光の下でも、手袋を着けた作業員が端末を利用する。端末選定として最も適切なものはどれですか。","choices":["屋内用の軽量端末を選び、雨天時だけ透明な袋に入れて操作する","画面解像度が最も高い端末を選び、防水性や操作方法は利用者教育で補う","価格が最も安い端末を多めに購入し、故障時の交換だけで環境条件へ対応する","使用温度、防じん・防水性、屋外視認性、手袋での操作性を実環境に照らして確認する"],"correctChoiceIndex":3,"explanation":"現場端末は、処理性能だけでなく、温度、雨、粉じん、画面の見やすさ、入力方法など実際の利用環境へ適合させます。仕様値とともに、手袋を着けた操作など実務条件でも確認します。","category":"ストラテジ系","subcategory":"システム企画","topic":"屋外・粉じん・手袋操作を考慮した端末選定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-media-production-workstation-requirements-1313","questionText":"4K動画を編集する端末を調達する。素材は大容量で、複数映像の合成、プレビュー、書出しを頻繁に行う。構成の決め方として最も適切なものはどれですか。","choices":["編集ソフトの推奨条件と実素材で、CPU、GPU、主記憶、ストレージ速度・容量のバランスを検証する","書出しにCPUを使うため、主記憶とストレージは事務端末と同じ構成に固定する","GPUの型番だけを最大にし、素材読込みと一時ファイルの性能は評価しない","保存容量だけを大きくし、プレビューの滑らかさや書出し時間は導入後に確認する"],"correctChoiceIndex":0,"explanation":"動画編集は、CPU（Central Processing Unit：中央処理装置）、GPU（Graphics Processing Unit：画像処理装置）、主記憶、ストレージが相互に影響します。単一部品だけを最大化せず、利用するソフトウェアと実素材を用いて処理時間、プレビュー、容量を検証します。","category":"ストラテジ系","subcategory":"システム企画","topic":"動画制作端末のCPU・メモリ・ストレージ要件","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-media-delivery-quality-cost-1314","questionText":"商品紹介動画をスマートフォンへ配信する。利用者の回線品質は一定でなく、制作した高画質原本は将来の再編集にも使う。品質と費用の方針として最も適切なものはどれですか。","choices":["原本だけを一種類で配信し、再生停止が増えても保存形式と配信形式を共通化する","高品質原本を保管し、回線条件に合う複数の配信用データを作って通信量と再生品質を測定する","通信量を最小にするため原本も低品質で保存し、将来の再編集時は同じデータを拡大する","全利用者へ最大解像度だけを配信し、回線差による再生状況は配信後も測定しない"],"correctChoiceIndex":1,"explanation":"再編集用の原本と、利用環境に合わせた配信用データは目的が異なります。原本の品質を保持しつつ複数品質を用意し、再生状況、通信量、保存・配信費用を測定して調整します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"配信品質・通信量・保存費用の総合判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-shared-device-capacity-investment-1315","questionText":"共有プリンタは通常日には余裕があるが、月末の2時間だけ待ち行列が長くなり、請求書発送が遅れる。投資判断として最も適切なものはどれですか。","choices":["年間平均利用率が低いので対策せず、発送遅延は毎月の例外として扱う","待ち時間をなくすため最大機種へ直ちに全台交換し、月末以外の余剰能力は評価しない","月末の処理量、待ち時間、締切を測定し、処理分散や時間調整と増設案の費用・効果を比較する","月末だけ利用者へ印刷枚数制限を設け、請求書の優先度は他の印刷と同じにする"],"correctChoiceIndex":2,"explanation":"平均値だけでは、短時間のピークによる業務影響を見落とします。ピーク時の処理量と締切を確認し、印刷の分散・時間調整などの運用策と、増設・更新の費用対効果を比較します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"共有機器の利用率・待ち時間・増設時期","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-hardware-renewal-portfolio-priority-1316","questionText":"更新候補は、保守終了が近い受注サーバ、故障率が上がった設計端末、容量に余裕のない共有ストレージである。予算上、全てを同時更新できない。計画方法として最も適切なものはどれですか。","choices":["購入価格が低い順に更新し、停止時の事業損失と機器間の依存関係は評価しない","故障件数が多い機器だけを更新し、保守終了と容量不足は障害発生後に対応する","三案件へ同額を配り、更新が完了しない機器の暫定対策や残存リスクは記録しない","業務影響、保守期限、故障・容量予測、依存関係、暫定対策を比較して複数年度の順位を決める"],"correctChoiceIndex":3,"explanation":"更新ポートフォリオでは、個別機器の状態だけでなく、事業影響、期限、将来需要、依存関係をまとめて評価します。延期する対象には暫定対策と残存リスクを明確にし、状況に応じて順位を見直します。","category":"ストラテジ系","subcategory":"システム企画","topic":"業務重要度・依存関係・保守期限による更新ポートフォリオ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-hardware-asset-serial-reconciliation-1317","questionText":"端末棚卸しで、資産台帳の利用者名と設置場所は正しいが、端末本体のシリアル番号が台帳と一致しなかった。対応として最も適切なものはどれですか。","choices":["現物、貸出・交換記録、利用者を照合して差異の原因を確認し、承認された内容で台帳を更新する","利用者名が正しいため一致と扱い、シリアル番号の差異は次回棚卸しまで保留する","現物のラベルを台帳の番号へ貼り替え、交換記録と取得経路は確認しない","台帳の行を削除して新規登録し、過去の利用者や交換履歴との関係を切り離す"],"correctChoiceIndex":0,"explanation":"シリアル番号の不一致は、未記録の交換、入力誤り、持出しなどの可能性があります。現物と履歴を照合して原因を確認し、承認された記録として修正することで資産の追跡可能性を保ちます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"資産台帳とシリアル番号・利用者の照合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-device-replacement-configuration-record-1318","questionText":"故障した業務端末を別の端末へ交換した。構成管理と資産管理で行う対応として最も適切なものはどれですか。","choices":["新端末が動作すれば、旧端末と新端末のシリアル番号は同じ台帳行へ上書きする","旧端末の状態、新端末の識別情報・構成・利用者・設置場所・関連サービスを記録する","利用者だけを変更し、保証期限と搭載ソフトウェアは次の棚卸し時に登録する","旧端末の記録を削除し、障害記録との関連は交換作業の担当者だけが保持する"],"correctChoiceIndex":1,"explanation":"機器交換では、旧機器を廃止・修理中などの正しい状態にし、新機器の識別情報、構成、利用者、関連サービスを記録します。障害記録や変更記録との関係も残すことで、構成の履歴を追跡できます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"機器交換時の構成・資産記録更新","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-device-failure-trend-prevention-1319","questionText":"同一機種の端末で、導入から約3年を過ぎるとバッテリ膨張による故障が増える傾向が分かった。対応として最も適切なものはどれですか。","choices":["膨張した端末だけを交換し、同時期に導入した端末の状態は確認しない","機種名に関係なく全社の全端末を同じ日に交換し、使用年数の差は考慮しない","故障履歴から対象機種・導入時期を特定し、点検基準と予防交換時期を定めて結果を記録する","故障件数を月次報告するだけにし、発生傾向と交換計画の関係は評価しない"],"correctChoiceIndex":2,"explanation":"故障履歴から機種や使用年数との関係を確認すると、同じ条件の端末を故障前に点検・交換できます。全台一律ではなく、傾向と影響に基づいて対象と時期を決めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"機種・使用年数別故障傾向と予防交換","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-preventive-maintenance-business-window-1320","questionText":"24時間稼働するサービスの機器を予防保守する。午前2時は利用が少なく、冗長構成の一台ずつを停止できるが、残る一台だけでは突発的なピークを処理できない可能性がある。保守計画として最も適切なものはどれですか。","choices":["利用が少ない時間なので事前確認なしで一台を停止し、負荷増加時は作業を続けながら対応する","冗長構成なので利用者への連絡を省き、残る機器の容量と警報は停止後に確認する","ピークの可能性をなくすため保守を無期限に延期し、故障リスクは現状のまま受け入れる","負荷予測、残る機器の容量、切替え、監視、連絡、切戻し条件を確認して保守時間帯を決める"],"correctChoiceIndex":3,"explanation":"利用が少ない時間でも、冗長性を一時的に下げる保守では残る機器の容量と切替えを確認します。監視、利用者連絡、負荷が増えた場合の中止・切戻し条件まで準備します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"故障リスクと業務影響による保守時間帯選定","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-spare-device-stock-control-1321","questionText":"交換用端末は月平均4台使われ、調達には約6週間かかるが、月ごとの故障数にはばらつきがある。予備機管理として最も適切なものはどれですか。","choices":["調達期間中の需要とばらつきから発注点・安全在庫を定め、実績と調達期間を定期的に見直す","月平均4台だけを常に保管し、調達期間と需要のばらつきは在庫計算に含めない","欠品を避けるため使用端末と同数を保管し、陳腐化と保管費用は評価しない","予備機を持たず、故障のたびに緊急調達して通常調達との費用差は記録しない"],"correctChoiceIndex":0,"explanation":"発注点は、調達リードタイム中の需要と需要変動を踏まえて決めます。使用実績、故障傾向、納期を定期的に見直し、欠品による業務停止と過剰在庫の両方を抑えます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"交換需要・調達期間・保管場所による予備機管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-hardware-maintenance-contract-coverage-1322","questionText":"店舗の決済端末は営業時間中に停止すると売上へ影響する。保守契約を比較する観点として最も適切なものはどれですか。","choices":["月額料金だけを比較し、受付時間、交換部品、現地対応の条件は契約後に確認する","業務影響に対して、受付時間、応答・復旧目標、現地対応、部品、除外条件、費用を比較する","拠点数が多い契約会社を選び、対象端末の地域で対応できるかは障害時に確認する","最長の契約期間を選び、途中の機種更新や保守終了時の扱いは評価しない"],"correctChoiceIndex":1,"explanation":"保守契約は価格だけでなく、必要な時間帯に受け付けられるか、応答・復旧目標、現地対応、部品供給、除外条件が業務影響に合うかを確認します。機器の保守期限や更新計画との整合も必要です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"故障影響に応じた保守契約範囲比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-capacity-metric-bottleneck-escalation-1323","questionText":"業務アプリの応答が遅い。監視値はCPU使用率35%、主記憶使用率96%、ページファイルへの入出力が継続、ストレージ応答時間もその間だけ悪化している。最初の調査として最も適切なものはどれですか。","choices":["CPU不足と判断し、主記憶とページファイルの値は別障害として扱う","ストレージ容量不足と判断し、空き容量だけを増やして再測定しない","主記憶不足によるページングを疑い、プロセス別使用量とページ入出力を確認して対策を選ぶ","ネットワーク遅延と判断し、サーバ側の資源指標を測定対象から外す"],"correctChoiceIndex":2,"explanation":"CPU（Central Processing Unit：中央処理装置）には余裕がある一方、主記憶使用率とページ入出力が高いため、主記憶不足によるページングが有力です。プロセス別の使用量を確認し、設定・同時実行数・主記憶増設などを原因に合わせて選びます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"CPU・メモリ・ストレージ指標による容量問題の切分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-asset-inventory-unregistered-device-1324","questionText":"資産棚卸しで、ネットワークへ接続された台帳未登録の端末を発見した。初動として最も適切なものはどれですか。","choices":["利用中なので登録済みとみなし、次年度の台帳作成時に追加する","所有者を確認せず端末を廃棄し、購入や貸出の記録は削除する","端末名だけを台帳へ追加し、取得経路、利用者、セキュリティ状態は記録しない","接続を管理下に置き、所有者、取得経路、用途、構成、安全性を確認して登録又は承認済み処置を行う"],"correctChoiceIndex":3,"explanation":"未登録端末は、管理外利用や記録漏れの可能性があります。まず影響を抑え、所有者、取得経路、用途、構成、セキュリティ状態を確認して、正式登録又は定められた処置を行います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"棚卸しで発見した未登録機器の追跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-device-disposal-evidence-chain-1325","questionText":"機密データを保存していた端末を外部業者へ引き渡して廃棄する。監査で追跡できる記録として最も適切なものはどれですか。","choices":["資産番号・シリアル番号、消去方法と確認結果、引渡し記録、廃棄証明、台帳上の廃止を対応付ける","業者の請求書だけを保存し、どの端末を引き渡したかは台数だけで管理する","消去を担当者の口頭報告で確認し、廃棄証明と資産台帳は別々に保管して対応付けない","端末の型名だけを記録し、同一型名の各端末を個別に識別しない"],"correctChoiceIndex":0,"explanation":"廃棄の証跡は、対象機器を一意に識別し、データ消去、引渡し、最終処分、台帳更新まで連続して追跡できる必要があります。件数や型名だけでは個々の端末を確認できません。","category":"マネジメント系","subcategory":"システム監査","topic":"機器廃棄・データ消去の証跡連鎖","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-leased-device-return-data-control-1326","questionText":"リース端末を契約終了時に返却する。データと資産の管理として最も適切なものはどれですか。","choices":["利用者がファイルを削除したことだけを確認し、消去結果と返却端末の識別情報は記録しない","返却対象を識別し、必要データを保全して所定の消去を確認し、返却証明と台帳更新を対応付ける","端末を初期化せず返却し、リース会社との契約があることをデータ保護の代わりとする","資産台帳から先に削除し、実際の返却と消去は利用部門の任意の時期に行う"],"correctChoiceIndex":1,"explanation":"返却前に対象端末を特定し、必要な業務データの保全と、契約・社内基準に沿う消去を確認します。返却証明と資産台帳を対応付け、返却漏れやデータ残存を防ぎます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"リース返却時のデータ消去・台帳・返却証明","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-media-project-storage-estimate-calc-1327","questionText":"動画制作で、1日40本を20日間撮影する。1本につき原本2GBと、編集版0.5GBを2本保存する。必要容量に20%の余裕を加えるとき、必要な容量はどれですか。1GB未満の端数はないものとします。","choices":["1,920GB","2,400GB","2,880GB","4,800GB"],"correctChoiceIndex":2,"explanation":"1本当たりは2GB＋0.5GB×2＝3GB、撮影本数は40×20＝800本なので、データ量は2,400GBです。20%の余裕を加えると2,400×1.2＝2,880GBです。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"メディア制作量・版数・余裕率による必要容量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-driver-plug-and-play-role-1328","questionText":"デバイスドライバとプラグアンドプレイの役割の組合せとして最も適切なものはどれですか。","choices":["ドライバは接続機器の自動検出だけを行い、プラグアンドプレイは機器固有の制御だけを行う","ドライバはファイルシステムを管理し、プラグアンドプレイは機器ごとの制御命令を実行する","ドライバは機器を制御するが、プラグアンドプレイは給電だけを行い機器の検出には関与しない","ドライバはOSと機器固有の制御を仲介し、プラグアンドプレイは接続機器の検出・設定を支援する"],"correctChoiceIndex":3,"explanation":"デバイスドライバはOS（Operating System：基本ソフトウェア）からの要求を機器固有の制御へ仲介します。プラグアンドプレイは、接続した機器を検出して必要な設定を行いやすくする仕組みです。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"デバイスドライバとプラグアンドプレイの役割分担","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-display-projector-environment-selection-1329","questionText":"明るい会議室で30人に同じ資料を見せる用途と、個人が細かな図面を長時間確認する用途がある。表示装置の選択として最も適切なものはどれですか。","choices":["会議室は明るさと投影サイズを満たすプロジェクター、個人作業は解像度と調整性を満たすディスプレイを選ぶ","二つの用途とも画面サイズだけを最大にし、周囲光、視距離、解像度は比較しない","会議室には小型の個人用ディスプレイ、個人作業には低解像度の大型投影だけを用いる","二つの用途とも同じ装置に統一し、利用環境の差は利用者の着席位置で調整する"],"correctChoiceIndex":0,"explanation":"複数人への投影では周囲光、明るさ、投影サイズが重要です。細かな個人作業では、必要な解像度、画面領域、位置調整などを確認し、用途ごとに適した装置を選びます。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"周囲光・視聴人数によるディスプレイとプロジェクター選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-printer-duty-cycle-selection-1330","questionText":"事務所では月2万ページの白黒帳票を両面印刷し、停止時間と1ページ当たりの費用を抑えたい。カラー印刷は月に数十ページで外部出力できる。適した選択はどれですか。","choices":["写真画質を優先した小型カラープリンタを選び、月間印刷量と消耗品費は評価しない","必要な月間印刷量、両面・ネットワーク機能、耐久性、白黒1ページ当たり費用を満たす機種を選ぶ","本体価格が最も低い機種を選び、推奨印刷量を超えた場合の保守費は記録しない","カラー機能が最も多い機種を選び、白黒帳票の処理速度と交換部品は比較しない"],"correctChoiceIndex":1,"explanation":"大量の白黒帳票では、月間印刷量への耐久性、処理速度、両面・ネットワーク機能、消耗品を含むページ単価を確認します。利用頻度の低いカラー機能だけで選ぶと、主要業務の要件から外れます。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"印刷量・色・消耗品費によるプリンタ選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-barcode-rfid-reading-comparison-1331","questionText":"倉庫で、箱を一つずつ向けて読み取る方法と、複数の箱を開梱せずにまとめて識別する方法を比較する。バーコードとRFIDの説明として最も適切なものはどれですか。","choices":["バーコードは電波で複数タグを読み、RFIDは印刷面を光学的に一つずつ読む","どちらも必ず一個ずつ視認して読み取るため、読取り方法と導入費用に違いはない","バーコードは通常読取り面の視認が必要で、RFIDは条件が合えば非接触で複数タグを読める","RFIDは金属や電波環境の影響を受けないため、現場試験を行わず同じ読取り距離を保証できる"],"correctChoiceIndex":2,"explanation":"バーコードは通常、印刷面を読取装置から見える状態にします。RFID（Radio Frequency Identification：無線周波数識別）は非接触で複数タグを読める場合がありますが、タグ費用や金属・電波環境を含む現場確認が必要です。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"個別視認読取りと複数無線読取りの比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-scanner-ocr-quality-isolation-1332","questionText":"紙帳票をスキャンすると画像は保存できるが、傾いた小さな文字だけOCRの認識誤りが多い。最初の改善として最も適切なものはどれですか。","choices":["保存先の空き容量だけを増やし、読み取った画像の品質は確認しない","スキャナをネットワークから切り離し、文字サイズと傾きは同じ条件で再試行する","OCR結果を全て手入力へ置き換え、解像度や傾き補正の効果は測定しない","読取り解像度、原稿の傾き、汚れ、言語設定を確認し、代表帳票で認識率を比較する"],"correctChoiceIndex":3,"explanation":"画像保存が成功していても、解像度、傾き、汚れ、文字条件がOCR精度へ影響します。OCRはOptical Character Recognition（光学文字認識）の略で、代表的な帳票を使って入力画像と設定を切り分けます。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"スキャン品質とOCR認識誤りの切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-computer-form-factor-role-selection-1333","questionText":"PC、サーバ、携帯端末の一般的な利用形態の説明として最も適切なものはどれですか。","choices":["サーバは複数利用者へ共有機能を提供し、PCは個人作業、携帯端末は移動利用に適した構成を取り得る","PCは共有サービスの連続提供だけに使い、サーバは個人の文書作成を主目的とする","携帯端末は可搬性を重視するが、サーバと同じ拡張性や連続運転性を必ず備える","三者の役割はOSの名称だけで決まり、処理能力、可搬性、連続運転の要件には左右されない"],"correctChoiceIndex":0,"explanation":"サーバは共有サービスや連続運転、PC（Personal Computer：パーソナルコンピュータ）は個人の業務処理、携帯端末は可搬性や電池駆動などを重視する構成があります。実際の性能や用途は製品によるため、名称だけで優劣は決まりません。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"PC・サーバ・携帯端末の役割差","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-peripheral-interface-compatibility-1334","questionText":"USB Type-C端子を持つノートPCへ、映像出力に対応したドッキング装置を接続したが、外部画面だけ表示されない。装置は別のPCでは動作する。確認として最も適切なものはどれですか。","choices":["端子形状が同じなので映像出力できると判断し、外部画面だけを交換する","PC側端子が必要な映像出力方式に対応するか、ケーブル、ドライバ、表示設定と併せて確認する","充電できるため全ての通信方式にも対応すると判断し、互換性の調査を終了する","USB Type-Cを使う装置は全て同じ機能なので、OSの再インストールだけを行う"],"correctChoiceIndex":1,"explanation":"同じUSB Type-C形状でも、対応するデータ速度、給電、映像出力機能は機器によって異なります。必要な方式への対応、ケーブル、デバイスドライバ、表示設定を順に確認します。USBはUniversal Serial Busの略です。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"コネクタ形状・信号規格・ドライバの互換性確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-touch-pen-field-input-selection-1335","questionText":"保守作業員が屋外で手袋を着けたまま点検項目を選び、必要時には画面へ細かな注記と署名を入力する。入力方式の選択として最も適切なものはどれですか。","choices":["指だけに反応する小型タッチ画面を選び、手袋利用時は手袋を外して操作する","キーボードだけを選び、図面への手書き注記は文章へ置き換える","手袋操作に対応する入力方法と、細かな注記・署名に使えるペン入力を実作業で確認する","音声入力だけを選び、騒音や署名入力への適合性は導入後に確認する"],"correctChoiceIndex":2,"explanation":"選択操作には手袋で使えるタッチ方式や物理入力、細かな注記にはペン入力が適します。仕様表だけでなく、屋外の明るさ、手袋、騒音など実際の作業条件で確認します。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"現場操作条件によるタッチ・ペン入力選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-sampling-quantization-encoding-stages-1336","questionText":"アナログ音声をデジタルデータへ変換するときの、標本化、量子化、符号化の説明として最も適切なものはどれですか。","choices":["量子化で測定間隔を決め、標本化で振幅を段階化した後、符号化で再生時間を短くする","標本化で一定間隔の値を取った後、量子化せず連続したアナログ値のまま符号化する","符号化で測定点を選び、標本化でビット列へ変換した後、量子化で音量を増幅する","標本化は一定間隔で値を取り、量子化は段階的な値にし、符号化はビット列で表す"],"correctChoiceIndex":3,"explanation":"標本化では連続する音を一定の時間間隔で測定し、量子化では測定値を所定の段階へ割り当てます。符号化では、その値をコンピュータで扱えるビット列として表します。","category":"テクノロジ系","subcategory":"情報メディア","topic":"音声デジタル化の標本化・量子化・符号化","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-pcm-stereo-audio-size-calc-1337","questionText":"標本化周波数44.1kHz、量子化16ビット、ステレオ2チャネルで10秒間の音声を、圧縮せずPCM形式で保存する。1kHz＝1,000Hz、1バイト＝8ビットとすると、データ量はどれですか。ヘッダは無視します。","choices":["1,764,000バイト","882,000バイト","3,528,000バイト","7,056,000バイト"],"correctChoiceIndex":0,"explanation":"44,100回/秒×16ビット×2チャネル×10秒＝14,112,000ビットです。8で割ると1,764,000バイトになります。PCMはPulse Code Modulation（パルス符号変調）の略です。","category":"テクノロジ系","subcategory":"情報メディア","topic":"PCM音声の標本化周波数・量子化・チャネル・時間による容量","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-lossless-lossy-use-comparison-1338","questionText":"契約書のスキャン原本と、Web掲載用の商品写真を圧縮する。方式の選択として最も適切なものはどれですか。","choices":["契約書は容量を最小にする非可逆圧縮、商品写真は原本復元を優先する可逆圧縮だけを用いる","契約書は原本を正確に復元できる可逆圧縮を優先し、商品写真は許容画質内なら非可逆圧縮も検討する","二つとも圧縮後の用途に関係なく同じ方式を使い、文字の読取りと写真品質は確認しない","二つとも必ず非圧縮で配布し、保存容量と通信量は評価対象から外す"],"correctChoiceIndex":1,"explanation":"原本の情報を正確に戻す必要がある文書では可逆圧縮が適します。写真配信では、許容できる画質を確認した上で非可逆圧縮を使うと、容量や通信量を減らせます。","category":"テクノロジ系","subcategory":"情報メディア","topic":"原本復元・品質・容量による可逆／非可逆圧縮選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-image-transparency-editing-selection-1339","questionText":"Web画面に載せるロゴ画像を作る。背景を透明にし、文字や線の輪郭を保ち、更新のたびに再保存しても劣化を増やしたくない。完成画像の形式として最も適切なものはどれですか。","choices":["JPEG形式を使い、透明部分は背景色で置き換えて非可逆圧縮を繰り返す","BMP形式を使い、透明性と配信時の容量は形式とは別に扱う","透明性と可逆圧縮を扱えるPNG形式を使い、編集用原本も別に管理する","GIF形式を使い、写真と同じ豊富な色数を保ちながら編集用原本にも共用する"],"correctChoiceIndex":2,"explanation":"PNG（Portable Network Graphics）は透明性を扱え、可逆圧縮なのでロゴや画面部品に適します。JPEG（Joint Photographic Experts Group）は通常は透明性を扱わず、再圧縮で劣化し得ます。BMP（Bitmap）やGIF（Graphics Interchange Format）も用途と容量を確認して選びます。","category":"テクノロジ系","subcategory":"情報メディア","topic":"透過・再編集・写真品質条件による画像形式選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-video-frame-resolution-bitrate-tradeoff-1340","questionText":"通信速度が変動する回線で研修動画を配信する。文字は読める必要があるが、動きは少なく、現在は高解像度・高フレームレートのため再生停止が多い。改善として最も適切なものはどれですか。","choices":["解像度だけを最大へ固定し、フレームレートとビットレートは測定しない","フレームレートだけを上げ、文字の読取りや通信量は利用者側の回線で調整する","再生停止をなくすため音声だけを残し、研修資料の文字表示は別途用意しない","文字の可読性を保てる解像度を確認し、動きに合うフレームレートとビットレートへ調整する"],"correctChoiceIndex":3,"explanation":"動画品質は、解像度、フレームレート、ビットレートと通信条件のバランスで決まります。動きが少ない用途では、文字の可読性を保ちつつ過剰なフレームレートやビットレートを抑え、実回線で検証します。","category":"テクノロジ系","subcategory":"情報メディア","topic":"解像度・フレームレート・通信量の調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-streaming-progressive-playback-1341","questionText":"動画配信にストリーミングを使うときの特徴はどれですか。","choices":["データ全体の受信完了を待たず、受信しながら順次再生できる方式である","動画全体を一度ダウンロードし、保存完了後だけ再生する方式である","配信前に可逆圧縮し、端末で必ず原本と完全一致へ戻す方式である","複数端末の再生開始時刻を固定し、全端末で同じ場面を表示する方式である"],"correctChoiceIndex":0,"explanation":"ストリーミングでは、動画や音声のデータを受信しながら順次再生できます。回線速度や配信速度が不足すると待ち時間が生じるため、必要な通信量と再生条件の調整が必要です。","category":"テクノロジ系","subcategory":"情報メディア","topic":"ストリーミング再生と全体保存の違い","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-lossy-reencoding-quality-degradation-1342","questionText":"JPEG画像を編集のたびに開いて同程度の設定で保存したところ、輪郭周辺の乱れが徐々に目立つようになった。原因と対策として最も適切なものはどれですか。","choices":["可逆圧縮で情報量が増え続けたためであり、保存回数を増やして元へ戻す","非可逆圧縮を繰り返して情報が失われたためであり、可逆な編集用原本から配布用画像を作る","画素数が保存のたびに自動で倍増したためであり、表示装置の解像度だけを下げる","ネットワーク遅延で画像内容が変わったためであり、保存形式を変えず回線だけを高速化する"],"correctChoiceIndex":1,"explanation":"JPEGは一般に非可逆圧縮を使うため、再圧縮を繰り返すと失われる情報が増え、画質が低下し得ます。編集用には劣化を重ねない原本を保持し、必要な段階で配布用JPEGを生成します。","category":"テクノロジ系","subcategory":"情報メディア","topic":"非可逆再圧縮による画質劣化の切分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-rgb-cmyk-output-selection-1343","questionText":"同じ広告をWeb画面と印刷物で使用する。色の扱いとして最も適切なものはどれですか。","choices":["Webと印刷の両方を必ず同じRGB値だけで出力し、印刷時の色変化は確認しない","印刷用CMYKデータをそのまま全ての画面へ使い、表示装置による差は発生しないと考える","画面用はRGBを基本とし、印刷用は印刷条件に合わせてCMYK変換や色校正を行う","画面はRGB、印刷もRGB画面の見た目をそのまま使い、印刷条件による変換は行わない"],"correctChoiceIndex":2,"explanation":"画面は光の三原色であるRGB（Red、Green、Blue）、印刷は一般にCMYK（Cyan、Magenta、Yellow、Key plate）を使います。表現できる色の範囲が異なるため、印刷条件に合わせた変換と確認が必要です。","category":"テクノロジ系","subcategory":"情報メディア","topic":"画面表示と印刷に応じたRGB・CMYK選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cache-temporal-locality-application-1344","questionText":"プログラムが小さな参照表の同じ項目を短時間に何度も読み出す。キャッシュメモリが有効になりやすい理由として最も適切なものはどれですか。","choices":["同じ項目を繰り返すことを空間的局所性といい、隣接データだけがキャッシュに入るため","近いアドレスではなく同じ項目を使うので、キャッシュを経由せず必ず主記憶から読むため","参照した項目は必ずCPUのレジスタへ永久保存され、キャッシュから追い出されないため","最近参照したデータを再び使う時間的局所性があり、キャッシュから取得できる可能性が高いため"],"correctChoiceIndex":3,"explanation":"短時間に同じデータを再参照する性質を時間的局所性といいます。必要なデータがキャッシュに残っていれば、主記憶から読み直すより短い時間で取得できます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"反復参照と時間的局所性によるキャッシュ効果","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-memory-pressure-paging-bottleneck-1345","questionText":"大量データを開いた後からPCの応答が遅い。CPU使用率は30%、主記憶使用率は95%、ページファイルへの入出力が多く、SSDの空き容量は十分ある。改善のため最初に行う確認はどれですか。","choices":["主記憶不足によるページングを疑い、プロセス別使用量を確認して同時処理削減や主記憶増設を検討する","CPU不足と判断し、主記憶使用率とページファイルの値を確認せずCPUだけ交換する","SSDの容量不足と判断し、空き容量が十分でも大容量SSDへ交換する","ネットワーク不足と判断し、ローカル処理の資源使用量を測定対象から外す"],"correctChoiceIndex":0,"explanation":"PC（Personal Computer：パーソナルコンピュータ）の主記憶使用率とページ入出力が高く、CPU（Central Processing Unit：中央処理装置）には余裕があるため、ページングによる遅延が考えられます。SSD（Solid State Drive）の空き容量ではなく、同時実行や主記憶容量を原因に合わせて見直します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"メモリ不足・ページングによる性能低下の切分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-hot-cold-data-storage-tiering-1346","questionText":"直近1か月の5TBのデータは毎日分析し短い読出し時間が必要である。過去5年分の100TBは月に一度参照する程度で、保存費用を抑えたい。構成として最も適切なものはどれですか。","choices":["全データを低速な媒体だけへ置き、日次分析の読出し時間は処理件数の削減で補う","直近データを高速なSSD層、過去データを低コストの大容量層へ置き、利用頻度に応じて移動する","全データを最も高速なSSDだけへ置き、費用と将来の容量増加は評価しない","直近データを可搬媒体だけへ分散し、分析時の接続作業と紛失リスクは考慮しない"],"correctChoiceIndex":1,"explanation":"頻繁に参照するデータは高速な層、参照頻度の低い長期データは低コストの大容量層へ置くと、性能と費用を両立できます。SSD（Solid State Drive）とHDD（Hard Disk Drive）の特性を踏まえ、移動条件と必要時の読出し時間も確認します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"頻繁参照データと長期保管データのSSD・HDD配置","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-concurrent-memory-requirement-calc-1347","questionText":"PCではOSが4GB、同時実行する三つのアプリが各3GB、処理データが5GBの主記憶を使う。合計使用量に25%の余裕を持たせるとき、選択肢のうち必要条件を満たす最小の主記憶容量はどれですか。","choices":["16GB","20GB","24GB","32GB"],"correctChoiceIndex":2,"explanation":"使用量は4GB＋3GB×3＋5GB＝18GBです。25%の余裕を加えると18×1.25＝22.5GBなので、選択肢では24GBが条件を満たす最小容量です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"OS・同時実行処理・余裕分を含む主記憶容量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cpu-gpu-workload-mix-selection-1348","questionText":"日中は条件分岐の多い受注処理を行い、夜間は大量画像へ同じ変換処理を適用する端末を選ぶ。構成評価として最も適切なものはどれですか。","choices":["夜間処理だけを見てGPUを最大にし、日中処理のCPU性能と主記憶は比較しない","日中処理だけを見てCPUを選び、画像処理ソフトがGPUを利用できるかは確認しない","保存容量だけを同じにすれば処理性能も等しいと判断し、実処理の測定を省く","日中処理に必要なCPU・主記憶と、並列画像処理に使えるGPUを実ワークロードで比較する"],"correctChoiceIndex":3,"explanation":"条件分岐の多い処理と、同種計算を大量に行う処理では有効な資源が異なります。CPU（Central Processing Unit：中央処理装置）、主記憶、GPU（Graphics Processing Unit：画像処理装置）のバランスと、ソフトウェアがGPUを活用できるかを実処理で確認します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"制御処理と同種並列処理を含むCPU・GPU構成選択","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-interactive-batch-performance-metric-1349","questionText":"利用者が画面操作の速さを評価する処理と、夜間に大量データを処理するバッチ処理で、重視する性能指標の組合せとして最も適切なものはどれですか。","choices":["画面操作は応答時間、バッチ処理は単位時間当たりの処理量を重視する","画面操作は単位時間当たりの処理量、バッチ処理は一操作ごとの応答時間だけを重視する","二つともCPUの最大クロック周波数だけを測り、実際の処理時間は測定しない","二つともストレージの総容量だけを測り、処理件数と待ち時間は測定しない"],"correctChoiceIndex":0,"explanation":"対話型処理では操作から結果までの応答時間が重要です。大量のバッチ処理では、所定時間に処理できる件数などのスループットを重視し、対象処理に合う指標で測定します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"対話処理とバッチ処理の性能指標選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-storage-growth-headroom-selection-1350","questionText":"保存期間とデータ増加率を基に、余裕分を含む目標を利用可能容量15TB以上と定めた。必要な読書き性能も満たす案を選ぶとき、最も適切なものはどれですか。","choices":["利用可能容量12TBで性能を満たす案を選び、余裕容量は障害発生後に追加する","利用可能容量15TB以上で必要性能を満たし、その後も増加率と使用率を監視する案を選ぶ","利用可能容量20TBで性能要件を満たさない案を選び、容量の大きさだけで判断する","物理容量15TBでも冗長化後の利用可能容量が10TBの案を選び、実容量は確認しない"],"correctChoiceIndex":1,"explanation":"選定条件は、利用可能容量15TB以上と必要な読書き性能の両方です。物理容量ではなく、冗長化などを考慮した実際の利用可能容量を確認し、導入後も増加率と使用率を監視します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"保存期間・増加率・余力によるストレージ容量判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-network-route-diversity-investment-1351","questionText":"重要な受注サービスの回線を二重化する。案Xは同じ通信事業者の二回線で建物への引込み経路も同じ、案Yは別事業者だが建物入口から機械室まで同じ配管、案Zは別事業者で引込み口と機械室までの経路も分かれている。共通経路障害を抑える投資として最も適切な案はどれですか。","choices":["案Xを選び、契約回線数が二つであることだけを確認する","案Yを選び、通信事業者が異なることだけを確認する","案Zを選び、事業者と物理経路の独立性を定期的に確認する","一回線の帯域を増やし、経路障害への備えは復旧手順だけで補う"],"correctChoiceIndex":2,"explanation":"回線数が二つでも、同じ配管や引込み口を共有すると一つの事故で両方が止まる可能性があります。案Zは通信事業者と物理経路の共通障害点を減らしており、重要業務の冗長化投資として適切です。契約後も実際の経路や切替えを確認します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"共通経路リスクを考慮した回線冗長化投資","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-cloud-private-connectivity-selection-1352","questionText":"機密性の高い設計データを社内拠点からクラウドへ常時送る。停止時の業務影響が大きく、通信品質を安定させたいが、費用も評価する必要がある。接続方式の選定として最も適切なものはどれですか。","choices":["最安の公衆無線LANを使い、通信品質と接続元の管理は利用者へ任せる","インターネット接続だけを使い、暗号化や障害時の代替経路は設けない","専用接続だけを選び、費用、冗長性、障害時の切替方法は比較しない","暗号化VPNと専用接続について、機密性、品質、冗長性、費用を比較して選ぶ"],"correctChoiceIndex":3,"explanation":"接続方式は費用だけでなく、扱う情報、必要な通信品質、可用性、障害時の代替手段を合わせて評価します。VPN（Virtual Private Network：仮想私設網）と専用接続にはそれぞれ費用や品質上の特徴があるため、要件に基づく比較が必要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"クラウド接続方式の機密性・可用性・費用比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-zero-trust-phased-rollout-1353","questionText":"ゼロトラストの考え方を全社へ段階導入する。最初の対象を決める方法として最も適切なものはどれですか。","choices":["重要データへの接続、外部利用、特権操作などリスクの高い範囲から始め、結果を基に拡大する","利用者数が最も少ない部門だけへ導入し、扱う情報やアクセス経路は評価しない","全システムを同日に切り替え、認証や端末確認による業務影響は切替後に調べる","社内ネットワーク内の利用を対象外とし、外部接続だけを一度確認すれば完了とする"],"correctChoiceIndex":0,"explanation":"段階導入では、重要資産、特権操作、外部接続など侵害時の影響が大きい範囲を優先します。小さく導入して認証、端末確認、業務影響を測定し、改善しながら対象を広げるとリスクを管理しやすくなります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"重要資産・利用者リスクによるゼロトラスト段階導入","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-patch-exception-compensating-control-1354","questionText":"生産設備を制御する旧システムに重大な脆弱性が見つかったが、直ちにパッチを適用すると制御ソフトが停止する可能性がある。更新版の検証完了までの対応として最も適切なものはどれですか。","choices":["検証が終わるまで現状を維持し、接続範囲や監視方法も変更しない","接続元を制限してネットワークを分離し、監視を強化した上で検証と適用期限を管理する","停止を避けるため脆弱性情報を記録から除き、次回の設備更新まで対応を延期する","パッチを未検証のまま全設備へ同時適用し、問題が起きた場合に復旧方法を考える"],"correctChoiceIndex":1,"explanation":"直ちにパッチを適用できない場合でも、放置せずアクセス制限、ネットワーク分離、監視強化などの代替統制で一時的にリスクを下げます。検証、承認、適用期限、残るリスクを記録し、恒久対応まで追跡することが重要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"パッチ適用困難時の代替統制と期限管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-outsourced-incident-notification-contract-1355","questionText":"顧客データを扱うサービスを委託する。委託先でセキュリティ事故が疑われたときの連携条件として、契約へ定める内容はどれが最も適切ですか。","choices":["原因が確定した後の最終報告だけを求め、疑い段階の連絡期限は定めない","委託先だけで公表を判断できるようにし、委託元への証拠提供は対象外とする","疑い段階の通知期限、連絡経路、役割、証拠保全、進捗報告の条件を定める","月次稼働率だけを報告対象とし、事故時の調査協力はその都度口頭で決める"],"correctChoiceIndex":2,"explanation":"事故対応では、原因確定を待たず疑い段階から速やかに連携できる契約が必要です。通知期限、責任分担、証拠の保全・提供、対外説明の判断、継続報告を定めることで、委託元も適切に対応できます。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託先事故の通知期限・責任・証拠提供条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-network-refresh-parallel-migration-1356","questionText":"全拠点のネットワーク機器を刷新する。業務停止を抑え、設定不備があれば旧構成へ戻せるようにする移行計画として最も適切なものはどれですか。","choices":["全拠点を同時に切り替え、問題が起きた拠点だけ旧設定を後から調査する","旧構成を先に撤去し、新構成の疎通確認は利用者の業務開始後に実施する","小規模拠点で切り替え、安定後は旧構成を直ちに廃棄して次拠点へ進む","代表拠点で並行確認し、判定基準と切戻し手順を確認してから段階展開する"],"correctChoiceIndex":3,"explanation":"影響を限定するには、代表拠点で新旧構成の疎通と業務を確認し、合格基準と切戻し条件を確かめてから展開します。旧構成を戻せる期間を確保し、拠点ごとの結果を次の移行へ反映します。","category":"ストラテジ系","subcategory":"システム企画","topic":"ネットワーク刷新時の並行確認・段階移行・切戻し","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-security-loss-reduction-net-benefit-calc-1357","questionText":"ある事故による年間予想損失は900万円である。対策導入後は300万円へ減る見込みで、対策の年間運用費は240万円である。他の効果と初期費用を考慮しない場合、年間純効果はいくらですか。","choices":["360万円","540万円","720万円","1,080万円"],"correctChoiceIndex":0,"explanation":"年間損失削減額は900万円－300万円＝600万円です。ここから年間運用費240万円を引くため、年間純効果は360万円です。損失削減額と対策費を混同しないことが重要です。","category":"ストラテジ系","subcategory":"企業活動","topic":"年間損失削減額と対策費によるセキュリティ純効果計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-unmanaged-device-remote-access-policy-1358","questionText":"従業員が会社の管理対象外である私物PCから、VPNを使って社内の機密システムへ接続したいと申請した。対応として最も適切なものはどれですか。","choices":["VPNで暗号化されるため、端末の更新状態や保存先を確認せず許可する","管理端末を利用させ、例外時は端末状態、アクセス範囲、データ保存条件を確認する","利用者本人の申請があれば、機密度にかかわらず私物端末からの接続を許可する","私物端末の利用記録を残さず、一時的な接続として利用者だけで管理させる"],"correctChoiceIndex":1,"explanation":"VPN（Virtual Private Network：仮想私設網）は通信経路を保護しますが、端末自体の更新状態や情報保存方法までは保証しません。管理端末を基本とし、例外では端末の安全性、利用できる機能、保存制限を確認します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"管理外端末からのリモートアクセス方針","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-cyber-insurance-residual-risk-1359","questionText":"企業がサイバー保険へ加入した後の情報セキュリティ対応として最も適切なものはどれですか。","choices":["損害が補償されるため、アクセス管理やバックアップの運用を縮小する","事故対応は保険会社が行うため、自社の連絡体制と復旧手順を廃止する","補償範囲と免責条件を確認し、予防、初動、復旧、残るリスクの管理を続ける","保険料を支払えば事故発生確率も下がるため、脆弱性管理を不要と判断する"],"correctChoiceIndex":2,"explanation":"サイバー保険は金銭的影響の一部を移転する手段であり、事故の発生自体を防ぐものではありません。補償外の損失や免責条件もあるため、自社の予防、検知、初動、復旧の責任と残留リスク管理は継続します。","category":"ストラテジ系","subcategory":"企業活動","topic":"サイバー保険加入後の残留リスクと自社責任","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-alternate-network-route-rto-1360","questionText":"受注業務のRTOは30分である。主回線停止時、案Xは同じ配管を通る予備回線へ5分で切替え、案Yは独立したモバイル回線へ20分で切替え、案Zは独立回線だが復旧に60分かかる。選定として最も適切なものはどれですか。","choices":["案Xを選び、切替時間が短ければ共通する物理経路は評価しない","案Zを選び、経路が独立していればRTO超過は許容できると判断する","主回線だけを利用し、障害発生後に代替回線の契約と設定を開始する","案Yを選び、RTO内の切替えと経路独立性を訓練で確認する"],"correctChoiceIndex":3,"explanation":"RTO（Recovery Time Objective：目標復旧時間）以内に切り替えられ、主回線と共通障害点が少ない案を選びます。案Yは20分で切替可能かつ経路が独立しています。実際にRTOを満たすか、定期的な切替訓練で確認します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"RTO・経路独立性・切替時間による代替回線判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-managed-soc-responsibility-boundary-1361","questionText":"外部SOCへセキュリティ監視を委託する。自社とSOCの責任分界として最も適切なものはどれですか。","choices":["SOCの監視・一次分析範囲と、自社の業務判断・封じ込め承認・報告責任を明確にする","監視を委託した時点で、事故対応と法令上の判断を含む責任を全てSOCへ移す","SOCからの通知条件だけを決め、自社内の連絡先と意思決定者は事故後に選ぶ","SOCが使用する製品名だけを契約へ記載し、対応時間と証拠提供条件は定めない"],"correctChoiceIndex":0,"explanation":"SOC（Security Operations Center：セキュリティ運用センター）へ監視を委託しても、自社の業務判断や説明責任はなくなりません。検知、一次分析、連絡、封じ込め承認、対外報告などの役割と時間条件を明確にします。","category":"ストラテジ系","subcategory":"システム企画","topic":"外部SOC利用時の監視・判断・報告責任分界","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-vendor-patch-support-lifecycle-1362","questionText":"長期利用するネットワーク機器のベンダを選定する。脆弱性対応と更新支援の比較として最も適切なものはどれですか。","choices":["購入価格だけを比較し、サポート終了日と更新提供方法は導入後に確認する","通知方法、更新提供期間、適用支援、終了予告、後継移行条件を比較する","更新回数が多い製品を選び、更新内容と業務影響の説明は評価対象外とする","保守窓口の営業時間だけを比較し、重大脆弱性の緊急連絡条件は定めない"],"correctChoiceIndex":1,"explanation":"長期運用では、脆弱性情報の通知、更新の提供期間、適用支援、サポート終了の予告、後継製品への移行条件が重要です。初期価格だけでなく、製品ライフサイクル全体で安全に維持できるかを比較します。","category":"ストラテジ系","subcategory":"システム企画","topic":"ベンダの脆弱性通知・更新支援・終了条件比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-break-glass-privileged-account-governance-1363","questionText":"通常の管理者認証が利用できない緊急時に備え、強い権限を持つ緊急用アカウントを用意する。管理方法として最も適切なものはどれですか。","choices":["迅速に使えるよう複数担当者で同じ認証情報を共有し、利用記録は残さない","通常業務でも利用できるよう常時有効にし、個人別アカウントより優先して使う","利用条件と承認者を定め、認証情報を厳重管理し、使用後に記録確認と資格情報更新を行う","障害時だけ使うため棚卸しと動作確認を省き、必要時に初めて有効性を確認する"],"correctChoiceIndex":2,"explanation":"緊急用特権アカウントは必要時に利用可能である一方、不正利用を防ぐ強い統制が必要です。利用条件、承認、保管、操作記録、事後確認、資格情報の更新を定め、定期的に利用可能性も確認します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"緊急用特権アカウントの承認・記録・事後確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-critical-asset-segmentation-investment-1364","questionText":"ネットワーク分離の投資対象を一つ選ぶ。製造制御環境は停止すると出荷が止まり、一般事務LANとの通信は更新配布に限られる。開発環境は外部サービスを多用し、来客用Wi-Fiは社内資産へ接続しない。優先判断として最も適切なものはどれですか。","choices":["利用端末数が最も多い一般事務LANだけを分離し、業務停止影響は評価しない","来客用Wi-Fiを再分離し、既に社内資産へ接続しない構成は確認しない","開発環境の外部通信を全面停止し、業務上必要なサービスとの関係は評価しない","製造制御環境を優先し、必要な更新経路だけを管理して波及範囲を限定する"],"correctChoiceIndex":3,"explanation":"分離投資は端末数だけでなく、資産の重要度、停止影響、外部接続、必要な通信を評価します。製造制御環境は停止影響が大きいため優先し、更新など必要な通信だけを制御して侵害の波及を抑えます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"重要資産・依存通信によるネットワーク分離投資判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-network-sli-business-impact-1365","questionText":"ECサイトのネットワーク稼働率は目標内だが、決済が集中する時間帯に遅延とパケット損失が増え、購入中断が発生している。監視指標の扱いとして最も適切なものはどれですか。","choices":["稼働率に加えて遅延、損失、影響時間帯をSLIとして測り、購入中断との関係を確認する","稼働率を達成しているため正常とし、遅延と購入中断は利用者側の問題として扱う","月間の平均通信量だけを測り、決済時間帯の変化と通信品質は集計しない","ネットワーク機器の台数だけをSLIとし、利用者が受ける応答品質は評価しない"],"correctChoiceIndex":0,"explanation":"SLI（Service Level Indicator：サービスレベル指標）は、利用者が受ける品質を適切に表す必要があります。稼働率だけでなく、重要時間帯の遅延やパケット損失を測り、購入中断などの事業影響と関連付けます。","category":"ストラテジ系","subcategory":"システム企画","topic":"ネットワークSLIと遅延・損失・事業影響の対応","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"strategy-security-control-portfolio-priority-1366","questionText":"限られた予算で、未使用アカウントの整理、特権操作ログの集中保管、重要サーバの分離、監視担当者の増員を進める。実施順序の決め方として最も適切なものはどれですか。","choices":["費用が低い対策から順に実施し、対策間の前提関係とリスク低減効果は評価しない","重大リスクと攻撃経路を評価し、前提となる権限整理やログ整備を含めて組合せと順序を決める","一つの対策へ予算を集中し、その対策で扱えないリスクは次年度まで記録しない","各部門の希望順に実施し、重要資産への影響と既存対策との重なりは比較しない"],"correctChoiceIndex":1,"explanation":"複数対策は単独の費用だけでなく、対象リスク、相互依存、既存統制との重なりを評価します。例えば、権限整理やログ整備は監視の有効性を高める前提になり得るため、全体のリスク低減効果が大きくなる順序を選びます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"依存関係とリスク低減効果によるセキュリティ対策順序","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-security-incident-severity-matrix-1367","questionText":"三つの事故を分類する。Xは公開情報サイトが5分停止、Yは一部社員の認証情報漏えい疑い、Zは顧客情報を扱う基幹サービスで不審な外部通信が継続中である。重大度の判断として最も適切なものはどれですか。","choices":["発生件数だけを基準にし、情報種別と継続中の被害は評価しない","停止時間だけを基準にし、機密性への影響と拡大可能性は考慮しない","情報の重要度、影響範囲、継続性、拡大可能性を評価し、Zを速やかに上位へ報告する","最初に届いた事故を最重大とし、後から判明した影響は分類へ反映しない"],"correctChoiceIndex":2,"explanation":"セキュリティ事故の重大度は件数や停止時間だけでなく、情報の重要度、影響範囲、被害の継続、拡大可能性で判断します。顧客情報を扱うサービスで不審通信が継続しているZは、迅速なエスカレーションが必要です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"情報種別・影響範囲・継続性による事故重大度判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-emergency-firewall-change-control-1368","questionText":"不審通信を止めるため、ファイアウォールへ緊急の遮断ルールを追加する。緊急変更の進め方として最も適切なものはどれですか。","choices":["担当者判断で変更し、復旧後は設定を残したまま記録と影響確認を省く","通常の月次会議まで変更を待ち、その間の不審通信は監視だけで対応する","広い範囲を遮断し、影響した業務は変更後に利用部門から報告してもらう","簡略化した承認を得て変更内容を記録し、必要通信と切戻し条件を確認する"],"correctChoiceIndex":3,"explanation":"緊急時でも、承認、変更内容、実施者、影響確認、切戻し条件を管理します。通常手続を必要な範囲で短縮しつつ、必要な業務通信を誤って止めていないか確認し、後で正式な記録とレビューを補います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"緊急ファイアウォール変更の承認・記録・切戻し","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-patch-pilot-rollout-1369","questionText":"業務端末へセキュリティパッチを配布する。特定の業務アプリとの互換性に懸念があるとき、展開方法として最も適切なものはどれですか。","choices":["代表端末へ試行し、業務確認と監視を行い、停止条件と切戻しを準備して段階展開する","全端末へ同時配布し、互換性問題が起きた部門だけ利用を停止して調査する","互換性が保証されるまで配布を延期し、延期中の代替対策と期限は設定しない","業務アプリを使わない端末だけへ配布し、利用端末は次の機器更新まで対象外とする"],"correctChoiceIndex":0,"explanation":"代表端末への試行導入で、起動、主要業務、性能への影響を確認してから対象を広げます。不具合時の停止基準と切戻しを準備し、延期する端末には一時対策と期限を設定します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"パッチの試行導入・互換性確認・段階展開","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-vpn-auth-log-time-correlation-1370","questionText":"利用者は10時00分にVPN接続を試みた。端末時計は基準より7分進み、端末ログは10時07分に接続開始、VPNログは10時00分に認証成功、認証基盤ログは10時01分に追加確認失敗を記録している。最初の調査として最も適切なものはどれですか。","choices":["端末ログの10時07分だけを正しい時刻とみなし、他の二つは別の接続として除外する","時刻差と利用者・接続識別情報を補正して三ログを対応付け、追加確認失敗を調べる","VPN認証が成功しているため接続は正常と判断し、追加確認と端末ログは確認しない","三ログの記録時刻を削除してから再試行し、失敗原因は利用者の申告だけで決める"],"correctChoiceIndex":1,"explanation":"複数ログを比較するときは、時刻同期のずれと利用者・接続識別情報を考慮します。VPN（Virtual Private Network：仮想私設網）の認証成功後でも追加認証に失敗することがあるため、同一試行として時系列を復元します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"VPN・認証ログの時刻補正と時系列切り分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-recurring-dns-problem-record-1371","questionText":"毎週月曜の始業直後だけ複数拠点で名前解決が遅くなり、DNSサービスの再起動で一時復旧する。運用管理として次に行う対応はどれが最も適切ですか。","choices":["定時再起動を運用手順へ追加し、原因調査は障害頻度が増えた場合に行う","利用者へIPアドレスの直接入力を案内し、名前解決の調査を終了する","問題記録を作成し、発生時刻、負荷、設定変更、依存先を分析して恒久対策を管理する","DNSサーバを直ちに入れ替え、入替え前後の測定と再発確認は省く"],"correctChoiceIndex":2,"explanation":"再起動は短期的な回避策であり、繰り返す障害の根本原因を除くものではありません。DNS（Domain Name System）の負荷、依存先、変更履歴などを問題管理で分析し、恒久対策と再発確認を追跡します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"再発するDNS障害の問題記録・原因分析・恒久対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-certificate-renewal-change-calendar-1372","questionText":"社内外の複数サービスで使うTLS証明書を更新する。期限切れや更新漏れを防ぐ管理として最も適切なものはどれですか。","choices":["有効期限だけを一覧化し、担当者と利用サービスは期限日に調べる","証明書ファイル名だけを管理し、テスト日程と切戻し方法は各担当へ任せる","ブラウザ警告が出た証明書だけを更新し、警告のない依存サービスは確認しない","証明書、所有者、期限、依存サービスを台帳化し、事前通知、テスト、変更日程を管理する"],"correctChoiceIndex":3,"explanation":"TLS（Transport Layer Security）証明書は、所有者、期限、配置先、依存サービスを把握して更新します。期限前の通知、テスト、切替日、問題時の切戻しを変更計画へ含めることで、更新漏れとサービス停止を防ぎます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"証明書の所有者・期限・依存サービス・変更日程管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-vendor-evidence-chain-of-custody-1373","questionText":"委託先から、事故調査に使う端末イメージとログを受領する。証拠としての信頼性を保つ方法として最も適切なものはどれですか。","choices":["受領日時、受渡者、識別子、ハッシュ値、保管場所、以後の取扱者を記録する","調査を早めるため原本へ直接メモを書き込み、変更内容は調査終了後にまとめる","ファイル名が同じなら同一証拠とみなし、受領時の完全性確認は行わない","複数担当者が共有領域で自由に編集し、最終版だけを証拠として保存する"],"correctChoiceIndex":0,"explanation":"証拠の受渡しと取扱いを追跡できるよう、日時、担当者、識別情報、完全性確認値、保管場所を記録します。原本を保護し、調査には複製を用いることで、後から改変の有無と取扱経路を説明できます。","category":"マネジメント系","subcategory":"システム監査","topic":"委託先から受領する事故証拠の引渡し記録・保全","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-security-control-effectiveness-audit-1374","questionText":"監査で、退職者アカウントを自動無効化する設定が存在することを確認した。統制が実際に有効か確かめる手続として最も適切なものはどれですか。","choices":["設定画面の項目名を確認し、退職者データとの照合は行わない","退職者の標本について退職日、無効化時刻、ログイン可否、例外承認を照合する","運用担当者が有効だと回答したため、設定結果と操作記録の確認を省く","自動化製品の説明書を読み、組織固有の設定と実行結果は監査対象外とする"],"correctChoiceIndex":1,"explanation":"統制の設定が存在するだけでは、対象データが正しく連携され、期限内に機能したとは判断できません。退職者の記録、無効化結果、ログイン可否、例外承認を照合して運用上の有効性を確かめます。","category":"マネジメント系","subcategory":"システム監査","topic":"セキュリティ統制の設定存在と運用有効性の区別","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-containment-recovery-gate-1375","questionText":"マルウェア感染が疑われる区画を分離し、不審通信は止まった。業務サービスを元のネットワークへ戻す判断として最も適切なものはどれですか。","choices":["不審通信が止まった時点で戻し、原因と影響範囲は再開後に調べる","利用部門の希望時刻だけで戻し、端末の安全確認と監視方法は変更しない","原因範囲、除去結果、資格情報、必要パッチ、業務整合性、監視体制を確認して承認する","分離中の端末を初期化せず戻し、同じ警告が再発した場合だけ対応する"],"correctChoiceIndex":2,"explanation":"封じ込めに成功しても、原因や影響が残ったまま接続すると再発・再侵入の恐れがあります。除去と更新、資格情報、業務データの整合性、監視体制を確認し、定めた復旧基準に基づいて再接続します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"封じ込め後の復旧・再接続承認条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-network-change-failure-trend-1376","questionText":"拠点ネットワークで短時間の切断が月3回発生している。各回とも発生前日に別担当者が設定を変更し、変更箇所は異なるが共通テンプレートを使用していた。次に行う調査として最も適切なものはどれですか。","choices":["各切断を別の事故として閉じ、変更履歴と共通テンプレートは比較しない","通信事業者へ全原因を求め、自社の設定差分と変更時刻は確認しない","直近の設定だけを保存し、過去の構成と正常時の基準構成は削除する","切断時刻、変更記録、構成差分、共通テンプレートを関連付けて再発原因を調べる"],"correctChoiceIndex":3,"explanation":"繰り返す障害では、個別復旧だけでなく共通する変更要因を探します。発生時刻と変更記録、正常時の基準構成、設定差分を比較し、共通テンプレートに原因がないか問題管理へつなげます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ネットワーク変更記録・構成差分・再発傾向の関連付け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"management-log-retention-replica-capacity-calc-1377","questionText":"監査ログは1日20GB発生し、90日保存する。圧縮後の容量は元の60%で、同じ内容を二つの保存先へ1部ずつ保管する。管理領域などを考慮しない場合、必要な保存容量の合計はどれですか。","choices":["2,160GB","1,080GB","3,000GB","3,600GB"],"correctChoiceIndex":0,"explanation":"一つの保存先では20GB×90日×0.6＝1,080GBです。二つの保存先へ同じ内容を保管するため、合計は1,080GB×2＝2,160GBです。圧縮率と複製数の適用順を区別します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"日次量・保存日数・圧縮率・複製数によるログ容量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-dhcp-pool-exhaustion-diagnosis-1378","questionText":"既存端末は通信できるが、新しく接続した端末だけがIPアドレスを自動取得できない。DHCPサーバは稼働中で、割当て可能数が上限に達している。最初に確認する内容はどれですか。","choices":["DHCPが配布する名前解決サーバのアドレスだけを変更する","DHCPの使用中リース、不要な予約、プール範囲を確認する","既存端末へ配布済みのデフォルトゲートウェイだけを変更する","既存端末が接続するスイッチの通信速度だけを変更する"],"correctChoiceIndex":1,"explanation":"既存端末は利用でき、新規端末だけ取得できないため、DHCP（Dynamic Host Configuration Protocol）のアドレスプール不足が疑われます。使用中リース、不要な予約、適切なプール範囲を確認します。名前解決や既存端末の通信設定変更では、割当て可能数の不足は解消しません。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"新規端末だけ失敗するDHCPアドレスプール不足の診断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-dhcp-wrong-gateway-scope-1379","questionText":"あるフロアの端末はIPアドレスを自動取得でき、同じフロア内では通信できるが、社外ネットワークへ到達できない。別フロアは正常で、問題のフロアだけDHCP設定を変更した直後である。最初に確認する設定はどれですか。","choices":["問題のDHCPスコープから配布された名前解決用の検索ドメインだけを確認する","問題のDHCPスコープのリース期間だけを短くする","問題のDHCPスコープから配布されたデフォルトゲートウェイを確認する","問題のDHCPスコープのアドレス割当て順だけを変更する"],"correctChoiceIndex":2,"explanation":"同一フロア内の通信はできる一方、外部だけ到達できず、DHCP変更直後なので、配布されたデフォルトゲートウェイが重点確認対象です。DHCP（Dynamic Host Configuration Protocol）はIPアドレスだけでなく、ゲートウェイなども配布できます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DHCPスコープから配布された誤ゲートウェイの切り分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-internal-external-dns-source-diagnosis-1380","questionText":"社内PCは社内ポータル名を正しい社内IPアドレスへ名前解決できるが、来客用Wi-Fiの端末では同じ名前が見つからない。両端末は異なるDNSサーバを参照している。最初に確認する内容はどれですか。","choices":["来客用端末のDHCPリース時間だけを延ばし、現在の名前解決結果を再利用する","社内ポータルのWebサーバだけを再起動し、両端末の参照先DNSは比較しない","社内PCと来客用端末のデフォルトゲートウェイを同じ値に統一する","来客用端末の参照先DNSと、そのDNSに社内名の情報があるかを確認する"],"correctChoiceIndex":3,"explanation":"端末ごとに参照するDNSが異なり、社内名だけ結果が違うため、参照先と登録情報を確認します。DNS（Domain Name System）は名前とIPアドレスを対応付けます。DHCP（Dynamic Host Configuration Protocol）のリース時間やWeb画面の内容は、この名前解決差の直接原因ではありません。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"内部・外部DNS参照先と名前解決範囲の診断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-default-gateway-reachability-diagnosis-1381","questionText":"PCから同じLAN内のプリンタへは通信できるが、別ネットワーク上のサーバへは通信できない。PCだけを交換した直後である。最初に確認する設定はどれですか。","choices":["PCのデフォルトゲートウェイ","PCが参照する名前解決サーバ","PCのサブネットマスクだけを広い範囲へ変更する","PCのWebプロキシを別ネットワークのアドレスへ変更する"],"correctChoiceIndex":0,"explanation":"同じLAN内には到達でき、別ネットワークへ出られないため、PCが外部宛て通信を渡すデフォルトゲートウェイを確認します。名前解決、サブネット範囲、プロキシを根拠なく変更する前に、交換したPCの経路設定を正常端末と比較します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"同一LAN成功・外部失敗時のデフォルトゲートウェイ確認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-subnet-mask-partial-reachability-1382","questionText":"設定変更したPCは、一部の近いIPアドレスの端末とは通信できるが、本来同じLANにある別範囲の端末へ送る通信を誤ってゲートウェイへ渡している。IPアドレスとゲートウェイは正しい。最初に確認する設定はどれですか。","choices":["PCが参照する名前解決サーバのアドレス","PCのサブネットマスク","PCに設定されたデフォルトゲートウェイ","PCへ割り当てたIPアドレスの末尾だけ"],"correctChoiceIndex":1,"explanation":"サブネットマスクが誤ると、PCがどの宛先を同じLANと判断するかが変わり、部分的な疎通失敗が起こります。IPアドレスとゲートウェイが正しいという条件から、ネットワーク範囲を決めるサブネットマスクを確認します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"サブネットマスク不整合による部分的な疎通失敗","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-wifi-channel-interference-diagnosis-1383","questionText":"会議室では昼休みだけ無線LANの通信が遅くなる。有線LANは正常で、周辺の複数アクセスポイントが同じチャネルを使い、昼休みは利用端末も増えている。改善前に確認する内容はどれですか。","choices":["アクセスポイントの台数だけを増やし、チャネルの重なりは確認しない","全端末の送信出力を最大に固定し、周辺電波は測定しない","チャネル使用状況、電波強度、利用台数、アクセスポイント配置を測定する","インターネット回線の契約帯域だけを増やし、有線との差は調べない"],"correctChoiceIndex":2,"explanation":"有線LANは正常で、時間帯と場所に依存し、同じチャネルの利用が集中しているため、無線の干渉や混雑が疑われます。チャネル、電波強度、端末数、配置を測定してから、チャネルや配置を調整します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"時間帯・利用台数・チャネル競合による無線LAN干渉診断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-wifi-roaming-authentication-1384","questionText":"倉庫の端末はアクセスポイントAの近くでは正常だが、移動してBへ切り替わると認証を繰り返して業務通信を再開できない。他端末はBでも正常で、この端末だけ古い認証設定を保持している。確認として最も適切なものはどれですか。","choices":["外部回線の帯域を増やし、アクセスポイント切替え時の認証記録は確認しない","Aの電源を切ってBだけに接続させ、端末固有設定と他端末との差は調べない","業務サーバを再起動し、無線接続と認証が完了する前のログは対象外とする","端末の認証設定とA・Bの認証ログを比較し、切替え時の失敗箇所を確認する"],"correctChoiceIndex":3,"explanation":"他端末はBで正常で、この端末だけ切替え時に失敗するため、端末固有の認証設定とアクセスポイント側ログを比較します。単に電波や外部帯域を変更するのではなく、ローミング時の再認証のどこで失敗したかを切り分けます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"アクセスポイント切替え時の端末認証失敗診断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-vpn-route-permission-diagnosis-1385","questionText":"在宅端末はVPN認証に成功し、社内ポータルへ接続できるが、新設した在庫ネットワークだけへ到達できない。他の利用者も同じ状態である。最初に確認する内容はどれですか。","choices":["VPNへ配布する経路と在庫ネットワークへの通信許可範囲","VPN認証用証明書の表示名だけを変更する","利用者ごとに社内ポータルのパスワードを再設定する","在庫ネットワークの名前解決用の名称だけを変更する"],"correctChoiceIndex":0,"explanation":"VPN（Virtual Private Network：仮想私設網）の認証と既存サービスへの接続は成功しているため、新設ネットワーク向けの経路または許可設定を確認します。端末固有ではなく複数利用者に共通する点も、集中設定の問題を示します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"VPN認証成功後の特定ネットワーク経路・許可範囲診断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-proxy-bypass-internal-service-1386","questionText":"社内PCは外部Webサイトをプロキシ経由で閲覧できるが、社内だけで使う管理画面へ接続するとプロキシから「宛先不明」と返される。管理画面へ直接到達する経路は正常である。確認する設定はどれですか。","choices":["外部Webサイト向け通信も含め、全通信でプロキシを使わない設定","社内管理画面の宛先をプロキシ除外対象にする設定","管理画面サーバから外部の名前解決サービスへ全社内名を公開する設定","各PCのIPアドレスを同じ値へ固定する設定"],"correctChoiceIndex":1,"explanation":"社内管理画面は直接到達できる一方、プロキシ経由だけ失敗しているため、社内宛てを直接接続させる除外設定を確認します。外部通信までプロキシから外したり、社内名を外部へ公開したりする必要はありません。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"社内サービス向けプロキシ除外と通信経路判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-certificate-warning-cause-comparison-1387","questionText":"あるHTTPSサイトは会社PCでは正常だが、時計が1年遅れた検証端末だけ証明書の有効期間に関する警告が出る。証明書のホスト名と期限は正しい。最初に直すものはどれですか。","choices":["名前解決サーバに登録されたサイトのIPアドレス","サイト名と証明書に記載されたホスト名","検証端末の日付と時刻","サーバ証明書で使用する公開鍵の所有者名"],"correctChoiceIndex":2,"explanation":"HTTPS（Hypertext Transfer Protocol Secure）で用いるTLS（Transport Layer Security）証明書の有効期間は、端末の現在時刻と比較されます。他端末では正常で、ホスト名と証明書の期限も正しいため、最初に検証端末の日付と時刻を直します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"TLS証明書警告の期限・ホスト名・信頼・端末時刻比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-firewall-rule-order-validation-1388","questionText":"業務サーバへの通信を許可するルールを追加したが接続できない。ファイアウォールは上から順に評価し、追加ルールより前に同じ宛先を含む広い拒否ルールがある。対応として最も適切なものはどれですか。","choices":["業務サーバのホスト名を変更し、ファイアウォールの評価結果は確認しない","拒否ルールを削除して全通信を許可し、不要な通信は監視だけで見つける","許可ルールを同じ位置へ繰り返し追加し、先行ルールとの関係は変更しない","必要範囲を限定したルール順序へ見直し、許可・拒否双方をテストする"],"correctChoiceIndex":3,"explanation":"先行する広い拒否ルールで処理が決まるため、後続の許可ルールへ到達していません。必要な送信元、宛先、通信だけを許可する位置へ見直し、意図した通信と不要な通信の双方を確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ファイアウォールルール順序と変更後の許可・拒否確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-23T00:00:00+09:00","updatedAt":"2026-09-23T00:00:00+09:00"},{"id":"technology-ids-ips-edr-siem-role-mapping-1389","questionText":"ネットワーク上の
