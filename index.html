  }

  async function getAllReviewStates(dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction(REVIEW_STORE, 'readonly');
    const done = transactionDone(tx);
    const rows = await requestToPromise(tx.objectStore(REVIEW_STORE).getAll());
    await done;
    return rows.sort((a, b) => {
      const at = a.updatedAt || '';
      const bt = b.updatedAt || '';
      return bt.localeCompare(at) || a.questionId.localeCompare(b.questionId);
    });
  }

  async function getReviewState(questionId, dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction(REVIEW_STORE, 'readonly');
    const done = transactionDone(tx);
    const row = await requestToPromise(tx.objectStore(REVIEW_STORE).get(questionId));
    await done;
    return row || null;
  }

  async function saveAnswerWithReviewState(entry, dbName = DEFAULT_DB_NAME) {
    if (!entry || !entry.eventId) throw new Error('保存イベントIDがありません。');
    const answeredAt = new Date(entry.answeredAt);
    if (Number.isNaN(answeredAt.getTime())) throw new Error('解答日時が不正です。');

    const db = await openDatabase(dbName);
    const tx = db.transaction([HISTORY_STORE, REVIEW_STORE], 'readwrite');
    const done = transactionDone(tx);
    const historyStore = tx.objectStore(HISTORY_STORE);
    const reviewStore = tx.objectStore(REVIEW_STORE);

    try {
      const eventIndex = historyStore.index('eventId');
      const existingEvent = await requestToPromise(eventIndex.get(entry.eventId));
      if (existingEvent) {
        const existingState = await requestToPromise(reviewStore.get(entry.questionId));
        await done;
        return { answerHistoryId: existingEvent.id, reviewState: existingState || null, duplicate: true };
      }

      const answerHistoryId = await requestToPromise(historyStore.add(entry));
      const existingState = (await requestToPromise(reviewStore.get(entry.questionId))) || null;
      const reviewState = global.ITPLogic.calculateQuestionReviewStateAfterAnswer(
        entry.questionId,
        entry.isCorrect,
        existingState,
        answeredAt,
      );
      if (reviewState) await requestToPromise(reviewStore.put(reviewState));
      await done;
      return { answerHistoryId, reviewState, duplicate: false };
    } catch (error) {
      try { tx.abort(); } catch (_) {}
      throw error;
    }
  }

  async function deleteAllLearningData(dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction([HISTORY_STORE, REVIEW_STORE], 'readwrite');
    const done = transactionDone(tx);
    const historyStore = tx.objectStore(HISTORY_STORE);
    const reviewStore = tx.objectStore(REVIEW_STORE);
    const answerHistoryCount = await requestToPromise(historyStore.count());
    const reviewStateCount = await requestToPromise(reviewStore.count());
    await requestToPromise(historyStore.clear());
    await requestToPromise(reviewStore.clear());
    await done;
    return { answerHistoryCount, reviewStateCount };
  }

  async function getSetting(key, fallback = null, dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction(SETTINGS_STORE, 'readonly');
    const done = transactionDone(tx);
    const row = await requestToPromise(tx.objectStore(SETTINGS_STORE).get(key));
    await done;
    return row ? row.value : fallback;
  }

  async function setSetting(key, value, dbName = DEFAULT_DB_NAME) {
    const db = await openDatabase(dbName);
    const tx = db.transaction(SETTINGS_STORE, 'readwrite');
    const done = transactionDone(tx);
    await requestToPromise(tx.objectStore(SETTINGS_STORE).put({ key, value }));
    await done;
  }

  async function exportLearningData(dbName = DEFAULT_DB_NAME) {
    const [answerHistory, reviewState] = await Promise.all([
      getAllAnswerHistory(dbName),
      getAllReviewStates(dbName),
    ]);
    return {
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      app: 'ITパスポート学習 Web',
      answerHistory,
      reviewState,
    };
  }

  function validateBackup(data) {
    if (!data || data.schemaVersion !== 1) throw new Error('対応していないバックアップ形式です。');
    if (!Array.isArray(data.answerHistory) || !Array.isArray(data.reviewState)) {
      throw new Error('バックアップデータが不正です。');
    }
    for (const entry of data.answerHistory) {
      if (!entry || typeof entry.questionId !== 'string' || typeof entry.answeredAt !== 'string') {
        throw new Error('解答履歴の形式が不正です。');
      }
      if (![0,1,2,3].includes(entry.selectedChoice) || typeof entry.isCorrect !== 'boolean') {
        throw new Error('解答履歴の回答情報が不正です。');
      }
      if (!['通常演習','不正解復習','今日の復習'].includes(entry.studyMode)) {
        throw new Error('解答履歴の学習モードが不正です。');
      }
      if (!Number.isFinite(entry.answerTimeMs) || entry.answerTimeMs < 0) {
        throw new Error('解答時間が不正です。');
      }
    }
    for (const state of data.reviewState) {
      if (!state || typeof state.questionId !== 'string' || !Number.isInteger(state.reviewStage) || state.reviewStage < 0 || state.reviewStage > 5) {
        throw new Error('復習状態の形式が不正です。');
      }
    }
  }

  async function importLearningData(data, dbName = DEFAULT_DB_NAME) {
    validateBackup(data);
    const db = await openDatabase(dbName);
    const tx = db.transaction([HISTORY_STORE, REVIEW_STORE], 'readwrite');
    const done = transactionDone(tx);
    const historyStore = tx.objectStore(HISTORY_STORE);
    const reviewStore = tx.objectStore(REVIEW_STORE);
    try {
      await requestToPromise(historyStore.clear());
      await requestToPromise(reviewStore.clear());
      const oldestFirst = [...data.answerHistory].sort((a, b) => {
        const ta = Date.parse(a.answeredAt);
        const tb = Date.parse(b.answeredAt);
        return (Number.isFinite(ta) ? ta : 0) - (Number.isFinite(tb) ? tb : 0) || (a.id || 0) - (b.id || 0);
      });
      for (const original of oldestFirst) {
        const entry = { ...original };
        if (!entry.eventId) entry.eventId = `import-${entry.questionId}-${entry.answeredAt}-${entry.id || Math.random()}`;
        if (entry.id === undefined || entry.id === null) delete entry.id;
        await requestToPromise(historyStore.put(entry));
      }
      for (const state of data.reviewState) await requestToPromise(reviewStore.put(state));
      await done;
    } catch (error) {
      try { tx.abort(); } catch (_) {}
      throw error;
    }
  }

  async function deleteDatabase(dbName = DEFAULT_DB_NAME) {
    const existing = dbPromises.get(dbName);
    if (existing) {
      try { (await existing).close(); } catch (_) {}
      dbPromises.delete(dbName);
    }
    await new Promise((resolve, reject) => {
      const req = indexedDB.deleteDatabase(dbName);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error || new Error('データベースを削除できませんでした。'));
      req.onblocked = () => reject(new Error('データベース削除が別タブによりブロックされています。'));
    });
  }

  global.ITPStorage = Object.freeze({
    DEFAULT_DB_NAME,
    initializeDatabase,
    getAllAnswerHistory,
    getAllReviewStates,
    getReviewState,
    saveAnswerWithReviewState,
    deleteAllLearningData,
    getSetting,
    setSetting,
    exportLearningData,
    importLearningData,
    deleteDatabase,
  });
})(window);

      const states = await Storage.getAllReviewStates();
      sessionQuestions = Logic.getDueReviewQuestions(states, QUESTIONS);
    } else {
      const history = await Storage.getAllAnswerHistory();
      sessionQuestions = Logic.getUnansweredQuestions(history, QUESTIONS).slice(0, count);
    }

    const session = {
      schemaVersion: 1,
      routeKey,
      mode,
      studyMode: Logic.getStudyMode(mode),
      questionIds: sessionQuestions.map((q) => q.id),
      currentIndex: 0,
      correctCount: 0,
      answeredCount: 0,
      selectedChoice: null,
      answered: false,
      historySaved: false,
      saveFailed: false,
      pendingEntry: null,
      questionStartedAt: Date.now(),
      completed: false,
    };
    if (session.questionIds.length > 0) saveSession(session);
    return session;
  }

  async function renderPractice(serial, params) {
    const mode = ['incorrect', 'scheduled'].includes(params.get('mode')) ? params.get('mode') : 'normal';
    const count = Logic.sanitizePracticeCount(params.get('count'));
    const studyMode = Logic.getStudyMode(mode);
    setHeader(studyMode);
    app.innerHTML = `<main class="screen"><div class="loading-block"><div class="spinner"></div><p>出題する問題を確認しています</p></div></main>`;
    try {
      const session = await buildPracticeSession(mode, count);

        const message = mode === 'incorrect' ? '最新の回答が不正解の問題があると、ここから復習できます。' : mode === 'scheduled' ? '復習期限が来ると、ここから今日の復習を開始できます。' : 'すべての問題に回答済みです。学習履歴を削除すると再び出題できます。';

      console.error(error);

      document.getElementById('retry-practice').onclick = renderRoute;
    }
  }

  function renderQuestionSession(session) {
    const question = questionById(session.questionIds[session.currentIndex]);
    if (!question) {
      app.innerHTML = `<main class="screen centered">${statusCard('問題を表示できませんでした', 'ホームへ戻って、もう一度演習を開始してください。', 'error')}<button id="bad-home" class="btn btn-primary" type="button">ホームへ戻る</button></main>`;
      document.getElementById('bad-home').onclick = () => navigate('/', null, true);
      return;
    }
    const labels = ['A','B','C','D'];
    const progress = Math.round(((session.currentIndex + 1) / session.questionIds.length) * 100);
    const isCorrect = session.answered && session.selectedChoice === question.correctChoiceIndex;

    const choices = question.choices.map((choice, index) => {
      const selected = session.selectedChoice === index;
      const correct = session.answered && index === question.correctChoiceIndex;
      const incorrect = session.answered && selected && !correct;
      const cls = ['choice'];
      if (selected) cls.push('selected');
      if (correct) cls.push('correct');
      if (incorrect) cls.push('incorrect');
      return `<button class="${cls.join(' ')}" data-choice="${index}" type="button" ${session.answered ? 'disabled' : ''} aria-pressed="${selected}"><span class="choice-label">${labels[index]}</span><span>${esc(choice)}</span></button>`;
    }).join('');

    const saveError = session.saveFailed ? `<div class="save-error" role="alert"><strong>この回答の学習データを保存できませんでした。</strong><span>保存を完了してから次へ進んでください。</span><button id="retry-save" class="btn btn-danger-outline" type="button">保存を再試行</button></div>` : '';
    const feedback = session.answered ? `
      <section class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
        <h2>${isCorrect ? '正解です' : '不正解です'}</h2>
        <span class="muted-label">正解の選択肢</span>
        <p class="correct-answer">${labels[question.correctChoiceIndex]}. ${esc(question.choices[question.correctChoiceIndex])}</p>
        <hr>
        <span class="muted-label">解説</span>
        <p>${esc(question.explanation)}</p>
      </section>` : '';

    const primaryAction = !session.answered
      ? `<button id="answer-button" class="btn btn-primary" type="button" ${session.selectedChoice === null ? 'disabled' : ''}>解答する</button>`
      : `<button id="next-button" class="btn btn-primary" type="button" ${!session.historySaved || saveInFlight ? 'disabled' : ''}>${saveInFlight ? '履歴を保存しています' : session.currentIndex === session.questionIds.length - 1 ? '結果を見る' : '次の問題へ'}</button>`;

    app.innerHTML = `
      <main class="screen practice-screen">
        ${saveError}
        <div class="progress-header"><strong>問題 ${session.currentIndex + 1} / ${session.questionIds.length}</strong><span>${esc(question.category)}</span></div>
        <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="${session.questionIds.length}" aria-valuenow="${session.currentIndex + 1}"><div style="width:${progress}%"></div></div>
        ${card(`<p class="question-text">${esc(question.questionText)}</p>`, 'question-card')}
        <div class="choices">${choices}</div>
        ${feedback}
        ${primaryAction}
      </main>`;

    document.querySelectorAll('.choice').forEach((el) => {
      el.onclick = () => {
        if (session.answered) return;
        session.selectedChoice = Number(el.dataset.choice);
        saveSession(session);
        renderQuestionSession(session);
      };
    });

    const answerButton = document.getElementById('answer-button');
    if (answerButton) answerButton.onclick = () => submitAnswer(session, question);
    const retrySave = document.getElementById('retry-save');
    if (retrySave) retrySave.onclick = () => persistPendingAnswer(session);
    const nextButton = document.getElementById('next-button');
    if (nextButton) nextButton.onclick = () => goNext(session);
  }

  function submitAnswer(session, question) {
    if (session.answered || session.selectedChoice === null || saveInFlight) return;
    const answeredAt = Date.now();
    session.answered = true;
    session.historySaved = false;
    session.saveFailed = false;
    session.pendingEntry = {
      eventId: createEventId(),
      questionId: question.id,
      answeredAt: new Date(answeredAt).toISOString(),
      selectedChoice: session.selectedChoice,
      isCorrect: session.selectedChoice === question.correctChoiceIndex,
      studyMode: session.studyMode,
      answerTimeMs: Math.max(0, answeredAt - (session.questionStartedAt || answeredAt)),
    };
    saveSession(session);
    renderQuestionSession(session);
    persistPendingAnswer(session);
  }

  async function persistPendingAnswer(session) {
    if (!session.pendingEntry || saveInFlight) return;
    saveInFlight = true;
    session.saveFailed = false;
    saveSession(session);
    renderQuestionSession(session);
    try {
      const entry = session.pendingEntry;
      await Storage.saveAnswerWithReviewState(entry);
      session.historySaved = true;
      session.saveFailed = false;
      session.pendingEntry = null;
      session.answeredCount += 1;
      if (entry.isCorrect) session.correctCount += 1;
      saveSession(session);
      announce('学習履歴を保存しました。');
    } catch (error) {
      console.error(error);
      session.saveFailed = true;
      session.historySaved = false;
      saveSession(session);
      announce('学習履歴を保存できませんでした。保存を再試行してください。');
    } finally {
      saveInFlight = false;
      renderQuestionSession(session);
    }
  }

  function goNext(session) {
    if (!session.answered || !session.historySaved || saveInFlight) return;
    if (session.currentIndex === session.questionIds.length - 1) {
      const params = {
        answered: String(session.answeredCount),
        correct: String(session.correctCount),
        mode: session.studyMode,
      };
      session.completed = true;
      saveSession(session);
      clearSession();
      navigate('/result', params, true);
      return;
    }
    session.currentIndex += 1;
    session.selectedChoice = null;
    session.answered = false;
    session.historySaved = false;
    session.saveFailed = false;
    session.pendingEntry = null;
    session.questionStartedAt = Date.now();
    saveSession(session);
    renderQuestionSession(session);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderResult(params) {
    const answered = Math.max(0, Number(params.get('answered')) || 0);
    const correct = Math.max(0, Math.min(answered, Number(params.get('correct')) || 0));
    const incorrect = answered - correct;
    const accuracy = answered === 0 ? 0 : Math.round((correct / answered) * 100);
    const mode = params.get('mode') || '通常演習';
    const title = mode === '不正解復習' ? '不正解復習の結果' : mode === '今日の復習' ? '今日の復習結果' : '通常演習結果';
    setHeader(title);
    app.innerHTML = `

        ${card(`<span class="muted-label">正答率</span><strong class="accuracy">${accuracy}%</strong><hr><div class="stats-grid"><div><strong>${answered}</strong><span>解答数</span></div><div><strong class="good">${correct}</strong><span>正解数</span></div><div><strong class="bad">${incorrect}</strong><span>不正解数</span></div></div>`, 'score-card')}

  }

      a.download = `itpassport-learning-data-${Logic.toLocalDateKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();

      console.error(error);
      showToast('バックアップを書き出せませんでした。', true);

  async function renderRoute() {
    const serial = ++renderSerial;
    const { path, params } = parseHash();
    window.scrollTo(0, 0);
    if (path === '/' || path === '/home') return renderHome(serial);
    if (path === '/practice-count') return renderPracticeCount(serial);
    if (path === '/practice') return renderPractice(serial, params);
    if (path === '/result') return renderResult(params);
    if (path === '/history') return renderHistory(serial);
    if (path === '/review-schedule') return renderReviewSchedule(serial);
    if (path === '/settings') return renderSettings(serial);
    if (path === '/privacy') return renderPrivacy();
    return renderNotFound();
  }

    installPromptEvent = event;

  });

  window.addEventListener('hashchange', renderRoute);
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) renderRoute();
  });

  async function boot() {
    try {
      if (!Array.isArray(QUESTIONS) || QUESTIONS.length !== 1500) throw new Error('問題データが1,500問ではありません。');
      await Storage.initializeDatabase();
      if (!location.hash) navigate('/', null, true);
      else renderRoute();
    } catch (error) {
      console.error(error);
      setHeader('', false);
      app.innerHTML = `<main class="screen centered">${statusCard('サービスを開始できませんでした', 'ブラウザの保存機能を確認して、ページを再読み込みしてください。', 'error')}</main>`;
    }
  }

  boot();
})();

  </script>
</body>
</html>
