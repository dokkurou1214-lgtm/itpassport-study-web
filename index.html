x":3,"explanation":"性能ボトルネックを特定するには、利用者が感じる応答時間と、CPU（Central Processing Unit：中央処理装置）使用率、ディスクの待ち時間、通信遅延などを同じ時間軸で確認します。一つの指標だけで原因を決めず、処理経路に沿って比較します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"性能ボトルネック特定のための測定指標","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-copyright-license-scope-1151","questionText":"自社が写真家から、国内の製品カタログで1年間写真を利用する許諾を得た。写真を海外向けWeb広告でも利用したいとき、最初に確認すべきことはどれですか。","choices":["Web広告という利用方法、地域、期間が許諾範囲に含まれるかを確認する","写真のファイル形式が同じなら、媒体や地域にかかわらず利用できると判断する","カタログへの利用を許諾されたので、関連会社への再許諾も含むと判断する","利用開始後に写真家へ連絡すれば、事前の許諾範囲を確認しなくてもよいと判断する"],"correctChoiceIndex":0,"explanation":"著作物の利用許諾では、対象著作物、利用方法、媒体、期間、地域、再許諾の可否など、契約で定めた範囲を確認します。ある媒体での利用許諾が、別媒体や別地域での利用まで当然に含むとは限りません。","category":"ストラテジ系","subcategory":"法務","topic":"著作物ライセンスの利用範囲","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-joint-development-background-ip-1152","questionText":"A社とB社が共同開発を始める。A社は既存の解析技術を提供し、共同開発では新しい制御技術を生み出す予定である。契約時の対応として最も適切なものはどれですか。","choices":["既存技術も新成果も全て共有とし、利用条件は開発終了後に決める","各社が以前から保有する知財と新たな成果を区別し、帰属や利用条件を契約で定める","共同開発の成果は法律上必ず半分ずつ共有になるため、帰属条項を設けない","技術を最初に説明した会社が全成果を取得すると定め、各社の貢献は確認しない"],"correctChoiceIndex":1,"explanation":"共同開発では、各社が開発前から保有するバックグラウンドIP（Intellectual Property：知的財産）と、共同開発で生まれる成果を区別します。成果の帰属、利用範囲、第三者への許諾、改良成果などは、貢献や事業目的を踏まえて契約で定めます。","category":"ストラテジ系","subcategory":"法務","topic":"共同開発における既存知財と新成果","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-trade-secret-offboarding-1153","questionText":"機密性の高い製造ノウハウを扱っていた従業員が別部門へ異動する。営業秘密の管理を継続する対応として最も適切なものはどれですか。","choices":["異動後も過去業務の参照に備え、全てのアクセス権を無期限に残す","秘密保持義務の確認だけを行い、貸与物や保存先は本人の判断に任せる","不要となるアクセス権を停止し、貸与物・資料の返却や持出し状況を確認して必要な記録を残す","異動前の操作ログを削除し、過去の利用状況を確認できないようにする"],"correctChoiceIndex":2,"explanation":"営業秘密を管理するには、異動や退職に合わせて不要なアクセス権を止め、貸与物や資料の返却、持出しの有無、必要なログを確認します。秘密保持義務を周知するだけでなく、情報へアクセスできる範囲を実際の業務に合わせることが重要です。","category":"ストラテジ系","subcategory":"法務","topic":"退職・異動時の営業秘密管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-patent-clearance-before-launch-1154","questionText":"新製品の発売前に、採用した技術が他社の有効な特許権に抵触するリスクを調べたい。対応として最も適切なものはどれですか。","choices":["自社の特許出願が受理されたことだけを確認し、他社の権利は調べない","似た製品の広告だけを検索し、特許請求の範囲や権利の状態は確認しない","出願前の先行技術調査を行えば、他社特許への抵触もないと判断する","対象国・製品機能を明確にして関連特許と権利状態を調べ、必要に応じて専門家へ確認する"],"correctChoiceIndex":3,"explanation":"先行技術調査は主に発明の新規性や進歩性を検討するための調査です。製品化前の抵触確認では、対象国における他社特許の請求範囲や権利状態も確認します。検索はリスクを下げる手段であり、無侵害を保証するものではありません。","category":"ストラテジ系","subcategory":"法務","topic":"製品化前の特許調査","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-trademark-license-quality-control-1155","questionText":"飲料メーカーが自社商標を提携先の商品に使用させる。ブランド上の行き違いを防ぐ契約条件として最も適切なものはどれですか。","choices":["許諾する商標と商品、地域、期間、表示方法、品質基準や確認方法を定める","商標名だけを伝え、どの商品や地域で使うかは提携先へ全面的に任せる","使用料だけを決めれば、表示方法や品質に関する条件は定めなくてもよい","全ての商標ライセンスに法律上同一の検査方法が定められているとして、その方法だけを記載する"],"correctChoiceIndex":0,"explanation":"商標の利用許諾では、対象商標、指定商品・役務、地域、期間、使用方法などを契約で明確にします。ブランド価値を守るため、品質基準や確認方法を合意することもありますが、全ての契約に一律の品質管理方式が適用されるわけではありません。","category":"ストラテジ系","subcategory":"法務","topic":"商標利用許諾と品質管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-personal-data-outsourcing-boundary-1156","questionText":"通販会社が、商品の配送という特定済みの利用目的を達成するため、住所データを配送会社へ渡す。配送会社は配送以外にデータを使わず、通販会社が必要かつ適切な監督を行う。この取扱いの説明として最も適切なものはどれですか。","choices":["会社の外へデータを渡すので、条件にかかわらず常に本人同意が必要な第三者提供である","利用目的の達成に必要な委託として扱い、委託先による独自利用を認めず適切に監督する","契約書で「委託」と呼べば、配送会社が広告へ独自利用しても第三者提供にはならない","配送会社へ渡した後は、通販会社には取扱状況を確認する責任がなくなる"],"correctChoiceIndex":1,"explanation":"利用目的の達成に必要な範囲で個人データの取扱いを委託する場合、委託先は個人情報保護法上の第三者に該当しない扱いがあります。ただし、名称だけで決まるのではなく、委託先が独自利用せず、委託元が必要かつ適切な監督を行うことが重要です。","category":"ストラテジ系","subcategory":"法務","topic":"個人データの委託と第三者提供の区別","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-personal-data-third-party-records-1157","questionText":"適用除外に当たらない個人データを、本人同意に基づいて取引先へ第三者提供する。提供する側の会社が行う対応として最も適切なものはどれですか。","choices":["受領側だけに義務があるため、提供側は提供年月日や提供先を記録しない","受領側がデータを保管した後で、提供側の同意取得状況を受領側だけが記録する","本人同意など提供根拠を確認し、提供年月日、提供先など所定事項の記録を作成・保存する","全ての個人データの授受に例外なく同じ記録項目と保存期間が適用されるとして処理する"],"correctChoiceIndex":2,"explanation":"第三者提供では、提供側と受領側で求められる確認・記録を区別します。提供側は、適用されるルールに従い、本人同意などの提供根拠と、提供先や年月日などの事項を記録します。適用除外もあるため、全ての授受を一律に扱うものではありません。","category":"ストラテジ系","subcategory":"法務","topic":"第三者提供時の確認・記録","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-pseudonymized-data-internal-use-1158","questionText":"企業が顧客データから氏名などを分離して仮名加工情報を作り、自社内で購買傾向を分析する。取扱いとして最も適切なものはどれですか。","choices":["氏名を分離した時点で匿名加工情報となるので、安全管理措置は不要である","仮名加工したデータは個人情報ではなくなるため、外部企業へ自由に販売できる","分析担当者が必要なら、分離した情報と照合して本人を特定してよい","定めた利用目的の範囲で利用し、分離情報を適切に管理して本人を識別する行為を行わない"],"correctChoiceIndex":3,"explanation":"仮名加工情報は、他の情報と照合しない限り特定の個人を識別できないよう加工した情報で、匿名加工情報とは異なります。内部分析でも安全管理を行い、本人を識別する目的で他の情報と照合せず、第三者提供などの制限を守ります。","category":"ストラテジ系","subcategory":"法務","topic":"仮名加工情報の内部分析","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-location-log-purpose-change-1159","questionText":"配送状況の確認目的で取得し、従業員を識別できる位置情報ログを、新たに勤務評価へ利用したい。最初に行う判断として最も適切なものはどれですか。","choices":["当初示した利用目的との関連性を確認し、目的の変更や通知・公表、必要な同意などの対応を検討する","業務用端末の位置情報なので、当初の利用目的と無関係な目的にも自由に利用できると判断する","位置情報は常に個人情報ではないため、従業員を識別できても利用目的を確認しない","データを1か月保管した後なら、利用目的を変更せずに勤務評価へ利用できると判断する"],"correctChoiceIndex":0,"explanation":"位置情報ログは、他の情報と容易に照合して個人を識別できる場合、個人情報として扱う必要があります。利用目的を変えるときは、当初目的との合理的な関連性を確認し、変更後の目的の通知・公表や、状況に応じて必要な同意などを検討します。","category":"ストラテジ系","subcategory":"法務","topic":"位置情報ログの利用目的変更","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-electronic-contract-agreement-record-1160","questionText":"電子契約の内容について後日争いが生じ、双方が承認した最終文書を特定できない。再発防止として最も適切なものはどれですか。","choices":["契約本文を毎回上書きし、承認前の版や操作履歴を残さない","申込みと承諾が一致した最終文書、承認者、日時、操作履歴を対応付けて保存する","特定形式のログがない電子契約は全て無効であるとして、合意内容を確認しない","承認者名だけを記録し、どの版の文書に承諾したかは保存しない"],"correctChoiceIndex":1,"explanation":"契約は申込みと承諾の内容が合致することが基本です。最終文書、承認者、日時、操作履歴などを対応付けると、後から合意内容を確認しやすくなります。特定形式のログの有無だけで契約の有効・無効が一律に決まるわけではありません。","category":"ストラテジ系","subcategory":"法務","topic":"電子契約の合意記録","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-cloud-contract-data-exit-1161","questionText":"クラウドサービスの契約終了後に、業務データを別サービスへ移行する予定である。契約前に確認する事項として最も適切なものはどれですか。","choices":["稼働中の画面色だけを確認し、終了時のデータ受渡しは契約後に考える","サービス名が同じならデータ形式も同じとみなし、移行試験を行わない","データの出力形式、取得期限、移行支援、終了後の保持・削除条件を確認する","月額料金だけを比較し、データを取り出せない場合の対応は利用部門へ任せる"],"correctChoiceIndex":2,"explanation":"クラウドサービスからの退出を考えるときは、データの出力形式、取得できる期間、移行支援、費用、契約終了後の保持や削除を確認します。契約前に出口条件を確認すると、ベンダーロックインや移行時の業務停止リスクを抑えられます。","category":"ストラテジ系","subcategory":"システム企画","topic":"クラウド契約終了時のデータ移行条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-software-license-cost-comparison-1162","questionText":"8人で1年間利用するソフトウェアを比較する。案Xは初期費用18万円と1人当たり月額1万5千円、案Yは5人分を含む年額60万円と追加1人当たり月額2万4千円である。税は考えないとき、年間費用の比較として正しいものはどれですか。","choices":["案Xは144万円、案Yは146万4千円で、案Xが2万4千円安い","案Xは162万円、案Yは132万円で、案Yが30万円安い","案Xは180万円、案Yは146万4千円で、案Yが33万6千円安い","案Xは162万円、案Yは146万4千円で、案Yが15万6千円安い"],"correctChoiceIndex":3,"explanation":"案Xは18万円＋1万5千円×8人×12か月＝162万円です。案Yは60万円＋2万4千円×追加3人×12か月＝146万4千円です。したがって、案Yが15万6千円安くなります。","category":"ストラテジ系","subcategory":"企業活動","topic":"ソフトウェアライセンス費用の比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-ai-training-data-rights-1163","questionText":"外部から収集した文章や画像を生成AIの学習データとして利用する計画がある。利用開始前の対応として最も適切なものはどれですか。","choices":["著作権、契約・利用規約、個人情報、営業秘密、データの取得経緯を確認する","AIの学習目的なら、入手方法や利用条件にかかわらず自由に利用できると判断する","有料で取得したデータなら、学習利用や再配布も全て許諾済みと判断する","公開Webサイトのデータなら、権利や利用規約の確認は不要と判断する"],"correctChoiceIndex":0,"explanation":"AI（Artificial Intelligence：人工知能）の学習データを使う前に、著作権だけでなく、契約や利用規約、個人情報、営業秘密、取得経緯を確認します。AI学習であることだけを理由に常に自由利用できるとも、常に違法であるとも一律には判断できません。","category":"ストラテジ系","subcategory":"法務","topic":"AI学習データの権利・利用条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-ai-service-contract-responsibility-1164","questionText":"顧客対応へ外部の生成AIサービスを導入する。誤った回答が顧客へ提示された場合に備えた契約・運用設計として最も適切なものはどれですか。","choices":["AI事業者が提供するサービスなので、利用企業には確認責任が一切ないと定める","提供者と利用企業の役割、確認手順、障害時の連絡、損害時の取扱いを契約と運用で明確にする","生成結果は常に正しいという前提で、利用用途や人による確認範囲を定めない","法律で全サービスに同一の責任割合が定められているとして、個別条件を確認しない"],"correctChoiceIndex":1,"explanation":"生成AI（Artificial Intelligence：人工知能）サービスの責任分界は、用途、当事者の役割、契約条件などによって異なります。提供者と利用企業の役割、出力確認、事故時の連絡や対応、損害時の取扱いを明確にし、単一の法律結論で一律に決めないことが重要です。","category":"ストラテジ系","subcategory":"法務","topic":"AIサービス契約の責任分界","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-open-standard-vendor-selection-1165","questionText":"複数ベンダーの製品を組み合わせ、将来も部品を交換しやすいシステムを選びたい。標準への対応を確認する判断として最も適切なものはどれですか。","choices":["ベンダー独自仕様だけに対応している製品ほど、他社製品と接続しやすいと判断する","標準名を広告に記載していれば、適合範囲や相互運用試験を確認しなくてもよいと判断する","公開された標準への適合範囲と、必要な他製品との相互運用実績を確認する","国際標準に対応していれば、性能や運用要件も自動的に満たすと判断する"],"correctChoiceIndex":2,"explanation":"オープンな標準への対応は、製品間の接続や将来の選択肢を広げる助けになります。ただし、標準への対応範囲や実装差があるため、必要な機能の適合範囲と相互運用性を確認します。標準対応だけで全ての要件が満たされるわけではありません。","category":"ストラテジ系","subcategory":"法務","topic":"オープン標準を用いたベンダー選定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-employee-device-monitoring-rule-1166","questionText":"会社貸与端末からの情報持出しを検知するため、操作ログの監視を始める。導入方法として最も適切なものはどれですか。","choices":["会社所有端末なので、目的や範囲を定めず私的な内容も含めて監視する","担当者なら誰でも全ログを閲覧できるようにし、利用記録を残さない","監視対象を広げるほど安全になるため、必要性を評価せず全操作を永久保存する","目的、対象範囲、責任者、閲覧権限、保存・利用ルールを定め、従業者へ周知する"],"correctChoiceIndex":3,"explanation":"端末監視では、情報セキュリティ上の目的と必要性を明確にし、対象範囲、責任者、閲覧権限、運用ルールを定めて従業者へ周知します。会社所有端末であっても、目的を外れた無制限な監視を前提にしてはいけません。","category":"ストラテジ系","subcategory":"法務","topic":"業務端末監視と社内ルール","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-contract-log-corroboration-1167","questionText":"委託先が「契約どおり毎月バックアップを確認した」と説明した。システム監査人が事実を確かめる方法として最も適切なものはどれですか。","choices":["契約条項、作業記録、システムログを照合し、必要に応じて担当者へ確認する","委託先責任者の口頭説明だけを監査証拠とし、記録との一致を確認しない","バックアップ製品のカタログだけを読み、実際の運用記録は調べない","契約書に確認作業が書かれているので、実施されたものとして監査を終了する"],"correctChoiceIndex":0,"explanation":"監査では、一つの説明だけに頼らず、契約上の要求、作業記録、システムログなど複数の証拠を照合します。記録間に差があれば、担当者への質問や追加証拠によって、実際の運用を確かめます。","category":"マネジメント系","subcategory":"システム監査","topic":"契約・記録・ログによる監査証拠の裏付け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-outsourced-service-audit-right-1168","questionText":"重要業務を外部サービスへ委託する。委託先の管理状況を後から確認できるようにする契約判断として最も適切なものはどれですか。","choices":["委託費が一定額以上なら法律上当然に無制限の立入権が得られるため、契約へ記載しない","報告内容、証明書の提示、質問や監査の方法・範囲・頻度をリスクに応じて契約で定める","委託先が秘密情報を扱う場合は、どのような確認もできないと契約で定める","監査権があれば委託元の日常的な管理は不要になるため、報告義務を設けない"],"correctChoiceIndex":1,"explanation":"委託先への監査や確認の方法は、法律上全て同じ形で当然に付与されるものではなく、契約で具体化する事項です。サービスの重要性やリスクに応じて、定期報告、第三者証明、質問、現地確認などの範囲と手順を定めます。","category":"マネジメント系","subcategory":"システム監査","topic":"委託サービスの監査権","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-contract-change-approval-1169","questionText":"システム開発中に、顧客から機能追加の要望が出た。契約変更管理として最も適切な対応はどれですか。","choices":["要望を受けた担当者の判断で実装し、費用や納期への影響は完成後に確認する","契約金額を変えなければ承認は不要とし、成果物の範囲だけを口頭で変更する","変更内容と費用・納期・品質への影響を評価し、権限者の承認後に契約や計画へ反映する","顧客からの要望は全て拒否し、変更の必要性や効果を評価しない"],"correctChoiceIndex":2,"explanation":"契約変更では、要求内容と、費用、納期、品質、責任分界への影響を確認します。合意した手順で権限者の承認を得て、契約書やプロジェクト計画などの関係文書を更新します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"契約変更の影響評価と承認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-sla-service-credit-calc-1170","questionText":"月額利用料80万円のサービスで、月間稼働率が99.90%未満なら月額利用料の10%をサービスクレジットとするSLAを契約した。ある月の稼働率が99.80%だったとき、クレジット額はいくらですか。端数処理は不要とする。","choices":["8千円","80万円","72万円","8万円"],"correctChoiceIndex":3,"explanation":"稼働率99.80%は基準の99.90%を下回るため、80万円×10%＝8万円です。SLA（Service Level Agreement：サービスレベル合意書）では、基準値だけでなく、未達時のクレジットの計算方法や反映方法も確認します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"SLA未達時のサービスクレジット計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-license-inventory-reconciliation-1171","questionText":"ソフトウェア監査で、購入済みライセンス台帳は100本だが、端末の検出結果は112件だった。最初の対応として最も適切なものはどれですか。","choices":["購入記録、割当て、実際のインストール、利用条件を照合し、差異の原因を特定する","検出数が多いので、端末12台を利用者へ確認せず直ちに初期化する","台帳の数値を112本へ書き換え、追加購入や重複検出の可能性を調べない","ライセンス台帳だけを正しいものとし、端末側の検出結果を全て無視する"],"correctChoiceIndex":0,"explanation":"ライセンス管理では、購入した権利、利用者や端末への割当て、実際のインストール状況、製品ごとの利用条件を照合します。差異は未登録の導入、廃止漏れ、重複検出などでも起こるため、原因を確認してから是正します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ライセンス台帳と利用実態の照合","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-software-asset-offboarding-1172","questionText":"従業員が退職する際、本人専用に割り当てた有償クラウドソフトウェアのライセンスを管理する対応として最も適切なものはどれですか。","choices":["退職後も同じアカウントを残し、後任者が共通で使えるようにする","アカウントを停止し、ライセンス割当てを回収して台帳を更新する","端末を返却すればクラウド側の権限も自動で消えるとみなし、確認しない","利用者名だけを後任者へ変更し、退職者の認証情報をそのまま引き継ぐ"],"correctChoiceIndex":1,"explanation":"退職や異動では、不要となるアカウントを停止し、割り当てたライセンスを回収して資産台帳へ反映します。端末の返却とクラウドサービスのアカウント停止は別の管理対象です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"退職時のソフトウェア資産回収","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-evidence-retention-legal-hold-1173","questionText":"通常は90日で削除する操作ログの一部が、進行中の監査で必要になった。記録管理の対応として最も適切なものはどれですか。","choices":["通常の削除規則を変えず、監査中でも90日を過ぎたログを自動削除する","将来必要になる可能性を考え、全ログを対象や期限を決めず永久保存する","監査に必要な対象と範囲を特定し、通常の削除を一時停止して完全性を保ちながら保全する","対象ログを担当者の個人端末へコピーし、正式な保管場所から削除する"],"correctChoiceIndex":2,"explanation":"監査や係争で必要な記録は、対象と範囲を特定し、通常の削除を一時停止して保全します。保全中はアクセスや変更を管理し、完全性を維持します。全記録を一律に永久保存するのではなく、必要性や規程に沿って管理します。","category":"マネジメント系","subcategory":"システム監査","topic":"監査・係争時の記録保全","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-log-chain-of-custody-1174","questionText":"不正アクセス調査で収集したログを監査証拠として扱う。単なるログ保存と比べ、証拠の取扱記録を残す対応として最も適切なものはどれですか。","choices":["ログの内容だけを保存し、誰がいつ取得・受渡ししたかは記録しない","調査担当者が各自で編集し、編集前の原本や変更履歴は残さない","ファイル名を統一すれば十分なので、保管場所やアクセス者は管理しない","取得日時、取得者、保管場所、受渡し、ハッシュ値などを記録して取扱経路を追跡できるようにする"],"correctChoiceIndex":3,"explanation":"証拠としての信頼性を保つには、ログの内容だけでなく、誰がいつ取得し、どこに保管し、誰へ引き渡したかを追跡できるようにします。ハッシュ値などで改変の有無を確認できるようにすることも有効です。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証拠の取扱記録","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-compliance-incident-corrective-action-1175","questionText":"社内システムで承認手順を省略する運用が繰り返されていることが判明した。是正対応として最も適切なものはどれですか。","choices":["影響範囲と原因を調べ、暫定措置と恒久対策を決め、実施後の有効性を確認する","担当者だけを注意し、手順が省略された原因や統制の弱点は調べない","問題となった記録を削除し、再発した場合だけ正式な対応を行う","承認手順を廃止して、現状の運用を規程上も正しいものとして扱う"],"correctChoiceIndex":0,"explanation":"コンプライアンス上の問題が見つかったら、影響を抑える暫定措置を行い、原因を分析して恒久的な是正策を実施します。その後、同じ問題が再発していないか、対策が有効かを確認します。","category":"マネジメント系","subcategory":"システム監査","topic":"コンプライアンス違反時の是正措置","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-risk-acceptance-approval-record-1176","questionText":"重要システムの脆弱性について、直ちに修正すると業務停止が発生するため、期限を定めてリスクを受容する案が出た。判断記録として最も適切なものはどれですか。","choices":["担当者名だけを記録し、対象リスクや期限は口頭で共有する","リスク内容、影響、代替統制、受容期限、見直し条件を示し、権限者の承認を記録する","一度受容したリスクは状況が変わっても見直さないと記録する","修正費用だけを記録し、情報資産への影響や残留リスクを記載しない"],"correctChoiceIndex":1,"explanation":"リスク受容では、対象とするリスク、想定影響、残留リスク、代替統制、期限、見直し条件を明確にします。組織の基準に従って権限者が承認し、後から判断根拠を追跡できるように記録します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク受容の承認記録","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-subcontractor-control-1177","questionText":"顧客の個人データを扱う業務の一部を、委託先が別会社へ再委託したいと申し出た。委託元の対応として最も適切なものはどれですか。","choices":["再委託先の社名だけを確認し、業務内容や個人データの取扱方法は確認しない","再委託後は元の委託先だけに責任があるため、委託元は管理を終了する","再委託先、業務範囲、データの取扱方法、報告・承認条件を確認し、必要な監督を続ける","再委託という名称で契約すれば、個人データの管理条件を定めなくてもよい"],"correctChoiceIndex":2,"explanation":"個人データを扱う業務の再委託では、再委託先、業務範囲、取扱方法、事故時の報告などを確認し、契約や規程に応じて承認・監督します。再委託によって委託元の管理責任が当然になくなるわけではありません。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"個人データを扱う再委託先の管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-electronic-signature-verification-1178","questionText":"電子署名付き文書を受け取った。署名の技術的な検証で確認できる内容として最も適切なものはどれですか。","choices":["文書に書かれた事実が全て真実であること","署名者が契約を締結する社内権限を必ず持つこと","署名が行われた正確な時刻を電子署名だけで証明できること","証明書などで署名者に対応する鍵を確認し、署名後に文書が改変されていないこと"],"correctChoiceIndex":3,"explanation":"電子署名は、署名値を公開鍵で検証し、証明書などで鍵と署名者の対応を確認することで、署名後の改変検知や本人性の確認に役立ちます。ただし、文書内容の真実性、社内権限、正確な署名時刻まで自動的に証明するものではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"電子署名の検証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-trusted-timestamp-evidence-1179","questionText":"電子データに付与するタイムスタンプの主な役割はどれですか。","choices":["ある時刻にデータが存在し、その後に改変されていないことを確認しやすくする","文書を作成した本人の身元と契約権限を単独で証明する","電子署名の秘密鍵を安全に保管し、署名者以外の利用を防ぐ","文書に記載された内容が事実であることを第三者が保証する"],"correctChoiceIndex":0,"explanation":"信頼できるタイムスタンプは、その時刻にデータが存在したことと、その後に改変されていないことを確認するために使われます。作成者本人の証明を主目的とする電子署名とは役割が異なり、互いを完全に代替するものではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"タイムスタンプによる存在・完全性確認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-signature-private-key-protection-1180","questionText":"電子署名に使う秘密鍵を担当者のPC内の通常ファイルとして共有していたところ、誰が署名したか分からなくなった。改善策として最も適切なものはどれですか。","choices":["秘密鍵をメールで関係者へ配り、署名作業を分担する","秘密鍵を安全な装置や保護領域で管理し、利用者認証と利用記録を設ける","秘密鍵と公開鍵を同じ共有フォルダーへ置き、どちらも自由にコピーできるようにする","署名済み文書があれば十分なので、秘密鍵の失効や更新を管理しない"],"correctChoiceIndex":1,"explanation":"署名用の秘密鍵が他人に使われると、署名者を信頼できなくなります。秘密鍵を安全な装置や保護領域で管理し、利用者認証、アクセス制御、利用記録、必要に応じた失効・更新を行います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"電子署名用秘密鍵の保護","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-append-only-audit-log-1181","questionText":"管理者が自分の不正操作を隠すため、監査ログを後から削除できる設定になっていた。改善策として最も適切なものはどれですか。","choices":["ログを管理対象サーバだけに保存し、その管理者へ削除権限も与える","ログ容量を小さくして頻繁に上書きし、不正操作を残りにくくする","追記を基本とする保管先へ転送し、変更・削除権限を制限して改変を検知する","ログの時刻を表示しなければ、管理者による削除を防げると考える"],"correctChoiceIndex":2,"explanation":"監査ログの改変を防ぐには、対象システムの管理者が容易に変更・削除できない保管先へ転送し、追記を基本とする方式やアクセス制御を使います。ハッシュなどで改変を検知できるようにすることも有効です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"追記型監査ログによる改変防止","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-central-log-time-synchronization-1182","questionText":"複数サーバのログを中央で突き合わせて障害の順序を調べたい。各サーバに必要な対策として最も適切なものはどれですか。","choices":["サーバごとに異なる時刻帯を使い、ログ取得後に担当者が推測する","ログの時刻欄を削除し、記録された順番だけで判断する","障害調査時だけ時計を合わせ、過去ログの時刻はそのままにする","信頼できる時刻源へ同期し、時刻帯などの記録形式もそろえる"],"correctChoiceIndex":3,"explanation":"複数システムの出来事を関連付けるには、各機器の時計を信頼できる時刻源へ同期します。時刻帯や精度を含む記録形式もそろえると、ログを時系列で比較しやすくなります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"集中ログ分析のための時刻同期","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-audit-log-access-separation-1183","questionText":"業務データベースの管理者が、監査ログの閲覧・削除権限も単独で持っている。内部不正の検知力を高める対応として最も適切なものはどれですか。","choices":["業務管理と監査ログ管理の権限を分け、ログ閲覧や削除も承認・記録の対象にする","データベース管理者の作業効率を優先し、全てのログ権限を引き続き単独で与える","監査ログを取得せず、管理者本人の自己申告だけで操作を確認する","管理者パスワードを監査担当者と共有し、同じアカウントで操作する"],"correctChoiceIndex":0,"explanation":"業務システムの管理権限と、その操作を監視するログの管理権限を分離すると、自分の操作記録を隠すリスクを下げられます。ログへの重要操作にも承認や記録を設け、職務分掌を保ちます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"監査ログ管理の権限分離","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cryptographic-erasure-1184","questionText":"暗号化して保存したデータを読み出せなくするため、対応する暗号鍵を安全に破棄する消去方法を何といいますか。","choices":["データマスキング","暗号学的消去","差分バックアップ","電子署名"],"correctChoiceIndex":1,"explanation":"暗号学的消去は、適切に暗号化されたデータに対応する鍵を安全に破棄し、データを復号できなくする方法です。媒体やデータの状態によっては上書きや物理破壊など別の方法が適するため、唯一の消去方法ではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"暗号学的消去","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-outsourced-data-deletion-verification-1185","questionText":"個人データを扱う外部サービスの利用を終了する。委託先によるデータ削除を確認する方法として最も適切なものはどれですか。","choices":["契約終了日だけを確認し、委託先が保持する複製やバックアップは対象外とする","全データを例外なく即日削除させ、法令上の保存義務や復旧用バックアップを考慮しない","対象データと複製・バックアップ、保存義務、削除期限・方法を契約に沿って確認し、実施報告を受ける","画面から検索できなければ削除済みとみなし、保管領域や削除記録は確認しない"],"correctChoiceIndex":2,"explanation":"委託終了時は、削除対象となる本体データ、複製、バックアップを整理し、法令上の保存義務や契約条件も確認します。削除期限や方法、バックアップからの消去時期を定め、実施報告などで確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"委託終了時のデータ削除確認","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-backup-retention-deletion-policy-1186","questionText":"業務データ本体は保存期限を過ぎて削除されたが、長期保管するバックアップから復元すると再び現れることが分かった。改善策として最も適切なものはどれですか。","choices":["本体データだけを削除し、バックアップの保存期間や復元後の処理は定めない","バックアップを永久保存し、保存目的を失ったデータも全て残す","削除要求のたびに全バックアップ媒体を直ちに物理破壊する方式だけを採用する","バックアップの保持期間と循環、復元時の再削除手順をデータの保存方針へ組み込む"],"correctChoiceIndex":3,"explanation":"バックアップは一定期間保護する必要がある一方、不要なデータを無期限に残さない管理も必要です。保持期間、世代の循環、復元後に期限切れデータを再び削除する手順を一体として定めます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"バックアップを含む保持・削除方針","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-dlp-policy-application-1187","questionText":"設計図の社外持出しを防ぐためDLPを導入する。運用として最も適切なものはどれですか。","choices":["機密区分と持出し経路ごとのルールを定め、検知・遮断・例外承認を業務に合わせて設定する","全てのファイルを同じ条件で遮断し、正当な業務上の例外を扱わない","ファイル名だけで機密性を判断し、内容や送信先は確認しない","DLPを導入すれば教育やアクセス制御は不要になると考える"],"correctChoiceIndex":0,"explanation":"DLP（Data Loss Prevention：情報漏えい防止）は、機密情報の識別と、メール、Web、外部媒体などの経路に応じた制御に使います。誤検知や正当な利用もあるため、例外承認や記録を含め、他の統制と組み合わせて運用します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"DLPポリシーの業務適用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-production-data-masking-1188","questionText":"テスト環境へ本番の顧客データをコピーしたところ、開発者が実在顧客の氏名と電話番号を閲覧できた。改善策として最も適切なものはどれですか。","choices":["テスト環境の名称を変更し、本番データの内容はそのまま使う","テスト目的に必要な関係を保ちながら、氏名や電話番号を架空値へ置換・マスキングする","開発者へ秘密保持を求めれば、本番データへのアクセス制御は不要とする","データを圧縮すれば内容を読めなくなるとして、そのまま配布する"],"correctChoiceIndex":1,"explanation":"テストで実在する個人データが不要なら、項目を削除したり架空値へ置換したりして、必要なデータ構造だけを残します。マスキングだけに頼らず、利用目的、アクセス権、持出し制御も確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"テスト環境における本番データのマスキング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-personal-data-access-monitoring-1189","questionText":"個人データを扱うシステムで、権限を悪用した大量閲覧を早く検知したい。監視設計として最も適切なものはどれですか。","choices":["ログイン成功だけを記録し、失敗やデータ操作は記録しない","全事業者に同一のログ項目と保存期間が法定されているとして、業務リスクを評価しない","アクセスの成功・失敗、対象、操作内容を記録し、通常と異なる大量閲覧などを検知してログ自体も保護する","利用者名を記録せず、異常が見つかっても操作主体を追跡できないようにする"],"correctChoiceIndex":2,"explanation":"個人データへのアクセス監視では、成功・失敗、利用者、対象、操作内容など、リスクに応じたログを取り、異常な利用を検知します。ログへのアクセスや改変も制御します。必要な項目や保存期間は、全ての組織で一律ではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"個人データへのアクセス監視","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-consent-preference-propagation-1190","questionText":"顧客が広告配信への同意を撤回したが、連携先システムでは配信可のままになっていた。改善策として最も適切なものはどれですか。","choices":["連携先は別システムなので、同意状態の更新対象から外す","月末に件数だけ照合し、個々の顧客の拒否状態は反映しない","同意取得時だけ連携し、撤回や停止要求は各システムで手入力に任せる","同意・拒否・停止要求を一元的に管理し、対象処理や連携先へ確実に反映して結果を確認する"],"correctChoiceIndex":3,"explanation":"本人の同意、拒否、停止要求は、実際に利用する処理や連携先へ正しく反映する必要があります。特定の同期方式が一律に法定されているという問題ではなく、状態の一貫性を保ち、反映漏れを検知するシステム統制が重要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"同意・拒否状態のシステム反映","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-pseudonym-mapping-separation-1191","questionText":"顧客IDをランダムな管理番号へ置き換えた仮名データを分析する。管理番号と元の顧客IDを対応付ける表の管理として最も適切なものはどれですか。","choices":["対応表を分析データと分け、必要な担当者だけが利用できるよう権限と利用記録を管理する","対応表は常に破棄することが法定されているので、業務上の必要性にかかわらず直ちに削除する","対応表があっても仮名データは完全匿名なので、全従業員が自由に利用できるようにする","同じフォルダーに同じ権限で保存しても、ファイル名が異なれば十分に分離したとみなす"],"correctChoiceIndex":0,"explanation":"仮名データと本人を結び付ける対応表は、識別に使える重要な情報です。分析データと分け、必要な担当者に権限を限定し、利用を記録して漏えいを防ぎます。特定の物理分離方式や対応表の一律破棄だけが唯一の方法ではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"仮名データと対応表の分離管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-reidentification-risk-test-1192","questionText":"氏名を削除した分析データについて、別データとの照合で本人が推測できる可能性が指摘された。再識別リスクを評価する対応として最も適切なものはどれですか。","choices":["氏名がなければリスクは0と判断し、他の項目や外部データを確認しない","地域・日時など識別性の高い項目、項目の組合せ、外部データとの照合可能性、対応表の管理を確認する","「再識別リスクテスト」という単一の法定試験だけを実施すれば、他の評価は不要とする","データの行数だけを確認し、含まれる項目の希少性や組合せを評価しない"],"correctChoiceIndex":1,"explanation":"再識別の可能性は、氏名の有無だけでなく、地域、日時、属性など識別性の高い項目、その組合せ、他データとの照合可能性、対応表の管理状況で変わります。仮名加工によってリスクが自動的に0になるわけではなく、単一の法定試験だけで判断するものでもありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"仮名データの再識別リスク評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-sbom-license-inventory-1193","questionText":"ソフトウェア製品に含まれるOSSの名称、版、ライセンスを一覧化して管理する資料はどれですか。","choices":["WBS","SLA","SBOM","RTO"],"correctChoiceIndex":2,"explanation":"SBOM（Software Bill of Materials：ソフトウェア部品表）は、製品を構成するソフトウェア部品と版などを一覧化するものです。OSS（Open Source Software：オープンソースソフトウェア）のライセンス確認や脆弱性の影響調査にも役立ちます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"SBOMによるOSS構成・ライセンス把握","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-transitive-license-check-1194","questionText":"開発チームが直接追加したOSSのライセンスだけを確認したが、そのOSSが内部で利用する別の部品について指摘を受けた。改善策として最も適切なものはどれですか。","choices":["直接追加した部品だけが製品へ含まれるため、依存先の確認は不要とする","依存先は全て同じライセンスになるとみなし、個別の条件を確認しない","最上位の部品名だけを記録し、版や依存関係は更新のたびに破棄する","直接依存する部品だけでなく、その部品が依存する部品もたどってライセンス条件を確認する"],"correctChoiceIndex":3,"explanation":"OSSは、直接利用する部品がさらに別の部品へ依存することがあります。この推移的な依存関係も製品へ含まれ得るため、部品表や依存関係を使って対象を把握し、それぞれのライセンス条件を確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"推移的依存関係のライセンス確認","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-license-scan-ci-gate-1195","questionText":"開発者が新しいライブラリを追加した後、出荷直前に利用禁止ライセンスが見つかることが続いた。改善策として最も適切なものはどれですか。","choices":["CIで依存部品とライセンスを検査し、組織の基準に反する変更を早い段階で止める","出荷後に利用者から指摘された場合だけライセンスを確認する","ライブラリ名に「free」が含まれていれば利用条件を確認せず承認する","開発者の記憶だけで判定し、検査結果や承認の記録を残さない"],"correctChoiceIndex":0,"explanation":"CI（Continuous Integration：継続的インテグレーション）の工程で依存部品とライセンスを検査すると、基準に合わない追加を早く発見できます。検査結果を人が確認する手順や例外承認も組み合わせ、ツールだけに最終判断を任せないことが重要です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"CIによるライセンス検査ゲート","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-standard-interface-effort-calc-1196","questionText":"8システムを個別接続すると、接続部1本当たり12人日で8本、合計96人日かかる。共通の標準インタフェースを使うと、共通基盤20人日と各システム4人日ずつで済む。工数削減率は何%ですか。小数第2位を四捨五入して小数第1位まで求める。","choices":["約36.7%","約45.8%","約54.2%","約83.3%"],"correctChoiceIndex":1,"explanation":"標準インタフェース利用時は20＋4×8＝52人日です。削減工数は96－52＝44人日なので、削減率は44÷96×100＝45.833…%です。小数第2位を四捨五入して約45.8%となります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"標準インタフェースによる工数削減率","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-conformance-interoperability-test-1197","questionText":"製品が規格で定めた個別要件に合うかを確かめる試験と、他社製品と実際に接続できるかを確かめる試験の組合せはどれですか。","choices":["負荷試験と回帰試験","受入れ試験と単体試験","適合性試験と相互運用性試験","ホワイトボックステストとブラックボックステスト"],"correctChoiceIndex":2,"explanation":"適合性試験は、製品が規格や仕様の要件に合っているかを確認します。相互運用性試験は、異なる製品やシステムを実際に組み合わせて正しく連携できるかを確認します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"適合性試験と相互運用性試験","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-open-data-format-portability-1198","questionText":"長期間保存する業務文書を、将来別製品へ移行しやすくしたい。独自形式と公開仕様のデータ形式の比較として最も適切なものはどれですか。","choices":["独自形式なら仕様が非公開でも、全ての製品が同じ方法で読み書きできる","公開仕様の形式を選べば、変換時の情報欠落や機能差は必ず発生しない","データ形式より製品名だけを統一すれば、将来の移行可能性を確認する必要はない","公開仕様の形式は複数製品で扱える可能性を高めるが、必要な項目や機能の保持は移行試験で確認する"],"correctChoiceIndex":3,"explanation":"公開されたデータ形式は、特定製品だけに依存するリスクを下げ、可搬性を高める助けになります。ただし、製品ごとの実装差や独自機能があるため、必要な項目、書式、機能が保たれるかを実データで確認します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"オープンデータ形式による可搬性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-api-schema-version-governance-1199","questionText":"複数部門が利用するAPIで、応答項目を予告なく削除したため利用側システムが停止した。再発防止として最も適切なものはどれですか。","choices":["全ての変更を禁止し、脆弱性修正を含めAPIを更新しない","利用側へ連絡せず同じ版を上書きし、障害時にだけ元へ戻す","互換性を壊す変更は版を分け、変更内容・移行期間・廃止予定を利用者へ示す","API利用者ごとに異なる項目名へ変更し、共通仕様を設けない"],"correctChoiceIndex":2,"explanation":"API（Application Programming Interface：アプリケーションプログラミングインタフェース）の互換性を壊す変更では、版を分け、変更内容、移行方法、旧版の提供期間や廃止予定を共有します。利用者が計画的に移行できる統制が必要です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"APIスキーマの版管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-ai-input-output-audit-trail-1200","questionText":"社内の生成AIが作成した回答を担当者が顧客へ送信する業務で、後日「なぜこの回答になったか」を調査できなかった。改善策として最も適切なものはどれですか。","choices":["生成AIの出力だけを保存し、入力、モデル版、担当者の確認は記録しない","入力内容を全て無期限保存し、個人情報や機密情報の保存リスクは評価しない","担当者名だけを記録し、どの出力を確認・修正したかは残さない","目的とリスクに応じて入力・出力、モデルや設定の版、人の確認・修正を対応付けて記録する"],"correctChoiceIndex":3,"explanation":"AI（Artificial Intelligence：人工知能）の利用を追跡するには、必要な範囲で入力・出力、使用したモデルや設定、人による確認・修正を対応付けます。保存対象や期間は用途、契約、個人情報・機密情報のリスクに応じて定め、一律に無期限保存するものではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"AI入出力の監査証跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」・関係省庁公式資料準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-development-method-changeability-1201","questionText":"新サービスは利用者の反応によって要件が頻繁に変わる見込みで、利用部門が短い間隔で評価に参加できる。開発方式の選択として最も適切なものはどれですか。","choices":["短い反復で動く成果を確認し、優先順位を見直しながら開発する","現時点の要件を詳細化し、完成時の受入テストでまとめて評価する","短い反復で実装するが、優先順位は初回計画から変更しない","画面の試作だけを繰り返し、業務処理の検証は最終工程で行う"],"correctChoiceIndex":0,"explanation":"要件が変わりやすく、利用者から継続的にフィードバックを得られる場合は、短い反復で価値を確認する開発が適します。開発方式は名称だけで選ばず、要件の安定性、関係者の参加可能性、品質や契約上の制約も踏まえて判断します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"要件変動に応じた開発方式選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-core-knowledge-insourcing-1202","questionText":"競争力の源泉となる需要予測機能の開発を外部企業へ委託する。短期の開発速度を確保しつつ、将来の改善能力を自社に残す対応として最も適切なものはどれですか。","choices":["設計判断を委託先だけに任せ、自社は完成品の受入れだけを行う","中核部分は自社担当者も設計・レビューへ参加し、判断根拠や運用知識を共同で文書化する","全機能を内製へ切り替え、外部の専門知識は利用しない","費用の低い委託先を選び、知識移転や契約終了時の引継ぎは後で検討する"],"correctChoiceIndex":1,"explanation":"外部の専門性を利用する場合でも、競争力に直結する知識を自社が理解し、将来改善できる状態を保つことが重要です。共同設計、レビュー、文書化、引継ぎ条件などを通じて、中核知識の過度な外部依存を抑えます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"内製・外部委託と中核知識保持","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-low-code-fit-gap-1203","questionText":"ローコード基盤で受注管理を構築する。標準機能で基本業務は対応できるが、独自の価格計算と外部機器連携には大幅な追加開発が必要である。判断として最も適切なものはどれですか。","choices":["標準機能に合う業務も含め、全てを個別開発へ切り替える","短期開発が可能なので、追加開発の難しさを評価せず全面採用する","標準機能との適合部分と差異を整理し、追加開発・連携・保守を含む全体の適合性を評価する","初期費用だけを比較し、将来の変更やデータ移行は評価対象外とする"],"correctChoiceIndex":2,"explanation":"Fit & Gapでは、製品や基盤の標準機能に業務が適合する部分と、追加対応が必要な差異を整理します。ローコードの開発速度だけでなく、複雑な追加開発、連携、保守、移行を含めて採否や適用範囲を決めます。","category":"ストラテジ系","subcategory":"システム企画","topic":"ローコードと複雑要件の適合評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-low-code-governance-1204","questionText":"各部門がローコードで業務アプリを作った結果、所有者不明のアプリ、過剰な権限、重複機能が増え、退職者のアプリを保守できなくなった。改善策として最も適切なものはどれですか。","choices":["新規作成だけを停止し、既存アプリの所有者や権限は確認しない","各部門の自由度を保つため、利用データと公開範囲の記録を任意にする","全アプリを情報システム部門が作り直し、部門利用者の改善参加をなくす","アプリ台帳、所有者、権限、公開審査、保守・廃止責任を定めて継続的に確認する"],"correctChoiceIndex":3,"explanation":"ローコード活用では、迅速さと同時にアプリの所有者、扱うデータ、アクセス権、公開手続、保守・廃止責任を管理します。中央部門が全てを開発する必要はありませんが、組織共通のガバナンスは必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"ローコードアプリ乱立への統制","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-no-code-citizen-development-control-1205","questionText":"営業部員がノーコードツールで顧客情報を扱う申請アプリを作る。公開前の対応として最も適切なものはどれですか。","choices":["利用者と編集者の権限、扱うデータ、承認者、運用責任者を確認する","作成部門内の利用に限定し、顧客情報の閲覧権限は公開後に確認する","公開対象だけを決め、編集権限と運用責任は作成者の判断に任せる","機能確認を優先し、データの保存先と問合せ窓口は利用開始後に決める"],"correctChoiceIndex":0,"explanation":"市民開発では、業務担当者が素早く改善できる一方、データ管理や権限制御が不十分になるリスクがあります。公開前に利用範囲、権限、承認、保守責任を確認し、組織のルールに沿って運用します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"市民開発の権限・公開管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-development-standard-tailoring-1206","questionText":"全社の開発標準は大規模システムを想定している。小規模な社内ツール開発へ適用するときの対応として最も適切なものはどれですか。","choices":["規模に合わないため、品質・セキュリティを含む全ての標準を適用外にする","必須の統制を保ち、規模やリスクに応じて工程・成果物を調整し、調整理由を承認・記録する","全項目を形式的に適用し、不要な成果物も同じ詳細度で作成する","担当者ごとに標準を変え、どの項目を省いたかは記録しない"],"correctChoiceIndex":1,"explanation":"テーラリングは、標準の目的を保ちながら、案件の規模やリスクに応じて工程や成果物を調整することです。必須事項、承認者、調整理由を明確にし、全適用と全無視の二択にしません。","category":"ストラテジ系","subcategory":"企業活動","topic":"開発標準の適用とテーラリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-quality-cost-balance-1207","questionText":"出荷後の障害対応費が増えている製品で、次期開発の品質費用を見直す。判断として最も適切なものはどれですか。","choices":["検査費用だけを増やし、欠陥を作り込む工程は変更しない","障害対応費を予算外とし、品質費用の評価から除外する","教育やレビューなどの予防費用と、検査・手直し・出荷後障害の費用を合わせて比較し、総費用を下げる施策を選ぶ","予防費用を減らせば短期費用が下がるため、出荷後の影響にかかわらず削減する"],"correctChoiceIndex":2,"explanation":"品質コストには、欠陥を防ぐ予防コスト、評価・検査コスト、出荷前後の失敗コストがあります。特定の費用だけを最小化せず、予防による障害減少も含めた総費用と事業影響で判断します。","category":"ストラテジ系","subcategory":"企業活動","topic":"予防コストと失敗コストの配分","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-agile-adoption-readiness-1208","questionText":"要件変化が多い新規サービスへアジャイル開発を導入する案がある。しかし、利用部門は月末だけ参加でき、優先順位を決める権限者も不明で、リリース審査には長い固定手続がある。最初の対応として最も適切なものはどれですか。","choices":["開発チームだけで優先順位を決め、利用部門の参加なしで開始する","アジャイルという名称を採用すれば手続も短くなるため、現状の役割を変えず開始する","全要件を完全固定できるまで開発を開始せず、利用者評価を完成後に限定する","継続的な利用者参加、意思決定権限、審査方法を整え、短い反復を回せるか確認する"],"correctChoiceIndex":3,"explanation":"アジャイル開発では、短い間隔のフィードバックと迅速な優先順位判断が重要です。要件変化の多さだけで採用を決めず、関係者の参加、権限、品質・リリース統制を反復に合わせられるかを確認します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"アジャイル導入条件の評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-dx-cross-functional-team-1209","questionText":"店舗の接客業務をデジタル化するプロジェクトで、技術的には動作する仕組みを作ったが、現場手順に合わず利用されなかった。次期体制として最も適切なものはどれですか。","choices":["業務部門、開発、運用、必要な専門部門が共通の成果目標を持つ部門横断チームにする","開発と運用の合同チームにするが、業務部門は完成後の受入れだけに参加する","業務部門と開発で企画するが、運用設計はリリース後に別チームが検討する","各部門が個別の目標で作業し、部門間の調整は定例報告会の担当者だけが行う"],"correctChoiceIndex":0,"explanation":"DX（Digital Transformation：デジタルトランスフォーメーション）では、技術導入だけでなく業務や価値提供の変革が必要です。業務部門、開発、運用などが共通目標を持ち、早期から協力する体制が適します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"DX開発の部門横断体制","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-build-buy-time-to-value-1210","questionText":"新しい予約サービスを6か月以内に開始したい。市販サービスは主要要件を満たすが一部業務の変更が必要で、内製なら全要件に対応できるが完成まで18か月かかる。判断として最も適切なものはどれですか。","choices":["初期費用が低い案だけを選び、開始時期や業務適合性は比較しない","事業価値を得られる時期、要件適合性、変更・連携費用、将来の保守性を比較する","全要件に完全一致しない製品は、業務を見直せる場合でも候補から除外する","内製なら要件を満たせるため、事業機会の時期にかかわらず内製を選ぶ"],"correctChoiceIndex":1,"explanation":"Build or Buyでは、費用だけでなくTime to Value（価値を得るまでの時間）、要件適合性、業務変更、連携、保守を比較します。市場機会を逃す影響と、長期的な制約の両方を考慮します。","category":"ストラテジ系","subcategory":"システム企画","topic":"内製・購入と提供時期の比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-prototype-learning-gate-1211","questionText":"新しい申請画面のプロトタイプを利用者に試してもらったところ、主要機能は使えたが、入力手順を誤る人が多かった。次の対応として最も適切なものはどれですか。","choices":["主要機能は動作したため本開発へ進み、操作の誤りは利用者研修だけで補う","誤操作を利用者の習熟不足と判断し、画面は変えずマニュアルだけを追加する","誤りが起きた手順と要求を見直し、画面を修正して再評価してから本開発の判断を行う","入力手順の評価を本開発後の受入テストへ移し、現在の評価結果は参考扱いにする"],"correctChoiceIndex":2,"explanation":"プロトタイプは、要求や使い方について早く学び、設計を改善するためにも使います。単に技術が動くかを確認するPoC（Proof of Concept：概念実証）とは異なり、利用者評価から要求や操作性を見直す教材価値を扱います。","category":"ストラテジ系","subcategory":"システム企画","topic":"プロトタイプ結果による次段階判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-development-productivity-measure-1212","questionText":"開発チームの生産性を継続評価する指標の考え方として最も適切なものはどれですか。","choices":["投入工数に対する実装完了件数を測り、受入れ前の手戻りは別の期間へ計上する","チームごとのストーリーポイント合計だけを比較し、見積基準の違いは調整しない","一人当たりのソースコード行数を測り、機能価値や重複コードは別に評価する","投入した工数に対する受入れ済み成果を測り、品質や手戻りも合わせて確認する"],"correctChoiceIndex":3,"explanation":"開発生産性は、投入した資源に対してどの程度の有効な成果を得たかという考え方です。件数や行数だけでは品質低下を見逃すため、受入れ状況、欠陥、手戻りなども合わせて確認します。","category":"ストラテジ系","subcategory":"企業活動","topic":"品質を考慮した開発生産性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-technical-debt-investment-priority-1213","questionText":"三つの技術的負債がある。Xは変更のたびに重要業務を停止させる危険があり、Yは保守工数が毎月増加し、Zは命名が不統一だが変更予定がない。改善順序を決める方法として最も適切なものはどれですか。","choices":["事業影響、発生可能性、将来の保守コスト、今後の変更予定を評価して優先順位を決める","修正工数が最も小さいZから着手し、完了件数を最大にする","作り込まれた時期が古い順に着手し、現在の利用状況は後で確認する","三つへ同じ工数を配分し、業務影響や変更予定による差は付けない"],"correctChoiceIndex":0,"explanation":"技術的負債は、短期的な選択によって将来の変更や保守に追加負担が生じる状態です。改善は、障害時の事業影響、発生可能性、継続コスト、変更頻度を評価し、効果の高いものから計画します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"技術的負債の改善優先順位","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-development-productivity-calc-1214","questionText":"チームが8人月で30機能を実装したが、そのうち6機能は重大な手戻りが必要で受入れ未完了である。品質調整後の生産性を「受入れ済み機能数÷人月」で求めるといくらですか。","choices":["2機能／人月","3機能／人月","3.75機能／人月","4.5機能／人月"],"correctChoiceIndex":1,"explanation":"受入れ済み機能数は30－6＝24機能です。品質調整後の生産性は24÷8＝3機能／人月です。実装件数をそのまま使う3.75では、重大な手戻りが残る成果を含めてしまいます。","category":"ストラテジ系","subcategory":"企業活動","topic":"品質調整後の開発生産性計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-software-reuse-investment-1215","questionText":"五つの業務システムで似た認証機能が必要になる。共通部品化と個別開発の比較として最も適切なものはどれですか。","choices":["初回の開発費だけを比較し、共通部品の変更時に五システムへ及ぶ影響は個別に扱う","各システムの自由度を優先して個別開発を選び、重複する保守費用は導入後に比較する","再利用回数、共通要件、連携方法、障害影響、保守責任を評価して共通部品化の効果を判断する","一部の要件差をなくしてから共通化し、版管理と保守責任は各システムへ分散する"],"correctChoiceIndex":2,"explanation":"共通部品化は重複開発を減らせますが、共通仕様、版管理、障害影響、保守責任の設計が必要です。再利用される範囲と長期的な保守費用を、各システムで個別開発する場合と比較します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"共通部品化と個別開発の比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-mlops-operating-model-1216","questionText":"需要予測モデルを本番利用する。開発部門はモデルを作成し、業務部門は予測を利用し、運用部門は稼働を監視する。予測精度が低下した場合も含めた責任分担として最も適切なものはどれですか。","choices":["開発部門が精度低下と再学習を判断し、業務影響の評価は更新後に利用部門が行う","運用部門が稼働と精度を監視し、再学習後の業務妥当性は開発部門だけで承認する","業務部門が精度目標と更新時期を決め、モデル版と展開作業は各担当が個別に管理する","精度・業務影響・稼働状況の監視担当、再学習判断、検証・承認、展開手順を部門間で定める"],"correctChoiceIndex":3,"explanation":"MLOps（Machine Learning Operations）は、モデルの開発、展開、監視、更新を継続的に管理する考え方です。技術的な稼働だけでなく、予測性能と業務影響を監視し、再学習や展開の責任と承認を明確にします。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"MLOpsの業務責任分担","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-review-checklist-risk-1217","questionText":"外部システムと連携する設計書をレビューする。特に重視する観点として最も適切なものはどれですか。","choices":["データ形式、認証、エラー応答、接続失敗時の処理が要件と一致するか","実装後のソースコードが命名規則に従っているかを中心に確認する","利用者画面の配色と文字サイズを中心に確認する","本番で最大負荷を発生させ、実測応答時間だけを確認する"],"correctChoiceIndex":0,"explanation":"レビューでは、成果物の種類とリスクに応じて観点を選びます。外部連携の設計書では、インタフェース、認証、異常時処理など、連携障害につながる項目を重点確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"成果物別レビュー観点の選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-defect-leakage-root-cause-1218","questionText":"受入テストで、要件の解釈違いによる欠陥が多数見つかった。件数を減らすための原因分析として最も適切なものはどれですか。","choices":["受入テストのケースを増やし、要件確認と設計レビューの進め方は維持する","要件確認と設計レビューで検出できなかった理由を調べ、観点・参加者・記録方法を改善する","設計工程の作業時間を増やし、解釈違いが起きた箇所の分析は次回へ回す","発見工程ごとの件数を比較し、欠陥を作り込んだ原因は修正担当者が個別に扱う"],"correctChoiceIndex":1,"explanation":"欠陥流出は、本来より早い工程で検出できた欠陥が後工程まで残ることです。発見件数だけでなく、作込み工程と見逃した工程を調べ、要件確認やレビューの観点を改善します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"欠陥流出の原因分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-test-completion-risk-1219","questionText":"予定したテストケースは全て実施済みだが、重要業務を停止させる欠陥が2件未解決で、修正後の回帰テストも未実施である。テスト完了判断として最も適切なものはどれですか。","choices":["実施率が100%なので、欠陥の重大度にかかわらず完了とする","未解決欠陥を次期案件へ移し、今回の出荷判断では扱わない","完了基準に照らして重大欠陥の解決と必要な再テストを行い、残存リスクを評価して判断する","テストケース数を減らして実施率を再計算し、完了条件を満たしたことにする"],"correctChoiceIndex":2,"explanation":"テストの完了は、実施率だけでなく、重大欠陥、再テスト、要求の網羅、残存リスクなどの完了基準で判断します。全ケースを実施していても、重大な未解決リスクがあれば完了とは限りません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"未解決欠陥を含むテスト完了判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-quality-metrics-trend-1220","questionText":"三回の反復で、レビュー指摘数は40件、25件、15件と減った一方、後工程への欠陥流出は2件、6件、11件、修正後の再オープン率は5%、12%、20%と増えた。判断として最も適切なものはどれですか。","choices":["レビュー指摘が減ったので、他の指標にかかわらず品質は向上した","流出欠陥は増えたが、指摘数が少ないほど開発速度が高いので改善不要とする","再オープン率だけを下げるため、未確認のまま欠陥を完了扱いにする","レビューでの検出力や修正品質が低下した可能性を調べ、観点・時間・確認手順を見直す"],"correctChoiceIndex":3,"explanation":"単一指標だけでは品質を判断できません。レビュー指摘の減少と同時に流出や再オープンが増えているため、欠陥が減ったのではなく検出・修正能力が落ちた可能性を分析します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"複数品質指標の傾向判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-requirement-test-coverage-1221","questionText":"要件とテスト項目の対応表を確認すると、パスワード再設定要件だけ対応するテスト項目が空欄だった。対応として最も適切なものはどれですか。","choices":["要件に対応する正常時・異常時のテストを設計し、対応表へ追加して確認する","パスワード関連の既存テスト件数を数え、再設定要件との対応は次回確認する","正常ログインのテストを関連付け、再設定固有の異常時確認は運用テストへ移す","空欄を残存リスクとして記録し、対応テストを作らず受入判定だけで扱う"],"correctChoiceIndex":0,"explanation":"トレーサビリティ表は、各要件が設計やテストで確認されることを追跡するために使います。対応がない要件には、要件内容に合ったテストを追加し、実施結果まで確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"要件とテストの対応漏れ検出","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-test-progress-calc-1222","questionText":"テスト計画で実施予定のテストケースは900件で、そのうち現在までに実施済みは720件である。テスト消化率を「実施済み件数÷予定件数×100」で求めると何%ですか。","choices":["75%","80%","90%","125%"],"correctChoiceIndex":1,"explanation":"テスト消化率は720÷900×100＝80%です。成功した件数の割合を表す成功率とは異なり、この問題では実施済みかどうかだけを数えます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"テスト消化率計算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-defect-reopen-priority-1223","questionText":"修正済みとして完了した欠陥が、確認テストで再び未解決へ戻される割合が急増した。最初の改善として最も適切なものはどれですか。","choices":["再オープンを新規欠陥として数え、元の修正工程との関係は集計対象外にする","修正担当者を増やし、再オープン理由の分析は件数が落ち着いてから行う","再オープン理由を分類し、原因理解、修正範囲、レビュー、再テストの不足を調べる","確認テストの担当を修正者本人へ統一し、第三者の確認観点は維持しない"],"correctChoiceIndex":2,"explanation":"再オープンの増加は、原因分析や修正範囲、レビュー、確認テストに問題がある可能性を示します。理由を分類して工程上の弱点を特定し、完了判定の質を改善します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"欠陥再オープン増加への対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-sprint-capacity-priority-1224","questionText":"次のスプリントで担当者が一人減り、全ての候補を実施できない。項目Xは顧客価値が高く他項目の前提、Yは価値が中程度で独立、Zは価値が低いが実装が容易である。優先順位の決め方として最も適切なものはどれですか。","choices":["短期間で完了できるZを先に選び、完了項目数を優先してXの依存関係は次回扱う","前回の優先順位を維持し、担当者減少分は各項目のテスト工数から均等に削る","担当者の得意分野に合う項目を選び、製品目標との整合はスプリント終了時に確認する","製品目標、顧客価値、依存関係、リスク、利用可能な能力を基に優先順位を見直す"],"correctChoiceIndex":3,"explanation":"バックログの優先順位は、価値だけでなく依存関係、リスク、製品目標、チーム能力も踏まえて更新します。実装しやすさだけで選ぶと、重要な価値や前提作業が遅れることがあります。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"能力低下時のバックログ優先順位","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-sprint-change-multi-condition-1225","questionText":"スプリント中に法令対応の緊急要望が届いた。対応期限はスプリント終了前で、未対応ならサービスを停止する必要がある。一方、追加すると現在のスプリントゴールへ影響する。対応として最も適切なものはどれですか。","choices":["プロダクトオーナーと緊急度・影響を確認し、スプリントゴールや作業範囲を透明に再調整する","スプリント中の変更は理由にかかわらず扱わず、期限後まで保留する","開発者が独断で追加し、他の作業やゴールへの影響は共有しない","既存の作業を全て破棄し、影響評価なしで緊急要望だけに切り替える"],"correctChoiceIndex":0,"explanation":"スプリント中でも重大で期限のある変更は、緊急度とスプリントゴールへの影響を関係者で評価します。プロダクトオーナーと作業範囲やゴールを調整し、変更内容を透明に共有します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"スプリント中の緊急変更判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-retrospective-action-followup-1226","questionText":"レトロスペクティブで「レビュー待ちが長い」という課題に対し、翌日までに一次確認する改善案を決めた。改善を継続させる対応として最も適切なものはどれですか。","choices":["改善案をチームへ共有し、担当者と効果の確認方法は実施時に決める","担当者、期限、確認指標を決め、次回の振り返りで実施状況と効果を確認する","レビュー依頼数だけを毎日記録し、一次確認までの時間は測定対象外にする","レビュー担当者を固定し、負荷の偏りと待ち時間の変化は次の課題として扱う"],"correctChoiceIndex":1,"explanation":"レトロスペクティブの改善事項は、具体的な行動、担当、期限、効果の確認方法まで決めると実行しやすくなります。次回に結果を確認し、必要なら方法を調整して継続的に改善します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"改善アクションの担当・期限・確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-cmmi-process-improvement-1227","questionText":"開発チームごとに手順が異なり、同じ種類の不具合が繰り返されている。CMMIを参考にした改善の進め方として最も適切なものはどれですか。","choices":["共通プロセスを一度定めた後は、実績を測定せず同じ手順を継続する","チームごとの実績は測定するが、共通のプロセスや改善目標は設けない","プロセスを定義・標準化し、実績を測定して弱点を改善する取組を段階的に進める","個人別の研修時間を増やし、組織の作業手順や測定方法は対象外とする"],"correctChoiceIndex":2,"explanation":"CMMI（Capability Maturity Model Integration：能力成熟度モデル統合）は、開発・保守プロセスの能力を評価し改善する考え方です。レベル番号の暗記ではなく、プロセスの標準化、測定、継続的改善へつなげることが重要です。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"CMMIによるプロセス改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-white-box-coverage-gap-1228","questionText":"条件分岐を含むプログラムのテスト結果を確認すると、全ての命令は一度以上実行されたが、条件が偽になる経路は一度も実行されていなかった。この結果から分かることはどれですか。","choices":["全ての条件の真偽を確認できた","外部仕様の全機能を確認できた","全ての入力値の組合せを確認できた","命令は実行されたが、分岐の確認には不足がある"],"correctChoiceIndex":3,"explanation":"ホワイトボックステストでは、プログラム内部の命令や分岐の実行状況を確認します。命令網羅を満たしても、条件の真偽や各分岐が全て実行されたとは限りません。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"未実行分岐の検出","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-decision-table-rule-gap-1229","questionText":"会員種別、購入金額、クーポン有無で割引を決めるデシジョンテーブルに、一般会員・1万円未満・クーポンありの組合せだけ規則がない。対応として最も適切なものはどれですか。","choices":["該当組合せの期待結果を確認し、規則とテストケースを追加する","一般会員の既存規則から結果を推定し、表には注記だけを追加する","クーポン有無を同じ条件としてまとめ、割引結果の差は実装工程で決める","最も近い組合せの規則を複製し、期待結果はテスト実施後に確定する"],"correctChoiceIndex":0,"explanation":"デシジョンテーブルは、複数条件と結果の組合せを規則として整理します。規則がない組合せは仕様漏れの可能性があるため、期待結果を確認し、規則とテストへ反映します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"デシジョンテーブルの規則漏れ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-state-transition-invalid-path-1230","questionText":"会員状態は「仮登録→本登録→退会」の順に変わり、退会から本登録へ直接戻る操作は許可されない。追加すべきテストとして最も適切なものはどれですか。","choices":["本登録から退会への正常遷移を追加し、禁止された逆方向の遷移は対象外にする","退会状態から本登録への操作を試し、拒否され状態が変わらないことを確認する","仮登録から本登録への遷移を入力値だけ変えて繰り返す","退会から仮登録へ新規登録する経路を確認し、退会から本登録への直接操作は確認しない"],"correctChoiceIndex":1,"explanation":"状態遷移テストでは、許可された遷移だけでなく、禁止された遷移が受け付けられないことも確認します。状態とイベントの組合せを整理し、遷移後の状態も検証します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"禁止状態遷移の試験","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-failed-test-trace-localization-1231","questionText":"受入テストで「承認済み申請だけ支払う」という要件のテストが失敗した。対応表では、この要件が設計D3、プログラムP2、テストT8へ関連付けられている。効率的な調査として最も適切なものはどれですか。","choices":["支払機能の全プログラムを同じ優先度で調べ、設計D3との対応は後で確認する","失敗したT8を別番号で再実行し、要件と設計の対応関係は変更しない","要件から対応する設計・プログラム・変更履歴をたどり、期待動作との差を確認する","直近に変更されたP2だけを原因と仮定し、要件や設計との整合確認を省く"],"correctChoiceIndex":2,"explanation":"要求トレーサビリティがあれば、失敗したテストから要件、設計、プログラム、変更へ関連をたどれます。候補を絞った上で、要件の解釈、設計、実装のどこに差があるかを確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"失敗テストから要求・設計への追跡","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-performance-load-test-difference-1232","questionText":"性能テストと負荷テストの使い分けとして最も適切なものはどれですか。","choices":["性能テストは障害後の復旧手順を確認し、負荷テストは画面の使いやすさを確認する","性能テストは低負荷時だけの機能正誤を確認し、負荷テストはバックアップからの復元を確認する","性能テストはソースの分岐網羅を確認し、負荷テストは利用者権限を確認する","性能テストは応答時間などの性能を測り、負荷テストは想定・高負荷時の振る舞いや限界を確認する"],"correctChoiceIndex":3,"explanation":"性能テストは、応答時間や処理量などが要求を満たすかを測ります。負荷テストは、想定する負荷や高い負荷を与えたときの性能、安定性、限界を確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"性能テストと負荷テストの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-nonfunctional-test-selection-1233","questionText":"「同時利用者500人のとき、検索操作の95%を2秒以内に完了する」という非機能要件を確認するテストとして最も適切なものはどれですか。","choices":["500人相当の負荷を再現し、検索応答時間の分布を測定する","500人分の利用者IDを登録し、一人ずつ順番に検索結果の正しさを確認する","一人の利用者で検索を繰り返し、平均応答時間だけを測定する","500人相当の負荷で最大応答時間だけを測定し、95%という割合は評価しない"],"correctChoiceIndex":0,"explanation":"この要件には同時利用者数、対象操作、応答時間、達成割合が含まれます。対応する負荷を作り、検索操作の応答時間を測定して、95%が2秒以内かを評価します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"非機能要件に対応する試験選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-test-environment-parity-1234","questionText":"テスト環境を本番環境に近づける主な目的として最も適切なものはどれですか。","choices":["本番データを加工せず全件複製し、データ量と内容を本番へ近づけるため","結果に影響する版、設定、接続条件などをそろえ、環境差による見逃しを減らすため","機器名とネットワーク名を本番と同じにし、構成差は記録しないため","テスト環境の結果を本番確認の代わりとし、移行後の確認を減らすため"],"correctChoiceIndex":1,"explanation":"テスト結果へ影響するソフトウェア版、設定、構成、接続先などの重要条件を本番に近づけると、環境差による障害を減らせます。規模や安全性の理由で完全に同一にできない場合は、差異を記録し影響を評価します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"テスト・本番環境差異の管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-environment-specific-defect-1235","questionText":"テスト環境では正常だが本番環境だけで帳票出力が失敗する。最初の切り分けとして最も適切なものはどれですか。","choices":["テストが成功したので、本番の失敗記録を確認せず利用者操作の誤りとする","帳票機能を作り直し、現在の版や設定は比較しない","アプリとライブラリの版、設定値、権限、接続先、対象データの差を対応付けて比較する","本番環境の設定を記録せずテスト環境へ順番にコピーする"],"correctChoiceIndex":2,"explanation":"一方の環境だけで起きる障害では、版、設定、権限、外部接続、データなどの差異が重要な手掛かりです。差を記録して一つずつ確認し、原因候補を絞り込みます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"環境依存障害の切り分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-defect-removal-efficiency-calc-1236","questionText":"リリース前のレビューとテストで欠陥を72件除去し、リリース後に8件の欠陥が見つかった。欠陥除去率を「リリース前に除去した件数÷リリース前後の欠陥総数×100」で求めると何%ですか。","choices":["10%","80%","88.9%","90%"],"correctChoiceIndex":3,"explanation":"欠陥総数は72＋8＝80件です。欠陥除去率は72÷80×100＝90%です。リリース後欠陥の割合10%や、72÷81などの誤った分母と混同しないようにします。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"欠陥除去率計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-test-data-boundary-privacy-1237","questionText":"年齢18歳以上を受け付ける顧客登録機能をテストする。本番の個人情報を使わず、境界条件も確認する方法として最も適切なものはどれですか。","choices":["架空の顧客データで17歳、18歳、19歳を用意し、必要なデータ関係も再現する","実在顧客の氏名と連絡先をそのままコピーし、閲覧権限を広げる","年齢を全て30歳へ置き換え、境界値の確認を省く","氏名だけを削除し、他の識別可能な情報と境界条件は確認しない"],"correctChoiceIndex":0,"explanation":"テスト目的に必要な境界値やデータ関係を保ちながら、架空値や適切に加工したデータを使います。個人情報を保護しつつ、17・18・19歳のように判定が切り替わる周辺を確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"境界値を保った安全なテストデータ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-defect-reproduction-evidence-1238","questionText":"利用者から「時々保存に失敗する」と連絡があったが、担当者の端末では再現しない。原因調査に役立つ記録として最も適切なものはどれですか。","choices":["関連ログを収集するが、利用者の操作や発生時刻とは対応付けない","発生時刻、入力条件、操作手順、アプリ版、端末・環境、関連ログを対応付ける","発生時刻と操作手順を記録するが、アプリ版と端末環境は対象外とする","アプリ版と端末環境を記録するが、入力条件や処理ログは対象外とする"],"correctChoiceIndex":1,"explanation":"再現しにくい障害では、発生条件を後から比較できる証拠が必要です。時刻、入力、操作、版、環境、ログを対応付けると、共通条件や処理の失敗箇所を絞れます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"障害再現に必要な記録","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cause-isolation-layer-1239","questionText":"注文画面で確定するとエラーになる。ブラウザからAPIへの要求は送信済み、APIログにはDB更新時のタイムアウト、DBには更新記録がない。最初に重点確認する箇所はどれですか。","choices":["ブラウザ側の入力検証を重点確認し、API到達後のログは次の段階で扱う","APIの受信処理を重点確認し、記録済みのDBタイムアウトは別事象として扱う","APIからDBへの接続・更新処理と、その時刻のDB負荷を確認する","DBの更新記録だけを確認し、APIログとの時刻対応は取らずに再試行する"],"correctChoiceIndex":2,"explanation":"各層のログを時系列で対応付けると、要求はAPIまで到達し、DB更新で失敗したことが分かります。APIとDB間の接続、更新処理、DB負荷を重点的に確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"画面・API・DB間の原因切り分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-security-test-input-validation-1240","questionText":"数値だけを受け付ける商品数量欄の入力検証を確認するセキュリティテストとして最も適切なものはどれですか。","choices":["正常値と境界内の最小値だけを入力し、形式違反は別の試験で扱う","画面側へ文字列を入力して拒否を確認するが、サーバ側へ直接届く要求は確認しない","範囲外の数値だけを入力し、文字種や入力長の違いは確認しない","文字列、範囲外の数値、想定外の長さを入力し、安全に拒否されることを確認する"],"correctChoiceIndex":3,"explanation":"入力検証では、正常値だけでなく形式違反、範囲外、過大な長さなどを安全に拒否できるか確認します。画面側だけに頼らず、サーバ側でも入力を検証することが重要です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"不正入力を用いたセキュリティ試験","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-automated-test-flakiness-1241","questionText":"同じプログラムと入力でも、外部サービスの応答時間によって自動テストが時々失敗する。対応として最も適切なものはどれですか。","choices":["失敗条件を記録し、外部依存や待機条件を制御して安定して再現・判定できるよう修正する","再実行回数を増やして最終結果だけを採用し、失敗条件の分析は後回しにする","不安定なテストを自動工程から外し、同じ条件の手動確認だけをリリース時に行う","外部サービスを常に模擬へ置き換え、実サービスとの結合確認は実施対象から外す"],"correctChoiceIndex":0,"explanation":"不安定なテストは、製品の変更がなくても結果が変わり、品質判断への信頼を下げます。外部依存、時間条件、共有データなどを調べ、制御可能な代替や適切な待機条件で原因を除去します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"不安定な自動テストへの対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-ci-build-failure-isolation-1242","questionText":"CIで、ソース解析は成功したが、依存部品の取得工程だけが全ブランチで失敗した。同じコミットは開発端末のキャッシュ利用時にはビルドできる。最初に確認する対象として最も適切なものはどれですか。","choices":["全ブランチに共通するソース変更を原因と考え、業務ロジックの差分から確認する","CI環境の依存部品リポジトリ設定、ネットワーク、指定版の入手可否を確認する","ソース解析の設定差を確認し、依存部品の取得ログは解析後に確認する","開発端末のキャッシュ内容をCIへ複製し、取得経路の問題は次回更新時に調べる"],"correctChoiceIndex":1,"explanation":"CI（Continuous Integration：継続的インテグレーション）の工程別結果から、今回は依存部品の取得部分に原因候補を絞れます。リポジトリ設定、通信、認証、指定版の公開状況などを確認します。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"CIビルド失敗の工程切り分け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-ci-fail-fast-gate-1243","questionText":"CIの単体テストで、注文金額を誤計算する重大な失敗が見つかった。後続のパッケージ作成と配布工程の扱いとして最も適切なものはどれですか。","choices":["パッケージだけ作成し、配布直前に重大性を再評価する","失敗を警告として記録し、限定した利用者への配布まで進めて影響を確認する","品質ゲートで後続工程を止め、原因修正と再テスト後に再開する","失敗したテストを一時的に対象外へ移し、別のテストが通れば後続を再開する"],"correctChoiceIndex":2,"explanation":"重大な自動テスト失敗を品質ゲートで検出した場合は、欠陥を含む可能性のある成果物を後続へ流さないようにします。原因を修正し、必要なテストが通過してからパッケージ作成や配布を再開します。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"自動テスト失敗時の後続停止","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-staged-release-rollback-1244","questionText":"新バージョンを利用者の5%へ段階リリースしたところ、決済失敗率が通常の0.2%から3%へ上昇し、事前の切戻し基準1%を超えた。対応として最も適切なものはどれですか。","choices":["全利用者へ展開し、利用件数を増やしてから判断する","失敗率の監視を停止し、予定時刻まで展開を続ける","影響利用者を増やさず、その場で修正を試しながら切戻し基準を変更する","展開を停止して切り戻し、記録を保全して原因を調査する"],"correctChoiceIndex":3,"explanation":"段階リリースは、影響範囲を限定して指標を確認する方法です。事前に定めた重大指標が切戻し基準を超えた場合は展開を止め、安定版へ戻して原因を調査します。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"段階リリースと切戻し判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-version-branch-use-1245","questionText":"短期間の機能開発用ブランチと、本番で緊急修正が必要になったときの修正用ブランチの使い分けとして最も適切なものはどれですか。","choices":["機能開発用は新機能を分離し、緊急修正用は本番版を基点に影響を限定して修正する","機能開発用と緊急修正用を同じ長期ブランチにまとめ、リリース時に変更を選別する","緊急修正用は開発中の最新版を基点とし、未完成機能を含めて本番版へ反映する","機能開発用は担当者別に分け、統合先と完了条件は各担当者が個別に決める"],"correctChoiceIndex":0,"explanation":"ブランチは、変更の目的やリリース先を分けて管理するために使います。緊急修正では本番版から必要最小限の変更を行い、修正内容を他の開発系列にも反映できるよう履歴を管理します。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"ブランチの目的別使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-coding-standard-review-1246","questionText":"複数人で保守するプログラムへコーディング標準を適用するとき、レビューで確認する内容として最も適切なものはどれですか。","choices":["担当者が使い慣れた書き方へ統一され、チーム規則との差が記録されているか","命名、字下げ、処理の分割、例外処理などが合意した規則に沿っているか","実行速度の測定結果が目標内なら、命名や構造の差を許容できるか","画面の見た目が同じなら、内部の例外処理を担当者ごとに変えられるか"],"correctChoiceIndex":1,"explanation":"コーディング標準は、命名や構造などの共通ルールを定め、可読性や保守性を高めます。形式だけでなく、複雑さ、例外処理、共通部品の利用など、標準が意図する品質も確認します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"コーディング標準の確認観点","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-code-review-maintainability-1247","questionText":"新機能は正常に動作するが、同じ計算処理が五か所に複製され、変数名も役割を表していない。コードレビューでの指摘として最も適切なものはどれですか。","choices":["現在の動作を優先し、重複処理は次の機能追加時にまとめて整理する","処理速度を測定し、目標内なら重複と命名はレビュー対象から外す","共通処理への整理と意味の分かる命名を検討し、変更時の不整合リスクを下げる","五か所へ同じコメントを追加し、処理自体は個別に変更できる状態を保つ"],"correctChoiceIndex":2,"explanation":"コードレビューでは、現在の正しさだけでなく、可読性、重複、複雑さ、変更容易性も確認します。重複処理を整理し役割の分かる名前を付けると、修正漏れや不整合を減らせます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"保守性を重視したコードレビュー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-build-time-improvement-calc-1248","questionText":"チームXはビルド時間を20分から14分へ短縮し、目標は25%以上の改善である。チームYは16分から13分へ短縮し、目標は20%以上である。改善率を「短縮時間÷改善前時間×100」で求めた判断として適切なものはどれですか。","choices":["Xは30%、Yは約18.8%で、両方とも目標を達成した","Xは20%、Yは約23.1%で、Yだけが目標を達成した","Xは約42.9%、Yは約18.8%で、両方とも目標を達成していない","Xは30%、Yは約18.8%で、Xだけが目標を達成した"],"correctChoiceIndex":3,"explanation":"Xは（20－14）÷20×100＝30%で、25%の目標を達成します。Yは（16－13）÷16×100＝18.75%で、20%の目標には届きません。改善後時間を分母にしない点にも注意します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"ビルド時間改善率計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-refactoring-feature-change-1249","questionText":"リファクタリングと機能変更の区別として最も適切なものはどれですか。","choices":["外部から見た動作を保ちながら内部構造を整理するのがリファクタリングで、新しい割引機能の追加は機能変更である","変数名を分かりやすくする作業は機能追加で、決済方式の追加はリファクタリングである","リファクタリングでは必ず画面仕様を変更し、機能変更では外部動作を保つ","どちらもテストせずに本番へ反映できる内部作業である"],"correctChoiceIndex":0,"explanation":"リファクタリングは、外部から見た動作を変えずに内部構造を改善する活動です。新しい業務機能を追加する変更とは分けて扱い、動作を保てたか回帰テストなどで確認します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"リファクタリングと機能変更の区別","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-mlops-model-data-version-1250","questionText":"本番の予測結果を再現しようとしたが、使ったモデルだけが保存され、学習データと前処理コードの版が分からなかった。MLOpsの改善として最も適切なものはどれですか。","choices":["モデルの版と展開日時だけを残し、学習データやコードとの対応は別管理にする","モデル、学習データ、前処理・推論コード、設定、評価結果、展開先の版を対応付ける","モデルと推論コードは対応付けるが、学習データと前処理の版は記録対象外とする","モデルと学習データは対応付けるが、評価結果と展開先の情報は更新時に上書きする"],"correctChoiceIndex":1,"explanation":"MLOps（Machine Learning Operations）では、モデルだけでなく、学習データ、コード、設定、評価、展開の版を対応付けます。これにより、結果の再現、差分の調査、安全な更新や切戻しがしやすくなります。","category":"テクノロジ系","subcategory":"ソフトウェア開発管理技術","topic":"モデル・データ・コードの版対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-service-improvement-value-priority-1251","questionText":"サービス改善候補が三つある。Xは重要業務の停止を年20時間減らす見込み、Yは社内画面の操作を少し短縮、Zは報告書の見栄えを改善する。予算上、一つだけ実施できる場合の判断として最も適切なものはどれですか。","choices":["事業への影響、期待効果、費用、リスクを比較し、重要業務の停止削減を優先候補とする","利用者全員が目にするZを優先し、停止時間への効果は次年度に比較する","実施期間が最も短いYを選び、改善後の事業効果は評価しない","三案を登録した順に実施し、事業への影響による順位変更は行わない"],"correctChoiceIndex":0,"explanation":"サービス改善は、登録順や見た目だけでなく、事業影響、期待効果、費用、リスクを比較して優先します。重要業務の停止削減は事業価値へ直結するため、定量的な効果を確認した上で優先候補にできます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"事業影響を用いたサービス改善優先順位","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-sla-multi-metric-business-impact-1252","questionText":"ECサービスは月間稼働率99.95%のSLAを達成したが、売上が集中する毎週金曜20時台に応答時間目標を4回下回り、決済離脱率も増えた。サービス評価として最も適切なものはどれですか。","choices":["月間稼働率を達成したため、他の指標や時間帯にかかわらずSLAは良好と評価する","稼働率、時間帯別応答時間、未達回数、決済への影響を合わせて評価し、ピーク時間帯の改善を検討する","離脱率だけをSLA指標に置き換え、稼働率と応答時間の測定を終了する","応答時間の月間平均だけを再計算し、時間帯別の未達は平均値へ統合して扱う"],"correctChoiceIndex":1,"explanation":"SLA（Service Level Agreement：サービスレベル合意書）は、合意した複数指標と測定条件に沿って評価します。月間稼働率を満たしていても、重要時間帯の応答遅延が売上へ影響しているため、時間帯別の実績と事業影響を合わせた改善が必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"複数SLA指標と事業影響の総合評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-outsourced-escalation-accountability-1253","questionText":"顧客向けサービスの運用を外部委託する。重大障害時のエスカレーション責任の定め方として最も適切なものはどれですか。","choices":["委託先が一次対応するため、顧客への説明と事業継続判断も委託先へ一任する","委託元が全ての技術対応を行い、委託先は障害の記録だけを担当する","委託先の検知・報告経路と、委託元の顧客説明・事業判断の責任を契約と手順で明確にする","障害発生後に担当者同士で相談し、平常時は判断権限や連絡期限を定めない"],"correctChoiceIndex":2,"explanation":"運用を委託しても、委託元には顧客や事業に関する責任が残ります。委託先の検知・技術対応・報告と、委託元の意思決定・顧客説明について、連絡期限や権限を事前に定めます。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託運用のエスカレーション責任","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-vendor-operational-quality-scorecard-1254","questionText":"運用委託先を半年ごとに評価する。費用は予算内だが、重大障害の復旧遅延、同じ障害の再発、報告の遅れが増えている。評価方法として最も適切なものはどれですか。","choices":["契約金額の安さだけを評価し、障害対応は個別事象として評価対象外にする","総障害件数だけを評価し、重大度、再発、報告期限の違いは集計しない","利用者満足度だけを評価し、復旧実績や再発防止の進捗は別契約時に確認する","費用に加え、重大度別復旧実績、再発率、報告遵守、改善状況を共通基準で評価する"],"correctChoiceIndex":3,"explanation":"運用品質は、費用や総件数だけでなく、重大障害の復旧、再発、報告、改善など複数の実績で評価します。調達時の提案内容ではなく、合意した基準に対する運用期間中の実績を継続的に確認します。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託先の運用品質総合評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-bcp-service-recovery-portfolio-1255","questionText":"災害時、受注サービスは4時間停止すると出荷へ重大な影響があり、社内研修サイトは3日停止しても代替手段がある。限られた復旧資源の割当てとして最も適切なものはどれですか。","choices":["BCPで定めた業務影響と目標復旧時間に基づき、受注サービスを先に復旧できるよう資源を割り当てる","利用者数が多い研修サイトを先に復旧し、業務停止による損失は復旧後に評価する","二つのサービスへ同じ人数と時間を割り当て、業務重要度による差を付けない","復旧手順が短いサービスから処理し、目標復旧時間との関係は考慮しない"],"correctChoiceIndex":0,"explanation":"BCP（Business Continuity Plan：事業継続計画）では、業務影響と目標復旧時間に基づいて重要業務を優先します。利用者数や作業の容易さだけでなく、停止が事業へ与える影響から復旧資源を配分します。","category":"ストラテジ系","subcategory":"企業活動","topic":"BCPとITサービス復旧優先順位の整合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-service-retirement-exit-plan-1256","questionText":"長年利用した顧客管理サービスを終了し、別の仕組みへ移行する。終了計画に含める内容として最も適切なものはどれですか。","choices":["最終利用日だけを決め、データ保存期間と問合せ窓口は終了後に検討する","データ移行・保全、利用者通知、契約終了、権限廃止、残存データ確認を対応付けて計画する","新サービスが動作すれば旧サービスを停止し、未完了取引の確認は利用部門へ任せる","旧サービスの操作手順だけを保管し、法令・契約上の保存義務は移行対象外とする"],"correctChoiceIndex":1,"explanation":"サービス終了では、機能停止だけでなく、データ移行と保存、未完了処理、利用者通知、契約、権限、残存データを管理します。移行後も必要な記録を保持し、旧環境への不要なアクセスやデータ残存を防ぎます。","category":"ストラテジ系","subcategory":"システム企画","topic":"サービス終了時の移行・保全・契約対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-capacity-investment-demand-risk-1257","questionText":"需要予測では半年後に取引量が現在の1.8倍になる。案Xは今すぐ最大需要まで増強し費用が高い。案Yは段階増強できるが、手配に2か月かかり、増強が遅れると販売機会を失う。判断として最も適切なものはどれですか。","choices":["現在の使用率だけで案Yを選び、需要予測と手配期間は増強時に再確認する","機会損失を避けるため案Xを選び、需要予測の不確実性や未使用容量は評価しない","需要予測の幅、手配期間、段階増強の時期、余剰費用、容量不足時の機会損失を比較する","初期費用が低い案Yを選び、容量不足が起きた場合はSLAの目標を変更する"],"correctChoiceIndex":2,"explanation":"容量投資では、需要予測だけでなく、その不確実性、増強のリードタイム、余剰容量の費用、容量不足による機会損失を比較します。高額な先行投資と、遅延リスクのある段階投資の両方を事業面から評価します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"需要予測と機会損失による容量投資判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-availability-investment-business-tier-1258","questionText":"予算が限られる中で、決済サービスと社内掲示板の可用性対策を見直す。投資判断として最も適切なものはどれですか。","choices":["二つのサービスに同額を配分し、停止時の事業影響は評価しない","利用者数だけを基準にし、売上や代替手段の有無は比較しない","社内掲示板を先に冗長化し、決済停止時の損失は障害発生後に測定する","重要度、停止影響、目標可用性、代替手段、対策費用に応じて必要な水準を分ける"],"correctChoiceIndex":3,"explanation":"必要な可用性は、サービスの重要度や停止影響、代替手段、費用によって異なります。全サービスを同じ水準にするのではなく、決済など事業影響の大きいサービスへ相応の対策を割り当てます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務重要度に応じた可用性投資","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-internal-control-exception-policy-1259","questionText":"月末処理のため、通常は分離している申請と承認を一人が3日間だけ行う必要が生じた。一時例外の管理として最も適切なものはどれですか。","choices":["理由、対象、期限、承認者、代替確認を記録し、期限後の権限失効を責任者が確認する","口頭承認だけで権限を追加し、業務が落ち着いた時点で利用者本人が削除する","月末処理に使う権限として恒久付与し、利用実績がなければ次年度に見直す","例外期間中の取引は監視対象から外し、通常統制へ戻った後の取引だけを確認する"],"correctChoiceIndex":0,"explanation":"統制の一時例外には、必要性、範囲、期限、承認、責任者、代替的な確認を定めます。期限後に権限が確実に失効したことまで確認し、例外が恒久化することを防ぎます。","category":"ストラテジ系","subcategory":"企業活動","topic":"統制例外の期限・承認・監視方針","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-monitoring-investment-payback-calc-1260","questionText":"障害の早期検知に240万円を投資する。月間の停止損失は90万円から30万円へ減る見込みである。他の効果と維持費を考慮しないとき、投資回収期間は何か月ですか。","choices":["3か月","4か月","6か月","8か月"],"correctChoiceIndex":1,"explanation":"月間の停止損失削減額は90－30＝60万円です。投資回収期間は240÷60＝4か月です。実際の投資判断では維持費や効果の不確実性も確認します。","category":"ストラテジ系","subcategory":"企業活動","topic":"停止損失削減による監視投資回収期間","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-major-incident-stakeholder-policy-1261","questionText":"決済障害が発生し、復旧見込みは未確定、影響地域は調査中、SNSでは誤った情報も広がっている。事業関係者向けの情報提供方針として最も適切なものはどれですか。","choices":["復旧時刻を推測して先に公表し、変更があっても同じ内容を維持する","技術ログを加工せず全て公開し、顧客ごとの影響確認は各自に任せる","確認済みの影響、暫定対応、未確定事項、次回更新時刻を統一窓口から継続して伝える","原因が完全に確定するまで情報を出さず、問い合わせには個別担当者が回答する"],"correctChoiceIndex":2,"explanation":"重大障害では、確認済み情報と未確定情報を分け、事業影響、暫定対応、次回更新時刻を一貫して伝えます。推測を断定せず、統一した窓口で更新することで、誤情報と関係者の混乱を抑えます。","category":"ストラテジ系","subcategory":"企業活動","topic":"重大障害時の事業関係者向け情報方針","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-outsourced-continuity-contract-1262","questionText":"重要業務を支える外部サービスの契約を見直す。サービス継続の観点から最も適切な確認はどれですか。","choices":["通常時の月額料金だけを確認し、災害時の代替拠点は委託先の内部事項とする","委託先の復旧目標だけを確認し、自社が利用者へ約束した目標との整合は確認しない","障害時の連絡先だけを契約へ記載し、復旧作業の責任分界は手順書へ委ねる","復旧目標、代替手段、連絡・判断責任、データ保全、定期訓練を自社要件と整合させる"],"correctChoiceIndex":3,"explanation":"外部サービスの継続条件は、自社の重要業務と利用者へ約束した目標に整合させます。復旧目標だけでなく、代替手段、責任分界、データ保全、訓練と結果確認まで契約や合意に含めます。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託契約とサービス継続条件の整合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-service-request-self-service-control-1263","questionText":"社内サービス要求をセルフサービス化する。自動承認に適したものはどれですか。","choices":["本人確認済み利用者による、事前承認された低リスクの標準ソフト利用申請","本番データベースの管理者権限を初めて付与する申請","職務分掌を一時解除し、申請者本人へ承認権限も与える申請","個人データを社外へ持ち出すための例外申請"],"correctChoiceIndex":0,"explanation":"セルフサービス化には、内容とリスクが標準化され、事前に承認条件を定められる要求が適します。高権限付与や例外処理、社外持出しなどは、個別の影響確認と明示的な承認が必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"セルフサービス化する要求の統制範囲","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-vendor-exit-knowledge-transfer-1264","questionText":"基幹システムの運用委託先を変更する。旧委託先の担当者だけが月末処理の例外対応を把握している。移行策として最も適切なものはどれですか。","choices":["通常手順書だけを渡し、例外対応は発生時に旧委託先へ問い合わせる","例外を含む手順、判断根拠、連絡先、既知問題を移管し、新委託先による実施確認を行う","旧委託先の契約終了後に、新委託先が運用しながら不足知識を収集する","運用ツールのアカウントだけを移し、判断に必要な業務知識は利用部門へ分散する"],"correctChoiceIndex":1,"explanation":"委託終了時には、文書だけでなく、例外処理、判断根拠、既知問題、連絡関係を移管します。新しい担当者が実際に手順を実施できるか確認し、特定個人への知識依存を残さないことが重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託終了時の運用知識移転","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-facility-redundancy-investment-1265","questionText":"データセンタの電源装置を二重化する案がある。二台とも同じ配電盤と同じ電源経路に接続される案と、独立経路に分ける案を比較する。判断として最も適切なものはどれですか。","choices":["装置が二台なら経路にかかわらず同じ可用性になるため、安い案を選ぶ","独立経路は管理対象が増えるため、停止影響にかかわらず一経路へ集約する","配電盤や経路の共通障害による事業影響と費用を比較し、必要なら独立経路へ投資する","電源障害は設備部門だけの問題として、ITサービス停止との関係は評価しない"],"correctChoiceIndex":2,"explanation":"装置を複数にしても、同じ配電盤や経路を共有すると共通部分の故障で同時に停止します。設備投資では、共通障害点、サービス停止の影響、必要な可用性と費用を合わせて判断します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"設備冗長化投資と共通障害リスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-service-downtime-loss-reduction-calc-1266","questionText":"あるサービスの年間停止時間を30時間から12時間へ短縮する。停止1時間当たりの事業損失を25万円とし、他の効果を含めない場合、年間の損失削減額はいくらですか。","choices":["300万円","360万円","420万円","450万円"],"correctChoiceIndex":3,"explanation":"停止時間の短縮量は30－12＝18時間です。年間の損失削減額は18×25＝450万円です。改善後の停止損失300万円ではなく、改善前後の差を求めます。","category":"ストラテジ系","subcategory":"企業活動","topic":"停止時間短縮による年間損失削減額","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-evidence-period-consistency-1267","questionText":"2026年度のアクセス権管理を監査する。部門は承認一覧を提出したが、それは2025年度末の一覧であり、2026年度には組織変更と権限更新があった。監査人の対応として最も適切なものはどれですか。","choices":["監査対象期間の申請・承認記録と実設定を入手し、組織変更後の状態を照合する","前年末の一覧は正式文書なので、対象期間が異なってもそのまま結論の根拠とする","組織変更の説明を担当者から聞き、2026年度の記録を入手せず監査を完了する","現在の権限だけを確認し、年度途中に存在した不要権限は監査対象から外す"],"correctChoiceIndex":0,"explanation":"監査証拠は、監査目的だけでなく対象期間とも整合している必要があります。前年の正式資料だけでは年度内の変更を裏付けられないため、対象期間の承認記録、変更履歴、実設定を対応付けます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証拠の対象期間整合性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-evidence-scope-gap-1268","questionText":"全国10拠点の端末管理を監査するが、本社1拠点の点検記録しか入手できていない。全社統制について結論を出すための対応として最も適切なものはどれですか。","choices":["本社の統制が良好なら、他拠点も同様と推定して追加確認を行わない","拠点ごとのリスクと運用差を確認し、必要な拠点・期間から追加証拠を入手する","本社の記録枚数を増やし、拠点範囲の不足を証拠量だけで補う","全社監査を本社監査へ変更し、当初の監査目的との差は記録しない"],"correctChoiceIndex":1,"explanation":"一拠点の証拠だけでは、運用の異なる全拠点について十分な結論を出せません。拠点別リスクや統制の共通性を確認し、監査範囲を裏付ける追加証拠を取得します。","category":"マネジメント系","subcategory":"システム監査","topic":"監査範囲に対する証拠不足の補完","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-population-interface-reconciliation-1269","questionText":"販売システムから会計システムへ連携された売上を母集団として監査する。販売側は1,020件、会計側は1,000件で、連携失敗一覧に20件ある。標本抽出前の対応として最も適切なものはどれですか。","choices":["会計側1,000件だけを完全な母集団とし、連携失敗分は別システムなので除外する","販売側から無作為抽出し、会計側との件数差や連携失敗の内容は確認しない","両システムの件数・金額と失敗一覧を照合し、未取込20件を含む監査対象を確定する","件数差が2%未満なら重要でないと判断し、監査目的にかかわらず抽出を開始する"],"correctChoiceIndex":2,"explanation":"システム間連携がある場合、受信側の一覧だけでは失敗した取引が母集団から漏れる可能性があります。送受信件数、金額、失敗一覧を照合して対象全体を確定してから標本を選びます。","category":"マネジメント系","subcategory":"システム監査","topic":"システム間連携を含む母集団完全性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-procedure-evidence-comparison-1270","questionText":"アクセス権削除統制を監査する。手続と得られる証拠の組合せとして最も適切なものはどれですか。","choices":["担当者への質問だけで、全退職者の権限が削除された事実を直接確認できる","作業観察だけで、観察日前の全期間に同じ統制が運用されたと証明できる","手順書を読むだけで、実際の権限削除結果と実施時刻を確認できる","質問で手順を理解し、記録照合や一部の再実施で実際の運用結果を裏付ける"],"correctChoiceIndex":3,"explanation":"質問は手続の理解に役立ちますが、実施事実の裏付けには記録、観察、再実施などを組み合わせます。監査目的に応じて異なる手続を選び、単一の証拠だけへ依存しないことが重要です。","category":"マネジメント系","subcategory":"システム監査","topic":"質問・観察・再実施の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠／独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-access-reperformance-1271","questionText":"申請書では一般利用者権限が承認されている。監査人が実際の設定を独自に確かめる手続として最も適切なものはどれですか。","choices":["対象アカウントで許可・禁止される操作を確認し、承認内容と実設定を照合する","申請書の署名だけを確認し、システム上の権限は運用部門の説明で代替する","権限一覧の列数を数え、各権限で実行できる操作は確認しない","利用者へ使い勝手を質問し、管理機能へのアクセス可否は監査対象外とする"],"correctChoiceIndex":0,"explanation":"再実施では、監査人が統制や処理を独自に実行して結果を確かめます。承認書だけでなく、対象アカウントが実際に許可・禁止される操作を確認すると、設定との不一致を検出できます。","category":"マネジメント系","subcategory":"システ
