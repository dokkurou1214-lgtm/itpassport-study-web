"安全在庫","仕掛在庫","不良在庫","委託在庫"],"correctChoiceIndex":0,"explanation":"安全在庫は需要増加や納入遅延の不確実性に備える在庫です。多すぎると保管費用が増えるため適正量を設定します。","category":"ストラテジ系","subcategory":"企業活動","topic":"安全在庫","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-eoq-purpose-314","questionText":"発注費と在庫保管費の合計が小さくなる発注量を求める考え方の目的はどれですか。","choices":["販売価格を法律で固定する","一回当たりの経済的な発注量を決める","製品の品質検査を省略する","需要を常にゼロにする"],"correctChoiceIndex":1,"explanation":"EOQ（Economic Order Quantity：経済的発注量）は、発注回数に伴う費用と在庫保有費用のバランスから発注量を求めます。","category":"ストラテジ系","subcategory":"企業活動","topic":"経済的発注量","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-pareto-improvement-315","questionText":"顧客苦情を原因別に集計すると、少数の原因が全体の大部分を占めていた。優先順位付けに適した図はどれですか。","choices":["散布図","管理図","パレート図","レーダチャート"],"correctChoiceIndex":2,"explanation":"パレート図は項目を件数の多い順に棒で示し、累積比率を折れ線で表します。重点的に改善すべき少数原因を見つけやすくします。","category":"ストラテジ系","subcategory":"企業活動","topic":"パレート図による重点化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-ppm-cash-cow-316","questionText":"市場成長率は低いが相対的市場占有率が高く、他事業への資金供給源になりやすい事業への基本方針はどれですか。","choices":["市場から直ちに必ず撤退する","採算を無視して設備を最大化する","占有率を意図的にゼロにする","効率を保ちながら生み出す資金を活用する"],"correctChoiceIndex":3,"explanation":"PPM（Product Portfolio Management）の「金のなる木」は、大きな追加投資を抑えつつ資金創出を維持する位置付けです。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PPM資金配分","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-five-forces-buyers-317","questionText":"少数の大口顧客が仕入先を容易に切り替えられる市場で、企業の利益を圧迫しやすい要因はどれですか。","choices":["買い手の交渉力が強い","新規参入の可能性がない","代替品が存在しない","供給者の数が必ず一社になる"],"correctChoiceIndex":0,"explanation":"ファイブフォース分析では、顧客が価格や条件を強く要求できるほど買い手の交渉力が高く、業界の収益性を下げる要因になります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"買い手の交渉力","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-three-c-customer-318","questionText":"新規事業を3C分析するとき、顧客ニーズや市場規模を調べる視点はどれですか。","choices":["Company","Customer","Competitor","Compliance"],"correctChoiceIndex":1,"explanation":"3CはCustomer（市場・顧客）、Competitor（競合）、Company（自社）の三視点で環境を整理します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"3C顧客分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-pest-political-319","questionText":"政府による新しい補助金制度や輸入規制の変更を、マクロ環境分析で分類する区分はどれですか。","choices":["景気や為替に関する要因","人口動態に関する要因","政治的要因","技術革新に関する要因"],"correctChoiceIndex":2,"explanation":"PEST分析のPoliticalは政策、法規制、政治情勢などです。Economic、Social、Technologicalと分けて外部環境を確認します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PEST政治要因","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-differentiation-strategy-320","questionText":"競合より高価でも選ばれるよう、独自機能と手厚いサポートを提供する競争戦略はどれですか。","choices":["コストリーダシップ戦略","無関連多角化","撤退戦略","差別化戦略"],"correctChoiceIndex":3,"explanation":"差別化戦略は、品質、機能、ブランド、サービスなど独自の価値を提供し、価格以外の理由で選ばれることを目指します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"差別化による競争優位","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-cost-leadership-321","questionText":"標準化と大量調達によって業界内で低いコスト構造を築き、価格競争へ対応する戦略はどれですか。","choices":["コストリーダシップ戦略","差別化集中戦略","製品撤退戦略","水平多角化"],"correctChoiceIndex":0,"explanation":"コストリーダシップ戦略は、規模の経済や効率化で低コストを実現し、低価格または高い利益率を目指します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"低コスト競争戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-focus-strategy-322","questionText":"特定地域の高齢者向け移動支援だけに対象を絞り、専門性を高める戦略はどれですか。","choices":["全方位戦略","集中戦略","垂直統合","規模縮小だけの戦略"],"correctChoiceIndex":1,"explanation":"集中戦略は、特定の顧客層、地域、製品分野など狭い市場へ経営資源を集中し、その市場で優位を築きます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"市場集中戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-blue-ocean-323","questionText":"既存企業との価格競争を避け、未開拓の需要と新しい価値を生み出す考え方はどれですか。","choices":["フォロワ戦略","価格カルテル","ブルーオーシャン戦略","事業清算"],"correctChoiceIndex":2,"explanation":"ブルーオーシャン戦略は、競争の激しい既存市場ではなく、価値革新によって新しい市場空間を創出する考え方です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"価値革新市場","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-platform-business-324","questionText":"出品者と購入者が取引できる場を提供し、参加者間の取引手数料を収益とする事業モデルはどれですか。","choices":["受注生産型","単純請負型","自家消費型","プラットフォーム型"],"correctChoiceIndex":3,"explanation":"プラットフォーム型は複数の利用者グループを結び付け、取引や交流の場を提供して価値を生みます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"プラットフォーム事業","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-network-effect-325","questionText":"利用者が増えるほど、連絡できる相手や取引相手が増えてサービス価値が高まる現象はどれですか。","choices":["ネットワーク効果","規模の不経済","季節変動","減価償却"],"correctChoiceIndex":0,"explanation":"ネットワーク効果は、参加者の増加が他の参加者にとっての価値を高める現象です。SNSや市場型サービスで見られます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"利用者ネットワーク効果","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-freemium-model-326","questionText":"基本機能を無料で提供し、高度な機能や容量を必要とする利用者から料金を得るモデルはどれですか。","choices":["従量仕入れ","フリーミアム","共同購買","リースバック"],"correctChoiceIndex":1,"explanation":"フリーミアムは無料のFreeと有料のPremiumを組み合わせ、多くの利用者の一部を有料プランへ転換するモデルです。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"フリーミアムモデル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-arr-subscription-327","questionText":"月額契約型サービスで、継続的な年間収益規模を比較するために月次経常収益を12倍した指標はどれですか。","choices":["ROE","RPO","ARR","EVM"],"correctChoiceIndex":2,"explanation":"ARR（Annual Recurring Revenue：年間経常収益）は、継続契約から得る年間収益を表し、サブスクリプション事業の規模把握に使います。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"年間経常収益","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-omnichannel-328","questionText":"店舗で確認した商品をECサイトで注文し、別の店舗で受け取っても在庫や会員情報が一貫する販売施策はどれですか。","choices":["シングルチャネル","アウトソーシング","クラウドソーシング","オムニチャネル"],"correctChoiceIndex":3,"explanation":"オムニチャネルは店舗、Web、アプリなど複数の接点を統合し、顧客へ一貫した購買体験を提供します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"販売チャネル統合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-ab-test-329","questionText":"Web広告の見出しだけが異なる二案を無作為に利用者へ表示し、購入率を比較する方法はどれですか。","choices":["A/Bテスト","デルファイ法","特性要因図","ABC分析"],"correctChoiceIndex":0,"explanation":"A/Bテストは一つの要素を変えた案を比較し、実際の反応データから効果の高い案を判断します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"施策比較実験","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-retention-cohort-330","questionText":"サービス改善前後の継続率を比べるため、利用開始月が同じ顧客群ごとに推移を追う分析はどれですか。","choices":["度数分布表","コホート分析","線形計画法","損益分岐点分析"],"correctChoiceIndex":1,"explanation":"コホート分析は開始時期や共通属性が同じ集団ごとに行動を追跡し、継続率などの変化を比較します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客継続コホート","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-customer-journey-331","questionText":"商品を知ってから比較、購入、利用、再購入に至るまでの顧客の行動と接点を時系列で整理するものはどれですか。","choices":["組織図","状態遷移図","カスタマージャーニーマップ","資金繰り表"],"correctChoiceIndex":2,"explanation":"カスタマージャーニーマップは、顧客の行動、感情、企業との接点を段階ごとに可視化し、体験改善に役立てます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客体験行程","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-persona-332","questionText":"新サービスの設計で、年齢や職業だけでなく行動、課題、利用場面まで具体化した代表的利用者像はどれですか。","choices":["ステークホルダ一覧","監査調書","構成管理台帳","ペルソナ"],"correctChoiceIndex":3,"explanation":"ペルソナは調査データを基に作る具体的な利用者像です。チーム内で顧客理解を共有し、要件や施策を検討しやすくします。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"代表顧客像","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-nps-333","questionText":"顧客へ「他者に勧める可能性」を尋ね、推奨者の割合から批判者の割合を引く指標はどれですか。","choices":["NPS","EPS","RTO","MTBF"],"correctChoiceIndex":0,"explanation":"NPS（Net Promoter Score：顧客推奨度）は、顧客ロイヤルティを測る指標の一つです。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客推奨度","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-sfa-pipeline-334","questionText":"営業案件の見込み度、商談段階、次回行動を共有し、売上予測や営業活動を支援する仕組みはどれですか。","choices":["CAD","SFA","MRP","DNS"],"correctChoiceIndex":1,"explanation":"SFA（Sales Force Automation：営業支援システム）は、案件や活動を可視化して営業プロセスを支援します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"営業案件管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-marketing-automation-335","questionText":"見込み顧客の資料閲覧やメール反応に応じて、案内を自動配信し商談化を支援する仕組みはどれですか。","choices":["SCM","CAE","MA","UPS"],"correctChoiceIndex":2,"explanation":"MA（Marketing Automation：マーケティング自動化）は、見込み顧客の獲得・育成・選別をデータに基づいて支援します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"見込み顧客育成","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-scm-lead-time-336","questionText":"受注から納品までの期間を短縮するため、調達、生産、物流の情報を企業間で連携する取組はどれですか。","choices":["各部門だけの在庫最大化","販売情報の非公開化","発注周期の無条件な長期化","サプライチェーン全体の最適化"],"correctChoiceIndex":3,"explanation":"SCM（Supply Chain Management：供給連鎖管理）は、企業をまたぐ物・情報・資金の流れを統合して全体最適を目指します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"供給リードタイム短縮","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-edi-orders-337","questionText":"企業間の注文書や納品書を、合意した標準形式でネットワーク交換する仕組みはどれですか。","choices":["EDI","OCR","DLP","MFA"],"correctChoiceIndex":0,"explanation":"EDI（Electronic Data Interchange：電子データ交換）は、商取引文書を標準化したデータ形式で企業間交換します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"企業間電子データ交換","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-marketplace-ec-338","questionText":"複数の販売事業者が同じWeb上へ商品を出品し、運営者が決済や検索の場を提供するEC形態はどれですか。","choices":["社内ポータル","オンラインマーケットプレイス","データセンター","グループウェア"],"correctChoiceIndex":1,"explanation":"オンラインマーケットプレイスは、多数の売り手と買い手を仲介する電子市場です。運営者は手数料などを得ます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"電子市場取引","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-fintech-cashless-339","questionText":"スマートフォンのコードを店舗で提示し、銀行口座やカードと連携して支払うサービスは、どの活用例ですか。","choices":["CAD","組込み制御","フィンテック","デジタルサイネージだけの利用"],"correctChoiceIndex":2,"explanation":"フィンテック（FinTech）はFinanceとTechnologyを組み合わせ、決済、送金、融資などの金融サービスをITで高度化します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"モバイル決済活用","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-open-banking-api-340","questionText":"利用者の同意を得て、銀行の口座情報を外部家計簿サービスと安全に連携するために使われる仕組みはどれですか。","choices":["画面の無断読取り","銀行暗証番号の共有","紙帳票だけの郵送","公開された連携API"],"correctChoiceIndex":3,"explanation":"オープンバンキングでは、認可されたAPI（Application Programming Interface）を通じ、同意範囲内の金融データを連携します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"オープンバンキング連携","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-dx-legacy-341","questionText":"老朽化した基幹システムが事業変化を妨げている。DX推進で最初に行うべき対応として適切なものはどれですか。","choices":["業務とシステムの現状・依存関係を可視化する","全データを確認せず削除する","目的を決めず最新製品へ置換する","既存業務を一切見直さない"],"correctChoiceIndex":0,"explanation":"DX（Digital Transformation）では、事業目標に照らして現状の業務・データ・技術負債を把握し、段階的な変革計画を立てます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"レガシー刷新計画","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-data-governance-342","questionText":"全社でデータ定義が異なり集計値が一致しない。再発防止のために整備すべきものはどれですか。","choices":["部門ごとの非公開な別名だけ","データの責任者・定義・品質ルール","集計後の手作業修正だけ","保存媒体の色分けだけ"],"correctChoiceIndex":1,"explanation":"データガバナンスは、データの所有責任、標準定義、品質、アクセスなどのルールと運営体制を定めます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"全社データ統治","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-data-lake-use-343","questionText":"分析目的が未確定のセンサログ、画像、文書などを元の形式に近い状態で大量保存する基盤はどれですか。","choices":["会計元帳","CMDB","データレイク","DNSキャッシュ"],"correctChoiceIndex":2,"explanation":"データレイクは構造化・非構造化データを幅広く保持します。用途別に整形したデータを蓄えるデータウェアハウスとは役割が異なります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"未加工データ蓄積","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-ai-bias-344","questionText":"過去の採用実績だけで学習したAIが特定属性を不利に評価した。最も重要な対策はどれですか。","choices":["判定根拠を一切確認しない","不利な結果を自動承認する","属性別の精度測定を禁止する","学習データと評価結果の偏りを継続検証する"],"correctChoiceIndex":3,"explanation":"AIのバイアス対策では、データの代表性、属性別の誤差、運用後の結果を確認し、人による監督や是正を行います。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"AI公平性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-explainable-ai-345","questionText":"融資審査AIの判断について、利用者へ主要な判断要因を説明できるようにする取組はどれですか。","choices":["説明可能性を確保する","入力履歴を全て破棄する","モデルを無条件に秘密化する","人による確認を禁止する"],"correctChoiceIndex":0,"explanation":"説明可能なAIは、判断根拠を人が理解・検証できるようにし、重要な意思決定の透明性と説明責任を支援します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"AI説明可能性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-iot-predictive-maintenance-346","questionText":"工場設備の振動と温度を常時収集し、故障兆候を検知して停止前に部品交換する活用方法はどれですか。","choices":["事後保全だけの運用","予知保全","棚卸資産評価","販売時点管理"],"correctChoiceIndex":1,"explanation":"予知保全はIoT（Internet of Things）センサなどのデータから異常兆候を捉え、故障前に保守します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"設備故障予測","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-digital-twin-347","questionText":"実際の製造ラインの稼働データを仮想空間へ反映し、条件変更の影響を事前に試す仕組みはどれですか。","choices":["デジタル署名","シンクライアント","デジタルツイン","電子透かし"],"correctChoiceIndex":2,"explanation":"デジタルツインは現実の設備や環境をデータで仮想的に再現し、監視、予測、シミュレーションに利用します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"仮想製造モデル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-bpm-cycle-348","questionText":"申請業務を可視化し、実績を測定してボトルネックを改善し、その後も継続監視する取組はどれですか。","choices":["単発の設備購入","DNS運用","暗号鍵生成","BPM"],"correctChoiceIndex":3,"explanation":"BPM（Business Process Management：業務プロセス管理）は、業務を設計、実行、測定、改善する継続的な管理活動です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務プロセス継続管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-bpmn-gateway-349","questionText":"業務フローを標準的な記号で表し、処理、イベント、分岐を関係者間で共有するための表記法はどれですか。","choices":["BPMN","SQL","HTML","PKI"],"correctChoiceIndex":0,"explanation":"BPMN（Business Process Model and Notation）は、業務プロセスを共通記号でモデル化する表記法です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務プロセス表記","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-bpr-kaizen-choice-350","questionText":"部門別に分断された受注業務を顧客起点で全面的に再設計したい。日常的な小改善より適した取組はどれですか。","choices":["現行手順を無条件に固定する","BPRを実施する","障害対応だけを外注する","在庫数を記録しない"],"correctChoiceIndex":1,"explanation":"BPR（Business Process Re-engineering）は部門横断の業務を抜本的に再設計します。継続的な小改善とは変革規模が異なります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"抜本改革の適用判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-rfi-purpose-351","questionText":"新システムの調達前に、市場にどのような製品や技術、供給能力があるかを複数社へ問い合わせる文書はどれですか。","choices":["発注書","検収書","RFI","秘密鍵"],"correctChoiceIndex":2,"explanation":"RFI（Request for Information：情報提供依頼書）は、調達方針や要求を固める前にベンダから情報を集めるために使います。","category":"ストラテジ系","subcategory":"システム企画","topic":"情報提供依頼","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-rfp-evaluation-352","questionText":"複数ベンダへ提案を依頼する際、公平で説明可能な選定にするため事前に定めるべきものはどれですか。","choices":["担当者個人の好み","開札後に変える条件","社名だけの順位","評価項目と配点"],"correctChoiceIndex":3,"explanation":"RFP（Request for Proposal：提案依頼書）に対する提案は、機能、費用、体制、実績など事前の評価基準で比較します。","category":"ストラテジ系","subcategory":"システム企画","topic":"提案評価基準","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-procurement-tco-353","questionText":"機器の調達価格だけでなく、保守、電力、教育、廃棄まで含めて案を比較する考え方はどれですか。","choices":["TCOで比較する","初期価格だけで決める","最も重い機器を選ぶ","保守費を存在しないものとする"],"correctChoiceIndex":0,"explanation":"TCO（Total Cost of Ownership：総保有コスト）は、導入から運用・廃棄までに発生する総費用を捉えます。","category":"ストラテジ系","subcategory":"システム企画","topic":"総保有コスト比較","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-outsourcing-service-level-354","questionText":"外部委託するヘルプデスクについて、応答時間や解決率を継続管理するため契約で明確にすべきものはどれですか。","choices":["担当者の服装だけ","測定可能なサービスレベル","委託先の社名略称だけ","利用者に非公開の口約束だけ"],"correctChoiceIndex":1,"explanation":"委託サービスではSLA（Service Level Agreement）に測定方法、目標、報告、未達時対応などを定めます。","category":"ストラテジ系","subcategory":"システム企画","topic":"委託サービス品質","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-lifecycle-cost-355","questionText":"システム企画で、開発費は安いが運用保守費が高い案と、その逆の案を比較する際の適切な観点はどれですか。","choices":["開発初日の費用だけを比較する","保守費を全てゼロとみなす","利用期間全体の費用を比較する","機能を確認せず名称で選ぶ"],"correctChoiceIndex":2,"explanation":"ライフサイクルコストは企画、開発、運用、保守、廃棄までの費用を対象にし、長期的な経済性を比較します。","category":"ストラテジ系","subcategory":"システム企画","topic":"システム生涯費用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-portfolio-priority-356","questionText":"複数のIT投資候補から、事業価値、リスク、必要資源を比較して実施順を決める管理はどれですか。","choices":["単一障害管理","文字コード変換","媒体初期化","IT投資ポートフォリオ管理"],"correctChoiceIndex":3,"explanation":"IT投資ポートフォリオ管理は、個別案件だけでなく全体の価値・リスク・資源配分を見て投資を選択します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"IT投資優先順位","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-enterprise-architecture-357","questionText":"組織全体の業務と情報システムについて、現状と目標像を体系的に整理し、変革計画へつなげる考え方はどれですか。","choices":["エンタープライズアーキテクチャ","個別プログラムの単体テスト","一台の端末だけの構成管理","障害発生後だけの暫定対応"],"correctChoiceIndex":0,"explanation":"エンタープライズアーキテクチャ（EA）は、組織全体の業務・データ・アプリケーション・技術を俯瞰し、現状から目標像への移行を設計します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"全体最適アーキテクチャ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-requirements-traceability-358","questionText":"事業目的から定めた要求が、設計、テスト、受入れ条件へ漏れなく対応しているかを追跡する仕組みはどれですか。","choices":["データ圧縮","要求トレーサビリティ","負荷分散","磁気消去"],"correctChoiceIndex":1,"explanation":"要求トレーサビリティは、要求と設計・実装・テスト成果物の対応関係を記録し、漏れや不要機能を検出しやすくします。","category":"ストラテジ系","subcategory":"システム企画","topic":"要求追跡可能性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-privacy-purpose-limitation-359","questionText":"会員登録時に配送目的で取得した住所を、本人への説明なく別会社の広告送付へ使おうとしている。確認すべき原則はどれですか。","choices":["画面の背景色が同じか","配送箱の大きさが同じか","特定した利用目的の範囲内か","担当者の席が近いか"],"correctChoiceIndex":2,"explanation":"個人情報は利用目的をできる限り特定し、その範囲を超える利用には同意など適切な根拠が必要です。","category":"ストラテジ系","subcategory":"法務","topic":"利用目的制限","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-data-minimization-360","questionText":"メールマガジン配信だけを目的とする申込みで、不要な家族構成まで必須入力にしない考え方はどれですか。","choices":["利用しない情報も無制限に集める","保存期限を決めず永久保存する","目的を利用者へ知らせない","目的に必要な最小限の情報だけを収集する"],"correctChoiceIndex":3,"explanation":"データ最小化は、目的達成に必要な範囲へ個人データの収集・利用を絞る考え方です。漏えい時の影響軽減にもつながります。","category":"ストラテジ系","subcategory":"法務","topic":"個人データ最小化","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-anonymized-data-361","questionText":"特定の個人を識別できず、元の個人情報へ戻せないよう適切に加工したデータを分析へ使う主な利点はどれですか。","choices":["個人の識別リスクを抑えて統計利用しやすくする","必ず本人の氏名を復元できる","全ての安全管理が不要になる","データ品質を確認しなくてよい"],"correctChoiceIndex":0,"explanation":"匿名加工では再識別を防ぐ加工と適切な取扱いが必要です。匿名化しても目的やリスクに応じた管理は重要です。","category":"ストラテジ系","subcategory":"法務","topic":"匿名加工データ利用","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-employee-copyright-362","questionText":"従業員が職務として作成した業務マニュアルを会社が利用する。権利関係を明確にするために重要なものはどれですか。","choices":["作成者名を消せば自由利用できると考える","法令と雇用契約・社内規程を確認する","公開済みなら権利はないと考える","外部へ無断配布してから確認する"],"correctChoiceIndex":1,"explanation":"職務上作成した著作物でも、著作物の種類や作成条件で扱いが異なるため、法令と契約・規程を確認します。","category":"ストラテジ系","subcategory":"法務","topic":"職務著作の確認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-patent-novelty-363","questionText":"新技術について特許出願を検討している。展示会で詳細を公開する前の対応として適切なものはどれですか。","choices":["先に全設計を公開する","発明者名を消して公開する","公開前に出願方針と秘密管理を確認する","競合へ無条件に図面を渡す"],"correctChoiceIndex":2,"explanation":"特許には新規性などの要件があるため、自らの公開が出願へ影響する場合があります。公開前に専門家を含め方針を確認します。","category":"ストラテジ系","subcategory":"法務","topic":"特許新規性保護","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-trademark-use-364","questionText":"新サービスの名称とロゴを長期的に識別標識として保護したい。主に検討する産業財産権はどれですか。","choices":["特許権","実用新案権","著作者人格権だけ","商標権"],"correctChoiceIndex":3,"explanation":"商標権は商品・サービスを他者のものと区別する名称やロゴなどの標識を保護します。","category":"ストラテジ系","subcategory":"法務","topic":"ブランド標識保護","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-trade-secret-365","questionText":"独自の製造条件を営業秘密として保護するため、最も重要な管理はどれですか。","choices":["秘密であることを示しアクセスを限定する","誰でも閲覧できる場所へ掲載する","秘密情報の範囲を決めない","退職者へ無制限に持ち出させる"],"correctChoiceIndex":0,"explanation":"営業秘密として保護するには、秘密管理性、有用性、非公知性などを満たす管理が重要です。","category":"ストラテジ系","subcategory":"法務","topic":"営業秘密管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-subcontract-records-366","questionText":"委託先との取引条件を巡る紛争を防ぐため、発注時に行うべき基本対応はどれですか。","choices":["条件を口頭だけで毎回変更する","業務内容、納期、対価などを書面や電磁的記録で明確にする","検収基準を委託先へ知らせない","支払日を記録しない"],"correctChoiceIndex":1,"explanation":"委託取引では、業務範囲、成果物、納期、検収、対価、知的財産などを明確に記録することが重要です。","category":"ストラテジ系","subcategory":"法務","topic":"委託取引条件明確化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-security-policy-approval-367","questionText":"全社の情報セキュリティ方針を実効性あるものにするため、最も適切な進め方はどれですか。","choices":["担当者の私的メモに留める","事故発生後だけ閲覧可能にする","経営層が承認し全従業者へ周知する","委託先には一切伝えない"],"correctChoiceIndex":2,"explanation":"基本方針は経営責任を明確にし、対象者へ周知し、教育・見直しを継続して組織全体で運用します。","category":"ストラテジ系","subcategory":"法務","topic":"情報セキュリティ方針","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-isms-certification-368","questionText":"情報セキュリティのリスクを組織的に管理する仕組みについて、第三者認証の基準として使われる規格はどれですか。","choices":["ISO 9001だけ","IEEE 802.11","HTML Living Standard","ISO/IEC 27001"],"correctChoiceIndex":3,"explanation":"ISO/IEC 27001はISMS（Information Security Management System：情報セキュリティマネジメントシステム）の要求事項を定めます。","category":"ストラテジ系","subcategory":"法務","topic":"ISMS認証規格","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-bcm-exercise-369","questionText":"災害時の代替拠点手順を文書化した後、その実効性を高めるために行うべきことはどれですか。","choices":["定期的に訓練し結果を基に見直す","文書を施錠して誰にも見せない","連絡先を更新しない","一度作れば永久に変更しない"],"correctChoiceIndex":0,"explanation":"BCM（Business Continuity Management：事業継続マネジメント）では、訓練とレビューを通じて計画を継続改善します。","category":"ストラテジ系","subcategory":"企業活動","topic":"事業継続訓練","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-risk-appetite-370","questionText":"新規事業で、組織が目的達成のために受け入れる意思のあるリスクの種類と水準を何と呼びますか。","choices":["リスク所有者","リスクアペタイト","監査証拠","復旧時点"],"correctChoiceIndex":1,"explanation":"リスクアペタイトは、戦略や目的のために組織が受容するリスクの量や種類を示し、投資判断などの基準になります。","category":"ストラテジ系","subcategory":"企業活動","topic":"リスク受容方針","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-project-charter-371","questionText":"新しいプロジェクトを正式に承認し、責任者へ組織資源を使用する権限を与える文書はどれですか。","choices":["障害報告書","運用日誌","プロジェクト憲章","監査調書"],"correctChoiceIndex":2,"explanation":"プロジェクト憲章は目的、概要、主要関係者などを示してプロジェクトを正式に立ち上げ、プロジェクトマネージャの権限を明確にします。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト正式承認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-scope-creep-372","questionText":"承認手続を経ない小さな機能追加が積み重なり、納期と費用が膨らんだ。この現象はどれですか。","choices":["フェールセーフ","ロールバック","キャパシティプランニング","スコープクリープ"],"correctChoiceIndex":3,"explanation":"スコープクリープは、正式な変更管理なしに作業範囲が徐々に拡大することです。要求を記録し、影響評価と承認を行います。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"無統制な範囲拡大","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-wbs-hundred-percent-373","questionText":"WBSを作成するとき、成果物の漏れや重複を防ぐための考え方として適切なものはどれですか。","choices":["上位要素の作業全体を下位要素で過不足なく表す","同じ作業を全階層へ重複記載する","管理作業を必ず除外する","担当者名だけで階層を作る"],"correctChoiceIndex":0,"explanation":"WBS（Work Breakdown Structure）の100%ルールでは、下位要素の合計が上位要素の作業範囲全体を表すよう分解します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"WBS完全性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-milestone-374","questionText":"設計完了や受入れ承認など、期間を持たず進捗上の重要な節目を表すものはどれですか。","choices":["ワークパッケージ","マイルストーン","リスク許容度","サービス要求"],"correctChoiceIndex":1,"explanation":"マイルストーンは重要な到達点を示します。通常は所要期間を持たず、成果物の完了や承認時点を管理します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"進捗節目","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-total-float-375","questionText":"ある作業を遅らせてもプロジェクト全体の完了日へ影響しない最大時間を何と呼びますか。","choices":["クリティカルパス","実コスト","トータルフロート","品質尺度"],"correctChoiceIndex":2,"explanation":"トータルフロートはプロジェクト完了を遅らせずに許される作業の遅延時間です。通常、クリティカルパス上では0になります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"作業余裕時間","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-critical-path-calc-376","questionText":"クリティカルパス上にあり余裕時間が0日の作業が、予定より2日遅れた。ほかの作業期間を短縮できない場合、プロジェクト完了日はどうなりますか。","choices":["変わらない","1日早まる","作業数に関係なく4日遅れる","2日遅れる"],"correctChoiceIndex":3,"explanation":"クリティカルパス上で余裕時間が0日の作業の遅れは、そのまま全体の完了日に影響します。この条件では2日遅れます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"クリティカルパス遅延影響","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-pert-expected-time-377","questionText":"楽観値1日、最可能値4日、悲観値13日の作業について、PERTの加重平均による期待日数は何日ですか。","choices":["5日","3日","6日","15日"],"correctChoiceIndex":0,"explanation":"PERTの期待値は（楽観値＋4×最可能値＋悲観値）÷6なので、（1＋16＋13）÷6＝5日です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"PERT期待値計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-resource-leveling-378","questionText":"同じ技術者へ同時期に複数作業が集中している。完了日への影響も考慮しながら割当て時期を調整する手法はどれですか。","choices":["スコープ妥当性確認","資源平準化","調達終結","構成監査"],"correctChoiceIndex":1,"explanation":"資源平準化は、要員や設備の過剰割当てを解消するためスケジュールを調整します。場合によって完了日が変わります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"要員負荷平準化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-schedule-crashing-379","questionText":"追加要員や残業費を投入し、クリティカルパス上の作業期間を短縮する方法はどれですか。","choices":["バックアップ","ベンチマーキング","クラッシング","サービス移行"],"correctChoiceIndex":2,"explanation":"クラッシングは追加コストをかけてスケジュールを短縮する方法です。短縮効果と費用、品質やリスクを評価します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"追加費用による期間短縮","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-evm-cost-variance-380","questionText":"出来高が80万円、実コストが100万円のとき、EVMのコスト差異はいくらですか。","choices":["プラス20万円","プラス80万円","マイナス180万円","マイナス20万円"],"correctChoiceIndex":3,"explanation":"コスト差異CVはEV－ACなので、80－100＝マイナス20万円です。負の値は予算超過を表します。EVMはEarned Value Managementの略です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVMコスト差異","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-evm-schedule-variance-381","questionText":"出来高が120万円、計画価値が150万円のとき、EVMのスケジュール差異はいくらですか。","choices":["マイナス30万円","プラス30万円","プラス270万円","マイナス270万円"],"correctChoiceIndex":0,"explanation":"スケジュール差異SVはEV－PVなので、120－150＝マイナス30万円です。負の値は計画より遅れていることを示します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVM進捗差異","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-evm-cpi-382","questionText":"出来高が90万円、実コストが100万円のとき、コスト効率指数CPIはいくつですか。","choices":["0.1","0.9","1.0","1.1"],"correctChoiceIndex":1,"explanation":"CPI（Cost Performance Index）はEV÷ACなので90÷100＝0.9です。1未満は投入コストに対する出来高が低い状態です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVMコスト効率","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-risk-register-383","questionText":"プロジェクトで特定したリスクについて、原因、影響、確率、対応策、担当者を継続管理する記録はどれですか。","choices":["出勤簿","構成品目一覧だけ","リスク登録簿","ユーザ辞書"],"correctChoiceIndex":2,"explanation":"リスク登録簿は特定したリスクと分析結果、対応、所有者、状態などを記録し、プロジェクトを通じて更新します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク記録管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-risk-avoidance-384","questionText":"危険物を扱う機能を計画から外し、そのリスク原因自体をなくす対応はどれですか。","choices":["転嫁","受容","強化","回避"],"correctChoiceIndex":3,"explanation":"リスク回避は脅威の原因となる活動や範囲を変更し、リスクをなくす対応です。保険加入などは転嫁に当たります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク回避対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-risk-transfer-385","questionText":"損害発生時の経済的影響に備えて保険へ加入する対応はどれですか。","choices":["転嫁","回避","軽減","エスカレーションだけ"],"correctChoiceIndex":0,"explanation":"リスク転嫁は保険や契約などで影響の一部を第三者へ移します。リスクそのものが消えるとは限りません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク転嫁対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-quality-assurance-386","questionText":"成果物の欠陥だけを探すのではなく、開発プロセスが定めた標準に従っているかを評価する活動はどれですか。","choices":["品質検査だけ","品質保証","スコープ追加","契約終了"],"correctChoiceIndex":1,"explanation":"品質保証は適切なプロセスを整備・評価して品質を作り込む活動です。個々の成果物を測定する品質管理と役割が異なります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロセス品質保証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-change-control-board-387","questionText":"重要な仕様変更について、影響評価を基に承認・却下・保留を判断する組織はどれですか。","choices":["サービスデスク","監視センターだけ","変更管理委員会","利用者全員の非公式会議"],"correctChoiceIndex":2,"explanation":"変更管理委員会はCCB（Change Control Board）とも呼ばれ、変更要求を統制して基準計画の無秩序な変更を防ぎます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"変更承認組織","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-stakeholder-communication-388","questionText":"経営層には要約、開発者には技術詳細を報告するよう、相手に応じて情報の内容と頻度を定めるものはどれですか。","choices":["データ消去計画","障害回避コード","暗号化鍵一覧","コミュニケーション計画"],"correctChoiceIndex":3,"explanation":"コミュニケーション計画は、誰に何を、いつ、どの方法で伝えるかを定め、必要な情報を適切な粒度で届けます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"関係者報告計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-lessons-learned-389","questionText":"プロジェクト終了時、成功要因と失敗原因を今後の案件で再利用できるよう残す記録はどれですか。","choices":["教訓登録簿","リスク登録簿","課題管理表","WBS"],"correctChoiceIndex":0,"explanation":"Lessons learned（教訓）は、成功要因や失敗原因から得た知識です。プロジェクト中にも収集し、終了時に教訓登録簿へ整理して、将来のプロジェクトで再利用できる組織の知識資産として蓄積します。リスク登録簿はリスク、課題管理表は発生した課題、WBS（Work Breakdown Structure：作業分解構成図）は作業の構成を管理します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト教訓","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-product-backlog-390","questionText":"スクラムで、製品に必要な機能や改善を価値と優先度に基づいて並べ、継続更新する一覧はどれですか。","choices":["インシデント記録","プロダクトバックログ","監査計画","物理構成図だけ"],"correctChoiceIndex":1,"explanation":"プロダクトバックログはプロダクトオーナーが責任を持つ、製品作業の優先順位付き一覧です。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"製品作業優先一覧","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-sprint-review-391","questionText":"スプリント終了時に完成した増分を関係者へ示し、今後の方向やバックログを調整する場はどれですか。","choices":["デイリースクラム","変更凍結会議","スプリントレビュー","内部監査だけ"],"correctChoiceIndex":2,"explanation":"スプリントレビューでは成果を検査し、ステークホルダの意見や環境変化を踏まえて次の計画を適応させます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"増分レビュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-sprint-retrospective-392","questionText":"チームが作業方法や協力の仕方を振り返り、次のスプリントで試す改善を決める場はどれですか。","choices":["受入れ検査だけ","サービス停止会議","契約入札","スプリントレトロスペクティブ"],"correctChoiceIndex":3,"explanation":"レトロスペクティブはチームのプロセスや相互作用を検査し、具体的な改善策を決める振り返りです。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"チーム振り返り","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-daily-scrum-393","questionText":"開発者が毎日短時間で進捗と障害を共有し、その日の計画を調整するイベントはどれですか。","choices":["デイリースクラム","スプリントレビュー","プロジェクト終結","サービス受入れ"],"correctChoiceIndex":0,"explanation":"デイリースクラムは開発者がスプリントゴールへ向けた進捗を確認し、次の一日の計画を適応させるイベントです。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"日次計画調整","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-definition-of-done-394","questionText":"スクラムで、増分が必要な品質基準を満たして完成したと判断する共通条件はどれですか。","choices":["着手の許可だけ","完成の定義","個人別の残業上限","調達先一覧"],"correctChoiceIndex":1,"explanation":"完成の定義は、作業結果が製品増分として利用可能な品質に達したかをチームで共通判断する基準です。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"増分完成基準","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-continuous-integration-395","questionText":"開発者の変更を共有リポジトリへ頻繁に統合し、自動ビルドとテストで問題を早期発見する実践はどれですか。","choices":["年次バックアップ","手動棚卸し","継続的インテグレーション","一括調達"],"correctChoiceIndex":2,"explanation":"CI（Continuous Integration：継続的インテグレーション）は小さな変更を頻繁に統合し、自動検証で統合不具合を早く見つけます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"自動統合検証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-continuous-delivery-396","questionText":"ビルドとテストを通過した変更を、いつでも本番へリリースできる状態まで自動化する実践はどれですか。","choices":["構成品の廃棄","利用者登録の停止","監査証拠の削除","継続的デリバリ"],"correctChoiceIndex":3,"explanation":"CD（Continuous Delivery：継続的デリバリ）は、変更を本番リリース可能な状態へ継続的に整えます。自動デプロイまで行う継続的デプロイとは区別されます。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"継続的リリース準備","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-integration-test-397","questionText":"個別モジュールの単体テスト後、モジュール間のデータ受渡しやインタフェースを確認するテストはどれですか。","choices":["結合テスト","単体テスト","受入れテスト","運用監査"],"correctChoiceIndex":0,"explanation":"結合テストは複数のモジュールやサービスを組み合わせ、接続部分や連携動作を確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"モジュール間連携テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-regression-test-398","questionText":"不具合修正後、修正箇所以外の既存機能が影響を受けていないかを確認するテストはどれですか。","choices":["負荷テストだけ","回帰テスト","侵入テストだけ","移行リハーサルだけ"],"correctChoiceIndex":1,"explanation":"回帰テストは変更によって既存機能へ新しい不具合が生じていないかを再確認します。自動化すると繰返しやすくなります。","category":"マネジメント系","subcategory":"システム開発技術","topic":"変更影響再確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-boundary-value-test-399","questionText":"入力可能な年齢が18～65歳のとき、17、18、65、66を重点的に試す技法はどれですか。","choices":["原因結果グラフ","トップダウンテスト","境界値分析","モンテカルロ法"],"correctChoiceIndex":2,"explanation":"境界値分析は、有効範囲と無効範囲の境界付近で欠陥が生じやすい点に注目してテスト値を選びます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"入力境界テスト","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-equivalence-partition-400","questionText":"入力条件を同じ動作が期待される有効・無効のグループへ分け、各グループの代表値を試す技法はどれですか。","choices":["命令網羅","ガントチャート","デルファイ法","同値分割"],"correctChoiceIndex":3,"explanation":"同値分割は同じ結果になると考えられる入力集合から代表値を選び、少ないケースで効率よく確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"入力同値クラス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-peer-code-review-401","questionText":"プログラムを実行する前に、別の開発者がソースコードを読み、欠陥や保守性を確認する活動はどれですか。","choices":["コードレビュー","動的負荷試験","データ移行","サービス停止"],"correctChoiceIndex":0,"explanation":"コードレビューは静的な確認活動で、実行前にロジック、規約違反、セキュリティ上の問題などを発見できます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"ソース静的レビュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-incident-priority-402","questionText":"サービス障害への対応優先度を決めるとき、基本となる組合せはどれですか。","choices":["担当者の年齢と席順","影響度と緊急度","機器の色と重さ","報告書の文字数と枚数"],"correctChoiceIndex":1,"explanation":"インシデントの優先度は、影響を受ける範囲・重要性と、復旧を急ぐ度合いを組み合わせて判断します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント優先度","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-functional-escalation-403","questionText":"サービスデスクで解決できない技術的な障害を、専門知識を持つ担当部署へ引き継ぐ対応はどれですか。","choices":["階層的エスカレーション","需要予測","機能的エスカレーション","サービス廃止"],"correctChoiceIndex":2,"explanation":"機能的エスカレーションは専門スキルや権限を持つ支援グループへ引き継ぐことです。管理上位者への報告は階層的エスカレーションです。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"専門部署引継ぎ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-known-error-404","questionText":"障害の根本原因と回避策が判明しているが、恒久修正はまだ適用されていない状態の記録はどれですか。","choices":["未承認の要求","完了済み契約","監査範囲外事項","既知のエラー"],"correctChoiceIndex":3,"explanation":"既知のエラーは原因や回避策が把握された問題です。ナレッジとして共有するとインシデントの早期復旧に役立ちます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"既知障害情報","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-change-calendar-405","questionText":"複数システムの変更日時が重なって障害を起こさないよう、予定と停止影響を共有するものはどれですか。","choices":["変更スケジュール","顧客名簿","在庫評価表","個人パスワード表"],"correctChoiceIndex":0,"explanation":"変更スケジュールは承認済み変更の実施時期や影響を可視化し、変更同士の競合や重要業務との衝突を防ぎます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"変更日程調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-cmdb-relationship-406","questionText":"サーバ、アプリ、契約などの構成項目と、それらの依存関係を管理するデータベースはどれですか。","choices":["顧客購買DB","CMDB","全文検索だけの索引","一時ファイル領域"],"correctChoiceIndex":1,"explanation":"CMDB（Configuration Management Database：構成管理データベース）は構成項目の属性と関係を管理し、変更影響分析などに使います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"構成項目関係管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-capacity-threshold-407","questionText":"サーバのCPU使用率が増加傾向にある。性能不足になる前に増強判断を行うため適切な管理はどれですか。","choices":["障害後まで測定しない","最大値を記録せず破棄する","しきい値と需要予測を用いて容量を計画する","利用者数と性能の関係を無視する"],"correctChoiceIndex":2,"explanation":"キャパシティ管理では利用状況を監視し、事業需要を予測して必要な性能・容量を適切な時期に確保します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"容量しきい値管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-availability-calc-408","questionText":"ある月のサービス時間が1,000時間、そのうち停止が10時間だった。可用性は何%ですか。","choices":["90%","99.9%","101%","99%"],"correctChoiceIndex":3,"explanation":"可用性は（サービス時間－停止時間）÷サービス時間×100なので、990÷1,000×100＝99%です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス可用性計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-rto-rpo-service-409","questionText":"災害対策で「業務を4時間以内に再開し、失ってよいデータは直前30分まで」とした。4時間と30分の組合せはどれですか。","choices":["4時間がRTO、30分がRPO","4時間がRPO、30分がRTO","両方ともMTBF","両方ともSLA違反件数"],"correctChoiceIndex":0,"explanation":"RTO（Recovery Time Objective）は目標復旧時間、RPO（Recovery Point Objective）は許容できるデータ損失時点です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"復旧目標区別","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"management-audit-sampling-410","questionText":"大量の取引全件を確認できないため、母集団から一部を選んで統制の有効性を評価する監査手続はどれですか。","choices":["全件削除","監査サンプリング","本番データ改変","監査対象への業務命令"],"correctChoiceIndex":1,"explanation":"監査サンプリングでは、母集団を代表する標本を適切に選び、得た証拠から母集団について結論を導きます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査標本抽出","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-information-entropy-411","questionText":"同じ確率で起こる8種類の事象を区別するため、最低限必要な情報量は何ビットですか。","choices":["2ビット","4ビット","3ビット","8ビット"],"correctChoiceIndex":2,"explanation":"nビットで2のn乗通りを表せます。2の3乗＝8なので、8種類を区別するには3ビット必要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"情報量計算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-twos-complement-412","questionText":"8ビットの2の補数表現で、正の整数1を負の整数－1へ変換したビット列はどれですか。","choices":["00000001","10000001","11111110","11111111"],"correctChoiceIndex":3,"explanation":"2の補数では全ビットを反転して1を加えます。00000001を反転した11111110に1を加えると11111111です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"2の補数表現","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-binary-fraction-413","questionText":"2進数の小数0.101を10進数で表した値はどれですか。","choices":["0.625","0.101","0.5","0.75"],"correctChoiceIndex":0,"explanation":"小数点以下の各桁は左から1/2、1/4、1/8の重みです。0.101は1/2＋0/4＋1/8＝0.625です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"2進小数変換","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-xor-bit-mask-414","questionText":"ビット列1010と0110について、各桁の排他的論理和を求めた結果はどれですか。","choices":["0010","1100","1110","1001"],"correctChoiceIndex":1,"explanation":"XORは二つのビットが異なるとき1です。各桁を比べると1 XOR 0、0 XOR 1、1 XOR 1、0 XOR 0で1100です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"排他的論理和計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-set-intersection-415","questionText":"集合A＝{1,2,3,4}、集合B＝{3,4,5}のとき、AとBの積集合はどれですか。","choices":["{1,2,5}","{1,2,3,4,5}","{3,4}","{5}"],"correctChoiceIndex":2,"explanation":"積集合は両方の集合に含まれる要素の集合です。共通する要素は3と4です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"集合の積","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-conditional-probability-416","questionText":"ある検査で陽性だった人の中から、実際に病気である割合を求めたい。この割合はどの確率ですか。","choices":["病気と検査が無関係な確率","全員が病気である確率","陽性者が一人もいない確率","陽性という条件の下で病気である条件付き確率"],"correctChoiceIndex":3,"explanation":"条件付き確率は、ある事象が起きた条件の下で別の事象が起きる確率です。この場合は陽性を条件にします。","category":"テクノロジ系","subcategory":"基礎理論","topic":"条件付き確率","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-median-outlier-417","questionText":"値が10、11、12、13、100のとき、極端な100の影響を平均値より受けにくい代表値はどれですか。","choices":["中央値","算術平均","分散","標準偏差"],"correctChoiceIndex":0,"explanation":"並べた中央の値である中央値は12です。中央値は極端な外れ値によって大きく変化しにくい特徴があります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"外れ値と中央値","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-standard-deviation-418","questionText":"二つの製造工程で平均寸法は同じだった。製品寸法のばらつきが小さい工程を判断する指標はどれですか。","choices":["最頻値だけ","標準偏差","標本数だけ","中央値だけ"],"correctChoiceIndex":1,"explanation":"標準偏差はデータが平均からどの程度散らばっているかを表します。値が小さいほど、平均周辺に集まっています。","category":"テクノロジ系","subcategory":"基礎理論","topic":"データばらつき","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-correlation-causation-419","questionText":"二つの変数に強い相関が見つかったときの解釈として適切なものはどれですか。","choices":["必ず直接の因果関係がある","第三の要因は存在しない","相関だけでは一方が他方の原因とは断定できない","データ数に関係なく結論は同じになる"],"correctChoiceIndex":2,"explanation":"相関は一緒に変化する傾向を示しますが、因果関係の証明ではありません。交絡要因や偶然の可能性も検討します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"相関と因果","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-queue-breadth-first-420","questionText":"木構造を根から近い階層順に探索する幅優先探索で、未処理ノードの管理に適したデータ構造はどれですか。","choices":["スタックだけ","連想配列だけ","固定小数点数","キュー"],"correctChoiceIndex":3,"explanation":"幅優先探索は先に追加したノードから処理するFIFOのキューを使うと、階層の近い順に探索できます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"幅優先探索キュー","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-stack-expression-421","questionText":"関数呼出しの戻り先や局所変数を、呼出し順と逆順に取り出すために使われる領域はどれですか。","choices":["スタック","キュー","キャッシュDNS","ハッシュ値"],"correctChoiceIndex":0,"explanation":"スタックは後入れ先出しの構造です。関数呼出しでは最後に呼んだ関数から戻るため、呼出し情報の管理に適します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"呼出しスタック","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-hash-collision-422","questionText":"ハッシュ表で異なる二つのキーから同じ格納位置が計算された状態はどれですか。","choices":["再帰","衝突","オーバフローだけ","正規化"],"correctChoiceIndex":1,"explanation":"ハッシュの衝突は異なるキーが同じハッシュ値や位置へ割り当てられることです。チェイン法やオープンアドレス法などで処理します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"ハッシュ衝突","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-stable-sort-423","questionText":"同じ得点のデータについて、整列前の受付順を整列後も維持したい。必要な整列アルゴリズムの性質はどれですか。","choices":["必ず再帰を使うこと","比較を一度もしないこと","安定であること","常に逆順にすること"],"correctChoiceIndex":2,"explanation":"安定な整列では、キーが等しい要素同士の元の順序が維持されます。複数キーで段階的に整列する場合にも重要です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"安定ソート","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-quicksort-pivot-424","questionText":"クイックソートで、データを大小のグループへ分割する基準として選ぶ値はどれですか。","choices":["センチネル","スタックポインタ","チェックサム","ピボット"],"correctChoiceIndex":3,"explanation":"クイックソートはピボットを基準に小さい要素と大きい要素へ分割し、各部分を再帰的に整列します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"クイックソート分割","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-binary-search-complexity-425","questionText":"整列済みデータを二分探索するとき、データ件数が約2倍になった場合の比較回数の増え方として適切なものはどれですか。","choices":["おおむね1回増える","必ず2倍になる","必ず4倍になる","件数にかかわらず0回になる"],"correctChoiceIndex":0,"explanation":"二分探索は比較ごとに範囲を半分にするため計算量はO(log n)です。件数が2倍になると最大比較回数はおおむね1回増えます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"二分探索計算量","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-recursion-base-case-426","questionText":"再帰処理が無限に自分を呼び続けないよう、必ず設けるべきものはどれですか。","choices":["全変数の公開","再帰を終了する条件","乱数の固定禁止","通信ポートの開放"],"correctChoiceIndex":1,"explanation":"再帰には基本ケースや停止条件が必要です。条件が満たされる方向へ問題を小さくしないと、スタックを使い切る可能性があります。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"再帰終了条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-loop-trace-427","questionText":"変数xを0で初期化し、iを1から4まで1ずつ増やしながらxにiを加える。終了時のxはいくつですか。","choices":["4","6","10","16"],"correctChoiceIndex":2,"explanation":"xには1、2、3、4が順に加わるため、1＋2＋3＋4＝10です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"繰返し処理追跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-api-idempotency-428","questionText":"同じ更新要求を通信再試行で複数回送っても、結果が一回送った場合と同じになる性質はどれですか。","choices":["可逆圧縮","多重継承","局所性","冪等性"],"correctChoiceIndex":3,"explanation":"冪等性を持つAPIは同じ操作を繰り返しても状態が重複して変化しません。ネットワーク再試行時の二重処理防止に役立ちます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"API冪等性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-rest-get-429","questionText":"REST形式のWeb APIで、資源の状態を取得するために一般的に使うHTTPメソッドはどれですか。","choices":["GET","DELETE","PATCH","CONNECTだけ"],"correctChoiceIndex":0,"explanation":"GETは資源の表現を取得するために使います。更新にはPUTやPATCH、作成にはPOSTなどを用途に応じて使います。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"REST資源取得","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-json-format-430","questionText":"Web APIで、オブジェクトを名前と値の組、配列を角括弧で表す軽量なデータ交換形式はどれですか。","choices":["JPEG","JSON","SQL","CSS"],"correctChoiceIndex":1,"explanation":"JSON（JavaScript Object Notation）は、オブジェクトや配列などをテキストで表すデータ交換形式です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"JSONデータ交換","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-compiler-interpreter-431","questionText":"プログラム全体を事前に機械語などへ変換し、実行可能ファイルを生成する方式はどれですか。","choices":["インタプリタ方式","ラウンドロビン方式","コンパイラ方式","ミラーリング方式"],"correctChoiceIndex":2,"explanation":"コンパイラはソースコードをまとめて目的コードへ変換します。インタプリタは一般に命令を逐次解釈して実行します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"言語処理方式","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-version-control-merge-432","questionText":"別々のブランチで行った変更を一つの履歴へ統合する操作はどれですか。","choices":["ロールバックだけ","デフラグ","スワップアウト","マージ"],"correctChoiceIndex":3,"explanation":"バージョン管理のマージは分岐した変更を統合します。同じ箇所が異なる内容なら競合を解決する必要があります。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"変更履歴統合","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-process-thread-memory-433","questionText":"同じプロセス内の複数スレッドに関する説明として適切なものはどれですか。","choices":["プロセスのメモリ空間を共有して並行実行できる","必ず別々のコンピュータで動く","互いにデータを共有できない","OSの管理を一切受けない"],"correctChoiceIndex":0,"explanation":"スレッドは同じプロセスのアドレス空間や資源を共有します。共有データへ同時アクセスする際は同期が必要です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"プロセス内スレッド","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-context-switch-434","questionText":"CPUが実行するプロセスを切り替える際、レジスタなどの状態を保存・復元する処理はどれですか。","choices":["データマイニング","コンテキストスイッチ","正規化","電子署名"],"correctChoiceIndex":1,"explanation":"コンテキストスイッチは実行状態を退避・復元して処理を切り替えます。頻発すると切替えのオーバヘッドが増えます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"実行文脈切替え","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-page-fault-435","questionText":"仮想記憶で、参照したページが主記憶に存在しないため補助記憶から読み込む事象はどれですか。","choices":["キャッシュヒット","パリティ一致","ページフォールト","DNS応答"],"correctChoiceIndex":2,"explanation":"ページフォールトが起きるとOSは必要なページを補助記憶から主記憶へ読み込みます。頻発すると性能が大きく低下します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"仮想記憶ページ欠落","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-memory-leak-436","questionText":"アプリが不要になったメモリ領域を解放せず、長時間動かすと使用量が増え続ける不具合はどれですか。","choices":["キャッシュヒット","スループット向上","負荷分散","メモリリーク"],"correctChoiceIndex":3,"explanation":"メモリリークは不要な領域への参照や確保が残り、再利用できない状態です。性能低下や異常終了につながります。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"未解放メモリ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-garbage-collection-437","questionText":"プログラムから参照されなくなったメモリ領域を実行環境が自動的に回収する仕組みはどれですか。","choices":["ガベージコレクション","プリエンプション","デフラグだけ","スプーリング"],"correctChoiceIndex":0,"explanation":"ガベージコレクションは不要になったオブジェクトを検出してメモリを再利用可能にします。停止時間などの特性もあります。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"自動メモリ回収","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-cpu-cores-438","questionText":"同じクロック周波数のCPUで、独立した処理を同時に実行しやすくする構成はどれですか。","choices":["キャッシュを全て無効にする","複数のCPUコアを備える","主記憶を外す","入出力を一つに固定する"],"correctChoiceIndex":1,"explanation":"マルチコアCPUは複数の処理を並列実行できます。ただし性能向上には処理側の並列化や他資源の余裕も必要です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"マルチコア並列処理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-cache-locality-439","questionText":"直前に参照したデータの近くを続けて参照するプログラムが、キャッシュを有効活用しやすい性質はどれですか。","choices":["排他性","不可逆性","空間的局所性","匿名性"],"correctChoiceIndex":2,"explanation":"空間的局所性は近接するアドレスが参照されやすい性質です。同じデータが再参照されやすい性質は時間的局所性です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"キャッシュ空間局所性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-gpu-parallel-440","questionText":"大量の画素や行列に対して同種の計算を同時に行う処理で、特に活用される装置はどれですか。","choices":["UPS","NICだけ","光学ドライブ","GPU"],"correctChoiceIndex":3,"explanation":"GPU（Graphics Processing Unit）は多数の演算器による並列処理に適し、画像処理や機械学習などにも利用されます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"GPU並列演算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-hardware-interrupt-441","questionText":"入出力装置が処理完了をCPUへ知らせ、実行中処理を一時中断させる仕組みはどれですか。","choices":["割込み","ポーリングだけ","ページ置換","データ圧縮"],"correctChoiceIndex":0,"explanation":"割込みを使うと、CPUは装置を常時確認せず、通知を受けた時点で対応処理へ移れます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"入出力割込み","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-dma-transfer-442","questionText":"大量の入出力データを装置と主記憶の間で転送するとき、CPUの介入を減らす方式はどれですか。","choices":["DNS","DMA","MFA","WBS"],"correctChoiceIndex":1,"explanation":"DMA（Direct Memory Access：直接メモリアクセス）は専用制御回路が装置と主記憶間を転送し、CPU負荷を軽減します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"直接メモリ転送","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-raid-zero-443","questionText":"複数ディスクへデータを分散して読み書きを高速化するが、冗長性を持たない構成はどれですか。","choices":["RAID 1","RAID 5","RAID 0","単体テープへの世代保管"],"correctChoiceIndex":2,"explanation":"RAID 0はストライピングで性能を高めますが、1台故障すると全体のデータを失う可能性があり、耐障害性はありません。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAIDストライピング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-raid-one-444","questionText":"同じデータを二台のディスクへ書き込み、一台が故障してももう一台から利用できる構成はどれですか。","choices":["RAID 0","JBODだけ","ディスク圧縮","RAID 1"],"correctChoiceIndex":3,"explanation":"RAID 1はミラーリングで同一データを複数ディスクに保持します。利用可能容量は少なくなりますが耐障害性を高めます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAIDミラーリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-raid-six-445","questionText":"複数ディスクに二重のパリティを分散し、同時に二台が故障してもデータを復元できる構成はどれですか。","choices":["RAID 6","RAID 0","RAID 1を一台だけで構成","RAID 5"],"correctChoiceIndex":0,"explanation":"RAID 6は二重パリティを分散して保持するため、二台のディスク故障に耐えられます。容量効率と書込み性能にはコストがあります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID二重パリティ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-ssd-wear-leveling-446","questionText":"フラッシュメモリの特定領域へ書込みが集中しないよう、使用箇所を分散する制御はどれですか。","choices":["スプーリング","ウェアレベリング","ページング","ルーティング"],"correctChoiceIndex":1,"explanation":"ウェアレベリングは書換え回数を平準化し、SSD（Solid State Drive）の寿命低下を抑える技術です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"SSD書換え平準化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-filesystem-journal-447","questionText":"電源断後のファイルシステム整合性回復を早めるため、更新予定を先に記録する仕組みはどれですか。","choices":["データマイニング","ミラーサイト","ジャーナリング","名前解決"],"correctChoiceIndex":2,"explanation":"ジャーナリングは更新操作をログへ記録し、障害後に未完了操作を確認してファイルシステムを回復しやすくします。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"ファイル更新ジャーナル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-file-fragmentation-448","questionText":"一つのファイルがディスク上の離れた複数領域へ分かれて保存され、HDDのアクセスが遅くなる状態はどれですか。","choices":["レプリケーション","正規化","仮想化","フラグメンテーション"],"correctChoiceIndex":3,"explanation":"フラグメンテーションはデータ配置が断片化した状態です。HDDではヘッド移動が増えて性能へ影響する場合があります。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"ファイル断片化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-incremental-restore-449","questionText":"日曜にフルバックアップ、月曜と火曜に増分バックアップを取得した。火曜終了時点へ戻すために必要な媒体はどれですか。","choices":["日曜のフルと月曜・火曜の増分","火曜の増分だけ","日曜のフルだけ","月曜の増分だけ"],"correctChoiceIndex":0,"explanation":"増分バックアップは直前のバックアップ以降の変更を保存します。復元には基点のフルと、その後の全増分が必要です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"増分バックアップ復元","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-storage-snapshot-450","questionText":"仮想マシン更新前に、ある時点のディスク状態を短時間で記録し、問題時に戻せるようにする機能はどれですか。","choices":["データウェアハウス","スナップショット","DNSゾーン","ソースコード整形"],"correctChoiceIndex":1,"explanation":"スナップショットは特定時点の状態を記録します。単独では別媒体のバックアップにならない場合があるため用途を区別します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"時点状態保存","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-relational-join-451","questionText":"顧客表と注文表を顧客IDが一致する行同士で組み合わせ、顧客名と注文内容を得る操作はどれですか。","choices":["射影だけ","選択だけ","結合","排他だけ"],"correctChoiceIndex":2,"explanation":"結合は共通する列などの条件で複数の表を組み合わせます。射影は列、選択は行を取り出す操作です。","category":"テクノロジ系","subcategory":"データベース","topic":"関係表結合","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-candidate-key-452","questionText":"表の行を一意に識別できる最小の列の組合せが複数あるとき、それらをまとめて何と呼びますか。","choices":["外部キー","非キー属性","ビュー","候補キー"],"correctChoiceIndex":3,"explanation":"候補キーは一意性と最小性を持つキー候補です。その中から主キーを一つ選びます。","category":"テクノロジ系","subcategory":"データベース","topic":"候補キー最小性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-referential-integrity-453","questionText":"注文表の顧客IDが、顧客表に存在しない値を参照しないようにする制約はどれですか。","choices":["参照整合性制約","文字数固定だけ","表示順制約","圧縮率制約"],"correctChoiceIndex":0,"explanation":"外部キーによる参照整合性は、参照先に存在するキーだけを登録可能にし、表間の関係矛盾を防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"外部キー参照整合性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-third-normal-form-454","questionText":"社員IDを主キーとする表に、部署IDと部署名があり、部署名が部署IDだけで決まる。第3正規形へ近づける対応はどれですか。","choices":["部署名を全て空欄にする","部署IDと部署名を部署表へ分離する","社員IDを毎回変更する","全列を一つの文字列へ結合する"],"correctChoiceIndex":1,"explanation":"部署名は主キーから部署IDを経由して決まる推移的関数従属です。部署情報を分離すると更新時の不整合を減らせます。","category":"テクノロジ系","subcategory":"データベース","topic":"推移的従属除去","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-sql-group-by-455","questionText":"購入履歴から、購入した顧客IDの重複を除いて顧客数を数えるSQLの式はどれですか。","choices":["SUM(顧客ID)","ORDER BY 顧客ID","COUNT(DISTINCT 顧客ID)","DELETE 顧客ID"],"correctChoiceIndex":2,"explanation":"COUNT(DISTINCT 列名)は重複する値を除いて件数を数えます。COUNT(列名)はNULLを除く行数を数えますが、重複値は除きません。","category":"テクノロジ系","subcategory":"データベース","topic":"SQL重複除外件数","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-sql-having-456","questionText":"商品別に集計した売上合計が100万円以上のグループだけを抽出したい。集計結果の条件指定に使う句はどれですか。","choices":["WHERE句だけ","INSERT句","COMMIT句","HAVING句"],"correctChoiceIndex":3,"explanation":"HAVING句はGROUP BYで集約した後のグループへ条件を指定します。WHERE句は原則として集約前の行を絞ります。","category":"テクノロジ系","subcategory":"データベース","topic":"SQL集約条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-acid-atomicity-457","questionText":"振込処理で、出金だけ成功して入金が失敗する状態を防ぎ、処理全体を成功か取消しのどちらかにする性質はどれですか。","choices":["原子性","一貫性だけ","独立性だけ","耐久性だけ"],"correctChoiceIndex":0,"explanation":"原子性（Atomicity）はトランザクション内の処理を全て実行するか、全て取り消すかのどちらかにします。","category":"テクノロジ系","subcategory":"データベース","topic":"トランザクション原子性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-dirty-read-458","questionText":"別トランザクションがまだコミットしていない更新値を読み、その後その更新がロールバックされた。この読取りはどれですか。","choices":["ファントムリードだけ","ダーティリード","チェックポイント","ロールフォワード"],"correctChoiceIndex":1,"explanation":"ダーティリードは未確定データを読み取る現象です。適切な分離レベルや排他制御で防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"未確定データ読取り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-database-checkpoint-459","questionText":"DBMSが障害復旧時にログを先頭からすべて再実行せずに済むよう、一定時点の整合した状態を記録する仕組みはどれですか。","choices":["デッドロック","外部キー","チェックポイント","射影演算"],"correctChoiceIndex":2,"explanation":"チェックポイントは一定時点までの更新状態を記録します。障害復旧ではその時点以降のログを主に処理できるため、復旧時間を短縮できます。","category":"テクノロジ系","subcategory":"データベース","topic":"DB障害復旧起点","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-optimistic-lock-460","questionText":"更新時に版番号が読取り時から変わっていないかを確認し、競合時だけやり直す制御はどれですか。","choices":["悲観的ロックで常時占有する","物理ディスク暗号化","DNSラウンドロビン","楽観的ロック"],"correctChoiceIndex":3,"explanation":"楽観的ロックは競合が少ない前提で、更新時の版番号などを比較して他更新を検出します。","category":"テクノロジ系","subcategory":"データベース","topic":"版番号競合検出","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-database-index-tradeoff-461","questionText":"検索対象列へインデックスを追加するときの一般的なトレードオフはどれですか。","choices":["検索を速めやすいが更新時の管理負荷と容量が増える","検索も更新も必ず無制限に速くなる","データ本体が必ず消える","主キーを使用できなくなる"],"correctChoiceIndex":0,"explanation":"インデックスは検索範囲を絞りやすくしますが、追加・更新・削除時に索引も更新し、保存領域も必要です。","category":"テクノロジ系","subcategory":"データベース","topic":"索引性能トレードオフ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-database-replication-462","questionText":"同じデータの複製を複数サーバへ保持し、読取り分散や障害時の切替えに利用する仕組みはどれですか。","choices":["正規化","レプリケーション","デフラグ","構文解析"],"correctChoiceIndex":1,"explanation":"レプリケーションはデータを複製先へ反映します。更新遅延や整合性、切替え方式を設計する必要があります。","category":"テクノロジ系","subcategory":"データベース","topic":"データ複製","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-cap-tradeoff-463","questionText":"ネットワーク分断中でも処理を継続する分散データベースで、強い一貫性との間に判断が必要になる考え方はどれですか。","choices":["ACIDの原子性だけ","OSI参照モデル","CAP定理","著作権保護期間"],"correctChoiceIndex":2,"explanation":"CAP定理はConsistency、Availability、Partition toleranceの三特性を分断時に同時には完全保証できないという考え方です。","category":"テクノロジ系","subcategory":"データベース","topic":"分散DB特性選択","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-data-warehouse-464","questionText":"販売、顧客、在庫など複数業務から履歴データを統合し、経営分析用に蓄積する基盤はどれですか。","choices":["トランザクションログだけ","DNSサーバ","プリントキュー","データウェアハウス"],"correctChoiceIndex":3,"explanation":"データウェアハウスは分析しやすい形に統合した時系列データを蓄積し、BIなどの意思決定支援に利用します。","category":"テクノロジ系","subcategory":"データベース","topic":"分析統合データ基盤","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-vlan-segmentation-465","questionText":"一台の物理スイッチに接続された端末を、部署ごとの論理的なブロードキャストドメインへ分割する技術はどれですか。","choices":["VLAN","CDN","NTP","UPS"],"correctChoiceIndex":0,"explanation":"VLAN（Virtual Local Area Network）は、物理構成に依存せずLANを論理的に分割します。部署間通信にはルーティングが必要です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"仮想LAN分割","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-router-network-layer-466","questionText":"異なるIPネットワーク間で、宛先IPアドレスと経路表を基にパケットを中継する装置はどれですか。","choices":["リピータ","ルータ","キーボード","バーコードリーダ"],"correctChoiceIndex":1,"explanation":"ルータはネットワーク層で経路選択を行い、異なるネットワーク間のパケットを中継します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IP経路中継","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-subnet-host-count-467","questionText":"IPv4のネットワーク192.0.2.0/29で、一般的にホストへ割り当て可能なアドレス数はいくつですか。","choices":["2個","8個","6個","29個"],"correctChoiceIndex":2,"explanation":"/29ではホスト部が3ビットなので8アドレスです。ネットワークアドレスとブロードキャストアドレスを除くと6個です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv4サブネット計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-private-ipv4-468","questionText":"組織内LANで利用でき、インターネット上ではそのまま経路制御されないプライベートIPv4アドレスはどれですか。","choices":["8.8.8.8","198.51.100.20","203.0.113.5","192.168.10.20"],"correctChoiceIndex":3,"explanation":"192.168.0.0/16はプライベートアドレス範囲です。外部通信では通常NATなどによってグローバルアドレスへ変換します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv4私設アドレス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-ipv6-compression-469","questionText":"IPv6アドレス内で連続する0のブロックを一度だけ省略して表す記号はどれですか。","choices":["二つのコロン「::」","一つのピリオド「.」","スラッシュだけ「/」","アットマーク「@」"],"correctChoiceIndex":0,"explanation":"IPv6では連続する0のブロックを::で一度だけ省略できます。複数箇所で使うと元の長さを一意に復元できません。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv6省略表記","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-arp-resolution-470","questionText":"同一LAN上で、既知のIPv4アドレスに対応するMACアドレスを問い合わせるプロトコルはどれですか。","choices":["SMTP","ARP","NTP","IMAP"],"correctChoiceIndex":1,"explanation":"ARP（Address Resolution Protocol）はIPv4アドレスから同一リンク上のMACアドレスを解決します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv4アドレス解決","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-dns-ttl-471","questionText":"DNSレコードをキャッシュへ保持してよい時間を秒単位などで示す値はどれですか。","choices":["MTTR","RPO","TTL","CPI"],"correctChoiceIndex":2,"explanation":"TTL（Time To Live）はDNSキャッシュの有効期間を示します。変更反映速度と問合せ負荷のバランスを考えて設定します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DNSキャッシュ有効期間","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-dhcp-lease-472","questionText":"端末へIPアドレスを一定期間だけ自動割当てし、期限後に更新または返却させる仕組みはどれですか。","choices":["DNSゾーン転送","SMTPリレー","HTTPリダイレクト","DHCPリース"],"correctChoiceIndex":3,"explanation":"DHCP（Dynamic Host Configuration Protocol）はIPアドレスやゲートウェイなどを貸出期間付きで自動設定します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPアドレス貸出し","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-napt-port-473","questionText":"複数の社内端末が一つのグローバルIPv4アドレスを共有するとき、端末ごとの通信を区別する主な情報はどれですか。","choices":["ポート番号","画面解像度","ファイル名","CPUクロック"],"correctChoiceIndex":0,"explanation":"NAPT（Network Address Port Translation）はIPアドレスに加えてポート番号を変換し、複数端末の通信を識別します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NAPT通信識別","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-tcp-handshake-474","questionText":"TCPで通信開始時に接続を確立するため交換する代表的な順序はどれですか。","choices":["ACK、FIN、RST","SYN、SYN-ACK、ACK","GET、POST、DELETE","EHLO、MAIL、QUIT"],"correctChoiceIndex":1,"explanation":"TCP（Transmission Control Protocol）は3ウェイハンドシェイクで双方の送受信準備を確認して接続を確立します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"TCP接続確立","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-udp-use-475","questionText":"多少のパケット欠落より遅延の小ささを優先するリアルタイム音声配信で使われやすいトランスポートプロトコルはどれですか。","choices":["TCPだけ","ARP","UDP","DNSだけ"],"correctChoiceIndex":2,"explanation":"UDP（User Datagram Protocol）は接続確立や再送制御を簡略化し、低遅延が重視される用途で使われます。必要な補償はアプリ側で行います。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"低遅延データグラム","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-http-cache-control-476","questionText":"Web応答について、ブラウザや中継キャッシュへ保存可否や有効時間を指示する代表的なヘッダはどれですか。","choices":["Content-Lengthだけ","User-Agentだけ","Hostだけ","Cache-Control"],"correctChoiceIndex":3,"explanation":"Cache-Controlヘッダはmax-ageやno-storeなどでキャッシュ動作を制御し、性能と情報鮮度・機密性を調整します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTPキャッシュ制御","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-https-hostname-477","questionText":"HTTPS接続時、ブラウザがサーバ証明書について確認する事項として適切なものはどれですか。","choices":["接続先ホスト名が証明書の対象と一致するか","画面の色が証明書と同じか","利用者の保存ファイル数","CPU使用率が常に0か"],"correctChoiceIndex":0,"explanation":"HTTPS（Hypertext Transfer Protocol Secure）は、TLS（Transport Layer Security）を用いて通信を保護します。ブラウザは、証明書の信頼性、有効期限、接続先ホスト名が証明書の対象と一致するかなどを検証します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"TLS証明書ホスト確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-smtp-relay-478","questionText":"電子メールを送信側のメールサーバから受信側のメールサーバへ転送する際に使うプロトコルはどれですか。","choices":["POP3","SMTP","IMAP4","SNMP"],"correctChoiceIndex":1,"explanation":"SMTP（Simple Mail Transfer Protocol）は電子メールの送信やサーバ間転送に使います。受信にはPOP3やIMAP4が使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"メールサーバ間転送","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-imap-sync-479","questionText":"複数端末で既読状態やフォルダを共有し、メールをサーバ上で管理しながら閲覧するプロトコルはどれですか。","choices":["FTP","DHCP","IMAP4","ARP"],"correctChoiceIndex":2,"explanation":"IMAP4（Internet Message Access Protocol version 4）はメールをサーバ上で管理し、複数端末から状態を同期しやすい方式です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"メール状態同期","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-vpn-split-tunnel-480","questionText":"社内向け通信だけをVPNへ通し、一般のWeb閲覧は端末から直接インターネットへ送る構成はどれですか。","choices":["フルトンネルだけの構成","ポートミラーリング","リンクアグリゲーション","スプリットトンネリング"],"correctChoiceIndex":3,"explanation":"スプリットトンネリングは通信先に応じてVPN経由と直接通信を分けます。負荷を減らせますが、セキュリティ方針に沿った制御が必要です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"VPN経路分割","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-wifi-wpa3-481","questionText":"無線LANで、古いWEPより強い暗号化と認証を提供する現在のセキュリティ規格として適切なものはどれですか。","choices":["WPA3","HTTP","VGA","RAID 0"],"cor
