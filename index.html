:"management-milestone-trend-813","questionText":"複数回の報告時点で主要な節目の予定日を記録し、右方向へのずれから遅延傾向を把握する分析はどれですか。","choices":["マイルストーン・トレンド分析","パレート分析","損益分岐点分析","アクセスログ分析"],"correctChoiceIndex":0,"explanation":"マイルストーン・トレンド分析は節目の予定日の変化を時系列で示し、遅延の兆候を早期に把握します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"マイルストーン傾向分析","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-evm-cost-variance-new-814","questionText":"出来高EVが150万円、実コストACが170万円のとき、コスト差異CVはどれですか。","choices":["20万円","マイナス20万円","マイナス320万円","320万円"],"correctChoiceIndex":1,"explanation":"CV＝EV－AC＝150－170＝マイナス20万円です。負のコスト差異は予算超過を示します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVMコスト差異計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-evm-schedule-variance-new-815","questionText":"出来高EVが90万円、計画価値PVが100万円のとき、スケジュール差異SVはどれですか。","choices":["10万円","90万円","マイナス10万円","190万円"],"correctChoiceIndex":2,"explanation":"SV＝EV－PV＝90－100＝マイナス10万円です。負の値は計画より進捗が遅れていることを示します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVM進捗差異計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-defect-density-816","questionText":"規模1,000行のプログラムからテストで20件の欠陥が見つかった。1行当たりの欠陥密度はどれですか。","choices":["0.2件／行","20件／行","50件／行","0.02件／行"],"correctChoiceIndex":3,"explanation":"欠陥密度は欠陥数÷規模なので、20÷1,000＝0.02件／行です。品質の傾向比較に使います。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"欠陥密度計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-evm-spi-meaning-817","questionText":"EVMでSPIが1.1だった。この状況の説明として適切なものはどれですか。","choices":["計画価値より出来高が大きく進捗が先行している","実コストが必ず予算を超過している","全リスクが解消した","品質が必ず10%向上した"],"correctChoiceIndex":0,"explanation":"SPI（Schedule Performance Index）はEV÷PVです。1を上回る場合、価値基準の進捗は計画より先行しています。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"SPI評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-risk-avoidance-818","questionText":"高リスクな独自決済機能の開発をやめ、実績ある外部決済サービスを利用する対応はどれですか。","choices":["リスク受容","リスク回避","リスク保有だけ","リスク増大"],"correctChoiceIndex":1,"explanation":"リスク回避は脅威の原因となる活動や計画を変更し、そのリスク自体をなくす対応です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク回避","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-risk-acceptance-819","questionText":"影響が小さく対策費が大きいリスクについて、監視だけ行い発生時に対応すると決める方法はどれですか。","choices":["リスク回避","リスク転嫁","リスク受容","リスク隠蔽"],"correctChoiceIndex":2,"explanation":"リスク受容は事前対策を追加せず、必要に応じて予備費や発生時対応を用意する判断です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク受容","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-risk-probability-impact-820","questionText":"特定した脅威の優先順位を決めるため、発生しやすさと発生時の損失を組み合わせて評価する方法はどれですか。","choices":["担当者数だけの比較","文書ページ数だけの比較","開始日の曜日だけの比較","発生確率と影響度の評価"],"correctChoiceIndex":3,"explanation":"発生確率と影響度を組み合わせた評価により、限られた資源を重要なリスクへ優先配分できます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク確率影響評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-scope-creep-821","questionText":"プロジェクト中に利用部門から新しい機能の追加要求が出された。スコープクリープを防ぐ対応として最も適切なものはどれですか。","choices":["納期・費用・品質・作業範囲への影響を評価し、正式な承認を得てから計画へ反映する","小さな要求なら承認せず直ちに追加する","追加要求は記録せず口頭だけで対応する","影響を確認せず既存計画へ追加する"],"correctChoiceIndex":0,"explanation":"変更要求は記録し、納期、費用、品質、作業範囲などへの影響を評価します。正式な承認を得た後で計画やスコープへ反映します。この手順を経ない無管理な要求追加は、スコープクリープにつながります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"スコープ変更管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-change-impact-analysis-822","questionText":"変更要求を承認する前に、日程、費用、品質、リスクへの影響を調べる活動はどれですか。","choices":["即時本番反映","変更影響分析","証拠の廃棄","要求の無条件承認"],"correctChoiceIndex":1,"explanation":"変更影響分析で複数制約への影響を把握し、承認・却下・延期を合理的に判断します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"変更影響分析","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-stakeholder-engagement-823","questionText":"利用部門が新システムに不安を示している。早期に説明会と試用機会を設ける主な目的はどれですか。","choices":["利用部門の意見を遮断する","要求を全て削除する","理解と参加を促して抵抗を減らす","監査を不要にする"],"correctChoiceIndex":2,"explanation":"ステークホルダの関心と影響を把握し、適切な関与を促すと合意形成と導入受容を進められます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ステークホルダ関与","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-communication-plan-824","questionText":"誰に、何を、いつ、どの手段で報告するかを定める計画はどれですか。","choices":["調達在庫表","暗号鍵一覧","データ辞書","コミュニケーション計画"],"correctChoiceIndex":3,"explanation":"コミュニケーション計画は情報の受け手、内容、頻度、手段、責任者を定め、伝達漏れを防ぎます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト情報伝達計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-team-conflict-825","questionText":"チーム内で意見が対立したとき、共通目標と事実を確認し、双方が受け入れられる案を探す対応はどれですか。","choices":["協力して問題を解決する","対立を永続的に放置する","情報を隠して競争させる","一方を理由なく排除する"],"correctChoiceIndex":0,"explanation":"協力的な問題解決は対立の原因と利害を明らかにし、共通目標に沿う合意を目指します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"チーム対立解決","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-incident-objective-826","questionText":"利用者が使えなくなったメールサービスについて、通常利用できる状態を早く回復する活動はどれですか。","choices":["問題管理","インシデント管理","財務管理","需要予測だけ"],"correctChoiceIndex":1,"explanation":"インシデント管理の主目的はサービスを可能な限り早く正常状態へ戻し、事業への影響を抑えることです。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント早期復旧","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-problem-root-cause-827","questionText":"同じ障害が繰り返されるため、背後にある根本原因を調査して再発防止策を管理する活動はどれですか。","choices":["サービス要求管理","販売管理","問題管理","アクセス記録削除"],"correctChoiceIndex":2,"explanation":"問題管理はインシデントの原因を特定し、回避策や恒久対策によって再発と影響を減らします。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"問題管理根本原因","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-workaround-828","questionText":"恒久修正までの間、特定の操作で障害を避けてサービスを利用できるようにする方法はどれですか。","choices":["サービス停止命令","要件追加","予算凍結","回避策"],"correctChoiceIndex":3,"explanation":"回避策は根本原因を解消しなくても、インシデントの影響を一時的に減らす既知の方法です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"障害回避策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-first-contact-resolution-829","questionText":"利用者からの問い合わせを他部署へ回さず、最初の窓口対応だけで解決できた割合を測る指標はどれですか。","choices":["初回対応解決率","平均故障間隔","在庫回転率","自己資本比率"],"correctChoiceIndex":0,"explanation":"初回対応解決率は最初の接点で解決した割合で、利用者の利便性やサービスデスクの有効性を見る指標です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"初回対応解決率","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-incident-priority-830","questionText":"障害対応の優先度を決めるとき、組み合わせて評価する代表的な二つの観点はどれですか。","choices":["画面色と文字数","影響度と緊急度","担当者の年齢と席順","ファイル名と拡張子"],"correctChoiceIndex":1,"explanation":"多くのサービス管理では、事業や利用者への影響度と、対応を急ぐ必要性である緊急度から優先度を決めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント優先度決定","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-change-calendar-831","questionText":"複数の本番変更が同じ時間帯に集中しないよう、実施予定を共有するものはどれですか。","choices":["顧客名簿","売上台帳","変更カレンダー","暗号辞書"],"correctChoiceIndex":2,"explanation":"変更カレンダーで予定、影響、責任者を共有すると、変更の競合や業務上の重要日との衝突を減らせます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"変更カレンダー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-change-post-review-832","questionText":"本番変更後に、目的達成、障害の有無、手順の改善点を確認する活動はどれですか。","choices":["要件の無条件追加","監査証拠の削除","顧客情報の公開","変更後レビュー"],"correctChoiceIndex":3,"explanation":"変更後レビューは実施結果を評価し、失敗原因や学びを今後の変更管理へ反映します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"変更後レビュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-configuration-baseline-833","questionText":"ある時点で承認されたサーバ、ソフトウェア、設定の構成を記録し、変更比較の基準とするものはどれですか。","choices":["構成ベースライン","販売予測","品質標語","広告原稿"],"correctChoiceIndex":0,"explanation":"構成ベースラインは承認済み構成のスナップショットで、現状との差や不正な変更を確認する基準になります。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"構成ベースライン","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-configuration-impact-834","questionText":"あるサーバを停止する前に、その上で動くアプリと利用業務を構成情報から調べる主な目的はどれですか。","choices":["売上高を自動で増やす","変更の影響範囲を把握する","暗号鍵を公開する","利用者記録を削除する"],"correctChoiceIndex":1,"explanation":"構成品目間の関係をたどると、サーバ変更が依存するサービスや業務へ及ぼす影響を事前評価できます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"構成関係による影響分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-availability-formula-835","questionText":"サービス時間が1,000時間で、目標可用性を99.9％以上とする場合、許容される停止時間の最大値は何時間ですか。","choices":["0.1時間","10時間","1時間","100時間"],"correctChoiceIndex":2,"explanation":"可用性は（サービス時間－停止時間）÷サービス時間×100で求めます。99.9％稼働する場合、停止可能な割合は100％－99.9％＝0.1％です。したがって、許容される停止時間の最大値は1,000時間×0.001＝1時間です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"目標可用性と許容停止時間","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-capacity-monitoring-836","questionText":"CPU使用率や応答時間の推移を監視し、利用増加に備えて増強時期を判断する活動はどれですか。","choices":["著作権管理","要員評価だけ","広告管理","キャパシティ管理"],"correctChoiceIndex":3,"explanation":"キャパシティ管理はCPU（Central Processing Unit）などの現在と将来の需要に対し、必要な性能と容量を費用対効果よく確保します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"性能容量監視","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-service-continuity-plan-837","questionText":"大規模災害でも重要ITサービスを許容時間内に再開するため、代替拠点や復旧手順を準備する活動はどれですか。","choices":["ITサービス継続管理","販売促進管理","画面設計だけ","特許出願"],"correctChoiceIndex":0,"explanation":"ITサービス継続管理は事業継続要求に沿って、災害時の復旧能力と計画を準備・訓練します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"ITサービス継続計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-sla-measurable-838","questionText":"サービス品質の合意事項として、評価しやすい記述はどれですか。","choices":["できるだけ止めない","月間稼働率99.9%以上","十分速く応答する","可能な範囲で支援する"],"correctChoiceIndex":1,"explanation":"SLA（Service Level Agreement）では稼働率、応答時間、受付時間などを測定可能な数値で定めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"測定可能なSLA","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-ola-purpose-839","questionText":"同じ組織内のサービスデスクと運用部門が、復旧時間などの協力条件を定める合意はどれですか。","choices":["NDA","RFP","OLA","BOM"],"correctChoiceIndex":2,"explanation":"OLA（Operational Level Agreement：運用レベル合意）は内部の支援部門間で役割や目標を定めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"運用レベル合意","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-supplier-contract-link-840","questionText":"外部保守会社との契約内容を、利用者へ約束したサービス目標と整合させる主な理由はどれですか。","choices":["利用者との合意を無効にするため","全責任を利用者へ移すため","測定を不要にするため","供給者の支援がサービス目標達成を支えるため"],"correctChoiceIndex":3,"explanation":"外部供給者の対応時間などがSLAを支えられるよう、下位契約の条件を整合させる必要があります。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"供給者契約整合","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-service-request-example-841","questionText":"利用者から申請された、標準ソフトウェアのインストール依頼の分類として適切なものはどれですか。","choices":["サービス要求","重大インシデント","根本原因","監査意見"],"correctChoiceIndex":0,"explanation":"事前に定義された標準的な依頼はサービス要求として、承認や実施手順に従って処理します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"標準サービス要求","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-knowledge-management-842","questionText":"過去の障害解決手順を検索可能にして、担当者が再利用できるようにする活動はどれですか。","choices":["在庫廃棄","ナレッジ管理","鍵長短縮","情報遮断"],"correctChoiceIndex":1,"explanation":"ナレッジ管理は有用な知識を収集、整理、共有し、迅速で一貫したサービス対応を支えます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス知識管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-event-management-843","questionText":"サーバの監視ツールが出す容量警告や停止通知を検知し、必要な対応へつなげる活動はどれですか。","choices":["製品企画","市場調査","イベント管理","資本政策"],"correctChoiceIndex":2,"explanation":"イベント管理は構成品目やサービスの状態変化を監視し、重要度に応じて記録や対応を開始します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービスイベント管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-continual-improvement-register-844","questionText":"サービス改善案、期待効果、優先度、担当、進捗を継続管理する記録はどれですか。","choices":["顧客パスワード一覧","暗号秘密鍵一覧","削除済みログ","改善登録簿"],"correctChoiceIndex":3,"explanation":"改善登録簿は改善機会を一元管理し、価値、リスク、費用などから優先順位を付けて追跡します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"継続的改善登録簿","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-service-value-chain-845","questionText":"需要を受けて製品・サービスを通じた価値へ変換する一連の活動を捉える考え方はどれですか。","choices":["サービスバリューチェーン","製造原価だけ","パケット経路だけ","暗号方式だけ"],"correctChoiceIndex":0,"explanation":"サービスバリューチェーンは計画、改善、関与、設計・移行、取得・構築、提供・支援などの活動を結び付けます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス価値連鎖","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-audit-plan-risk-846","questionText":"限られた監査資源を重要な領域へ配分するため、監査計画の優先順位を決める基礎はどれですか。","choices":["担当者の席順","リスク評価","文書の色","システム名の長さ"],"correctChoiceIndex":1,"explanation":"リスクベース監査では事業への影響と発生可能性などを評価し、高リスク領域を優先します。","category":"マネジメント系","subcategory":"システム監査","topic":"リスクベース監査計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-audit-objectivity-847","questionText":"監査人が個人的な利害や偏見に影響されず、証拠に基づいて判断する性質はどれですか。","choices":["可搬性","拡張性","客観性","圧縮性"],"correctChoiceIndex":2,"explanation":"客観性は先入観や利害から離れ、事実と監査証拠に基づいて公正に評価する姿勢です。","category":"マネジメント系","subcategory":"システム監査","topic":"監査客観性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-continuous-audit-848","questionText":"取引ログを定期的に自動分析し、異常な処理を監査人へ早期通知する監査の取組はどれですか。","choices":["年一回の棚卸しだけ","監査証拠の廃棄","無条件の自己承認","継続的監査"],"correctChoiceIndex":3,"explanation":"継続的監査はデータ分析などを用いて統制や取引を高頻度に評価し、異常の早期発見を支援します。","category":"マネジメント系","subcategory":"システム監査","topic":"継続的監査","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-audit-interview-corroboration-849","questionText":"担当者への聞き取りで得た説明の信頼性を高めるため、監査人が行うべきことはどれですか。","choices":["記録や観察など別の証拠と照合する","説明だけで必ず結論を出す","関連記録を破棄する","質問内容を全て非公開にする"],"correctChoiceIndex":0,"explanation":"聞き取りだけでなく文書、ログ、観察など異なる証拠を組み合わせると、結論の信頼性が高まります。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証拠の裏付け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-audit-reperformance-850","questionText":"統制が正しく機能するか確認するため、監査人が計算や処理を独自にもう一度実行する手続はどれですか。","choices":["質問だけ","再実施","閲覧だけ","広告"],"correctChoiceIndex":1,"explanation":"再実施は監査対象の統制や計算を監査人自身が行い、結果の一致や統制の有効性を確かめます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査再実施","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-audit-finding-elements-851","questionText":"監査で改善提案を分かりやすく伝えるため、現状、基準、原因、影響とともに示すものはどれですか。","choices":["暗号鍵","製品価格表","改善勧告","ネットワーク帯域"],"correctChoiceIndex":2,"explanation":"監査指摘は現状とあるべき基準との差、原因、影響を明らかにし、実行可能な改善勧告へつなげます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査指摘構成","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-internal-control-preventive-852","questionText":"承認されていない支払いを実行前に止めるため、上長承認を必須とする統制はどれですか。","choices":["発見的統制","訂正的統制だけ","代替統制なし","予防的統制"],"correctChoiceIndex":3,"explanation":"予防的統制は誤りや不正が発生する前に防ぐ統制です。承認、職務分離、入力制御などがあります。","category":"マネジメント系","subcategory":"システム監査","topic":"予防的統制","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-internal-control-detective-853","questionText":"毎月の取引一覧から異常な金額を抽出し、発生済みの誤りを見つける統制はどれですか。","choices":["発見的統制","予防的統制","販売促進","製品設計"],"correctChoiceIndex":0,"explanation":"発見的統制は既に発生した誤りや不正を速やかに検出します。照合、例外報告、ログ監視などがあります。","category":"マネジメント系","subcategory":"システム監査","topic":"発見的統制","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-segregation-duties-854","questionText":"一人による不正や誤りを防ぐため、取引の申請、承認、実行、記録を複数人へ分ける考え方はどれですか。","choices":["権限集中","職務分離","記録削除","単独承認"],"correctChoiceIndex":1,"explanation":"職務分離は相互けん制が働くよう相反する職務を分け、単独で不正を完結しにくくします。","category":"マネジメント系","subcategory":"システム監査","topic":"職務分離統制","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-it-governance-monitor-855","questionText":"経営陣がIT投資とリスクを企業目標に沿って方向付け、成果を監視する仕組みはどれですか。","choices":["データ圧縮","画面設計","ITガバナンス","単体テスト"],"correctChoiceIndex":2,"explanation":"ITガバナンスはITの評価、方向付け、モニタリングを通じて価値提供とリスク管理を統治します。","category":"マネジメント系","subcategory":"システム監査","topic":"ITガバナンス監視","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-v-model-test-link-856","questionText":"開発工程と対応するテスト工程をV字形に対応付け、要件と受入確認などの関係を明確にするモデルはどれですか。","choices":["スパイラルモデル","プロトタイプモデル","ビッグバンモデル","V字モデル"],"correctChoiceIndex":3,"explanation":"V字モデルは要件定義と受入テスト、基本設計とシステムテストなど、開発と検証の対応を示します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"V字開発モデル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-agile-iteration-857","questionText":"短い期間ごとに動くソフトウェアを作り、利用者の反応を次の開発へ反映する方法はどれですか。","choices":["アジャイル開発","一括長期凍結だけ","監査サンプリング","設備償却"],"correctChoiceIndex":0,"explanation":"アジャイル開発は短い反復で価値を提供し、フィードバックを取り込んで変化へ適応します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"アジャイル反復開発","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-scrum-product-owner-858","questionText":"スクラムで、製品価値を最大化し、開発項目の優先順位に責任を持つ役割はどれですか。","choices":["スクラムマスター","プロダクトオーナー","監査人","サービスデスク"],"correctChoiceIndex":1,"explanation":"プロダクトオーナーはプロダクトゴールとプロダクトバックログを管理し、価値の優先順位を明確にします。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"スクラム製品責任者","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-scrum-master-859","questionText":"スクラムの理解と実践を支援し、チームの妨げを取り除くよう働きかける役割はどれですか。","choices":["プロダクトオーナー","発注者だけ","スクラムマスター","会計監査人"],"correctChoiceIndex":2,"explanation":"スクラムマスターはスクラムの有効性を高め、チームや組織が自己管理と改善を行えるよう支援します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"スクラム実践支援者","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-devops-collaboration-860","questionText":"開発部門と運用部門が協力し、自動化と継続的改善によって迅速で安定した提供を目指す考え方はどれですか。","choices":["職務の完全断絶","手動作業の固定","監査の廃止","DevOps"],"correctChoiceIndex":3,"explanation":"DevOpsはDevelopmentとOperationsの協働、文化、自動化によって継続的な価値提供を改善します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"DevOps協働","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-unit-test-purpose-861","questionText":"18歳以上を受け付ける年齢判定について、単体テストで境界値付近を確認する入力値の組合せはどれですか。","choices":["17歳、18歳、19歳","18歳、19歳、20歳","1歳、50歳、99歳","17歳だけ"],"correctChoiceIndex":0,"explanation":"境界条件では、判定が切り替わる値の直前、その値、直後を確認します。18歳以上を受け付ける場合は、17歳を拒否し、18歳と19歳を受け付けることを単体テストで確かめます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"単体テストの境界条件","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-integration-test-purpose-862","questionText":"自社システムから外部サービスを呼び出す機能の結合テストで、特に確認すべきものはどれですか。","choices":["画面の背景色だけが設計書と一致しているか","送受信するデータ形式やエラー応答、接続失敗時の動作が仕様どおりか","個々の関数内部の計算式だけが正しいか","プログラム全体のソースコード行数が一定か"],"correctChoiceIndex":1,"explanation":"結合テストでは、構成要素間の連携が仕様どおりかを確認します。外部サービスとの連携では、送受信するリクエストやレスポンスのデータ形式、エラー応答、接続失敗時の処理などを確認します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"外部サービス連携の結合テスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-system-test-purpose-863","questionText":"完成したシステム全体が、機能・性能・セキュリティなどの要件を満たすか確認するテストはどれですか。","choices":["単体テスト","コードレビューだけ","システムテスト","市場調査"],"correctChoiceIndex":2,"explanation":"システムテストは統合済みのシステム全体を対象に、定義されたシステム要件を検証します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"システムテスト","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-black-box-test-864","questionText":"プログラム内部の構造を見ず、入力と期待される出力の関係から機能を確認する方法はどれですか。","choices":["ホワイトボックステスト","コードレビューだけ","監査サンプリング","ブラックボックステスト"],"correctChoiceIndex":3,"explanation":"ブラックボックステストは外部仕様に基づき、同値分割や境界値分析などで入出力を検証します。","category":"マネジメント系","subcategory":"システム開発技術","topic":"ブラックボックステスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"management-regression-test-purpose-865","questionText":"ある機能を修正した後に回帰テストを行う。テスト対象の選び方として最も適切なものはどれですか。","choices":["修正した機能だけでなく、変更の影響を受ける可能性がある既存の周辺機能も確認する","修正した1行だけ確認し、他の既存機能は一切確認しない","新規機能だけ確認し、以前からある機能は対象外とする","ソースコードの文字数だけを確認する"],"correctChoiceIndex":0,"explanation":"回帰テストは、変更によって既存機能へ予期しない影響が生じていないか確認するテストです。修正箇所だけでなく、変更の影響を受ける可能性がある関連機能も対象にし、変更内容と影響範囲を考えて確認対象を選びます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"回帰テストの対象範囲","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-unsigned-eight-range-866","questionText":"符号なし8ビットで表現できる10進整数の範囲はどれですか。","choices":["－128～127","0～255","0～127","1～256"],"correctChoiceIndex":1,"explanation":"符号なし8ビットは2の8乗＝256通りを表せるため、最小0、最大255です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"符号なし整数範囲","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"tech ":"2026-08-31T00:00:00+09:00"},{"id":"technology-flowchart-decision-885","questionText":"フローチャートで条件を判定し、結果によって処理を分岐するときに使う図形はどれですか。","choices":["ひし形","長方形","平行四辺形","円だけ"],"correctChoiceIndex":0,"explanation":"フローチャートでは一般に、ひし形が判断、長方形が処理、平行四辺形が入出力を表します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"フローチャート判断記号","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cpu-control-unit-886","questionText":"命令を解読し、演算装置や記憶装置へ動作の指示を出すCPU内の部分はどれですか。","choices":["演算装置","制御装置","補助記憶装置","入力装置"],"correctChoiceIndex":1,"explanation":"CPU（Central Processing Unit：中央処理装置）の制御装置は命令を取り出して解読し、各装置へ制御信号を送ります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"CPU制御装置","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cpu-alu-887","questionText":"加算や比較、論理演算を実行するCPU内の部分はどれですか。","choices":["制御装置","磁気ディスク","演算装置","表示装置"],"correctChoiceIndex":2,"explanation":"CPU（Central Processing Unit）内のALU（Arithmetic Logic Unit）は算術演算や論理演算を担当します。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"CPU演算装置","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-clock-cycle-time-888","questionText":"クロック周波数が2GHzのCPUについて、1クロックの時間はどれですか。","choices":["2ns","5ns","20ns","0.5ns"],"correctChoiceIndex":3,"explanation":"CPUはCentral Processing Unitの略です。2GHzは毎秒20億回なので、1÷20億秒＝0.5nsです。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"クロック周期計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-multicore-purpose-889","questionText":"動画変換とウイルス検査など独立した仕事を並行して処理するとき、複数の演算コアを持つCPUに期待できる効果はどれですか。","choices":["並行可能な処理の実行性能を高められる","主記憶を不要にできる","全処理を必ず1命令にできる","電源なしで動作できる"],"correctChoiceIndex":0,"explanation":"CPU（Central Processing Unit）の複数コアは独立した処理を並行実行でき、対応ソフトウェアの処理能力を高めます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"マルチコアCPU","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cache-hit-rate-890","questionText":"100回のメモリアクセスのうち90回が高速な一時記憶で見つかった。この割合はどれですか。","choices":["10%","90%","50%","190%"],"correctChoiceIndex":1,"explanation":"ヒット率は目的データがキャッシュに存在した回数÷全アクセス回数なので90÷100＝90%です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"キャッシュヒット率","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ram-role-new-891","questionText":"実行中のプログラムと処理中のデータを一時保持し、電源断で内容が失われる装置はどれですか。","choices":["ROM","SSD","RAM","Blu-ray Disc"],"correctChoiceIndex":2,"explanation":"RAM（Random Access Memory）は主記憶として使われる揮発性メモリです。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"主記憶RAM","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-rom-role-892","questionText":"電源を切っても内容を保持し、機器の起動用プログラムなどを格納するメモリはどれですか。","choices":["RAM","キャッシュだけ","レジスタだけ","ROM"],"correctChoiceIndex":3,"explanation":"ROM（Read Only Memory）は不揮発性で、ファームウェアなど変更頻度の低いデータの保持に利用されます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"不揮発性ROM","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ssd-hdd-difference-893","questionText":"磁気ディスク装置と比べた半導体記憶装置の一般的な特徴はどれですか。","choices":["可動部品がなく衝撃に比較的強い","必ず容量が無限である","電源なしで計算できる","磁気ヘッドで読み書きする"],"correctChoiceIndex":0,"explanation":"SSDは半導体メモリを使い機械的な可動部がないため、一般に高速で衝撃にも比較的強い特徴があります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"SSDの特徴","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-raid-five-894","questionText":"三台以上のディスクにデータと復元用のパリティを分散し、一台の故障へ耐える構成はどれですか。","choices":["RAID 0","RAID 5","RAID 1だけ","単体ディスク"],"correctChoiceIndex":1,"explanation":"RAID（Redundant Array of Independent Disks）5はデータとパリティを分散し、一台故障時も内容を再構築できます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID5パリティ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-raid-capacity-895","questionText":"同容量1TBのディスク4台でRAID 5を構成したとき、概算の利用可能容量はどれですか。","choices":["1TB","4TB","3TB","8TB"],"correctChoiceIndex":2,"explanation":"RAIDはRedundant Array of Independent Disksの略です。RAID 5の容量は（4－1）×1TB＝3TBです。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"RAID5容量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-usb-hot-plug-896","questionText":"コンピュータの電源を入れたまま対応機器を接続・取り外しできる性質はどれですか。","choices":["コールドスタンバイ","デッドロック","スワッピング","ホットプラグ"],"correctChoiceIndex":3,"explanation":"ホットプラグはシステム稼働中に機器を着脱できる機能です。安全な取外し手順が必要な場合があります。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"USBホットプラグ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-gpu-purpose-new-897","questionText":"CPUとGPUの処理特性の違いとして、最も適切なものはどれですか。","choices":["CPUは多様な処理や制御を担当し、GPUは多数の同種演算を並列に処理する用途に適している","CPUは記憶装置で、GPUだけがプログラムを実行する","GPUは並列処理を行わず、CPUだけが複数演算を同時実行できる","CPUとGPUは常に完全に同じ処理特性を持つ"],"correctChoiceIndex":0,"explanation":"CPU（Central Processing Unit：中央処理装置）は幅広い処理や制御、複雑な命令処理を担当します。GPU（Graphics Processing Unit）は多数の演算器を用いた同種処理の並列実行に適し、画像処理や機械学習などで利用されます。両者は役割を分担するため、GPUがあってもCPUが不要になるわけではありません。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"CPUとGPUの処理特性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-virtual-machine-898","questionText":"一台の物理サーバ上で、独立したOSを持つ複数の仮想的なコンピュータを動かす技術はどれですか。","choices":["データ圧縮","仮想マシン","文字コード変換","電子署名"],"correctChoiceIndex":1,"explanation":"仮想マシンは仮想化ソフトウェアによってCPUやメモリなどを分割し、独立したOS環境を提供します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"仮想マシン","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-live-migration-899","questionText":"稼働中の仮想マシンを、停止時間を抑えて別の物理サーバへ移動する機能はどれですか。","choices":["コールドバックアップ","データ圧縮","ライブマイグレーション","ソース翻訳"],"correctChoiceIndex":2,"explanation":"ライブマイグレーションは仮想マシンの実行状態を移し、保守や負荷分散時の停止を抑えます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"仮想マシン動的移行","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-container-characteristic-900","questionText":"仮想マシンと比べ、ホストOSのカーネルを共有してアプリ実行環境を分離する技術はどれですか。","choices":["デュアルブート","磁気テープ","RAID 1","コンテナ"],"correctChoiceIndex":3,"explanation":"コンテナはホストのカーネルを共有するため、一般に仮想マシンより軽量で起動が速い特徴があります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"コンテナ軽量仮想化","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-scale-up-901","questionText":"サーバのCPUやメモリを、より高性能・大容量なものへ交換して処理能力を上げる方法はどれですか。","choices":["スケールアップ","スケールアウト","フェールバック","データ削除"],"correctChoiceIndex":0,"explanation":"CPU（Central Processing Unit）などを強化するスケールアップは、一台のサーバを高性能化する方法です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"サーバスケールアップ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-scale-out-902","questionText":"同じ役割のサーバ台数を増やし、負荷を分散して全体の処理能力を上げる方法はどれですか。","choices":["スケールアップ","スケールアウト","デフラグ","暗号化解除"],"correctChoiceIndex":1,"explanation":"スケールアウトは複数台へ処理を分散して能力や可用性を高めやすい方法です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"サーバスケールアウト","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-dual-system-903","questionText":"同じ処理を二系統で同時に実行し、結果を照合して信頼性を高める構成はどれですか。","choices":["シンプレックスシステム","コールドサイト","デュアルシステム","単体構成"],"correctChoiceIndex":2,"explanation":"デュアルシステムは二系統が同じ処理を行って結果を照合するため、高い信頼性を得られます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"デュアルシステム","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-client-server-904","questionText":"サービスを要求する側と提供する側に役割を分け、ネットワーク経由で処理する形態はどれですか。","choices":["スタンドアロンだけ","紙台帳方式","手動交換方式","クライアントサーバシステム"],"correctChoiceIndex":3,"explanation":"クライアントが要求を送り、サーバが共有機能やデータを提供する分散処理形態です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"クライアントサーバ方式","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-mtbf-mttr-availability-905","questionText":"装置の可用性を高める改善として、一般に適切なものはどれですか。","choices":["平均故障間隔を長くし平均修復時間を短くする","平均故障間隔を短くし平均修復時間を長くする","両方を必ず0にする","測定を中止する"],"correctChoiceIndex":0,"explanation":"MTBF（Mean Time Between Failures：平均故障間隔）を長くし、MTTR（Mean Time To Repair：平均修復時間）を短くすると、稼働時間の割合が高まり、可用性が向上します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"MTBFとMTTR改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-os-resource-management-906","questionText":"複数のアプリケーションへCPU時間やメモリを割り当て、装置を管理する基本ソフトウェアはどれですか。","choices":["表計算ソフト","OS","文書ファイル","Webページ"],"correctChoiceIndex":1,"explanation":"OS（Operating System）はCPU（Central Processing Unit）やメモリなどの資源とアプリ実行を管理します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"OS資源管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-process-state-907","questionText":"実行可能なプログラムが主記憶へ読み込まれ、OSの管理対象となったものはどれですか。","choices":["ソースコードだけ","ファイル名だけ","プロセス","画面解像度"],"correctChoiceIndex":2,"explanation":"プロセスは実行中のプログラムの単位で、CPU状態やメモリ領域などの実行情報を持ちます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"OSプロセス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-multitasking-908","questionText":"一台のコンピュータで複数のアプリが同時に動いているようにCPU時間を切り替える機能はどれですか。","choices":["単一処理固定","データ圧縮","暗号鍵交換","マルチタスク"],"correctChoiceIndex":3,"explanation":"マルチタスクではOSがCPU（Central Processing Unit）時間を短く切り替え、複数処理を並行して進めます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"マルチタスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-virtual-memory-purpose-909","questionText":"主記憶が不足したとき、補助記憶の一部を利用して大きなプログラムを実行可能にする仕組みはどれですか。","choices":["仮想記憶","キャッシュ削除","RAID 0","文字圧縮"],"correctChoiceIndex":0,"explanation":"仮想記憶は主記憶と補助記憶を組み合わせ、論理的に大きなアドレス空間を提供します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"仮想記憶の目的","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09: choices":["原子性（処理を一単位にする）","一貫性（整合条件を守る）","独立性（同時実行を分離する）","永続性（確定結果を失わない）"],"correctChoiceIndex":3,"explanation":"ACIDの永続性はコミット済みの結果をログや記憶装置へ保持し、障害後も復元可能にします。","category":"テクノロジ系","subcategory":"データベース","topic":"ACID永続性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-exclusive-lock-937","questionText":"更新中のデータを他のトランザクションが同時に読み書きできないようにするロックはどれですか。","choices":["排他ロック","共有ロック","画面ロックだけ","ファイル圧縮"],"correctChoiceIndex":0,"explanation":"排他ロックは対象への他の読み書きを制限し、競合更新による不整合を防ぎます。","category":"テクノロジ系","subcategory":"データベース","topic":"DB排他ロック","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-deadlock-prevention-938","questionText":"データベースでの通常のロック待ちとデッドロックの違いとして、最も適切なものはどれですか。","choices":["ロック待ちは必ず永久に続き、デッドロックは時間がたてば必ず自然に解消する","通常のロック待ちは相手の処理終了などでロックが解放されれば進めるが、デッドロックでは複数の処理が互いのロック解放を待ち、そのままでは進めなくなる","ロック待ちとデッドロックは常に完全に同じ状態を意味する","デッドロックはロックを一切使用しない場合だけ発生する"],"correctChoiceIndex":1,"explanation":"通常のロック待ちは、他の処理が保持するロックが解放されるまで一時的に待つ状態です。相手の処理が終了してロックが解放されれば、待っていた処理は継続できます。デッドロックは、複数の処理が互いに相手のロック解放を待つ循環した待ち状態で、そのままでは処理が進みません。そのため、DBMS（Database Management System：データベース管理システム）による検出や一方の処理の取消しなどが必要になる場合があります。","category":"テクノロジ系","subcategory":"データベース","topic":"ロック待ちとデッドロックの違い","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-database-index-939","questionText":"検索条件によく使う列に付けると検索を高速化できる一方、更新時の負担が増える構造はどれですか。","choices":["ビューだけ","外部キーだけ","インデックス","バックアップ媒体"],"correctChoiceIndex":2,"explanation":"インデックスは検索位置を効率よく特定しますが、追加・更新・削除時には索引も更新します。","category":"テクノロジ系","subcategory":"データベース","topic":"DBインデックス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-database-backup-types-940","questionText":"毎週日曜日にフルバックアップを取得し、月曜日以降は毎日業務終了後に差分バックアップを取得している。木曜日のバックアップ取得前に障害が発生し、水曜日の業務終了時点へ復元するとき、基本的に必要なバックアップはどれですか。","choices":["水曜日の差分バックアップだけ","月曜日から水曜日までの差分バックアップをすべて","日曜日のフルバックアップだけ","日曜日のフルバックアップと、最新の水曜日の差分バックアップ"],"correctChoiceIndex":3,"explanation":"差分バックアップは、直近のフルバックアップ以降の変更を毎回保存します。そのため復元には、基本的に直近の日曜日のフルバックアップと最新の水曜日の差分バックアップを使います。増分バックアップでは、フルバックアップに加えて複数世代の増分が必要になる場合があります。","category":"テクノロジ系","subcategory":"データベース","topic":"差分バックアップからの復元","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-lan-wan-941","questionText":"同一建物や限られた敷地内の機器を接続するネットワークはどれですか。","choices":["LAN","WAN","PANだけ","SANだけ"],"correctChoiceIndex":0,"explanation":"LAN（Local Area Network）は建物や拠点など比較的狭い範囲を接続します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"LAN基本概念","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-osi-physical-942","questionText":"OSI基本参照モデルで、電気信号や光信号、コネクタなどビット伝送を扱う層はどれですか。","choices":["データリンク層","物理層","ネットワーク層","アプリケーション層"],"correctChoiceIndex":1,"explanation":"物理層は媒体上でビットを伝送するための電気的・機械的な仕様を扱います。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"OSI物理層","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-osi-data-link-943","questionText":"同一ネットワーク内でMACアドレスを用いたフレーム転送を扱う層はどれですか。","choices":["物理層","トランスポート層","データリンク層","セッション層"],"correctChoiceIndex":2,"explanation":"データリンク層は隣接機器間のフレーム転送や媒体アクセス制御を扱います。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"OSIデータリンク層","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-3 トのアドレスを使うプロトコルはどれですか。","choices":["IPv4","ARP","SMTP","IPv6"],"correctChoiceIndex":3,"explanation":"IPv6（Internet Protocol version 6）は128ビットの広いアドレス空間を持ちます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv6広域アドレス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-subnet-host-count-949","questionText":"IPv4の/24ネットワークで、ネットワークアドレスとブロードキャストアドレスを除く利用可能なホスト数はどれですか。","choices":["254","24","255","256"],"correctChoiceIndex":0,"explanation":"ホスト部は8ビットで256通りです。予約されるネットワークアドレスとブロードキャストアドレスを除き254です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv4サブネットホスト数","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-dns-mx-record-950","questionText":"電子メールを受け取るサーバのホスト名を、ドメイン情報として指定するレコードはどれですか。","choices":["Aレコード","MXレコード","PTRレコード","TXTレコード"],"correctChoiceIndex":1,"explanation":"DNSのMX（Mail Exchange）レコードは、そのドメイン宛てメールを受信するメールサーバを指定します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DNSメール交換レコード","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-dhcp-role-new-951","questionText":"端末へIPアドレス、サブネットマスク、ゲートウェイなどを自動配布する仕組みはどれですか。","choices":["DNS","SMTP","DHCP","SSH"],"correctChoiceIndex":2,"explanation":"DHCP（Dynamic Host Configuration Protocol）はネットワーク設定を端末へ自動的に貸し出します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"DHCP自動設定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-nat-purpose-952","questionText":"内部のプライベートIPアドレスと外部のグローバルIPアドレスを変換する機能はどれですか。","choices":["NTP","ARP","POP","NAT"],"correctChoiceIndex":3,"explanation":"NAT（Network Address Translation）はネットワーク境界でIPアドレスを変換します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NATアドレス変換","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-napt-purpose-953","questionText":"複数の内部端末が、ポート番号も変換して一つのグローバルIPアドレスを共有する機能はどれですか。","choices":["NAPT","NATの一対一変換だけ","DNS","FTP"],"correctChoiceIndex":0,"explanation":"NAPT（Network Address Port Translation）はIPアドレスとポート番号を対応付けて共有します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NAPTポート変換","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-tcp-feature-954","questionText":"データの到着確認、再送、順序制御を行い、信頼性のある通信を提供するものはどれですか。","choices":["UDP","TCP","IPだけ","ARP"],"correctChoiceIndex":1,"explanation":"TCP（Transmission Control Protocol）はコネクション型で、欠落時の再送や順序制御を行います。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"TCP信頼性制御","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-udp-feature-955","questionText":"再送や到着確認を省き、リアルタイム配信などで小さな遅延を重視する通信に使われるものはどれですか。","choices":["TCP","HTTPSだけ","UDP","SSHだけ"],"correctChoiceIndex":2,"explanation":"UDP（User Datagram Protocol）はコネクションレスで制御が軽く、速度や即時性を重視する用途に使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"UDP低遅延通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-http-purpose-956","questionText":"WebブラウザとWebサーバの間で、ページやAPIのデータを送受信するプロトコルはどれですか。","choices":["SMTP","SNMP","NTP","HTTP"],"correctChoiceIndex":3,"explanation":"HTTP（Hypertext Transfer Protocol）はWeb上のリソースを要求・応答形式で転送します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTPウェブ通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-https-purpose-957","questionText":"Web通信をTLSで暗号化し、盗聴や改ざんのリスクを抑える方式はどれですか。","choices":["HTTPS","HTTPのみ","FTPのみ","Telnetのみ"],"correctChoiceIndex":0,"explanation":"HTTPS（Hypertext Transfer Protocol Secure）はHTTPをTLSで保護し、サーバ証明書も利用します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"HTTPS暗号化通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-smtp-purpose-958","questionText":"電子メールを送信したり、メールサーバ間で転送したりするプロトコルはどれですか。","choices":["POP3","SMTP","IMAP","DNS"],"correctChoiceIndex":1,"explanation":"SMTP（Simple Mail Transfer Protocol）はメール送信とサーバ間転送に用いられます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"SMTPメール送信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-pop3-purpose-959","questionText":"メールをサーバから端末へダウンロードして読む用途で使われるプロトコルはどれですか。","choices":["SMTP","SNMP","POP3","NTP"],"correctChoiceIndex":2,"explanation":"POP3（Post Office Protocol version 3）はメール受信に使われ、端末へ取得する利用形態に向きます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"POP3メール受信","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-imap-purpose-960","questionText":"メールをサーバ上に保持したまま、複数端末でフォルダや既読状態を共有しやすいプロトコルはどれですか。","choices":["SMTP","FTP","ARP","IMAP"],"correctChoiceIndex":3,"explanation":"IMAP（Internet Message Access Protocol）はサーバ上のメールを管理し、複数端末で状態を同期しやすい方式です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IMAPメール同期","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ftp-purpose-961","questionText":"ネットワークを介したファイル転送に用いられる代表的なプロトコルはどれですか。","choices":["FTP","DHCP","NTP","ICMP"],"correctChoiceIndex":0,"explanation":"FTP（File Transfer Protocol）はファイルの送受信を行うプロトコルです。機密通信には安全な代替方式を検討します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"FTPファイル転送","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ssh-purpose-962","questionText":"遠隔サーバへ暗号化された経路でログインし、コマンド操作を行うプロトコルはどれですか。","choices":["Telnet","SSH","POP3","ARP"],"correctChoiceIndex":1,"explanation":"SSH（Secure Shell）は認証と暗号化を行い、遠隔操作や安全な転送に使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"SSH遠隔操作","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-bluetooth-purpose-963","questionText":"イヤホンやキーボードなど、個人の周辺機器を比較的短距離で接続する無線技術はどれですか。","choices":["NFCだけ","有線Ethernet","Bluetooth","衛星通信"],"correctChoiceIndex":2,"explanation":"Bluetoothは2.4GHz帯などを利用する近距離無線通信で、周辺機器やセンサの接続に使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"Bluetooth周辺機器接続","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-wifi-standard-964","questionText":"無線LANで利用されるIEEE 802.11系の技術の総称として一般的なものはどれですか。","choices":["Bluetoothだけ","NFCだけ","USB","Wi-Fi"],"correctChoiceIndex":3,"explanation":"Wi-FiはIEEE 802.11系規格に基づく無線LAN技術の相互接続性を示す名称です。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"Wi-Fi無線LAN","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-nfc-range-965","questionText":"交通系ICカードやタッチ決済など、数センチ程度の近距離無線通信に使われる技術はどれですか。","choices":["NFC","Wi-Fi","衛星通信","有線LAN"],"correctChoiceIndex":0,"explanation":"NFC（Near Field Communication：近距離無線通信）は近接した機器間の認証やデータ交換に利用されます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NFC近距離通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cia-confidentiality-966","questionText":"許可された人だけが情報を閲覧できるようにする情報セキュリティの特性はどれですか。","choices":["完全性","機密性","可用性","移植性"],"correctChoiceIndex":1,"explanation":"機密性は権限のない主体への情報開示を防ぐ性質です。暗号化やアクセス制御で確保します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CIA機密性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cia-integrity-967","questionText":"情報が許可なく変更・削除されず、正確で完全な状態を保つ特性はどれですか。","choices":["機密性","可用性","完全性","保守性"],"correctChoiceIndex":2,"explanation":"完全性は情報と処理の正確さを保ち、不正な改ざんを防止・検出する性質です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CIA完全性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-cia-availability-968","questionText":"必要なときに許可された利用者が情報やシステムを使える特性はどれですか。","choices":["機密性","完全性","真正性だけ","可用性"],"correctChoiceIndex":3,"explanation":"可用性は必要なサービスを利用可能に保つ性質で、冗長化やバックアップなどで高めます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CIA可用性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-authentication-authorization-969","questionText":"ログイン後、その利用者がファイルを閲覧してよいか権限を確認する処理はどれですか。","choices":["認可","認証","暗号化だけ","圧縮"],"correctChoiceIndex":0,"explanation":"認証は本人確認、認可は認証済みの主体に許された操作や資源を決める処理です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"認証と認可","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-password-length-970","questionText":"推測されにくいパスワードを作る方法として、特に基本となるものはどれですか。","choices":["短い単語を全サービスで共有する","十分に長くサービスごとに異なる値を使う","利用者名と同じにする","初期値を変更しない"],"correctChoiceIndex":1,"explanation":"長く固有のパスワードは総当たりや使い回し被害を抑えます。管理にはパスワード管理ツールも有効です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"強固なパスワード","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-multi-factor-971","questionText":"パスワードと指紋を組み合わせる認証の説明として適切なものはどれですか。","choices":["知識要素を二回だけ確認する","所持要素だけを二個使う","知識要素と生体要素を組み合わせる","認証要素を使わない"],"correctChoiceIndex":2,"explanation":"異なる種類の要素を二つ以上使うため多要素認証です。パスワードは知識、指紋は生体要素です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"多要素認証要素","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-biometric-frr-far-972","questionText":"生体認証で、本人を誤って拒否する割合を何といいますか。","choices":["他人受入率（FAR）","サービス稼働率","データ圧縮率","本人拒否率（FRR）"],"correctChoiceIndex":3,"explanation":"本人拒否率は正当な本人を認証失敗と判断する割合です。FRRはFalse Rejection Rateの略です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"生体認証本人拒否率","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-hash-property-973","questionText":"入力データから固定長の値を計算し、元データの改ざん検知に使う技術はどれですか。","choices":["ハッシュ関数","可逆圧縮だけ","負荷分散","画面描画"],"correctChoiceIndex":0,"explanation":"暗号学的ハッシュ関数は入力のわずかな変化で値が大きく変わり、原文へ戻すことが困難です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"暗号学的ハッシュ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-symmetric-key-974","questionText":"共通鍵暗号方式を多数の通信相手とのやり取りに利用するとき、特に注意すべき課題はどれですか。","choices":["公開鍵だけを相手へ渡せば共通鍵を共有せずに利用できる","通信相手ごとに共通鍵を安全に共有し、漏えいしないよう管理する必要がある","暗号文と同じ経路で共通鍵を送れば安全に共有できる","一つの共通鍵を全通信相手で継続利用すれば管理負担をなくせる"],"correctChoiceIndex":1,"explanation":"共通鍵暗号方式では、通信する双方が同じ鍵を使うため、その鍵を第三者に知られない方法で共有し、相手ごとに適切に保管・更新する必要があります。通信相手が増えるほど、鍵の配送と管理が複雑になる点が課題です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"共通鍵の配送と管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-public-key-975","questionText":"公開鍵暗号方式の鍵の管理について、適切な説明はどれですか。","choices":["公開鍵と秘密鍵の両方を通信相手へ秘密にして渡す","同じ秘密鍵をすべての通信相手と共有する","公開鍵は公開できるが、秘密鍵は所有者だけが安全に管理する","秘密鍵を公開し、公開鍵を本人だけが保管する"],"correctChoiceIndex":2,"explanation":"公開鍵は他者へ公開できますが、秘密鍵は所有者だけが安全に管理します。機密性を確保する通信では、受信者の公開鍵で暗号化し、受信者の秘密鍵で復号するため、秘密鍵を通信相手と共有する必要はありません。電子署名では秘密鍵で署名し、公開鍵で検証するなど、用途によって鍵の使い方が異なります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"公開鍵暗号の鍵管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-digital-certificate-976","questionText":"公開鍵が特定の組織やサーバのものであることを認証局が署名して証明する電子データはどれですか。","choices":["Cookieだけ","圧縮ファイル","一時ファイル","デジタル証明書"],"correctChoiceIndex":3,"explanation":"デジタル証明書は主体情報と公開鍵を結び付け、認証局の署名によって検証可能にします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"デジタル証明書","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-pki-role-977","questionText":"認証局、証明書、失効情報などを使い、公開鍵の信頼を管理する仕組みはどれですか。","choices":["PKI","RPA","ERP","RAID"],"correctChoiceIndex":0,"explanation":"PKI（Public Key Infrastructure：公開鍵基盤）は証明書の発行、検証、失効を含む信頼の仕組みです。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"公開鍵基盤","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-tls-role-978","questionText":"Webなどの通信で、サーバ認証、通信の暗号化、完全性保護を提供するプロトコルはどれですか。","choices":["FTP","TLS","ARP","DHCP"],"correctChoiceIndex":1,"explanation":"TLS（Transport Layer Security）は、通信内容の機密性を保つ暗号化、改ざんを検知できる完全性保護、サーバ認証を提供し、HTTPSなどで利用されます。クライアント認証は構成によって利用され、常に行われるわけではありません。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"TLS通信保護","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-firewall-role-979","questionText":"ファイアウォールの主な役割として最も適切なものはどれですか。","choices":["端末内のファイルを検査してマルウェアを駆除する","ネットワーク上の不審な通信を検知して管理者へ通知することだけを目的とする","送信元・宛先・ポートなどの通信ルールに基づいて、通信を許可または遮断する","利用者のパスワードを生成・保存する"],"correctChoiceIndex":2,"explanation":"ファイアウォールは、通信ルールに基づいてネットワーク間のアクセスを制御し、通信を許可または遮断します。端末内のマルウェアを駆除する対策ソフトや、不審な通信の検知・通知を主目的とするIDS（Intrusion Detection System：侵入検知システム）とは主な役割が異なります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ファイアウォール通信制御","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-waf-role-980","questionText":"WebアプリケーションへのSQLインジェクションなど、HTTP通信中の不正な要求を検査・遮断する仕組みはどれですか。","choices":["UPS","DNS","RAID","WAF"],"correctChoiceIndex":3,"explanation":"WAF（Web Application Firewall）はSQL（Structured Query Language）を悪用する攻撃などを検査します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"WAFウェブ防御","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ids-ips-difference-981","questionText":"不審な通信を検知して通知するだけでなく、自動遮断まで行う仕組みはどれですか。","choices":["IPS","IDS","DNS","NTP"],"correctChoiceIndex":0,"explanation":"IPS（Intrusion Prevention System：侵入防止システム）は検知に加えて通信遮断などを行います。IDSは主に検知・通知です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"IPS侵入防止","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-malware-general-982","questionText":"利用者やシステムへ害を与える目的で作られたソフトウェアの総称はどれですか。","choices":["ミドルウェア","マルウェア","ファームウェア","グループウェア"],"correctChoiceIndex":1,"explanation":"マルウェアにはウイルス、ワーム、トロイの木馬、ランサムウェアなどが含まれます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"マルウェア総称","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ransomware-response-983","questionText":"ファイルを暗号化して金銭を要求する攻撃への備えとして、特に重要なものはどれですか。","choices":["バックアップを同じ端末だけに置く","全更新を停止する","分離したバックアップと復元訓練","要求された金銭を予算化する"],"correctChoiceIndex":2,"explanation":"ランサムウェア対策では侵入防止に加え、攻撃から分離したバックアップと復元可能性の確認が重要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ランサムウェア復旧対策","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-phishing-defense-984","questionText":"金融機関を装うメールのリンクから認証情報を入力させる攻撃への対応として適切なものはどれですか。","choices":["表示名だけを信頼する","要求された秘密情報を返信する","警告を無視して添付を開く","リンクを使わず公式アプリや登録済みURLから確認する"],"correctChoiceIndex":3,"explanation":"フィッシングは偽サイトへ誘導します。送信元やURLを慎重に確認し、信頼済み経路からアクセスします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"フィッシング対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-sql-injection-defense-985","questionText":"Web入力をSQL文へ組み込む際の不正操作を防ぐ基本的な実装はどれですか。","choices":["プレースホルダーで値をバインドする","入力をそのまま文字列連結する","エラーを全て画面表示する","DB権限を最大にする"],"correctChoiceIndex":0,"explanation":"SQL（Structured Query Language）のプレースホルダーは入力値を構文として解釈させず、攻撃を防ぎます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"SQLインジェクション防止","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-xss-defense-986","questionText":"掲示板へ投稿されたスクリプトが他の利用者のブラウザで実行される攻撃を防ぐ基本策はどれですか。","choices":["入力を無条件でHTMLとして出力する","出力時に文脈に応じてエスケープする","認証を全て無効にする","通信をUDPへ変える"],"correctChoiceIndex":1,"explanation":"XSS（Cross-Site Scripting）対策では、HTMLなど出力先の文脈に応じたエスケープが基本です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"XSS出力対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-csrf-defense-987","questionText":"ログイン済み利用者の意図しない送金要求を、外部サイトから実行させる攻撃への基本策はどれですか。","choices":["GET要求だけで重要処理を行う","送信元確認を全て省く","推測困難なCSRFトークンを検証する","セッションを永久化する"],"correctChoiceIndex":2,"explanation":"CSRF（Cross-Site Request Forgery）対策では要求ごとのトークンやSameSite Cookieなどを利用します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CSRF要求検証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-brute-force-defense-988","questionText":"認証画面へ大量のパスワード候補を繰り返し試す攻撃を抑える対策はどれですか。","choices":["失敗回数を記録しない","短い初期パスワードを共有する","認証ログを削除する","試行回数制限と多要素認証を導入する"],"correctChoiceIndex":3,"explanation":"総当たり攻撃には試行制限、遅延、監視、多要素認証などを組み合わせ、推測だけで侵入されにくくします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"総当たり攻撃対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-social-engineering-989","questionText":"システムの脆弱性ではなく、電話で管理者を装うなど人の心理を利用して秘密情報を得る手口はどれですか。","choices":["ソーシャルエンジニアリング","負荷分散","データ正規化","冗長化"],"correctChoiceIndex":0,"explanation":"ソーシャルエンジニアリングは信用、焦り、権威など人の心理や行動の隙を悪用します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"人的情報窃取","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-zero-trust-access-990","questionText":"社内ネットワーク内かどうかだけで信頼せず、アクセスのたびに主体や端末、状況を確認する考え方はどれですか。","choices":["境界内無条件信頼","ゼロトラスト","匿名アクセス優先","認証廃止"],"correctChoiceIndex":1,"explanation":"ゼロトラストは「何も暗黙に信頼しない」前提で継続的に検証し、最小権限でアクセスさせます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ゼロトラスト継続検証","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-supervised-learning-new-991","questionText":"過去の画像と正解ラベルの組を使って、新しい画像の種類を予測する学習方法はどれですか。","choices":["教師なし学習","強化学習","教師あり学習","乱数生成"],"correctChoiceIndex":2,"explanation":"教師あり学習は入力と正解ラベルの組を使い、未知の入力に対する分類や数値予測を学習します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"教師あり学習","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-unsupervised-learning-new-992","questionText":"正解ラベルのない購買データから、似た行動の顧客グループを見つける学習方法はどれですか。","choices":["教師あり学習","強化学習","手動暗号化","教師なし学習"],"correctChoiceIndex":3,"explanation":"教師なし学習はラベルのないデータの構造やまとまりを探索し、クラスタリングなどに使います。","category":"テクノロジ系","subcategory":"基礎理論","topic":"教師なし学習","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-reinforcement-learning-993","questionText":"行動の結果として得る報酬を基に、試行錯誤しながら方策を改善する学習方法はどれですか。","choices":["強化学習","教師あり学習","教師なし学習","表計算"],"correctChoiceIndex":0,"explanation":"強化学習は環境との相互作用から報酬を受け取り、累積報酬を高める行動方策を学びます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"強化学習","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-deep-learning-994","questionText":"多数の層を持つニューラルネットワークを使い、画像や音声などから特徴を段階的に学ぶ手法はどれですか。","choices":["線形探索","ディープラーニング","排他制御","データ圧縮だけ"],"correctChoiceIndex":1,"explanation":"ディープラーニングは多層ニューラルネットワークによる機械学習で、複雑な特徴をデータから学習します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"深層学習","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-llm-basic-995","questionText":"大量の文章から言語の統計的な関係を学び、文章の生成や要約などに使われるモデルはどれですか。","choices":["関係データベース","ルータ","大規模言語モデル","デバイスドライバ"],"correctChoiceIndex":2,"explanation":"LLM（Large Language Model：大規模言語モデル）は多数のパラメータを持ち、言語処理タスクに利用されます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"大規模言語モデル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-generative-ai-review-996","questionText":"生成AIの回答を顧客へ送る業務で、誤情報による被害を抑えるために必要な対応はどれですか。","choices":["出力を常に無条件採用する","出典確認を禁止する","誤りを利用者の責任だけにする","根拠と内容を人が確認する"],"correctChoiceIndex":3,"explanation":"AI（Artificial Intelligence：人工知能）を用いる生成AIは誤情報を出す可能性があるため、用途のリスクに応じて根拠と内容を人が確認する必要があります。人による確認でも完全に安全になるとは限りません。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AI出力確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-ai-training-bias-997","questionText":"過去の採用データに偏りがある場合、それを学習した予測へ生じるおそれがある問題はどれですか。","choices":["不公平な偏りを再現する","必ず完全に公平になる","学習データが自動消去される","通信速度が必ず上がる"],"correctChoiceIndex":0,"explanation":"学習データの偏りはモデル出力へ反映される可能性があり、データ評価と継続的な公平性確認が必要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"AI学習バイアス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-iot-definition-998","questionText":"センサや通信機能を持つ機器をネットワークへ接続し、データ収集や遠隔制御を行う仕組みはどれですか。","choices":["OCR","IoT","OLAP","IDE"],"correctChoiceIndex":1,"explanation":"IoT（Internet of Things：モノのインターネット）は様々な物を接続してデータ活用や制御を行います。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"IoT基本概念","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-edge-computing-new-999","questionText":"工場のセンサデータをクラウドへ全て送る前に、現場近くの装置で即時分析する方式はどれですか。","choices":["中央処理だけ","紙台帳処理","エッジコンピューティング","オフライン印刷"],"correctChoiceIndex":2,"explanation":"エッジコンピューティングはデータ発生源の近くで処理し、遅延や通信量、外部送信を抑えます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"エッジコンピューティング","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"technology-quantum-qubit-1000","questionText":"従来の0または1だけでなく、重ね合わせとして扱われる量子計算の情報単位はどれですか。","choices":["バイト","ピクセル","パケット","量子ビット"],"correctChoiceIndex":3,"explanation":"量子ビットはqubitとも呼ばれ、量子力学的な重ね合わせなどを利用する情報単位です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"量子ビット","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-technology-roadmap-stage-1001","questionText":"新技術を使った製品構想について、技術的に実現できるかを小規模な試作で確かめたい。技術ロードマップ上で行う活動として適切なものはどれですか。","choices":["市場調査を行い、想定顧客のニーズを確認する","完成に近い製品を限定利用者へ試験導入する","限定範囲で概念実証を行う","量産移行後の保守手順を策定する"],"correctChoiceIndex":2,"explanation":"PoC（Proof of Concept：概念実証）は、本格開発や量産の前に技術的な実現可能性を小さく確かめる活動です。結果を次の投資判断に使うため、初めから全拠点へ導入することとは異なります。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"技術ロードマップ上のPoC実施段階","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-poc-commercialization-gate-1002","questionText":"概念実証では技術が動作した。次に事業化へ進むか判断するとき、確認項目として最も適切なものはどれですか。","choices":["顧客価値、採算性、運用可能性を含めて評価する","市場性は確認するが、運用可能性を評価しない","技術面と市場性は確認するが、収益見込みを評価しない","採算性は確認するが、顧客価値と需要を評価しない"],"correctChoiceIndex":0,"explanation":"PoC（Proof of Concept：概念実証）の成功は、技術面を確認できたことを示します。事業化判断では、それに加えて顧客の需要、収益性、運用体制などを評価する必要があります。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"PoC後の事業化判断基準","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-open-innovation-ip-1003","questionText":"大学と企業が共同で新技術を開発する。後の事業化で紛争を避けるため、開始前に行う対応として最も適切なものはどれですか。","choices":["新成果の帰属を定め、持ち込む既存技術の利用条件は定めない","既存技術の利用条件を定め、新成果の帰属は発生後に協議する","発表時期と秘密保持を定め、事業利用の条件は定めない","既存技術と新成果の権利帰属や利用条件を合意する"],"correctChoiceIndex":3,"explanation":"外部組織と連携する場合は、各者が持ち込む知的財産と共同で生まれる成果を区別し、権利帰属や利用条件を事前に定めます。これにより、発表、特許出願、事業利用の段階での争いを減らせます。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"外部連携時の知財取扱い","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-rd-ip-linkage-1004","questionText":"研究開発戦略と知的財産戦略を連携させる取組として適切なものはどれですか。","choices":["特許情報を収集するが、決定済みの研究テーマには反映しない","競合特許を調査し、研究テーマや権利化方針へ反映する","研究成果の権利化方針を決めるが、競合特許は調査しない","製品企画と研究テーマを決め、特許調査は発売前に実施する"],"correctChoiceIndex":1,"explanation":"研究の早い段階で特許情報を調べると、重複研究や他社権利の侵害リスクを減らし、独自性のある領域へ資源を振り向けられます。研究成果を特許にするか営業秘密にするかなどの方針も事業戦略と合わせて決めます。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"研究開発戦略と知財戦略の連携","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-mot-investment-priority-1005","questionText":"複数の研究開発案から投資先を選ぶ。技術経営の観点で最も適切な進め方はどれですか。","choices":["事業戦略との整合、技術優位性、市場性、リスクを総合評価する","事業戦略と市場性を評価し、技術実現性や技術蓄積は評価しない","技術優位性と将来性を評価し、顧客需要や収益性は評価しない","短期採算性と開発速度を評価し、長期戦略や技術基盤への貢献は評価しない"],"correctChoiceIndex":0,"explanation":"MOT（Management of Technology：技術経営）では、技術を事業価値へ結び付ける視点が重要です。新規性や費用だけでなく、戦略との整合、市場性、実現可能性、将来の技術基盤への貢献を総合して優先順位を決めます。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"MOTにおける投資優先順位","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-rd-expected-value-1006","questionText":"研究開発案の成功確率は40%で、成功時の便益は900万円、失敗時にも得られる便益は100万円と見積もられた。便益の期待値はいくらですか。","choices":["360万円","400万円","420万円","1,000万円"],"correctChoiceIndex":2,"explanation":"期待値は、各結果の値に発生確率を掛けて合計します。900万円×0.4＋100万円×0.6＝360万円＋60万円＝420万円です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"研究開発案の期待値計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-chart-uncertainty-1007","questionText":"二つの施策の平均満足度を示すグラフで、両者の誤差範囲が大きく重なっている。この結果の説明として適切なものはどれですか。","choices":["平均値が高い施策に有意な優位性があると判断する","平均値だけで差を断定せず、ばらつきや標本数も確認する","誤差範囲が重なるため、二つの母平均は同じだと判断する","誤差範囲の幅から、二つの標本数は同じだと判断する"],"correctChoiceIndex":1,"explanation":"誤差範囲は推定値の不確かさを読み取る手掛かりです。範囲が大きく重なるときは平均値の大小だけで優位性を断定せず、標本数やばらつき、分析方法を確認します。誤差範囲が重なることだけで、統計的有意差の有無を断定することもできません。","category":"ストラテジ系","subcategory":"企業活動","topic":"誤差範囲を含むグラフの解釈","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-yoy-rate-chart-1008","questionText":"ある商品の売上個数が前年の800個から今年の920個へ増えた。前年比の増加率は何%ですか。","choices":["8%","12%","13%","15%"],"correctChoiceIndex":3,"explanation":"増加数は920－800＝120個です。前年を基準にするため、120÷800×100＝15%となります。","category":"ストラテジ系","subcategory":"企業活動","topic":"前年比を計算したグラフ比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-stratified-sampling-1009","questionText":"社員の満足度調査で、人数の少ない拠点の意見も確実に含めたい。調査対象の選び方として適切なものはどれですか。","choices":["拠点ごとに層へ分け、各層から無作為に抽出する","本社の回答者だけを先着順で集める","満足度が高いと予想される社員だけを選ぶ","全社員名簿の先頭から一定人数だけを選ぶ"],"correctChoiceIndex":0,"explanation":"層別抽出では、母集団を拠点などの性質で層に分け、各層から標本を選びます。少数の層も計画的に含められるため、特定拠点だけに偏ることを防ぎやすくなります。","category":"ストラテジ系","subcategory":"企業活動","topic":"層別抽出による代表性確保","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-domain-knowledge-causality-1010","questionText":"データ分析で、アイスの売上と水難事故件数に正の相関が見られた。因果関係を判断するときの対応として適切なものはどれですか。","choices":["正の相関があるため、アイスが事故の直接原因だと結論付ける","アイスの売上が先に増える時期があるため、原因だと判断する","地域別にも相関があれば、共通要因を調べず因果関係があると判断する","気温など両方に影響する要因を業務知識とともに検討する"],"correctChoiceIndex":3,"explanation":"相関があっても、一方が他方の原因とは限りません。この例では気温という共通要因が両方を増やす可能性があり、現場や業務の知識を使って交絡要因を検討します。","category":"ストラテジ系","subcategory":"企業活動","topic":"ドメイン知識による因果解釈","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-process-bottleneck-1011","questionText":"受付、審査、承認の順に処理する業務で、1時間当たりの処理能力がそれぞれ20件、8件、15件である。全体の処理件数を最も制約している工程はどれですか。","choices":["受付工程","承認工程","審査工程","三工程は同じ"],"correctChoiceIndex":2,"explanation":"直列の業務では、処理能力が最も小さい工程が全体の流量を制約します。審査は1時間当たり8件なのでボトルネックであり、まず改善効果を検討すべき工程です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務フローからの制約工程特定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-dx-leading-lagging-kpi-1012","questionText":"オンライン申込みフォームの途中離脱を減らす施策で、最終成果である契約件数に先立って改善状況を把握する指標として最も適切なものはどれですか。","choices":["オンライン広告が表示された回数","申込みフォームの完了率","問い合わせ窓口への相談件数","申込みページの閲覧開始数"],"correctChoiceIndex":1,"explanation":"フォーム完了率は、利用者が申込み過程を通過できているかを早期に示す先行指標です。契約件数や利益などの遅行指標と組み合わせると、施策の途中経過と最終成果を分けて評価できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"DX施策の先行・遅行指標","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-cloud-exit-strategy-1013","questionText":"クラウドサービスの採用を検討している。将来、別サービスへ移行できなくなるリスクを抑える確認として適切なものはどれですか。","choices":["データの出力形式と移行手順を確認し、終了時の支援条件は確認しない","データの出力形式、移行手順、契約終了時の支援を確認する","契約終了時のデータ削除条件を確認し、データの移行方法は確認しない","現在の運用支援と稼働率を確認し、契約終了時の条件は確認しない"],"correctChoiceIndex":1,"explanation":"出口戦略では、契約終了時にデータやシステムを別環境へ移せるかを事前に確認します。標準的な形式でのデータ取得、移行支援、費用、削除証明などを契約前に評価すると、ベンダロックインのリスクを下げられます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"クラウドの移行性・出口戦略","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-requirement-priority-1014","questionText":"予算と納期が限られたシステム企画で、要件の優先順位を決める方法として適切なものはどれですか。","choices":["事業価値、必須性、費用、リスクを関係者と評価する","事業価値と費用を評価し、必須性やリスクは評価しない","必須性と技術難易度を評価し、事業価値や費用は評価しない","実装期間と技術難易度を評価し、利用部門とは合意しない"],"correctChoiceIndex":0,"explanation":"制約がある場合は、要件の事業価値や必須性と、実現費用やリスクを比較して優先順位を合意します。関係者と根拠を共有すると、重要要件の抜けや声の大きさだけによる判断を防げます。","category":"ストラテジ系","subcategory":"システム企画","topic":"制約下での要件優先順位","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-requirement-traceability-1015","questionText":"法改正により業務要件が変更された。影響を受ける設計、プログラム、テスト項目を漏れなく特定するために役立つものはどれですか。","choices":["要件と設計書の対応だけを記録した表","設計書とテスト項目の対応だけを記録した表","要件と受入テストの対応だけを記録し、実装は追跡しない表","要件と成果物の対応関係を記録した表"],"correctChoiceIndex":3,"explanation":"トレーサビリティは、要件から設計、実装、テストまでの対応関係を追跡できる性質です。対応表を保つと、要件変更の影響範囲やテスト漏れを確認しやすくなります。","category":"ストラテジ系","subcategory":"システム企画","topic":"要件変更時のトレーサビリティ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-proposal-tco-exit-1016","questionText":"二つのクラウド提案を5年間利用する前提で評価する。初期費用が安い提案を選ぶ前に、追加で重視すべき情報はどれですか。","choices":["5年間の運用費を含む総費用を確認し、終了時の移行性は比較しない","データ出力形式と移行手順を確認し、5年間の総費用は比較しない","運用・教育・移行・終了時費用を含む総費用と移行性","運用費と支援時間を確認し、教育・移行・終了時費用は比較しない"],"correctChoiceIndex":2,"explanation":"TCO（Total Cost of Ownership：総保有コスト）は、導入費だけでなく運用、保守、教育、移行、終了までの費用を含めて評価します。さらにデータを取り出せるかなどの移行性を確認し、長期的な拘束リスクも比較します。","category":"ストラテジ系","subcategory":"システム企画","topic":"TCO・移行性を含む提案評価","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-state-transition-test-1017","questionText":"会員状態が「仮登録→本登録→退会」と変化するシステムで、許可されない状態変更も含めて確認したい。適切なテスト設計はどれですか。","choices":["状態とイベントによる遷移表を作り、有効・無効な遷移を試す","許可された状態遷移だけを一覧にし、正常な遷移を試す","各状態の画面表示を確認し、状態間の遷移は試さない","イベントの種類を整理し、現在の状態による違いは確認しない"],"correctChoiceIndex":0,"explanation":"状態遷移テストでは、現在の状態とイベントによって次の状態がどう変わるかを整理します。正しい遷移だけでなく、退会後の再退会など許可されない遷移も確認できます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"状態遷移に基づくテスト設計","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-decision-table-test-1018","questionText":"会員区分、購入金額、クーポン有無の組合せで割引結果が変わる。テスト条件の組合せを漏れなく整理するために適切なものはどれですか。","choices":["ガントチャート","デシジョンテーブル","組織図","散布図"],"correctChoiceIndex":1,"explanation":"デシジョンテーブルは複数の条件と、その組合せに対応する処理を表で整理します。条件の組合せが多い業務規則で、テストケースの漏れや矛盾を見つけるのに役立ちます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"条件組合せのデシジョンテーブル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-acceptance-traceability-1019","questionText":"受入テストの準備で、利用部門の各要件がどのテスト項目で確認されるかを明確にしたい。最も有効な対応はどれですか。","choices":["要件IDと設計書の対応表を作り、受入テストとの関係は記録しない","機能別にテスト結果を整理し、利用部門の要件IDとは対応付けない","要件ID、受入条件、受入テスト項目の対応表を作る","不具合票と修正担当者の対応表を作り、要件の検証状況を確認する"],"correctChoiceIndex":2,"explanation":"要件と受入条件、テスト項目を対応付けると、各要件が検証されたかを追跡できます。単にテスト数を増やすより、重要な要件の検証漏れを直接確認できます。","category":"マネジメント系","subcategory":"システム開発技術","topic":"要件と受入条件の対応確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-agile-scope-negotiation-1020","questionText":"反復開発の途中で重要な新要望が出たが、リリース日は変えられない。対応として適切なものはどれですか。","choices":["新要望の価値を優先し、工数を見積もらず既存範囲へ追加する","新要望をバックログへ記録し、今回扱うかは評価せず次回へ送る","要望部門の優先順位を採用し、他の関係者とは範囲を調整しない","価値と工数を確認し、優先順位や今回の範囲を関係者と再調整する"],"correctChoiceIndex":3,"explanation":"反復開発では変更を受け入れつつ、時間や人員の制約の中で実施範囲を調整します。新要望の価値と工数を評価し、後回しにする項目も含めて関係者と合意します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"反復開発でのスコープ調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-burndown-interpretation-1021","questionText":"反復開発のバーンダウンチャートで、実績線が数日間ほぼ水平のまま理想線より上にある。この状況の解釈として適切なものはどれですか。","choices":["残作業が予定より速く減っている","完了した作業が少なく、遅延要因の確認が必要である","要求が全て完了したことを示す","品質が自動的に向上したことを示す"],"correctChoiceIndex":1,"explanation":"バーンダウンチャートは残作業量の推移を示します。実績線が水平なら残作業が減っておらず、理想線より上なら計画より多く残っているため、妨げとなっている要因を確認します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"バーンダウンチャートの解釈","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-pipeline-quality-gate-1022","questionText":"継続的なビルド工程で、自動テストに重大な失敗が見つかったときの品質ゲートの扱いとして適切なものはどれですか。","choices":["同じ自動テストを再実行し、結果が変われば原因未確認のまま進める","失敗を警告として記録し、リリース日を優先して次工程へ進める","自動テストを停止し、対象外の項目だけを手作業で確認して進める","基準を満たさない成果物を次工程へ進めず、原因を修正する"],"correctChoiceIndex":3,"explanation":"CI/CD（Continuous Integration / Continuous Delivery：継続的インテグレーション／継続的デリバリー）の品質ゲートは、定めた基準を満たすかを自動判定します。重大な失敗があれば進行を止め、原因を修正して再検証します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"CI/CD品質ゲートの扱い","difficulty":2,"source":"IPA「ITパスポート試験シラバス V
