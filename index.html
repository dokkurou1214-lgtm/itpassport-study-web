rectChoiceIndex":0,"explanation":"WPA3（Wi-Fi Protected Access 3）は無線LANのセキュリティ規格です。WEP（Wired Equivalent Privacy）には既知の弱点があり、利用を避けます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"無線LAN暗号規格","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-bluetooth-low-energy-482","questionText":"小型センサが少量のデータを低消費電力でスマートフォンへ送る用途に適した近距離無線技術はどれですか。","choices":["衛星通信だけ","Bluetooth Low Energy","有線HDMI","光ディスク"],"correctChoiceIndex":1,"explanation":"Bluetooth Low Energyは低消費電力の近距離通信向けで、ウェアラブル機器やセンサなどに利用されます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"低消費電力近距離通信","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-nfc-use-483","questionText":"カードやスマートフォンを数cm程度まで近づけて、決済や入退室情報を交換する技術はどれですか。","choices":["WAN","SMTP","NFC","RAID"],"correctChoiceIndex":2,"explanation":"NFC（Near Field Communication：近距離無線通信）は非常に近い距離で通信し、非接触決済や認証などに使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"非接触近距離通信","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-load-balancer-484","questionText":"多数のWeb要求を複数サーバへ振り分け、特定サーバへの集中を避ける装置や機能はどれですか。","choices":["コンパイラ","テキストエディタ","バーコードプリンタ","ロードバランサ"],"correctChoiceIndex":3,"explanation":"ロードバランサは負荷分散により処理能力や可用性を高めます。死活監視と組み合わせ、故障サーバを振分け先から外せます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"Web負荷分散","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-cdn-edge-cache-485","questionText":"世界各地の利用者へ動画を配信するとき、利用者に近い拠点へコンテンツを複製して遅延を減らす仕組みはどれですか。","choices":["CDN","CMDB","IDE","RDBMSだけ"],"correctChoiceIndex":0,"explanation":"CDN（Content Delivery Network）は分散配置したエッジ拠点からコンテンツを配信し、遅延と配信元負荷を軽減します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"分散コンテンツ配信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-edge-computing-486","questionText":"工場カメラの映像を現場近くで即時分析し、必要な結果だけをクラウドへ送る構成はどれですか。","choices":["全データの紙保管","エッジコンピューティング","中央処理だけへの固定","オフライン媒体交換だけ"],"correctChoiceIndex":1,"explanation":"エッジコンピューティングはデータ発生源に近い場所で処理し、通信量や遅延を抑えます。クラウドと組み合わせて利用できます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"現場近傍処理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-container-image-487","questionText":"アプリの実行に必要なファイルと設定を、環境間で再現可能な読取り専用テンプレートとしてまとめたものはどれですか。","choices":["稼働中コンテナの一時メモリだけ","物理サーバのラック図","コンテナイメージ","DNS逆引き表"],"correctChoiceIndex":2,"explanation":"コンテナイメージはアプリと依存関係を層としてまとめ、同じイメージから一貫した実行環境を作ります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"コンテナ実行テンプレート","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-hypervisor-488","questionText":"一台の物理サーバ上で複数の仮想マシンへCPUやメモリを割り当てて管理するソフトウェアはどれですか。","choices":["表計算ソフト","メールクライアント","コンパイラだけ","ハイパーバイザ"],"correctChoiceIndex":3,"explanation":"ハイパーバイザは物理資源を抽象化して複数の仮想マシンを分離・管理します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"仮想マシン管理層","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-serverless-489","questionText":"開発者がサーバ台数を直接管理せず、関数の実行回数や時間に応じて課金されるクラウド実行形態はどれですか。","choices":["サーバレスコンピューティング","専用物理サーバ購入だけ","磁気テープ保管","手動配線"],"correctChoiceIndex":0,"explanation":"サーバレスでは基盤の割当てや拡縮をクラウド事業者が管理します。サーバが存在しないという意味ではありません。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"関数型クラウド実行","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-saas-responsibility-490","questionText":"SaaSを利用する企業が、通常引き続き負う責任として最も適切なものはどれですか。","choices":["クラウド事業者の全データセンター建設","利用者アカウントと入力データの適切な管理","物理サーバの部品交換","インターネット全体の経路設計"],"correctChoiceIndex":1,"explanation":"SaaS（Software as a Service）でも、利用者側はアカウント権限、設定、入力データ、端末などを適切に管理します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"SaaS責任分担","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-zero-trust-491","questionText":"社内ネットワークからの接続でも無条件に信頼せず、要求ごとに利用者、端末、状況を検証する考え方はどれですか。","choices":["境界内の全通信を常に許可する考え方","認証を廃止する考え方","ゼロトラスト","ログを取得しない考え方"],"correctChoiceIndex":2,"explanation":"ゼロトラストは場所だけで信頼せず、継続的な検証と最小権限を基本にアクセスを制御します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"継続的アクセス検証","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-least-privilege-492","questionText":"経理担当者へ支払処理に必要な権限だけを与え、管理者権限は付与しない原則はどれですか。","choices":["全権限付与の原則","匿名アクセスの原則","記録削除の原則","最小権限の原則"],"correctChoiceIndex":3,"explanation":"最小権限は、業務に必要な最小限の権限だけを付与し、誤操作や侵害時の影響を抑える原則です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"必要最小権限","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-rbac-493","questionText":"利用者個人へ一件ずつ権限設定せず、経理担当や承認者など職務ごとに権限をまとめて割り当てる方式はどれですか。","choices":["ロールベースアクセス制御","任意アクセス制御だけ","無認証アクセス","パケット断片化"],"correctChoiceIndex":0,"explanation":"RBAC（Role-Based Access Control）は役割へ権限を割り当て、利用者を役割へ所属させて管理を効率化します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"職務別アクセス制御","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-salted-password-hash-494","questionText":"同じパスワードでも利用者ごとに異なる保存値とし、事前計算攻撃を難しくするためハッシュ前に加える値はどれですか。","choices":["公開鍵証明書だけ","ソルト","セッションIDだけ","ファイル拡張子"],"correctChoiceIndex":1,"explanation":"ソルトは利用者ごとに異なるランダム値です。パスワードと組み合わせてハッシュ化し、同じパスワードのハッシュ一致やレインボーテーブル攻撃を抑えます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"パスワードソルト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-signature-verification-495","questionText":"受信した文書のデジタル署名を検証するとき、署名者の確認に使う鍵はどれですか。","choices":["受信者の秘密鍵","共通の暗証番号","署名者の公開鍵","無関係な第三者の秘密鍵"],"correctChoiceIndex":2,"explanation":"署名者は秘密鍵で署名し、検証者は対応する公開鍵で検証します。証明書を使う場合は公開鍵と主体の結び付きも確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"デジタル署名検証鍵","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-certificate-revocation-496","questionText":"秘密鍵漏えいにより有効期限前のサーバ証明書を無効化した。この状態を利用者が確認する仕組みはどれですか。","choices":["DNSキャッシュだけ","画面ロックだけ","ファイル圧縮だけ","CRLやOCSPによる失効確認"],"correctChoiceIndex":3,"explanation":"CRLはCertificate Revocation List、OCSPはOnline Certificate Status Protocolで、証明書が失効していないかを確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"証明書失効確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-csrf-token-497","questionText":"利用者がログイン中のWebサイトへ、別サイトから意図しない送金要求を送らせる攻撃への対策はどれですか。","choices":["推測困難なCSRFトークンを要求ごとに検証する","全入力をSQLへ直接結合する","パスワードをURLへ常時表示する","Cookieを全サイトへ無条件送信する"],"correctChoiceIndex":0,"explanation":"CSRF（Cross-Site Request Forgery）対策では、正規画面からの要求だけが持つトークン検証やSameSite Cookieなどを用います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"CSRF要求検証","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-xss-escaping-498","questionText":"掲示板へ入力された文字列をHTMLとして解釈させず、スクリプト実行を防ぐ基本対策はどれですか。","choices":["入力をそのままscript要素へ入れる","出力先に応じて特殊文字をエスケープする","全利用者へ管理者権限を与える","監査ログを削除する"],"correctChoiceIndex":1,"explanation":"XSS（Cross-Site Scripting）対策では、HTML、属性、URLなど出力文脈に合ったエスケープを行い、必要に応じて入力制限も組み合わせます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"XSS出力無害化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-sql-injection-parameter-499","questionText":"ログイン入力をSQL文字列へ直接連結せず、命令と値を分離して実行する対策はどれですか。","choices":["入力値をSQL構文として評価する","DBエラーを全て利用者へ表示する","プレースホルダを使ったパラメータ化問合せ","管理者権限で全問合せを実行する"],"correctChoiceIndex":2,"explanation":"パラメータ化問合せはSQL文の構造と入力値を分離し、入力を命令として解釈させないことでSQLインジェクションを防ぎます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"SQL入力パラメータ化","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"technology-immutable-backup-500","questionText":"ランサムウェアがオンラインバックアップまで暗号化する被害へ備える対策として適切なものはどれですか。","choices":["本番端末と同じ権限で常時接続する","バックアップを一世代だけ上書きする","復元テストを一度も行わない","一定期間変更・削除できないバックアップを分離保管する"],"correctChoiceIndex":3,"explanation":"イミュータブルなバックアップやオフライン保管は、攻撃者による改変・削除を受けにくくします。複数世代と復元テストも重要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"改変不能バックアップ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」","applicableYear":2026,"createdAt":"2026-08-27T00:00:00+09:00","updatedAt":"2026-08-27T00:00:00+09:00"},{"id":"strategy-open-data-license-501","questionText":"自治体の公開データを新サービスで再利用する前に、最初に確認すべき事項はどれですか。","choices":["利用条件やライセンス","サーバのCPU温度","社内LANの配線長","利用者の画面解像度"],"correctChoiceIndex":0,"explanation":"オープンデータでも利用条件や出典表示、改変可否などが定められる場合があります。公開元のライセンスを確認して利用します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"オープンデータ利用条件","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-data-quality-accuracy-502","questionText":"顧客住所に誤記が多く配送不能が発生している。改善すべきデータ品質の観点はどれですか。","choices":["可用性","正確性","移植性","機密性"],"correctChoiceIndex":1,"explanation":"正確性はデータが現実の対象を正しく表す度合いです。住所の誤記を減らす入力検証や更新が改善策になります。","category":"ストラテジ系","subcategory":"企業活動","topic":"データ品質の正確性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-data-quality-timeliness-503","questionText":"在庫情報が月末にしか更新されず、販売時点の数量と合わない。改善すべき観点はどれですか。","choices":["完全性","独立性","適時性","真正性"],"correctChoiceIndex":2,"explanation":"適時性は必要な時点で最新のデータを利用できる度合いです。更新頻度を上げることで判断の遅れを抑えます。","category":"ストラテジ系","subcategory":"企業活動","topic":"データ品質の適時性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-dashboard-purpose-504","questionText":"経営者が売上、利益、在庫などの重要指標を一画面で継続監視したい。適した仕組みはどれですか。","choices":["コンパイラ","パケットフィルタ","ファイル圧縮","ダッシュボード"],"correctChoiceIndex":3,"explanation":"ダッシュボードは重要な指標をグラフなどでまとめ、状況や変化を素早く把握できるようにします。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"経営ダッシュボード","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-kpi-leading-505","questionText":"最終的な売上だけでなく、その前段階となる商談件数を日々追跡する主な目的はどれですか。","choices":["成果につながる先行指標を把握する","過去データを全て削除する","会計基準を変更する","通信を暗号化する"],"correctChoiceIndex":0,"explanation":"商談件数のような先行指標を追うと、最終成果が確定する前に活動状況を把握し、早めに改善できます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"KPI先行指標","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-bar-chart-choice-506","questionText":"複数店舗の同じ月の売上高を比較するとき、店舗間の大小を読み取りやすい図はどれですか。","choices":["折れ線グラフ","棒グラフ","散布図","ヒストグラム"],"correctChoiceIndex":1,"explanation":"棒グラフはカテゴリごとの量を棒の長さで比較する用途に適します。時系列の推移には折れ線グラフが向きます。","category":"ストラテジ系","subcategory":"企業活動","topic":"棒グラフの用途","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-line-chart-choice-507","questionText":"月ごとの電力使用量が一年間でどう変化したかを表すのに適した図はどれですか。","choices":["円グラフ","組織図","折れ線グラフ","特性要因図"],"correctChoiceIndex":2,"explanation":"折れ線グラフは時系列に沿った増減や傾向を示すのに適します。各時点の値を線で結んで変化を読み取ります。","category":"ストラテジ系","subcategory":"企業活動","topic":"折れ線グラフの用途","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-scatter-plot-choice-508","questionText":"広告費と売上高の関係を調べるため、二つの数値の組を点で表したい。適した図はどれですか。","choices":["円グラフ","ガントチャート","パレート図","散布図"],"correctChoiceIndex":3,"explanation":"散布図は二つの量的変数を縦軸と横軸に取り、相関や外れ値の有無を確認する用途に適します。","category":"ストラテジ系","subcategory":"企業活動","topic":"散布図の用途","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-histogram-choice-509","questionText":"製品重量を一定の区間に分け、各区間に入る個数から分布の形を確認したい。適した図はどれですか。","choices":["ヒストグラム","折れ線グラフ","レーダーチャート","PERT図"],"correctChoiceIndex":0,"explanation":"ヒストグラムは連続する数値を階級に分け、度数を隣接する棒で示して分布の形を把握します。","category":"ストラテジ系","subcategory":"企業活動","topic":"ヒストグラムの用途","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-misleading-axis-510","questionText":"二つの売上推移を比較するグラフで、差を実際より大きく見せないための対応はどれですか。","choices":["凡例を全て削除する","軸の範囲と目盛を明示する","値の単位を隠す","色だけで系列を区別する"],"correctChoiceIndex":1,"explanation":"軸の範囲や目盛を明示すると、切り取った軸などによる誤解を防ぎ、データを適切に読み取れます。","category":"ストラテジ系","subcategory":"企業活動","topic":"グラフの誤解防止","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-accessible-color-511","questionText":"警告状態を画面で示すとき、色覚の違いがある利用者にも伝わりやすい方法はどれですか。","choices":["赤と緑の色だけで示す","警告を点滅だけで示す","色に加えて文字や記号でも示す","説明を画像だけに埋め込む"],"correctChoiceIndex":2,"explanation":"色だけに依存せず、文字、形、アイコンなどを併用すると、多様な利用者が状態を識別しやすくなります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"色に依存しない情報提示","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-accessible-alt-text-512","questionText":"商品画像を音声読み上げ利用者にも理解できるようにする対応はどれですか。","choices":["画像ファイル名を乱数にする","文字サイズを固定する","背景と文字を同じ色にする","画像の内容を伝える代替テキストを付ける"],"correctChoiceIndex":3,"explanation":"代替テキストは画像が伝える目的や内容を文字で補い、画像を見られない場合にも情報を得られるようにします。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"代替テキスト","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-accessible-keyboard-513","questionText":"マウスを使えない利用者がWebサービスを操作できるようにする対応はどれですか。","choices":["主要操作をキーボードでも行えるようにする","クリック間隔を短くする","操作説明を削除する","全ボタンを画像にする"],"correctChoiceIndex":0,"explanation":"キーボードだけでもフォーカス移動や実行ができる設計は、運動機能に制約がある利用者などの操作性を高めます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"キーボード操作対応","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-accessible-contrast-514","questionText":"本文を読みやすくするため、文字色と背景色について適切な対応はどれですか。","choices":["常に同じ色にする","十分な明暗差を確保する","背景を細かく点滅させる","文字を極端に薄くする"],"correctChoiceIndex":1,"explanation":"文字と背景のコントラストを十分に取ると、弱視や屋外利用など多様な状況で読みやすくなります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"文字コントラスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-accessible-captions-515","questionText":"聴覚に頼らず動画の内容を理解できるようにする対応として、最も適切なものはどれですか。","choices":["映像の彩度だけを上げる","再生速度を常に2倍にする","発話内容と重要な音を字幕で示す","背景画像を毎秒切り替える"],"correctChoiceIndex":2,"explanation":"発話だけでなく警告音など重要な音も字幕で示すと、聴覚情報を得にくい利用者にも内容が伝わります。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"動画のアクセシビリティ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-information-hierarchy-516","questionText":"重要な見出しを大きくし、関連情報を近くにまとめる主な効果はどれですか。","choices":["通信速度を上げる","暗号鍵を長くする","在庫数を自動で増やす","情報の優先順位と関係を把握しやすくする"],"correctChoiceIndex":3,"explanation":"大きさや配置で情報の階層とまとまりを示すと、利用者は重要度や関連性を短時間で理解できます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"情報の視覚的階層","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ui-consistency-517","questionText":"同じ操作には各画面で同じ形と名称のボタンを使う主な理由はどれですか。","choices":["操作方法を予測しやすくする","保存容量を必ず半減する","法令の適用をなくす","ネットワーク障害を防ぐ"],"correctChoiceIndex":0,"explanation":"一貫したUIは既に学んだ操作方法を別画面でも使えるため、迷いや操作ミス、認知負荷を減らします。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"UIの一貫性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-progressive-disclosure-518","questionText":"初期画面には主要項目だけを示し、詳細設定は必要時に展開する設計の利点はどれですか。","choices":["全機能を利用不能にする","一度に示す情報量を抑えられる","データを暗号化できる","処理速度を必ず倍にする"],"correctChoiceIndex":1,"explanation":"必要性の低い詳細を段階的に表示すると、利用者が最初に判断する情報を絞り、認知負荷を軽減できます。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"段階的情報開示","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-green-server-consolidation-519","questionText":"複数の低稼働サーバを仮想化基盤へ集約することで期待できる環境面の効果はどれですか。","choices":["印刷枚数を増やす","通信を全て平文にする","稼働機器を減らして消費電力を抑える","廃棄周期を短くする"],"correctChoiceIndex":2,"explanation":"サーバ統合は物理機器の台数や冷却負荷を減らし、電力消費と資源使用の削減につながります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"グリーンITサーバ統合","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-green-power-management-520","questionText":"利用していないPCを自動的に低消費電力状態へ移行させる目的はどれですか。","choices":["画面の解像度を上げる","データ重複を増やす","認証を不要にする","待機中の電力消費を減らす"],"correctChoiceIndex":3,"explanation":"電源管理でスリープなどへ移行すると、利用していない時間帯の電力を削減できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"省電力設定","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-green-lifecycle-521","questionText":"IT機器を調達するとき、購入価格だけでなく廃棄まで含めて環境負荷を考える観点はどれですか。","choices":["製品ライフサイクル全体で評価する","初日の性能だけで評価する","広告の色だけで評価する","利用者数を無視する"],"correctChoiceIndex":0,"explanation":"製造、輸送、利用、再利用、廃棄までのライフサイクル全体を見ることで、総合的な環境負荷を評価できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"IT機器ライフサイクル","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-paperless-workflow-522","questionText":"申請書を電子化し、印刷と物理輸送を減らす取組で期待できる効果はどれですか。","choices":["全ての承認を省略できる","紙資源と輸送負荷を削減できる","法的責任が消える","情報漏えいが起きなくなる"],"correctChoiceIndex":1,"explanation":"電子化は紙や輸送を減らせますが、承認統制やアクセス管理などは引き続き必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"業務電子化と環境負荷","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-human-review-523","questionText":"生成された文章を顧客へ公開する業務で、誤情報による影響を抑える対応はどれですか。","choices":["出力を無条件で公開する","入力記録を全て削除する","担当者が根拠と内容を確認してから公開する","誤りがないと仮定する"],"correctChoiceIndex":2,"explanation":"生成AIの出力には誤りが含まれる可能性があるため、用途に応じて人間が根拠や表現を確認します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"生成AIの人間確認","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-bias-governance-524","questionText":"採用支援AIの評価が特定の属性に不利でないか確認する活動が重視する原則はどれですか。","choices":["可搬性","圧縮率","冗長性","公平性"],"correctChoiceIndex":3,"explanation":"公平性の観点では、学習データや評価結果の偏りを検証し、特定集団への不合理な不利益を抑えます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AI公平性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-explainability-525","questionText":"融資審査支援AIの判断理由を担当者が説明できるようにするため重視すべき観点はどれですか。","choices":["説明可能性","断片化","多重化","局所性"],"correctChoiceIndex":0,"explanation":"説明可能性は、AIの出力に至った要因や根拠を人が理解・説明できるようにする考え方です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AI説明可能性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-purpose-limitation-526","questionText":"顧客データをAI学習に使う際、収集時に示した目的との関係で必要な対応はどれですか。","choices":["目的を常に秘密にする","利用目的の範囲を確認する","データを無期限に公開する","本人識別を強める"],"correctChoiceIndex":1,"explanation":"個人データの利用では、通知・公表した利用目的の範囲や同意など、適用されるルールを確認します。","category":"ストラテジ系","subcategory":"法務","topic":"AIと利用目的","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-confidential-input-527","questionText":"外部の生成AIサービスへ社内の未公開設計情報を入力する前に必要な対応はどれですか。","choices":["全社員へ公開する","ファイル名だけ短くする","社内規程で入力可否を確認し、サービスの情報取扱条件も確認する","必ず個人端末を使う"],"correctChoiceIndex":2,"explanation":"AI（Artificial Intelligence：人工知能）を利用する場合でも、未公開設計情報などの機密情報を無断で外部AIへ入力してはいけません。まず、社内規程で入力可否を確認し、サービスの情報取扱条件も確認することが必要です。","category":"ストラテジ系","subcategory":"法務","topic":"生成AIと機密情報","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-copyright-output-528","questionText":"生成AIの出力を広告へ利用するとき、著作権面で適切な対応はどれですか。","choices":["AI出力なら無条件で自由と判断する","出典確認を禁止する","生成日時だけを確認する","既存著作物との類似性などを確認する"],"correctChoiceIndex":3,"explanation":"AI（Artificial Intelligence：人工知能）生成物を利用する場合も、既存著作物との類似性などを確認することが重要です。必要に応じて権利処理や専門家への確認を行います。","category":"ストラテジ系","subcategory":"法務","topic":"生成AIと著作権","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-accountability-529","questionText":"AIを使った業務判断で、問題発生時の対応主体をあらかじめ定める考え方はどれですか。","choices":["責任の所在を明確にする","判断を全て匿名化する","監督者を置かない","記録を残さない"],"correctChoiceIndex":0,"explanation":"AIを利用しても組織の責任はなくなりません。承認者、監視、異議申立てなどの役割を明確にします。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AIアカウンタビリティ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-security-prompt-injection-530","questionText":"外部文書を参照する生成AIが、文書中の悪意ある命令に従うリスクへの対策はどれですか。","choices":["全ての外部文書を管理者権限で実行する","入力を信頼せず権限と出力を制限する","検査せず自動送信する","秘密鍵を文書へ埋め込む"],"correctChoiceIndex":1,"explanation":"AI（Artificial Intelligence：人工知能）への入力を信頼せず権限と出力を制限するため、実行権限の最小化、入力検査、出力確認などを組み合わせて影響を抑えます。単一の対策で完全に防げるとは限りません。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AIプロンプトインジェクション対策","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-training-data-quality-531","questionText":"顧客対応AIの回答精度を改善するため、学習用データについて最も重要な対応はどれですか。","choices":["重複を無条件で増やす","出所を全て削除する","正確性と代表性を確認する","古いデータだけに限定する"],"correctChoiceIndex":2,"explanation":"AI（Artificial Intelligence：人工知能）の学習データでは、誤り、偏り、欠損がないか、対象を適切に表す代表性があるかなどを確認します。データ品質が低いと、学習結果や出力品質に悪影響を与える可能性があります。データを適法に利用できるかの確認も必要であり、高品質なデータでもAIが必ず正しい回答をするとは限りません。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AI学習データ品質","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ai-monitoring-drift-532","questionText":"運用開始後に顧客傾向が変わり、AIの予測精度が低下していないか継続確認する活動はどれですか。","choices":["データの全消去","監査証跡の廃止","画面色の固定","性能のモニタリング"],"correctChoiceIndex":3,"explanation":"環境やデータ分布の変化で性能が低下することがあります。指標を継続監視し、必要に応じて再評価します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"AI運用モニタリング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-subcontract-act-purpose-533","questionText":"発注側と受託側の取引で、代金支払や不当な取扱いの適正化を図る現行法はどれですか。","choices":["中小受託取引適正化法","著作権法","不正アクセス禁止法","労働者派遣法"],"correctChoiceIndex":0,"explanation":"中小受託取引適正化法は、対象となる取引で委託事業者の義務や禁止行為などを定め、取引の適正化を図ります。","category":"ストラテジ系","subcategory":"法務","topic":"中小受託取引適正化法","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-subcontract-payment-term-534","questionText":"対象となる委託取引で、発注側が受領後の支払期日を曖昧なままにしないため必要な対応はどれですか。","choices":["受託側だけに口頭で決めさせる","支払期日などの取引条件を明示する","受領記録を残さない","代金を成果と無関係に減額する"],"correctChoiceIndex":1,"explanation":"取引条件を明示して記録することは、支払期日や内容を巡る紛争を防ぎ、適正な取引につながります。","category":"ストラテジ系","subcategory":"法務","topic":"委託取引条件の明示","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-freelance-transaction-535","questionText":"個人の受託事業者へ業務を委託するとき、発注条件について適切な対応はどれですか。","choices":["条件を全て作業後に決める","報酬額を本人に知らせない","業務内容や報酬などを明示する","契約記録を必ず廃棄する"],"correctChoiceIndex":2,"explanation":"業務内容、報酬、支払期日などを明確に伝えることは、受託者との適正な取引の基本です。","category":"ストラテジ系","subcategory":"法務","topic":"フリーランス取引条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-personal-data-minimization-536","questionText":"会員登録でサービス提供に不要な個人情報まで収集しない考え方はどれですか。","choices":["全項目を公開する","保存期間を無期限にする","利用目的を後から隠す","必要な範囲に収集を限定する"],"correctChoiceIndex":3,"explanation":"目的に照らして必要なデータだけを扱うことで、漏えい時の影響や管理負担を抑えられます。","category":"ストラテジ系","subcategory":"法務","topic":"個人データ最小化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-privacy-impact-assessment-537","questionText":"位置情報を使う新サービスの開始前に、プライバシーへの影響と対策を整理する活動はどれですか。","choices":["プライバシー影響評価","棚卸資産評価","ベンチマーク試験","負荷分散"],"correctChoiceIndex":0,"explanation":"プライバシー影響評価では、個人情報の取扱いによるリスクを事前に特定し、低減策を検討します。","category":"ストラテジ系","subcategory":"法務","topic":"プライバシー影響評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-consent-record-538","questionText":"利用者の同意を根拠に個人データを扱う場合、後から確認できるようにする対応はどれですか。","choices":["同意画面を毎回変更して記録しない","同意内容と取得時点を記録する","目的を空欄にする","撤回方法を知らせない"],"correctChoiceIndex":1,"explanation":"何にいつ同意したかを記録すると、処理の根拠を説明し、同意の範囲を管理できます。","category":"ストラテジ系","subcategory":"法務","topic":"同意記録管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-trade-secret-access-539","questionText":"営業秘密として管理する設計資料について、適切な管理はどれですか。","choices":["社外へ自由に公開する","秘密である表示を全て外す","業務上必要な者だけにアクセスを許可する","退職者の権限を残す"],"correctChoiceIndex":2,"explanation":"秘密管理性を確保するには、対象を明確にし、アクセス制御や秘密表示などで秘密として管理します。","category":"ストラテジ系","subcategory":"法務","topic":"営業秘密アクセス管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-copyright-quotation-540","questionText":"他者の文章を資料へ引用するとき、一般に必要な対応はどれですか。","choices":["全文を自作と表示する","出所を意図的に隠す","引用部分を本文より常に大きくする","引用部分と出所を明確にする"],"correctChoiceIndex":3,"explanation":"引用では、公表済み著作物であることや主従関係などの条件を守り、引用部分と出所を明確にします。","category":"ストラテジ系","subcategory":"法務","topic":"著作物の引用","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-open-source-license-541","questionText":"オープンソースソフトウェアを製品へ組み込む前に確認すべき事項はどれですか。","choices":["ライセンスの利用・配布条件","公開リポジトリの閲覧回数","開発に使った端末の機種","配布ファイルの圧縮率"],"correctChoiceIndex":0,"explanation":"オープンソースでも著作権は存在し、表示義務やソース開示などライセンスごとに条件が異なります。","category":"ストラテジ系","subcategory":"法務","topic":"OSSライセンス条件","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-marketing-persona-542","questionText":"典型的な顧客像を具体化し、商品設計や訴求方法の検討に使うものはどれですか。","choices":["リスク登録簿","ペルソナ","データ辞書","監査調書"],"correctChoiceIndex":1,"explanation":"ペルソナは属性、行動、課題などを具体化した代表的な顧客像で、顧客視点の企画に利用します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"マーケティングペルソナ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-customer-journey-543","questionText":"顧客が商品を知ってから購入後までに接する場面と感情を時系列で整理するものはどれですか。","choices":["ネットワーク構成図","貸借対照表","カスタマージャーニーマップ","障害記録票"],"correctChoiceIndex":2,"explanation":"カスタマージャーニーマップは顧客の行動、接点、感情を可視化し、体験上の課題を見つけます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"カスタマージャーニー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-ab-test-544","questionText":"Web広告の見出しを二種類に分けて同時期に配信し、反応率を比較する方法はどれですか。","choices":["回帰テスト","侵入テスト","単体テスト","A/Bテスト"],"correctChoiceIndex":3,"explanation":"A/Bテストは条件の一部だけが異なる複数案を比較し、利用者の反応データから効果を評価します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"A/Bテスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-churn-rate-545","questionText":"月初顧客1,000人のうち、その月に50人が解約した。月間解約率はどれですか。","choices":["5%","0.5%","20%","95%"],"correctChoiceIndex":0,"explanation":"解約率は期間中の解約顧客数を期首顧客数で割るため、50÷1,000×100＝5%です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"解約率計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-conversion-rate-546","questionText":"商品ページを2,000人が閲覧し、80人が購入した。購入への転換率はどれですか。","choices":["0.4%","4%","25%","40%"],"correctChoiceIndex":1,"explanation":"転換率は目標行動をした人数÷対象人数×100なので、80÷2,000×100＝4%です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"コンバージョン率計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-customer-lifetime-value-547","questionText":"一回の売上だけでなく、顧客との取引期間全体で得られる利益を評価する指標はどれですか。","choices":["流動比率","在庫回転率","顧客生涯価値","労働分配率"],"correctChoiceIndex":2,"explanation":"顧客生涯価値は顧客との関係期間を通じて得られる収益や利益を捉え、獲得・維持施策の判断に使います。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"顧客生涯価値","difficul dAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-bottleneck-improvement-561","questionText":"工程全体の生産量を増やすため、最も処理能力が低い工程を優先改善する考え方はどれですか。","choices":["ボトルネックの改善","全工程を同じ割合で縮小する","需要予測を中止する","在庫記録を削除する"],"correctChoiceIndex":0,"explanation":"工程全体の能力は制約となる工程に左右されます。ボトルネックを特定して改善することが全体最適につながります。","category":"ストラテジ系","subcategory":"企業活動","topic":"ボトルネック改善","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-process-mining-562","questionText":"業務システムのイベントログから、実際の処理順序や滞留を可視化する手法はどれですか。","choices":["データ圧縮","プロセスマイニング","ソースコード難読化","公開鍵暗号"],"correctChoiceIndex":1,"explanation":"プロセスマイニングはイベントログを分析し、実際の業務プロセス、分岐、滞留、逸脱などを把握します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"プロセスマイニング","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-digital-twin-business-563","questionText":"設備の状態を仮想空間に再現し、保守時期や運用を検討する仕組みはどれですか。","choices":["データウェアハウス","デジタル署名","デジタルツイン","ワークシェアリング"],"correctChoiceIndex":2,"explanation":"デジタルツインは現実の設備などの状態をデータで仮想空間に再現し、監視や予測、シミュレーションに使います。","category":"ストラテジ系","subcategory":"システム戦略","topic":"デジタルツイン活用","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-api-economy-564","questionText":"企業が自社機能を外部から利用できる形で提供し、他社サービスとの連携を促す考え方はどれですか。","choices":["規模の不経済","垂直統合だけ","棚卸資産評価","APIエコノミー"],"correctChoiceIndex":3,"explanation":"API（Application Programming Interface）を通じて機能やデータを連携し、新たな価値や事業を生む考え方です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"APIエコノミー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-platform-business-565","questionText":"利用者と提供者など複数の参加者を結び付け、相互作用の場を提供する事業形態はどれですか。","choices":["プラットフォーム型ビジネス","受注生産だけの事業","単純な社内監査","固定資産管理"],"correctChoiceIndex":0,"explanation":"プラットフォーム型ビジネスは複数の参加者を結び付け、ネットワーク効果などを通じて価値を生みます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"プラットフォームビジネス","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-network-effect-566","questionText":"サービスの利用者が増えるほど、他の利用者にとっての価値も高まる効果はどれですか。","choices":["学習曲線効果","ネットワーク効果","減価償却","機会損失"],"correctChoiceIndex":1,"explanation":"ネットワーク効果は参加者の増加によって、接続相手や取引機会が増え、サービス価値が高まる現象です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"ネットワーク効果","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-subscription-model-567","questionText":"製品を一度売り切るのではなく、利用期間に応じて継続的に料金を受け取るモデルはどれですか。","choices":["オークションモデル","寄付モデルだけ","サブスクリプションモデル","物々交換モデル"],"correctChoiceIndex":2,"explanation":"サブスクリプションモデルは一定期間の利用権に対して継続課金し、長期的な顧客関係を重視します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"サブスクリプションモデル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-pilot-operation-568","questionText":"新システムを全社展開する前に、一部の部門で実際の業務に使い、運用上の課題を確認する方法はどれですか。","choices":["一斉移行","机上レビューだけ","システム監査","パイロット運用"],"correctChoiceIndex":3,"explanation":"パイロット運用は対象を限定して実業務で試し、操作手順や支援体制などの課題を全体展開前に見つける方法です。","category":"ストラテジ系","subcategory":"システム企画","topic":"パイロット運用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-minimum-viable-product-569","questionText":"利用者の反応を早く得るため、価値検証に必要な最小限の機能で提供する製品はどれですか。","choices":["実用最小限の製品","最終仕様を全て備えた製品","廃棄予定の製品","監査専用の製品"],"correctChoiceIndex":0,"explanation":"MVP（Minimum Viable Product）は仮説検証に必要な最小限の価値を提供し、利用者の反応から改善します。","category":"ストラテジ系","subcategory":"システム企画","topic":"MVP仮説検証","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-business-case-570","questionText":"システム投資の目的、費用、期待効果、リスクを整理して意思決定に使う文書はどれですか。","choices":["障害記録","ビジネスケース","ソースコード","パケット一覧"],"correctChoiceIndex":1,"explanation":"ビジネスケースは投資の必要性と実現可能性を説明し、開始・継続判断の根拠になります。","category":"ストラテジ系","subcategory":"システム企画","topic":"ビジネスケース","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-project-plan-integration-571","questionText":"スコープ、スケジュール、コストなど個別の計画を整合させ、プロジェクト全体の実行基準としてまとめた文書はどれですか。","choices":["課題管理表","会議議事録","プロジェクトマネジメント計画書","検収書"],"correctChoiceIndex":2,"explanation":"プロジェクトマネジメント計画書は、各管理領域の計画を統合し、実行・監視・終結の基準を示す文書です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"統合計画","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-stakeholder-analysis-572","questionText":"新システムの影響を受ける利用者や経営者について、関心度と影響力を整理する活動はどれですか。","choices":["ソースコード解析","周波数分析","在庫分析","ステークホルダ分析"],"correctChoiceIndex":3,"explanation":"ステークホルダ分析は関係者の期待、影響力、関心を把握し、適切な関与や情報共有を計画します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ステークホルダ分析","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-scope-baseline-573","questionText":"承認済みのスコープ記述、WBS、WBS辞書をまとめた基準はどれですか。","choices":["スコープベースライン","コスト実績","障害ベースライン","運用日報"],"correctChoiceIndex":0,"explanation":"スコープベースラインはプロジェクトで実施する範囲を管理し、変更要求を評価する基準になります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"スコープベースライン","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-work-package-574","questionText":"ワークパッケージとマイルストーンの違いとして、最も適切なものはどれですか。","choices":["両方とも作業期間を持つ作業単位である","ワークパッケージは管理可能な作業単位であり、マイルストーンはプロジェクト上の重要な節目を表す","マイルストーンだけが担当者へ割り当てる作業である","ワークパッケージは重要な時点だけを示す"],"correctChoiceIndex":1,"explanation":"WBS（Work Breakdown Structure）におけるワークパッケージは、見積り、担当割当て、進捗管理などが可能な作業単位です。一方、マイルストーンはプロジェクト上の重要な節目や時点を表し、それ自体は通常、作業ではありません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ワークパッケージとマイルストーン","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-milestone-purpose-575","questionText":"プロジェクト日程で、成果物承認など期間を持たない重要な節目を表すものはどれですか。","choices":["リソースプール","構成品目","マイルストーン","既知の誤り"],"correctChoiceIndex":2,"explanation":"マイルストーンは重要な完了点や判断点を示し、通常は作業期間を持ちません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"マイルストーン","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-schedule-buffer-576","questionText":"不確実性に備えて工程末尾などへ確保する余裕時間はどれですか。","choices":["監査証跡","データバッファだけ","差分バックアップ","スケジュールバッファ"],"correctChoiceIndex":3,"explanation":"スケジュールバッファは遅延リスクを吸収するための時間的余裕で、無計画な作業延長とは異なります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"スケジュールバッファ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-resource-leveling-577","questionText":"同じ担当者へ作業が重なっているため、開始時期を調整して負荷を平準化する手法はどれですか。","choices":["リソースレベリング","クラッシング","ファストトラッキング","ローリングバック"],"correctChoiceIndex":0,"explanation":"リソースレベリングは資源制約を考慮して日程を調整します。その結果、完了日が延びることもあります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"資源平準化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-fast-tracking-risk-578","questionText":"本来は順番に行う設計と実装の一部を並行させて工期を短縮する手法の注意点はどれですか。","choices":["費用が必ずゼロになる","手戻りリスクが高まる","品質確認が不要になる","依存関係が消える"],"correctChoiceIndex":1,"explanation":"ファストトラッキングは作業を並行化して期間を短縮しますが、前工程の変更による手戻りが増える可能性があります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"ファストトラッキング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-three-point-estimate-579","questionText":"作業期間を楽観値、最可能値、悲観値から見積もる方法はどれですか。","choices":["類推見積りだけ","ボトムアップ見積りだけ","三点見積り","固定価格契約"],"correctChoiceIndex":2,"explanation":"三点見積りは複数のシナリオを使い、不確実性を考慮した期待値や幅を求めます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"三点見積り","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-earned-value-cpi-580","questionText":"出来高120万円、実コスト100万円のとき、コスト効率指数はどれですか。","choices":["0.2","0.83","20","1.2"],"correctChoiceIndex":3,"explanation":"CPI（Cost Performance Index）はEV÷ACなので、120÷100＝1.2です。1を上回ると費用効率が良い状態です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVMコスト効率指数","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-earned-value-spi-581","questionText":"出来高90万円、計画価値100万円のとき、進捗効率指数はどれですか。","choices":["0.9","0.1","1.1","10"],"correctChoiceIndex":0,"explanation":"SPI（Schedule Performance Index）はEV÷PVなので、90÷100＝0.9です。1未満は計画より遅れていることを示します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"EVM進捗効率指数","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-risk-mitigation-582","questionText":"障害の発生確率を下げるため、事前に十分なテストと冗長化を行うリスク対応はどれですか。","choices":["リスク受容","リスク軽減","リスク移転","リスク回避"],"correctChoiceIndex":1,"explanation":"リスク軽減は、予防策などによってリスクの発生確率や発生時の影響を許容できる水準まで下げる対応です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク軽減","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-risk-transfer-insurance-583","questionText":"損失発生時の金銭的影響を保険会社へ移す対応はどれですか。","choices":["リスク回避","リスク強化","リスク移転","リスク無視"],"correctChoiceIndex":2,"explanation":"保険は影響の負担を第三者へ移す代表例です。リスクそのものが消えるわけではありません。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク移転","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-risk-reserve-584","questionText":"特定済みリスクが発生した場合の対応費用として予算に確保するものはどれですか。","choices":["減価償却累計額","未収金","営業外収益","コンティンジェンシー予備"],"correctChoiceIndex":3,"explanation":"コンティンジェンシー予備は特定したリスクへの対応に備える予算や時間です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"リスク対応予備","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-quality-cost-prevention-585","questionText":"欠陥を作り込まないための教育や手順改善にかかる費用はどれですか。","choices":["予防コスト","内部失敗コスト","外部失敗コスト","機会費用だけ"],"correctChoiceIndex":0,"explanation":"予防コストは欠陥の発生を防ぐ活動の費用です。検査は評価コスト、修正や補償は失敗コストに当たります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"品質予防コスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-control-chart-586","questionText":"工程の測定値を時系列で記録し、管理限界を超える異常を検出する図はどれですか。","choices":["散布図","管理図","組織図","状態遷移図"],"correctChoiceIndex":1,"explanation":"管理図は中心線と管理限界を用いて、工程のばらつきが統計的に安定しているか確認します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"管理図","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-pareto-quality-587","questionText":"不具合原因を件数の多い順に並べ、累積比率と合わせて重点原因を把握する図はどれですか。","choices":["管理図","散布図","パレート図","ガントチャート"],"correctChoiceIndex":2,"explanation":"パレート図は項目別の大きさと累積比率を示し、影響の大きい少数項目を優先改善する判断に使います。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"パレート図","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-change-control-board-588","questionText":"プロジェクトの重要な変更要求を審査し、承認または却下する組織はどれですか。","choices":["サービスデスク","監査対象部門","購買担当だけ","変更管理委員会"],"correctChoiceIndex":3,"explanation":"変更管理委員会は変更の効果、費用、リスク、影響を評価し、統合的に判断します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"変更管理委員会","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-lessons-learned-589","questionText":"プロジェクト終了時に成功要因や失敗原因を記録する主な目的はどれですか。","choices":["将来のプロジェクトで再利用する","記録を責任追及だけに使う","成果物を全て削除する","契約を自動更新する"],"correctChoiceIndex":0,"explanation":"教訓を組織の知識として残すと、将来の計画やリスク対応、見積りの改善に活用できます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"プロジェクト教訓","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-retrospective-purpose-590","questionText":"レトロスペクティブで「レビュー準備に時間がかかりすぎた」という課題が出た。次の反復へつなげる対応として最も適切なものはどれですか。","choices":["原因を記録せず会議を終了する","次の反復で試す具体的な改善策を決め、実行結果を後で確認する","成果物の機能追加だけを決める","改善案を決めず担当者を非難する"],"correctChoiceIndex":1,"explanation":"レトロスペクティブは振り返るだけでなく、良かった点と改善点を確認し、次の反復で試す具体的な改善行動を決める活動です。後の振り返りで実行結果を確認し、仕事の進め方を継続的に改善します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"レトロスペクティブの改善行動","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-service-value-591","questionText":"利用者が望む成果を得るための提供内容として、価値を構成する二つの観点の組合せはどれですか。","choices":["可用性と脆弱性","機密性と著作権","有用性と保証","売上高と固定費"],"correctChoiceIndex":2,"explanation":"サービスの価値は、目的に合う機能である有用性（utility）と、必要な条件で利用できる保証（warranty）の両面で捉えます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス価値","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-service-catalog-592","questionText":"社員がサービスカタログに掲載されている標準的なソフトウェアの利用を申請した。このような利用者からの標準サービスの申請を扱う活動として最も適切なものはどれですか。","choices":["問題管理","可用性管理","構成管理","サービス要求管理"],"correctChoiceIndex":3,"explanation":"サービス要求管理は、標準的なサービスの利用申請などを受け付け、定めた手順で処理する活動です。サービスカタログは、利用できるサービスの内容や申請方法を利用者へ示す情報として活用できます。障害によるサービス中断を扱うインシデント管理とは目的が異なります。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"標準サービスのサービス要求","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-service-request-593","questionText":"利用者からのパスワード再発行や標準ソフト導入依頼は一般に何として扱いますか。","choices":["サービス要求","重大インシデント","既知の誤り","監査指摘"],"correctChoiceIndex":0,"explanation":"サービス要求は、事前に定義された標準的な依頼や情報提供要求です。障害による中断とは区別します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス要求","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-major-incident-594","questionText":"多数の利用者へ大きな影響が出ている障害に対し、通常より迅速な指揮と連絡を行う扱いはどれですか。","choices":["通常変更だけ","重大インシデント管理","資産除却","内部監査"],"correctChoiceIndex":1,"explanation":"重大インシデントでは影響の大きさに応じて専用手順を開始し、復旧と関係者連絡を優先します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"重大インシデント管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-problem-known-error-595","questionText":"障害原因が分析され、回避策も文書化されている問題の状態はどれですか。","choices":["未承認変更","サービス要求","既知の誤り","構成ベースライン"],"correctChoiceIndex":2,"explanation":"既知の誤りは原因や回避策が把握された問題で、恒久対策までの復旧支援にも利用されます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"既知の誤り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-standard-change-596","questionText":"手順とリスクが事前評価され、繰り返し実施を承認済みの低リスク変更はどれですか。","choices":["緊急変更","通常変更","未承認変更","標準変更"],"correctChoiceIndex":3,"explanation":"標準変更は事前承認された定型手順に従います。毎回同じ審査を行う通常変更とは扱いが異なります。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"標準変更","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-emergency-change-597","questionText":"重大障害の復旧で通常より迅速な承認経路を使う変更はどれですか。","choices":["緊急変更","標準変更","サービス要求","問題記録"],"correctChoiceIndex":0,"explanation":"緊急変更でも評価と承認、実施後レビューは必要ですが、緊急用の手順で迅速に扱います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"緊急変更","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-configuration-item-598","questionText":"サービス提供のため管理対象とするサーバ、ソフトウェア、文書などの要素はどれですか。","choices":["管理限界","構成品目","ワークパッケージ","監査母集団"],"correctChoiceIndex":1,"explanation":"構成品目はサービス提供に必要で管理すべき要素です。関係や属性を把握し、変更影響の評価に使います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"構成品目","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-availability-redundancy-599","questionText":"単一機器の故障でサービス全体が停止しないよう同じ機能を複数用意する対策はどれですか。","choices":["標準化だけ","暗号化だけ","冗長化","圧縮だけ"],"correctChoiceIndex":2,"explanation":"冗長化は代替可能な構成要素を用意し、単一障害点を減らして可用性を高めます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"可用性冗長化","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-capacity-demand-600","questionText":"繁忙期の取引増加に備え、将来必要となる処理能力を予測する活動はどれですか。","choices":["問題管理","知識管理","監査証跡","キャパシティ計画"],"correctChoiceIndex":3,"explanation":"キャパシティ計画は需要予測と現在の利用状況を基に、必要な性能・容量を適切な時期に確保します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"キャパシティ需要予測","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-continuity-rto-601","questionText":"災害後、業務を何時間以内に復旧させるかという目標はどれですか。","choices":["目標復旧時間","目標復旧時点","平均修理時間","平均故障間隔"],"correctChoiceIndex":0,"explanation":"RTO（Recovery Time Objective）は停止から復旧までに許容される目標時間です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"目標復旧時間","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-continuity-rpo-602","questionText":"障害時に、どの時点までのデータ損失を許容するかを示す目標はどれですか。","choices":["目標復旧時間","目標復旧時点","応答時間","平均待ち時間"],"correctChoiceIndex":1,"explanation":"RPO（Recovery Point Objective）は復旧するデータの時点を示し、バックアップ頻度の検討に使います。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"目標復旧時点","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-service-level-review-603","questionText":"合意した稼働率や応答時間の実績を利用者と定期確認する活動はどれですか。","choices":["単体テスト","コードレビュー","サービスレベルレビュー","棚卸差異分析"],"correctChoiceIndex":2,"explanation":"サービスレベルレビューでは測定結果、未達原因、改善策などを顧客と確認し、継続的な改善につなげます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービスレベルレビュー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-continual-improvement-604","questionText":"サービスの現状を測定し、目標との差から改善を繰り返す活動はどれですか。","choices":["初期化","凍結だけ","障害隠蔽","継続的改善"],"correctChoiceIndex":3,"explanation":"継続的改善は現状、目標、測定結果を基に優先順位を付け、小さな改善を反復します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"サービス継続的改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-audit-evidence-605","questionText":"監査証拠の十分性と適切性について、正しい説明はどれですか。","choices":["十分性では必要な証拠量を、適切性では関連性や信頼性などの質を評価する","監査期間の長さと監査担当者の人数だけを評価する","保存ファイル数と文書のレイアウトだけを評価する","証拠を多く集めれば情報源の信頼性は評価しなくてよい"],"correctChoiceIndex":0,"explanation":"監査証拠の十分性は、監査意見を裏付けるために必要な証拠の量を表します。適切性は、証拠が監査目的に関連し、信頼できるかという質を表します。量が多くても、関連性や信頼性が低ければ適切な証拠とはいえません。","category":"マネジメント系","subcategory":"システム監査","topic":"監査証拠の十分性と適切性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-audit-sampling-606","questionText":"大量の取引全件ではなく、一部を選んで統制の運用状況を評価する方法はどれですか。","choices":["多重化","監査サンプリング","負荷分散","ペアプログラミング"],"correctChoiceIndex":1,"explanation":"監査サンプリングは母集団から標本を選び、その結果から母集団の特性を評価します。","category":"マネジメント系","subcategory":"システム監査","topic":"監査サンプリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-audit-follow-up-607","questionText":"監査で指摘した改善策が実施されたか後日確認する活動はどれですか。","choices":["キックオフ","ロールバック","フォローアップ","フェールオーバ"],"correctChoiceIndex":2,"explanation":"フォローアップは指摘事項への対応状況と改善効果を確認し、必要に応じて追加対応を求めます。","category":"マネジメント系","subcategory":"システム監査","topic":"監査フォローアップ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-control-self-assessment-608","questionText":"業務部門が自ら統制の有効性を点検し、改善点を見つける活動はどれですか。","choices":["外部侵入試験","市場調査","コード生成","統制自己評価"],"correctChoiceIndex":3,"explanation":"統制自己評価は統制を運用する部門自身がリスクと統制状況を確認し、改善へつなげます。","category":"マネジメント系","subcategory":"システム監査","topic":"統制自己評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-it-general-controls-609","questionText":"システム開発、アクセス管理、運用管理など、複数業務システムを支える統制はどれですか。","choices":["IT全般統制","業務処理統制だけ","在庫評価","市場統制"],"correctChoiceIndex":0,"explanation":"IT全般統制はシステム環境全体の信頼性を支え、個々の業務処理統制が有効に働く基盤になります。","category":"マネジメント系","subcategory":"システム監査","topic":"IT全般統制","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"management-audit-independence-threat-610","questionText":"監査人が自分で設計したシステムを自ら監査する場合に損なわれる原則はどれですか。","choices":["可用性","独立性","移植性","拡張性"],"correctChoiceIndex":1,"explanation":"自己レビューは客観的判断を妨げるおそれがあります。監査対象から独立した立場を確保する必要があります。","category":"マネジメント系","subcategory":"システム監査","topic":"監査独立性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-generative-ai-token-611","questionText":"文章生成モデルが入力文を処理するときに扱う、文字や単語を分割した基本単位はどれですか。","choices":["ピクセル","セクタ","トークン","パケットだけ"],"correctChoiceIndex":2,"explanation":"トークンはモデルが文章を処理する単位で、単語そのものや単語の一部、記号などになる場合があります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AIトークン","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-generative-ai-prompt-612","questionText":"文章生成モデルへ、目的、条件、出力形式などを伝える入力はどれですか。","choices":["チェックポイント","デバイスドライバ","サブネットマスク","プロンプト"],"correctChoiceIndex":3,"explanation":"プロンプトは生成AIへ与える指示や文脈です。目的や制約を明確にすると、望む形式の出力を得やすくなります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AIプロンプト","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-generative-ai-hallucination-613","questionText":"文章生成モデルが事実ではない内容を、もっともらしく出力する現象はどれですか。","choices":["ハルシネーション","フラグメンテーション","スワッピング","パイプライン"],"correctChoiceIndex":0,"explanation":"ハルシネーションは根拠のない情報や誤情報を自然な文章で生成する現象で、外部資料との照合が必要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AIハルシネーション","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-generative-ai-grounding-614","questionText":"社内規程に基づく回答を生成させるため、検索した規程文を回答時の根拠として与える目的はどれですか。","choices":["モデルの記憶容量を物理的に増やす","根拠となる情報へ出力を結び付ける","通信を必ず匿名化する","学習データを全て削除する"],"correctChoiceIndex":1,"explanation":"グラウンディングは、AI（Artificial Intelligence：人工知能）へ関連文書などの参照情報を回答時の文脈として与え、出力を根拠へ結び付ける方法です。誤情報を抑えやすくしますが、回答の正確性を保証するものではないため、内容確認も必要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AIグラウンディング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-generative-ai-temperature-615","questionText":"文章生成で設定値を上げると一般に出力の多様性が増える一方、安定性が下がりやすい調整対象はどれですか。","choices":["ディスク回転数","IPアドレス長","生成時のランダム性","暗号鍵の保管場所"],"correctChoiceIndex":2,"explanation":"生成時のランダム性に関する設定は候補語の選び方へ影響します。正確性が必要な用途では出力確認も重要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"生成AI出力多様性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-supervised-learning-label-616","questionText":"迷惑メール判定モデルの学習で、各メールに付ける「迷惑」「通常」という正解情報はどれですか。","choices":["ハッシュ値","ポート番号","ページ番号","ラベル"],"correctChoiceIndex":3,"explanation":"教師あり学習では入力データと正解となるラベルの組を使い、入力から正解を予測する関係を学習します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"教師あり学習ラベル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-unsupervised-clustering-617","questionText":"正解ラベルのない顧客データを、購買傾向が似た集団へ分ける手法はどれですか。","choices":["クラスタリング","回帰テスト","電子署名","排他制御"],"correctChoiceIndex":0,"explanation":"クラスタリングはデータ間の類似性に基づいてグループ化する教師なし学習の代表的手法です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"クラスタリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-classification-task-618","questionText":"過去の取引データから、新しい取引を「不正」「正常」のいずれかに分ける課題はどれですか。","choices":["回帰","分類","圧縮","ソートだけ"],"correctChoiceIndex":1,"explanation":"分類は入力を離散的なクラスへ割り当てる課題です。連続した数値を予測する回帰とは異なります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"機械学習分類","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-regression-task-619","questionText":"住宅の広さや築年数から販売価格という連続した数値を予測する課題はどれですか。","choices":["分類","クラスタリング","回帰","暗号化"],"correctChoiceIndex":2,"explanation":"回帰は連続値を予測する課題です。種類や区分を予測する分類とは出力の性質が異なります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"機械学習回帰","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-training-test-split-620","questionText":"モデルを学習したデータとは別のデータで予測性能を確認する主な理由はどれですか。","choices":["学習データを暗号化する","CPU温度を測る","ネットワーク経路を短くする","未知データへの性能を評価する"],"correctChoiceIndex":3,"explanation":"学習に使っていないテストデータで評価すると、未知データへどの程度適用できるかを確認できます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"訓練テスト分割","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-overfitting-621","questionText":"学習データでは高精度だが、新しいデータでは精度が大きく下がる状態はどれですか。","choices":["過学習","多重化","正規化","仮想化"],"correctChoiceIndex":0,"explanation":"過学習は学習データの細部や雑音まで覚え、未知データへ一般化できていない状態です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"機械学習過学習","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-confusion-matrix-622","questionText":"分類モデルの真陽性、偽陽性、真陰性、偽陰性を表にまとめたものはどれですか。","choices":["隣接行列","混同行列","単位行列","決定表"],"correctChoiceIndex":1,"explanation":"混同行列は予測と実際の組合せを集計し、適合率や再現率などの評価指標を求める基礎になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"混同行列","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-recall-calc-623","questionText":"実際に不正だった100件のうち、モデルが不正と検出できたものが90件だった。再現率はどれですか。","choices":["10%","50%","90%","110%"],"correctChoiceIndex":2,"explanation":"再現率は実際の陽性のうち検出できた割合なので、90÷100×100＝90%です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"再現率計算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-f1-balance-624","questionText":"不正検知モデルで適合率と再現率の両方を一つの値で評価したいときに使う指標はどれですか。","choices":["平均故障間隔","流動比率","在庫回転率","F1値"],"correctChoiceIndex":3,"explanation":"F1値は適合率と再現率の調和平均で、両方のバランスを評価します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"F1値","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-data-normalization-ml-625","questionText":"単位や値の範囲が大きく異なる特徴量を、学習前に共通の尺度へ変換する処理はどれですか。","choices":["特徴量のスケーリング","データの公開","パケット分割","鍵交換"],"correctChoiceIndex":0,"explanation":"特徴量のスケーリングは値の範囲をそろえ、特定の特徴量だけが尺度の大きさで過度に影響することを防ぎます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"特徴量スケーリング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-missing-value-treatment-626","questionText":"分析用表の一部項目が欠けている場合に、分析前に行う処理として適切なものはどれですか。","choices":["常に0へ置換する","欠損の原因を確認し補完や除外を選ぶ","欠損を秘密鍵にする","全データを複製する"],"correctChoiceIndex":1,"explanation":"欠損の意味や発生原因を確認し、目的に応じて補完、除外、欠損を示す特徴追加などを選びます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"欠損値処理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-outlier-investigation-627","questionText":"売上データに通常の100倍の値が1件あった。分析前の適切な対応はどれですか。","choices":["必ず削除する","必ず平均値へ置換する","入力誤りか実際の事象か確認する","確認せず公開する"],"correctChoiceIndex":2,"explanation":"外れ値は入力誤りの場合も重要な事象の場合もあります。原因を確認してから扱いを判断します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"外れ値確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-confounding-variable-628","questionText":"気温が高い日に飲料販売数と水難事故数がともに増えた。この二つの増加に共通して影響した可能性がある気温を何と呼びますか。","choices":["目的変数","主キー","チェックディジット","交絡要因"],"correctChoiceIndex":3,"explanation":"交絡要因は、調べたい二つの変数の双方に影響して、見かけの関連を生じさせる第三の要因です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"交絡要因","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-sampling-bias-629","questionText":"オンライン調査を自社SNSの利用者だけに実施し、市場全体の意見とみなす場合の問題はどれですか。","choices":["標本が母集団を代表しない可能性がある","暗号鍵が短くなる","CPUが停止する","SQL構文が変わる"],"correctChoiceIndex":0,"explanation":"標本の選び方に偏りがあると、調査結果を母集団全体へ一般化できない場合があります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"標本抽出バイアス","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-anonymization-risk-630","questionText":"個人を直接示す氏名を削除したデータについても必要な注意はどれですか。","choices":["必ず個人情報ではなくなると断定する","他の情報との組合せで再識別される可能性を評価する","無制限に公開する","安全管理を全てやめる"],"correctChoiceIndex":1,"explanation":"直接識別子を除いても、属性の組合せや外部データとの照合で個人が推定される場合があります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"再識別リスク","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-pseudonymization-631","questionText":"顧客IDを別の管理番号へ置き換え、対応表を分離保管する処理はどれですか。","choices":["完全な消去","可逆圧縮","仮名化","電子署名"],"correctChoiceIndex":2,"explanation":"仮名化は追加情報なしでは個人を特定しにくくする処理です。対応表などの追加情報は分離して安全に管理します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"データ仮名化","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-binary-shift-left-632","questionText":"8ビット範囲で、2進数00000101を左へ1ビット論理シフトした結果はどれですか。","choices":["00000010","00000111","10000101","00001010"],"correctChoiceIndex":3,"explanation":"左へ1ビットの論理シフトは値を2倍することに相当します。5を2倍した10は00001010です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"左論理シフト","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-binary-or-633","questionText":"4ビットの権限フラグ1010に、新たな権限0110を論理和（OR）で追加した結果はどれですか。","choices":["1110","1010","0110","0000"],"correctChoiceIndex":0,"explanation":"論理和（OR）は対応するビットのどちらか一方でも1なら1です。各桁を計算すると1110になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"OR演算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-binary-not-634","questionText":"4ビットのビット列1010について、各ビットを反転した結果はどれですか。","choices":["1010","0101","1100","0110"],"correctChoiceIndex":1,"explanation":"NOT演算は0を1へ、1を0へ反転するため、1010は0101になります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"NOT演算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-hex-addition-635","questionText":"16進数のAと5を加算した結果はどれですか。","choices":["B","10","F","15"],"correctChoiceIndex":2,"explanation":"16進数Aは10進数の10なので、10＋5＝15です。16進数で15はFと表します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"16進数加算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-information-bits-16-636","questionText":"同じ確率で起こる16種類を区別するために最低限必要な情報量はどれですか。","choices":["2ビット","8ビット","16ビット","4ビット"],"correctChoiceIndex":3,"explanation":"nビットで2のn乗通りを表せます。2の4乗＝16なので4ビット必要です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"情報量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-truth-table-purpose-637","questionText":"論理式について、入力の全組合せと出力の関係を整理する表はどれですか。","choices":["真理値表","度数分布表","資金繰表","工程表"],"correctChoiceIndex":0,"explanation":"真理値表は論理変数の全入力パターンに対する論理式の結果を示します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"真理値表","difficulty":2,"source":"IPA「
