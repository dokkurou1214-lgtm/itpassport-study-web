持つ要素について、並べ替え前の順序を保つ性質はどれですか。","choices":["完全性","安定性","機密性","独立性"],"correctChoiceIndex":1,"explanation":"安定なソートはキーが等しい要素の元の順序を維持し、複数キーで段階的に並べる場合などに役立ちます。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"安定ソート","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-hash-table-average-643","questionText":"適切なハッシュ関数と十分な表容量がある場合、キー検索の平均計算量として期待されるものはどれですか。","choices":["O(log n)","O(n)","O(1)","O(n²)"],"correctChoiceIndex":2,"explanation":"ハッシュ表はキーから格納位置を直接計算するため平均O(1)を期待できますが、衝突が多いと悪化します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"ハッシュ探索計算量","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-linked-list-insertion-644","questionText":"位置を示す要素が既に分かっている連結リストで、その直後へ要素を追加する利点はどれですか。","choices":["常に二分探索できる","添字で直接アクセスできる","メモリを全く使わない","後続要素をまとめて移動せずに済む"],"correctChoiceIndex":3,"explanation":"連結リストは参照先を付け替えて挿入できます。配列のように後続要素を連続して移動する必要がありません。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"連結リスト挿入","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-queue-printer-645","questionText":"複数利用者から届いた印刷要求を到着順に処理するため適したデータ構造はどれですか。","choices":["キュー","スタック","二分木","ハッシュ値"],"correctChoiceIndex":0,"explanation":"キューは先に入った要素を先に取り出すFIFO方式で、到着順の処理に適します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"印刷待ちキュー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-stack-undo-646","questionText":"編集操作の取消しを、直前の操作から逆順に行うため適したデータ構造はどれですか。","choices":["キュー","スタック","ヒープファイル","隣接行列"],"correctChoiceIndex":1,"explanation":"スタックは最後に入れた要素を最初に取り出すLIFO方式で、操作履歴の取消しに適します。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"取消しスタック","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-deadlock-condition-647","questionText":"二つの処理が複数の資源を利用するシステムで、デッドロックの発生を防ぎやすくする方法として最も適切なものはどれですか。","choices":["各処理が異なる順序で自由に資源を取得する","取得済みの資源を保持したまま無期限に待機する","すべての処理が資源を取得する順序を統一する","処理の待ち状態を一切監視しない"],"correctChoiceIndex":2,"explanation":"デッドロックは、複数の処理による資源待ちが循環すると発生することがあります。すべての処理が資源を同じ順序で取得するようにすると、循環待ちを防ぎやすくなります。ほかにもタイムアウトを設けるなどの対策があります。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"資源取得順序によるデッドロック予防","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-process-thread-648","questionText":"プロセスとスレッドの違いについて、最も適切な説明はどれですか。","choices":["同じプロセス内のスレッドも、必ずそれぞれ独立したメモリ空間を持つ","プロセスとスレッドは名称だけが異なり、実行単位としての違いはない","別々のプロセスは、通常一つのメモリ空間をそのまま直接共有する","同じプロセス内のスレッドはメモリ空間などを共有できるが、別プロセスは通常それぞれ独立したメモリ空間を持つ"],"correctChoiceIndex":3,"explanation":"プロセスは実行中のプログラムの単位で、一般にプロセスごとに独立したメモリ空間を持ちます。同じプロセス内のスレッドは、メモリ空間などの資源を共有しながら実行できます。そのため、スレッド間では共有データの扱いにも注意が必要です。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"プロセスとスレッドの違い","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-memory-protection-649","questionText":"OSがプロセスごとに使用できるメモリ領域を分け、他のプロセスの領域への不正な書込みを防ぐ機能はどれですか。","choices":["メモリ保護","スプーリング","デフラグメンテーション","名前解決"],"correctChoiceIndex":0,"explanation":"メモリ保護はプロセスが許可されていない領域へアクセスすることを防ぎ、障害や不正操作の影響を隔離します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"メモリ保護","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cpu-pipeline-hazard-650","questionText":"命令を段階的に並行処理するCPUで、分岐やデータ依存により処理が一時停止する原因はどれですか。","choices":["キャッシュヒット","パイプラインハザード","クロックゲーティング","ライトスルー"],"correctChoiceIndex":1,"explanation":"CPU（Central Processing Unit）のパイプラインハザードは、命令間依存、分岐、資源競合などで予定どおり並行処理できない状態です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"パイプラインハザード","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-memory-ecc-651","questionText":"主記憶の1ビット誤りを訂正し、複数ビット誤りを検出できる方式として利用されるものはどれですか。","choices":["ROMだけ","USBハブ","ECCメモリ","液晶パネル"],"correctChoiceIndex":2,"explanation":"ECC（Error Correcting Code）メモリは冗長な検査情報を使い、代表的には1ビット訂正と複数ビット検出を行います。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ECCメモリ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-storage-iops-652","questionText":"ストレージが1秒間に処理できる入出力操作回数を表す指標はどれですか。","choices":["DPI","FPS","bpsだけ","IOPS"],"correctChoiceIndex":3,"explanation":"IOPS（Input/Output Operations Per Second）は、ストレージのランダムアクセス性能などを表す指標です。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"ストレージIOPS","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-index-tradeoff-653","questionText":"検索を高速化するため表へ索引を追加した場合の一般的な注意点はどれですか。","choices":["更新時の処理と保存容量が増える","表の全データが自動暗号化される","主キーが不要になる","障害が起きなくなる"],"correctChoiceIndex":0,"explanation":"索引は検索を高速化しますが、追加・更新・削除時に索引も更新する必要があり、容量も使用します。","category":"テクノロジ系","subcategory":"データベース","topic":"DB索引のトレードオフ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-composite-key-654","questionText":"受注明細表で「受注番号」と「明細番号」の組合せにより行を一意に識別するキーはどれですか。","choices":["外部キーだけ","複合主キー","候補値","検査制約"],"correctChoiceIndex":1,"explanation":"複合主キーは複数列の組合せで行を一意に識別します。各列単独では重複しても構いません。","category":"テクノロジ系","subcategory":"データベース","topic":"複合主キー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-view-655","questionText":"利用者ごとに必要な列だけを見せるため、問合せ結果を仮想的な表として定義するものはどれですか。","choices":["ログファイル","チェックポイント","ビュー","トリガだけ"],"correctChoiceIndex":2,"explanation":"ビューはSELECT結果を仮想表として扱い、表示範囲の限定や複雑な問合せの再利用に役立ちます。","category":"テクノロジ系","subcategory":"データベース","topic":"データベースビュー","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-sql-left-join-656","questionText":"顧客表の全顧客を残し、注文がある場合だけ注文情報も結合したい。適した結合はどれですか。","choices":["内部結合","直積だけ","自己結合だけ","左外部結合"],"correctChoiceIndex":3,"explanation":"左外部結合は左側の表の行を全て残し、右側に対応行がなければその列をNULLとして返します。","category":"テクノロジ系","subcategory":"データベース","topic":"SQL左外部結合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-sql-transaction-rollback-657","questionText":"複数の更新処理の途中でエラーが起きたため、開始前の状態へ戻す操作はどれですか。","choices":["ROLLBACK","COMMIT","GRANT","CREATE"],"correctChoiceIndex":0,"explanation":"ROLLBACKは未確定のトランザクション変更を取り消します。COMMITは変更を確定します。","category":"テクノロジ系","subcategory":"データベース","topic":"SQLロールバック","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-isolation-658","questionText":"同時実行中の取引が互いの未確定な更新を読まないようにする性質はどれですか。","choices":["原子性","独立性","一貫性","永続性"],"correctChoiceIndex":1,"explanation":"独立性は同時実行するトランザクションが互いに不適切な影響を与えず、直列実行と同等に扱える性質です。","category":"テクノロジ系","subcategory":"データベース","topic":"ACID独立性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-deadlock-659","questionText":"DBMSが二つのトランザクション間でデッドロックが発生していることを検出した。待ち状態を解消する対応として最も適切なものはどれですか。","choices":["両方のトランザクションを無期限に待機させる","ロックをさらに追加して解除を禁止する","一方のトランザクションを取り消してロックを解放し、他方が処理を継続できるようにする","デッドロックを検出しても何も処理しない"],"correctChoiceIndex":2,"explanation":"DBMS（Database Management System：データベース管理システム）でデッドロックが起きると、トランザクションが互いのロック解放を待つ循環待ちになります。検出後、一方のトランザクションを取り消してロックを解放すれば、他方が処理を継続できます。取り消されたトランザクションは必要に応じて再実行します。","category":"テクノロジ系","subcategory":"データベース","topic":"DBデッドロック検出後の解消","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-backup-consistency-660","questionText":"稼働中データベースのバックアップで、更新途中の不整合を防ぐため重要なものはどれですか。","choices":["表名を毎回変更する","全利用者へ管理権限を与える","ログを先に全削除する","整合した時点を確保する仕組み"],"correctChoiceIndex":3,"explanation":"スナップショットやDBMSのバックアップ機能を使い、データとログの整合した復旧可能点を確保します。","category":"テクノロジ系","subcategory":"データベース","topic":"DB整合バックアップ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-database-replication-661","questionText":"同じデータを複数のデータベースへ複製し、可用性や参照性能を高める仕組みはどれですか。","choices":["レプリケーション","正規化","射影","排他制御"],"correctChoiceIndex":0,"explanation":"レプリケーションはデータの複製を別サーバなどへ保持します。更新反映の遅延や整合性も考慮します。","category":"テクノロジ系","subcategory":"データベース","topic":"DBレプリケーション","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-data-warehouse-662","questionText":"複数の業務システムから時系列データを集め、分析向けに統合して保持するものはどれですか。","choices":["トランザクションログ","データウェアハウス","DNSキャッシュ","仮想記憶"],"correctChoiceIndex":1,"explanation":"データウェアハウスは複数源のデータを統合し、履歴分析や意思決定支援に適した形で蓄積します。","category":"テクノロジ系","subcategory":"データベース","topic":"データウェアハウス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-etl-process-663","questionText":"複数システムからデータを取り出し、形式を変換して分析基盤へ格納する一連の処理はどれですか。","choices":["EVM","SLA","ETL","PKI"],"correctChoiceIndex":2,"explanation":"ETLはExtract、Transform、Loadの略で、抽出・変換・格納の順にデータを分析基盤へ集約します。","category":"テクノロジ系","subcategory":"データベース","topic":"ETL処理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-star-schema-664","questionText":"分析用データベースで、売上などの数値表を中心に商品や日付の表を配置する構造はどれですか。","choices":["リング型構成","バス型構成","階層型ファイル","スタースキーマ"],"correctChoiceIndex":3,"explanation":"スタースキーマはファクト表を中心にディメンション表を結び、集計や分析を分かりやすくします。","category":"テクノロジ系","subcategory":"データベース","topic":"スタースキーマ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-cidr-665","questionText":"IPアドレスの後ろに「/24」のような長さを書き、ネットワーク部を示す表記はどれですか。","choices":["CIDR表記","URLエンコード","MIME形式","JSON形式"],"correctChoiceIndex":0,"explanation":"CIDR（Classless Inter-Domain Routing）表記はプレフィックス長でネットワーク部のビット数を示します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"CIDR表記","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-link-local-666","questionText":"DHCPサーバからIPv4アドレスを取得できないとき、端末が同一リンク内の通信のため自動設定するアドレスはどれですか。","choices":["グローバルユニキャストアドレス","リンクローカルアドレス","ループバックアドレス","マルチキャストアドレス"],"correctChoiceIndex":1,"explanation":"DHCP（Dynamic Host Configuration Protocol）で取得できない場合、IPv4のリンクローカルアドレスは169.254.0.0/16から自動設定され、同一リンク内で使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"IPv4リンクローカル","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-default-gateway-667","questionText":"端末が同一ネットワーク外へパケットを送るとき、通常最初に渡す機器の設定はどれですか。","choices":["DNSゾーン","メールボックス","デフォルトゲートウェイ","ファイル記述子"],"correctChoiceIndex":2,"explanation":"デフォルトゲートウェイは宛先への個別経路がない場合にパケットを渡すルータなどのアドレスです。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"デフォルトゲートウェイ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-arp-668","questionText":"同一LAN内でIPv4アドレスに対応するMACアドレスを調べる仕組みはどれですか。","choices":["SMTP","NTP","SNMP","ARP"],"correctChoiceIndex":3,"explanation":"ARP（Address Resolution Protocol）はIPv4アドレスから同一リンク上のMACアドレスを解決します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"ARPアドレス解決","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-icmp-669","questionText":"IP通信で到達不能などのエラー通知や診断に利用されるプロトコルはどれですか。","choices":["ICMP","IMAP","LDAP","SFTP"],"correctChoiceIndex":0,"explanation":"ICMP（Internet Control Message Protocol）はIP通信のエラー通知や到達確認などに使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"ICMP診断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-ntp-670","questionText":"複数サーバの時計を基準時刻へ合わせるために使うプロトコルはどれですか。","choices":["POP3","NTP","DHCP","FTP"],"correctChoiceIndex":1,"explanation":"NTP（Network Time Protocol）はネットワーク経由で時刻を同期し、ログ比較や認証の正確性を支えます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"NTP時刻同期","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-snmp-671","questionText":"ルータやスイッチの状態情報を収集し、ネットワーク機器を監視するプロトコルはどれですか。","choices":["SMTP","SIP","SNMP","SQL"],"correctChoiceIndex":2,"explanation":"SNMP（Simple Network Management Protocol）は機器の状態取得や設定通知など、ネットワーク管理に使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"SNMP監視","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-vlan-672","questionText":"一台のスイッチ上で、論理的に複数のブロードキャスト範囲へ分割する技術はどれですか。","choices":["VPN","NAT","DNSラウンドロビン","VLAN"],"correctChoiceIndex":3,"explanation":"VLAN（Virtual Local Area Network）は物理構成に依存せずLANを論理分割し、通信範囲を分離します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"VLAN論理分割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-wifi-wpa3-673","questionText":"無線LANでWEPの利用を避けるべき主な理由はどれですか。","choices":["既知の弱点があり、通信を解読される危険性が高いため","通信速度が有線LANより遅くなるため","アクセスポイントにSSIDを設定できないため","接続できる端末が1台に制限されるため"],"correctChoiceIndex":0,"explanation":"WEP（Wired Equivalent Privacy）には既知のセキュリティ上の弱点があり、通信を解読される危険性が高いため利用を避けます。環境に応じてWPA2（Wi-Fi Protected Access 2）やWPA3（Wi-Fi Protected Access 3）などの適切な方式を利用します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"WEPの脆弱性","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-load-balancer-674","questionText":"複数のWebサーバへ利用者の要求を振り分け、負荷と停止影響を分散する装置はどれですか。","choices":["リピータだけ","ロードバランサ","プリンタサーバ","時刻サーバ"],"correctChoiceIndex":1,"explanation":"ロードバランサは要求を複数サーバへ分散し、性能や可用性を高めます。健全性確認と組み合わせます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"ロードバランサ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-cdn-675","questionText":"利用者に近い拠点から画像や動画を配信し、遅延と配信元負荷を減らす仕組みはどれですか。","choices":["VPN","VLAN","CDN","RAID"],"correctChoiceIndex":2,"explanation":"CDN（Content Delivery Network）は複数地域のキャッシュサーバからコンテンツを配信します。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"CDN配信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-network-websocket-676","questionText":"Webブラウザとサーバ間で接続を維持し、双方向にデータを送受信する技術はどれですか。","choices":["電子メールだけ","DNSゾーン転送","ファイル圧縮","WebSocket"],"correctChoiceIndex":3,"explanation":"WebSocketは接続確立後に双方向通信を継続でき、チャットやリアルタイム更新などに使われます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"WebSocket双方向通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-zero-trust-677","questionText":"ゼロトラストの考え方に基づき、正しく認証された利用者が社内システムへアクセスするとき、使用している端末のOS更新が未適用で安全性を確認できない場合の対応として適切なものはどれですか。","choices":["端末の安全状態を確認できるまで、アクセスを制限する","社内ネットワークからの接続なので無条件に許可する","利用者のパスワードが正しければ端末状態は確認しない","一度アクセスを許可した端末は以後確認しない"],"correctChoiceIndex":0,"explanation":"ゼロトラストでは、利用者が正しく認証されていても、それだけでアクセスを許可しません。端末のOS更新状態や安全性なども確認し、条件を満たさない場合はアクセスを制限します。一度認証した端末も以後無条件には信頼せず、継続的に確認します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ゼロトラストの端末状態確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-least-privilege-678","questionText":"経理部から営業部へ異動した利用者に、経理システムの更新権限が残っていることが分かった。最小権限の原則に基づく対応として最も適切なものはどれですか。","choices":["以前必要だった権限なのでそのまま残す","現在の業務に不要になった経理システムの権限を削除する","異動を機に全システムの管理者権限を与える","本人が使わないと言えば権限確認を行わない"],"correctChoiceIndex":1,"explanation":"最小権限の原則では、利用者に現在の職務で必要な権限だけを持たせます。異動や担当変更時には権限を見直し、不要になった権限を削除します。不要な権限が残ると誤操作や不正利用時の影響が広がるため、権限は付与時だけでなく継続的に見直す必要があります。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"職務変更時のアクセス権見直し","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-privileged-account-679","questionText":"管理者アカウントの不正利用を抑える対応として適切なものはどれですか。","choices":["全員で同じパスワードを共有する","利用記録を残さない","通常業務用と分け、利用を記録する","常にログインしたままにする"],"correctChoiceIndex":2,"explanation":"特権アカウントは通常用と分離し、個人識別、承認、操作記録などで厳格に管理します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"特権アカウント管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-password-manager-680","questionText":"サービスごとに長く異なるパスワードを安全に管理する方法はどれですか。","choices":["同じ短いパスワードを使い回す","紙へ書いて公開場所に貼る","メール本文で全員に送る","信頼できるパスワード管理ツールを使う"],"correctChoiceIndex":3,"explanation":"パスワード管理ツールは異なる強いパスワードの生成・保管を支援し、使い回しを避けやすくします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"パスワード管理","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-fido-681","questionText":"パスワードに依存せず、公開鍵暗号を用いてWebサービスへ認証する標準技術はどれですか。","choices":["FIDO","FIFO","FQDN","FTP"],"correctChoiceIndex":0,"explanation":"FIDO（Fast IDentity Online）は端末側の秘密鍵とサービス側の公開鍵を用いる認証方式を標準化します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"FIDO認証","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-certificate-revocation-682","questionText":"秘密鍵漏えいなどで、有効期限前のサーバ証明書を無効として扱う仕組みはどれですか。","choices":["証明書の圧縮","証明書の失効確認","DNSの再帰問合せ","時刻の丸め"],"correctChoiceIndex":1,"explanation":"証明書失効リストやオンライン確認により、期限内でも信頼できなくなった証明書を無効として扱います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"証明書失効","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-key-rotation-683","questionText":"暗号鍵を長期間同じまま使わず、定期的または事故時に切り替える管理はどれですか。","choices":["鍵の公開","平文保存","鍵のローテーション","権限共有"],"correctChoiceIndex":2,"explanation":"鍵を適切な周期で更新すると、一つの鍵が侵害された場合の利用期間や影響範囲を抑えられます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"暗号鍵ローテーション","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-tokenization-684","questionText":"決済処理でカード番号そのものの代わりに、対応関係を安全に管理した別の値を使う手法はどれですか。","choices":["デフラグメンテーション","仮想記憶","可逆圧縮","トークナイゼーション"],"correctChoiceIndex":3,"explanation":"トークナイゼーションは機密値を代替トークンへ置き換え、業務システムが元の値を扱う範囲を減らします。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"機密データトークン化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-dlp-685","questionText":"機密ファイルがメールや外部媒体から持ち出されることを検知・制御する仕組みはどれですか。","choices":["DLP","DHCP","DNS","DPIだけ"],"correctChoiceIndex":0,"explanation":"DLP（Data Loss Prevention）は機密データの内容や取扱いを監視し、不正な送信や持出しを防ぎます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"DLP情報漏えい対策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-edr-686","questionText":"端末上のプロセスや通信を継続監視し、侵害の検知と調査を支援する仕組みはどれですか。","choices":["ERP","EDR","EVM","ETL"],"correctChoiceIndex":1,"explanation":"EDR（Endpoint Detection and Response）は端末の挙動を記録・分析し、脅威検知や封じ込め、調査を支援します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"EDR端末監視","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-siem-687","questionText":"サーバや機器から集めたログを横断分析し、関連する不審事象を検知する仕組みはどれですか。","choices":["SCM","CRM","SIEM","CAD"],"correctChoiceIndex":2,"explanation":"SIEM（Security Information and Event Management）は複数源のログを集約・相関分析して監視を支援します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"SIEMログ分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-supply-chain-688","questionText":"正規ソフトウェアの更新経路へ攻撃者が侵入し、利用組織へ不正コードを配布する攻撃はどれですか。","choices":["総当たり攻撃だけ","肩越しのぞき見","ごみ箱あさり","サプライチェーン攻撃"],"correctChoiceIndex":3,"explanation":"サプライチェーン攻撃は委託先、開発環境、更新配布など信頼関係の途中を侵害して標的へ到達します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ソフトウェアサプライチェーン攻撃","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-ransom-backup-689","questionText":"ランサムウェア被害からの復旧力を高めるバックアップ管理はどれですか。","choices":["通常環境から分離した世代を保持する","常に同じ共有領域だけへ保存する","バックアップも同時に暗号化可能にする","復元試験を行わない"],"correctChoiceIndex":0,"explanation":"オフラインや変更不能な世代を含めて分離保管し、復元試験を行うと、攻撃で同時に失うリスクを減らせます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"ランサムウェア復旧バックアップ","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-security-vulnerability-priority-690","questionText":"脆弱性修正の順序を決めるとき、深刻度だけでなく考慮すべきものはどれですか。","choices":["画面の色だけ","資産の重要度と悪用状況","担当者の座席位置","ファイル名の長さだけ"],"correctChoiceIndex":1,"explanation":"実際のリスクは脆弱性の深刻度、攻撃可能性、悪用状況、対象資産の重要度などを合わせて評価します。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"脆弱性対応優先度","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cloud-shared-responsibility-691","questionText":"クラウド利用時のセキュリティについて適切な考え方はどれですか。","choices":["全責任が必ず事業者だけにある","利用者側の設定管理は不要である","事業者と利用者で責任範囲が分かれる","契約確認は不要である"],"correctChoiceIndex":2,"explanation":"クラウドの種類や契約により、基盤、OS、アプリ、データ、設定などの責任分界が異なります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"クラウド責任共有","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cloud-auto-scaling-692","questionText":"アクセス増減に応じてサーバ台数などを自動で増減させる機能はどれですか。","choices":["静的ルーティング","データ正規化","電子署名","オートスケーリング"],"correctChoiceIndex":3,"explanation":"オートスケーリングは需要や監視指標に応じて資源を調整し、性能確保と費用最適化を支援します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"クラウド自動拡張","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cloud-serverless-693","questionText":"利用者がサーバの調達やOS管理を意識せず、実行した処理量に応じて機能を動かす形態はどれですか。","choices":["サーバレスコンピューティング","専用線だけ","オンプレミス固定構成","磁気テープ運用"],"correctChoiceIndex":0,"explanation":"サーバレスでは基盤管理を事業者が担い、利用者は関数などのコードと設定へ注力します。サーバ自体が存在しない意味ではありません。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"サーバレス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cloud-container-694","questionText":"アプリと実行に必要なライブラリをまとめ、ホストOSのカーネルを共有して動かす技術はどれですか。","choices":["仮想マシンだけ","コンテナ","データウェアハウス","RAID"],"correctChoiceIndex":1,"explanation":"コンテナはアプリの実行環境を分離しながらホストのカーネルを共有するため、軽量に起動できます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"コンテナ仮想化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-cloud-object-storage-695","questionText":"画像やバックアップなどを、階層ファイルではなく識別子とメタデータを持つ単位で保存するものはどれですか。","choices":["CPUキャッシュ","レジスタ","オブジェクトストレージ","仮想記憶ページ"],"correctChoiceIndex":2,"explanation":"オブジェクトストレージはデータ本体、識別子、メタデータを一体として扱い、大量データの保存に向きます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"オブジェクトストレージ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-iot-edge-computing-696","questionText":"工場センサのデータをクラウドへ全送信せず、設備近くで一次分析する方式はどれですか。","choices":["バッチ印刷","中央集権だけ","データ廃棄","エッジコンピューティング"],"correctChoiceIndex":3,"explanation":"エッジコンピューティングはデータ発生場所の近くで処理し、遅延、通信量、接続断の影響を抑えます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"IoTエッジ処理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-iot-sensor-actuator-697","questionText":"温度を測る装置と、測定結果に応じてバルブを動かす装置の組合せはどれですか。","choices":["センサとアクチュエータ","ルータとハブ","CPUとROM","表と索引"],"correctChoiceIndex":0,"explanation":"センサは物理量を測定し、アクチュエータは制御信号を受けて機器を動作させます。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"IoTセンサとアクチュエータ","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-iot-mqtt-698","questionText":"多数の小型機器が、話題名を介して軽量にメッセージを配信・購読するプロトコルはどれですか。","choices":["HTTPだけ","MQTT","SMTP","ARP"],"correctChoiceIndex":1,"explanation":"MQTT（Message Queuing Telemetry Transport）は発行・購読型の軽量通信でIoTなどに利用されます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"MQTT通信","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-iot-device-update-699","questionText":"遠隔地のIoT機器で発見された脆弱性へ対応するため、製品設計時に必要な考慮はどれですか。","choices":["更新機能を永久に禁止する","共通初期パスワードを固定する","安全な更新機能と署名検証を用意する","通信を全て公開する"],"correctChoiceIndex":2,"explanation":"認証された更新を安全に配布・適用できる仕組みは、長期運用するIoT機器の脆弱性対応に重要です。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"IoT安全更新","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"technology-quantum-not-current-700","questionText":"量子コンピュータの性質について、適切な説明はどれですか。","choices":["あらゆる計算を同じ比率で高速化する方式である","古典コンピュータを使えなくする方式である","全ての暗号処理を不要にする方式である","特定の種類の問題で高速化が期待される計算方式である"],"correctChoiceIndex":3,"explanation":"量子計算は特定の問題で優位性が期待されますが、全用途で古典コンピュータを置き換えるものではありません。","category":"テクノロジ系","subcategory":"コンピュータ構成要素","topic":"量子計算の位置付け","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-30T00:00:00+09:00","updatedAt":"2026-08-30T00:00:00+09:00"},{"id":"strategy-net-profit-calc-701","questionText":"売上高1,200万円、全ての費用と税金の合計が1,050万円だった。当期の最終的な利益はいくらですか。","choices":["150万円","1,050万円","1,200万円","2,250万円"],"correctChoiceIndex":0,"explanation":"最終的な利益は売上高から全ての費用と税金を差し引くため、1,200－1,050＝150万円です。","category":"ストラテジ系","subcategory":"企業活動","topic":"当期純利益計算","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-gross-profit-role-702","questionText":"商品の販売活動そのものから得た基本的な採算を見るため、売上高から売上原価を差し引いた利益はどれですか。","choices":["営業利益","売上総利益","経常利益","当期純利益"],"correctChoiceIndex":1,"explanation":"売上総利益は売上高－売上原価で求め、商品やサービス自体の基本的な採算を示します。","category":"ストラテジ系","subcategory":"企業活動","topic":"売上総利益","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ordinary-profit-role-703","questionText":"本業の損益に、受取利息や支払利息など通常の財務活動による損益を加えた利益はどれですか。","choices":["売上総利益","営業利益","経常利益","限界利益"],"correctChoiceIndex":2,"explanation":"経常利益は営業利益に営業外収益を加え、営業外費用を差し引いた、通常の企業活動全体の利益です。","category":"ストラテジ系","subcategory":"企業活動","topic":"経常利益","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-variable-cost-total-704","questionText":"製品1個当たりの材料費が800円で、500個を生産した。ほかの変動費を無視すると材料費の総額はいくらですか。","choices":["4万円","80万円","400万円","40万円"],"correctChoiceIndex":3,"explanation":"800円×500個＝400,000円なので40万円です。生産量に比例して増減する費用は変動費です。","category":"ストラテジ系","subcategory":"企業活動","topic":"変動費計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-fixed-cost-example-705","questionText":"工場の生産量が今月半分になっても、契約上ほぼ同額を支払う費用の例として適切なものはどれですか。","choices":["工場建物の月額賃借料","製品ごとの材料費","販売個数に応じた手数料","配送個数に応じた運賃"],"correctChoiceIndex":0,"explanation":"賃借料のように短期的な生産量にかかわらず一定額が発生する費用は固定費です。","category":"ストラテジ系","subcategory":"企業活動","topic":"固定費の例","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-break-even-units-706","questionText":"販売価格5,000円、1個当たり変動費3,000円、固定費100万円の製品がある。利益が0となる販売数量はどれですか。","choices":["200個","500個","333個","1,000個"],"correctChoiceIndex":1,"explanation":"1個当たり限界利益は5,000－3,000＝2,000円です。100万円÷2,000円＝500個で損益が均衡します。","category":"ストラテジ系","subcategory":"企業活動","topic":"損益分岐点数量","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-roi-calc-new-707","questionText":"300万円を投資した施策から60万円の利益を得た。投資利益率はどれですか。","choices":["5%","50%","20%","500%"],"correctChoiceIndex":2,"explanation":"ROI（Return on Investment：投資利益率）は利益÷投資額×100なので、60÷300×100＝20%です。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROI計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-roe-calc-new-708","questionText":"当期純利益が80万円、自己資本が800万円の企業について、自己資本利益率はどれですか。","choices":["1%","80%","100%","10%"],"correctChoiceIndex":3,"explanation":"ROE（Return on Equity：自己資本利益率）は当期純利益÷自己資本×100なので10%です。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROE計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-roa-calc-new-709","questionText":"利益が120万円、総資産が2,000万円の企業について、総資産利益率はどれですか。","choices":["6%","0.6%","16.7%","60%"],"correctChoiceIndex":0,"explanation":"ROA（Return on Assets：総資産利益率）は利益÷総資産×100なので、120÷2,000×100＝6%です。","category":"ストラテジ系","subcategory":"企業活動","topic":"ROA計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-cash-flow-operating-710","questionText":"顧客へ商品を販売して代金を現金で受け取った。この収入をキャッシュフロー計算書で分類する区分はどれですか。","choices":["投資活動によるキャッシュフロー","営業活動によるキャッシュフロー","財務活動によるキャッシュフロー","非資金取引だけ"],"correctChoiceIndex":1,"explanation":"商品販売など本業から生じる現金収支は営業活動によるキャッシュフローに分類します。","category":"ストラテジ系","subcategory":"企業活動","topic":"営業キャッシュフロー","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-cash-flow-financing-711","questionText":"企業が金融機関から長期借入れを行い、現金を受け取った。この収入の区分はどれですか。","choices":["営業活動によるキャッシュフロー","投資活動によるキャッシュフロー","財務活動によるキャッシュフロー","減価償却費"],"correctChoiceIndex":2,"explanation":"借入れや増資、返済、配当など資金調達に関する現金収支は財務活動に分類します。","category":"ストラテジ系","subcategory":"企業活動","topic":"財務キャッシュフロー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-balance-sheet-assets-712","questionText":"決算日時点で企業が保有する現金、売掛金、建物などをまとめて示す区分はどれですか。","choices":["負債","純資産だけ","費用","資産"],"correctChoiceIndex":3,"explanation":"貸借対照表の資産は、現金や売掛金、建物など企業が保有・支配する経済的資源を示します。","category":"ストラテジ系","subcategory":"企業活動","topic":"貸借対照表の資産","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-balance-sheet-liability-713","questionText":"銀行から借りた資金のうち、将来返済する義務がある金額を貸借対照表で示す区分はどれですか。","choices":["負債","資産","売上高","純利益"],"correctChoiceIndex":0,"explanation":"返済義務のある借入金や支払義務のある買掛金は負債に分類されます。","category":"ストラテジ系","subcategory":"企業活動","topic":"貸借対照表の負債","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-straight-line-depreciation-714","questionText":"取得原価500万円、残存価額0円、耐用年数5年の設備を定額法で償却する。1年当たりの費用はどれですか。","choices":["50万円","100万円","250万円","500万円"],"correctChoiceIndex":1,"explanation":"定額法では（取得原価－残存価額）÷耐用年数なので、500÷5＝100万円です。","category":"ストラテジ系","subcategory":"企業活動","topic":"定額法減価償却計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-inventory-reduction-effect-715","questionText":"需要を維持したまま平均在庫を減らした場合、一般に改善が期待できる指標はどれですか。","choices":["固定比率だけ","自己資本比率だけ","棚卸資産回転率","離職率"],"correctChoiceIndex":2,"explanation":"棚卸資産回転率は売上原価などを平均棚卸資産で割るため、同じ需要で在庫が減ると高くなります。","category":"ストラテジ系","subcategory":"企業活動","topic":"棚卸資産回転率改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-accounts-receivable-risk-716","questionText":"売掛金の回収期間が長期化したとき、企業が特に注意すべき影響はどれですか。","choices":["売上原価が必ずゼロになる","固定資産が自動的に増える","税率が必ず下がる","手元資金が不足しやすくなる"],"correctChoiceIndex":3,"explanation":"売上を計上しても代金回収が遅いと現金が入らず、支払いに使える手元資金が不足しやすくなります。","category":"ストラテジ系","subcategory":"企業活動","topic":"売掛金回収リスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-budget-variance-717","questionText":"広告費の予算が200万円、実績が230万円だった。予算との差として正しいものはどれですか。","choices":["30万円の予算超過","30万円の予算未達","200万円の予算超過","430万円の予算超過"],"correctChoiceIndex":0,"explanation":"実績230万円－予算200万円＝30万円で、費用実績が予算を上回るため予算超過です。","category":"ストラテジ系","subcategory":"企業活動","topic":"予算実績差異","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-opportunity-cost-718","questionText":"二つの投資案のうち一方を選んだため、選ばなかった案から得られたはずの利益を何といいますか。","choices":["埋没費用","機会費用","固定費","減価償却費"],"correctChoiceIndex":1,"explanation":"機会費用は、ある選択によって断念した代替案から得られたはずの最大の便益です。","category":"ストラテジ系","subcategory":"企業活動","topic":"機会費用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-sunk-cost-decision-719","questionText":"既に支払い済みで、今後どの案を選んでも回収できない調査費を意思決定でどう扱うべきですか。","choices":["必ず最大の評価項目にする","売上として加算する","将来案の比較から切り離す","毎回二重に計上する"],"correctChoiceIndex":2,"explanation":"回収不能な埋没費用は将来の案によって変わらないため、今後の収益と費用の比較から切り離します。","category":"ストラテジ系","subcategory":"企業活動","topic":"埋没費用の判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-productivity-calc-720","questionText":"5人が8時間ずつ作業して40件を処理した。1人1時間当たりの処理件数はどれですか。","choices":["0.2件","5件","40件","1件"],"correctChoiceIndex":3,"explanation":"総作業時間は5×8＝40人時で、40件÷40人時＝1件／人時です。","category":"ストラテジ系","subcategory":"企業活動","topic":"労働生産性計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-swot-cross-analysis-721","questionText":"自社の高い技術力と市場拡大という二つの要素を組み合わせ、成長施策を考える分析上の組合せはどれですか。","choices":["内部の強みと外部の機会","内部の弱みと外部の脅威","内部の強みと外部の脅威","内部の弱みと外部の機会"],"correctChoiceIndex":0,"explanation":"内部環境の強みと外部環境の機会を組み合わせると、優位性を生かした積極的な成長施策を検討できます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"SWOTクロス分析","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ppm-star-722","questionText":"市場成長率と相対的市場占有率がともに高く、成長投資を続けることが期待される事業はどれですか。","choices":["成熟市場の資金供給役","花形","撤退を優先する事業","占有率が低い検討対象"],"correctChoiceIndex":1,"explanation":"PPM（Product Portfolio Management）で成長率・占有率とも高い事業は花形で、将来の収益源として投資します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PPM花形","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ppm-cash-cow-723","questionText":"市場成長率は低いが相対的市場占有率が高く、安定した資金獲得が期待される事業はどれですか。","choices":["成長投資を最優先する花形","占有率向上を検討する問題児","金のなる木","縮小を検討する負け犬"],"correctChoiceIndex":2,"explanation":"PPMで成熟市場における高占有率事業は金のなる木と呼ばれ、他事業へ回す資金を生み出します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"PPM金のなる木","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-five-forces-entry-724","questionText":"新規企業が参入するために巨額の設備投資や許認可が必要な市場では、既存企業への圧力は一般にどうなりますか。","choices":["買い手の交渉力が必ず最大になる","代替品が必ず消える","供給者の数が必ずゼロになる","新規参入の脅威が弱まる"],"correctChoiceIndex":3,"explanation":"参入障壁が高いほど新規企業は入りにくく、ファイブフォースにおける新規参入の脅威は弱まります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"新規参入障壁","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-five-forces-substitute-725","questionText":"鉄道会社にとって航空便や高速バスを分析対象とする理由として適切なものはどれですか。","choices":["同じ移動需要を満たす代替手段だから","同じ企業の内部部門だから","必ず同じ価格だから","法律上同じ免許だから"],"correctChoiceIndex":0,"explanation":"異なる製品やサービスでも同じ顧客需要を満たすものは代替品となり、収益性へ影響します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"代替品の脅威","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-cost-leadership-726","questionText":"コストリーダーシップ戦略を実現するための施策として、最も適切なものはどれですか。","choices":["高級感を高めるため限定生産だけを行う","業務の標準化や大量調達などによって単位当たりコストを下げる","特定の狭い顧客層だけへ経営資源を集中する","コスト管理を行わず価格だけを引き下げる"],"correctChoiceIndex":1,"explanation":"コストリーダーシップ戦略では、業務標準化、規模の経済、大量調達、工程効率化などによって低コスト構造を築きます。単に品質を落としたり、利益を無視して価格だけを引き下げたりすることではありません。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"コストリーダーシップの実現手段","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-differentiation-strategy-727","questionText":"競合他社との差別化を図る施策として、最も適切なものはどれですか。","choices":["競合より必ず最低価格にすることだけを目標にする","全商品の特徴を競合と完全に同じにする","独自機能や高品質なアフターサービスなど、顧客が価値を感じる特徴を強化する","顧客ニーズを確認せず機能を無条件に増やす"],"correctChoiceIndex":2,"explanation":"品質、機能、ブランド、デザイン、顧客サービスなど、顧客が価値を認識できる違いを作ることが差別化につながります。単に価格を高くしたり、顧客ニーズと無関係な機能を増やしたりするだけで、必ず差別化できるわけではありません。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"差別化につながる施策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-focus-strategy-728","questionText":"特定地域の高齢者向けなど、限られた顧客層に経営資源を集中する戦略はどれですか。","choices":["全市場同時攻略","垂直統合だけ","価格追随だけ","集中戦略"],"correctChoiceIndex":3,"explanation":"集中戦略は限定した市場セグメントを選び、その顧客の要求に合わせて優位性を築きます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"集中戦略","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-product-life-introduction-729","questionText":"新製品を発売した直後で、認知を広げる販促費が大きく販売量もまだ少ない段階はどれですか。","choices":["導入期","成長期","成熟期","衰退期"],"correctChoiceIndex":0,"explanation":"製品ライフサイクルの導入期は市場認知を形成する時期で、売上が小さく販促費などが先行しやすい段階です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"製品ライフサイクル導入期","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ansoff-market-development-730","questionText":"現在の商品を、新たに海外の顧客層へ販売する成長方向はどれですか。","choices":["市場浸透","市場開拓","製品開発","撤退"],"correctChoiceIndex":1,"explanation":"既存製品を新しい地域や顧客層へ展開する方向は市場開拓です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"市場開拓戦略","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ansoff-product-development-731","questionText":"既存顧客へ新しい上位モデルを販売する成長方向はどれですか。","choices":["市場浸透","市場開拓","製品開発","事業清算"],"correctChoiceIndex":2,"explanation":"既存市場に向けて新製品を投入する方向は製品開発です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"製品開発戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-ansoff-diversification-732","questionText":"新しい顧客市場に向けて、自社がこれまで扱っていない製品を投入する成長方向はどれですか。","choices":["市場浸透","市場開拓","製品改良だけ","多角化"],"correctChoiceIndex":3,"explanation":"新製品を新市場へ投入する多角化は、四つの成長方向の中で一般に最も不確実性が高い方法です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"多角化戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-stp-segmentation-733","questionText":"STP分析で三つの活動を行う基本的な順序として、正しいものはどれですか。","choices":["市場細分化、標的市場の選定、価値の位置付けの順","狙う市場を先に決めてから、その市場を顧客群へ分ける","自社の位置付けを決めた後に、市場を分けず全顧客を対象にする","市場を分けた後、位置付けを決めてから対象市場を選ぶ"],"correctChoiceIndex":0,"explanation":"正しい順序は「市場細分化、標的市場の選定、価値の位置付けの順」です。STPは、Segmentation（セグメンテーション：市場を顧客群へ分ける）、Targeting（ターゲティング：狙う市場を選ぶ）、Positioning（ポジショニング：顧客に対する自社の価値や位置付けを明確にする）の順に進めます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"STPの実施順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-stp-targeting-734","questionText":"分けた顧客グループの中から、自社が重点的に価値を提供する層を選ぶ活動はどれですか。","choices":["セグメンテーション","ターゲティング","ポジショニング","デバッグ"],"correctChoiceIndex":1,"explanation":"STPのターゲティングは、魅力度と自社の強みを考えて狙う市場を選択する活動です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"標的市場選定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-stp-positioning-735","questionText":"競合と比べて自社商品を顧客の心の中でどのような存在として認識させるかを設計する活動はどれですか。","choices":["ターゲティング","棚卸し","ポジショニング","正規化"],"correctChoiceIndex":2,"explanation":"ポジショニングは選んだ市場で、競合との差と提供価値を明確にして望ましい認識を築く活動です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"市場ポジショニング","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-marketing-product-736","questionText":"マーケティングの4Pで、品質、機能、ブランド、保証などを検討する要素はどれですか。","choices":["Price（価格）","Place（流通）","Promotion（販売促進）","Product（製品）"],"correctChoiceIndex":3,"explanation":"Product（製品）では顧客へ提供する機能、品質、デザイン、ブランド、保証などを設計します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"4P製品政策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-marketing-place-737","questionText":"マーケティングの4Pで、店舗、卸売、電子商取引など顧客へ届ける経路を検討する要素はどれですか。","choices":["Place（流通経路）","Product（提供物）","Price（価格条件）","Promotion（情報伝達）"],"correctChoiceIndex":0,"explanation":"Place（流通）では販売場所や流通経路、物流など、顧客が入手できる仕組みを設計します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"4P流通政策","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-marketing-promotion-738","questionText":"マーケティングの4Pで、広告、販売促進、広報など顧客との情報伝達を検討する要素はどれですか。","choices":["Product（製品設計）","Promotion（販売促進活動）","Price（価格設定）","Place（販売経路）"],"correctChoiceIndex":1,"explanation":"Promotion（販売促進）では広告や広報、人的販売など、価値を顧客へ伝える方法を設計します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"4P販売促進","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-crm-retention-739","questionText":"購買履歴や問い合わせ履歴を統合し、既存顧客との長期的な関係を強化する取組はどれですか。","choices":["SCM","CAD","CRM","DNS"],"correctChoiceIndex":2,"explanation":"CRM（Customer Relationship Management：顧客関係管理）は顧客情報を活用して満足度や継続率を高めます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"CRM顧客維持","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-sfa-purpose-740","questionText":"営業担当者の商談状況、訪問記録、案件進捗を共有して営業活動を支援する仕組みはどれですか。","choices":["ERP","WAF","RAID","SFA"],"correctChoiceIndex":3,"explanation":"SFA（Sales Force Automation：営業支援システム）は営業活動や案件の情報を共有・可視化します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"SFA営業支援","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-copyright-program-741","questionText":"自社で独自に作成したコンピュータプログラムを、創作時から保護する権利として中心となるものはどれですか。","choices":["著作権","商標権","意匠権","営業許可"],"correctChoiceIndex":0,"explanation":"プログラムは著作物として、原則として創作した時点から著作権の保護対象になります。","category":"ストラテジ系","subcategory":"法務","topic":"プログラム著作権","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-patent-invention-742","questionText":"自然法則を利用した技術的なアイデアについて、審査と登録を経て一定期間独占できる権利はどれですか。","choices":["著作権","特許権","商標権","肖像権"],"correctChoiceIndex":1,"explanation":"特許権は発明について出願、審査、登録を経て与えられる産業財産権です。","category":"ストラテジ系","subcategory":"法務","topic":"特許権の対象","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-trademark-brand-743","questionText":"商品名やロゴを、他社の商品・サービスと区別する標識として保護する権利はどれですか。","choices":["特許権","著作権だけ","商標権","抵当権"],"correctChoiceIndex":2,"explanation":"商標権は文字、図形、記号など営業上の標識を登録により保護します。","category":"ストラテジ系","subcategory":"法務","topic":"商標権の対象","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-design-right-744","questionText":"製品の形状や模様など、物品の美観に関するデザインを保護する産業財産権はどれですか。","choices":["特許権","商標権","著作隣接権","意匠権"],"correctChoiceIndex":3,"explanation":"意匠権は物品などの形状、模様、色彩によるデザインを登録により保護します。","category":"ストラテジ系","subcategory":"法務","topic":"意匠権の対象","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-domain-name-confusion-745","questionText":"有名企業の名称に似たドメイン名を取得し、利用者を混同させて利益を得る行為に関係する法律はどれですか。","choices":["不正競争防止法","特許法だけ","労働基準法","道路交通法"],"correctChoiceIndex":0,"explanation":"他人の商品等表示と混同を生じさせる行為などは、不正競争防止法上の不正競争となる場合があります。","category":"ストラテジ系","subcategory":"法務","topic":"ドメイン名と不正競争","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-nda-before-disclosure-746","questionText":"外部企業へ未公開の設計情報を共有する前に、目的外利用や漏えいを防ぐため締結する契約はどれですか。","choices":["売買契約だけ","秘密保持契約","雇用保険契約","定款"],"correctChoiceIndex":1,"explanation":"NDA（Non-Disclosure Agreement：秘密保持契約）で、秘密情報の範囲、利用目的、管理、返却などを定めます。","category":"ストラテジ系","subcategory":"法務","topic":"秘密保持契約","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-personal-data-purpose-747","questionText":"顧客情報を取得するとき、個人情報保護の観点から利用者へ示すべき基本事項はどれですか。","choices":["社内LANの配線図","CPUの型番","利用目的","開発者の座席番号"],"correctChoiceIndex":2,"explanation":"個人情報は利用目的をできる限り特定し、通知または公表することが基本です。","category":"ストラテジ系","subcategory":"法務","topic":"個人情報の利用目的","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-personal-data-security-748","questionText":"個人データの漏えいを防ぐための組織的・技術的な管理策をまとめて何といいますか。","choices":["販売促進策","市場浸透策","生産平準化","安全管理措置"],"correctChoiceIndex":3,"explanation":"安全管理措置にはアクセス管理、教育、委託先管理などが含まれ、個人データを適切に保護します。","category":"ストラテジ系","subcategory":"法務","topic":"個人データ安全管理","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-privacy-by-design-749","questionText":"サービスの設計初期から個人情報保護を要件へ組み込み、後付けの対応を減らす考え方はどれですか。","choices":["プライバシー・バイ・デザイン","データ公開優先","障害事後対応だけ","無制限保存"],"correctChoiceIndex":0,"explanation":"プライバシー・バイ・デザインは企画・設計段階から保護策を組み込み、ライフサイクル全体で配慮します。","category":"ストラテジ系","subcategory":"法務","topic":"プライバシー設計","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-labor-management-time-750","questionText":"従業員の労働時間を適正に把握する方法として、原則的に適切なものはどれですか。","choices":["本人の記憶だけで月末にまとめて始業・終業時刻を申告させる","タイムカードやICカード、パソコンの使用時間などの客観的な記録を基礎に、始業・終業時刻を確認する","所定労働時間をそのまま実際の労働時間として記録する","繁忙日のうち一部の日だけ始業・終業時刻を記録する"],"correctChoiceIndex":1,"explanation":"使用者は始業・終業時刻を確認して記録し、原則として自らの現認、またはタイムカードやICカード、パソコンの使用時間などの客観的な記録を基礎に労働時間を把握します。","category":"ストラテジ系","subcategory":"法務","topic":"労働時間の客観的把握","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-dispatch-command-751","questionText":"派遣労働者に対して、日々の業務上の指揮命令を行う立場は原則としてどれですか。","choices":["派遣労働者本人だけ","顧客全員","派遣先","ソフトウェア販売店"],"correctChoiceIndex":2,"explanation":"労働者派遣では雇用主は派遣元ですが、業務上の指揮命令は派遣先が行います。請負との違いです。","category":"ストラテジ系","subcategory":"法務","topic":"労働者派遣の指揮命令","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-contract-acceptance-752","questionText":"システム納品後、発注者が契約内容どおりか確認して受領を確定する行為はどれですか。","choices":["発注","見積り","棚卸し","検収"],"correctChoiceIndex":3,"explanation":"検収は納品物が仕様や品質条件を満たすか確認し、受領の可否を決める手続です。","category":"ストラテジ系","subcategory":"法務","topic":"契約上の検収","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-e-contract-record-753","questionText":"電子商取引で、後から合意内容を確認できるようにするため保存すべきものはどれですか。","choices":["注文内容と承諾の記録","画面の背景画像だけ","一時的なCPU使用率だけ","商品の広告色だけ"],"correctChoiceIndex":0,"explanation":"注文と承諾、日時、取引条件などを保存すると、契約成立や合意内容を後から確認できます。","category":"ストラテジ系","subcategory":"法務","topic":"電子契約記録","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-digital-signature-integrity-754","questionText":"電子文書が署名後に改変されていないことと、署名者を確認するために利用する技術はどれですか。","choices":["データ圧縮","デジタル署名","画面拡大","負荷分散"],"correctChoiceIndex":1,"explanation":"デジタル署名は公開鍵暗号とハッシュを利用し、署名者の確認と改ざん検知に役立ちます。","category":"ストラテジ系","subcategory":"法務","topic":"電子署名の役割","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-standardization-benefit-755","questionText":"異なる企業の機器やサービスが共通仕様に従う主な利点はどれですか。","choices":["必ず価格が同じになる","全ての特許が消滅する","相互接続や交換がしやすくなる","障害が一切起きなくなる"],"correctChoiceIndex":2,"explanation":"標準化により仕様や評価方法が共通になり、相互運用性や部品交換性を確保しやすくなります。","category":"ストラテジ系","subcategory":"法務","topic":"標準化の利点","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-jis-role-756","questionText":"日本の産業製品や試験方法などについて定められる国家規格はどれですか。","choices":["IEEEだけ","RFCだけ","SLA","JIS"],"correctChoiceIndex":3,"explanation":"JIS（Japanese Industrial Standards：日本産業規格）は日本の産業標準化に基づく国家規格です。","category":"ストラテジ系","subcategory":"法務","topic":"日本産業規格","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-iso-role-757","questionText":"国際的に通用する標準を作成する非政府間の国際機関はどれですか。","choices":["ISO","IPA","JPCERT/CC","W3Cだけ"],"correctChoiceIndex":0,"explanation":"ISO（International Organization for Standardization：国際標準化機構）は幅広い分野の国際規格を策定します。","category":"ストラテジ系","subcategory":"法務","topic":"国際標準化機構","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-iso-9001-purpose-758","questionText":"組織が顧客要求を満たす製品やサービスを継続提供するための品質マネジメントシステム規格はどれですか。","choices":["ISO 14001","ISO 9001","ISO/IEC 27001","ISO 31000"],"correctChoiceIndex":1,"explanation":"ISO 9001は品質マネジメントシステムの要求事項を定め、継続的な品質改善に用いられます。","category":"ストラテジ系","subcategory":"法務","topic":"品質マネジメント規格","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-iso-14001-purpose-759","questionText":"組織が環境への影響を管理し、継続的に改善するためのマネジメントシステム規格はどれですか。","choices":["ISO 9001","ISO/IEC 27001","ISO 14001","ISO 22301"],"correctChoiceIndex":2,"explanation":"現行規格のISO 14001:2026は、EMS（Environmental Management System：環境マネジメントシステム）の要求事項を定めます。組織が環境への影響を体系的に管理し、関連する法的要求事項への対応を考慮しながら、環境パフォーマンスの継続的改善を目指すための規格です。","category":"ストラテジ系","subcategory":"法務","topic":"環境マネジメント規格","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-iso-27001-purpose-760","questionText":"ISO/IEC 27001に基づくISMSの運用として適切なものはどれですか。","choices":["一度認証を取得すれば以後のリスク評価を行わない","情報セキュリティ対策を技術部門だけに限定する","すべてのリスクをゼロにしてから業務を開始する","情報セキュリティリスクを評価し、管理策を運用して継続的に改善する"],"correctChoiceIndex":3,"explanation":"ISO/IEC 27001は、ISMS（Information Security Management System：情報セキュリティマネジメントシステム）の確立、実施、維持及び継続的改善の要求事項を定めます。","category":"ストラテジ系","subcategory":"法務","topic":"ISMSの運用と継続的改善","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-erp-integration-761","questionText":"販売、会計、生産、人事などの基幹情報を統合し、全社で一元利用する仕組みはどれですか。","choices":["ERP","CAD","DNS","IDS"],"correctChoiceIndex":0,"explanation":"ERP（Enterprise Resource Planning：企業資源計画）は部門横断で基幹業務とデータを統合します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"ERP全社統合","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-scm-demand-sharing-762","questionText":"小売の販売情報を製造・物流企業と共有し、供給連鎖全体の在庫を最適化する取組はどれですか。","choices":["CRM","SCM","SFA","PKI"],"correctChoiceIndex":1,"explanation":"SCM（Supply Chain Management：供給連鎖管理）は調達から販売までの情報と物流を全体最適します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"SCM需要共有","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-eai-purpose-763","questionText":"企業内の異なる業務システムを連携させ、データ交換を統合的に管理する仕組みはどれですか。","choices":["OCR","RAID","EAI","BIOS"],"correctChoiceIndex":2,"explanation":"EAI（Enterprise Application Integration：企業アプリケーション統合）は異種システム間の連携を仲介します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"EAIシステム連携","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-api-business-link-764","questionText":"外部事業者へ機能の呼出し仕様を公開し、自社サービスと組み合わせた新サービスを可能にするものはどれですか。","choices":["UPS","GUIだけ","磁気テープ","API"],"correctChoiceIndex":3,"explanation":"API（Application Programming Interface）はソフトウェア機能を一定の規約で呼び出す接点です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"APIによる事業連携","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-soa-service-unit-765","questionText":"業務機能を独立性の高いサービス単位として用意し、組み合わせてシステムを構築する考え方はどれですか。","choices":["SOA","FIFO","RAID","BYOD"],"correctChoiceIndex":0,"explanation":"SOA（Service-Oriented Architecture：サービス指向アーキテクチャ）は再利用可能なサービスを組み合わせます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"サービス指向設計","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-bpr-redesign-766","questionText":"既存手順の一部だけを効率化するのではなく、業務目的からプロセス全体を抜本的に設計し直す取組はどれですか。","choices":["BCP","BPR","BOM","BYOD"],"correctChoiceIndex":1,"explanation":"BPR（Business Process Re-engineering：業務プロセス再設計）は業務を根本から見直します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"BPR業務再設計","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-bpm-cycle-767","questionText":"業務プロセスを可視化し、実行結果を測定しながら継続的に改善する管理手法はどれですか。","choices":["BPO","CAD","BPM","NAT"],"correctChoiceIndex":2,"explanation":"BPM（Business Process Management：業務プロセス管理）は設計、実行、監視、改善を繰り返します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"BPM継続改善","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-rpa-suitable-task-768","questionText":"定型的な画面入力や転記を、手順が明確なまま自動化する用途に適したものはどれですか。","choices":["量子暗号","データセンタ移転だけ","手作業の増員だけ","RPA"],"correctChoiceIndex":3,"explanation":"RPA（Robotic Process Automation）はルール化された反復的なPC操作の自動化に適します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"RPA適用業務","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-dx-business-model-769","questionText":"デジタル技術を使って、単なる社内効率化を越えて提供価値や収益の仕組みを変える取組はどれですか。","choices":["DX","バックアップだけ","紙帳票の保管だけ","機器の定期清掃だけ"],"correctChoiceIndex":0,"explanation":"DX（Digital Transformation）はデータとデジタル技術で業務、組織、製品、ビジネスモデルを変革します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"DX事業変革","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-legacy-modernization-770","questionText":"保守困難になった基幹システムを、業務継続に配慮しながら段階的に新しい基盤へ移す取組はどれですか。","choices":["デフラグだけ","モダナイゼーション","ソーシャルエンジニアリング","在庫評価"],"correctChoiceIndex":1,"explanation":"モダナイゼーションは既存資産を活用しつつ、老朽化したシステムを更新・刷新する取組です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"レガシー刷新","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-cloud-first-evaluation-771","questionText":"新システムを企画するとき、クラウド利用を優先候補として費用や要件を比較検討する方針はどれですか。","choices":["オンプレミス固定","紙媒体優先","クラウドファースト","手作業固定"],"correctChoiceIndex":2,"explanation":"クラウドファーストは新規導入や更新時にクラウドを優先的な選択肢として検討する方針です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"クラウド優先方針","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-outsourcing-core-772","questionText":"競争力の源泉となる企画は社内に残し、定型的な運用を専門企業へ委託する判断で重視する考え方はどれですか。","choices":["全業務の知識を失う","責任を全て消滅させる","契約管理を不要にする","中核業務へ経営資源を集中する"],"correctChoiceIndex":3,"explanation":"アウトソーシングでは非中核業務を外部の専門性に任せ、自社資源を中核業務へ集中できます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"アウトソーシング戦略","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-bpo-scope-773","questionText":"給与計算のシステム運用だけでなく、受付、計算、問い合わせ対応まで業務プロセスごと外部委託する形態はどれですか。","choices":["BPO","SaaSだけ","ハウジングだけ","リースだけ"],"correctChoiceIndex":0,"explanation":"BPO（Business Process Outsourcing）は業務プロセスを一括して外部へ委託する形態です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"BPO業務委託","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-feasibility-study-774","questionText":"システム企画の案について、技術、費用、運用、法令などの面から実現可能か評価する活動はどれですか。","choices":["受入テスト","実現可能性調査","障害復旧","棚卸し"],"correctChoiceIndex":1,"explanation":"実現可能性調査では複数の観点から案を評価し、投資判断や計画具体化の根拠にします。","category":"ストラテジ系","subcategory":"システム企画","topic":"実現可能性評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-rfi-purpose-775","questionText":"システム調達におけるRFIとRFPの使い分けとして、最も適切なものはどれですか。","choices":["RFIで具体的な提案を求め、RFPで要求を固める前の市場情報だけを集める","RFIを契約締結文書として使い、RFPを検収完了の証明に使う","RFIで市場・製品・供給者などの情報を収集し、要求を具体化した後、RFPで候補企業へ具体的な提案を求める","RFPでは要件や条件を示さず、市場調査だけを行う"],"correctChoiceIndex":2,"explanation":"RFI（Request for Information：情報提供依頼書）は、要求を固める前に市場、製品、供給者などの情報を収集するために使います。RFP（Request for Proposal：提案依頼書）は、要件や条件を示して候補企業へ具体的な提案を求める文書です。調達では、RFIの結果を要求の具体化に利用し、その後RFPへ進むことがあります。","category":"ストラテジ系","subcategory":"システム企画","topic":"RFIとRFPの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-rfp-purpose-776","questionText":"発注者が要件や評価条件を示し、候補企業へ具体的な提案を求める文書はどれですか。","choices":["RFI","WBS","DNS","RFP"],"correctChoiceIndex":3,"explanation":"RFP（Request for Proposal：提案依頼書）は、要件に対する実現方法や費用、体制などの提案を求めます。","category":"ストラテジ系","subcategory":"システム企画","topic":"提案依頼書","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-vendor-evaluation-777","questionText":"提案企業を公平に選ぶため、価格だけでなく機能、実績、体制などを事前に定めた基準で点数化する方法はどれですか。","choices":["評価基準による総合評価","担当者の印象だけで決定","最初の提案を無条件採用","評価項目を契約後に変更"],"correctChoiceIndex":0,"explanation":"事前に重み付き評価基準を定めると、複数の提案を透明かつ一貫して比較できます。","category":"ストラテジ系","subcategory":"システム企画","topic":"ベンダ総合評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-tco-evaluation-778","questionText":"システム選定で購入費だけでなく、保守、教育、運用、廃棄までの費用を比較する指標はどれですか。","choices":["ROIだけ","TCO","KPIだけ","RTOだけ"],"correctChoiceIndex":1,"explanation":"TCO（Total Cost of Ownership：総保有コスト）は導入から廃棄までに必要な総費用を捉えます。","category":"ストラテジ系","subcategory":"システム企画","topic":"総保有コスト","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-benefit-realization-779","questionText":"システム稼働後に、企画時に想定した売上増加や時間短縮が実現したかを確認する活動はどれですか。","choices":["要件凍結だけ","機器廃棄だけ","効果測定","ソース難読化"],"correctChoiceIndex":2,"explanation":"効果測定は事前に定めた指標と実績を比較し、投資目的の達成度や追加改善を判断します。","category":"ストラテジ系","subcategory":"システム企画","topic":"システム投資効果測定","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-kgi-goal-780","questionText":"企業の最終目標の達成度を測るため、売上高や市場占有率などで設定する指標はどれですか。","choices":["日々の活動を測るKPI","サービス品質を合意するSLA","作業を分解するWBS","KGI"],"correctChoiceIndex":3,"explanation":"KGI（Key Goal Indicator：重要目標達成指標）は最終的な目標の達成度を測ります。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"KGI目標指標","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-csf-link-781","questionText":"目標達成のために、特に成功させる必要がある重要な要因はどれですか。","choices":["CSF","CPU","CSV","CSS"],"correctChoiceIndex":0,"explanation":"CSF（Critical Success Factor：重要成功要因）は戦略目標の達成に決定的な要因です。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"重要成功要因","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-balanced-scorecard-782","questionText":"財務だけでなく、顧客、業務プロセス、学習と成長の観点から戦略を評価する手法はどれですか。","choices":["損益分岐点分析","バランススコアカード","パケット解析","デッドロック検出"],"correctChoiceIndex":1,"explanation":"バランススコアカードは四つの視点で戦略目標と指標の因果関係を整理します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"バランススコアカード","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-08-31T00:00:00+09:00","updatedAt":"2026-08-31T00:00:00+09:00"},{"id":"strategy-benchmarking-783","questionText":"他社の優れた業務方法と自社を比較し、改善点を見つける活動はどれですか。","choices":["マスキング","デバッグ","ベンチマーキング","フラグメンテーション"],"correctChoiceIndex":2,"explanation":"ベンチマーキングは優良事例を基準として差を分析し、自社プロセスの改善へ生かします。","category":"ストラテジ系","subcategory":"企業活動","topic":"業務ベンチマーキング","difficulty":1,"source":"IPA「I
