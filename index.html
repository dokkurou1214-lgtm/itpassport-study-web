er.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-stakeholder-change-request-1023","questionText":"追加機能について利用部門は早期実装を求め、運用部門は安定性低下を懸念している。プロジェクト管理者の対応として適切なものはどれですか。","choices":["目的、便益、費用、リスク、影響を整理し、意思決定者を含めて合意する","便益と費用を利用部門だけで評価し、運用への影響は別途扱う","安定性を優先して追加機能を延期し、期待便益は評価しない","両部門の要求を小さく分けて追加し、承認と変更記録は後で行う"],"correctChoiceIndex":0,"explanation":"利害が衝突する変更要求は、変更管理の手順に沿って影響を可視化し、権限を持つ関係者が判断します。根拠と決定を記録することで、後の認識違いも抑えられます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"利害が衝突する変更要求の調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-major-incident-communication-1024","questionText":"多数の利用者に影響する重大障害が発生した。初動の連絡と役割分担として適切なものはどれですか。","choices":["復旧責任者が技術対応と全問合せ対応を兼ね、判明した内容を個別に連絡する","推測を避けるため、原因が確定してから影響と対応状況を初めて連絡する","指揮責任者と連絡窓口を定め、影響・暫定対応・次回報告時刻を共有する","部門ごとに連絡窓口を置き、それぞれの判断で報告内容と時刻を決める"],"correctChoiceIndex":2,"explanation":"重大インシデントでは、指揮、技術対応、利用者連絡などの役割を明確にします。確定している影響と暫定対応、次回更新時刻を一貫した窓口から伝えると、復旧作業と情報提供を両立できます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"重大障害時の連絡・役割分担","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-release-rollback-criteria-1025","questionText":"新リリース直後に主要取引の一部が失敗し、短時間での修正見込みも不明である。事前に定めた切戻し基準を満たした場合の対応はどれですか。","choices":["成功している取引もあるため、新リリースを継続しながら影響範囲を調べる","切戻しより短い可能性を考え、見込みが不明なまま緊急修正を開始する","新規取引を一時停止し、原因が確定するまで切戻し判断を保留する","切戻しを実施し、サービス回復とデータ整合性を確認する"],"correctChoiceIndex":3,"explanation":"切戻し基準は、影響度や復旧見込みなどから新リリースを継続する限界を事前に決めたものです。基準を満たしたら計画どおり旧版へ戻し、機能だけでなく処理途中のデータも確認します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"失敗リリースの切戻し判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-conflicting-audit-evidence-1026","questionText":"監査で、担当者への聞き取りでは統制を実施したというが、システムログには実施記録がない。監査人の対応として適切なものはどれですか。","choices":["担当者の上司が説明を確認すれば、聞き取りを採用して調査を終える","証拠の信頼性を評価し、追加資料や再実施で事実を確かめる","システムログを常に優先し、聞き取り内容を検討対象から外す","矛盾を監査調書へ記録するが、追加の証拠は入手せず判断する"],"correctChoiceIndex":1,"explanation":"監査証拠が矛盾するときは、入手経路や作成時点、改変可能性などから信頼性を評価します。追加のログ、承認記録、再実施などで確かめ、判断過程も監査調書へ残します。","category":"マネジメント系","subcategory":"システム監査","topic":"矛盾する監査証拠への対応","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-remediation-effectiveness-1027","questionText":"監査指摘に対してアクセス権の見直し手順が追加された。改善措置が有効かを確認する方法として適切なものはどれですか。","choices":["改訂した手順書が承認済みであることを確認し、運用記録は確認しない","改善担当者の完了報告と教育記録を確認し、実際の権限変更は確認しない","実際の権限変更記録を抽出し、手順どおり承認・削除されたか再検証する","改善担当者が選んだ成功例を一件確認し、他の記録は抽出しない"],"correctChoiceIndex":2,"explanation":"改善措置の有効性は、対策を作った事実だけでなく、運用されて原因やリスクが減ったかで確認します。実際の処理記録を標本抽出して再検証すると、設計と運用の両面を評価できます。","category":"マネジメント系","subcategory":"システム監査","topic":"改善措置の有効性確認","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-accessible-form-errors-1028","questionText":"申込フォームで入力を誤った利用者に、修正箇所と修正方法を分かりやすく伝える設計として適切なものはどれですか。","choices":["該当項目の近くに誤りの理由と修正方法を文字で示し、その項目と関連付ける","画面上部に誤りの一覧と移動用リンクを示すが、各項目には説明を付けない","該当項目を色とアイコンで示すが、誤りの理由は文字で示さない","入力内容を保持して該当項目の枠を強調するが、修正方法は示さない"],"correctChoiceIndex":0,"explanation":"色だけに頼らず、誤りの内容と直し方を文字で示し、対象項目と関連付けます。視覚や認知の特性、読み上げソフトの利用にかかわらず、利用者が修正場所を理解しやすくなります。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"入力エラーを認識できるフォーム","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-accessible-table-headers-1029","questionText":"複数の行と列を持つ料金表を、画面読み上げでも理解しやすくする対応として適切なものはどれですか。","choices":["見出しを太字で表示するが、データセルとの構造的な関係は設定しない","列見出しだけをデータセルと関連付け、行見出しとの関係は設定しない","行・列の見出しをデータセルと構造的に関連付ける","表の読み上げ順序を指定するが、見出しとデータセルは関連付けない"],"correctChoiceIndex":2,"explanation":"表の見出しとデータセルを構造的に関連付けると、読み上げ時にも値がどの行・列に属するか分かります。見た目の配置だけでは支援技術に関係が伝わらないため、意味のある読み順も確認します。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"表見出しと読み上げ順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-human-centered-iteration-1030","questionText":"人間中心設計で試作画面を作った後の進め方として適切なものはどれですか。","choices":["設計者と保守担当者が試作を確認し、利用者評価をせず完成とする","実際の利用者による評価結果を基に設計を改善し、必要に応じて繰り返す","試作前の利用者調査だけを根拠にし、試作後の評価は行わない","発売後の問合せ件数を収集し、利用中の行動や目的は評価しない"],"correctChoiceIndex":1,"explanation":"人間中心設計では、利用者、目的、利用状況を理解し、試作と利用者評価を反復します。評価結果を設計へ戻すことで、作り手の想定だけでは見つからない使いにくさを改善できます。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"人間中心設計の反復評価","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-gui-control-selection-1031","questionText":"配送方法を「通常・速達・店頭受取」から一つだけ選ばせる画面部品として適切なものはどれですか。","choices":["複数選択用のチェックボックス","自由記述だけの入力欄","進捗を示すプログレスバー","一つだけ選択するラジオボタン"],"correctChoiceIndex":3,"explanation":"ラジオボタンは、互いに排他的な候補から一つを選ぶ場合に適します。チェックボックスは複数項目を独立して選べる場合に使うため、この条件には合いません。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"ラジオボタンとチェックボックス","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-raster-vector-selection-1032","questionText":"企業ロゴを名刺から大型看板まで輪郭を滑らかに保って拡大したい。保存形式の考え方として適切なものはどれですか。","choices":["図形を数式で表すベクターデータを用いる","高解像度のラスター画像一つを全サイズへ拡大・縮小する","ラスター画像を補間拡大して輪郭を補う","画面を撮影したラスター画像を用途別に用意する"],"correctChoiceIndex":0,"explanation":"ベクターデータは線や図形を座標などで表すため、拡大しても輪郭が荒れにくく、ロゴに向きます。ラスター画像は画素で表現するため写真に適しますが、低解像度の画像を大きくすると画素が目立ちます。","category":"テクノロジ系","subcategory":"情報メディア","topic":"ラスター画像とベクター画像","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-image-data-size-1033","questionText":"800×600画素、1画素当たり24ビットの画像を、圧縮せず付加情報もないものとして保存する。データ量は何バイトですか。","choices":["480,000バイト","1,440,000バイト","11,520,000バイト","19,200,000バイト"],"correctChoiceIndex":1,"explanation":"画素数は800×600＝480,000画素で、24ビットは3バイトです。したがって480,000×3＝1,440,000バイトとなります。","category":"テクノロジ系","subcategory":"情報メディア","topic":"画素数・色深度からの容量計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-sensor-device-selection-1034","questionText":"倉庫の扉が開いたか閉じたかという二つの状態を検出したい。目的に合う装置として適切なものはどれですか。","choices":["明るさを測る照度センサー","音の大きさを測るマイク","気圧を測る気圧センサー","扉の接近・離脱を検出する磁気スイッチ"],"correctChoiceIndex":3,"explanation":"磁気スイッチは磁石との接近や離脱によって扉の開閉状態を検出できます。測定したい物理量や状態に合わせてセンサーを選ぶことが重要で、照度や気圧の測定では開閉を直接判断できません。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"測定対象に応じたセンサー選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-input-output-device-role-1035","questionText":"コンピュータにデータを取り込む入力装置と、処理結果を人へ伝える出力装置の組合せはどれですか。","choices":["ディスプレイとスピーカー","プリンタとプロジェクター","キーボードとディスプレイ","スキャナーとマウス"],"correctChoiceIndex":2,"explanation":"キーボードは文字や指示をコンピュータへ入力し、ディスプレイは処理結果を画面へ出力します。スキャナーとマウスはどちらも入力装置で、プリンタとプロジェクターはどちらも出力装置です。","category":"テクノロジ系","subcategory":"ハードウェア","topic":"入力装置・出力装置の役割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-context-switch-load-1036","questionText":"多数の処理を極端に短い時間間隔で切り替えたところ、実処理より切替えの負荷が増えて性能が下がった。原因として適切なものはどれですか。","choices":["実行状態の退避と復元を頻繁に行う負荷が増えた","入力データが増え、各処理の計算量そのものが増えた","通信エラーが増え、ネットワークの再送処理に時間を使った","記憶装置への入出力待ちが増え、処理の待機時間が長くなった"],"correctChoiceIndex":0,"explanation":"コンテキストスイッチでは、実行中の処理の状態を保存し、次の処理の状態を復元します。切替えが過度に多いと管理のための時間が増え、利用者の処理へ使える時間が減ります。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"コンテキスト切替と処理負荷","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-log-rotation-capacity-1037","questionText":"サーバのログファイルが増え続け、記憶容量を圧迫している。必要な監査期間を守りながら行う対応として適切なものはどれですか。","choices":["日単位でログを切り替え、監査期間にかかわらず切替え済みのログを削除する","全てのログをオンラインで保持し、容量不足のたびに記憶装置を追加する","保存期間と容量を定めてローテーションし、古いログを圧縮・退避する","書込み中のログを一つのファイルのまま圧縮し、世代管理を行わない"],"correctChoiceIndex":2,"explanation":"ログローテーションは、一定期間や容量でファイルを切り替え、古いログを圧縮・退避・削除する運用です。法令や監査、障害調査に必要な保存期間を確認した上で容量を管理します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"ログ肥大化と容量不足への対応","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-oss-warranty-support-1038","questionText":"OSSを業務システムへ採用するときの説明として適切なものはどれですか。","choices":["ソースコードを利用できるため、保守はコミュニティへ任せればよい","有償サポートを契約すれば、OSSのライセンス条件は確認しなくてよい","ソースコードを改変できるため、公開義務はライセンスによらず同じである","ライセンス条件と保証範囲を確認し、保守責任や支援体制を決める"],"correctChoiceIndex":3,"explanation":"OSS（Open Source Software：オープンソースソフトウェア）にも著作権とライセンス条件があります。無償で利用できても保証やサポートが付くとは限らないため、利用条件、保守担当、障害時の支援方法を確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"OSSの無保証と保守責任","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-nested-loop-count-1039","questionText":"変数countを0とする。外側の変数iを1から4まで、各iについて内側の変数jを1から6まで1ずつ増やし、i＋jが偶数のときだけcountを1増やす。処理終了時のcountはどれですか。","choices":["10回","12回","18回","24回"],"correctChoiceIndex":1,"explanation":"iが奇数のときはj＝1、3、5、iが偶数のときはj＝2、4、6でi＋jが偶数になります。各iでcountが3回増えるため、外側の4回を合わせて3×4＝12回です。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"入れ子ループの実行回数","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-two-dimensional-array-1040","questionText":"二次元配列Aの行と列の添字は0から始まり、初期値を[[2,4,6],[3,5,7],[8,1,9]]とする。順に「A[0][1]＝A[2][0]」「A[1][2]＝A[0][1]＋A[2][1]」を実行した後、A[1][2]の値はどれですか。","choices":["9","7","8","15"],"correctChoiceIndex":0,"explanation":"1回目の代入でA[0][1]はA[2][0]の8になります。2回目は更新後のA[0][1]＝8とA[2][1]＝1を使うため、A[1][2]は8＋1＝9になります。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"二次元配列の添字追跡","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-tree-hierarchy-selection-1041","questionText":"会社、部門、課、社員という親子関係をたどり、配下の要素を階層的に扱いたい。適したデータ構造はどれですか。","choices":["到着順だけを表すキュー","直前の要素だけを取り出すスタック","行と列だけの単純な表","親から複数の子へ枝分かれする木構造"],"correctChoiceIndex":3,"explanation":"木構造は根から枝分かれする親子関係を表し、組織やフォルダの階層に適します。キューやスタックは要素を取り出す順序を扱いますが、親子の階層そのものは表しません。","category":"テクノロジ系","subcategory":"アルゴリズムとプログラミング","topic":"階層データへの木構造適用","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-weighted-sample-estimate-1042","questionText":"全体の60%を占める層Aの賛成率が20%、40%を占める層Bの賛成率が50%だった。各層の構成比で加重した全体の推定賛成率は何%ですか。","choices":["28%","30%","32%","35%"],"correctChoiceIndex":2,"explanation":"層ごとの割合に母集団構成比を掛け、0.6×20%＋0.4×50%＝12%＋20%＝32%です。二つの賛成率を単純平均すると、層の大きさを反映できません。","category":"テクノロジ系","subcategory":"基礎理論","topic":"層別標本からの加重推定","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-compound-truth-table-1043","questionText":"条件Pが真、条件Qが偽のとき、論理式「P AND (NOT Q)」と「(NOT P) OR Q」の値の組合せはどれですか。","choices":["順に、偽・偽","順に、真・偽","順に、偽・真","順に、真・真"],"correctChoiceIndex":1,"explanation":"Qが偽なのでNOT Qは真となり、P AND (NOT Q)は真AND真で真です。Pが真なのでNOT Pは偽となり、(NOT P) OR Qは偽OR偽で偽です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"複合条件の真理値判定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-active-standby-choice-1044","questionText":"二台のサーバを使い、平常時は一台だけが処理し、障害時にもう一台へ切り替える構成を採用したい。該当する考え方はどれですか。","choices":["現用系と待機系を設けるActive-Standby構成","二台で常時処理を分担するActive-Active構成","一台だけで予備を持たない構成","処理を端末のローカル保存だけへ移す構成"],"correctChoiceIndex":0,"explanation":"Active-Standbyは現用系が通常処理を行い、障害時に待機系へ切り替える構成です。Active-Activeは複数系が平常時から処理を担当するため、要件と費用に応じて選びます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"Active-Activeと待機系の選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-failover-verification-1045","questionText":"障害によって待機サーバへ自動切替えが行われた。切替え後に最初に確認すべき内容として適切なものはどれですか。","choices":["主要サービスの応答だけを確認し、処理中だったデータは後で確認する","主要サービスが応答し、切替え前後のデータに不整合がないことを確認する","処理中だったデータの整合性だけを確認し、業務機能の応答は確認しない","監視上の切替え完了だけを確認し、利用者と同じ操作による確認は行わない"],"correctChoiceIndex":1,"explanation":"フェイルオーバが実行されても、サービスが正常に応答し、処理途中のデータに不整合がないとは限りません。主要な業務機能とデータを確認した後、監視を継続しながら原因を調べます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"フェイルオーバ後の確認順序","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-checkpoint-log-recovery-1046","questionText":"データベース障害後、最後のチェックポイント時点までは一貫した状態で復元できた。その後に確定した更新を復旧するために使うものはどれですか。","choices":["最後のフルバックアップに含まれるデータ","チェックポイント以前に記録された更新ログ","チェックポイント後の未確定更新だけを記録したログ","チェックポイント後に確定した更新を含む更新ログ"],"correctChoiceIndex":3,"explanation":"チェックポイントは復旧処理の開始点を短縮するための一貫した区切りです。その後にコミットされた更新をログから再実行し、未完了の更新は必要に応じて取り消して整合性を回復します。","category":"テクノロジ系","subcategory":"データベース","topic":"チェックポイントとログによる復旧","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-data-model-cardinality-1047","questionText":"一つの部署に複数の社員が所属し、各社員は一つの部署だけに所属する。この関係はどれですか。","choices":["部署と社員が多対多","部署と社員が一対一","部署から社員への一対多","部署から社員への多対一"],"correctChoiceIndex":2,"explanation":"一つの部署に複数社員を関連付けられるため、部署から社員を見ると一対多です。社員側に部署を参照する外部キーを持たせる設計が一般的です。","category":"テクノロジ系","subcategory":"データベース","topic":"一対多関係のデータモデル","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-mobile-handover-1048","questionText":"移動中のスマートフォンが、通信をなるべく切らずに接続先の基地局を切り替える機能はどれですか。","choices":["ハンドオーバー","ループバック","デフラグメンテーション","チェックサム"],"correctChoiceIndex":0,"explanation":"ハンドオーバーは、端末の移動などに応じて接続する基地局やアクセスポイントを切り替える機能です。移動通信の継続性を保つために用いられます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"基地局間ハンドオーバー","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-defense-in-depth-1049","questionText":"一つのセキュリティ対策が破られても被害を抑えるための構成として適切なものはどれですか。","choices":["同じ方式の境界ファイアウォールを複数設置し、内部の監視は設けない","認証、アクセス制御、監視、バックアップを重ねて配置する","認証サーバを二重化し、アクセス制御や利用状況の監視は設けない","同じ設定のマルウェア対策ソフトを複数導入し、復旧策は設けない"],"correctChoiceIndex":1,"explanation":"多層防御は、予防、検知、対応、復旧の異なる対策を重ね、一つが失敗しても次の層で被害を抑える考え方です。同じ種類の対策を増やすだけでなく、役割の異なる対策を組み合わせます。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"予防・検知を組み合わせる多層防御","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-credential-containment-1050","questionText":"従業員の認証情報が外部へ漏えいした疑いがある。被害の拡大を抑える初動として適切なものはどれですか。","choices":["該当認証情報やセッションを失効し、影響範囲を調査する","パスワードを変更し、発行済みのセッションやトークンは有効なままにする","不正利用元とみられるIPアドレスを遮断し、漏えいした認証情報は維持する","利用履歴の監視を強化し、認証情報の失効は不正利用が確定するまで保留する"],"correctChoiceIndex":0,"explanation":"認証情報の漏えいが疑われる場合は、該当するパスワード、鍵、トークン、セッションなどを速やかに失効させます。その上でログから不正利用の範囲を調べ、必要な再発行や関係者への連絡を行います。","category":"テクノロジ系","subcategory":"セキュリティ","topic":"認証情報漏えい時の失効・封じ込め","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-primary-secondary-data-1051","questionText":"新商品の企画で、市場全体の傾向と自社顧客が感じる課題の両方を把握したい。一次データと二次データの使い方として適切なものはどれですか。","choices":["公的統計だけを一次データとして使い、自社調査は行わない","自社アンケートだけを二次データとして使い、市場統計は参照しない","公的統計で市場傾向を把握し、自社調査で固有の課題を収集する","入手元が異なっても、全てのデータを一次データとして扱う"],"correctChoiceIndex":2,"explanation":"一次データは調査目的に合わせて自ら収集するデータで、二次データは公的統計など既に収集されたデータです。二次データで市場の概況を効率よく捉え、一次データで自社固有の疑問を確かめると、両者の特徴を生かせます。","category":"ストラテジ系","subcategory":"企業活動","topic":"一次データと二次データの使い分け","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-data-collection-purpose-1052","questionText":"問い合わせ窓口の待ち時間を改善するためにデータを収集する。収集開始前の対応として最も適切なものはどれですか。","choices":["改善判断に必要な指標を定め、受付時刻や対応開始時刻などの項目を決める","取得しやすい項目を先に集め、そのデータだけで改善目的を決める","利用できる全項目を集め、分析段階まで利用目的を決めない","直近一週間の件数だけを集め、曜日や時間帯の違いは記録しない"],"correctChoiceIndex":0,"explanation":"データ収集では、まず解決したい課題と判断に必要な指標を明確にし、その算出に必要な項目を決めます。目的を定めずに大量のデータを集めても、必要な時刻や条件が欠け、改善判断に使えないことがあります。","category":"ストラテジ系","subcategory":"企業活動","topic":"収集目的から必要データを定める","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-survey-log-selection-1053","questionText":"ECサイトで、利用者が入力画面を難しいと感じているかと、実際にどの画面で操作を中断したかの両方を調べたい。適切なデータ収集はどれですか。","choices":["満足度アンケートだけを行い、操作履歴は収集しない","画面遷移ログだけを収集し、利用者の感じ方は尋ねない","商品別の売上合計だけを集計し、入力画面は調査しない","アンケートで感じ方を尋ね、画面遷移ログで中断箇所を確認する"],"correctChoiceIndex":3,"explanation":"アンケートは利用者の意識や理由を把握しやすく、行動ログは実際の操作を客観的に確認できます。両方を組み合わせると、感じ方と行動のずれも含めて入力画面の課題を分析できます。","category":"ストラテジ系","subcategory":"企業活動","topic":"調査データと行動ログの選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-open-data-definition-alignment-1054","questionText":"複数自治体のオープンデータを統合したところ、同じ「世帯数」という項目でも値の基準日や集計単位が異なっていた。最初に行う対応として適切なものはどれですか。","choices":["項目名が同じなので、そのまま全自治体の行を連結する","定義、単位、基準日を確認し、比較可能な形へ変換する","自治体ごとの差をなくすため、全ての値を単純平均する","数値だけを残し、定義や基準日を示す情報を削除する"],"correctChoiceIndex":1,"explanation":"異なる組織のデータを統合するときは、項目名だけでなく定義、単位、対象範囲、基準日を確認します。意味がそろわない値をそのまま連結すると誤った比較になるため、変換方法や比較できない範囲も記録します。","category":"ストラテジ系","subcategory":"ビジネスインダストリ","topic":"オープンデータ統合時の定義・基準時点確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-gis-store-planning-1055","questionText":"小売店の新規出店候補を比較するために、地域の人口、駅からの距離、競合店の位置を利用したい。適切な分析方法はどれですか。","choices":["各データを地図上のレイヤとして重ね、候補地周辺の条件を比較する","人口だけを時系列グラフにし、駅や競合店との位置関係は使わない","候補地名を五十音順に並べ、その順序で出店先を決める","全地域の人口を合計し、候補地ごとの違いを区別しない"],"correctChoiceIndex":0,"explanation":"GIS（Geographic Information System：地理情報システム）では、人口や交通、施設位置などを地図上で重ねて分析できます。出店判断では、単一の集計値ではなく候補地ごとの空間的な条件を比較することが重要です。","category":"ストラテジ系","subcategory":"企業活動","topic":"GISデータを用いた出店候補分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-time-series-cross-section-1056","questionText":"時系列データとクロスセクションデータの組合せとして適切なものはどれですか。","choices":["一店舗の月別売上は、複数時点の値でもクロスセクションに分類する","同じ月の店舗別売上は、店舗数にかかわらず時系列に分類する","一店舗の月別売上が時系列で、同じ月の店舗別売上がクロスセクション","観測時点や比較対象が異なっても、二つは同じ種類に分類する"],"correctChoiceIndex":2,"explanation":"時系列データは同じ対象を時間の経過に沿って観測したデータです。クロスセクションデータは同じ時点で複数の対象を比較するため、一店舗の月別売上と同じ月の店舗別売上はそれぞれ異なる種類です。","category":"ストラテジ系","subcategory":"企業活動","topic":"時系列データとクロスセクションデータの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-data-dictionary-1057","questionText":"部門ごとに「顧客数」の定義が異なり、同じ名称の集計値が一致しない。項目名、意味、データ型、単位などを共通化するために整備するものはどれですか。","choices":["業務の作業順序を示すフローチャート","データ項目の定義を記載するデータ辞書","プロジェクト作業を分解したWBS","システム間の通信経路を示すネットワーク図"],"correctChoiceIndex":1,"explanation":"データ辞書は、項目名、意味、形式、単位、利用上の規則などを整理したものです。共通の定義を参照することで、部門ごとの解釈の違いを減らせます。WBS（Work Breakdown Structure：作業分解構成図）は作業管理のための資料です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"データ辞書による項目定義の統一","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-kpi-lineage-troubleshooting-1058","questionText":"二つのダッシュボードで同じKPIの値が一致しない。元データから集計結果までのどの処理で差が生じたかを特定するため、最も役立つ情報はどれですか。","choices":["各ダッシュボードの配色と画面レイアウト","利用者がダッシュボードを開いた回数","KPIを閲覧できる利用者の所属部門","データの取得元、変換処理、集計先をたどれる記録"],"correctChoiceIndex":3,"explanation":"KPI（Key Performance Indicator：重要業績評価指標）の不一致を調べるには、データリネージを使って取得元、加工、集計、出力までの流れを追跡します。表示形式や閲覧回数では、値が変化した処理箇所を特定できません。","category":"ストラテジ系","subcategory":"企業活動","topic":"KPI不一致をデータリネージで追跡","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-data-quality-completeness-1059","questionText":"申込データ1,000件について、必須の連絡先が入力されている件数の割合を測定した。この評価対象となるデータ品質の観点はどれですか。","choices":["正確性","適時性","完全性","一貫性"],"correctChoiceIndex":2,"explanation":"完全性は、必要なレコードや項目が欠けずにそろっているかという観点です。入力済みの値が事実と合っているかは正確性、必要な時点で新しいかは適時性に関係します。","category":"ストラテジ系","subcategory":"企業活動","topic":"データ品質の完全性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-customer-record-linkage-1060","questionText":"顧客データを統合したところ、氏名の表記揺れや住所変更によって同一人物と思われる複数レコードが見つかった。統合方法として最も適切なものはどれですか。","choices":["氏名が完全一致したレコードだけを同一人物とし、残りは全て別人にする","郵便番号が一致したレコードを同一人物とし、他の項目は確認しない","更新日時が最も新しいレコードだけを残し、過去データとの対応を記録しない","表記を正規化し、複数の識別項目で照合して、不確かな候補は確認する"],"correctChoiceIndex":3,"explanation":"名寄せでは、文字種や住所表記を正規化し、氏名、連絡先、顧客番号など複数の情報を使って同一性を判断します。一つの項目だけで自動統合すると別人を結合する危険があるため、不確かな候補は確認対象として扱います。","category":"ストラテジ系","subcategory":"企業活動","topic":"名寄せ時の照合キーと重複統合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-annotation-guideline-1061","questionText":"画像認識用の学習データを複数人で作成したところ、同じ画像でも付けられるラベルが人によって異なった。改善策として最も適切なものはどれですか。","choices":["担当者ごとに独自の判断基準を作り、その基準は共有しない","境界事例を含む付与基準を定め、判断の一致度を確認する","ラベルの種類を増やし、各ラベルの意味は担当者へ任せる","不一致の画像を全て除外し、不一致が生じた理由は調べない"],"correctChoiceIndex":1,"explanation":"アノテーションは、データへ正解ラベルなどの情報を付ける作業です。具体例や境界事例を含む共通基準を用意し、複数人の判断の一致度を確認すると、ラベルの一貫性を高められます。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"アノテーション基準と一致性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-missing-data-business-risk-1062","questionText":"満足度調査で、不満を持つ利用者ほど回答を途中でやめ、満足度欄が欠損する傾向があった。欠損した回答を除いて平均満足度を算出する場合のリスクはどれですか。","choices":["回答数が減るだけで、平均満足度の偏りは生じない","欠損値を除くと、満足度は必ず実際より低く算出される","有効回答の平均を使えば、欠損の発生理由を考える必要はない","不満層が集計から抜け、平均満足度が実際より高くなる可能性がある"],"correctChoiceIndex":3,"explanation":"欠損が回答者の満足度と関係している場合、欠損行を除くだけでは残った回答が全体を代表しません。この例では不満層が抜けやすいため、平均満足度を高めに見積もる可能性があります。","category":"ストラテジ系","subcategory":"企業活動","topic":"欠損データが業務判断へ与える偏り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-experiment-observation-causality-1063","questionText":"購買履歴を調べると、キャンペーンメールを開封した顧客は、開封しなかった顧客より購入額が高かった。この結果からキャンペーンの効果を判断する説明として最も適切なものはどれですか。","choices":["購買意欲の高い顧客ほど開封した可能性があり、比較実験などで他の要因を抑えて確認する","購入額に差があるので、メール開封が購入額増加の原因だと確定する","開封時刻が購入より前なら、他の要因を調べずメールの効果だと判断する","開封者数が十分に多ければ、顧客属性の違いは因果判断に影響しない"],"correctChoiceIndex":0,"explanation":"観察データの差には、元からの購買意欲など別の要因が影響している可能性があります。因果効果を確かめるには、無作為な割付けなどで条件をそろえた比較実験を検討し、相関だけで原因と断定しないことが重要です。","category":"ストラテジ系","subcategory":"企業活動","topic":"実験データと観察データの因果解釈","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-moving-average-calc-1064","questionText":"ある商品の5月、6月、7月の販売数は順に120個、150個、210個だった。この3か月の販売数を使った単純移動平均を8月の予測値とすると、予測値は何個ですか。","choices":["120個","150個","160個","210個"],"correctChoiceIndex":2,"explanation":"3期間の単純移動平均は、対象となる三つの値を合計して3で割ります。（120＋150＋210）÷3＝160なので、8月の予測値は160個です。","category":"ストラテジ系","subcategory":"企業活動","topic":"3期間移動平均の計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-cross-tab-conversion-calc-1065","questionText":"メール配信後の購入状況を集計した。既存顧客は120人中36人、新規顧客は80人中12人が購入した。新規顧客の購入率は何%ですか。","choices":["6%","24%","12%","15%"],"correctChoiceIndex":3,"explanation":"新規顧客の購入率なので、分母は新規顧客80人、分子はそのうち購入した12人です。12÷80×100＝15%となり、全配信者200人や全購入者48人を分母にはしません。","category":"ストラテジ系","subcategory":"企業活動","topic":"クロス集計から条件別比率を計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-ab-test-result-judgment-1066","questionText":"申込画面のA/Bテストで、現行Aは10,000人中500人、新案Bは300人中18人が申込みを完了した。Bの完了率が高いことを理由に採用を求められた。判断として最も適切なものはどれですか。","choices":["Bの完了率が高いので、標本数や実施期間を確認せず採用する","Bの標本数と実施期間を確保し、差の確かさと実務上の効果を評価する","Aの標本数が多いので、完了率の比較を行わずAを維持する","画面の開発費だけを比較し、完了率の差は判断材料から外す"],"correctChoiceIndex":1,"explanation":"Aの完了率は5%、Bは6%ですが、Bの標本数は小さく、偶然の変動かを確認する必要があります。十分な期間と標本で差の確かさを確認し、1ポイントの改善が費用や業務に対して意味を持つかも評価します。","category":"ストラテジ系","subcategory":"経営戦略マネジメント","topic":"A/Bテスト結果の採用判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-population-1067","questionText":"システム監査で、2026年4月に承認された全ての購買取引から標本を選んで確認する。この場合の母集団はどれですか。","choices":["標本として選ばれた購買取引","監査人が不備を発見した購買取引","監査対象の期間と条件に該当する取引全体","監査人が実際に閲覧した購買取引"],"correctChoiceIndex":2,"explanation":"母集団は、監査上の結論を出したい対象全体です。この例では2026年4月に承認された全購買取引が母集団であり、そこから実際に選んだ一部が標本です。","category":"マネジメント系","subcategory":"システム監査","topic":"監査母集団の定義","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-audit-population-completeness-1068","questionText":"購買承認の監査で、システムから抽出した一覧を母集団として標本を選ぶ。一覧には取消済み取引が出力されない可能性がある。標本選定前の対応として適切なものはどれですか。","choices":["対象期間や抽出条件を確認し、元システムの件数などと照合する","一覧から無作為に選べば、一覧自体の漏れは監査結果へ影響しない","金額の大きい取引だけを追加すれば、母集団の完全性を確認できる","取消済み取引が含まれない前提で、その事実を確認せず標本を選ぶ"],"correctChoiceIndex":0,"explanation":"抽出元の一覧に漏れがあると、その後に無作為抽出しても漏れた取引は標本になりません。対象期間、状態、抽出条件を確認し、件数や合計値を元システムと照合して母集団の完全性を確かめます。","category":"マネジメント系","subcategory":"システム監査","topic":"サンプリング前の母集団完全性確認","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-risk-stratified-sampling-1069","questionText":"監査対象には少数の高額取引と多数の少額取引がある。高額取引を十分に確認しつつ、少額取引も偏りなく標本へ含めたい。適切な方法はどれですか。","choices":["全取引を金額順に並べ、先頭から必要件数だけ選ぶ","少額取引だけを無作為に選び、高額取引は対象外にする","全取引から一つの間隔で選び、金額区分は考慮しない","金額やリスクで層に分け、各層の方針に従って標本を選ぶ"],"correctChoiceIndex":3,"explanation":"層別抽出では、母集団を金額やリスクなどで層に分け、それぞれから標本を選びます。高リスク層を重点的に確認しながら、通常層も無作為に選ぶと、監査目的と代表性の両方を考慮できます。","category":"マネジメント系","subcategory":"システム監査","topic":"リスク層別による監査標本選定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-random-judgmental-sampling-1070","questionText":"監査における無作為抽出と判断抽出の説明として適切なものはどれですか。","choices":["無作為抽出は高リスク項目を必ず選び、判断抽出は全項目を同確率で選ぶ","判断抽出で選んだ標本は、母集団全体を統計的に代表することが保証される","無作為抽出は選択の偏りを抑え、判断抽出は特定の高リスク項目を重点確認できる","無作為抽出と判断抽出は選定手順が異なるだけで、利用目的に違いはない"],"correctChoiceIndex":2,"explanation":"無作為抽出は各項目が選ばれる機会を持つため、選択者の偏りを抑えやすい方法です。判断抽出は監査人が高リスク項目などを重点的に選べますが、その標本から母集団全体へ統計的に一般化する際には注意が必要です。","category":"マネジメント系","subcategory":"システム監査","topic":"無作為抽出と判断抽出の違い","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-incident-pareto-analysis-1071","questionText":"1か月分のインシデントを原因別に集計し、限られた改善要員を件数の多い原因から重点配分したい。適切な分析方法はどれですか。","choices":["原因別件数を多い順に並べ、累積割合とともに確認する","発生日時の順に並べ、原因別の件数は集計しない","担当者名の順に並べ、原因の分類は行わない","復旧時間の平均だけを求め、発生件数は比較しない"],"correctChoiceIndex":0,"explanation":"パレート図では、原因別の件数を多い順に並べ、累積割合を確認します。全原因を同じ優先度で扱うのではなく、件数への寄与が大きい原因から改善する判断に役立ちます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"インシデント分類のパレート分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-sla-segment-analysis-1072","questionText":"月間の平均応答時間はSLAを満たしているが、利用者から昼休みの遅延について苦情が多い。次に行う分析として適切なものはどれですか。","choices":["月間平均だけを再計算し、時間帯別の違いは確認しない","苦情件数だけを数え、応答時間の記録とは対応付けない","時間帯別の応答時間や基準超過割合を集計して比較する","最も速い応答時間を代表値とし、遅い応答は集計から外す"],"correctChoiceIndex":2,"explanation":"SLA（Service Level Agreement：サービスレベル合意書）の月間平均だけでは、特定時間帯の悪化が隠れることがあります。時間帯別の分布や基準超過割合を確認すると、ピーク時に集中する問題を把握できます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"平均値だけに依存しないSLA分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-analogous-data-estimate-1073","questionText":"新しい小規模システムの初期見積りで、詳細な作業分解はまだできていない。類似案件の実績データを利用する方法として適切なものはどれですか。","choices":["最も費用が小さかった案件の値を、そのまま新案件へ適用する","規模や複雑さが近い案件を選び、条件の違いを補正して見積もる","全案件の最大値を採用し、案件間の条件差は確認しない","類似案件の計画値だけを使い、実績との差は確認しない"],"correctChoiceIndex":1,"explanation":"類推見積りでは、規模、機能、技術、体制などが近い過去案件の実績を基準にします。新案件との相違点を補正することで、単に最小値や最大値を流用するより根拠のある初期見積りになります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"類似案件実績を使う見積り","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-control-chart-pattern-1074","questionText":"工程の処理時間を管理図で監視したところ、全ての点は管理限界内だが、8回連続で値が上昇している。この結果への対応として最も適切なものはどれですか。","choices":["全て管理限界内なので、工程は変化していないと結論付ける","上昇した8点を異常値として削除し、残りだけで評価する","現在の点が収まるよう管理限界を広げ、工程は調査しない","偶然ではない傾向の可能性を考え、工程条件の変化を調べる"],"correctChoiceIndex":3,"explanation":"管理図では、管理限界を超えた点だけでなく、連続した上昇や片側への偏りなどの非ランダムな並びにも注意します。管理限界内でも工程変化の兆候になり得るため、設備や作業条件を調べます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"管理限界内の連続傾向の解釈","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-module-defect-density-calc-1075","questionText":"モジュールXは6千行で欠陥12件、モジュールYは10千行で欠陥15件だった。欠陥密度を「欠陥件数÷千行」で比較した結果として適切なものはどれですか。","choices":["Xは2件/千行、Yは1.5件/千行なので、Xの方が高い","Yは15件と多いため、規模を考慮してもYの方が高い","Xは0.5件/千行、Yは約0.67件/千行なので、Yの方が高い","両方とも欠陥が10件を超えるため、欠陥密度は同じである"],"correctChoiceIndex":0,"explanation":"Xは12÷6＝2件/千行、Yは15÷10＝1.5件/千行です。欠陥件数だけならYが多いものの、規模当たりではXの方が高く、規模の異なるモジュールは密度で比較する必要があります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"規模の異なるモジュールの欠陥密度比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-lessons-data-bias-1076","questionText":"プロジェクトの教訓を収集したところ、会議に参加した一部の成功チームの意見だけが記録されていた。次回プロジェクトへ活用できる資料にする対応として適切なものはどれですか。","choices":["成功チームの意見だけを代表事例として残し、他のチームは調査しない","成功・失敗した複数チームや役割から収集し、回答範囲も記録する","参加人数を増やさず、記録された意見の文章だけを詳しくする","会議参加者の意見を平均し、参加していない関係者の偏りは考慮しない"],"correctChoiceIndex":1,"explanation":"一部の成功チームだけから集めた教訓には、選択の偏りが生じます。成功例と失敗例、異なる役割から情報を集め、対象範囲や収集方法も記録すると、次回に適用するときの条件を判断しやすくなります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"教訓収集時の回答者偏り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-alert-threshold-tuning-1077","questionText":"毎晩の定期バッチ処理中だけCPU使用率の警報が大量に発生するが、サービスへの影響は確認されていない。監視を改善する対応として最も適切なものはどれですか。","choices":["CPU使用率の警報を全時間帯で無効にし、今後の異常も検知しない","現在のしきい値を維持し、警報件数だけを月次報告へ追加する","時間帯別の正常範囲と影響を分析し、見逃しを検証しながら条件を調整する","バッチ処理中の記録を削除し、昼間のデータだけでしきい値を決める"],"correctChoiceIndex":2,"explanation":"CPU（Central Processing Unit：中央処理装置）の監視しきい値は、通常時の変動とサービス影響を分析して調整します。警報を一律に止めるのではなく、時間帯や処理内容に応じた条件を検討し、重大な異常を見逃さないことも確認します。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"誤検知データに基づく監視しきい値調整","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-quantitative-qualitative-data-1078","questionText":"購入記録の項目を、数量として計算できるデータと分類を示すデータに分けた例はどれですか。","choices":["購入金額が量的データ、商品カテゴリが質的データ","会員ランクが量的データ、来店回数が質的データ","郵便番号が量的データ、商品の重さが質的データ","商品カラーが量的データ、購入個数が質的データ"],"correctChoiceIndex":0,"explanation":"量的データは購入金額や個数のように数量として計算できるデータです。質的データは商品カテゴリのように種類や属性を表します。数字で表されていても、会員番号や郵便番号は数量ではなく識別や分類のためのデータです。","category":"テクノロジ系","subcategory":"基礎理論","topic":"量的データと質的データ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-structured-unstructured-data-1079","questionText":"構造化データと非構造化データの説明として適切なものはどれですか。","choices":["画像は行と列が定義されるため構造化データで、顧客表は非構造化データである","文章は検索できるため構造化データで、売上表は非構造化データである","保存形式にかかわらず、全てのデータは同じ構造を持つ","顧客表は定義済み項目を持つ構造化データで、自由記述文は非構造化データである"],"correctChoiceIndex":3,"explanation":"構造化データは、表の列のように項目や形式があらかじめ定められたデータです。自由記述文、画像、音声などは一定の表形式へそのまま収めにくいため、非構造化データとして扱われます。","category":"テクノロジ系","subcategory":"データベース","topic":"構造化データと非構造化データ","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-metadata-role-1080","questionText":"写真データを管理するとき、撮影日時、撮影者、ファイル形式など、写真そのものを説明するデータはどれですか。","choices":["トランザクションデータ","メタデータ","バックアップデータ","キャッシュデータ"],"correctChoiceIndex":1,"explanation":"メタデータは、データの作成日時、作成者、形式、意味など、対象データを説明するためのデータです。検索、管理、利用条件の確認などに役立ちます。","category":"テクノロジ系","subcategory":"データベース","topic":"データを説明するメタデータの役割","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-missing-pattern-treatment-1081","questionText":"温度センサの測定値を調べると、高温時に限って欠損が増えていた。分析前の対応として最も適切なものはどれですか。","choices":["全ての欠損を全期間の平均値で補い、発生条件は確認しない","欠損した行を全て削除し、高温時のデータが減る影響は評価しない","高温による機器停止などの原因を調べ、目的に応じた処理方法を選ぶ","欠損値を0度として記録し、実測値と同じものとして集計する"],"correctChoiceIndex":2,"explanation":"欠損が高温時へ集中している場合、欠損は偶然ではなく機器特性と関係している可能性があります。平均値で一律補完したり行を削除したりする前に原因を調べ、修理、再測定、除外、補完などを分析目的に応じて選びます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"欠損の集中原因と処理方針","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-robust-summary-outlier-1082","questionText":"社員の給与分布には、実際に支給された少数の非常に高い値が含まれている。一般的な社員の給与水準を示す代表値として、平均値より適切なものはどれですか。","choices":["中央値","最大値","範囲","合計値"],"correctChoiceIndex":0,"explanation":"中央値は値を順に並べた中央の値で、少数の極端に大きい値の影響を平均値より受けにくい代表値です。正当な外れ値を無条件に削除するのではなく、目的に合う代表値を選びます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"正当な外れ値がある場合の代表値","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-range-standard-deviation-1083","questionText":"データの散らばりを示す範囲と標準偏差の説明として適切なものはどれですか。","choices":["範囲は全データの平均との差を使い、標準偏差は最大値と最小値だけを使う","範囲も標準偏差も、最大値と最小値だけから求める","標準偏差はデータ数だけで決まり、各データの値には影響されない","範囲は最大値と最小値の差で、標準偏差は各値の平均からの散らばりを反映する"],"correctChoiceIndex":3,"explanation":"範囲は最大値と最小値の差なので、両端の値だけで決まります。標準偏差は各データが平均値からどの程度離れているかを反映するため、データ全体の散らばりを比較するのに利用できます。","category":"テクノロジ系","subcategory":"基礎理論","topic":"範囲と標準偏差の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-variance-comparison-calc-1084","questionText":"データ群Aは「4, 4, 6, 6」、データ群Bは「2, 4, 6, 8」で、どちらも平均は5である。分散を「平均との差の二乗の合計÷データ数」で求めた結果として適切なものはどれですか。","choices":["二乗和をそのまま使い、Aは4、Bは20とする","平均が等しいため、AもBも分散は0とする","Aは1、Bは5で、Bの方が散らばりが大きい","二乗和をデータ数で二回割り、Aは0.25、Bは1.25とする"],"correctChoiceIndex":2,"explanation":"Aの平均との差は－1,－1,1,1なので、分散は（1＋1＋1＋1）÷4＝1です。Bは－3,－1,1,3なので、分散は（9＋1＋1＋9）÷4＝5となり、Bの方が散らばりが大きいと分かります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"2データ群の分散計算と安定性比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-even-median-calc-1085","questionText":"小さい順に並べたデータが「2, 5, 8, 13, 20, 32」である。このデータの中央値はいくつですか。","choices":["8","10.5","13.3","17"],"correctChoiceIndex":1,"explanation":"データ数が6個で偶数なので、中央にある3番目の8と4番目の13を平均します。（8＋13）÷2＝10.5が中央値です。","category":"テクノロジ系","subcategory":"基礎理論","topic":"偶数個データの中央値計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-mode-category-choice-1086","questionText":"利用者が選んだ画面テーマは、青が12人、赤が8人、緑が5人だった。最も多く選ばれたカテゴリを表す代表値とその値の組合せはどれですか。","choices":["最頻値の青","平均値の青","中央値の赤","範囲の7人"],"correctChoiceIndex":0,"explanation":"カテゴリデータで最も多く現れる値は最頻値です。この場合は青が12人で最も多いため、最頻値は青です。色のようなカテゴリ自体に平均値を計算することはできません。","category":"テクノロジ系","subcategory":"基礎理論","topic":"カテゴリデータに対する最頻値の選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-histogram-bin-interpretation-1087","questionText":"同じ測定データから、階級幅が狭いヒストグラムと広いヒストグラムを作ったところ、分布の見え方が異なった。解釈として適切なものはどれですか。","choices":["階級幅を変えて見え方が変わると、元データの値も変化している","階級幅が狭い図は常に正しく、広い図は分析に利用できない","狭い階級は細かな形を示し、広い階級は変動をまとめるため、目的に応じて確認する","広い階級を使うと外れ値が消えるため、外れ値の確認は不要になる"],"correctChoiceIndex":2,"explanation":"ヒストグラムは階級幅によって、細かな凹凸が見えたり、全体傾向が滑らかに見えたりします。元データは同じでも印象が変わるため、一つの階級幅だけで結論を出さず、分析目的に合う幅を選びます。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"ヒストグラムの階級幅による見え方","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-box-plot-comparison-1088","questionText":"二つの作業時間を箱ひげ図で比較した。Aは中央値70分、四分位範囲10分、Bは中央値65分、四分位範囲20分で、Bには高い側の外れ値が一つある。読み取りとして適切なものはどれですか。","choices":["AはBより中央値が低く、中央付近の散らばりが大きい","BはAより中央値が高く、中央付近の散らばりが小さい","Bに外れ値があるので、Bの全ての値はAより大きい","Aは中央値が高いが、Bは中央付近の散らばりが大きい"],"correctChoiceIndex":3,"explanation":"Aの中央値70分はBの65分より高く、Bの四分位範囲20分はAの10分より大きいため、Bの中央50%はより広く散らばっています。外れ値が一つあっても、Bの全データがAより大きいとはいえません。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"箱ひげ図による中央値・四分位範囲・外れ値比較","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-nonlinear-scatter-correlation-1089","questionText":"二つの変数の散布図は明確なU字形だが、直線的な相関の強さを示す相関係数は0に近かった。この結果の解釈として最も適切なものはどれですか。","choices":["直線では表しにくい関係がある可能性があり、散布図と分析方法を見直す","相関係数が0に近いので、二つの変数にはどのような関係もない","U字形なので、一方が他方の原因であることが証明された","相関係数と散布図が異なるため、測定データは全て無効である"],"correctChoiceIndex":0,"explanation":"一般的な相関係数は主に直線的な関係の強さを表すため、U字形のような非線形関係では0に近くなることがあります。相関係数だけで関係なしと判断せず、散布図を確認し、関係の形に合う分析を検討します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"非線形関係と相関係数の限界","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cross-tab-conditional-rate-1090","questionText":"サイト訪問者を端末別に集計すると、スマートフォンは200人中40人、PCは100人中30人が購入した。スマートフォン利用者の購入率を表す計算はどれですか。","choices":["40÷70＝約57%","40÷200＝20%","40÷300＝約13%","70÷300＝約23%"],"correctChoiceIndex":1,"explanation":"スマートフォン利用者の購入率を求めるため、分母はスマートフォン利用者200人、分子はそのうち購入した40人です。40÷200＝20%であり、全購入者や全訪問者を分母にはしません。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"クロス集計表の条件付き割合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-mosaic-plot-reading-1091","questionText":"地域別の訪問者数と購入有無をモザイク図で表した。各地域の横幅は訪問者数、縦方向の分割比率は購入有無の割合を表す。この図から読み取れる内容として適切なものはどれですか。","choices":["各地域の横幅だけから、地域内の購入率を比較できる","購入部分の高さだけから、全地域の購入者数を比較できる","長方形の色だけから、訪問者数と購入率の両方を計算できる","横幅で地域規模を、縦の比率で地域内の購入割合を比較できる"],"correctChoiceIndex":3,"explanation":"モザイク図では、一方の分類の大きさを横幅、もう一方の構成比を縦の分割で表せます。横幅と高さの両方から、グループの規模とグループ内の割合を区別して読み取ることが重要です。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"モザイク図による構成比の読取り","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-sampling-method-selection-1092","questionText":"標本抽出方法と利用場面の組合せとして適切なものはどれですか。","choices":["名簿から全員を同じ確率で選ぶ方法が層別抽出、年齢層ごとに選ぶ方法が系統抽出","製造順に一定間隔で選ぶ方法が系統抽出、年齢層ごとに分けて選ぶ方法が層別抽出","調査担当者が選びやすい人を選ぶ方法が単純無作為抽出、一定間隔で選ぶ方法が層別抽出","年齢層ごとに分けて一つの層だけを選ぶ方法が層別抽出、全層から選ぶ方法が判断抽出"],"correctChoiceIndex":1,"explanation":"系統抽出は、一覧上の開始点を決めて一定間隔で標本を選ぶ方法です。層別抽出は、母集団を年齢層などに分け、各層から標本を選ぶため、重要な層を標本へ含めやすくなります。","category":"テクノロジ系","subcategory":"基礎理論","topic":"単純無作為・層別・系統抽出の選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-nonresponse-bias-1093","questionText":"全顧客へ電子メールでアンケートを送ったところ、高年齢層の回答率だけが低かった。全顧客の意見を推定する際の対応として最も適切なものはどれですか。","choices":["回答率の高い年齢層だけで集計し、全顧客の結果として扱う","未回答者は全員反対だったと仮定し、反対回答として追加する","別の回答手段や再依頼を検討し、年齢構成と回答状況を確認する","回答者数だけを増やすため、既に回答した人へ同じ調査を再送する"],"correctChoiceIndex":2,"explanation":"特定の層が回答しにくいと、回答者の構成が母集団と異なる無回答バイアスが生じます。別の回答手段や再依頼で不足層の回答を促し、既知の母集団構成との違いを確認して推定方法を検討します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"無回答バイアスの診断と低減","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-null-hypothesis-formulation-1094","questionText":"現行画面より新画面の申込率が高いかを検証する。帰無仮説として適切なものはどれですか。","choices":["新画面の申込率は現行画面より高くない","新画面の申込率は現行画面より必ず高い","新画面の開発費は現行画面より低い","新画面の利用者数は現行画面と異なる"],"correctChoiceIndex":0,"explanation":"帰無仮説は、検証したい差や効果がない側に置く仮説です。新画面の申込率が高いかを片側で検証する場合は、「新画面は現行画面より高くない」を帰無仮説とし、データから棄却できるかを判断します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"帰無仮説の設定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-significance-level-tradeoff-1095","questionText":"仮説検定で、標本数やその他の条件を変えずに有意水準を5%から1%へ小さくした。この変更の説明として適切なものはどれですか。","choices":["帰無仮説を棄却しやすくなり、第1種の誤りも起こりやすくなる","第1種と第2種の誤りが、どちらも必ず同じ割合で減少する","判定基準は厳しくなるが、第1種の誤りの起こりやすさは変わらない","帰無仮説を棄却しにくくなり、第1種の誤りを起こす上限は小さくなる"],"correctChoiceIndex":3,"explanation":"有意水準を小さくすると帰無仮説を棄却する基準が厳しくなり、帰無仮説が正しいのに棄却する第1種の誤りを起こす上限は小さくなります。ただし、標本数などが同じなら第2種の誤りがどう変わるかにも注意が必要で、全ての誤りが同時に減るとは限りません。","category":"テクノロジ系","subcategory":"基礎理論","topic":"有意水準と第1種の誤りの関係","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-statistical-significance-1096","questionText":"大量のデータを使った比較で、新方式は旧方式より平均処理時間が0.1秒短く、統計的に有意な差が得られた。一方、導入費用は大きい。採用判断として最も適切なものはどれですか。","choices":["統計的に有意なので、費用や利用者への影響を比較せず採用する","差の確かさに加え、0.1秒の改善価値や費用を評価して判断する","改善量が小さいので、統計的な差の確認結果は全て無効とみなす","標本数が多いので、平均処理時間の差を確認せず採用を見送る"],"correctChoiceIndex":1,"explanation":"統計的有意差は、観測された差を偶然だけでは説明しにくいことを判断する材料です。しかし、差の大きさが業務上重要か、費用に見合うかは別に評価する必要があり、有意差だけで採用を決めることはできません。","category":"テクノロジ系","subcategory":"基礎理論","topic":"統計的有意差と実務上の重要性","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-type-one-error-1097","questionText":"品質監視で「不良率は従来と変わらない」を帰無仮説とした。第1種の誤りに当たるものはどれですか。","choices":["不良率が上昇しており、上昇したと正しく判断する","不良率が上昇しているが、変わらないと判断する","不良率が変わらず、変わらないと正しく判断する","不良率が変わらないのに、上昇したと判断する"],"correctChoiceIndex":3,"explanation":"第1種の誤りは、帰無仮説が正しいのに棄却する誤りです。この場合は不良率が実際には変わらないのに、上昇したと判断することが該当します。","category":"テクノロジ系","subcategory":"基礎理論","topic":"第1種の誤りの事例判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-type-two-error-1098","questionText":"A/Bテストで「新画面の効果はない」を帰無仮説とした。第1種の誤りと第2種の誤りの組合せとして適切なものはどれですか。","choices":["第1種は実際の効果を見逃すこと、第2種は効果を正しく検出すること","第1種は効果なしを正しく判断すること、第2種は効果ありを正しく判断すること","第1種は効果がないのに効果ありと判断すること、第2種は実際の効果を見逃すこと","第1種も第2種も、標本数が少ない状態そのものを表す"],"correctChoiceIndex":2,"explanation":"第1種の誤りは、効果がないのに帰無仮説を棄却して効果ありと判断することです。第2種の誤りは、実際には効果があるのに帰無仮説を棄却できず、効果を見逃すことです。","category":"テクノロジ系","subcategory":"基礎理論","topic":"第1種と第2種の誤りの区別","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-gis-layer-visualization-1099","questionText":"避難所の配置を確認するため、洪水浸水想定区域、人口分布、避難所の位置を同じ地図上で比較したい。適切な方法はどれですか。","choices":["GISで各情報を別レイヤとして重ねて表示する","人口の合計だけを円グラフにし、位置情報は使わない","避難所名を五十音順に並べ、浸水区域は表示しない","各情報を文章へ変換し、地域ごとの位置関係は比較しない"],"correctChoiceIndex":0,"explanation":"GIS（Geographic Information System：地理情報システム）では、浸水区域、人口、施設などの位置情報をレイヤとして重ねられます。地域ごとの重なりを可視化することで、避難所が不足する区域などを検討できます。","category":"テクノロジ系","subcategory":"情報デザイン","topic":"GISレイヤによる地域データ可視化","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-etl-key-mismatch-1100","questionText":"ETL処理で顧客表と売上表を結合したところ、多数の売上行が結合できなかった。顧客表のキーは「00123」のような5桁文字列、売上表は「123」のような数値だった。対応として適切なものはどれですか。","choices":["結合できなかった売上行を削除し、原因は記録しない","キーの型と桁形式を統一し、結合前後の件数を検証する","顧客名だけで自動結合し、同姓同名は同一顧客として扱う","売上表のキーを乱数で置き換え、顧客表と再結合する"],"correctChoiceIndex":1,"explanation":"ETL（Extract, Transform, Load：抽出・変換・格納）では、結合キーの型やゼロ埋めなどの形式をそろえる必要があります。変換後に未結合件数や重複件数を確認すると、データ欠落や誤結合を検出できます。","category":"テクノロジ系","subcategory":"データベース","topic":"ETL時のキー形式不一致によるデータ欠落","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-technology-portfolio-balance-1101","questionText":"研究開発予算を配分する。技術Xは市場性が高いが成熟していて差別化余地が小さく、技術Yは市場性と技術リスクが中程度、技術Zは成長性が高いが実用化リスクも高い。技術ポートフォリオの考え方として最も適切なものはどれですか。","choices":["短期収益を支える技術X、育成する技術Y、探索する技術Zへ役割に応じて配分する","市場性だけを基準にして、技術リスクにかかわらず技術Zへ全額を配分する","成熟度だけを基準にして、将来性にかかわらず技術Xへの投資を直ちに停止する","三つの技術の違いを考慮せず、毎年同額を機械的に配分する"],"correctChoiceIndex":0,"explanation":"技術ポートフォリオでは、市場性、技術の成熟度、実用化リスク、戦略上の役割を組み合わせて資源を配分します。短期の収益源、育成領域、将来に向けた探索領域を分けることで、一つの評価軸への偏りを避けられます。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"技術ポートフォリオによる資源配分","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-technology-lifecycle-investment-1102","questionText":"自社の主力技術は市場が成熟して価格競争が進む一方、後継技術は導入期で顧客要求がまだ固まっていない。この状況での投資判断として最も適切なものはどれですか。","choices":["主力技術だけへ投資を集中し、後継技術の調査を終了する","主力技術の効率化を進めつつ、後継技術は小規模検証で市場と技術の不確実性を確かめる","後継技術へ直ちに全面移行し、主力技術の顧客支援を終了する","二つの技術の市場段階を区別せず、同じ評価基準だけで投資額を決める"],"correctChoiceIndex":1,"explanation":"技術ライフサイクルの段階により、適切な投資目的は異なります。成熟した技術では効率化や収益維持を図り、導入期の技術では小規模な検証を通じて市場性や実現性を確認するなど、段階に応じた管理が必要です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"技術成熟度に応じた投資判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-technology-transfer-scope-1103","questionText":"大学が開発した製造技術を企業へ移転し、企業が量産化する。移転契約を検討するとき、事業開始後の行き違いを減らす対応として最も適切なものはどれですか。","choices":["特許番号だけを記載し、未文書化の製造ノウハウや技術支援は契約対象から外す","利用料だけを定め、利用できる製品分野や地域は企業が後から自由に決める","利用権の範囲、提供するノウハウ、技術支援、改良成果の扱いを明確にする","量産の成否を保証する代わりに、企業側での検証や習熟を不要とする"],"correctChoiceIndex":2,"explanation":"技術移転では、特許などの権利だけでなく、実施に必要なノウハウ、教育や技術支援、利用できる分野・地域、改良成果の扱いを明確にします。移転先にも量産条件の検証や技術習熟が必要です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"技術移転時の知財・ノウハウ範囲","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-core-technology-make-partner-1104","questionText":"新製品の中核アルゴリズムは競争力の源泉だが、自社だけで開発すると発売が遅れる。外部企業には補完技術と開発実績がある。判断として最も適切なものはどれですか。","choices":["最安値だけで全開発を外部委託し、中核知識の社内蓄積は評価しない","発売速度だけを優先し、中核技術の権利や改良成果の帰属は契約後に決める","知識流出を避けるため補完技術も含め全て内製し、市場投入時期は考慮しない","中核設計と重要知識は社内に保持し、補完領域は権利と役割を定めて外部連携する"],"correctChoiceIndex":3,"explanation":"内製か外部連携かは、費用だけでなく、差別化に必要な知識の蓄積、市場投入速度、社内能力、知的財産、供給リスクを比較して決めます。中核知識を保持しつつ補完領域で外部の強みを使う分担も選択肢です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"コア技術の内製・外部連携判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-poc-pov-difference-1105","questionText":"画像認識技術を店舗業務へ導入する前に、最初は必要精度を達成できるかを試し、その後は導入によって作業時間や誤りがどれだけ減るかを確かめる。この二つの検証の説明として適切なものはどれですか。","choices":["前者はPoCで技術的実現性を、後者はPoVで業務上の価値を検証する","前者では費用対効果を確定し、後者では画像認識の精度だけを確認する","前者も後者もPoCとして扱い、技術的実現性だけを評価する","前者も後者もPoVとして扱い、導入後の業務効果だけを評価する"],"correctChoiceIndex":0,"explanation":"PoC（Proof of Concept：概念実証）は、技術や構想が実現可能かを小規模に確かめます。PoV（Proof of Value：価値実証）は、利用によって業務効果や顧客価値を得られるかを確かめます。目的を分けて評価することが重要です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"PoCとPoVの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-backcasting-tech-plan-1106","questionText":"企業が2035年に製品の製造時排出量を半減する目標を定めた。バックキャスティングによる技術開発計画として最も適切なものはどれですか。","choices":["現在保有する技術だけを一覧にし、目標達成時期は各部門へ任せる","2035年の必要状態から逆算し、必要技術、検証時期、設備更新時期を中間目標へ落とす","過去の改善率をそのまま延長し、目標との差が残っても計画を変更しない","短期利益が最大のテーマだけを選び、将来目標との関連は評価しない"],"correctChoiceIndex":1,"explanation":"バックキャスティングは、将来実現したい状態を先に定め、そこから現在へ逆算して必要な技術、制度、投資時期を計画する方法です。現在の延長だけでは達成できない大きな目標の道筋を考えるのに適しています。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"バックキャスティングによる技術開発計画","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-chasm-market-expansion-1107","questionText":"新しい業務支援サービスは先進的な利用者から高評価を得たが、一般企業には導入実績、既存システムとの連携、安定した支援体制を求められ、販売が伸びない。次の対応として最も適切なものはどれですか。","choices":["先進利用者向けの高度な個別機能を増やし、同じ顧客層での販売を深める","主流市場の利用条件を調べる前に、値下げだけで全業種へ一斉に販売する","対象業種を定めず、汎用的な機能説明だけで幅広い市場へ訴求する","対象業種を絞って導入事例、連携手順、支援体制を整え、主流市場の不安を減らす"],"correctChoiceIndex":3,"explanation":"キャズムは、初期の採用者から主流市場へ広げる段階にある隔たりです。主流市場では、革新性だけでなく、導入実績、既存環境との適合、運用支援などが重視されます。対象を絞り、安心して採用できる条件を整えることが有効です。","category":"ストラテジ系","subcategory":"技術戦略マネジメント","topic":"キャズムを越える市場拡大判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-ea-business-system-alignment-1108","questionText":"部門ごとに顧客区分とシステムが異なり、同じ顧客を全社で把握できない。EAを適用した対応として最も適切なものはどれですか。","choices":["各部門が独自の顧客定義を維持したまま、画面の色だけを統一する","最も新しい部門システムだけを調査し、他部門とのデータ関係は対象外にする","全社の業務・データ・アプリケーション・技術の現状と目標像を整理し、移行計画を作る","各システムを同時に廃止し、業務要件を確認せず一つの製品へ置き換える"],"correctChoiceIndex":2,"explanation":"EA（Enterprise Architecture：エンタープライズアーキテクチャ）は、組織全体の業務、データ、アプリケーション、技術を体系的に整理し、現状から目標像への移行を計画します。部門単位の変更だけでなく全体の整合を図ります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"EAによる業務とシステムの整合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-sor-soe-selection-1109","questionText":"会計取引は正確な記録と統制を重視し、顧客向けキャンペーン画面は反応を見ながら短期間で改善したい。SoRとSoEの使い分けとして適切なものはどれですか。","choices":["会計取引をSoR、顧客向け画面をSoEとして、求める安定性と変更速度を分ける","会計取引をSoE、顧客向け画面をSoRとして、記録の正確性を画面側だけで確保する","両方をSoRとして扱い、顧客向け画面の変更も会計処理と同じ周期に固定する","両方をSoEとして扱い、会計記録も試行のたびに形式を変更する"],"correctChoiceIndex":0,"explanation":"SoR（System of Record：記録のためのシステム）は正確性、整合性、安定運用を重視します。SoE（System of Engagement：顧客や利用者との関係を深めるシステム）は利用者との接点や迅速な改善を重視します。目的に応じた使い分けが必要です。","category":"ストラテジ系","subcategory":"システム戦略","topic":"SoRとSoEの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-bpr-bpm-selection-1110","questionText":"受注から出荷までが部門ごとに分断され、大幅な納期短縮には役割と手順の再設計が必要である。再設計後も実績を測定して改善を続けたい。対応として最も適切なものはどれですか。","choices":["現行手順を維持し、BPMで画面操作の回数だけを継続測定する","BPRで部門横断の流れを抜本的に再設計し、その後BPMで測定と改善を続ける","BPMで業務を一度だけ全面廃止し、BPRで日々の小さな改善だけを行う","BPRとBPMを使わず、各部門の処理時間を個別に短くするだけにする"],"correctChoiceIndex":1,"explanation":"BPR（Business Process Re-engineering：業務プロセス再設計）は、業務を目的から抜本的に見直します。BPM（Business Process Management：業務プロセス管理）は、設計した業務を測定しながら継続的に改善します。両者は段階に応じて組み合わせられます。","category":"ストラテジ系","subcategory":"システム戦略","topic":"BPRとBPMの使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-legacy-phased-migration-1111","questionText":"顧客管理システムを地域ごとに段階移行している。移行済み地域は新システム、未移行地域は旧システムを使うが、両方で顧客情報が更新され不一致が発生した。優先すべき対応はどれですか。","choices":["不一致を許容し、全地域の移行完了後まで顧客情報を照合しない","更新件数を減らすため、移行期間中は顧客情報の変更を全て禁止する","正となるデータと更新経路を定め、同期結果の照合と例外処理を実施する","新旧システムの更新日時を削除し、どちらが新しい情報か分からなくする"],"correctChoiceIndex":2,"explanation":"段階移行で新旧システムが併存すると、二重更新や同期遅延による不整合が起こり得ます。正となるデータ、更新できる経路、同期方式、照合方法、例外時の修正手順を明確にする必要があります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"レガシーシステムの段階移行とデータ同期","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-system-consolidation-overlap-1112","questionText":"合併後、二つの部門が顧客管理、請求、商品管理について別々のシステムを利用している。統廃合の優先順位を決める調査として最も適切なものはどれですか。","choices":["利用者画面だけを共通化し、背後の重複機能とデータは維持する","維持費が高いシステムを先に廃止し、固有機能や連携先は移行後に確認する","導入年が古いシステムから統合し、法的な保存要件は別途対応する","業務機能、保有データ、連携先、維持費を可視化し、重複と固有要件を比較する"],"correctChoiceIndex":3,"explanation":"システム統廃合では、機能やデータの重複、固有業務、外部連携、維持費、移行リスクを把握します。導入年や台数だけでは、廃止できない機能や重要な連携を見落とす可能性があります。","category":"ストラテジ系","subcategory":"システム戦略","topic":"重複機能・データに基づくシステム統廃合","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-local-global-optimization-1113","questionText":"営業部が入力時間を短縮するため受注時の在庫確認を省いたところ、倉庫では欠品確認と顧客への再連絡が増え、全社の受注処理時間が長くなった。改善方針として最も適切なものはどれですか。","choices":["部門別の入力時間だけでなく、受注から出荷までの全体指標で業務とシステムを見直す","営業部の入力時間だけをさらに短縮し、倉庫で増えた作業は別問題として扱う","倉庫の確認件数だけを減らすため、欠品情報を営業部へ通知しない","部門間の影響を測定せず、各部門が独立して同じKPIを最大化する"],"correctChoiceIndex":0,"explanation":"部分最適が全体の効率を悪化させる場合があります。KPI（Key Performance Indicator：重要業績評価指標）は部門内だけでなく、顧客への提供価値や業務全体のリードタイムなど、全体最適につながる指標と合わせて評価します。","category":"ストラテジ系","subcategory":"システム戦略","topic":"部分最適と全体最適の判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-migration-entry-criteria-1114","questionText":"新システムへの本番移行を開始する条件として最も適切なものはどれですか。","choices":["移行対象データの突合、手順の確認、担当者配置、切戻し準備が完了している","開発担当者が完成したと判断すれば、データ突合前でも移行を開始する","切戻し手順は障害発生後に作成し、開始時点では準備しない","利用部門への連絡を省き、移行中に影響範囲を調べる"],"correctChoiceIndex":1,"explanation":"本番移行の開始条件には、データの件数・金額などの突合、移行手順と所要時間の確認、担当者や連絡体制、切戻し条件と手順の準備などを含めます。開始前に判定できる具体的な条件にすることが重要です。","category":"ストラテジ系","subcategory":"システム企画","topic":"移行開始条件の設定","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-weighted-proposal-score-1115","questionText":"二社の提案を、機能50%、運用30%、費用20%の重みで評価する。各項目の100点満点の得点が、A社は80、90、70、B社は90、70、80である。重み付き総合点の比較として正しいものはどれですか。","choices":["A社は80点、B社は80点で同点","A社は83点、B社は79点でA社が高い","A社は81点、B社は82点でB社が高い","A社は240点、B社は240点で同点"],"correctChoiceIndex":2,"explanation":"A社は80×0.5＋90×0.3＋70×0.2＝40＋27＋14＝81点です。B社は90×0.5＋70×0.3＋80×0.2＝45＋21＋16＝82点です。RFP（Request for Proposal：提案依頼書）への提案は、事前に定めた評価項目と重みで比較します。","category":"ストラテジ系","subcategory":"システム企画","topic":"重み付き提案評価の計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"strategy-nonfunctional-acceptance-criteria-1116","questionText":"オンライン申請システムの性能に関する受入条件として、最も適切なものはどれですか。","choices":["利用者が多いときも、できるだけ高速に画面を表示する","担当者が満足できる程度に、短い時間で処理を終える","将来必要になった場合は、十分な性能へ改善できるようにする","同時接続500人で、申請確定操作の95%を3秒以内に完了する"],"correctChoiceIndex":3,"explanation":"受入条件は合否を客観的に判断できる必要があります。同時接続数、対象操作、応答時間、達成割合のように、試験条件と測定値を具体化すると、非機能要件を検証できます。","category":"ストラテジ系","subcategory":"システム企画","topic":"測定可能な非機能受入条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-technology-decision-log-1117","questionText":"プロジェクトでデータベース製品を選定した後、半年後に利用条件が変わり再検討が必要になった。以前の判断を効率よく見直すため、選定時に残す記録として最も適切なものはどれですか。","choices":["候補、評価基準、前提条件、トレードオフ、採用理由を関連付けて記録する","採用製品名だけを記録し、比較した候補や前提条件は削除する","会議参加者の氏名だけを記録し、判断内容は口頭で引き継ぐ","選定後の変更を避けるため、利用条件が変わっても記録を参照しない"],"correctChoiceIndex":0,"explanation":"技術選定の決定記録には、候補、評価基準、制約、前提、トレードオフ、採用理由を残します。後で条件が変わったときに、どの判断を再評価すべきか追跡しやすくなります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"技術選定の前提・トレードオフ記録","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-pilot-go-no-go-gate-1118","questionText":"新しい倉庫システムを一拠点で試行した。処理速度は目標を満たしたが、棚卸差異率が許容値を超え、障害時の運用手順も未確認である。本格展開の判断として最も適切なものはどれですか。","choices":["処理速度を満たしたので、他の基準に関係なく全拠点へ展開する","事前の合格基準を満たしていない項目を是正・再確認してからGo/No-Goを判定する","棚卸差異率の基準を試行後に削除し、処理速度だけで合格とする","本格展開を開始し、障害時の運用手順は問題が起きた後に作成する"],"correctChoiceIndex":1,"explanation":"Go/No-Go判定では、技術性能だけでなく、業務品質、運用準備、リスクなど事前に定めた複数の基準を確認します。未達項目があれば、是正や再試験、条件付き延期などを判断します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"パイロット導入のGo/No-Go判定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-phased-rollout-risk-1119","questionText":"新しい受発注機能を全国200店舗へ導入する。業務停止の影響を抑え、初期導入で得た問題を後続店舗へ反映したい。適切な導入方法はどれですか。","choices":["全店舗へ同時導入し、問題があっても全店舗で同じ手順を継続する","店舗ごとに異なる仕様を採用し、導入後の知見を共有しない","代表店舗から段階導入し、評価結果を確認して次の展開範囲を広げる","最終店舗への導入が終わるまで、初期店舗で起きた問題を修正しない"],"correctChoiceIndex":2,"explanation":"段階導入では、対象を限定して影響範囲を抑え、得られた知見を次の展開へ反映できます。各段階の評価基準、停止条件、切戻し方法を事前に定めることも重要です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"段階導入による影響範囲の限定","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-architecture-change-impact-1120","questionText":"開発途中で認証基盤を別製品へ変更する案が出た。ログイン画面だけを修正すればよいと見積もったが、結合試験で複数システムの接続障害が発生した。再発防止として最も適切なものはどれですか。","choices":["認証基盤の変更は画面変更として扱い、接続先一覧は作成しない","変更後の不具合だけを記録し、設計や試験範囲は変更しない","影響を減らすため、各システムの担当者へ変更内容を知らせない","インタフェース、権限、監視、試験、移行への依存関係を事前に分析する"],"correctChoiceIndex":3,"explanation":"共通基盤の変更は、接続方式、権限、データ、監視、運用、試験など複数領域へ波及します。変更前に依存関係を洗い出し、日程・費用・品質・リスクへの影響を評価する必要があります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"技術変更の依存関係・影響分析","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-vendor-demo-evaluation-1121","questionText":"複数ベンダの製品デモを比較する。説明の巧拙ではなく、自社業務への適合度を公平に評価する方法として最も適切なものはどれですか。","choices":["同じ業務シナリオ、データ、確認項目、採点基準を各ベンダへ提示する","各ベンダに得意な機能だけを自由に実演してもらい、印象だけで採点する","最初に説明したベンダを基準にし、後のベンダには異なる課題を提示する","価格情報だけを確認し、業務手順や運用条件は評価対象から外す"],"correctChoiceIndex":0,"explanation":"ベンダデモは、実際の業務に近い共通シナリオやデータを使い、同じ確認項目と採点基準で比較します。操作性、例外処理、運用性なども具体的に確認すると、説明の印象だけに左右されにくくなります。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"共通シナリオによるベンダデモ評価","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-cutover-rehearsal-1122","questionText":"本番移行のリハーサルで、データ移行が予定時間を超え、突合結果にも差異が出た。切戻し可能な時刻まで残りわずかである。本番移行に向けた判断として最も適切なものはどれですか。","choices":["本番では速くなると仮定し、差異の原因を調べず予定どおり移行する","開始・中止条件に照らして移行を見送り、原因修正後に再リハーサルする","切戻し期限を過ぎても作業を続け、完了しなければその時点で対応を考える","差異のあるデータを削除し、突合件数を減らして合格扱いにする"],"correctChoiceIndex":1,"explanation":"移行リハーサルは、手順、所要時間、データ整合性、連絡体制、切戻しが機能するかを確認するものです。事前条件を満たさない場合は、原因を是正して再確認し、本番で回復不能な状態になることを防ぎます。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"移行リハーサルでの切戻し条件確認","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-operations-handover-readiness-1123","questionText":"開発チームから運用チームへ新サービスを引き渡す前の確認として最も適切なものはどれですか。","choices":["ソースコードが保存されていれば、監視や障害対応の準備は不要とする","運用担当者の教育は初回障害の発生後に行う","監視、操作手順、連絡先、権限、既知の問題を確認し、運用担当者が実施できる状態にする","開発担当者だけが操作できる状態で引き渡し、権限移管は行わない"],"correctChoiceIndex":2,"explanation":"運用移管では、監視項目、定常作業、障害時手順、連絡・エスカレーション、必要権限、既知の問題を共有し、教育や引継ぎ確認を行います。文書があるだけでなく、運用側が実施できることが重要です。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"運用移管の準備完了条件","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-pilot-throughput-scale-1124","questionText":"パイロット環境では同性能のサーバ3台を平均60%の負荷で動かし、全体で毎秒360件を処理できた。本番では毎秒1,000件を、1台当たり75%以下の負荷で処理したい。処理能力が負荷に比例するとき、必要なサーバは最低何台ですか。","choices":["5台","6台","8台","7台"],"correctChoiceIndex":3,"explanation":"1台を100%で動かした処理能力は、360÷3÷0.6＝毎秒200件です。75%で使うと1台当たり200×0.75＝毎秒150件です。1,000÷150＝6.67なので、端数を切り上げて最低7台必要です。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"パイロット結果からの処理能力見積り","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-early-life-support-1125","questionText":"新サービスの本番移行直後に、開発・運用・利用部門が通常より手厚い監視と迅速な障害対応を行う期間を設ける主な目的はどれですか。","choices":["初期の不具合や問合せを早期に安定化し、通常運用へ安全に移す","移行前の設計レビューを代替し、本番移行後は試験を行わないようにする","通常のサービスデスクを廃止し、開発チームへ恒久的に問合せを集約する","期間中の対応速度を優先し、問題分類や通常運用への引継ぎを省略する"],"correctChoiceIndex":0,"explanation":"移行直後の重点支援期間では、初期障害や利用者からの問合せを迅速に処理し、傾向を監視してサービスを安定させます。終了条件を確認した上で、通常の運用体制へ引き継ぎます。","category":"マネジメント系","subcategory":"サービスマネジメント","topic":"移行直後の早期ライフサポート","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-quality-gate-entry-exit-1126","questionText":"品質ゲートにおけるentry条件とexit条件の説明として適切なものはどれですか。","choices":["entry条件は工程の完了可否を、exit条件は工程の開始可否を判定する","entry条件は工程を開始できる状態か、exit条件は成果が基準を満たして次へ進めるかを判定する","entry条件は費用だけを、exit条件は担当者数だけを判定する","entry条件とexit条件はどちらも、工程開始後には確認しない"],"correctChoiceIndex":1,"explanation":"entry条件は、必要な入力成果物や環境がそろい、その工程を開始できるかを判定する条件です。exit条件は、工程の成果物や品質が基準を満たし、次の工程へ進めるかを判定します。","category":"マネジメント系","subcategory":"ソフトウェア開発管理技術","topic":"品質ゲートの開始条件と完了条件","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"management-single-vendor-dependency-risk-1127","questionText":"重要システムで一社独自の技術を採用する提案がある。高性能だが、他社へ移行するための仕様やデータ出力方法が不明である。導入前の対応として最も適切なものはどれですか。","choices":["性能だけで採用を決めず、データ移行、技術資料、契約終了時の支援、代替手段を確認する","一社が提供を続けると仮定し、サービス終了や価格変更のリスクは評価しない","移行方法を確認すると導入が遅れるため、本番稼働後まで契約条件を確認しない","依存を避けるため、独自技術の利点や代替案を比較せず提案を却下する"],"correctChoiceIndex":0,"explanation":"単一ベンダへの依存には、価格変更、サービス終了、技術者不足、移行困難などのリスクがあります。性能上の利点と合わせて、標準形式でのデータ取得、資料、契約終了時の支援、代替手段を確認します。","category":"マネジメント系","subcategory":"プロジェクトマネジメント","topic":"単一ベンダ依存の導入リスク","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-host-hypervisor-virtualization-1128","questionText":"ホスト型仮想化とハイパーバイザ型仮想化の比較として適切なものはどれですか。","choices":["ホスト型は物理サーバへ直接導入し、ハイパーバイザ型は必ずデスクトップOS上で動く","ホスト型は既存OS上で利用しやすく、ハイパーバイザ型は物理資源を直接管理してサーバ集約に向く","ホスト型だけが複数OSを実行でき、ハイパーバイザ型では一つのOSしか実行できない","両方式は実装層が同じで、管理性や性能に違いはない"],"correctChoiceIndex":1,"explanation":"ホスト型はWindowsなど既存のホストOS上で仮想化ソフトウェアを動かすため、試験環境などへ導入しやすい方式です。ハイパーバイザ型は物理資源を直接管理し、一般にサーバ集約や集中管理に向きます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ホスト型とハイパーバイザ型の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-vm-container-selection-1129","questionText":"互いに異なるOSを必要とする既存アプリと、同じOS上で短時間に多数起動したい小規模サービスを動かす。仮想マシンとコンテナの使い分けとして適切なものはどれですか。","choices":["両方ともコンテナにし、ホストと異なるOSカーネルもそのまま実行する","両方とも仮想マシンにし、起動時間や資源効率は比較しない","異なるOSが必要な既存アプリは仮想マシン、軽量な小規模サービスはコンテナを検討する","異なるOSが必要な既存アプリはコンテナ、小規模サービスは物理サーバ専用にする"],"correctChoiceIndex":2,"explanation":"VM（Virtual Machine：仮想マシン）は独立したゲストOSを持てるため、OS単位の分離に向きます。コンテナはホストOSのカーネルを共有し、一般に軽量で素早く起動できます。必要な分離と運用条件で選びます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"仮想マシンとコンテナの選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-vdi-central-management-1130","questionText":"VDIを導入して利用者のデスクトップ環境をデータセンタ側で実行する主な利点はどれですか。","choices":["各端末で別々に業務データを保管し、管理者から端末状態を確認できなくする","利用者ごとに異なるネットワーク規格を採用し、接続管理を不要にする","端末へ全ての業務処理を固定し、サーバ側の管理を行わない","デスクトップ環境や業務データを集中管理し、端末交換時の環境移行を容易にする"],"correctChoiceIndex":3,"explanation":"VDI（Virtual Desktop Infrastructure：仮想デスクトップ基盤）は、サーバ側でデスクトップ環境を実行して利用者へ画面などを転送します。環境やデータを集中管理しやすくなりますが、通信やサーバ容量の設計も必要です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"VDIによるデスクトップの集中管理","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-live-migration-maintenance-1131","questionText":"仮想マシンを動かしている物理サーバを保守する。サービス停止を抑えながら別の物理サーバへ実行状態を移したい。適した機能はどれですか。","choices":["ライブマイグレーションを使い、稼働状態を保ちながら移動する","コールドマイグレーションを使い、仮想マシンを停止してから移動する","バックアップから別サーバへ復元し、復元完了後にサービスを再開する","接続先名だけを別サーバへ切り替え、実行中の仮想マシンは移動しない"],"correctChoiceIndex":0,"explanation":"ライブマイグレーションは、稼働中の仮想マシンの状態を別の物理サーバへ移し、保守や負荷分散による停止を抑える機能です。共有ストレージやネットワークなど、利用する製品の移行条件も確認します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ライブマイグレーションによる保守","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-cloud-service-responsibility-1132","questionText":"利用企業が業務アプリのプログラムとデータを管理したいが、OSや実行基盤の保守はクラウド事業者へ任せたい。選択するサービス形態として最も適切なものはどれですか。","choices":["IaaSを選び、利用企業がOS、実行基盤、アプリを全て管理する","PaaSを選び、利用企業は主にアプリとデータを管理する","SaaSを選び、利用企業が提供アプリのプログラムを自由に置き換える","オンプレミスを選び、クラウド事業者へOS保守を任せる"],"correctChoiceIndex":1,"explanation":"PaaS（Platform as a Service）はOSや実行基盤を事業者が管理し、利用者は主にアプリケーションとデータを管理します。IaaS（Infrastructure as a Service）はOS管理も利用者側、SaaS（Software as a Service）は完成したアプリを利用する形態です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"SaaS・PaaS・IaaSの管理責任と選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-hybrid-cloud-data-placement-1133","questionText":"機密性の高い設計データは自社管理環境に置きたい一方、公開済み製品画像の変換処理は繁忙期だけ急増する。ハイブリッドクラウドの利用として最も適切なものはどれですか。","choices":["設計データと公開画像を区別せず、全て同じ公開領域へ保存する","変換処理のピークに合わせ、自社設備だけを常に最大構成で保有する","設計データは管理要件を満たす自社環境に置き、画像変換は伸縮可能なクラウドを使う","公開画像も含めて外部との接続を禁止し、需要変動への対応を行わない"],"correctChoiceIndex":2,"explanation":"ハイブリッドクラウドでは、オンプレミスやプライベートクラウドとパブリッククラウドを要件に応じて組み合わせます。機密性、遅延、法令、負荷変動、運用費などを基に、データと処理の配置を決めます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ハイブリッドクラウドのデータ配置判断","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-multicloud-tradeoff-1134","questionText":"二つのクラウド事業者を利用して障害や契約変更への依存を減らしたが、監視方法や権限管理が事業者ごとに異なり運用負荷が増えた。対応として最も適切なものはどれですか。","choices":["利用先を増やせば運用差はなくなるため、共通管理方法は検討しない","障害対策になるので、アプリやデータを移せるかは確認しない","権限や監視の違いを残したまま、担当者の記憶だけで運用する","依存低減の効果と運用複雑性を評価し、共通監視・権限方針・移行手順を整える"],"correctChoiceIndex":3,"explanation":"マルチクラウドは、複数のクラウドを目的に応じて利用する構成です。依存や障害リスクを分散できる一方、監視、権限、ネットワーク、費用、技術者育成が複雑になります。効果と追加負担を合わせて評価します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"マルチクラウドの可搬性と運用複雑性","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-object-storage-selection-1135","questionText":"大量の画像と動画を、データごとの識別子や撮影場所などのメタデータとともに保存し、APIから参照したい。適した記憶方式はどれですか。","choices":["オブジェクトストレージ","CPUのレジスタ","仮想記憶のページファイル","データベースのトランザクションログ"],"correctChoiceIndex":0,"explanation":"オブジェクトストレージは、データ本体を識別子やメタデータと一体で管理し、API（Application Programming Interface：アプリケーションプログラミングインタフェース）から利用できます。大量の画像、動画、バックアップなどに向きます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"大量の非構造化データに対するオブジェクトストレージ選択","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-edge-offline-operation-1136","questionText":"工場設備はクラウドで分析しているが、外部回線が切れると安全制御まで停止する問題が発生した。改善策として最も適切なものはどれですか。","choices":["外部回線を二重化するが、安全判定は引き続きクラウドだけで実行する","安全に必要な判定はエッジ側でも実行し、接続回復後にクラウドとデータを同期する","回線断中はセンサ値を保存するが、安全判定と設備制御は接続回復まで停止する","直前のクラウド制御命令をエッジ側で繰り返し、現在のセンサ値は判定に使わない"],"correctChoiceIndex":1,"explanation":"エッジコンピューティングでは、データ発生源に近い場所で必要な処理を行えます。安全制御など即時性と継続性が必要な処理をエッジ側へ置き、クラウドは高度な分析や全体管理に使う構成が考えられます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"クラウド断時のエッジ継続動作","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-mqtt-intermittent-network-1137","questionText":"低速で一時的に切断する無線回線を使い、多数のセンサが温度データを話題別に配信し、複数の監視サービスが購読する。適した通信方式はどれですか。","choices":["各センサをHTTPで定期的に照会し、応答があるまで接続を維持する方式","各センサが一定時間分をファイルにまとめ、FTPで一括転送する方式","軽量な発行・購読型のMQTTを使う方式","各センサが測定のたびにSMTPで監視先へメール送信する方式"],"correctChoiceIndex":2,"explanation":"MQTT（Message Queuing Telemetry Transport）は、軽量な発行・購読型の通信プロトコルです。帯域や電力が限られるIoT（Internet of Things：モノのインターネット）機器で、送信側と受信側を疎結合にできます。","category":"テクノロジ系","subcategory":"ネットワーク","topic":"不安定な通信環境でのMQTT適用","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-iot-gateway-role-1138","questionText":"工場内の複数センサが異なる近距離通信方式を使っている。これらのデータを集約し、クラウドで扱える通信方式へ変換する装置の役割はどれですか。","choices":["物理量を測定して電気信号へ変えるセンサの役割","制御信号を受けてバルブを動かすアクチュエータの役割","クラウド上で売上データだけを集計する表計算ソフトの役割","機器の通信を集約・変換し、上位システムとの接続を仲介するIoTゲートウェイの役割"],"correctChoiceIndex":3,"explanation":"IoT（Internet of Things：モノのインターネット）ゲートウェイは、現場機器のデータを集約し、通信プロトコルの変換、前処理、接続管理などを行って上位システムとの通信を仲介します。センサやアクチュエータとは役割が異なります。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"IoTゲートウェイの集約・プロトコル変換","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-scaling-workload-pattern-1139","questionText":"Web要求は複数サーバへ分散できるが、月次集計は一つの処理が大量のメモリを必要とし分割しにくい。それぞれの増強方法として適切なものはどれですか。","choices":["Web要求はスケールアウトし、月次集計はスケールアップを検討する","Web要求は一台の性能だけを上げ、月次集計は同じ処理を複数台で重複実行する","両方とも必ずスケールアウトし、処理を分割できるかは確認しない","両方とも必ずスケールアップし、Web要求の分散可能性は利用しない"],"correctChoiceIndex":0,"explanation":"スケールアウトは台数を増やして並列処理しやすい負荷に向きます。スケールアップは一台のCPUやメモリを強化するため、分割しにくく単一処理の資源要求が大きい場合の候補になります。処理特性に応じて選びます。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"処理特性に応じたスケールアップ・アウト選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-load-balancer-health-check-1140","questionText":"Webサーバ3台のうち1台でアプリが停止したが、ロードバランサはそのサーバへ要求を送り続け、一部利用者だけエラーになった。最も可能性が高い原因はどれですか。","choices":["セッション固定により、正常な一台へ利用者が偏って応答が遅くなった","アプリの正常性を確認するヘルスチェックが不適切で、障害サーバを振分け先から外せなかった","分散方式を最少接続数からラウンドロビンへ変更し、正常な三台へ均等に振り分けた","ロードバランサへの名前解決結果が端末に残り、同じロードバランサへ接続していた"],"correctChoiceIndex":1,"explanation":"ロードバランサはヘルスチェックでサーバの正常性を確認し、異常なサーバを振分け先から外します。ポートが開いているかだけでなく、アプリが正常応答するかを確認するなど、障害を検出できる設定が必要です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ヘルスチェック不備による障害サーバへの振分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-hot-cold-standby-rto-1141","questionText":"業務システムは障害後5分以内の再開が必要で、待機系には本番データを継続同期できる。一方、予備機の起動とデータ復元に数時間かかる方式では要件を満たせない。適切な構成はどれですか。","choices":["予備機を停止したまま保管し、障害後にOSから構築する","障害時に新しい機器を発注し、到着後にバックアップから復元する","稼働準備済みのホットスタンバイを用意し、短時間で切り替えられるようにする","待機系を設けず、障害原因の調査が終わるまでサービスを停止する"],"correctChoiceIndex":2,"explanation":"RTO（Recovery Time Objective：目標復旧時間）が短い場合は、稼働準備ができたホットスタンバイなどが候補です。コールドスタンバイは費用を抑えやすい一方、起動や復元に時間がかかるため、復旧要件と費用を比較します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"RTO制約に応じた待機系方式の選択","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-parallel-availability-calc-1142","questionText":"独立して故障する稼働率90%のサーバ2台を並列化し、少なくとも1台が動けば処理できる。さらに、この並列部分と稼働率98%の共有ネットワークの両方が必要である。全体の稼働率は何%ですか。","choices":["88.20%","90.00%","99.00%","97.02%"],"correctChoiceIndex":3,"explanation":"各サーバの停止率は10%です。2台が同時に停止する確率は0.1×0.1＝0.01なので、並列部分の稼働率は1－0.01＝0.99です。共有ネットワークとは直列の関係になるため、全体は0.99×0.98＝0.9702、つまり97.02%です。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"並列冗長構成の可用性計算","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-availability-improvement-calc-1143","questionText":"現在の装置はMTBFが500時間、MTTRが10時間である。案AはMTBFを1,000時間にしてMTTRを10時間のままとし、案BはMTBFを500時間のままMTTRを4時間にする。可用性をMTBF÷（MTBF＋MTTR）で求めるとき、比較として正しいものはどれですか。","choices":["案Bは約99.21%、案Aは約99.01%なので、案Bの方が高い","案Aは約98.04%、案Bは約98.43%なので、案Bの方が高い","案Aは約99.50%、案Bは約99.96%なので、案Bの方が高い","案Aと案Bはどちらも約98.00%で同じ"],"correctChoiceIndex":0,"explanation":"案Aは1,000÷（1,000＋10）×100＝約99.01%です。案Bは500÷（500＋4）×100＝約99.21%なので案Bが高くなります。MTBF（Mean Time Between Failures：平均故障間隔）とMTTR（Mean Time To Repair：平均修復時間）の両方を式に入れて比較します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"MTBF・MTTR改善案の可用性比較","difficulty":3,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-peak-capacity-headroom-calc-1144","questionText":"ピーク時に毎秒2,500件の要求を処理する。サーバ1台の最大処理能力は毎秒600件だが、余裕を持たせて各サーバを最大能力の70%以下で使う。必要なサーバは最低何台ですか。","choices":["4台","6台","5台","7台"],"correctChoiceIndex":1,"explanation":"1台を70%以下で使う場合の処理能力は600×0.7＝毎秒420件です。2,500÷420＝約5.95なので、端数を切り上げて最低6台必要です。最大能力だけで計算せず、指定された余裕率を反映します。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"ピーク負荷と余裕率からの必要台数計算","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-backup-chain-failure-1145","questionText":"日曜にフルバックアップ、月曜から木曜まで毎日増分バックアップを取得した。水曜分の媒体だけが読めないとき、木曜終了時点への復元について適切な説明はどれですか。","choices":["木曜分には月曜からの変更が全て含まれるので、日曜分と木曜分だけで復元できる","水曜分を飛ばしても、日曜、月曜、火曜、木曜の順に適用すれば完全に復元できる","水曜分以降の増分連鎖が欠けるため、この一連の媒体だけでは木曜終了時点へ完全復元できない","増分バックアップは各日が独立しているので、木曜分だけで全データを復元できる"],"correctChoiceIndex":2,"explanation":"増分バックアップは直前のバックアップ以降の変更を保存します。木曜時点へ戻すには、日曜のフルと月曜から木曜までの増分が順に必要です。途中の水曜分が欠けると、それ以降の連鎖を完全には復元できません。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"増分バックアップ連鎖欠損時の復元判断","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-backup-restore-test-1146","questionText":"バックアップ処理は毎日「成功」と記録されているが、災害訓練で復元手順の不足が見つかり、目標時間内に復旧できなかった。改善策として最も適切なものはどれですか。","choices":["成功ログと媒体のチェックサムだけを確認し、復元操作は実際の障害時に行う","ファイルだけを復元し、データ整合性やアプリケーションの起動は確認しない","本番環境へ直接上書き復元し、業務への影響を含めて初めて手順を確認する","隔離した環境で定期的に復元し、データ整合性、手順、権限、所要時間を検証する"],"correctChoiceIndex":3,"explanation":"バックアップが取得できても、媒体破損、権限不足、手順漏れなどで復元できない場合があります。定期的な復元試験で、データの整合性、必要な手順と権限、目標復旧時間を満たせるかを確認します。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"バックアップの定期復元試験","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-sync-async-api-selection-1147","questionText":"注文受付は数秒以内に受付結果を返す必要があるが、その後の画像生成処理には数分かかる。API連携方式として最も適切なものはどれですか。","choices":["注文受付は同期的に結果を返し、画像生成はキューへ渡して非同期に処理する","注文受付と画像生成を一つの同期処理にし、画像完成後に受付結果を返す","注文受付も非同期にして受付結果を返さず、画像生成の完了だけを後から通知する","注文と画像生成を一定時間分まとめ、夜間バッチの完了後に受付結果を返す"],"correctChoiceIndex":0,"explanation":"API（Application Programming Interface：アプリケーションプログラミングインタフェース）の同期処理は、その場で必要な結果を返す処理に向きます。時間のかかる処理はキューなどへ渡して非同期化すると、受付応答を長時間待たせずに済みます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"同期・非同期API連携の使い分け","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-api-retry-idempotency-1148","questionText":"決済APIへの要求後に応答が届かず、呼出し側が同じ要求を再送することがある。二重決済を防ぐ設計として最も適切なものはどれですか。","choices":["再送のたびに新しい決済として処理し、重複は利用者が後から確認する","要求ごとの一意なキーを受け取り、同じキーの再送には同じ処理結果を返す","応答が遅い要求は全て成功とみなし、決済記録を作成しない","同じ金額の決済を一日一件に制限し、利用者や注文を区別しない"],"correctChoiceIndex":1,"explanation":"API（Application Programming Interface：アプリケーションプログラミングインタフェース）で一意な冪等キーを使うと、同じ要求の再送を識別できます。同じキーを再処理せず既存結果を返すことで、通信再試行による二重更新を防ぎます。","category":"テクノロジ系","subcategory":"ソフトウェア","topic":"タイムアウト再試行時の冪等性確保","difficulty":2,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-benchmark-workload-1149","questionText":"新しいサーバ候補をベンチマークで比較するとき、実運用での性能を予測しやすい試験条件はどれですか。","choices":["最も得意な一種類の処理だけを実行し、実運用の処理構成は確認しない","データ件数を常に最小にして、繁忙時の同時利用者数は再現しない","実運用に近いデータ量、処理の割合、同時利用者数で同じ試験を行う","候補ごとに異なる処理を実行し、測定時間と評価指標も変える"],"correctChoiceIndex":2,"explanation":"ベンチマークは、候補間で同じ条件を使い、実運用のデータ量、処理構成、同時利用者数などを反映することが重要です。実際とかけ離れた負荷では、測定値が高くても本番性能を適切に予測できません。","category":"テクノロジ系","subcategory":"システム構成要素","topic":"実運用を反映したベンチマーク条件","difficulty":1,"source":"IPA「ITパスポート試験シラバス Ver.6.5」準拠・独自作成","applicableYear":2026,"createdAt":"2026-09-22T00:00:00+09:00","updatedAt":"2026-09-22T00:00:00+09:00"},{"id":"technology-response-bottleneck-metric-1150","questionText":"業務画面の応答が遅い。原因がCPU、ディスク、ネットワークのどこにあるかを特定するための対応として最も適切なものはどれですか。","choices":["CPU使用率だけを測り、低ければCPU以外の測定を行わず原因不明とする","通信遅延だけを測り、正常ならアプリケーションやディスクを調査しない","画面の応答時間だけを測り、遅い時間帯の構成要素の状態は記録しない","同じ時間帯の応答時間、CPU使用率、ディスク待ち、通信遅延を対応付けて測定する"],"correctChoiceInde
